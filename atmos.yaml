# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-config/1.0/atmos-config.json
# Atmos CLI configuration - https://atmos.tools/cli/configuration
#
# Backend, provider and toolchain defaults live in the stack hierarchy
# (stacks/orgs/fnx/_defaults.yaml), not here.

base_path: "."

version:
  constraint:
    require: ">=1.229.0"
    enforcement: fatal
    message: "This repository requires Atmos >= 1.229.0 (CI runs the ghcr.io/cloudposse/atmos image pinned in .github/atmos-image/Dockerfile)."

components:
  terraform:
    base_path: components/terraform
    apply_auto_approve: false
    deploy_run_init: true
    auto_generate_backend_file: true
    init:
      reconfigure: auto
      # Never add -upgrade: provider versions come from the committed
      # .terraform.lock.hcl of each root module, which CI inits with
      # -lockfile=readonly (-upgrade conflicts with it). Bump them with
      # `atmos workflow providers-lock -f providers`.
      upgrade: never

stacks:
  base_path: stacks
  included_paths:
    - "orgs/**/*.yaml"
  excluded_paths:
    - "**/_defaults.yaml"
  # Cloud Posse's null-label id order, {tenant}-{environment}-{stage}, where
  # environment is the region code (mixins/region/*) and stage the account
  # tier: fnx-ue1-dev, fnx-ue1-staging, fnx-ue1-prod. A lane in a stage
  # (the fixtures, the local emulator stacks) adds settings.context.name:
  # fnx-ue1-fixtures-webapp. hasKey, not `with`: Atmos renders with
  # missingkey=error.
  name_template: '{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}{{ if hasKey .settings.context "name" }}-{{ .settings.context.name }}{{ end }}'

# Local AWS sandbox (Floci). Binds ONLY the fnx-ue1-local-sandbox stack, via that
# stack's `aws` emulator component — deliberately not `default: true`, so no
# real environment can ever be silently redirected at the emulator once real
# credentials exist. See stacks/catalog/emulator/aws.yaml.
auth:
  identities:
    local-aws:
      kind: aws/emulator
      emulator: fnx-ue1-local-sandbox/aws

    # Second local lane, pointed at LocalEmu (localemu.cloud) instead of Floci.
    # Atmos has no localemu driver, so this is deliberately NOT an
    # `aws/emulator` identity: it is a static-credential identity whose
    # endpoint_url happens to be an AWS-compatible API on localhost. LocalEmu
    # is started by hand, outside Atmos, via `atmos workflow localemu-up -f
    # localemu` (or the full `atmos workflow localemu -f localemu`, also run in
    # CI by .github/workflows/emulator.yml) - see the RUN IT AGAINST A FRESH
    # EMULATOR note in stacks/orgs/fnx/local/us-east-1/localemu.yaml for how
    # that workflow copes with LocalEmu not being idempotent across restarts.
    #
    # It exists for rds, which Floci cannot exercise at all (no
    # CreateDBSubnetGroup) and LocalEmu can. It does NOT rescue apigateway or
    # elasticache: both fail on LocalEmu too, for their own reasons - see the
    # header of stacks/orgs/fnx/local/us-east-1/localemu.yaml. The credentials
    # are the conventional local-emulator dummies and authenticate nothing;
    # they are read from the environment so no literal lands in git.
    local-emu:
      kind: aws/user
      credentials:
        access_key_id: !env LOCALEMU_ACCESS_KEY_ID
        secret_access_key: !env LOCALEMU_SECRET_ACCESS_KEY
        region: us-east-1
      spec:
        endpoint_url: http://localhost:4566

workflows:
  base_path: workflows

# `atmos sweep`: bind each stack's RESOLVED variables to its component and plan,
# with no AWS account (scripts/plan-sweep.sh; its header says what a PASS means).
# `terraform validate` never binds values, so it passes a component whose
# variable validations all fail. CI's Plan sweep job runs `atmos sweep --all`.
commands:
  - name: sweep
    description: >-
      Plan stack/component pairs against their resolved variables, with no AWS
      account. With no flag: every real stack and template fixture. -s: only
      these stacks. --samples: the templates/stacks samples. --scaffold: fresh
      stacks from the stack scaffold. --all: all three, in that order (CI).
      Exit status: 1 on a finding, 2 on a usage error or a missing or broken tool;
      Atmos's own flag and argument errors (e.g. an unknown flag) exit 1.
    verbose: false
    flags:
      - name: stack
        shorthand: s
        description: "Comma-separated stacks to sweep (default: every stack)"
        default: ""
      - name: samples
        type: bool
        default: false
        description: Sweep the templates/stacks samples (scripts/check-stack-samples.sh --sweep)
      - name: scaffold
        type: bool
        default: false
        description: Sweep fresh scaffold stacks (scripts/check-stack-scaffold.sh --sweep)
      - name: all
        type: bool
        default: false
        description: Sweep every stack, then the samples, then the scaffold stacks
    # validate-enhanced.yaml pins the same terraform. The sweep evaluates
    # each !terraform.state expression with yq, as Atmos does internally; it must
    # be mikefarah v4 (the script refuses anything else) and the image ships none.
    dependencies:
      tools:
        terraform: "1.16.3"
        mikefarah/yq: "v4.53.6"
    # Flag values reach the step only as environment variables, never as
    # templated shell text, and the guard below refuses any stack list outside
    # [a-z0-9-] names separated by commas before any script runs (the toolchain
    # installs first). The step runs in the invocation directory, so it first
    # moves to the repository root: from a subdirectory the scripts are not found.
    env:
      - key: SWEEP_STACKS
        value: "{{ .Flags.stack }}"
      - key: SWEEP_SAMPLES
        value: "{{ .Flags.samples }}"
      - key: SWEEP_SCAFFOLD
        value: "{{ .Flags.scaffold }}"
      - key: SWEEP_ALL
        value: "{{ .Flags.all }}"
    steps:
      - |
        set -eu
        if ! root=$(git rev-parse --show-toplevel); then
          echo "atmos sweep: not inside a git checkout (git rev-parse failed); run it in the repository." >&2
          exit 2
        fi
        cd "$root" || exit 2
        modes=0
        if [ -n "$SWEEP_STACKS" ]; then modes=$((modes + 1)); fi
        for m in "$SWEEP_SAMPLES" "$SWEEP_SCAFFOLD" "$SWEEP_ALL"; do
          if [ "$m" = true ]; then modes=$((modes + 1)); fi
        done
        if [ "$modes" -gt 1 ]; then
          echo "atmos sweep: -s, --samples, --scaffold and --all are exclusive; pass one." >&2
          exit 2
        fi
        case ",$SWEEP_STACKS," in
          *[!a-z0-9,-]* | *,,* | *,-*)
            if [ -n "$SWEEP_STACKS" ]; then
              printf 'atmos sweep: refusing -s %s: want stack names ([a-z0-9-]) separated by commas.\n' "'$SWEEP_STACKS'" >&2
              exit 2
            fi
            ;;
        esac
        if [ "$SWEEP_SAMPLES" = true ]; then
          bash scripts/check-stack-samples.sh --sweep
        elif [ "$SWEEP_SCAFFOLD" = true ]; then
          bash scripts/check-stack-scaffold.sh --sweep
        elif [ "$SWEEP_ALL" = true ]; then
          bash scripts/plan-sweep.sh
          bash scripts/check-stack-samples.sh --sweep
          bash scripts/check-stack-scaffold.sh --sweep
        else
          IFS=,
          set -f
          # shellcheck disable=SC2086 # split on commas only; globbing is off
          bash scripts/plan-sweep.sh $SWEEP_STACKS
        fi

logs:
  file: "/dev/stderr"
  level: Info

settings:
  list_merge_strategy: replace

# Native CI (GitHub Actions): job summaries, $GITHUB_OUTPUT variables,
# commit statuses and upserted PR plan comments. Inactive outside CI.
ci:
  enabled: true
  output:
    enabled: true
  summary:
    enabled: true
  checks:
    enabled: true
    context_prefix: atmos
  comments:
    enabled: true
    behavior: upsert

# Scaffold templates (EXPERIMENTAL in Atmos). All three generate with the
# repository root as the target, run from the root, so a single run can place
# files under both components/terraform/ and stacks/catalog/ (stacks/orgs/ for
# stack), and their hooks run at the root: Atmos 1.229 runs hooks in the
# invocation directory, 1.233 in the target directory, and `.` makes them equal.
# The root is non-empty, so --force is required:
#   atmos scaffold generate component . --force
scaffold:
  base_path: "./scaffolds"
  templates:
    component:
      description: "Terraform root component following this repo's house rules"
      source: "./scaffolds/component"
      version: "1.0.0"
    catalog-entry:
      description: "Catalog defaults + disabled entry for an existing component"
      source: "./scaffolds/catalog-entry"
      version: "1.0.0"
    # One stage stack, stacks/orgs/<tenant>/<stage>/<region>.yaml; its golden
    # answers (scaffolds/stack-golden) are checked by scripts/check-stack-scaffold.sh:
    #   atmos scaffold generate stack . --force
    stack:
      description: "Stage stack for an existing stage, account and region"
      source: "./scaffolds/stack"
      version: "1.0.0"

# A repo file, relative to base_path, is read in place. A URL is fetched by
# go-getter into $TMPDIR/atmos-manifest.json, which it never truncates: it keeps
# a cache at least as long as the remote and range-appends to a shorter one, so
# concurrent or mixed-version runs left valid JSON plus trailing bytes there and
# every describe/validate failed (jsonschema: invalid json). The pin is
# `atmos stack schema` of the CI image's Atmos; lint step manifest-schema checks it.
schemas:
  atmos:
    manifest: "schemas/atmos/atmos-manifest.json"

templates:
  settings:
    enabled: true
    # Two passes: settings.environment.account_id and management_account_id
    # are templates over settings.account_map (stacks/orgs/fnx/_defaults.yaml),
    # and every `{{ .settings.environment.account_id }}` elsewhere renders to
    # that template in the first pass and to the ID in the second.
    # So a literal `{{` that must reach Terraform or helm needs escaping twice.
    evaluations: 2
    sprig:
      enabled: true
    gomplate:
      enabled: true

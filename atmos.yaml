# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-config/1.0/atmos-config.json
# Atmos CLI configuration - https://atmos.tools/cli/configuration
#
# Backend, provider and toolchain defaults live in the stack hierarchy
# (stacks/orgs/fnx/_defaults.yaml), not here.

base_path: "."

version:
  constraint:
    require: ">=1.229.0"
    enforcement: fatal
    message: "This repository requires Atmos >= 1.229.0 (see .atmos.env)."

components:
  terraform:
    base_path: components/terraform
    apply_auto_approve: false
    deploy_run_init: true
    auto_generate_backend_file: true
    init:
      reconfigure: auto

stacks:
  base_path: stacks
  included_paths:
    - "orgs/**/*.yaml"
  excluded_paths:
    - "**/_defaults.yaml"
    - "**/components/**"
  # e.g. fnx-dev-testenv-01, fnx-staging-staging-01, fnx-prod-production
  name_template: "{{ .settings.context.tenant }}-{{ .settings.context.stage }}-{{ .settings.context.environment }}"

# Local AWS sandbox (Floci). Binds ONLY the fnx-local-sandbox stack, via that
# stack's `aws` emulator component — deliberately not `default: true`, so no
# real environment can ever be silently redirected at the emulator once real
# credentials exist. See stacks/catalog/emulator/aws.yaml.
auth:
  identities:
    local-aws:
      kind: aws/emulator
      emulator: fnx-local-sandbox/aws

    # Second local lane, pointed at LocalEmu (localemu.cloud) instead of Floci.
    # Atmos has no localemu driver, so this is deliberately NOT an
    # `aws/emulator` identity: it is a static-credential identity whose
    # endpoint_url happens to be an AWS-compatible API on localhost. LocalEmu
    # is started by hand, outside Atmos, via `atmos workflow localemu-up -f
    # localemu` (or the full `atmos workflow localemu -f localemu`, also run in
    # CI by .github/workflows/emulator.yml) - see the RUN IT AGAINST A FRESH
    # EMULATOR note in stacks/orgs/fnx/local/eu-west-2/localemu.yaml for how
    # that workflow copes with LocalEmu not being idempotent across restarts.
    #
    # It exists for rds, which Floci cannot exercise at all (no
    # CreateDBSubnetGroup) and LocalEmu can. It does NOT rescue apigateway or
    # elasticache: both fail on LocalEmu too, for their own reasons - see the
    # header of stacks/orgs/fnx/local/eu-west-2/localemu.yaml. The credentials
    # are the conventional local-emulator dummies and authenticate nothing;
    # they are read from the environment so no literal lands in git.
    local-emu:
      kind: aws/user
      credentials:
        access_key_id: !env LOCALEMU_ACCESS_KEY_ID
        secret_access_key: !env LOCALEMU_SECRET_ACCESS_KEY
        region: eu-west-2
      spec:
        endpoint_url: http://localhost:4566

workflows:
  base_path: workflows

logs:
  file: "/dev/stderr"
  level: Info

settings:
  list_merge_strategy: replace

# Native CI (GitHub Actions): job summaries, $GITHUB_OUTPUT variables,
# commit statuses and upserted PR plan comments. Inactive outside CI.
ci:
  enabled: true
  output:
    enabled: true
  summary:
    enabled: true
  checks:
    enabled: true
    context_prefix: atmos
  comments:
    enabled: true
    behavior: upsert

# Scaffold templates (EXPERIMENTAL in Atmos). Both generate with the repository
# root as the target, so a single run can place files under both
# components/terraform/ and stacks/catalog/:
#   atmos scaffold generate component . --force
scaffold:
  base_path: "./scaffolds"
  templates:
    component:
      description: "Terraform root component following this repo's house rules"
      source: "./scaffolds/component"
      version: "1.0.0"
    catalog-entry:
      description: "Catalog defaults + disabled entry for an existing component"
      source: "./scaffolds/catalog-entry"
      version: "1.0.0"

schemas:
  atmos:
    manifest: "https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json"

templates:
  settings:
    enabled: true
    sprig:
      enabled: true
    gomplate:
      enabled: true

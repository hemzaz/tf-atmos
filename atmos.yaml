# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-config/1.0/atmos-config.json
# Atmos CLI configuration - https://atmos.tools/cli/configuration
#
# Backend, provider and toolchain defaults live in the stack hierarchy
# (stacks/orgs/fnx/_defaults.yaml), not here.

base_path: "."

version:
  constraint:
    require: ">=1.229.0"
    enforcement: fatal
    message: "This repository requires Atmos >= 1.229.0 (see .atmos.env)."

components:
  terraform:
    base_path: components/terraform
    apply_auto_approve: false
    deploy_run_init: true
    auto_generate_backend_file: true
    init:
      reconfigure: auto

stacks:
  base_path: stacks
  included_paths:
    - "orgs/**/*.yaml"
  excluded_paths:
    - "**/_defaults.yaml"
    - "**/components/**"
  # e.g. fnx-dev-testenv-01, fnx-staging-staging-01, fnx-prod-production
  name_template: "{{ .vars.tenant }}-{{ .vars.stage }}-{{ .vars.environment }}"

workflows:
  base_path: workflows

logs:
  file: "/dev/stderr"
  level: Info

settings:
  list_merge_strategy: replace

schemas:
  atmos:
    manifest: "https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json"

templates:
  settings:
    enabled: true
    sprig:
      enabled: true
    gomplate:
      enabled: true

# Trivy findings in registry modules that a vendored component (vendor.yaml)
# calls: the module sits outside the repo and the component cannot be edited, so
# neither carries an inline #trivy:ignore. One path-scoped entry per finding,
# each with its reason; read by the trivy runs of workflows/lint.yaml
# (security-scan and security-scan-report). No blanket ignores.
misconfigurations:
  - id: AWS-0132
    paths:
      - "cloudposse/config-storage/aws/**"
    statement: >-
      aws-config-bucket (E5a3): Cloud Posse's config-storage encrypts the AWS
      Config delivery bucket with SSE-S3 (AES256), the vendored default and the
      owner's decision (E5a plan OQ3). A customer managed key is E5b's work for
      the trail's bucket, not this one.

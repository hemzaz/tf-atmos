---
import:
  # Import the catalog with vpc configuration for us-east-1 region
  - catalog/vpc/defaults
  # All accounts (stages) in this region will have vpc components

vars:
  region: us-east-1
settings:
  environment:
    availability_zones:
      - us-east-1a
      - us-east-1b
      - us-east-1c

# Other defaults for the us-east-1 region
  context:
    environment: us-east-1

---
# =============================================================================
# fnx-ue2-root - the management account's us-east-2 stack
# =============================================================================
# The management account in the US DR region (E5c OQ-R (a), 2026-11-10: Cloud
# Posse runs the org security services in every operated region, so each needs
# a root and a security stack; this one holds their step-2 delegations,
# below, E5c5). No backend: its state is fnx-ue1-root's US bucket,
# through the backend's root role (stacks/orgs/fnx/_defaults.yaml routes stage
# root there), whose root_write holds this stack's pattern pair.
#
# The management account's Config recorder for us-east-2 (aws-config,
# inheriting aws-config/main-core-region, as the core template's non-home
# stacks): regional resource types only, delivering to the US archive
# (fnx-ue1-audit's config-bucket), with the recorder role of fnx-ue1-root, the
# account's global-resource collector, by its convention ARN
# (catalog/aws-config/main.yaml), so deploy fnx-ue1-root's first
# (docs/OPERATIONS.md "Bootstrap order"). No trail: fnx-ue1-root's
# multi-region trail records this region (owner OQ-A). This stack is not
# scaffolded: the core template's non-home recorder, by hand.
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/us-east-2
  - orgs/fnx/root/_defaults
  - catalog/aws-account-settings/main-standby
  - catalog/aws-config/main
  - catalog/aws-guardduty/defaults
  - catalog/aws-security-hub/defaults
  - catalog/aws-inspector2/defaults

settings:
  context:
    tenant: fnx
    stage: root

components:
  terraform:
    # The management account's us-east-2 settings (E5c3c, as fnx-ew1-root's
    # eu-west-1 ones): EBS default encryption, the IMDSv2 default, the EBS
    # snapshot and AMI public access blocks. Its account-wide ones (alias, S3
    # account block) are fnx-gbl-root's (main-standby). Reads no instance;
    # deploy-full-stack's iam layer applies it.
    aws-account-settings:
      metadata:
        enabled: true

    # Cloud Posse's instance name; the variant is catalog/aws-config/main.yaml's.
    aws-config:
      metadata:
        component: aws-config
        inherits:
          - aws-config/main-core-region

    # Cloud Posse's instance names, step 2 (E5c5): from the management account,
    # delegate GuardDuty, Security Hub and Inspector in this region to
    # <tenant>-security (catalog/aws-guardduty, aws-security-hub, aws-inspector2
    # defaults). The GuardDuty and Security Hub ones depend on the same region's
    # security stack's step 1 (its delegated-administrator detector and hub, the
    # root-defaults abstracts), never another residency's; Inspector has no
    # step 1. They read no state. deploy-full-stack's security layer applies
    # them, after that security stack (docs/OPERATIONS.md "Bootstrap order").
    aws-guardduty/root:
      metadata:
        component: aws-guardduty
        inherits:
          - aws-guardduty/root-defaults
    aws-security-hub/root:
      metadata:
        component: aws-security-hub
        inherits:
          - aws-security-hub/root-defaults
    aws-inspector2/root:
      metadata:
        component: aws-inspector2
        inherits:
          - aws-inspector2/root-defaults

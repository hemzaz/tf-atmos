---
# =============================================================================
# fnx-ec1-root - the management account's eu-central-1 stack
# =============================================================================
# The management account in the EU DR region (E5c OQ-R (a), 2026-11-10: Cloud
# Posse runs the org security services in every operated region, so each needs
# a root and a security stack; the services' delegation instances arrive in
# later E5c slices). No backend: GDPR-scoped (check-data-residency.py), its
# state is fnx-ew1-root's EU bucket (stacks/orgs/fnx/root/eu-west-1.yaml),
# through that backend's root role, whose root_write holds this stack's
# pattern pair.
#
# The management account's Config recorder for eu-central-1 (aws-config,
# inheriting aws-config/main-core-region-eu, as the core template's
# eu-central-1 stacks): regional resource types only, delivering to the EU
# archive (fnx-ew1-audit's config-bucket), with the recorder role of
# fnx-ue1-root, the account's global-resource collector, by its convention ARN
# (catalog/aws-config/main.yaml), so deploy fnx-ue1-root's first
# (docs/OPERATIONS.md "Bootstrap order"). It authorizes the EU aggregator
# (security, eu-west-1, fnx-ew1-security), never the US one: this region's
# Config data stays in the EU (owner 2026-11-13). No trail: fnx-ue1-root's
# multi-region trail records this region (owner OQ-A). This stack is not
# scaffolded: the core template's non-home recorder, by hand.
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/eu-central-1
  - orgs/fnx/root/_defaults
  - catalog/aws-config/main

vars:
  tags:
    Compliance: "pci-sox-gdpr"

settings:
  context:
    tenant: fnx
    stage: root
  # The EU backend, overriding every settings.tfstate key (literal
  # .settings.context.* references only, see stacks/orgs/fnx/_defaults.yaml),
  # as fnx-ew1-root's own: the state stays in eu-west-1, replicated to
  # eu-central-1.
  tfstate:
    region: eu-west-1
    replica_region: eu-central-1
    bucket: '{{ .settings.context.tenant }}-ew1-terraform-state'
    role_prefix: '{{ .settings.context.tenant }}-ew1-terraform-backend'
    stack: '{{ .settings.context.tenant }}-ew1-root'

components:
  terraform:
    # Cloud Posse's instance name; the variant is catalog/aws-config/main.yaml's.
    aws-config:
      metadata:
        component: aws-config
        inherits:
          - aws-config/main-core-region-eu

---
# =============================================================================
# fnx-ew1-root - the management account's EU stack
# =============================================================================
# Owns the EU stacks' Terraform state backend (owner decision, B5: GDPR data
# residency): bucket fnx-ew1-terraform-state in eu-west-1, replicated to
# fnx-ew1-terraform-state-replica in eu-central-1 (the EU DR region, never a
# US one), its KMS key and access roles fnx-ew1-terraform-backend-*. Same
# management account and same `backend` component as fnx-ue1-root's US
# backend (stacks/orgs/fnx/root/us-east-1.yaml); its own stack, so EU state,
# keys and roles never share a bucket, policy or name with the US ones.
#
# An EU stack points its settings.tfstate here, all of it
# (stacks/orgs/fnx/_defaults.yaml). The bucket holds prod state
# (fnx-ew1-prod and its DR standby fnx-ec1-prod, both in the prod-eu
# account) and the EU core stacks' (fnx-ew1-audit, through core_write), so
# this stack has the prod roles (catalog/backend/roles/prod) and no
# read/write: check-state-keys.py fails a role that matches no state.
#
# Bootstrap (cold start, once), then the management account's eu-west-1
# settings (aws-account-settings, below):
#   atmos workflow backend-cold-start -f bootstrap -s fnx-ew1-root
#   atmos workflow deploy-iam -f deploy-full-stack -s fnx-ew1-root
#
# The management account's Config recorder for eu-west-1 (aws-config,
# inheriting aws-config/main-eu-core, as the core template's eu-west-1 stacks):
# regional resource types only, delivering to the EU archive (fnx-ew1-audit's
# config-bucket), with the recorder role of fnx-ue1-root, the account's
# global-resource collector, by its convention ARN (catalog/aws-config/main.yaml;
# the scoped OQ-A exemption of check-data-residency.py), so deploy fnx-ue1-root's
# first (docs/OPERATIONS.md "Bootstrap order"). No trail: fnx-ue1-root's
# multi-region trail records this region (owner OQ-A).
# =============================================================================

import:
  - catalog/_base/defaults
  # The region code (ew1) of the state bucket's region, settings.tfstate.region
  - mixins/region/eu-west-1
  - orgs/fnx/root/_defaults
  - catalog/backend/roles/prod
  - catalog/aws-account-settings/main-standby
  - catalog/aws-config/main

vars:
  region: "{{ .settings.tfstate.region }}"
  tags:
    Compliance: "pci-sox-gdpr"

settings:
  context:
    tenant: fnx
    stage: root
  # The EU backend, overriding every settings.tfstate key (literal
  # .settings.context.* references only, see stacks/orgs/fnx/_defaults.yaml).
  # The ew1 in the bucket and role names keeps them apart from the US
  # backend's in the one management account (IAM and S3 names are global).
  tfstate:
    region: eu-west-1
    replica_region: eu-central-1
    bucket: '{{ .settings.context.tenant }}-ew1-terraform-state'
    role_prefix: '{{ .settings.context.tenant }}-ew1-terraform-backend'
    stack: '{{ .settings.context.tenant }}-ew1-root'

components:
  terraform:
    # The management account's eu-west-1 settings (E3d, enabled in E3e with
    # fnx-gbl-root's): EBS default encryption, the IMDSv2 default, the EBS
    # snapshot and AMI public access blocks. Its account-wide ones (alias, S3
    # account block) are fnx-gbl-root's (main-standby). Applied by
    # deploy-full-stack's iam layer after this stack's backend
    # (`atmos workflow deploy-iam -f deploy-full-stack -s fnx-ew1-root`,
    # docs/OPERATIONS.md "Bootstrap order", step 3).
    aws-account-settings:
      metadata:
        enabled: true

    # Cloud Posse's instance name; the variant is catalog/aws-config/main.yaml's.
    aws-config:
      metadata:
        component: aws-config
        inherits:
          - aws-config/main-eu-core

    backend/main:
      metadata:
        component: backend
        inherits:
          - backend
      vars:
        account_id: "{{ .settings.environment.management_account_id }}"
        enable_access_logging: true
        # State replicated to <bucket>-replica in eu-central-1, read-only for
        # every access role (as fnx-ue1-root's to us-east-2).
        s3_replication_enabled: true
        replica_region: "{{ .settings.tfstate.replica_region }}"
        # Who may use the state, as in fnx-ue1-root (whose comment explains
        # the patterns and the CI role ARNs): each stack's exact pattern pair
        # on its stage's roles, and its CI roles, named from iam/ci's
        # ci_role_name_prefix in that stack's account, and the Identity
        # Center permission-set roles by their reserved-path pattern (Plan sets
        # on read roles, Apply sets on write roles). The EU CI roles live in the
        # prod-eu account (a hyphenated account map key: index).
        access_roles:
          prod_read:
            # EU prod state: ONLY the EU prod stacks' plan roles (master
            # branch subject alone, owner decision D3), and the prod-eu
            # account's TerraformPlanAccess-Eu (humans, read-only).
            # fnx-ec1-prod is fnx-ew1-prod's DR warm standby, in the same
            # account.
            object_key_patterns: &prod_state
              - "*/fnx-ew1-prod/*"
              - "*/fnx-ew1-prod-*"
              - "*/fnx-ec1-prod/*"
              - "*/fnx-ec1-prod-*"
            allowed_principal_arns:
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformPlanAccess-Eu_*'
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/fnx-ew1-prod-ci-plan'
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/fnx-ec1-prod-ci-plan'
          prod_write:
            # EU prod state: ONLY the EU prod stacks' apply roles among the CI
            # roles, the prod-eu account's AdministratorAccess (human
            # break-glass, not PR code), and its
            # OrganizationAccountAccessRole, the administrator's way into the
            # new account for its stacks' first deploy, until Identity Center
            # is applied (as fnx-ue1-root's; the PR enabling its instance
            # removes it).
            object_key_patterns: *prod_state
            allowed_principal_arns:
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/OrganizationAccountAccessRole'
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*'
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/fnx-ew1-prod-ci-apply'
              - 'arn:aws:iam::{{ index .settings.account_map.full_account_map "prod-eu" }}:role/fnx-ec1-prod-ci-apply'
          # This stack's own state (backend/main): only the applying
          # administrator (stacks/catalog/backend/defaults.yaml).
          root_write:
            object_key_patterns:
              - "*/fnx-ew1-root/*"
              - "*/fnx-ew1-root-*"
          # The EU core stacks' state (owner decision 2026-11-03: stages audit
          # and security in eu-west-1, routed here by
          # stacks/orgs/fnx/_defaults.yaml), as fnx-ue1-root's core_write: a
          # core stack is applied with credentials in its own account, so that
          # account's AdministratorAccess (owner decision 2026-11-05) and, until
          # Identity Center is applied, its
          # OrganizationAccountAccessRole. Neither reaches this stack's state.
          core_write:
            object_key_patterns:
              - "*/fnx-ew1-audit/*"
              - "*/fnx-ew1-audit-*"
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.audit }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.audit }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"

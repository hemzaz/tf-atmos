---
# =============================================================================
# fnx-ue1-root - the management account's stack
# =============================================================================
# Owns the Terraform state backend every US stack uses: bucket
# fnx-terraform-state, its KMS key, and the stage-split read-only / read-write
# access roles (components/terraform/backend). The EU stacks' backend is
# fnx-ew1-root's (stacks/orgs/fnx/root/eu-west-1.yaml). Workload stacks have
# no backend instance; their iam/ci names this instance's roles by the same
# naming convention the stack backend uses (stacks/orgs/fnx/_defaults.yaml),
# so no CI role ever reads this stack's state.
#
# Bootstrap (cold start, once): workflows/bootstrap.yaml `backend-cold-start`,
# or by hand - see components/terraform/backend/README.md#bootstrap.
#
# The management account's one multi-region trail (cloudtrail, from
# catalog/aws-cloudtrail/defaults; owner OQ-A, check-lane-names.py SINGLETONS),
# delivering to fnx-ue1-audit's cloudtrail-bucket, and its Config recorder
# (aws-config, inheriting aws-config/main), the account's global-resource
# collector, delivering to fnx-ue1-audit's config-bucket. Both are in
# deploy-full-stack's security layer, after the audit stack's storage layer
# (docs/OPERATIONS.md "Bootstrap order"). This stack is not scaffolded: the
# same instances as the core template's home-region stacks
# (scaffolds/stack/stack/core.yaml.tmpl), by hand.
# =============================================================================

import:
  - catalog/_base/defaults
  # The region code (ue1) of the state bucket's region, settings.tfstate.region
  - mixins/region/us-east-1
  - orgs/fnx/root/_defaults
  - catalog/backend/roles/nonprod
  - catalog/backend/roles/prod
  - catalog/access-analyzer/root
  - catalog/aws-cloudtrail/defaults
  - catalog/aws-config/main

vars:
  region: "{{ .settings.tfstate.region }}"

settings:
  context:
    tenant: fnx
    stage: root

components:
  terraform:
    # Cloud Posse's instance name; the variant is catalog/aws-config/main.yaml's.
    aws-config:
      metadata:
        component: aws-config
        inherits:
          - aws-config/main

    backend/main:
      metadata:
        component: backend
        inherits:
          - backend
      vars:
        account_id: "{{ .settings.environment.management_account_id }}"
        enable_access_logging: true
        # State replicated to <bucket>-replica in the DR region (owner
        # decision, B1 DR), read-only for every access role.
        s3_replication_enabled: true
        replica_region: "{{ .settings.tfstate.replica_region }}"
        # Who may use the state. The CI roles are named from iam/ci's
        # ci_role_name_prefix ("<tenant>-<environment>-<stage>-ci", see
        # stacks/catalog/iam/ci*.yaml) in that stack's account, its
        # settings.account_map entry (stacks/orgs/fnx/_defaults.yaml) -
        # strings, not !terraform.state: iam/ci deploys after this instance,
        # and CI roles never read the root state. The trust is an
        # aws:PrincipalArn condition, so the roles do not have to exist yet
        # (see components/terraform/backend/iam.tf).
        # Add a stack's roles here when adding a stack. The administrator who
        # applies this instance is always trusted as well (Cloud Posse's
        # caller rule); list any other human/admin role ARN explicitly.
        # The account IDs come from the account map; its values are the
        # repository's placeholders - see
        # docs/OPERATIONS.md#first-deploy-inputs.
        #
        # Humans: the Identity Center permission-set roles (E4,
        # stacks/catalog/aws-identity-center), each by its reserved-path
        # pattern for one account and one set (arn:aws:iam::<account>:role/
        # aws-reserved/sso.amazonaws.com/*AWSReservedSSO_<set>_*: the region
        # segment and the hash suffix are unknown until Identity Center
        # provisions the set there; customers cannot create a role under
        # /aws-reserved/). Owner decisions 2026-11-04/05: the Plan sets only
        # on the stage's read role, the Apply sets only on its write role, each
        # set on the role its policy assumes, and only a set that
        # aws-identity-center's account_assignments assigns in that account
        # (no trusted-but-unassigned set); a set's account is the stage's own
        # (check-ci-state-roles.py). Each account's AdministratorAccess
        # (Managers, DevOps) is on its write role: the humans who apply its
        # stacks, and in the workload accounts the eks break-glass (eks
        # map_additional_iam_roles; E4c3/E4c4; check-cluster-api-ci.py fails a
        # stack whose admin role is missing here).
        #
        # Each account's OrganizationAccountAccessRole stays beside them until
        # Identity Center is applied (deploy-accounts' identity-center phase,
        # its instance still disabled; docs/OPERATIONS.md, Bootstrap order):
        # before that it is the only way into a new account, and the PR
        # enabling that instance removes it.
        #
        # State: each stack's exact pattern pair, "*/<stack>/*" and
        # "*/<stack>-*" (stacks/catalog/backend/defaults.yaml explains the key
        # layout), on its stage's read and write roles. Adding a stack = its
        # pair and its CI roles here (check-state-keys.py,
        # check-ci-state-roles.py).
        access_roles:
          read:
            # Dev/staging state: their CI plan roles (PR plans, drift).
            object_key_patterns: &non_prod_state
              - "*/fnx-ue1-dev/*"
              - "*/fnx-ue1-dev-*"
              - "*/fnx-ue1-staging/*"
              - "*/fnx-ue1-staging-*"
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformPlanAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/fnx-ue1-dev-ci-plan"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/fnx-ue1-staging-ci-plan"
          prod_read:
            # Prod state: ONLY prod's plan role, which trusts the master
            # branch subject alone (owner decision D3) - never PR code - and
            # the prod account's TerraformPlanAccess-Prod (humans, read-only).
            # fnx-ue2-prod is prod's DR warm standby, in the same account.
            object_key_patterns: &prod_state
              - "*/fnx-ue1-prod/*"
              - "*/fnx-ue1-prod-*"
              - "*/fnx-ue2-prod/*"
              - "*/fnx-ue2-prod-*"
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformPlanAccess-Prod_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/fnx-ue1-prod-ci-plan"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/fnx-ue2-prod-ci-plan"
          write:
            # Dev/staging state: their CI apply roles (master branch subject
            # only, see iam/ci ci_apply_role_trusted_repos), dev's
            # TerraformApplyAccess (Developers), each account's
            # AdministratorAccess, and its
            # OrganizationAccountAccessRole until Identity Center is applied
            # (above). Accepted: write is not split by stage, so a dev
            # principal also reaches staging state and the reverse, as the CI
            # apply roles do (Cloud Posse's tfstate roles are not stage-split
            # at all).
            object_key_patterns: *non_prod_state
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformApplyAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/fnx-ue1-dev-ci-apply"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/fnx-ue1-staging-ci-apply"
          prod_write:
            # Prod state: ONLY prod's apply roles among the CI roles, the prod
            # account's AdministratorAccess (human break-glass, not PR code: D3
            # holds), and its
            # OrganizationAccountAccessRole until Identity Center is applied.
            object_key_patterns: *prod_state
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/fnx-ue1-prod-ci-apply"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/fnx-ue2-prod-ci-apply"
          # The root stacks' state: this stack's own (backend/main), the
          # management account's global stack's (fnx-gbl-root: the accounts
          # layer, deploy-accounts.yaml) and its US DR region stack's
          # (fnx-ue2-root, E5c). Only the applying administrator is trusted
          # (stacks/catalog/backend/defaults.yaml), no principal of any other
          # account.
          root_write:
            object_key_patterns:
              - "*/fnx-ue1-root/*"
              - "*/fnx-ue1-root-*"
              - "*/fnx-gbl-root/*"
              - "*/fnx-gbl-root-*"
              - "*/fnx-ue2-root/*"
              - "*/fnx-ue2-root-*"
          # The core accounts' stacks' state (stacks/orgs/fnx/_defaults.yaml
          # routes the core stages here; E2 carry, owner decision: core_write).
          # A core stack is applied with credentials in its own account (the
          # provider's allowed_account_ids): each core account's
          # AdministratorAccess (Managers, DevOps; owner decision 2026-11-05),
          # and its OrganizationAccountAccessRole
          # (which Organizations creates in every account it creates, trusting
          # the management account) until Identity Center is applied (above).
          # Neither reaches the root stacks' state (root_write).
          core_write:
            object_key_patterns:
              - "*/fnx-ue1-audit/*"
              - "*/fnx-ue1-audit-*"
              - "*/fnx-ue1-network/*"
              - "*/fnx-ue1-network-*"
              - "*/fnx-ue1-security/*"
              - "*/fnx-ue1-security-*"
              - "*/fnx-ue1-identity/*"
              - "*/fnx-ue1-identity-*"
              - "*/fnx-ue1-artifacts/*"
              - "*/fnx-ue1-artifacts-*"
              - "*/fnx-ue2-security/*"
              - "*/fnx-ue2-security-*"
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.audit }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.network }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.security }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.identity }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.artifacts }}:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.audit }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.network }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.security }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.identity }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.artifacts }}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"

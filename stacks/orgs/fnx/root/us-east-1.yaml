---
# =============================================================================
# fnx-ue1-root - the management account's stack
# =============================================================================
# Owns the ONE Terraform state backend every stack uses: bucket
# fnx-terraform-state, its KMS key, and the stage-split read-only / read-write
# access roles (components/terraform/backend). Workload stacks have no backend
# instance; their iam/ci names this instance's roles by the same naming
# convention the stack backend uses (stacks/orgs/fnx/_defaults.yaml), so no CI
# role ever reads this stack's state.
#
# Bootstrap (cold start, once): workflows/bootstrap.yaml `backend-cold-start`, or by
# hand - see components/terraform/backend/README.md#bootstrap.
# =============================================================================

import:
  - catalog/_base/defaults
  # The region code (ue1) of the state bucket's region, settings.tfstate.region
  - mixins/region/us-east-1
  - orgs/fnx/root/_defaults
  - catalog/backend/defaults

vars:
  region: "{{ .settings.tfstate.region }}"

settings:
  context:
    tenant: fnx
    stage: root

components:
  terraform:
    backend/main:
      metadata:
        component: backend
        inherits:
          - backend
      vars:
        account_id: "{{ .settings.environment.management_account_id }}"
        enable_access_logging: true
        # State replicated to <bucket>-replica in the DR region (owner
        # decision, B1 DR), read-only for every access role.
        s3_replication_enabled: true
        replica_region: "{{ .settings.tfstate.replica_region }}"
        # Who may use the state. The CI roles are named from iam/ci's
        # ci_role_name_prefix ("<tenant>-<environment>-<stage>-ci", see each
        # workload stack's components/security.yaml) in that stack's
        # account, its settings.account_map entry (stacks/orgs/fnx/_defaults.yaml)
        # - strings, not !terraform.state:
        # iam/ci deploys after this instance, and CI roles never read the
        # root state. The trust is an aws:PrincipalArn condition, so the roles do
        # not have to exist yet (see components/terraform/backend/iam.tf).
        # Add a stack's roles here when adding a stack. The administrator who
        # applies this instance is always trusted as well (Cloud Posse's
        # caller rule); list any other human/admin role ARN explicitly.
        # The account IDs come from the account map; its values are the
        # repository's placeholders - see docs/OPERATIONS.md#first-deploy-inputs.
        #
        # Human operators: every rolearn in a workload stack's eks
        # map_additional_iam_roles (its components/globals.yaml) applies that
        # stack's in-cluster components from inside the VPC, so it goes in the
        # stage's write role too - `write` for dev/staging, `prod_write` for
        # prod - with the same full ARN, path included (aws:PrincipalArn
        # carries the role's path). check-cluster-api-ci.py fails a stack
        # whose admin role is missing here. None yet: the owner supplies them.
        #
        # State: each stack's exact pattern pair, "*/<stack>/*" and "*/<stack>-*"
        # (stacks/catalog/backend/defaults.yaml explains the key layout), on its
        # stage's read and write roles. Adding a stack = its pair and its CI
        # roles here (check-state-keys.py, check-ci-state-roles.py).
        access_roles:
          read:
            # Dev/staging state: their CI plan roles (PR plans, drift).
            object_key_patterns: &non_prod_state
              - "*/fnx-ue1-dev/*"
              - "*/fnx-ue1-dev-*"
              - "*/fnx-ue1-staging/*"
              - "*/fnx-ue1-staging-*"
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/fnx-ue1-dev-ci-plan"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/fnx-ue1-staging-ci-plan"
          prod_read:
            # Prod state: ONLY prod's plan role, which trusts the master
            # branch subject alone (owner decision D3) - never PR code.
            object_key_patterns: &prod_state
              - "*/fnx-ue1-prod/*"
              - "*/fnx-ue1-prod-*"
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/fnx-ue1-prod-ci-plan"
          write:
            # Dev/staging state: their CI apply roles (master branch subject
            # only, see iam/ci ci_apply_role_trusted_repos).
            object_key_patterns: *non_prod_state
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.dev }}:role/fnx-ue1-dev-ci-apply"
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.staging }}:role/fnx-ue1-staging-ci-apply"
          prod_write:
            # Prod state: ONLY prod's apply role.
            object_key_patterns: *prod_state
            allowed_principal_arns:
              - "arn:aws:iam::{{ .settings.account_map.full_account_map.prod }}:role/fnx-ue1-prod-ci-apply"
          # This stack's own state (backend/main). No principals listed: the
          # applying administrator only (stacks/catalog/backend/defaults.yaml).
          root_write:
            object_key_patterns:
              - "*/fnx-ue1-root/*"
              - "*/fnx-ue1-root-*"

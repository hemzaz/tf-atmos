---
# =============================================================================
# fnx-gbl-root - the management account's global stack
# =============================================================================
# The accounts layer (owner decision Q2: tf-atmos owns the organization, with
# Cloud Posse components): the AWS Organization and its OUs (E3a), then the
# accounts (E3b) and SCPs (E3c). Cloud Posse deploys these from core-gbl-root;
# here the tenant stays fnx, so fnx-gbl-root (owner decision QE5).
#
# Its own stack, not fnx-ue1-root: deploying an org component needs real core
# account IDs (check-first-deploy-inputs.py MAP_CONSUMERS is stack-scoped),
# and fnx-ue1-root's backend cold start must not wait for them. Bootstrap
# order: the backend cold start (fnx-ue1-root), then this stack, then the
# backend's access_roles for the new accounts (E3e's deploy-accounts).
#
# State: fnx-ue1-root's US bucket, through the backend's root role
# (stacks/orgs/fnx/_defaults.yaml routes stage root there): the
# management-account administrator only. Out of every CI matrix
# (root/_defaults: github.actions_enabled false); the provider guard allows the
# management account only (settings.environment.account_id).
#
# Every instance is metadata.enabled: false until E3e adds the `accounts`
# deploy layer before `backend` and the deploy-accounts workflow, and enables
# them in the same PR as this stack's key pair ("*/fnx-gbl-root/*",
# "*/fnx-gbl-root-*") on root_write in fnx-ue1-root's backend/main
# (check-state-keys.py fails a pattern no enabled instance's state matches).
# Disabled, no deploy workflow selects them (check-deploy-layers.py COVERAGE)
# and the preflight does not yet demand the core account IDs or check their
# vars (account emails, import ids): enabling them makes it do both.
#
# Deploy order (E3e): five phases, not one layer, because
# check-deploy-layers.py fails a !terraform.state read of an instance in the
# same or a later phase: 1. aws-organization; 2. the core and plat OUs;
# 3. the eu OU (reads plat) and the core and plat SCPs (read their OU);
# 4. the eu SCP (reads eu); 5. the accounts (read their OU). The SCPs come
# before the accounts so no account is created in or moved into an OU
# without its guardrails. Each reader already names its target in
# dependencies.components, which check-dependencies.py holds once the
# instances are enabled.
#
# SCPs (E3c, catalog/aws-scp): one instance per policy and OU, attached to
# OUs only, never the organization root (check-scp-policies.py). Before an
# imported account already running workloads lands in an OU, check that it
# uses no region the region-* policies deny, and that its deploy roles match
# security-services' exception (<stack>-ci-apply, OrganizationAccountAccessRole;
# E4 adds its own).
#
# OUs, Cloud Posse's reference architecture (aws-organizational-unit README):
#   core  the core accounts (root stays at the organization root; audit,
#         security, network, identity, artifacts: E3b's aws-account instances)
#   plat  the platform (workload) accounts: dev, staging, prod
#   eu    under plat, prod-eu only: E3c attaches the EU region allow-list
#         (owner decision QE3) here, and plat's baseline SCPs still apply
#
# Account settings (E3d, catalog/aws-account-settings/main): the management
# account's alias and S3 account public access block, and its us-east-1
# settings; fnx-ew1-root has its eu-west-1 ones. Disabled with the rest of
# this stack; E3e enables it with them (it reads no other instance, so any
# phase).
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/global-region
  - orgs/fnx/root/_defaults
  - catalog/aws-organization/defaults
  - catalog/aws-organizational-unit/defaults
  - catalog/aws-account/defaults
  - catalog/aws-scp/defaults
  - catalog/aws-account-settings/main

settings:
  context:
    tenant: fnx
    stage: root

components:
  terraform:
    aws-account-settings:
      metadata:
        enabled: false

    aws-organization:
      metadata:
        component: aws-organization
        enabled: false
        inherits:
          - aws-organization/defaults

    aws-organizational-unit/core:
      metadata:
        component: aws-organizational-unit
        enabled: false
        inherits:
          - aws-organizational-unit/defaults
      dependencies:
        components:
          - component: aws-organization
      vars:
        name: core
        parent_id: !terraform.state aws-organization organization_root_id

    aws-organizational-unit/plat:
      metadata:
        component: aws-organizational-unit
        enabled: false
        inherits:
          - aws-organizational-unit/defaults
      dependencies:
        components:
          - component: aws-organization
      vars:
        name: plat
        parent_id: !terraform.state aws-organization organization_root_id

    aws-organizational-unit/eu:
      metadata:
        component: aws-organizational-unit
        enabled: false
        inherits:
          - aws-organizational-unit/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: eu
        parent_id: !terraform.state aws-organizational-unit/plat organizational_unit_id

    # Member accounts (E3b): one per settings.account_map key but root (see
    # catalog/aws-account). Core accounts in core, workload accounts in plat,
    # prod-eu in eu (under plat) for E3c's EU region allow-list.

    aws-account/audit:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: "{{ .settings.context.tenant }}-audit"
        account_email: "aws+{{ .settings.context.tenant }}-audit@example.com"
        parent_id: !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-account/security:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: "{{ .settings.context.tenant }}-security"
        account_email: "aws+{{ .settings.context.tenant }}-security@example.com"
        parent_id: !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-account/network:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: "{{ .settings.context.tenant }}-network"
        account_email: "aws+{{ .settings.context.tenant }}-network@example.com"
        parent_id: !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-account/identity:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: "{{ .settings.context.tenant }}-identity"
        account_email: "aws+{{ .settings.context.tenant }}-identity@example.com"
        parent_id: !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-account/artifacts:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: "{{ .settings.context.tenant }}-artifacts"
        account_email: "aws+{{ .settings.context.tenant }}-artifacts@example.com"
        parent_id: !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-account/dev:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: "{{ .settings.context.tenant }}-dev"
        account_email: "aws+{{ .settings.context.tenant }}-dev@example.com"
        parent_id: !terraform.state aws-organizational-unit/plat organizational_unit_id

    aws-account/staging:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: "{{ .settings.context.tenant }}-staging"
        account_email: "aws+{{ .settings.context.tenant }}-staging@example.com"
        parent_id: !terraform.state aws-organizational-unit/plat organizational_unit_id

    aws-account/prod:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: "{{ .settings.context.tenant }}-prod"
        account_email: "aws+{{ .settings.context.tenant }}-prod@example.com"
        parent_id: !terraform.state aws-organizational-unit/plat organizational_unit_id

    aws-account/prod-eu:
      metadata:
        component: aws-account
        enabled: false
        inherits:
          - aws-account/defaults
      dependencies:
        components:
          - component: aws-organizational-unit/eu
      vars:
        name: "{{ .settings.context.tenant }}-prod-eu"
        account_email: "aws+{{ .settings.context.tenant }}-prod-eu@example.com"
        parent_id: !terraform.state aws-organizational-unit/eu organizational_unit_id

    # Service control policies (E3c): one per policy and OU (catalog/aws-scp),
    # each policy named <tenant>-gbl-root-<instance>. Never the organization
    # root (organization_root_id) as a target.

    aws-scp/baseline-core:
      metadata:
        component: aws-scp
        enabled: false
        inherits:
          - aws-scp/baseline-defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: baseline-core
        target_ids:
          - !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-scp/baseline-plat:
      metadata:
        component: aws-scp
        enabled: false
        inherits:
          - aws-scp/baseline-defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: baseline-plat
        target_ids:
          - !terraform.state aws-organizational-unit/plat organizational_unit_id

    aws-scp/security-services-core:
      metadata:
        component: aws-scp
        enabled: false
        inherits:
          - aws-scp/security-services-defaults
      dependencies:
        components:
          - component: aws-organizational-unit/core
      vars:
        name: security-services-core
        target_ids:
          - !terraform.state aws-organizational-unit/core organizational_unit_id

    aws-scp/security-services-plat:
      metadata:
        component: aws-scp
        enabled: false
        inherits:
          - aws-scp/security-services-defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: security-services-plat
        target_ids:
          - !terraform.state aws-organizational-unit/plat organizational_unit_id

    # No region policy on core: Cloud Posse's reference organization attaches
    # the same baseline to core and plat and no region policy at all (legacy
    # account component README); QE3 restricts the workload OUs. The core
    # accounts hold the organization-wide security services' delegated
    # administrators and aggregators, which must reach every region they cover.
    aws-scp/region-plat:
      metadata:
        component: aws-scp
        enabled: false
        inherits:
          - aws-scp/region-plat-defaults
      dependencies:
        components:
          - component: aws-organizational-unit/plat
      vars:
        name: region-plat
        target_ids:
          - !terraform.state aws-organizational-unit/plat organizational_unit_id

    aws-scp/region-eu:
      metadata:
        component: aws-scp
        enabled: false
        inherits:
          - aws-scp/region-eu-defaults
      dependencies:
        components:
          - component: aws-organizational-unit/eu
      vars:
        name: region-eu
        target_ids:
          - !terraform.state aws-organizational-unit/eu organizational_unit_id

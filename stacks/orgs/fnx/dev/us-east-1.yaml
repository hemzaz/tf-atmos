---
# fnx-ue1-dev: the dev account's us-east-1 stack

import:
  # Import base configuration first
  - catalog/_base/defaults

  # Region mixin (the tenant and stage mixins come with the stage defaults)
  - mixins/region/us-east-1

  # Import stage defaults (org defaults, tenant and stage mixins)
  - orgs/fnx/dev/_defaults

  # Import component-specific configurations
  # NOTE: Import paths should NOT include .yaml extension
  - orgs/fnx/dev/us-east-1/components/globals
  - orgs/fnx/dev/us-east-1/components/networking
  - orgs/fnx/dev/us-east-1/components/security
  - orgs/fnx/dev/us-east-1/components/compute
  - orgs/fnx/dev/us-east-1/components/services

vars:
  # Core variables for stack naming
  region: us-east-1
settings:
  environment:
    account: dev
  context:
    tenant: fnx
    stage: dev

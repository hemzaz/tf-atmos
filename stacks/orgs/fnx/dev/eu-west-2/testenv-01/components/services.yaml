---
import:
  - orgs/fnx/dev/eu-west-2/testenv-01/components/globals
  - catalog/apigateway/defaults
  - catalog/cognito/defaults
  - catalog/monitoring/defaults

components:
  terraform:
    # User pool backing the COGNITO_USER_POOLS authorizer on apigateway/main.
    cognito/main:
      metadata:
        component: cognito
        inherits:
          - cognito/defaults
      vars:
        name_prefix: '{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}'
        # Dev only: a deletable pool, so tearing the environment down does not
        # leave one behind. Staging and prod keep deletion protection on.
        deletion_protection: false
        clients:
          api:
            # Confidential client: this consumer is server-side, so it can hold
            # a secret. A browser or mobile client needs generate_secret: false.
            generate_secret: true

    # API Gateway instances
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Main API Gateway for {{ .settings.context.tenant }}-{{ .settings.context.environment }}"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"

        # Methods are addressed by resource_path ("/" is the API root), because
        # a stack cannot know this API's resource IDs before apply.
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "NONE"
          - resource_path: "/api"
            http_method: "ANY"
            authorization: "COGNITO_USER_POOLS"

        # "/" stays MOCK on purpose: it is a liveness endpoint, and a canned 200
        # is the correct answer for one. "/api" is the real entry point and is
        # proxied to Lambda.
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "GET"
            type: "MOCK"
          - resource_path: "/api"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        # Authorizer for the COGNITO_USER_POOLS method above. A method that asks
        # for COGNITO_USER_POOLS without a pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        # Domain Configuration
        domain_name: "api.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        enable_logging: true
        log_retention_days: 30
        create_dashboard: true

        api_name: "main-api"
        zone_id: !terraform.state network/main .zone_ids.main
      dependencies:
        components:
          - component: network/main
          - component: acm/main
          - component: cognito/main
          - component: lambda/data-processor
    apigateway/data:
      metadata:
        component: apigateway
      vars:
        description: "Data API Gateway for {{ .settings.context.tenant }}-{{ .settings.context.environment }}"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "data"
          - path_part: "metrics"

        api_methods:
          - resource_path: "/data"
            http_method: "ANY"
            authorization: "NONE"

        # Real backend: AWS_PROXY hands the whole request to the function and
        # returns whatever it produces. lambda_function_name is required so this
        # component can grant API Gateway permission to invoke it - without that
        # policy the integration applies fine and every call returns 500.
        api_integrations:
          - resource_path: "/data"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        # Domain Configuration
        domain_name: "data.services.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/services .certificate_arns.services_wildcard
        enable_logging: true
        log_retention_days: 30
        create_dashboard: true

        api_name: "data-api"
        zone_id: !terraform.state network/services .zone_ids.data
      dependencies:
        components:
          - component: network/services
          - component: acm/services
          - component: lambda/data-processor

    # Infrastructure instances
    # ECS Fargate cluster for the main apps (was infrastructure/main.ecs).
    # vpc_id/subnet_ids are not passed: an aws_ecs_cluster has neither - those
    # belong to ECS services, which this component does not manage.
    ecs/main:
      metadata:
        component: ecs
      vars:
        cluster_name: "main-apps"
        fargate_only: true
      dependencies:
        components:
          - component: vpc/main

    # Application database (was infrastructure/main.rds)
    rds/main:
      metadata:
        component: rds
      vars:
        identifier: "main-db"
        db_name: "mainapp"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.t3.micro"
        allocated_storage: 5
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
      dependencies:
        components:
          - component: vpc/main

    # Analytics database (was infrastructure/data.rds)
    rds/data:
      metadata:
        component: rds
      vars:
        identifier: "data-db"
        db_name: "datawarehouse"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.r5.large"
        allocated_storage: 20
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services

    # Data processing (was infrastructure/data.lambda). The lambda component is
    # single-function, so one instance per function.
    lambda/data-processor:
      metadata:
        component: lambda
      vars:
        function_name: "data-processor"
        handler: "main.handler"
        runtime: "python3.13"
        memory_size: 512
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services


    # Monitoring instances
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true
        certificate_arns: !terraform.state acm/main .certificate_arns // {}
        certificate_names: !terraform.state acm/main .certificate_domains // {} | keys
        certificate_domains: !terraform.state acm/main [.certificate_domains // {} | .[]]
        certificate_expiry_threshold: 30

        # Alert emails
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

        create_sns_topic: true
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true

        # Certificate monitoring configuration
        certificate_arns: !terraform.state acm/services .certificate_arns // {}
        certificate_expiry_threshold: 30

        # Alert emails - only send critical alerts
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        create_sns_topic: true
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services

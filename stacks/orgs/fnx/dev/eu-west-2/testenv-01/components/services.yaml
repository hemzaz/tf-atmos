---
import:
  - orgs/fnx/dev/eu-west-2/testenv-01/components/globals
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  - catalog/infrastructure/defaults

components:
  terraform:
    # API Gateway instances
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Main API Gateway for {{ .settings.context.tenant }}-{{ .settings.context.environment }}"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"

        # API methods: the old config referenced this API's own resource IDs
        # (apigateway_rest.rest_api_root_resource_id, resource_ids.api), which
        # stack config cannot know before apply. Needs TF support for path-keyed methods.
        # api_methods:
        #   - resource_path: "/"      # GET, authorization NONE
        #   - resource_path: "/api"   # ANY, authorization COGNITO_USER_POOLS

        # Domain Configuration
        domain_name: "api.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        enable_logging: true
        log_retention_days: 30
        create_dashboard: true

        api_name: "main-api"
        zone_id: !terraform.state network/main .zone_ids.main
      dependencies:
        components:
          - component: network/main
          - component: acm/main
    apigateway/data:
      metadata:
        component: apigateway
      vars:
        description: "Data API Gateway for {{ .settings.context.tenant }}-{{ .settings.context.environment }}"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "data"
          - path_part: "metrics"

        # Domain Configuration
        domain_name: "data.services.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/services .certificate_arns.services_wildcard
        enable_logging: true
        log_retention_days: 30
        create_dashboard: true

    # Infrastructure instances
        api_name: "data-api"
        zone_id: !terraform.state network/services .zone_ids.data
      dependencies:
        components:
          - component: network/services
          - component: acm/services
    infrastructure/main:
      metadata:
        component: infrastructure
        enabled: false  # no components/terraform/infrastructure root module yet (see PR notes)
      vars:
        # ECS configuration
        ecs:
          enabled: true
          fargate_only: true
          cluster_name: "main-apps"
          vpc_id: !terraform.state vpc/main .vpc_id
          subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # RDS configuration
        rds:
          enabled: true
          identifier: "main-db"
          instance_class: "db.t3.micro"
          allocated_storage: 5
          db_name: "mainapp"
          engine: "{{ .settings.environment.rds_engine }}"
          engine_version: "{{ .settings.environment.rds_engine_version }}"
          vpc_id: !terraform.state vpc/main .vpc_id
          subnet_ids: !terraform.state vpc/main .private_subnet_ids

    infrastructure/data:
      metadata:
        component: infrastructure
        enabled: false  # no components/terraform/infrastructure root module yet (see PR notes)
      vars:
        # ECS configuration (disabled for data)
        ecs:
          enabled: false

        # Data-specific RDS
        rds:
          enabled: true
          identifier: "data-db"
          instance_class: "db.r5.large"
          allocated_storage: 20
          db_name: "datawarehouse"
          engine: "{{ .settings.environment.rds_engine }}"
          engine_version: "{{ .settings.environment.rds_engine_version }}"
          vpc_id: !terraform.state vpc/services .vpc_id
          subnet_ids: !terraform.state vpc/services .private_subnet_ids

        # Data-specific Lambda functions
        lambda:
          enabled: true
          function_name: "data-processor"
          memory_size: 512
          runtime: "python3.9"
          vpc_id: !terraform.state vpc/services .vpc_id
          subnet_ids: !terraform.state vpc/services .private_subnet_ids

    # Monitoring instances
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true
        certificate_arns: !terraform.state acm/main .certificate_arns // {}
        certificate_names: !terraform.state acm/main .certificate_domains // {} | keys
        certificate_domains: !terraform.state acm/main [.certificate_domains // {} | .[]]
        certificate_expiry_threshold: 30

        # Alert emails
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

        create_sns_topic: true
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true

        # Certificate monitoring configuration
        certificate_arns: !terraform.state acm/services .certificate_arns // {}
        certificate_expiry_threshold: 30

        # Alert emails - only send critical alerts
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        create_sns_topic: true
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services

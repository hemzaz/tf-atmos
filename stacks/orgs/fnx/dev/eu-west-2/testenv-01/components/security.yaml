---
import:
  - orgs/fnx/dev/eu-west-2/testenv-01/components/globals
  - catalog/iam/defaults
  - catalog/backend/defaults
  - catalog/kms/defaults
  - catalog/secretsmanager/defaults
  - catalog/acm/defaults
  - catalog/cloudtrail/defaults
  - catalog/awsconfig/defaults
  - catalog/guardduty/defaults
  - catalog/securityhub/defaults
  - catalog/security-monitoring/defaults

components:
  terraform:
    # IAM role instances
    iam/dev:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        # AWS account and role settings
        account_id: "234567890123"
        cross_account_role_name: "testenv-01-dev-fnx-CrossAccountRole"
        policy_name: "testenv-01-dev-fnx-CrossAccountPolicy"
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"

      providers:
        aws:
          assume_role:
            role_arn: arn:aws:iam::234567890123:role/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-TerraformExecutionRole
      dependencies:
        components:
          - component: backend/main
    # GitHub Actions OIDC role. This is what repo variable AWS_PLAN_ROLE_ARN
    # must point at before CI can run a real plan; every AWS job currently skips
    # because it is unset. The trust policy is pinned to exact subject claims -
    # never a wildcard - so no other repo can assume it.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: true
        # Roles become <prefix>-plan and <prefix>-apply. Naming convention from
        # catalog/iam/defaults.yaml, so context.environment (the instance name)
        # is the right key here -- unlike the `environment` variable, a tier.
        ci_role_name_prefix: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-ci"
        # Deliberately OFF. AWS_PLAN_ROLE_ARN needs only the PLAN role, which
        # ships safe: ReadOnlyAccess by default, admin policies rejected at
        # variables.tf:295. The APPLY role has no such guardrail and no
        # defensible default -- it deploys the iam component itself, so
        # PowerUserAccess+IAMFullAccess is admin with extra steps. Enable it
        # only with a scoped customer-managed policy and a permissions boundary.
        ci_apply_role_enabled: false
        ci_apply_role_environments:
          - "fnx-dev-testenv-01"
        # Lets the plan role take the .tflock rather than only read state.
        # backend/main is already a declared dependency below.
        ci_state_bucket_name: !terraform.state backend/main .backend_bucket
        ci_state_kms_key_arn: !terraform.state backend/main .backend_kms_key_arn
      dependencies:
        components:
          - component: backend/main
    backend/main:
      metadata:
        component: backend
        inherits:
          - backend
      vars:
        bucket_name: "fnx-terraform-state"
        iam_role_name: "fnx-terraform-backend-role"

    # ==========================================================================
    # KMS - customer-managed key for Secrets Manager and other encrypted services
    # ==========================================================================
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Dev main encryption key (Secrets Manager, EBS, RDS)
        alias_name: testenv-01-main  # without the alias/ prefix
        deletion_window_in_days: 7   # non-prod: shorter window, faster teardown

    acm/main:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          main_wildcard:
            domain_name: "*.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    acm/services:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          services_wildcard:
            domain_name: "*.services.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    # Secrets Manager instances
    secretsmanager/app:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/defaults
      vars:
        secrets:
          app_credentials:
            name: "credentials"
            description: "Application credentials"
            path: "app"
            generate_random_password: true
          app_keys:
            name: "api-keys"
            description: "API integration keys"
            path: "app/api"
            generate_random_password: true

        context_name: "app"
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        secrets:
          istio_certificates:
            name: "istio-certificates"
            description: "TLS certificates for Istio Gateway"
            path: "certificates"
            secret_data: |-
              {
                "tls.crt_ssm_parameter": "/fnx/certificates/example.com-wildcard/cert",
                "reference_only": "true"
              }
        context_name: "infra"

    # ==========================================================================
    # CloudTrail - the account's multi-region trail (S3 + CloudWatch Logs,
    # both encrypted with kms/main). security-monitoring's CIS metric filters
    # read its log group.
    # ==========================================================================
    cloudtrail/main:
      metadata:
        component: cloudtrail
        inherits:
          - cloudtrail/defaults

    # ==========================================================================
    # AWS Config - the recorder Security Hub's FSBP/CIS controls evaluate on.
    # ==========================================================================
    awsconfig/main:
      metadata:
        component: awsconfig
        inherits:
          - awsconfig/defaults

    # ==========================================================================
    # GuardDuty - owns the detector (security-monitoring only consumes it).
    # Catalog defaults: S3 protection on; EKS audit logs and EBS malware
    # scanning stay off in non-prod to avoid per-event/per-GB charges.
    # ==========================================================================
    guardduty/main:
      metadata:
        component: guardduty
        inherits:
          - guardduty/defaults

    # ==========================================================================
    # Security Hub - owns the hub (security-monitoring only consumes it).
    # Default standards (AWS FSBP + CIS 1.2.0) only; no PCI DSS in non-prod.
    # ==========================================================================
    securityhub/main:
      metadata:
        component: securityhub
        inherits:
          - securityhub/defaults

    # ==========================================================================
    # Security finding routing (GuardDuty + Security Hub -> SNS)
    # ==========================================================================
    security-monitoring/main:
      metadata:
        component: security-monitoring
        inherits:
          - security-monitoring/defaults

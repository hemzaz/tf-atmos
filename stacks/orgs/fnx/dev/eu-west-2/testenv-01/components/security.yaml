---
import:
  - orgs/fnx/dev/eu-west-2/testenv-01/components/globals
  - catalog/iam/defaults
  - catalog/backend/defaults
  - catalog/secretsmanager/defaults
  - catalog/acm/defaults

components:
  terraform:
    # IAM role instances
    iam/dev:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        # AWS account and role settings
        account_id: "234567890123"
        cross_account_role_name: "testenv-01-dev-fnx-CrossAccountRole"
        policy_name: "testenv-01-dev-fnx-CrossAccountPolicy"
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"

      providers:
        aws:
          assume_role:
            role_arn: arn:aws:iam::234567890123:role/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-TerraformExecutionRole
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
        enabled: false  # iam module only manages a cross-account role; CI/EKS roles need their own module
    backend/main:
      metadata:
        component: backend
        inherits:
          - backend
      vars:
        bucket_name: "fnx-terraform-state"
        iam_role_name: "fnx-terraform-backend-role"
        iam_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/fnx-terraform-backend-role"
        state_file_key: "{{ .settings.context.environment }}/{{ .atmos_component }}/terraform.tfstate"
    acm/main:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          main_wildcard:
            domain_name: "*.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    acm/services:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          services_wildcard:
            domain_name: "*.services.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    # Secrets Manager instances
    secretsmanager/app:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/defaults
      vars:
        secrets:
          app_credentials:
            name: "credentials"
            description: "Application credentials"
            path: "app"
            generate_random_password: true
          app_keys:
            name: "api-keys"
            description: "API integration keys"
            path: "app/api"
            generate_random_password: true

        context_name: "app"
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        secrets:
          istio_certificates:
            name: "istio-certificates"
            description: "TLS certificates for Istio Gateway"
            path: "certificates"
            secret_data: |-
              {
                "tls.crt_ssm_parameter": "/fnx/certificates/example.com-wildcard/cert",
                "reference_only": "true"
              }
        context_name: "infra"

---
# Networking component configurations for testenv-01 environment
# Defines VPC and network resources

import:
  # Import hierarchy - no .yaml extensions
  - orgs/fnx/dev/eu-west-2/testenv-01/components/globals
  - catalog/vpc/defaults
  - catalog/network/defaults

components:
  terraform:
    # VPC instances
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "10.0.0.0/16"
        private_subnets:
          - "10.0.1.0/24"
          - "10.0.2.0/24"
          - "10.0.3.0/24"
        public_subnets:
          - "10.0.101.0/24"
          - "10.0.102.0/24"
          - "10.0.103.0/24"

        vpc_flow_logs_enabled: "{{ .settings.environment.enable_vpc_flow_logs }}"
        # kms/main's allow_cloudwatch_logs already grants every log group in
        # this account and region, so the flow-log group uses it instead of
        # creating its own per-VPC key.
        flow_logs_kms_key_arn: !terraform.state kms/main .key_arn

        # Load balancer subnet discovery for the AWS Load Balancer Controller that
        # catalog/eks-addons enables on eks/main, as in Cloud Posse's
        # terraform-aws-eks-cluster example: role tags per tier, and the cluster
        # tag on both. The eks component names the cluster "<Environment>-<name>".
        public_subnets_additional_tags:
          "kubernetes.io/role/elb": "1"
          "kubernetes.io/cluster/{{ .vars.tags.Environment }}-main": "shared"
        private_subnets_additional_tags:
          "kubernetes.io/role/internal-elb": "1"
          "kubernetes.io/cluster/{{ .vars.tags.Environment }}-main": "shared"
      dependencies:
        components:
          - component: kms/main
    vpc/services:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "10.1.0.0/16"
        private_subnets:
          - "10.1.1.0/24"
          - "10.1.2.0/24"
          - "10.1.3.0/24"
        public_subnets:
          - "10.1.101.0/24"
          - "10.1.102.0/24"
          - "10.1.103.0/24"
        vpc_flow_logs_enabled: "{{ .settings.environment.enable_vpc_flow_logs }}"
        # kms/main's allow_cloudwatch_logs already grants every log group in
        # this account and region, so the flow-log group uses it instead of
        # creating its own per-VPC key.
        flow_logs_kms_key_arn: !terraform.state kms/main .key_arn

        # Load balancer subnet discovery for the AWS Load Balancer Controller that
        # catalog/eks-addons enables on eks/data, as in Cloud Posse's
        # terraform-aws-eks-cluster example: role tags per tier, and the cluster
        # tag on both. The eks component names the cluster "<Environment>-<name>".
        public_subnets_additional_tags:
          "kubernetes.io/role/elb": "1"
          "kubernetes.io/cluster/{{ .vars.tags.Environment }}-data": "shared"
        private_subnets_additional_tags:
          "kubernetes.io/role/internal-elb": "1"
          "kubernetes.io/cluster/{{ .vars.tags.Environment }}-data": "shared"
      dependencies:
        components:
          - component: kms/main

    # Network resources for main VPC
    network/main:
      metadata:
        component: dns
        inherits:
          - dns
      vars:
        root_domain: fnx.example.com
        create_root_zone: false
        multi_account_dns_delegation: false
        zones:
          main:
            name: "fnx.example.com"
            comment: "Main zone for fnx environment"
            force_destroy: true
            enable_query_logging: true
          internal:
            name: "internal.fnx.example.com"
            comment: "Internal DNS for fnx environment"
            force_destroy: true
            vpc_associations:
              - !terraform.state vpc/main .vpc_id

        # Define essential DNS records
        records:
          www_main:
            zone_name: "main"
            name: "www.fnx.example.com"
            type: "A"
            ttl: 300
            records: ["10.0.101.100"]
          db_internal:
            zone_name: "internal"
            name: "db.internal.fnx.example.com"
            type: "A"
            ttl: 60
            records: ["10.0.1.50"]
      dependencies:
        components:
          - component: vpc/main

    # Network resources for services VPC
    network/services:
      metadata:
        component: dns
        inherits:
          - dns
      vars:
        root_domain: fnx.example.com
        create_root_zone: false
        multi_account_dns_delegation: false
        zones:
          services:
            name: "services.fnx.example.com"
            comment: "Services zone for fnx environment"
            force_destroy: true
          data:
            name: "data.services.fnx.example.com"
            comment: "Data services DNS zone"
            force_destroy: true

        # Define essential DNS records
        records:
          api_services:
            zone_name: "services"
            name: "api.services.fnx.example.com"
            type: "CNAME"
            ttl: 300
            records: ["api-internal.services.fnx.example.com"]

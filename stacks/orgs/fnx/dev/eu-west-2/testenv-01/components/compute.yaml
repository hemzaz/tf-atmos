---
import:
  - orgs/fnx/dev/eu-west-2/testenv-01/components/globals
  - catalog/eks/defaults
  - catalog/ec2/defaults
  - catalog/external-secrets/defaults

components:
  terraform:
    # EKS instances
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        clusters:
          main:
            kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
            endpoint_private_access: true
            endpoint_public_access: "{{ .settings.environment.eks_public_access }}"
            node_groups:
              workers:
                enabled: true
                instance_types: ["t3.medium"]
                desired_size: 2
                min_size: 1
                max_size: 4
                labels:
                  role: worker
              monitoring:
                enabled: true
                instance_types: ["t3.large"]
                desired_size: 1
                min_size: 1
                max_size: 2
                labels:
                  role: monitoring
                taints:
                  - key: dedicated
                    value: monitoring
                    effect: "NO_SCHEDULE"

      dependencies:
        components:
          - component: vpc/main
    eks/data:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
        clusters:
          data:
            kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
            endpoint_private_access: true
            endpoint_public_access: false
            node_groups:
              data-workers:
                enabled: true
                instance_types: ["m5.large"]
                desired_size: 2
                min_size: 2
                max_size: 4
                labels:
                  role: data

    # EC2 instances
      dependencies:
        components:
          - component: vpc/services
    ec2/bastion:
      metadata:
        component: ec2
        inherits:
          - ec2
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        create_ssh_keys: true
        store_ssh_keys_in_secrets_manager: true
        ssh_key_algorithm: "RSA"
        ssh_key_rsa_bits: 4096
        instances:
          bastion:
            instance_type: "t3.small"
            key_name: "bastion-ssh-key"
            subnet_id: !terraform.state vpc/main .public_subnet_ids[0]
            allowed_ingress_rules:
              - from_port: 22
                to_port: 22
                protocol: "tcp"
                cidr_blocks: ["10.0.0.0/16"]
                description: "SSH access from company VPN"
            allowed_egress_rules:
              - from_port: 443
                to_port: 443
                protocol: "tcp"
                cidr_blocks: ["0.0.0.0/0"]
                description: "HTTPS outbound access"

      dependencies:
        components:
          - component: vpc/main
    ec2/app-server:
      metadata:
        component: ec2
        inherits:
          - ec2
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        instances:
          app-server:
            instance_type: "t3.medium"
            key_name: !terraform.state ec2/bastion .ssh_key_pair
            subnet_id: !terraform.state vpc/main .private_subnet_ids[0]
            root_volume_size: 50
            allowed_ingress_rules:
              - from_port: 8080
                to_port: 8080
                protocol: "tcp"
                cidr_blocks: ["10.0.0.0/16"]
                description: "Application access"

    # External secrets operator instances
      dependencies:
        components:
          - component: vpc/main
          - component: ec2/bastion
    external-secrets/main:
      metadata:
        component: external-secrets
        inherits:
          - external-secrets/defaults
      vars:
        enabled: "{{ .settings.environment.use_external_secrets }}"
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/main .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/main .eks_cluster_identity_oidc_issuer

        # Config options
        namespace: "external-secrets"
        service_account_name: "external-secrets"
        chart_version: "0.9.9"
        create_default_cluster_secret_store: true
        create_certificate_secret_store: true
      dependencies:
        components:
          - component: eks/main
    external-secrets/data:
      metadata:
        component: external-secrets
        inherits:
          - external-secrets/defaults
      vars:
        enabled: "{{ .settings.environment.use_external_secrets }}"
        cluster_name: !terraform.state eks/data .eks_cluster_id
        host: !terraform.state eks/data .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/data .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/data .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/data .eks_cluster_identity_oidc_issuer

        # Config options
        namespace: "external-secrets"
        service_account_name: "external-secrets"
        chart_version: "0.9.9"
        create_default_cluster_secret_store: true
        create_certificate_secret_store: false
      dependencies:
        components:
          - component: eks/data

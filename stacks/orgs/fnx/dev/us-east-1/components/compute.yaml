---
# Every compute instance's wiring is catalog/<c>/<i> (ec2/app-server:
# catalog/ec2/app-server-dev), shared with fnx-ue1-staging; this file keeps
# dev's per-stage values.
import:
  - orgs/fnx/dev/us-east-1/components/globals
  - catalog/eks/main
  - catalog/eks/data
  - catalog/github-runners/main
  - catalog/ec2/bastion
  - catalog/ec2/app-server-dev
  - catalog/external-secrets/main
  - catalog/external-secrets/data
  - catalog/eks-addons/main
  - catalog/eks-addons/data
  - catalog/eks-backend-services/main

components:
  terraform:
    # EKS instances: one cluster each
    eks/main:
      vars:
        cluster_endpoint_public_access: "{{ .settings.environment.eks_public_access }}"
        node_groups:
          workers:
            desired_group_size: 2
            min_group_size: 1
            max_group_size: 4
    eks/data:
      vars:
        node_groups:
          data-workers:
            kubernetes_labels:
              role: data

    # EC2 instances: one instance each
    ec2/bastion:
      vars:
        allowed_ingress_rules:
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["10.0.0.0/16"]
            description: "SSH access from company VPN"
        allowed_egress_rules:
          - from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS outbound access"

    # External secrets operator instances
    external-secrets/main:
      vars:
        enabled: "{{ .settings.environment.use_external_secrets }}"
    external-secrets/data:
      vars:
        enabled: "{{ .settings.environment.use_external_secrets }}"

    # EKS add-ons: Let's Encrypt's staging ACME server in dev.
    eks-addons/main:
      vars:
        clusters:
          main:
            cert_manager_acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    eks-addons/data:
      vars:
        clusters:
          data:
            cert_manager_acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory"

---
# Every services instance's wiring is catalog/<c>/<i> (rds/main, rds/data,
# lambda/data-processor and monitoring/data: the -dev flavors); this file
# keeps dev's per-stage values.
import:
  - orgs/fnx/dev/us-east-1/components/globals
  - catalog/apigateway/main
  - catalog/apigateway/data
  - catalog/cognito/main
  - catalog/monitoring/main
  - catalog/monitoring/data-dev
  - catalog/s3/lambda-artifacts
  - catalog/cost-optimization/main
  - catalog/rds/main-dev
  - catalog/rds/data-dev
  - catalog/ecs/main
  - catalog/lambda/data-processor-dev

components:
  terraform:
    cognito/main:
      vars:
        # Dev only: a deletable pool, so tearing the environment down does not
        # leave one behind. Staging and prod keep deletion protection on.
        deletion_protection: false

    apigateway/main:
      vars:
        description: "Main API Gateway for {{ .settings.context.tenant }}-{{ .settings.prefix }}"
        api_resources:
          - path_part: "api"
          - path_part: "auth"
        log_retention_days: 30

    apigateway/data:
      vars:
        api_name: "data-api"
        description: "Data API Gateway for {{ .settings.context.tenant }}-{{ .settings.prefix }}"
        api_resources:
          - path_part: "data"
          - path_part: "metrics"
        log_retention_days: 30

    ecs/main:
      vars:
        cluster_name: "main-apps"

    monitoring/main:
      vars:
        # Alert emails
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

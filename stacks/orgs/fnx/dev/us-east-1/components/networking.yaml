---
# Networking component configurations for fnx-ue1-dev
# Defines VPC and network resources
# The instances' wiring, shared with fnx-ue1-staging, is catalog/vpc/<i> and
# catalog/network/<i>; this file keeps the CIDRs, subnets and per-stage values.

import:
  # Import hierarchy - no .yaml extensions
  - orgs/fnx/dev/us-east-1/components/globals
  - catalog/vpc/main
  - catalog/vpc/services
  - catalog/network/vpc-peering
  - catalog/network/main
  - catalog/network/services

# The two VPCs' CIDRs, in one place: each vpc instance's
# ipv4_primary_cidr_block, the other one's private_network_acl_peer_cidr_blocks
# and network/vpc-peering's routes all read them. Literals, not
# !terraform.state <vpc> .vpc_cidr: vpc/main and vpc/services would then
# read each other, a cycle.
settings:
  network:
    vpc_cidrs:
      main: "10.0.0.0/16"
      services: "10.1.0.0/16"

components:
  terraform:
    # VPC instances
    vpc/main:
      vars:
        private_subnets:
          - "10.0.1.0/24"
          - "10.0.2.0/24"
          - "10.0.3.0/24"
        public_subnets:
          - "10.0.101.0/24"
          - "10.0.102.0/24"
          - "10.0.103.0/24"

        vpc_flow_logs_enabled: "{{ .settings.environment.enable_vpc_flow_logs }}"
    vpc/services:
      vars:
        private_subnets:
          - "10.1.1.0/24"
          - "10.1.2.0/24"
          - "10.1.3.0/24"
        public_subnets:
          - "10.1.101.0/24"
          - "10.1.102.0/24"
          - "10.1.103.0/24"
        vpc_flow_logs_enabled: "{{ .settings.environment.enable_vpc_flow_logs }}"

    # Network resources for main VPC
    network/main:
      vars:
        zones:
          main:
            comment: "Main zone for fnx environment"
          internal:
            comment: "Internal DNS for fnx environment"
        records:
          www_main:
            records: ["10.0.101.100"]
          db_internal:
            records: ["10.0.1.50"]

    # Network resources for services VPC
    network/services:
      vars:
        zones:
          services:
            comment: "Services zone for fnx environment"
          data:
            comment: "Data services DNS zone"

---
# Every security instance's wiring is catalog/<c>/<i> (shared with
# fnx-ue1-staging) and its -dev flavors; this file keeps their per-stage
# values.
import:
  - orgs/fnx/dev/us-east-1/components/globals
  - catalog/iam/dev
  - catalog/iam/ci
  - catalog/kms/main-dev
  - catalog/secretsmanager/app
  - catalog/secretsmanager/infra-dev
  - catalog/acm/main
  - catalog/acm/services
  - catalog/cloudtrail/main
  - catalog/awsconfig/main
  - catalog/guardduty/main
  - catalog/securityhub/main
  - catalog/inspector2/main
  - catalog/apigateway-account/main
  - catalog/security-monitoring/main
  - catalog/backup/main

components:
  terraform:
    # ==========================================================================
    # KMS - customer-managed key for Secrets Manager and other encrypted services
    # ==========================================================================
    kms/main:
      vars:
        description: Dev main encryption key (Secrets Manager, EBS, RDS)

    # Secrets Manager instances
    secretsmanager/app:
      vars:
        secrets:
          app_credentials:
            name: "credentials"
            description: "Application credentials"
            path: "app"
            generate_random_password: true
          app_keys:
            name: "api-keys"
            description: "API integration keys"
            path: "app/api"
            generate_random_password: true

    secretsmanager/infra:
      vars:
        secrets:
          istio_certificates:
            name: "istio-certificates"
            description: "TLS certificates for Istio Gateway"
            path: "certificates"
            # The value comes from the ephemeral secret_data variable (env,
            # catalog/secretsmanager/infra-dev.yaml), written write-only:
            # never in plan or state.
            static_value: true

    # ==========================================================================
    # AWS Backup - short retention in dev.
    # ==========================================================================
    backup/main:
      vars:
        daily_retention_days: 7
        weekly_retention_days: 14
        monthly_retention_days: 30

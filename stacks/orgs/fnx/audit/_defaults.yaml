---
# =============================================================================
# Audit Account Defaults
# =============================================================================
# Cloud Posse's core "audit" account (owner decision Q1): the log archive that
# CloudTrail and AWS Config deliver to (per-residency buckets, owner decision
# QE7), core-<region>-audit in Cloud Posse's reference architecture. Its
# components arrive in Wave E (E5); until then its stacks hold only
# aws-account-settings (below).
#
# Laid out like the management account (stacks/orgs/fnx/root/_defaults.yaml):
# the tenant stays fnx, the account is the stage, the region code the
# environment (owner decision QE5), so the home-region stack is fnx-ue1-audit.
# =============================================================================

import:
  - orgs/fnx/_defaults
  - mixins/tenant/fnx
  - catalog/aws-account-settings/main

settings:
  environment:
    account: audit
    # From the account map (stacks/orgs/fnx/_defaults.yaml), keyed by `account`.
    account_id: '{{ index .settings.account_map.full_account_map .settings.environment.account }}'
  context:
    stage: audit
  # Kept out of the CI plan/deploy/drift matrices (ci-stacks.py), like root:
  # no CI role is trusted in a core account until E4 defines who applies it.
  github:
    actions_enabled: false

# Account settings (E3d, catalog/aws-account-settings/main, imported above):
# this account's alias, S3 account public access block and each stack's
# region settings. The account is created by fnx-gbl-root's aws-account
# instance (docs/OPERATIONS.md, "Bootstrap order"). This stage's state goes
# through fnx-ue1-root's root role, whose root_write holds each of its stacks'
# pattern pair and trusts this account's OrganizationAccountAccessRole, the
# first way in until E4's Identity Center roles. A second region's stack of
# this account also imports main-standby, after these defaults, so the
# account-wide settings stay with this one.

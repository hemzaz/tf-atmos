---
# =============================================================================
# Audit Account Defaults
# =============================================================================
# Cloud Posse's core "audit" account (owner decision Q1): the log archive that
# CloudTrail and AWS Config deliver to (per-residency buckets, owner decision
# QE7), core-<region>-audit in Cloud Posse's reference architecture. Its
# components arrive in Wave E (E5); until then its stacks hold no instance.
#
# Laid out like the management account (stacks/orgs/fnx/root/_defaults.yaml):
# the tenant stays fnx, the account is the stage, the region code the
# environment (owner decision QE5), so the home-region stack is fnx-ue1-audit.
# =============================================================================

import:
  - orgs/fnx/_defaults
  - mixins/tenant/fnx

settings:
  environment:
    account: audit
    # From the account map (stacks/orgs/fnx/_defaults.yaml), keyed by `account`.
    account_id: '{{ index .settings.account_map.full_account_map .settings.environment.account }}'
  context:
    stage: audit
  # Kept out of the CI plan/deploy/drift matrices (ci-stacks.py), like root:
  # no CI role is trusted in a core account until E4 defines who applies it.
  github:
    actions_enabled: false

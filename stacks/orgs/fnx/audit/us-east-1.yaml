---
# =============================================================================
# fnx-ue1-audit - the audit account's home-region stack
# =============================================================================
# No instance of its own, and one enabled instance: its stage defaults'
# aws-account-settings (stacks/orgs/fnx/audit/_defaults.yaml); the US
# log-archive components (E5) land here. Its state goes to fnx-ue1-root's
# bucket through the backend's root role (stacks/orgs/fnx/_defaults.yaml),
# whose root_write holds this stack's pattern pair (check-state-keys.py) and
# trusts the audit account's OrganizationAccountAccessRole: the provider guard
# needs credentials in the audit account, and that role is the way in until
# E4's Identity Center roles.
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/us-east-1
  - orgs/fnx/audit/_defaults

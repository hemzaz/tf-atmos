---
# =============================================================================
# fnx-ew1-audit - the audit account's eu-west-1 stack
# =============================================================================
# A core-account stack (owner decision QE5): no instance of its own; its stage
# defaults' aws-account-settings is its one enabled instance until the core
# components land. Its state goes to fnx-ew1-root's bucket
# through the backend's root role (stacks/orgs/fnx/_defaults.yaml),
# whose root_write trusts the management-account administrator and the
# audit account's OrganizationAccountAccessRole, and its stage
# defaults keep it out of every CI matrix (github.actions_enabled: false). The
# scaffold's wire hook added this stack's pattern pair to root_write
# (check-state-keys.py).
#
# An EU core stack (owner decision 2026-11-03: stages audit and security in
# eu-west-1, scripts/stack-wiring.py EU_CORE_STAGES/EU_CORE_REGIONS), in the
# same shared audit account: GDPR-scoped (check-data-residency.py),
# so tagged Compliance "pci-sox-gdpr" and its state in the EU backend
# (fnx-ew1-root, stacks/orgs/fnx/root/eu-west-1.yaml), whose
# root_write trusts the audit account's OrganizationAccountAccessRole.
#
# Not the account's home region (us-east-1, fnx-ue1-audit):
# aws-account-settings/main-standby, after the stage defaults, leaves the
# account-wide IAM account alias and S3 account public access block to the
# home-region stack (check-lane-names.py SINGLETONS).
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/eu-west-1
  - orgs/fnx/audit/_defaults
  - catalog/aws-account-settings/main-standby

vars:
  tags:
    Compliance: "pci-sox-gdpr"

settings:
  # The EU backend, overriding every settings.tfstate key (literal
  # .settings.context.* references only, see stacks/orgs/fnx/_defaults.yaml),
  # as fnx-ew1-root's own: the state stays in eu-west-1, replicated to
  # eu-central-1.
  tfstate:
    region: eu-west-1
    replica_region: eu-central-1
    bucket: '{{ .settings.context.tenant }}-ew1-terraform-state'
    role_prefix: '{{ .settings.context.tenant }}-ew1-terraform-backend'
    stack: '{{ .settings.context.tenant }}-ew1-root'

---
# =============================================================================
# Network Account Defaults
# =============================================================================
# Cloud Posse's core "network" account (owner decision Q1): the primary DNS
# zone (aws-dns-primary, E6b) and, in a later wave, the Transit Gateway hub
# (aws-tgw-hub; QE6 moved TGW out of Wave E), core-<region>-network in Cloud
# Posse's reference architecture. Its stacks hold no enabled instance yet:
# aws-account-settings (below) waits for E3e, and the primary DNS instances
# (catalog/aws-dns-primary/main) for a real apex and account IDs.
#
# Laid out like the management account (stacks/orgs/fnx/root/_defaults.yaml):
# the tenant stays fnx, the account is the stage, the region code the
# environment (owner decision QE5), so the home-region stack is fnx-ue1-network.
# =============================================================================

import:
  - orgs/fnx/_defaults
  - mixins/tenant/fnx
  - catalog/aws-account-settings/main
  - catalog/aws-dns-primary/main

settings:
  environment:
    account: network
    # From the account map (stacks/orgs/fnx/_defaults.yaml), keyed by `account`.
    account_id: '{{ index .settings.account_map.full_account_map .settings.environment.account }}'
    # The US apex (owner decision (a), 2026-10-31): aws-dns-primary's zone;
    # each stage's domain_name is <stage>.<this> (aws-dns-delegated). A
    # placeholder base until the owner sets the real domain.
    domain_name: "fnx.example.com"
  context:
    stage: network
  # Kept out of the CI plan/deploy/drift matrices (ci-stacks.py), like root:
  # no CI role is trusted in a core account until E4 defines who applies it.
  github:
    actions_enabled: false

# Account settings (E3d, catalog/aws-account-settings/main): this account's
# alias, S3 account public access block and each stack's region settings.
# Disabled until E3e: the account is created by
# fnx-gbl-root's aws-account instance, and this stage's state goes through
# fnx-ue1-root's root role, which until then trusts no principal in this
# account (stacks/orgs/fnx/_defaults.yaml). E3e enables it, adding the
# stack's pattern pair and the account's operator role to root_write. A
# second region's stack of this account also imports main-standby, after
# these defaults, so the account-wide settings stay with this one.
components:
  terraform:
    aws-account-settings:
      metadata:
        enabled: false

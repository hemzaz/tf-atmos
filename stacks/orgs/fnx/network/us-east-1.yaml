---
# =============================================================================
# fnx-ue1-network - the network account's home-region stack
# =============================================================================
# No instance of its own, and one enabled instance: its stage defaults'
# aws-account-settings (stacks/orgs/fnx/network/_defaults.yaml); the primary
# DNS components (E6) land here. Its state goes to fnx-ue1-root's bucket
# through the backend's root role (stacks/orgs/fnx/_defaults.yaml), whose
# root_write holds this stack's pattern pair (check-state-keys.py) and trusts
# the network account's OrganizationAccountAccessRole: the provider guard needs
# credentials in the network account, and that role is the way in until E4's
# Identity Center roles.
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/us-east-1
  - orgs/fnx/network/_defaults

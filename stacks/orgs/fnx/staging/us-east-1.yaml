---
# =============================================================================
# Staging-01 Stack Configuration
# =============================================================================
# Production-like staging environment for final validation before production
# =============================================================================

import:
  # Import base configuration first
  - catalog/_base/defaults

  # Region mixin (the tenant and stage mixins come with the stage defaults)
  - mixins/region/us-east-1

  # Import stage defaults (org defaults, tenant and stage mixins)
  - orgs/fnx/staging/_defaults

  # Import component-specific configurations
  - orgs/fnx/staging/us-east-1/components/globals
  - orgs/fnx/staging/us-east-1/components/networking
  - orgs/fnx/staging/us-east-1/components/security
  - orgs/fnx/staging/us-east-1/components/compute
  - orgs/fnx/staging/us-east-1/components/services

vars:
  # Core variables for stack naming
  region: us-east-1

settings:
  environment:
    account: staging
  context:
    tenant: fnx
    environment: staging-01
    stage: staging

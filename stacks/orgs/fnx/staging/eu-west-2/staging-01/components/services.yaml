---
# =============================================================================
# Services Component Configurations for Staging-01 Environment
# =============================================================================
# API Gateway, Lambda, monitoring, and infrastructure services
# =============================================================================

import:
  - orgs/fnx/staging/eu-west-2/staging-01/components/globals
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  - catalog/infrastructure/defaults

components:
  terraform:
    # ==========================================================================
    # API Gateway - Main API
    # ==========================================================================
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Main API Gateway for staging environment"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"

        # API methods: the old config referenced this API's own resource IDs
        # (apigateway_rest.rest_api_root_resource_id, resource_ids.api), which
        # stack config cannot know before apply. Needs TF support for path-keyed methods.
        # api_methods:
        #   - resource_path: "/"      # GET, authorization NONE
        #   - resource_path: "/api"   # ANY, authorization COGNITO_USER_POOLS

        # Domain Configuration
        domain_name: "api.staging.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        throttling_burst_limit: 500
        throttling_rate_limit: 1000

        # Logging and monitoring
        enable_logging: true
        log_retention_days: 14
        create_dashboard: true

        # CORS
        tags:
          Service: api-gateway
          Tier: edge

    # ==========================================================================
    # API Gateway - Data API
    # ==========================================================================
        api_name: "main-api"
        zone_id: !terraform.state network/main .zone_ids.main
        cors_configuration:
          allow_origins: ["*"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers:
            - '*'
          expose_headers: []
          max_age: 300
          allow_credentials: false
      dependencies:
        components:
          - component: network/main
          - component: acm/main
    apigateway/data:
      metadata:
        component: apigateway
      vars:
        description: "Data API Gateway for staging"
        stage_name: "v1"

        api_resources:
          - path_part: "data"
          - path_part: "metrics"
          - path_part: "analytics"

        domain_name: "data.services.staging.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/services .certificate_arns.services_wildcard
        throttling_burst_limit: 300
        throttling_rate_limit: 500

        enable_logging: true
        log_retention_days: 14
        create_dashboard: true

        tags:
          Service: data-api
          Tier: backend

    # ==========================================================================
    # Infrastructure - Main Application Stack
    # ==========================================================================
        api_name: "data-api"
        zone_id: !terraform.state network/services .zone_ids.data
      dependencies:
        components:
          - component: network/services
          - component: acm/services
    infrastructure/main:
      metadata:
        component: infrastructure
        enabled: false  # no components/terraform/infrastructure root module yet (see PR notes)
      vars:
        # ECS Fargate cluster
        ecs:
          enabled: true
          fargate_only: true
          cluster_name: "staging-main-apps"
          vpc_id: !terraform.state vpc/main .vpc_id
          subnet_ids: !terraform.state vpc/main .private_subnet_ids
          enable_container_insights: true

        # RDS PostgreSQL
        rds:
          enabled: true
          identifier: "staging-main-db"
          engine: "{{ .settings.environment.rds_engine }}"
          engine_version: "{{ .settings.environment.rds_engine_version }}"
          instance_class: "db.t3.medium"
          allocated_storage: 20
          max_allocated_storage: 100
          db_name: "stagingapp"
          multi_az: false  # Single AZ for staging
          deletion_protection: false
          skip_final_snapshot: true

          # Security
          storage_encrypted: true
          iam_database_authentication_enabled: true

          # Backup
          backup_retention_period: 7
          backup_window: "03:00-04:00"
          maintenance_window: "Mon:04:00-Mon:05:00"

          # Performance
          performance_insights_enabled: true
          performance_insights_retention_period: 7

          # Network
          vpc_id: !terraform.state vpc/main .vpc_id
          subnet_ids: !terraform.state vpc/main .database_subnet_ids

        tags:
          Stack: main
          Tier: application

    # ==========================================================================
    # Infrastructure - Data Processing Stack
    # ==========================================================================
    infrastructure/data:
      metadata:
        component: infrastructure
        enabled: false  # no components/terraform/infrastructure root module yet (see PR notes)
      vars:
        # ECS disabled for data stack
        ecs:
          enabled: false

        # Data-specific RDS
        rds:
          enabled: true
          identifier: "staging-data-db"
          engine: "{{ .settings.environment.rds_engine }}"
          engine_version: "{{ .settings.environment.rds_engine_version }}"
          instance_class: "db.r5.large"
          allocated_storage: 50
          max_allocated_storage: 200
          db_name: "stagingdata"
          multi_az: false

          storage_encrypted: true
          backup_retention_period: 7

          vpc_id: !terraform.state vpc/services .vpc_id
          subnet_ids: !terraform.state vpc/services .private_subnet_ids

        # Lambda for data processing
        lambda:
          enabled: true
          functions:
            data_processor:
              function_name: "staging-data-processor"
              runtime: "python3.11"
              handler: "main.handler"
              memory_size: 512
              timeout: 300
              vpc_id: !terraform.state vpc/services .vpc_id
              subnet_ids: !terraform.state vpc/services .private_subnet_ids
            data_transformer:
              function_name: "staging-data-transformer"
              runtime: "python3.11"
              handler: "transform.handler"
              memory_size: 1024
              timeout: 600
              vpc_id: !terraform.state vpc/services .vpc_id
              subnet_ids: !terraform.state vpc/services .private_subnet_ids

        tags:
          Stack: data
          Tier: data-processing

    # ==========================================================================
    # Monitoring - Main Dashboard and Alarms
    # ==========================================================================
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true
        certificate_arns: !terraform.state acm/main .certificate_arns // {}
        certificate_names: !terraform.state acm/main .certificate_domains // {} | keys
        certificate_domains: !terraform.state acm/main [.certificate_domains // {} | .[]]
        certificate_expiry_threshold: 30

        # SNS Topics for alerts
        alarm_email_subscriptions:
          - "staging-alerts@example.com"
          - "oncall@example.com"

        # CloudWatch Alarms
        create_sns_topic: true
        cpu_alarms:
          high_cpu:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 80
            dimensions: {}
        memory_alarms:
          high_memory:
            namespace: "CWAgent"
            evaluation_periods: 2
            period: 300
            threshold: 85
            dimensions: {}
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true

        certificate_arns: !terraform.state acm/services .certificate_arns // {}
        certificate_expiry_threshold: 30

        alarm_email_subscriptions:
          - "staging-alerts@example.com"

        # Data-specific alarms
        create_sns_topic: true
        db_connection_alarms:
          rds_connections:
            evaluation_periods: 2
            period: 300
            threshold: 100
        enable_rds_monitoring: true
        rds_storage_threshold: 5368709120
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services

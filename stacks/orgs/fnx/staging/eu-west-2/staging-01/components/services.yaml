---
# =============================================================================
# Services Component Configurations for Staging-01 Environment
# =============================================================================
# API Gateway, Lambda, monitoring, and infrastructure services
# =============================================================================

import:
  - orgs/fnx/staging/eu-west-2/staging-01/components/globals
  - catalog/apigateway/defaults
  - catalog/cognito/defaults
  - catalog/monitoring/defaults

components:
  terraform:
    # ==========================================================================
    # Cognito - user pool backing the API Gateway authorizer
    # ==========================================================================
    cognito/main:
      metadata:
        component: cognito
        inherits:
          - cognito/defaults
      vars:
        name_prefix: '{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}'
        clients:
          api:
            generate_secret: true

    # ==========================================================================
    # API Gateway - Main API
    # ==========================================================================
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Main API Gateway for staging environment"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"

        # Methods are addressed by resource_path ("/" is the API root), because
        # a stack cannot know this API's resource IDs before apply.
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "NONE"
          - resource_path: "/api"
            http_method: "ANY"
            authorization: "COGNITO_USER_POOLS"

        # "/" stays MOCK on purpose: it is a liveness endpoint, and a canned 200
        # is the correct answer for one. "/api" is the real entry point and is
        # proxied to Lambda.
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "GET"
            type: "MOCK"
          - resource_path: "/api"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        # Authorizer for the COGNITO_USER_POOLS method above. A method that asks
        # for COGNITO_USER_POOLS without a pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        # Domain Configuration
        domain_name: "api.staging.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        throttling_burst_limit: 500
        throttling_rate_limit: 1000

        # Logging and monitoring
        enable_logging: true
        log_retention_days: 14
        create_dashboard: true

        # CORS
        tags:
          Service: api-gateway
          Tier: edge

    # ==========================================================================
    # API Gateway - Data API
    # ==========================================================================
        api_name: "main-api"
        zone_id: !terraform.state network/main .zone_ids.main
        cors_configuration:
          allow_origins: ["*"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers:
            - '*'
          expose_headers: []
          max_age: 300
          allow_credentials: false
      dependencies:
        components:
          - component: network/main
          - component: acm/main
          - component: cognito/main
          - component: lambda/data-processor

    apigateway/data:
      metadata:
        component: apigateway
      vars:
        description: "Data API Gateway for staging"
        stage_name: "v1"

        api_resources:
          - path_part: "data"
          - path_part: "metrics"
          - path_part: "analytics"

        api_methods:
          - resource_path: "/data"
            http_method: "ANY"
            authorization: "NONE"

        # Real backend. lambda_function_name is required so this component can
        # grant API Gateway permission to invoke the function - without that
        # policy the integration applies fine and every call returns 500.
        api_integrations:
          - resource_path: "/data"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        domain_name: "data.services.staging.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/services .certificate_arns.services_wildcard
        throttling_burst_limit: 300
        throttling_rate_limit: 500

        enable_logging: true
        log_retention_days: 14
        create_dashboard: true

        tags:
          Service: data-api
          Tier: backend

    # ==========================================================================
    # Infrastructure - Main Application Stack
    # ==========================================================================
        api_name: "data-api"
        zone_id: !terraform.state network/services .zone_ids.data
      dependencies:
        components:
          - component: network/services
          - component: acm/services
          - component: lambda/data-processor

    # ECS Fargate cluster (was infrastructure/main.ecs). vpc_id/subnet_ids are
    # not passed: an aws_ecs_cluster has neither - those belong to ECS services.
    ecs/main:
      metadata:
        component: ecs
      vars:
        cluster_name: "staging-main-apps"
        fargate_only: true
        enable_container_insights: true
      dependencies:
        components:
          - component: vpc/main

    # Application database (was infrastructure/main.rds)
    rds/main:
      metadata:
        component: rds
      vars:
        # Without this, environment falls back to the module default "dev"
        # and every environment == "prod" gate in the component silently
        # passes.
        environment: "{{ .settings.context.stage }}"
        identifier: "staging-main-db"
        db_name: "stagingapp"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.t3.medium"
        allocated_storage: 20
        max_allocated_storage: 100
        multi_az: false
        deletion_protection: false
        skip_final_snapshot: true
        storage_encrypted: true
        iam_database_authentication_enabled: true
        backup_retention_period: 7
        backup_window: "03:00-04:00"
        maintenance_window: "Mon:04:30-Mon:05:30"
        performance_insights_enabled: true
        performance_insights_retention_period: 7
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .database_subnet_ids
      dependencies:
        components:
          - component: vpc/main

    # Analytics database (was infrastructure/data.rds)
    rds/data:
      metadata:
        component: rds
      vars:
        # Without this, environment falls back to the module default "dev"
        # and every environment == "prod" gate in the component silently
        # passes.
        environment: "{{ .settings.context.stage }}"
        identifier: "staging-data-db"
        db_name: "stagingdata"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.r5.large"
        allocated_storage: 50
        max_allocated_storage: 200
        multi_az: false
        storage_encrypted: true
        backup_retention_period: 7
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services

    # Data processing (was infrastructure/data.lambda). The lambda component is
    # single-function, so one instance per function.
    lambda/data-processor:
      metadata:
        component: lambda
      vars:
        function_name: "staging-data-processor"
        handler: "main.handler"
        runtime: "python3.13"
        # Placeholder: CI builds the package and uploads it here. The bucket must
        # exist and hold this key before the first apply - see docs/DEPLOYMENT.md.
        s3_bucket: "fnx-staging-lambda-artifacts"
        s3_key: "staging-data-processor/latest.zip"
        memory_size: 512
        timeout: 300
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services

    lambda/data-transformer:
      metadata:
        component: lambda
      vars:
        function_name: "staging-data-transformer"
        handler: "transform.handler"
        runtime: "python3.13"
        # Placeholder: CI builds the package and uploads it here. The bucket must
        # exist and hold this key before the first apply - see docs/DEPLOYMENT.md.
        s3_bucket: "fnx-staging-lambda-artifacts"
        s3_key: "staging-data-transformer/latest.zip"
        memory_size: 1024
        timeout: 600
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services


    # ==========================================================================
    # Monitoring - Main Dashboard and Alarms
    # ==========================================================================
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true
        certificate_arns: !terraform.state acm/main [.certificate_arns // {} | .[]]
        certificate_names: !terraform.state acm/main .certificate_domains // {} | keys
        certificate_domains: !terraform.state acm/main [.certificate_domains // {} | .[]]
        certificate_expiry_threshold: 30

        # SNS Topics for alerts
        alarm_email_subscriptions:
          - "staging-alerts@example.com"
          - "oncall@example.com"

        # CloudWatch Alarms
        create_sns_topic: true
        cpu_alarms:
          high_cpu:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 80
            dimensions: {}
        memory_alarms:
          high_memory:
            namespace: "CWAgent"
            evaluation_periods: 2
            period: 300
            threshold: 85
            dimensions: {}
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true

        certificate_arns: !terraform.state acm/services [.certificate_arns // {} | .[]]
        certificate_expiry_threshold: 30

        alarm_email_subscriptions:
          - "staging-alerts@example.com"

        # Data-specific alarms
        create_sns_topic: true
        db_connection_alarms:
          rds_connections:
            evaluation_periods: 2
            period: 300
            threshold: 100
        enable_rds_monitoring: true
        rds_storage_threshold: 5368709120
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services

---
# =============================================================================
# Security Component Configurations for Staging-01 Environment
# =============================================================================
# IAM, secrets, certificates, and security configurations
# =============================================================================

import:
  - orgs/fnx/staging/eu-west-2/staging-01/components/globals
  - catalog/iam/defaults
  - catalog/kms/defaults
  - catalog/secretsmanager/defaults
  - catalog/acm/defaults
  - catalog/cloudtrail/defaults
  - catalog/awsconfig/defaults
  - catalog/guardduty/defaults
  - catalog/securityhub/defaults
  - catalog/security-monitoring/defaults
  - catalog/backup/defaults

components:
  terraform:
    # ==========================================================================
    # IAM Roles
    # ==========================================================================
    iam/main:
      metadata:
        component: iam
        inherits:
          - iam
      vars:

        # Cross-account access configuration
        cross_account_role_name: "staging-01-staging-fnx-CrossAccountRole"
        policy_name: "staging-01-staging-fnx-CrossAccountPolicy"
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"

        # kms/main's allow_autoscaling_ebs grant (catalog/kms/defaults.yaml)
        # names the Auto Scaling service-linked role directly as a
        # key-policy principal; this is the one iam instance per account
        # that provisions it.
        enable_autoscaling_service_linked_role: true

        # Additional IAM policies
      dependencies:
        components:
          - component: backend/main
            stack: fnx-core-root
    # GitHub Actions OIDC role. This is what repo variable AWS_PLAN_ROLE_ARN
    # must point at before CI can run a real plan; every AWS job currently skips
    # because it is unset. The trust policy is pinned to exact subject claims -
    # never a wildcard - so no other repo can assume it.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: true
        # Roles become <prefix>-plan and <prefix>-apply. Naming convention from
        # catalog/iam/defaults.yaml, so context.environment (the instance name)
        # is the right key here -- unlike the `environment` variable, a tier.
        ci_role_name_prefix: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-ci"
        # Owner decision: the APPLY role is enabled; it is terraform-cd.yml's
        # deploy role (this stack's GitHub Environment AWS_ROLE_ARN) and the
        # EKS ClusterAdmin access entry (catalog/eks/defaults.yaml). Its trust
        # is ONLY the GitHub Environment subject below
        # (repo:<repo>:environment:<stack>) - never pull_request or a bare
        # ref; the environment itself is restricted to the default branch
        # (docs/DEPLOYMENT.md). It deploys every component, the iam component
        # included, so it holds AdministratorAccess: the Cloud Posse model
        # (aws-team-roles' "terraform" role, which their GitOps applies
        # assume). Anything narrower that can still manage IAM is admin with
        # extra steps.
        ci_apply_role_enabled: true
        ci_apply_role_environments:
          - "fnx-staging-staging-01"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        # State access: sts:AssumeRole on the single state backend's access
        # roles (backend/main in the management account's fnx-core-root) -
        # plan -> the non-prod read-only role, apply -> the read/write role.
        # backend/main in fnx-core-root is declared as a (cross-stack)
        # dependency below.
        ci_backend_read_role_arns:
          - !terraform.state backend/main fnx-core-root .backend_read_role_arn
        ci_backend_write_role_arn: !terraform.state backend/main fnx-core-root .backend_role_arn
        # kms/main's key: eks/main's cluster_encryption_config_kms_key_id
        # (compute.yaml) points every EKS cluster this apply role deploys at
        # this key, and AWS requires the calling principal -- not the
        # cluster's own service role -- to hold kms:DescribeKey/CreateGrant/
        # Encrypt on it. Scoped by alias, not !terraform.state kms/main
        # .key_arn: iam/ci plans and applies in the deploy-full-stack "iam"
        # layer, BEFORE the "kms" layer (workflows/deploy-full-stack.yaml), so
        # the key's ARN does not exist yet on a first deploy. Must match
        # kms/main's alias_name below, prefixed with "alias/".
        ci_apply_kms_key_aliases:
          - alias/staging-01-main
      dependencies:
        components:
          - component: backend/main
            stack: fnx-core-root

    # ==========================================================================
    # KMS - customer-managed key for Secrets Manager and other encrypted services
    # ==========================================================================
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Staging main encryption key (Secrets Manager, EBS, RDS)
        alias_name: staging-01-main  # without the alias/ prefix
        deletion_window_in_days: 7   # non-prod: shorter window, faster teardown
      dependencies:
        components:
          # allow_autoscaling_ebs (kms/defaults) names the Auto Scaling
          # service-linked role directly as a principal; iam/main provisions
          # it (enable_autoscaling_service_linked_role) so KMS does not
          # reject the key policy.
          - component: iam/main

    acm/main:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          main_wildcard:
            domain_name: "*.staging.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "staging.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    acm/services:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          services_wildcard:
            domain_name: "*.services.staging.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "api.services.staging.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    # ==========================================================================
    # Secrets Manager
    # ==========================================================================
    secretsmanager/app:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/defaults
      vars:
        secrets:
          app_credentials:
            name: "credentials"
            description: "Application credentials for staging"
            path: "staging/app"
            generate_random_password: true
            password_length: 32
          api_keys:
            name: "api-keys"
            description: "API integration keys for staging"
            path: "staging/app/api"
            generate_random_password: true
          database_credentials:
            name: "db-credentials"
            description: "Database connection credentials"
            path: "staging/app/database"
            generate_random_password: true
            password_length: 24

        context_name: "staging/app"
        default_recovery_window_in_days: 7
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        secrets:
          tls_certificates:
            name: "tls-certificates"
            description: "TLS certificates for services"
            path: "staging/certificates"
          ssh_keys:
            name: "ssh-keys"
            description: "SSH keys for infrastructure access"
            path: "staging/ssh"
        context_name: "staging/infra"
        default_recovery_window_in_days: 7

    # ==========================================================================
    # CloudTrail - the account's multi-region trail (S3 + CloudWatch Logs,
    # both encrypted with kms/main). security-monitoring's CIS metric filters
    # read its log group.
    # ==========================================================================
    cloudtrail/main:
      metadata:
        component: cloudtrail
        inherits:
          - cloudtrail/defaults

    # ==========================================================================
    # AWS Config - the recorder Security Hub's FSBP/CIS controls evaluate on.
    # ==========================================================================
    awsconfig/main:
      metadata:
        component: awsconfig
        inherits:
          - awsconfig/defaults

    # ==========================================================================
    # GuardDuty - owns the detector (security-monitoring only consumes it).
    # Catalog defaults: S3 protection on; EKS audit logs and EBS malware
    # scanning stay off in non-prod to avoid per-event/per-GB charges.
    # ==========================================================================
    guardduty/main:
      metadata:
        component: guardduty
        inherits:
          - guardduty/defaults

    # ==========================================================================
    # Security Hub - owns the hub (security-monitoring only consumes it).
    # Default standards (AWS FSBP + CIS 1.2.0) only; no PCI DSS in non-prod.
    # ==========================================================================
    securityhub/main:
      metadata:
        component: securityhub
        inherits:
          - securityhub/defaults

    # ==========================================================================
    # Security finding routing (GuardDuty + Security Hub -> SNS)
    # ==========================================================================
    security-monitoring/main:
      metadata:
        component: security-monitoring
        inherits:
          - security-monitoring/defaults

    # ==========================================================================
    # AWS Backup - vault, plans and tag-based selection for rds/main,
    # rds/data (Backup=true in their own services.yaml vars.tags) and any
    # EC2/EBS resource tagged the same way. Medium retention, no vault lock or
    # cross-region replication in staging.
    # ==========================================================================
    backup/main:
      metadata:
        component: backup
        inherits:
          - backup/defaults
      vars:
        daily_retention_days: 14
        weekly_retention_days: 30
        monthly_retention_days: 90
        notification_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"

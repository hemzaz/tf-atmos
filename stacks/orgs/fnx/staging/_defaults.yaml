---
# =============================================================================
# Staging Account Defaults
# =============================================================================
# Default configuration for all environments in the staging account
# =============================================================================

import:
  - orgs/fnx/_defaults
  - mixins/tenant/fnx
  - mixins/stage/staging

vars:
  # Account identification
  tags:
    CostCenter: "staging-infra"
settings:
  environment:
    account: staging
    # From the account map (stacks/orgs/fnx/_defaults.yaml), keyed by `account`.
    account_id: '{{ index .settings.account_map.full_account_map .settings.environment.account }}'
  context:
    stage: staging

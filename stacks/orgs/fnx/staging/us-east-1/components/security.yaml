---
# =============================================================================
# Security Component Configurations for Staging-01 Environment
# =============================================================================
# IAM, secrets, certificates, and security configurations
# Every security instance's wiring, shared with fnx-ue1-dev, is
# catalog/<c>/<i>; this file keeps their per-stage values.
# =============================================================================

import:
  - orgs/fnx/staging/us-east-1/components/globals
  - catalog/iam/main
  - catalog/iam/ci
  - catalog/kms/main
  - catalog/secretsmanager/app
  - catalog/secretsmanager/infra
  - catalog/acm/main
  - catalog/acm/services
  - catalog/cloudtrail/main
  - catalog/awsconfig/main
  - catalog/guardduty/main
  - catalog/securityhub/main
  - catalog/inspector2/main
  - catalog/apigateway-account/main
  - catalog/security-monitoring/main
  - catalog/backup/main

components:
  terraform:
    # ==========================================================================
    # KMS - customer-managed key for Secrets Manager and other encrypted services
    # ==========================================================================
    kms/main:
      vars:
        description: Staging main encryption key (Secrets Manager, EBS, RDS)

    acm/services:
      vars:
        dns_domains:
          services_wildcard:
            subject_alternative_names:
              - "api.services.{{ .settings.environment.domain_name }}"

    # ==========================================================================
    # Secrets Manager
    # ==========================================================================
    secretsmanager/app:
      vars:
        secrets:
          app_credentials:
            name: "credentials"
            description: "Application credentials for staging"
            path: "app"
            generate_random_password: true
            password_length: 32
          api_keys:
            name: "api-keys"
            description: "API integration keys for staging"
            path: "app/api"
            generate_random_password: true
          database_credentials:
            name: "db-credentials"
            description: "Database connection credentials"
            path: "app/database"
            generate_random_password: true
            password_length: 24

        default_recovery_window_in_days: 7
    secretsmanager/infra:
      vars:
        secrets:
          tls_certificates:
            name: "tls-certificates"
            description: "TLS certificates for services"
            path: "certificates"
          ssh_keys:
            name: "ssh-keys"
            description: "SSH keys for infrastructure access"
            path: "ssh"
        default_recovery_window_in_days: 7

    # ==========================================================================
    # AWS Backup - medium retention in staging.
    # ==========================================================================
    backup/main:
      vars:
        daily_retention_days: 14
        weekly_retention_days: 30
        monthly_retention_days: 90

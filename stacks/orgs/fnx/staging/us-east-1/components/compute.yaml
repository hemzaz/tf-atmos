---
# =============================================================================
# Compute Component Configurations for Staging-01 Environment
# =============================================================================
# EC2, EKS, and compute resources - mirrors production setup
# Every compute instance's wiring, shared with fnx-ue1-dev, is
# catalog/<c>/<i>; this file keeps the per-stage values.
# =============================================================================

import:
  - orgs/fnx/staging/us-east-1/components/globals
  - catalog/eks/main
  - catalog/eks/data
  - catalog/github-runners/main
  - catalog/ec2/bastion
  - catalog/ec2/app-server
  - catalog/external-secrets/main
  - catalog/external-secrets/data
  - catalog/eks-addons/main
  - catalog/eks-addons/data
  - catalog/eks-backend-services/main

components:
  terraform:
    # ==========================================================================
    # EKS Cluster - Main Application Workloads
    # ==========================================================================
    eks/main:
      vars:
        tags:
          Cluster: main
          Purpose: "application-workloads"
        # Endpoint access - private only for staging
        cluster_endpoint_public_access: false
        enabled_cluster_log_types:
          - "api"
          - "audit"
          - "authenticator"
          - "controllerManager"
          - "scheduler"
        node_groups:
          workers:
            desired_group_size: 3
            min_group_size: 2
            max_group_size: 6
            kubernetes_labels:
              environment: "{{ .settings.context.stage }}"
            tags:
              NodeGroup: workers

    # ==========================================================================
    # EKS Cluster - Data Processing Workloads
    # ==========================================================================
    eks/data:
      vars:
        tags:
          Cluster: data
          Purpose: "data-processing"
        enabled_cluster_log_types:
          - "api"
          - "audit"
        node_groups:
          data-workers:
            instance_types: ["m5.large"]
            desired_group_size: 2
            min_group_size: 2
            max_group_size: 4
            kubernetes_labels:
              role: data-processing
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100

    # ==========================================================================
    # EC2 Bastion Host
    # ==========================================================================
    ec2/bastion:
      vars:
        tags:
          Role: bastion
          Access: restricted
        ebs_optimized: true
        allowed_ingress_rules:
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["10.0.0.0/8"]
            description: "SSH from internal networks"
        allowed_egress_rules:
          - from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS outbound"
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["10.0.0.0/8"]
            description: "SSH to internal hosts"
        monitoring: true
        root_volume_type: "gp3"
        root_volume_size: 20
        root_block_device_encrypted: true
        delete_on_termination: true

    # ==========================================================================
    # External Secrets Operator for EKS
    # ==========================================================================
    external-secrets/main:
      vars:
        enabled: true
    external-secrets/data:
      vars:
        enabled: true

    # ==========================================================================
    # EKS add-ons
    # ==========================================================================
    eks-addons/data:
      vars:
        clusters:
          data:
            container_insights_log_retention_days: 7

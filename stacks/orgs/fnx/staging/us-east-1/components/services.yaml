---
# =============================================================================
# Services Component Configurations for Staging-01 Environment
# =============================================================================
# API Gateway, Lambda, monitoring, and infrastructure services
# =============================================================================

import:
  - orgs/fnx/staging/us-east-1/components/globals
  - catalog/apigateway/defaults
  - catalog/cognito/defaults
  - catalog/monitoring/defaults
  - catalog/s3/lambda-artifacts
  - catalog/sqs/defaults
  - catalog/cost-optimization/defaults
  - catalog/rds/staging

components:
  terraform:
    # ==========================================================================
    # Cognito - user pool backing the API Gateway authorizer
    # ==========================================================================
    cognito/main:
      metadata:
        component: cognito
        inherits:
          - cognito/defaults
      vars:
        name_prefix: '{{ .atmos_stack }}'
        clients:
          api:
            generate_secret: true

    # ==========================================================================
    # API Gateway - Main API
    # ==========================================================================
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Main API Gateway for staging environment"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"

        # Methods are addressed by resource_path ("/" is the API root), because
        # a stack cannot know this API's resource IDs before apply.
        # lambda/data-processor is disabled (no package yet), so "/api" has no
        # method. When it is enabled, append these items to the two lists below
        # (delete "#   " to keep the indentation) and add
        # `- component: lambda/data-processor` to dependencies.components:
        #   api_methods:
        #     - resource_path: "/api"
        #       http_method: "ANY"
        #       authorization: "COGNITO_USER_POOLS"
        #   api_integrations:
        #     - resource_path: "/api"
        #       http_method: "ANY"
        #       integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
        #       type: "AWS_PROXY"
        #       uri: !terraform.state lambda/data-processor .function_invoke_arn
        #       lambda_function_name: !terraform.state lambda/data-processor .function_name
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "NONE"

        # "/" stays MOCK on purpose: it is a liveness endpoint, and a canned 200
        # is the correct answer for one. The real entry point, "/api" proxied to
        # Lambda, comes back with lambda/data-processor (see above).
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "GET"
            type: "MOCK"

        # Authorizer for the "/api" COGNITO_USER_POOLS method. A method that asks
        # for COGNITO_USER_POOLS without a pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        # Domain Configuration
        domain_name: "api.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        throttling_burst_limit: 500
        throttling_rate_limit: 1000

        # Logging and monitoring
        enable_logging: true
        log_retention_days: 14
        create_dashboard: true

        # CORS
        tags:
          Service: api-gateway
          Tier: edge

    # ==========================================================================
    # API Gateway - Data API
    # ==========================================================================
        api_name: "main-api"
        zone_id: !terraform.state network/main .zone_ids.main
        cors_configuration:
          allow_origins: ["*"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers:
            - '*'
          expose_headers: []
          max_age: 300
          allow_credentials: false
      dependencies:
        components:
          # Ordering only: REST stage logging needs the account's
          # CloudWatch role set first (no output is read).
          - component: apigateway-account/main
          - component: network/main
          - component: acm/main
          - component: cognito/main

    # Disabled with lambda/data-processor, its only backend: an API with no
    # method cannot be deployed. Enable both together.
    apigateway/data:
      metadata:
        component: apigateway
        enabled: false
      vars:
        description: "Data API Gateway for staging"
        stage_name: "v1"

        api_resources:
          - path_part: "data"
          - path_part: "metrics"
          - path_part: "analytics"

        api_methods:
          - resource_path: "/data"
            http_method: "ANY"
            authorization: "COGNITO_USER_POOLS"

        # Real backend. lambda_function_name is required so this component can
        # grant API Gateway permission to invoke the function - without that
        # policy the integration applies fine and every call returns 500.
        api_integrations:
          - resource_path: "/data"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        # Authorizer for the COGNITO_USER_POOLS method above, same pool as
        # apigateway/main. A method that asks for COGNITO_USER_POOLS without a
        # pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        domain_name: "data.services.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/services .certificate_arns.services_wildcard
        throttling_burst_limit: 300
        throttling_rate_limit: 500

        enable_logging: true
        log_retention_days: 14
        create_dashboard: true
        enable_waf: true

        tags:
          Service: data-api
          Tier: backend

    # ==========================================================================
    # Infrastructure - Main Application Stack
    # ==========================================================================
        api_name: "data-api"
        zone_id: !terraform.state network/services .zone_ids.data
      dependencies:
        components:
          # Ordering only: REST stage logging needs the account's
          # CloudWatch role set first (no output is read).
          - component: apigateway-account/main
          - component: network/services
          - component: acm/services
          - component: cognito/main
          - component: lambda/data-processor

    # ECS Fargate cluster (was infrastructure/main.ecs). vpc_id/subnet_ids are
    # not passed: an aws_ecs_cluster has neither - those belong to ECS services.
    ecs/main:
      metadata:
        component: ecs
      vars:
        cluster_name: "{{ .settings.context.stage }}-main-apps"
        fargate_only: true
        enable_container_insights: true
      dependencies:
        components:
          - component: vpc/main

    # Application database (was infrastructure/main.rds)
    rds/main:
      metadata:
        component: rds
        inherits:
          - rds/staging
      vars:
        # Without this, environment falls back to the module default "dev"
        # and every environment == "prod" gate in the component silently
        # passes.
        environment: "{{ .settings.context.stage }}"
        identifier: "{{ .settings.context.stage }}-main-db"
        db_name: "stagingapp"
        # Selected into backup/main's daily/weekly/monthly plans by tag
        # (enable_rds_backup, catalog/backup/defaults.yaml), not by reading
        # rds state from the same deploy phase.
        tags:
          Backup: "true"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.t3.medium"
        allocated_storage: 20
        max_allocated_storage: 100
        backup_window: "03:00-04:00"
        maintenance_window: "Mon:04:30-Mon:05:30"
        performance_insights_retention_period: 7
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .database_subnet_ids
        # Without this, the RDS security group's only ingress rule has an
        # empty security_groups list and nothing on eks/main can reach the
        # database (eks-backend-services/main's pods run there).
        allowed_security_groups: !terraform.state eks/main .eks_cluster_managed_security_group_id | [.]
      dependencies:
        components:
          - component: vpc/main
          - component: eks/main

    # Analytics database (was infrastructure/data.rds)
    rds/data:
      metadata:
        component: rds
        inherits:
          - rds/staging
      vars:
        # Without this, environment falls back to the module default "dev"
        # and every environment == "prod" gate in the component silently
        # passes.
        environment: "{{ .settings.context.stage }}"
        identifier: "{{ .settings.context.stage }}-data-db"
        db_name: "stagingdata"
        # Selected into backup/main's daily/weekly/monthly plans by tag
        # (enable_rds_backup, catalog/backup/defaults.yaml), not by reading
        # rds state from the same deploy phase.
        tags:
          Backup: "true"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.r5.large"
        allocated_storage: 50
        max_allocated_storage: 200
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services

    # Data processing (was infrastructure/data.lambda). The lambda component is
    # single-function, so one instance per function.
    #
    # The application repo's CI builds each package and uploads it as
    # <function_name>/<version>.zip to the stack's s3/lambda-artifacts bucket
    # with iam/ci's lambda-uploader role; a PR here then sets the instance's
    # settings.package_version, and the changed s3_key redeploys the code
    # (docs/OPERATIONS.md, "Lambda packages"). Disabled until the first
    # package exists: upload it, set package_version, set enabled: true, and
    # restore its readers, each marked with a "disabled" comment:
    # apigateway/main's "/api" route and apigateway/data (data-processor), and
    # monitoring/data's dimensions (every function).
    lambda/data-processor:
      metadata:
        component: lambda
        enabled: false
      settings:
        package_version: "unreleased"
      vars:
        function_name: "{{ .settings.context.stage }}-data-processor"
        handler: "main.handler"
        runtime: "python3.13"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: '{{ .vars.function_name }}/{{ .settings.package_version }}.zip'
        memory_size: 512
        timeout: 300
        # Enqueues work for lambda/data-transformer on sqs/data-transform: the
        # queue's producer_policy (SendMessage, and its kms/main key through
        # SQS) and its URL.
        environment_variables:
          QUEUE_URL: !terraform.state sqs/data-transform .queue_url
        custom_policy: !terraform.state sqs/data-transform '.producer_policy | tojson'
        # The built-in egress reaches S3 only, and vpc/services has no SQS
        # endpoint: SQS's regional endpoint is reached through the NAT gateway.
        custom_egress_rules:
          - description: "HTTPS to the SQS regional endpoint through the NAT gateway"
            from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services
          - component: s3/lambda-artifacts
          - component: sqs/data-transform

    # Packaged, and disabled until its first package, like
    # lambda/data-processor above. Fed by sqs/data-transform.
    lambda/data-transformer:
      metadata:
        component: lambda
        enabled: false
      settings:
        package_version: "unreleased"
      vars:
        function_name: "{{ .settings.context.stage }}-data-transformer"
        handler: "transform.handler"
        runtime: "python3.13"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: '{{ .vars.function_name }}/{{ .settings.package_version }}.zip'
        memory_size: 1024
        # sqs/data-transform's visibility_timeout_seconds is derived from this
        # timeout and the batching window below: change them together.
        timeout: 600
        # Failed messages are retried by the queue and moved to its DLQ after
        # dlq_max_receive_count receives; with ReportBatchItemFailures the
        # function returns only the failed messages, not the whole batch.
        event_source_mappings:
          data-transform:
            event_source_arn: !terraform.state sqs/data-transform .queue_arn
            batch_size: 10
            maximum_batching_window_in_seconds: 5
            function_response_types:
              - ReportBatchItemFailures
        # The queue is encrypted with kms/main: the poller needs kms:Decrypt.
        event_source_kms_key_arns:
          - !terraform.state kms/main .key_arn
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services
          - component: s3/lambda-artifacts
          - component: sqs/data-transform
          - component: kms/main

    # Work queue of lambda/data-transformer: lambda/data-processor sends, the
    # transformer's event source mapping polls. Failed messages move to
    # <Environment>-data-transform-dlq after 5 receives and stay 14 days.
    sqs/data-transform:
      metadata:
        component: sqs
        inherits:
          - sqs/defaults
      vars:
        name: data-transform
        # AWS: at least 6x the consumer's timeout plus its batching window,
        # 6 x 600 (lambda/data-transformer timeout) + 5 = 3605.
        visibility_timeout_seconds: 3605
        message_retention_seconds: 345600  # 4 days
        dlq_enabled: true
        dlq_max_receive_count: 5
        dlq_message_retention_seconds: 1209600  # 14 days


    # ==========================================================================
    # Monitoring - Main Dashboard and Alarms
    # ==========================================================================
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        # Cloud Posse null-label style: every resource this component creates
        # is named "<Environment>-<name>-<suffix>". monitoring/main and
        # monitoring/data previously both named resources from Environment
        # alone and collided (ResourceAlreadyExists) on the second apply.
        name: main
        # kms/main already allows CloudWatch alarms to publish to encrypted
        # topics (catalog/kms/defaults.yaml allow_cloudwatch_alarms).
        kms_key_id: !terraform.state kms/main .key_arn
        create_dashboard: true
        enable_certificate_monitoring: true
        certificate_arns: !terraform.state acm/main .certificate_arns // {} | [.[]]
        certificate_names: !terraform.state acm/main .certificate_domains // {} | keys
        certificate_domains: !terraform.state acm/main .certificate_domains // {} | [.[]]
        certificate_expiry_threshold: 30

        # Dashboard/alarm dimensions: the sources this stack actually
        # deploys, so the infrastructure and backend dashboards plot real
        # data instead of empty widgets (they default to [] / "").
        eks_cluster_name: !terraform.state eks/main .eks_cluster_id
        # eks/main's node_groups (compute.yaml): workers (min_group_size 2)
        # + monitoring (min_group_size 1) = 3 guaranteed nodes. The
        # eks_node_count_low alarm (monitoring's alarms.tf) only fires below
        # this floor.
        eks_min_node_count: 3
        rds_instances: !terraform.state rds/main .instance_identifier | [.]
        ecs_clusters: !terraform.state ecs/main .cluster_name | [.]
        api_gateway_name: !terraform.state apigateway/main .api_name
        api_gateway_stages: !terraform.state apigateway/main .rest_api_stage_name | [.]

        # SNS Topics for alerts
        alarm_email_subscriptions:
          - "staging-alerts@example.com"
          - "oncall@example.com"

        # CloudWatch Alarms
        create_sns_topic: true
        cpu_alarms:
          high_cpu:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 80
            dimensions: {}
        memory_alarms:
          high_memory:
            namespace: "CWAgent"
            evaluation_periods: 2
            period: 300
            threshold: 85
            dimensions: {}
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
          - component: kms/main
          - component: eks/main
          - component: rds/main
          - component: ecs/main
          - component: apigateway/main
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        name: data
        kms_key_id: !terraform.state kms/main .key_arn
        create_dashboard: true
        enable_certificate_monitoring: true

        certificate_arns: !terraform.state acm/services .certificate_arns // {} | [.[]]
        certificate_expiry_threshold: 30

        # Dashboard/alarm dimensions: the sources this stack actually
        # deploys, so the infrastructure and backend dashboards plot real
        # data instead of empty widgets (they default to [] / "").
        eks_cluster_name: !terraform.state eks/data .eks_cluster_id
        rds_instances: !terraform.state rds/data .instance_identifier | [.]
        # The lambdas are disabled (no package yet), and apigateway/data with
        # them: no API or Lambda dimensions until they are enabled. Then add
        # back, each read also in dependencies (lambda_functions: the enabled
        # ones only):
        #   api_gateway_name: !terraform.state apigateway/data .api_name
        #   api_gateway_stages: !terraform.state apigateway/data .rest_api_stage_name | [.]
        #   lambda_functions:
        #     - !terraform.state lambda/data-processor .function_name
        #     - !terraform.state lambda/data-transformer .function_name

        alarm_email_subscriptions:
          - "staging-alerts@example.com"

        # Data-specific alarms
        create_sns_topic: true
        db_connection_alarms:
          rds_connections:
            db_instance_identifier: !terraform.state rds/data .instance_identifier
            evaluation_periods: 2
            period: 300
            threshold: 100
        enable_rds_monitoring: true
        rds_storage_threshold: 5368709120
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services
          - component: kms/main
          - component: eks/data
          - component: rds/data

    # Cost optimization: instance scheduler, Savings Plan/RI analyzer,
    # resource cleanup, cost anomaly detection and monthly budget.
    cost-optimization/main:
      metadata:
        component: cost-optimization
        inherits:
          - cost-optimization/defaults
      vars:
        monthly_budget_limit: "{{ .settings.environment.monitoring.budget_monthly_limit }}"
        budget_notification_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"
        cost_anomaly_notification_email: "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        cost_alert_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

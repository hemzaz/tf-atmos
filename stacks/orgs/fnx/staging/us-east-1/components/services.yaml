---
# Every services instance's wiring is catalog/<c>/<i> (the un-suffixed
# defaults); this file keeps staging's per-stage values.
import:
  - orgs/fnx/staging/us-east-1/components/globals
  - catalog/apigateway/main
  - catalog/apigateway/data
  - catalog/cognito/main
  - catalog/monitoring/main
  - catalog/monitoring/data
  - catalog/s3/lambda-artifacts
  - catalog/sqs/data-transform
  - catalog/cost-optimization/main
  - catalog/rds/main
  - catalog/rds/data
  - catalog/ecs/main
  - catalog/lambda/data-processor
  - catalog/lambda/data-transformer

components:
  terraform:
    apigateway/main:
      vars:
        description: "Main API Gateway for staging environment"
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"
        throttling_burst_limit: 500
        throttling_rate_limit: 1000
        log_retention_days: 14
        tags:
          Service: api-gateway
          Tier: edge
        cors_configuration:
          allow_origins: ["*"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers:
            - '*'
          expose_headers: []
          max_age: 300
          allow_credentials: false

    apigateway/data:
      vars:
        description: "Data API Gateway for staging"
        api_resources:
          - path_part: "data"
          - path_part: "metrics"
          - path_part: "analytics"
        throttling_burst_limit: 300
        throttling_rate_limit: 500
        log_retention_days: 14
        tags:
          Service: data-api
          Tier: backend

    ecs/main:
      vars:
        cluster_name: "{{ .settings.context.stage }}-main-apps"
        enable_container_insights: true

    monitoring/main:
      vars:
        # eks/main's node_groups (compute.yaml): workers (min_group_size 2)
        # + monitoring (min_group_size 1) = 3 guaranteed nodes. The
        # eks_node_count_low alarm (monitoring's alarms.tf) only fires below
        # this floor.
        eks_min_node_count: 3

        # SNS Topics for alerts
        alarm_email_subscriptions:
          - "staging-alerts@example.com"
          - "oncall@example.com"

        # CloudWatch Alarms
        cpu_alarms:
          high_cpu:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 80
            dimensions: {}
        memory_alarms:
          high_memory:
            namespace: "CWAgent"
            evaluation_periods: 2
            period: 300
            threshold: 85
            dimensions: {}

    monitoring/data:
      vars:
        alarm_email_subscriptions:
          - "staging-alerts@example.com"

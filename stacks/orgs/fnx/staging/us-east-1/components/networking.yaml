---
# =============================================================================
# Networking Component Configurations for Staging-01 Environment
# =============================================================================
# VPC and network resources - mirrors production architecture
# The instances' wiring, shared with fnx-ue1-dev, is catalog/vpc/<i> and
# catalog/network/<i>; this file keeps the CIDRs, AZs, subnets and per-stage values.
# =============================================================================

import:
  - orgs/fnx/staging/us-east-1/components/globals
  - catalog/vpc/main
  - catalog/vpc/services
  - catalog/network/vpc-peering
  - catalog/network/main
  - catalog/network/services

# The two VPCs' CIDRs, in one place: each vpc instance's
# ipv4_primary_cidr_block, the other one's private_network_acl_peer_cidr_blocks
# and network/vpc-peering's routes all read them. Literals, not
# !terraform.state <vpc> .vpc_cidr: vpc/main and vpc/services would then
# read each other, a cycle. database_subnet_cidrs.main is vpc/main's
# database_subnets, which ec2/app-server's PostgreSQL egress also reads.
settings:
  network:
    vpc_cidrs:
      main: "10.10.0.0/16"
      services: "10.11.0.0/16"
    database_subnet_cidrs:
      main:
        - "10.10.201.0/24"
        - "10.10.202.0/24"
        - "10.10.203.0/24"

components:
  terraform:
    # ==========================================================================
    # Primary VPC - Main application workloads
    # ==========================================================================
    vpc/main:
      vars:
        # AZ IDs, not names: see components/terraform/vpc/README.md.
        availability_zone_ids:
          - use1-az1
          - use1-az2
          - use1-az4
        private_subnets:
          - "10.10.1.0/24"
          - "10.10.2.0/24"
          - "10.10.3.0/24"
        public_subnets:
          - "10.10.101.0/24"
          - "10.10.102.0/24"
          - "10.10.103.0/24"
        # One element per AZ, from settings.network.database_subnet_cidrs.main.
        database_subnets:
          - "{{ index .settings.network.database_subnet_cidrs.main 0 }}"
          - "{{ index .settings.network.database_subnet_cidrs.main 1 }}"
          - "{{ index .settings.network.database_subnet_cidrs.main 2 }}"

        tags:
          NetworkTier: "primary"
        vpc_flow_logs_enabled: true
    # ==========================================================================
    # Services VPC - Dedicated for backend services
    # ==========================================================================
    vpc/services:
      vars:
        # AZ IDs, not names: see components/terraform/vpc/README.md.
        availability_zone_ids:
          - use1-az1
          - use1-az2
          - use1-az4
        private_subnets:
          - "10.11.1.0/24"
          - "10.11.2.0/24"
          - "10.11.3.0/24"
        public_subnets:
          - "10.11.101.0/24"
          - "10.11.102.0/24"
          - "10.11.103.0/24"

        tags:
          NetworkTier: "services"
        vpc_flow_logs_enabled: true

    # ==========================================================================
    # Network Resources - DNS and routing for main VPC
    # ==========================================================================
    network/main:
      vars:
        zones:
          main:
            comment: "Main zone for staging environment"
          internal:
            comment: "Internal DNS for staging"
        records:
          www_main:
            records: ["10.10.101.100"]
          db_internal:
            records: ["10.10.201.50"]

    # ==========================================================================
    # Network Resources - DNS and routing for services VPC
    # ==========================================================================
    network/services:
      vars:
        zones:
          services:
            comment: "Services zone for staging"
          data:
            comment: "Data services DNS"

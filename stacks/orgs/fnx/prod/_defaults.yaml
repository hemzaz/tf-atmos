---
# =============================================================================
# Production Account Defaults
# =============================================================================
# Default configuration for all production environments
# Security and reliability are paramount in production
# =============================================================================

import:
  - orgs/fnx/_defaults
  - mixins/tenant/fnx
  - mixins/stage/prod

vars:
  # Account identification
  tags:
    Stage: production
    CostCenter: "prod-infra"
    DataClassification: "confidential"
    Compliance: "required"
settings:
  environment:
    account: prod
    # From the account map (stacks/orgs/fnx/_defaults.yaml), keyed by `account`.
    account_id: '{{ index .settings.account_map.full_account_map .settings.environment.account }}'
  context:
    stage: prod
  # Owner decision D3: production is planned from master only. terraform-ci.yml
  # drops this stack's instances from pull_request and merge_group plans and
  # plans them on push to master instead; the prod plan role does not trust the
  # pull_request OIDC subject (iam/ci ci_plan_role_subjects). Same key family
  # as settings.github.actions_enabled (stacks/orgs/fnx/local/_defaults.yaml);
  # a missing value means enabled.
  github:
    pull_request_plans_enabled: false

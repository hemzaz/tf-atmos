---
# =============================================================================
# Production Stack Configuration
# =============================================================================
# Production environment with full high availability, security, and compliance
# ALL CHANGES REQUIRE CHANGE MANAGEMENT APPROVAL
# =============================================================================

import:
  # Import base configuration first
  - catalog/_base/defaults

  # Region mixin (the tenant and stage mixins come with the stage defaults)
  - mixins/region/us-east-1

  # Import stage defaults (org defaults, tenant and stage mixins)
  - orgs/fnx/prod/_defaults

  # Import component-specific configurations
  - orgs/fnx/prod/us-east-1/components/globals
  - orgs/fnx/prod/us-east-1/components/networking
  - orgs/fnx/prod/us-east-1/components/security
  - orgs/fnx/prod/us-east-1/components/compute
  - orgs/fnx/prod/us-east-1/components/services

vars:
  # Core variables for stack naming
  region: us-east-1

settings:
  environment:
    account: prod
  context:
    tenant: fnx
    environment: production
    stage: prod

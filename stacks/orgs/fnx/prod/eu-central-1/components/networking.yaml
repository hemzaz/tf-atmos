---
# =============================================================================
# Networking for fnx-ec1-prod (EU DR warm standby)
# =============================================================================
# Warm = full, as fnx-ue2-prod's (orgs/fnx/prod/us-east-2/components/
# networking.yaml): vpc/main as in fnx-ew1-prod (three AZs, a NAT gateway per
# AZ, flow logs), on its own CIDR (10.32.0.0/16, reserved for it in
# fnx-ew1-prod's networking.yaml) so the two regions can be peered later
# without renumbering. No vpc/services: the EU data plane is not in fnx-ew1-prod
# either. No dns instance: the public zone is fnx-ew1-prod's network/main.
# Flow logs stay in eu-central-1, on this region's key.
# =============================================================================

import:
  - orgs/fnx/prod/eu-central-1/components/globals

settings:
  network:
    vpc_cidrs:
      main: "10.32.0.0/16"

components:
  terraform:
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "{{ .settings.network.vpc_cidrs.main }}"
        # AZ IDs, not names: see components/terraform/vpc/README.md.
        availability_zone_ids:
          - euc1-az1
          - euc1-az2
          - euc1-az3
        private_subnets:
          - "10.32.1.0/24"
          - "10.32.2.0/24"
          - "10.32.3.0/24"
        public_subnets:
          - "10.32.101.0/24"
          - "10.32.102.0/24"
          - "10.32.103.0/24"
        database_subnets:
          - "10.32.201.0/24"
          - "10.32.202.0/24"
          - "10.32.203.0/24"
        nat_gateway_enabled: true
        nat_gateway_strategy: "one_per_az"
        default_sg_ingress_self_only: true
        default_sg_egress_self_only: false
        default_sg_allow_all_outbound: true
        # Load balancer subnet discovery for eks/main's AWS Load Balancer
        # Controller, as in fnx-ew1-prod (cluster "<Environment>-main": ec1-main).
        public_subnets_additional_tags:
          "kubernetes.io/role/elb": "1"
          "kubernetes.io/cluster/{{ .settings.prefix }}-main": "shared"
        private_subnets_additional_tags:
          "kubernetes.io/role/internal-elb": "1"
          "kubernetes.io/cluster/{{ .settings.prefix }}-main": "shared"
        vpc_flow_logs_enabled: true
        # This region's key: fnx-ew1-prod kms/main's multi-region replica.
        flow_logs_kms_key_arn: !terraform.state kms/main fnx-ew1-prod '.replica_keys["eu-central-1"].key_arn'
        tags:
          NetworkTier: "primary"
          HighAvailability: "true"
          CriticalityLevel: "high"
      dependencies:
        components:
          - component: kms/main
            stack: fnx-ew1-prod

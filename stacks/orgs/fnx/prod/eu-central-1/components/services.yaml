---
# =============================================================================
# Services for fnx-ec1-prod (EU DR warm standby)
# =============================================================================
# fnx-ue2-prod's services (orgs/fnx/prod/us-east-2/components/services.yaml),
# which this mirrors for fnx-ew1-prod. The data tier the serving path fails
# over to, kept in sync continuously, EU to EU only (eu-west-1 to
# eu-central-1, check-data-residency.py):
#   - rds/main: a cross-region read replica of fnx-ew1-prod's rds/main
#     (Cloud Posse terraform-aws-rds replicate_source_db). Once promoted,
#     this file's import catalog/rds/main-standby switches to
#     catalog/rds/main-standby-promoted (reconciliation step 1).
#   - elasticache/main: a Global Datastore secondary of fnx-ew1-prod's
#     elasticache/main (Cloud Posse aws-elasticache-redis
#     global_replication_group_id).
#   - cognito/main: this region's own user pool (owner decision B5, as
#     fnx-ue2-prod's 2026-10-07: DR auth must not depend on eu-west-1). AWS
#     does not replicate user pools, so lambda/cognito-user-migration copies
#     each user from fnx-ew1-prod's pool on their first sign-in or password
#     reset here.
#   - apigateway/main: the SECONDARY half of api.<EU apex>'s Route 53
#     failover pair; fnx-ew1-prod's apigateway/main is the PRIMARY. Each half
#     has its own health check, so DNS moves without a change here. Its
#     health check and alarm, like every Route 53 health check's, are in
#     us-east-1, with the EventBridge rule, targets and role relaying the
#     alarm to both EU regions (configuration only, nothing persisted, no
#     personal data; owner decision B5).
#   - monitoring/main: this region's ec1-main-alarms topic and alarms, and the
#     relayed health check alarms of both halves.
# No rds/data: the EU data plane is not in fnx-ew1-prod either.
#
# The instances' wiring is the catalog's -standby files, shared with
# fnx-ue2-prod (settings.dr.standby_of names fnx-ew1-prod). This file keeps
# apigateway/main's health check regions and alarm relay, and
# monitoring/main's receipt of the relayed alarms.
# =============================================================================

import:
  - orgs/fnx/prod/eu-central-1/components/globals
  - catalog/rds/main-standby
  - catalog/elasticache/main-standby
  - catalog/cognito/main-standby
  - catalog/lambda/cognito-user-migration-standby
  - catalog/apigateway/main-standby
  - catalog/monitoring/main-standby

components:
  terraform:
    apigateway/main:
      vars:
        # The checkers: eu-west-1, the only EU checker region, plus two others
        # (Route 53 needs three): probes of the API's stage root, a residency
        # exemption (check-data-residency.py EXEMPTIONS).
        health_check_regions: ["eu-west-1", "us-east-1", "ap-southeast-1"]
        # The health check's alarm is in us-east-1 (Route 53's metrics are only
        # there). Where fnx-ue2-prod's notifies ue1-main-alarms, this one
        # notifies nothing in us-east-1: EventBridge relays its state changes to
        # the default bus of both EU regions, where each monitoring/main
        # delivers them to its topic (ew1-main-alarms, ec1-main-alarms).
        # What sits in us-east-1 for it: the Route 53 health check, its alarm,
        # and an EventBridge rule, its targets and their IAM role (configuration
        # only: no topic, key, subscription, archive or queue, nothing
        # persisted; no personal data). Owner decision B5.
        health_check_alarm_relay_regions: ["eu-west-1", "eu-central-1"]

    monitoring/main:
      vars:
        # Delivers the relayed us-east-1 health check alarms of the EU failover
        # pair (both apigateway/main halves) to ec1-main-alarms.
        receive_relayed_health_check_alarms: true

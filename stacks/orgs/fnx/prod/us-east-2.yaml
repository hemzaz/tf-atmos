---
# =============================================================================
# fnx-ue2-prod: the prod account's us-east-2 stack, the DR warm standby
# =============================================================================
# Owner decision Q5 (turnkey audit, 2026-10-03): DR is prod only, a warm
# standby in us-east-2 whose failover is real infrastructure. Same account as
# fnx-ue1-prod, so its names carry the ue2 prefix (settings.prefix) and the
# account's singletons stay in fnx-ue1-prod: the GitHub OIDC provider, the
# Auto Scaling service-linked role, the multi-region CloudTrail trail, AWS
# Config's global-resource recording, the account budget and the
# cross-account role. What "warm" means per component is in docs/OPERATIONS.md
# ("Disaster recovery"):
#   - networking, CI roles, regional security services: full, as in ue1;
#   - KMS: fnx-ue1-prod kms/main's multi-region replica (alias ue2-main);
#   - rds/main: a cross-region read replica of fnx-ue1-prod's, promoted on
#     failover; elasticache/main: a Global Datastore secondary;
#   - eks/main: the same node groups at their minimum; the in-cluster services
#     are deployed on failover;
#   - apigateway/main: the SECONDARY half of api.<domain>'s failover pair.
# Not replicated: rds/data and the data VPC (restored from backup/main's
# copies in us-east-2), Cognito (no cross-region replication in AWS).
# =============================================================================

import:
  - catalog/_base/defaults
  # Region mixin: region us-east-2, environment (region code) ue2
  - mixins/region/us-east-2
  - orgs/fnx/prod/_defaults
  - orgs/fnx/prod/us-east-2/components/globals
  - orgs/fnx/prod/us-east-2/components/networking
  - orgs/fnx/prod/us-east-2/components/security
  - orgs/fnx/prod/us-east-2/components/compute
  - orgs/fnx/prod/us-east-2/components/services

vars:
  region: us-east-2

settings:
  # DR standby of fnx-ue1-prod, whose state it reads: CD deploys it right after
  # that stack, whatever the names (workflows/scripts/common/ci-stacks.py).
  dr:
    standby_of: fnx-ue1-prod
  environment:
    account: prod
  context:
    tenant: fnx
    stage: prod

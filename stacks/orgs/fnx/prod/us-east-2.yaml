---
# =============================================================================
# fnx-ue2-prod: the prod account's us-east-2 stack, the DR warm standby
# =============================================================================
# Owner decision Q5 (turnkey audit, 2026-10-03): DR is prod only, a warm
# standby in us-east-2 whose failover is real infrastructure. Same account as
# fnx-ue1-prod, so its names carry the ue2 prefix (settings.prefix) and the
# account's singletons stay in fnx-ue1-prod: the GitHub OIDC provider, the
# Auto Scaling service-linked role, the multi-region CloudTrail trail, AWS
# Config's global-resource recording, the account budget and the
# cross-account role. What "warm" means per component is in docs/OPERATIONS.md
# ("Disaster recovery"):
#   - networking, CI roles, regional security services: full, as in ue1;
#   - KMS: fnx-ue1-prod kms/main's multi-region replica (alias ue2-main);
#   - rds/main: a cross-region read replica of fnx-ue1-prod's, promoted on
#     failover; elasticache/main: a Global Datastore secondary;
#   - eks/main: the same node groups at their minimum; the in-cluster services
#     are deployed on failover;
#   - apigateway/main: the SECONDARY half of api.<domain>'s failover pair,
#     authorized by this region's cognito/main;
#   - cognito/main: its own pool (AWS has no cross-region user pools), filled
#     from fnx-ue1-prod's by a user-migration trigger
#     (lambda/cognito-user-migration);
#   - monitoring/main: this region's ue2-main-alarms topic and alarms.
# Not replicated: rds/data and the data VPC (restored from backup/main's
# copies in us-east-2).
#
# Same tags, domain and contacts as fnx-ue1-prod
# (orgs/fnx/prod/us-east-1.yaml): one production service, two regions.
#
# One file per stack: the imports, then one vars/settings/components body,
# grouped by domain (globals, networking, security, compute, services).
# Every instance's wiring is the catalog's -standby files, shared with
# fnx-ec1-prod (settings.dr.standby_of names fnx-ue1-prod), plus the plain
# inspector2/main and apigateway-account/main files every dev, staging and
# prod stack imports; each domain section below says what this file keeps.
# =============================================================================

import:
  - catalog/_base/defaults
  # Region mixin: region us-east-2, environment (region code) ue2
  - mixins/region/us-east-2
  - orgs/fnx/prod/_defaults

  # --- globals: shared catalog defaults (the rest come with their instances)
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/iam/defaults
  - catalog/acm/defaults
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults

  # --- networking
  - catalog/vpc/main-standby

  # --- security
  - catalog/security-monitoring/defaults
  - catalog/iam/ci-standby
  - catalog/acm/main-standby
  - catalog/awsconfig/main-standby
  - catalog/guardduty/main-standby
  - catalog/securityhub/main-standby
  - catalog/security-monitoring/main-standby
  - catalog/backup/main-standby
  - catalog/inspector2/main
  - catalog/apigateway-account/main

  # --- compute
  - catalog/eks/main-standby
  - catalog/github-runners/main-standby
  - catalog/ec2/bastion-standby
  - catalog/external-secrets/main-standby
  - catalog/eks-addons/main-standby
  - catalog/eks-backend-services/main-standby

  # --- services
  - catalog/rds/main-standby
  - catalog/elasticache/main-standby
  - catalog/cognito/main-standby
  - catalog/lambda/cognito-user-migration-standby
  - catalog/apigateway/main-standby
  - catalog/monitoring/main-standby

vars:
  region: us-east-2
  tags:
    Team: "Platform"
    CostCenter: "Production"
    Project: "Infrastructure"
    ManagedBy: "Terraform"
    Tenant: "fnx"
    Application: "Production"
    Provisioner: "Atmos"
    DataClassification: "confidential"
    Compliance: "pci-sox"
    CriticalityLevel: "high"
    SLA: "99.9"
    BackupRequired: "true"
    DisasterRecovery: "warm-standby"

settings:
  # DR standby of fnx-ue1-prod, whose state it reads: CD deploys it right after
  # that stack, whatever the names (workflows/scripts/common/ci-stacks.py).
  dr:
    standby_of: fnx-ue1-prod
  environment:
    account: prod
    # The production domain: api.<domain> fails over to this stack. Its zone is
    # fnx-ue1-prod's network/main (the zone is global; Route 53 has no region).
    domain_name: "fnx.example.com"
    monitoring:
      critical_alerts:
        - "prod-critical@example.com"
        - "oncall@example.com"
      warning_alerts:
        - "prod-alerts@example.com"
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    rds_engine: "postgres"
    rds_engine_version: "14"
    use_external_secrets: true
    # The release pipeline's images, as in fnx-ue1-prod: a failover deploys
    # the same release.
    backend_service_images:
      api_gateway: "ghcr.io/fnx-platform/api-gateway:1.4.2"
      platform_api: "ghcr.io/fnx-platform/platform-api:1.4.2"
      auth_service: "ghcr.io/fnx-platform/auth-service:1.4.2"
      job_processor: "ghcr.io/fnx-platform/job-processor:1.4.2"
    enable_vpc_flow_logs: true
  context:
    tenant: fnx
    stage: prod
  network:
    vpc_cidrs:
      main: "10.22.0.0/16"

components:
  terraform:
    # ========================================================================
    # Globals
    # ========================================================================
    # Human cluster admins of eks/main, as in fnx-ue1-prod: the
    # same operators fail the in-cluster services over. Each rolearn must also
    # be in backend/main's access_roles.prod_write (fnx-ue1-root). Empty until
    # the owner supplies the ARN.
    eks/defaults:
      vars:
        map_additional_iam_roles: []

    # ========================================================================
    # Networking
    #
    # Warm = full: vpc/main as in fnx-ue1-prod (three AZs, a NAT gateway per
    # AZ, flow logs), on its own CIDR so the two regions can be peered later
    # without renumbering. No vpc/services: the data tier it holds in
    # us-east-1 (rds/data, eks/data) is restored from backup copies, not run
    # warm (docs/OPERATIONS.md, "Disaster recovery"). No dns instance: the
    # public zone is fnx-ue1-prod's network/main, which this stack writes its
    # failover record into. This file keeps vpc/main's CIDR, AZs and subnets.
    # ========================================================================
    vpc/main:
      vars:
        # AZ IDs, not names: see components/terraform/vpc/README.md.
        availability_zone_ids:
          - use2-az1
          - use2-az2
          - use2-az3
        private_subnets:
          - "10.22.1.0/24"
          - "10.22.2.0/24"
          - "10.22.3.0/24"
        public_subnets:
          - "10.22.101.0/24"
          - "10.22.102.0/24"
          - "10.22.103.0/24"
        database_subnets:
          - "10.22.201.0/24"
          - "10.22.202.0/24"
          - "10.22.203.0/24"

    # ========================================================================
    # Security
    #
    # Regional services run here as in fnx-ue1-prod (GuardDuty, Security Hub,
    # AWS Config, Inspector, finding routing, backups); account-wide ones do
    # not:
    #   - KMS: no kms/main here. This region's key is fnx-ue1-prod kms/main's
    #     multi-region replica (replica_keys["us-east-2"], alias ue2-main), read
    #     cross-stack wherever fnx-ue1-prod reads kms/main.
    #   - no iam/main: the account's cross-account role and the Auto Scaling
    #     service-linked role are fnx-ue1-prod's iam/main.
    #   - iam/ci trusts the account's GitHub OIDC provider, created by
    #     fnx-ue1-prod's iam/ci.
    #   - no cloudtrail/main: fnx-ue1-prod's trail is multi-region and records
    #     this region too; its CIS metric filters run there.
    #   - awsconfig/main records this region's resources only
    #     (include_global_resource_types: false, Cloud Posse's
    #     global_resource_collector_region is us-east-1).
    #
    # This file keeps security-monitoring/main's alert settings.
    # ========================================================================
    security-monitoring/main:
      vars:
        enable_alert_enrichment: false
        security_email_subscriptions: []

    # ========================================================================
    # Compute (imports only: the instances come whole from the -standby files)
    #
    # Warm = the same cluster shape as fnx-ue1-prod's eks/main at its floor:
    # the workers node group runs at 2 nodes, spread over vpc/main's three
    # private subnets (use2-az1..az3) like every group here, the monitoring
    # and memory-optimized groups at 0, each keeping fnx-ue1-prod's
    # max_group_size. Failover scales them with aws eks
    # update-nodegroup-config, and a PR setting
    # min_group_size/desired_group_size reconciles Terraform afterwards
    # (docs/OPERATIONS.md, "Disaster recovery"). Cloud Posse's eks/cluster
    # node groups take the same min/desired/max inputs. The operator path
    # (bastion) and the in-VPC CI runners are as in fnx-ue1-prod, so the
    # in-cluster components can be applied here on failover.
    #
    # Failover step 6 switches this file's eks-backend-services import to
    # main-standby-failover and sets database_secret_arn here, never in the
    # shared files.
    # ========================================================================

    # ========================================================================
    # Services
    #
    # The data tier the serving path fails over to, kept in sync continuously:
    #   - rds/main: a cross-region read replica of fnx-ue1-prod's rds/main
    #     (Cloud Posse terraform-aws-rds replicate_source_db). Once promoted,
    #     this file's import catalog/rds/main-standby switches to
    #     catalog/rds/main-standby-promoted (reconciliation step 1).
    #   - elasticache/main: a Global Datastore secondary of fnx-ue1-prod's
    #     elasticache/main (Cloud Posse aws-elasticache-redis
    #     global_replication_group_id).
    #   - apigateway/main: the SECONDARY half of api.<domain>'s Route 53
    #     failover pair; fnx-ue1-prod's apigateway/main is the PRIMARY. Each
    #     half has its own health check, so DNS moves without a change here.
    #   - cognito/main: this region's own user pool (owner decision 2026-10-07:
    #     DR auth must not depend on us-east-1). AWS does not replicate user
    #     pools, so lambda/cognito-user-migration copies each user from
    #     fnx-ue1-prod's pool on their first sign-in or password reset here.
    #   - monitoring/main: this region's ue2-main-alarms topic and the alarms
    #     on its data tier and API.
    # rds/data (analytics) is not replicated: it is restored from
    # backup/main's copies in us-east-2 (docs/OPERATIONS.md, "Disaster
    # recovery").
    #
    # This file keeps apigateway/main's health check alarm target.
    # ========================================================================
    apigateway/main:
      vars:
        # The health check's alarm is in us-east-1 (Route 53's metrics are only
        # there), so it notifies fnx-ue1-prod monitoring/main's topic (ue1).
        # During a us-east-1 outage it is down with it; the out-of-region
        # signal is this region's own API alarms
        # (catalog/apigateway/main-standby).
        health_check_alarm_actions:
          - "arn:aws:sns:us-east-1:{{ .settings.environment.account_id }}:ue1-main-alarms"

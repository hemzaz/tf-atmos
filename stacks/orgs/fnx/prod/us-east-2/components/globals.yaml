---
# =============================================================================
# Global settings for fnx-ue2-prod (DR warm standby of fnx-ue1-prod)
# =============================================================================
# Same tags, domain and contacts as fnx-ue1-prod (orgs/fnx/prod/us-east-1/
# components/globals.yaml): one production service, two regions.
# =============================================================================

import:
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/iam/defaults
  - catalog/acm/defaults
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults

vars:
  tags:
    Team: "Platform"
    CostCenter: "Production"
    Project: "Infrastructure"
    ManagedBy: "Terraform"
    Tenant: "fnx"
    Application: "Production"
    Provisioner: "Atmos"
    DataClassification: "confidential"
    Compliance: "pci-sox-gdpr"
    CriticalityLevel: "high"
    SLA: "99.9"
    BackupRequired: "true"
    DisasterRecovery: "warm-standby"

settings:
  environment:
    # The production domain: api.<domain> fails over to this stack. Its zone is
    # fnx-ue1-prod's network/main (the zone is global; Route 53 has no region).
    domain_name: "fnx.example.com"
    monitoring:
      critical_alerts:
        - "prod-critical@example.com"
        - "oncall@example.com"
      warning_alerts:
        - "prod-alerts@example.com"
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    rds_engine: "postgres"
    rds_engine_version: "14"
    use_external_secrets: true
    # The release pipeline's images, as in fnx-ue1-prod: a failover deploys
    # the same release.
    backend_service_images:
      api_gateway: "ghcr.io/fnx-platform/api-gateway:1.4.2"
      platform_api: "ghcr.io/fnx-platform/platform-api:1.4.2"
      auth_service: "ghcr.io/fnx-platform/auth-service:1.4.2"
      job_processor: "ghcr.io/fnx-platform/job-processor:1.4.2"
    enable_vpc_flow_logs: true

components:
  terraform:
    # Human cluster admins of eks/main, as in fnx-ue1-prod's globals.yaml: the
    # same operators fail the in-cluster services over. Each rolearn must also
    # be in backend/main's access_roles.prod_write (fnx-ue1-root). Empty until
    # the owner supplies the ARN.
    eks/defaults:
      vars:
        map_additional_iam_roles: []

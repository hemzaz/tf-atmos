---
# =============================================================================
# Services for fnx-ue2-prod (DR warm standby)
# =============================================================================
# The data tier the serving path fails over to, kept in sync continuously:
#   - rds/main: a cross-region read replica of fnx-ue1-prod's rds/main
#     (Cloud Posse terraform-aws-rds replicate_source_db). Promote it by
#     setting replicate_source_db to null.
#   - elasticache/main: a Global Datastore secondary of fnx-ue1-prod's
#     elasticache/main (Cloud Posse aws-elasticache-redis
#     global_replication_group_id).
#   - apigateway/main: the SECONDARY half of api.<domain>'s Route 53 failover
#     pair; fnx-ue1-prod's apigateway/main is the PRIMARY. Each half has its
#     own health check, so DNS moves without a change here.
# rds/data (analytics) is not replicated: it is restored from backup/main's
# copies in us-east-2 (docs/OPERATIONS.md, "Disaster recovery").
# =============================================================================

import:
  - orgs/fnx/prod/us-east-2/components/globals
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  - catalog/rds/prod
  - catalog/elasticache/prod

components:
  terraform:
    rds/main:
      metadata:
        component: rds
        inherits:
          - rds/prod
      vars:
        environment: "{{ .settings.context.stage }}"
        identifier: "{{ .settings.context.stage }}-main-db"
        replicate_source_db: !terraform.state rds/main fnx-ue1-prod .instance_arn
        # Used once promoted (a replica takes the source's); kept equal to
        # fnx-ue1-prod's so the promoted instance matches it.
        db_name: "productionapp"
        # backup/main selects it once promoted (Role=primary).
        tags:
          Backup: "true"
        # The parameter group family follows the source's engine.
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        family: "postgres14"
        # Warm: one size below fnx-ue1-prod's db.r5.xlarge; resize on failover
        # if the load needs it (a modify, not a replacement).
        instance_class: "db.r5.large"
        allocated_storage: 100
        max_allocated_storage: 500
        kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        backup_window: "03:00-04:00"
        maintenance_window: "Sun:04:30-Sun:05:30"
        performance_insights_retention_period: 7
        performance_insights_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        master_user_secret_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        enabled_cloudwatch_logs_exports:
          - "postgresql"
          - "upgrade"
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .database_subnet_ids
        allowed_security_groups: !terraform.state eks/main .eks_cluster_managed_security_group_id | [.]
      dependencies:
        components:
          - component: rds/main
            stack: fnx-ue1-prod
          - component: vpc/main
          - component: kms/main
            stack: fnx-ue1-prod
          - component: eks/main

    elasticache/main:
      metadata:
        component: elasticache
        inherits:
          - elasticache/prod
      vars:
        cluster_id: "{{ .settings.context.stage }}-cache"
        global_replication_group_id: !terraform.state elasticache/main fnx-ue1-prod .global_replication_group_id
        # Inherited from the global group, set for the component's own checks
        # and kept equal to fnx-ue1-prod's.
        engine_version: "7.0"
        node_type: "cache.r5.large"
        # Warm: a primary and one replica (the prod floor for failover across
        # AZs, check-prod-protection); fnx-ue1-prod runs 3.
        num_cache_nodes: 2
        kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        auth_token_secret_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        allowed_security_group_ids: !terraform.state eks/main .eks_cluster_managed_security_group_id | [.]
        allowed_cidr_blocks: []
      dependencies:
        components:
          - component: elasticache/main
            stack: fnx-ue1-prod
          - component: vpc/main
          - component: kms/main
            stack: fnx-ue1-prod
          - component: eks/main

    # The SECONDARY half of api.<domain>: the same routes as fnx-ue1-prod's
    # apigateway/main. No Cognito authorizer: no method uses one yet (/api is
    # disabled with lambda/data-processor), and a user pool does not
    # replicate across regions (owner question in the B1 PR).
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Production Main API Gateway (DR)"
        stage_name: "v1"
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"
          - path_part: "users"
          - path_part: "products"
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "NONE"
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "GET"
            type: "MOCK"
        domain_name: "api.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.api
        api_name: "{{ .settings.context.stage }}-main-api"
        zone_id: !terraform.state network/main fnx-ue1-prod .zone_ids.main
        route53_failover_type: SECONDARY
        route53_set_identifier: "{{ .settings.prefix }}"
        # The health check's alarm is in us-east-1 (Route 53's metrics are only
        # there), so it notifies fnx-ue1-prod monitoring/main's topic (ue1).
        health_check_alarm_actions:
          - "arn:aws:sns:us-east-1:{{ .settings.environment.account_id }}:ue1-main-alarms"
        # The out-of-region signal: during a us-east-1 outage the alarms above
        # and ue1-main-alarms are down with it. These watch this region's own
        # API (5xx, latency) and notify monitoring/main's ue2 topic, by name
        # (monitoring/main reads this component).
        create_performance_alarms: true
        alarm_5xx_threshold: 10
        alarm_latency_threshold: 5000
        sns_topic_arn: "arn:aws:sns:{{ .vars.region }}:{{ .settings.environment.account_id }}:{{ .settings.prefix }}-main-alarms"
        throttling_burst_limit: 5000
        throttling_rate_limit: 10000
        enable_logging: true
        log_retention_days: 90
        create_dashboard: true
        tracing_enabled: true
        enable_caching: false
        enable_waf: true
        tags:
          Service: api-gateway
          Tier: edge
          CriticalityLevel: "high"
      dependencies:
        components:
          - component: apigateway-account/main
          - component: network/main
            stack: fnx-ue1-prod
          - component: acm/main

    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        name: main
        kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        create_dashboard: true
        enable_certificate_monitoring: true
        certificate_arns: !terraform.state acm/main .certificate_arns // {} | [.[]]
        certificate_expiry_threshold: 30
        alarm_email_subscriptions:
          - "prod-critical@example.com"
          - "oncall@example.com"
        eks_cluster_name: !terraform.state eks/main .eks_cluster_id
        # eks/main's warm floor: workers min_group_size 2 (compute.yaml).
        eks_min_node_count: 2
        rds_instances: !terraform.state rds/main .instance_identifier | [.]
        elasticache_clusters: !terraform.state elasticache/main .member_clusters
        api_gateway_name: !terraform.state apigateway/main .api_name
        api_gateway_stages: !terraform.state apigateway/main .rest_api_stage_name | [.]
        create_sns_topic: true
        enable_rds_monitoring: true
        rds_cpu_threshold: 80
        db_connection_alarms:
          rds_connections_high:
            evaluation_periods: 2
            period: 300
            threshold: 400
        rds_storage_threshold: 10737418240
        api_gateway_error_threshold: 10
        api_gateway_latency_threshold: 5000
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
          - component: kms/main
            stack: fnx-ue1-prod
          - component: eks/main
          - component: rds/main
          - component: elasticache/main
          - component: apigateway/main

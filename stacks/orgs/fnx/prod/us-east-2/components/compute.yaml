---
# =============================================================================
# Compute for fnx-ue2-prod (DR warm standby)
# =============================================================================
# Warm = the same cluster shape as fnx-ue1-prod's eks/main at its floor: the
# workers node group runs at 2 nodes (one per AZ for two AZs), the monitoring
# and memory-optimized groups at 0, each keeping fnx-ue1-prod's max_group_size.
# Failover scales them (cluster-autoscaler from eks-addons/main, or
# min_group_size/desired_group_size in a PR: docs/OPERATIONS.md, "Disaster
# recovery"). Cloud Posse's eks/cluster node groups take the same
# min/desired/max inputs. The operator path (bastion) and the in-VPC CI
# runners are as in fnx-ue1-prod, so the in-cluster components can be applied
# here on failover.
# =============================================================================

import:
  - orgs/fnx/prod/us-east-2/components/globals
  - catalog/eks/defaults
  - catalog/github-runners/defaults
  - catalog/ec2/defaults
  - catalog/external-secrets/defaults
  - catalog/eks-addons/defaults
  - catalog/eks-backend-services/defaults

components:
  terraform:
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        # The cluster is "<Environment>-<name>": ue2-main.
        name: main
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        allowed_security_group_ids:
          - !terraform.state ec2/bastion .security_group_id
          - !terraform.state github-runners/main .security_group_id
        tags:
          Cluster: "{{ .settings.prefix }}-main"
          Purpose: "application-workloads"
          CriticalityLevel: "high"
          SLA: "99.9"
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: false
        enabled_cluster_log_types:
          - "api"
          - "audit"
          - "authenticator"
          - "controllerManager"
          - "scheduler"
        cluster_encryption_config_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        node_group_ebs_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        cluster_log_retention_period: 90
        node_groups:
          workers:
            instance_types: ["m5.xlarge"]
            desired_group_size: 2
            min_group_size: 2
            max_group_size: 12
            kubernetes_labels:
              role: worker
              environment: "{{ .settings.context.stage }}"
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
            subnet_ids: !terraform.state vpc/main .private_subnet_ids
            tags:
              NodeGroup: workers
          monitoring:
            instance_types: ["m5.large"]
            desired_group_size: 0
            min_group_size: 0
            max_group_size: 4
            kubernetes_labels:
              role: monitoring
            kubernetes_taints:
              - key: dedicated
                value: monitoring
                effect: "NO_SCHEDULE"
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 200
          memory-optimized:
            instance_types: ["r5.xlarge"]
            desired_group_size: 0
            min_group_size: 0
            max_group_size: 6
            kubernetes_labels:
              role: memory-optimized
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
            stack: fnx-ue1-prod
          - component: iam/ci
          - component: ec2/bastion
          - component: github-runners/main

    ec2/bastion:
      metadata:
        component: ec2
        inherits:
          - ec2
      vars:
        name: bastion
        vpc_id: !terraform.state vpc/main .vpc_id
        ssh_key_secret_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        disable_api_termination: true
        tags:
          Role: bastion
          Access: restricted
          CriticalityLevel: "high"
        metadata_http_tokens_required: true
        metadata_http_put_response_hop_limit: 1
        instance_type: "t3.small"
        subnet: !terraform.state vpc/main .private_subnet_ids[0]
        ebs_optimized: true
        allowed_ingress_rules:
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["10.0.0.0/8"]
            description: "SSH from internal VPN only"
        allowed_egress_rules:
          - from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS outbound"
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["{{ .settings.network.vpc_cidrs.main }}"]
            description: "SSH to VPC resources"
        monitoring: true
        root_volume_type: "gp3"
        root_volume_size: 20
        root_block_device_encrypted: true
        root_block_device_kms_key_id: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        delete_on_termination: true
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
            stack: fnx-ue1-prod

    external-secrets/main:
      metadata:
        component: external-secrets
        inherits:
          - external-secrets/defaults
      vars:
        enabled: true
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/main .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/main .eks_cluster_identity_oidc_issuer
        kms_key_arn: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        namespace: "external-secrets"
        service_account_name: "external-secrets"
        create_default_cluster_secret_store: true
        create_certificate_secret_store: true
        rds_managed_secret_access: true
        allowed_namespaces: ["backend-services"]
      dependencies:
        components:
          - component: eks/main
          - component: kms/main
            stack: fnx-ue1-prod

    eks-addons/main:
      metadata:
        component: eks-addons
        inherits:
          - eks-addons
      vars:
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/main .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/main .eks_cluster_identity_oidc_issuer
        clusters:
          main:
            enable_aws_load_balancer_controller: true
            # Scales the warm node groups up from their floor on failover load.
            enable_cluster_autoscaler: true
            enable_metrics_server: true
            # No external-dns: the public name moves by the failover record
            # (apigateway/main), not by this cluster's ingresses.
            enable_external_dns: false
            enable_cert_manager: true
            # cert-manager's DNS01 zone: the production zone, fnx-ue1-prod's
            # network/main (Route 53 zones are global).
            dns_zone_ids: !terraform.state network/main fnx-ue1-prod '.zone_ids.main | [.]'
            enable_container_insights: true
            container_insights_kms_key_arn: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
            container_insights_log_retention_days: 90
            vpc_id: !terraform.state vpc/main .vpc_id
            cert_manager_letsencrypt_email: "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
      dependencies:
        components:
          - component: eks/main
          - component: vpc/main
          - component: network/main
            stack: fnx-ue1-prod
          - component: kms/main
            stack: fnx-ue1-prod

    # Deployed on failover, not while warm: its database and cache are
    # read-only replicas until promoted, and the database's master secret
    # exists only after promotion (rds replicate_source_db). The failover
    # runbook sets enabled to true after promoting them (docs/OPERATIONS.md,
    # "Disaster recovery"). Wired as fnx-ue1-prod's.
    eks-backend-services/main:
      metadata:
        component: eks-backend-services
        enabled: false
        inherits:
          - eks-backend-services/defaults
      vars:
        environment: "{{ .settings.context.stage }}"
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        cluster_secret_store_name: !terraform.state external-secrets/main .default_cluster_secret_store_name
        database_secret_arn: !terraform.state rds/main .password_secret_arn
        database_endpoint: !terraform.state rds/main .instance_endpoint
        database_name: !terraform.state rds/main .instance_name
        redis_enabled: true
        redis_secret_arn: !terraform.state elasticache/main .auth_token_secret_arn
        redis_host: !terraform.state elasticache/main .primary_endpoint_address
        redis_port: !terraform.state elasticache/main .port
        api_gateway_image: '{{ required "settings.environment.backend_service_images.api_gateway must be set" .settings.environment.backend_service_images.api_gateway }}'
        platform_api_image: '{{ required "settings.environment.backend_service_images.platform_api must be set" .settings.environment.backend_service_images.platform_api }}'
        auth_service_image: '{{ required "settings.environment.backend_service_images.auth_service must be set" .settings.environment.backend_service_images.auth_service }}'
        job_processor_image: '{{ required "settings.environment.backend_service_images.job_processor must be set" .settings.environment.backend_service_images.job_processor }}'
      dependencies:
        components:
          - component: eks/main
          - component: eks-addons/main
          - component: external-secrets/main
          - component: rds/main
          - component: elasticache/main

    github-runners/main:
      metadata:
        component: github-runners
        inherits:
          - github-runners/defaults
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        kms_key_arn: !terraform.state kms/main fnx-ue1-prod '.replica_keys["us-east-2"].key_arn'
        alarm_sns_topic_arns:
          - "arn:aws:sns:{{ .vars.region }}:{{ .settings.environment.account_id }}:{{ .settings.prefix }}-main-alarms"
      dependencies:
        components:
          - component: kms/main
            stack: fnx-ue1-prod
          - component: vpc/main

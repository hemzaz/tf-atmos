---
# =============================================================================
# Compute for fnx-ue2-prod (DR warm standby)
# =============================================================================
# Warm = the same cluster shape as fnx-ue1-prod's eks/main at its floor: the
# workers node group runs at 2 nodes, spread over vpc/main's three private
# subnets (use2-az1..az3) like every group here, the monitoring and
# memory-optimized groups at 0, each keeping fnx-ue1-prod's max_group_size.
# Failover scales them with aws eks update-nodegroup-config, and a PR setting
# min_group_size/desired_group_size reconciles Terraform afterwards
# (docs/OPERATIONS.md, "Disaster recovery"). Cloud Posse's eks/cluster node groups take the same
# min/desired/max inputs. The operator path (bastion) and the in-VPC CI
# runners are as in fnx-ue1-prod, so the in-cluster components can be applied
# here on failover.
#
# The instances' wiring is the catalog's -standby files, shared with
# fnx-ec1-prod (settings.dr.standby_of names fnx-ue1-prod). Failover step 6
# switches this file's eks-backend-services import to main-standby-failover
# and sets database_secret_arn here, never in the shared files.
# =============================================================================

import:
  - orgs/fnx/prod/us-east-2/components/globals
  - catalog/eks/main-standby
  - catalog/github-runners/main-standby
  - catalog/ec2/bastion-standby
  - catalog/external-secrets/main-standby
  - catalog/eks-addons/main-standby
  - catalog/eks-backend-services/main-standby

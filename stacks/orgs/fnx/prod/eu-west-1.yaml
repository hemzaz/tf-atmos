---
# =============================================================================
# fnx-ew1-prod: EU production, eu-west-1, its own account (prod-eu)
# =============================================================================
# Owner decision (B5, GDPR data residency): EU personal data lives only in EU
# stacks. This is the EU prod stack: stage prod, region eu-west-1, in its OWN
# AWS account (account map key prod-eu), never the US prod account. Tagged
# Compliance "pci-sox-gdpr" (vars.tags below); check-data-residency.py
# fails it if it names a non-EU region or depends on a US stack.
#
# Its state is in the EU backend, fnx-ew1-root's backend/main (bucket
# fnx-ew1-terraform-state in eu-west-1, replica in eu-central-1), through that
# backend's prod_read/prod_write roles (stacks/orgs/fnx/root/eu-west-1.yaml).
#
# A new account, so this stack owns the account's singletons: the GitHub OIDC
# provider (iam/ci), the Auto Scaling service-linked role (iam/main), the
# multi-region CloudTrail trail, AWS Config's global-resource recording and
# the account budget (cost-optimization/main).
# Today the account and identity layer (iam/main, iam/ci), kms/main
# (replicated to eu-central-1), those singletons, networking (vpc/main, the
# EU apex zone network/main) and the regional security services (GuardDuty,
# Security Hub, Inspector, finding routing, API Gateway account settings,
# backups copied to eu-central-1, the apex certificate, secrets), compute
# (eks/main ew1-main, the bastion, the in-VPC runner pool, external-secrets,
# eks-addons, eks-backend-services) and services (rds/main,
# elasticache/main, cognito/main, apigateway/main, monitoring/main): the EU
# core subset of fnx-ue1-prod. Its DR warm standby is fnx-ec1-prod
# (stacks/orgs/fnx/prod/eu-central-1.yaml), in the same account.
#
# First deploy: docs/OPERATIONS.md ("Deploying a stack"), with
# administrator credentials in the prod-eu account:
#   atmos workflow full -f bootstrap -s fnx-ew1-prod
#
# One file per stack: the imports, then one vars/settings/components body,
# grouped by domain (globals, networking, security, compute, services).
# =============================================================================

import:
  - catalog/_base/defaults
  # Region mixin: region eu-west-1, environment (region code) ew1
  - mixins/region/eu-west-1
  - orgs/fnx/prod/_defaults

  # --- globals: catalog defaults (the rest come with their instances)
  - catalog/iam/defaults
  - catalog/vpc/defaults
  - catalog/network/defaults
  - catalog/eks/defaults

  # --- networking
  - catalog/vpc/main-prod
  - catalog/network/main-prod

  # --- security
  - catalog/iam/main-prod
  - catalog/iam/ci-prod
  - catalog/kms/main-prod
  - catalog/cloudtrail/main
  - catalog/awsconfig/main
  - catalog/guardduty/main-prod
  - catalog/securityhub/main-prod
  - catalog/inspector2/main
  - catalog/security-monitoring/main
  - catalog/apigateway-account/main
  - catalog/backup/main-prod
  - catalog/acm/main-prod
  - catalog/secretsmanager/app-prod
  - catalog/secretsmanager/infra-prod

  # --- compute
  - catalog/eks/main-prod
  - catalog/github-runners/main-prod
  - catalog/ec2/bastion-prod
  - catalog/external-secrets/main-prod
  - catalog/eks-addons/main-prod
  - catalog/eks-backend-services/main-prod

  # --- services
  - catalog/cost-optimization/main-prod-eu
  - catalog/rds/main-prod
  - catalog/elasticache/main-prod
  - catalog/cognito/main-prod
  - catalog/apigateway/main-prod
  - catalog/monitoring/main-prod

vars:
  region: eu-west-1
  # fnx-ue1-prod's tags (orgs/fnx/prod/us-east-1.yaml) with
  # Compliance "pci-sox-gdpr": the EU stacks' tag, which check-data-residency.py
  # requires on every instance of a GDPR-scoped stack. EKS settings and the
  # cluster admins as in fnx-ue1-prod.
  # The catalogs are imported first, as in fnx-ue1-prod, so these vars win
  # over catalog/_base/defaults' tags (Project).
  tags:
    Team: "Platform"
    CostCenter: "Production"
    Project: "Infrastructure"
    ManagedBy: "Terraform"
    Tenant: "fnx"
    Application: "Production"
    Provisioner: "Atmos"
    DataClassification: "confidential"
    Compliance: "pci-sox-gdpr"
    CriticalityLevel: "high"
    SLA: "99.9"
    BackupRequired: "true"

settings:
  # DR region of this primary (its warm standby fnx-ec1-prod), an EU one: the
  # prod catalog files template their replica copies and reads from it
  # (catalog/secretsmanager/{app,infra}-prod, catalog/kms/main-prod,
  # catalog/backup/main-prod). Not settings.tfstate.replica_region below,
  # the state bucket's replica.
  dr:
    region: eu-central-1
  environment:
    # The EU prod account (stacks/orgs/fnx/_defaults.yaml account map), not
    # prod's: prod/_defaults derives account_id from this key.
    account: prod-eu
    # The stack's one domain, as in fnx-ue1-prod (every zone, record,
    # certificate and API domain derives from it). A SEPARATE EU apex owned by
    # the prod-eu account, never a name under the US domain: no delegation
    # from fnx-ue1-prod's zone and no read of US state. A placeholder until
    # the owner registers the real one: the first-deploy preflight flags it
    # (example domain, row "Domains").
    domain_name: "fnx-eu.example.com"
    # Alert contacts and the prod-eu account's monthly budget
    # (cost-optimization/main, services section): fnx-ue1-prod's placeholder
    # values until the owner sets the EU ones (the preflight flags the
    # example.com addresses, row "Alert recipients"; the budget is row
    # "Budgets", a preflight notice).
    monitoring:
      critical_alerts:
        - "prod-critical@example.com"
        - "oncall@example.com"
      warning_alerts:
        - "prod-alerts@example.com"
      budget_monthly_limit: "10000"
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    rds_engine: "postgres"
    rds_engine_version: "14"
    use_external_secrets: true
    # eks-backend-services/main's images (compute section), the release
    # pipeline's, as in fnx-ue1-prod: the same release in both regions.
    # Placeholders until it publishes them (docs/OPERATIONS.md,
    # "First-deploy inputs", Backend service images).
    backend_service_images:
      api_gateway: "ghcr.io/fnx-platform/api-gateway:1.4.2"
      platform_api: "ghcr.io/fnx-platform/platform-api:1.4.2"
      auth_service: "ghcr.io/fnx-platform/auth-service:1.4.2"
      job_processor: "ghcr.io/fnx-platform/job-processor:1.4.2"
  context:
    tenant: fnx
    stage: prod
  # The EU backend, overriding every settings.tfstate key (literal
  # .settings.context.* references only, see stacks/orgs/fnx/_defaults.yaml);
  # the same values as fnx-ew1-root's, which owns it.
  tfstate:
    region: eu-west-1
    replica_region: eu-central-1
    bucket: '{{ .settings.context.tenant }}-ew1-terraform-state'
    role_prefix: '{{ .settings.context.tenant }}-ew1-terraform-backend'
    stack: '{{ .settings.context.tenant }}-ew1-root'
  network:
    vpc_cidrs:
      main: "10.30.0.0/16"

components:
  terraform:
    # ========================================================================
    # Globals
    # ========================================================================
    # Human cluster admins of eks/main, as in fnx-ue1-prod
    # (orgs/fnx/prod/us-east-1.yaml, which explains the format): each rolearn,
    # an IAM role in the prod-eu account, must also be in the EU backend's
    # access_roles.prod_write allowed_principal_arns
    # (stacks/orgs/fnx/root/eu-west-1.yaml); check-cluster-api-ci.py fails one
    # that is not, and warns while this is empty. Empty until the owner
    # supplies the ARN (the preflight flags it, row "EKS cluster admins").
    eks/defaults:
      vars:
        map_additional_iam_roles: []

    # ========================================================================
    # Networking
    #
    # fnx-ue2-prod's core subset (orgs/fnx/prod/us-east-2.yaml's networking,
    # which mirrors fnx-ue1-prod): vpc/main with three AZs, a NAT gateway per
    # AZ and flow logs. No vpc/services or peering: the EU data plane (data
    # VPC, eks/data, rds/data) is not in this stack; 10.31.0.0/16 is reserved
    # for it, and 10.32.0.0/16 is the EU DR stack fnx-ec1-prod's vpc/main.
    #
    # Unlike fnx-ue2-prod it owns its DNS: network/main holds the EU apex
    # (settings.environment.domain_name), delegated at the registrar, never
    # from a US zone. Everything stays in eu-west-1
    # (check-data-residency.py):
    #   - flow logs: a log group in this region on kms/main (security
    #     section);
    #   - Route 53 public query logging is OFF: its log group, resource policy
    #     and key can only be in us-east-1
    #     (components/terraform/dns/query-logging.tf), and the logs hold client
    #     IPs. check-data-residency.py fails a GDPR-scoped dns zone with
    #     enable_query_logging. The dns component has no Resolver (in-VPC)
    #     query logging yet.
    #
    # The instances' wiring is catalog/vpc/main-prod (shared with
    # fnx-ue1-prod; its flow logs use this stack's eu-west-1 kms/main) and
    # catalog/network/main-prod (no records: db.internal.<domain> comes with
    # rds/main). This file keeps the CIDR, AZs, subnets and the EU DNS values.
    # ========================================================================
    vpc/main:
      vars:
        # AZ IDs, not names: see components/terraform/vpc/README.md.
        availability_zone_ids:
          - euw1-az1
          - euw1-az2
          - euw1-az3
        private_subnets:
          - "10.30.1.0/24"
          - "10.30.2.0/24"
          - "10.30.3.0/24"
        public_subnets:
          - "10.30.101.0/24"
          - "10.30.102.0/24"
          - "10.30.103.0/24"
        database_subnets:
          - "10.30.201.0/24"
          - "10.30.202.0/24"
          - "10.30.203.0/24"

    network/main:
      vars:
        zones:
          main:
            comment: "EU production main zone"
            # Off for every EU zone: Route 53 writes query logs only to
            # us-east-1.
            enable_query_logging: false
          internal:
            comment: "EU production internal DNS"

    # ========================================================================
    # Security
    #
    # The account and identity layer (iam/main, iam/ci), the stack's key
    # (kms/main) and the prod-eu account's singletons: the multi-region
    # CloudTrail trail (cloudtrail/main) and AWS Config's global-resource
    # recording (awsconfig/main); the account budget is cost-optimization/main
    # (services section). Then the regional security services: GuardDuty,
    # Security Hub, Inspector and finding routing with the CIS metric filters
    # on this stack's trail (security-monitoring/main); the API Gateway
    # account settings, backups, the EU apex's certificate and the prod secret
    # sets. As in fnx-ue1-prod (orgs/fnx/prod/us-east-1.yaml's security; every
    # instance's wiring is the same catalog/<c>/<i> file, -prod where a prod
    # primary differs, which explains each input, and the shared prod settings
    # are catalog/<component>/prod), except:
    #   - DR copies (kms/main's replica, backup/main's copies) go to
    #     eu-central-1, the EU DR region (settings.dr.region), never us-east-2;
    #   - a new account: this stack owns every singleton fnx-ue2-prod leaves to
    #     fnx-ue1-prod (the GitHub OIDC provider, the Auto Scaling
    #     service-linked role, the trail, global-resource recording, the
    #     budget); nothing here reads a US stack;
    #   - state: the EU backend's prod roles in the management account
    #     (settings.tfstate, role_prefix fnx-ew1-terraform-backend,
    #     fnx-ew1-root), which trust these CI roles
    #     (stacks/orgs/fnx/root/eu-west-1.yaml);
    #   - no lambda uploader yet: the PR adding the Lambda bucket adds it.
    # Both catalog/iam dependencies resolve to backend/main in fnx-ew1-root.
    # Every finding stays in eu-west-1: no Security Hub cross-region
    # aggregation, no GuardDuty export, the alert topic on kms/main, and no
    # enrichment Lambda (check-data-residency.py fails enable_alert_enrichment
    # in a GDPR-scoped stack: it posts findings, IPs included, to
    # Slack/PagerDuty).
    # The secrets' EU replica (eu-central-1 only) is
    # catalog/secretsmanager/{app,infra}-prod's, in settings.dr.region
    # (above). The apex's certificate is validated in network/main's zone
    # (networking section), its *.api SAN's record also validates
    # fnx-ec1-prod's acm/main; there is no acm/services (no services zone
    # here). This file keeps the per-stack values.
    # ========================================================================
    kms/main:
      vars:
        description: EU production main encryption key
        # cost-optimization/main's budget and anomaly notifications publish to
        # its cost-alerts topic on this key (billing_notifications_sns_enabled).
        allow_billing_notifications: true
        # Replicated to the EU DR region only (never a US one; replica_regions
        # is catalog/kms/main-prod's settings.dr.region): fnx-ec1-prod, the EU
        # DR stack, reads the replica's ARN cross-stack and reaches it by its
        # own prefix's alias, as fnx-ue2-prod does ue1's (ue2-main).
        replica_alias_names:
          eu-central-1: ec1-main

    # ========================================================================
    # Compute
    #
    # fnx-ue1-prod's main cluster and what runs around it, from the shared
    # prod instance files (catalog/<component>/<i>-prod): eks/main (ew1-main,
    # the name vpc/main's load balancer subnet tags expect), the bastion, the
    # in-VPC runner pool, and the in-cluster external-secrets/main,
    # eks-addons/main (external-dns and cert-manager in the EU apex's zone,
    # network/main) and eks-backend-services/main (on the services section's
    # rds/main and elasticache/main). No eks/data: the EU data plane (data
    # VPC, eks/data, rds/data) is not in this stack. This file keeps the
    # bastion's egress rules.
    #
    # The endpoint is private, so CI runs the in-cluster instances on this
    # stack's own pool (settings.github.runner: in-vpc, owner decision Q8),
    # which CI starts in eu-west-1 (its vars.region, #350); iam/ci lets only
    # this stack's apply role start it (ci_runner_pool_names, security
    # section). The pool's alarms name the ew1-main-alarms topic, which
    # monitoring/main (services section) creates.
    #
    # Everything stays in eu-west-1 (check-data-residency.py): control-plane
    # logs and Container Insights go to this region's CloudWatch on kms/main,
    # the runners' JIT configuration to this region's SSM. The GitHub App
    # private key is a parameter in the prod-eu account's SSM
    # (docs/OPERATIONS.md, "First-deploy inputs", GitHub App).
    # ========================================================================
    # The SSH rule names this stack's one VPC.
    ec2/bastion:
      vars:
        allowed_egress_rules:
          - from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS outbound"
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["{{ .settings.network.vpc_cidrs.main }}"]
            description: "SSH to VPC resources"

    # ========================================================================
    # Services
    #
    # fnx-ue1-prod's serving path: the main database and cache, the user pool
    # and the main API from the instance files it shares with it
    # (catalog/<c>/<i>-prod, which explain each input), plus monitoring/main
    # (catalog/monitoring/main-prod, not fnx-ue1-prod's main-prod-data-plane:
    # no ecs/main read) and the prod-eu account's budget
    # (cost-optimization/main-prod-eu). This file keeps this stack's values:
    # the health check's checker and relay regions, the relayed alarms'
    # receipt and the budget's standby tag. Its DR warm standby is fnx-ec1-prod
    # (eu-central-1), as fnx-ue2-prod is fnx-ue1-prod's:
    #   - elasticache/main is a Global Datastore primary, rds/main the source of
    #     fnx-ec1-prod's read replica, cognito/main has the dr-migration client
    #     fnx-ec1-prod's user-migration trigger signs in with, and
    #     apigateway/main is the PRIMARY half of api.<EU apex>'s Route 53
    #     failover pair. All EU to EU, except what Route 53 has only in
    #     us-east-1: the health check, its alarm and the EventBridge rule,
    #     targets and role relaying the alarm to both EU regions
    #     (configuration only, nothing persisted, no personal data), plus two
    #     of its three checker regions (eu-west-1 is the only EU one); owner
    #     decision B5;
    #   - its own user pool, never a migration from fnx-ue1-prod's (owner
    #     decision): EU users sign up here;
    #   - no ECS cluster, analytics database, data API or Lambda functions.
    # Every database snapshot, backup copy (backup/main: eu-central-1 only) and
    # log stays in the EU (check-data-residency.py).
    # ========================================================================
    # api.<EU apex>, as fnx-ue1-prod's: the PRIMARY half of its Route 53
    # failover pair (catalog/apigateway/main-prod); fnx-ec1-prod's
    # apigateway/main is the SECONDARY.
    apigateway/main:
      vars:
        # The checkers: eu-west-1, the only EU checker region, plus two others
        # (Route 53 needs three): probes of the API's stage root, a residency
        # exemption (check-data-residency.py EXEMPTIONS).
        health_check_regions: ["eu-west-1", "us-east-1", "ap-southeast-1"]
        # The health check's alarm lives in us-east-1 (Route 53's metrics are
        # only there). fnx-ue1-prod's notifies its monitoring topic there; this
        # stack keeps nothing persistent in us-east-1 (no topic, key or email
        # addresses), so EventBridge relays the alarm's state changes to the
        # default bus of BOTH EU regions, where each monitoring/main delivers
        # them to its topic (ew1-main-alarms, ec1-main-alarms): an eu-west-1
        # outage, the one this alarm reports, still reaches ec1-main-alarms.
        # What sits in us-east-1 for it: the Route 53 health check, its alarm,
        # and an EventBridge rule, its targets and their IAM role (configuration
        # only: no topic, key, subscription, archive or queue, nothing
        # persisted; no personal data). Owner decision B5.
        health_check_alarm_relay_regions: ["eu-west-1", "eu-central-1"]

    # Owns <Environment>-main-alarms (ew1-main-alarms), the topic the runner
    # pool's alarms name (compute section), and delivers the relayed us-east-1
    # health check alarms of the EU failover pair to it (apigateway/main).
    monitoring/main:
      vars:
        receive_relayed_health_check_alarms: true

    # From catalog/cost-optimization/main-prod-eu, not the un-suffixed default
    # fnx-ue1-prod imports: the budget and the anomaly subscription notify the
    # eu-west-1 cost-alerts topic, never staff email addresses directly. The
    # prod-eu account's budget also counts its DR standby fnx-ec1-prod
    # (Environment ec1, same account, no budget of its own, owner decision);
    # lint check-dr-pairs (dr-pair.py --lint) fails a standby missing here.
    cost-optimization/main:
      vars:
        budget_additional_environment_tags: ["ec1"]

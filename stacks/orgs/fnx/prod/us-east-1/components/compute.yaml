---
# =============================================================================
# Compute Component Configurations for Production Environment
# =============================================================================
# Production compute with high availability, auto-scaling, and full monitoring
# Multi-AZ deployments, reserved capacity, enhanced security
# The instances' wiring is catalog/<c>/<i>-prod (eks/main, the bastion, the
# runner pool, external-secrets/main, eks-addons/main and
# eks-backend-services/main, shared with fnx-ew1-prod) and the data plane's
# un-suffixed catalog/<c>/data (shared with dev and staging). This file keeps
# this stack's values: eks/data's tags, logs and node groups, the bastion's
# egress rules, and the data plane's switches and log retention.
# =============================================================================

import:
  - orgs/fnx/prod/us-east-1/components/globals
  - catalog/eks/main-prod
  - catalog/eks/data
  - catalog/github-runners/main-prod
  - catalog/ec2/bastion-prod
  - catalog/external-secrets/main-prod
  - catalog/external-secrets/data
  - catalog/eks-addons/main-prod
  - catalog/eks-addons/data
  - catalog/eks-backend-services/main-prod

components:
  terraform:
    # ==========================================================================
    # EKS Cluster - Data Processing Workloads (Production HA)
    # ==========================================================================
    eks/data:
      vars:
        tags:
          Cluster: "{{ .settings.prefix }}-data"
          Purpose: "data-processing"
        enabled_cluster_log_types:
          - "api"
          - "audit"
        cluster_log_retention_period: 90
        node_groups:
          # Data processing workers
          data-workers:
            instance_types: ["r5.2xlarge"]
            desired_group_size: 4
            min_group_size: 3
            max_group_size: 8
            kubernetes_labels:
              role: data-processing
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 200
          # Batch processing (can use spot for cost savings)
          batch-workers:
            instance_types: ["m5.2xlarge", "m5.xlarge"]
            desired_group_size: 2
            min_group_size: 0
            max_group_size: 10
            kubernetes_labels:
              role: batch
            kubernetes_taints:
              - key: workload
                value: batch
                effect: "NO_SCHEDULE"
            capacity_type: "SPOT"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100

    # ==========================================================================
    # EC2 Bastion Host (Production Hardened)
    # ==========================================================================
    # The SSH rule names vpc/main's and vpc/services' CIDRs.
    ec2/bastion:
      vars:
        allowed_egress_rules:
          - from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS outbound"
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["10.20.0.0/16", "10.21.0.0/16"]
            description: "SSH to VPC resources"

    # ==========================================================================
    # External Secrets Operator - Data Cluster
    # ==========================================================================
    external-secrets/data:
      vars:
        enabled: true

    # EKS add-ons on eks/data: Container Insights keeps 90 days in prod.
    eks-addons/data:
      vars:
        clusters:
          data:
            container_insights_log_retention_days: 90

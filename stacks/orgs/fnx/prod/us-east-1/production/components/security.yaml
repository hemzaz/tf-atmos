---
# =============================================================================
# Security Component Configurations for Production Environment
# =============================================================================
# PRODUCTION SECURITY - Maximum protection for business-critical data
# IAM with least privilege, KMS encryption, secrets rotation enabled
# =============================================================================

import:
  - orgs/fnx/prod/us-east-1/production/components/globals
  - catalog/iam/defaults
  - catalog/kms/defaults
  - catalog/secretsmanager/defaults
  - catalog/acm/defaults
  - catalog/cloudtrail/defaults
  - catalog/awsconfig/defaults
  - catalog/guardduty/defaults
  - catalog/securityhub/defaults
  - catalog/inspector2/defaults
  - catalog/apigateway-account/defaults
  - catalog/security-monitoring/defaults
  - catalog/backup/defaults

components:
  terraform:
    # ==========================================================================
    # IAM Roles - Production with Strict Permissions
    # ==========================================================================
    iam/main:
      metadata:
        component: iam
        inherits:
          - iam
      vars:

        # Cross-account access configuration
        cross_account_role_name: "production-prod-fnx-CrossAccountRole"
        policy_name: "production-prod-fnx-CrossAccountPolicy"
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"

        # MFA required for production access (trust condition)
        require_mfa: true

        # kms/main's allow_autoscaling_ebs grant (catalog/kms/defaults.yaml)
        # names the Auto Scaling service-linked role directly as a
        # key-policy principal; this is the one iam instance per account
        # that provisions it.
        enable_autoscaling_service_linked_role: true

        # MFA required for production access
      dependencies:
        components:
          - component: backend/main
            stack: fnx-core-root
    # GitHub Actions OIDC roles. CI plans, drift and DR checks for this stack
    # assume its plan role, and CD its apply role, each derived from this
    # instance (workflows/scripts/common/ci-apply-role-arn.py). Every AWS job
    # skips until repo variable AWS_PLAN_ROLE_ARN (only an "AWS is configured"
    # switch) is set. The trust policy is pinned to exact subject claims -
    # never a wildcard - so no other repo can assume it.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: true
        # Roles become <prefix>-plan and <prefix>-apply. Naming convention from
        # catalog/iam/defaults.yaml, so context.environment (the instance name)
        # is the right key here -- unlike the `environment` variable, a tier.
        ci_role_name_prefix: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-ci"
        # Owner decision: the APPLY role is enabled; it is terraform-cd.yml's
        # deploy role (the ARN is derived from this instance) and the EKS
        # ClusterAdmin access entry (catalog/eks/defaults.yaml). Its trust is
        # Cloud Posse's branch-pinned trusted_github_repos
        # (account-map/modules/team-assume-role-policy/github-assume-role-policy.mixin.tf):
        # ONLY sub = repo:hemzaz/tf-atmos:ref:refs/heads/master - never
        # pull_request, an environment or a wildcard (rejected by validation).
        # No GitHub Environment gates it: every merge to master applies, with
        # no manual approval (owner decision). It deploys every component, the
        # iam component included, so it holds AdministratorAccess: the Cloud
        # Posse model (aws-team-roles' "terraform" role, which their GitOps
        # applies assume). Anything narrower that can still manage IAM is
        # admin with extra steps.
        ci_apply_role_enabled: true
        ci_apply_role_trusted_github_repos:
          - "hemzaz/tf-atmos:master"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        # Owner decision D3: production is planned from master only. The plan
        # role trusts the default-branch subject (drift detection, the
        # terraform-ci.yml plan on push to master) and NOT pull_request, so
        # PR-controlled code can never assume it. terraform-ci.yml drops this
        # stack from PR/merge-queue plans (settings.github.pull_request_plans_enabled
        # in stacks/orgs/fnx/prod/_defaults.yaml).
        ci_plan_role_subjects:
          - "repo:hemzaz/tf-atmos:ref:refs/heads/master"
        # State access: sts:AssumeRole on the single state backend's PROD
        # access roles only (backend/main in the management account's
        # fnx-core-root; objects "*/fnx-prod-*") - plan -> the prod read-only
        # role, apply -> the prod read/write role. Named by the same convention
        # as this stack's own backend (stacks/orgs/fnx/_defaults.yaml), not
        # read from backend/main's state: CI roles never read fnx-core-root
        # state (core_write, the only role that can, trusts the administrator
        # alone). The backend/main dependency below orders the deploys.
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-prod-read-role"
        ci_backend_write_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-prod-role"
        # kms/main's key: eks/main's cluster_encryption_config_kms_key_id
        # (compute.yaml) points every EKS cluster this apply role deploys at
        # this key, and AWS requires the calling principal -- not the
        # cluster's own service role -- to hold kms:DescribeKey/CreateGrant/
        # Encrypt on it (see kms/main's comment below). Scoped by alias, not
        # !terraform.state kms/main .key_arn: iam/ci plans and applies in the
        # deploy-full-stack "iam" layer, BEFORE the "kms" layer
        # (workflows/deploy-full-stack.yaml), so the key's ARN does not exist
        # yet on a first deploy, and reading it here would make iam/ci depend
        # on kms/main while kms/main already depends on iam/main below (a
        # layer-order cycle check-deploy-layers.py rejects). Must match
        # kms/main's alias_name below, prefixed with "alias/".
        ci_apply_kms_key_aliases:
          - alias/production-main
        # Lambda package uploader (<prefix>-lambda-uploader, the iam
        # component's lambda-uploader.tf): the application repo's CI uploads
        # each function's zip to this stage's s3/lambda-artifacts bucket with
        # it (docs/OPERATIONS.md, "Lambda packages"). No role until the app
        # repo is named here as "<org>/<repo>:<branch>" - an owner input. The
        # alias is kms/main's, the bucket's key; check-lambda-packages.py
        # keeps it and the bucket name in step with the storage instances.
        lambda_uploader_trusted_github_repos: []
        lambda_uploader_kms_key_alias: alias/production-main
      dependencies:
        components:
          - component: backend/main
            stack: fnx-core-root
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Production main encryption key (EKS secrets, EC2/EBS, RDS)
        alias_name: production-main  # without the alias/ prefix
        deletion_window_in_days: 30  # prod keeps the full window
        # No named key_administrators/key_users: KMS validates every principal
        # named in a key policy at CreateKey/PutKeyPolicy time, and this repo's
        # IaC creates neither a "role/Admin" nor a "production-eks-node-role" /
        # "production-ci-role" (iam/ci IS enabled here -- see above -- but its
        # real role names are "{ci_role_name_prefix}-plan"/"-apply", never
        # "production-ci-role"); naming any of them would fail the first real
        # apply with MalformedPolicyDocumentException. kms/defaults's
        # enable_default_policy (root-account delegation, the Cloud Posse
        # aws-kms default) is what makes the key usable by whichever IAM
        # principal applies this stack, same as dev and staging.
        #
        # Real consumers get least-privilege key use through their OWN IAM
        # policy scoped to this key, never through key_users:
        #   - EKS node groups' EBS volumes: already covered by
        #     allow_autoscaling_ebs (kms/defaults) naming the Auto Scaling
        #     service-linked role directly -- AWS's documented pattern, see
        #     ../kms/README.md. No node-role grant needed; EBS encryption at
        #     launch is performed by the ASG service, not the node's own role.
        #   - EKS cluster secrets encryption (compute.yaml's
        #     cluster_encryption_config_kms_key_id): the principal that calls
        #     eks:CreateCluster/UpdateClusterConfig needs kms:DescribeKey,
        #     kms:CreateGrant and kms:Encrypt on this key (AWS's
        #     "Encrypting Kubernetes secrets" doc); iam/ci's ci_apply role is
        #     that principal in this repo's CI-driven deploys, granted above
        #     via ci_apply_kms_key_aliases (scoped by alias, not this key's
        #     ARN, since iam/ci plans and applies in the layer before this
        #     kms/main instance -- see the comment above) -- the Cloud Posse
        #     pattern of root-account delegation plus a consumer's own scoped
        #     IAM policy (cloudposse/terraform-aws-kms-key's default key
        #     policy).
      dependencies:
        components:
          # allow_autoscaling_ebs (kms/defaults) names the Auto Scaling
          # service-linked role directly as a principal; iam/main provisions
          # it (enable_autoscaling_service_linked_role) so KMS does not
          # reject the key policy.
          - component: iam/main

    # ==========================================================================
    # ACM Certificates - Production
    # ==========================================================================
    acm/main:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        # Validation records go in the dns zone holding every name below
        # (workflows/scripts/common/check-domains.py enforces it).
        zone_id: !terraform.state network/main .zone_ids.main
        dns_domains:
          main_wildcard:
            domain_name: "*.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "{{ .settings.environment.domain_name }}"
              - "*.api.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true
      dependencies:
        components:
          - component: network/main

    acm/services:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        # Validation records go in the dns zone holding every name below
        # (workflows/scripts/common/check-domains.py enforces it).
        zone_id: !terraform.state network/services .zone_ids.services
        dns_domains:
          services_wildcard:
            domain_name: "*.services.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "api.services.{{ .settings.environment.domain_name }}"
            # No data.services SAN: *.services covers it, and its validation
            # record would sit in the services zone while the name belongs to
            # network/services' own data zone.
            validation_method: "DNS"
            wait_for_validation: true
      dependencies:
        components:
          - component: network/services

    # ==========================================================================
    # Secrets Manager - Production with Rotation
    # ==========================================================================
    secretsmanager/app:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/defaults
      vars:
        # No rotation Lambdas are deployed: rotation settings were removed.
        # The RDS master password is rotated by RDS itself.
        secrets:
          app_credentials:
            name: "credentials"
            description: "Production application credentials"
            path: "production/app"
            generate_random_password: true
            password_length: 48
          api_keys:
            name: "api-keys"
            description: "Production API integration keys"
            path: "production/app/api"
            generate_random_password: true
            password_length: 64
          database_credentials:
            name: "db-credentials"
            description: "Production database credentials"
            path: "production/app/database"
            generate_random_password: true
            password_length: 32
        context_name: "production/app"
        default_recovery_window_in_days: 30
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        secrets:
          tls_certificates:
            name: "tls-certificates"
            description: "Production TLS certificates"
            path: "production/certificates"
          ssh_keys:
            name: "ssh-keys"
            description: "Production SSH keys"
            path: "production/ssh"
          service_accounts:
            name: "service-accounts"
            description: "Production service account credentials"
            path: "production/service-accounts"

        context_name: "production/infra"
        default_recovery_window_in_days: 30

    # ==========================================================================
    # CloudTrail - the account's multi-region trail (S3 + CloudWatch Logs,
    # both encrypted with kms/main). security-monitoring's CIS metric filters
    # read its log group.
    # ==========================================================================
    cloudtrail/main:
      metadata:
        component: cloudtrail
        inherits:
          - cloudtrail/defaults

    # ==========================================================================
    # AWS Config - the recorder Security Hub's FSBP/CIS controls evaluate on.
    # ==========================================================================
    awsconfig/main:
      metadata:
        component: awsconfig
        inherits:
          - awsconfig/defaults

    # ==========================================================================
    # GuardDuty - owns the detector (security-monitoring only consumes it)
    # ==========================================================================
    guardduty/main:
      metadata:
        component: guardduty
        inherits:
          - guardduty/defaults
      vars:
        # Prod turns on the protection plans the catalog leaves opt-in.
        enable_kubernetes_protection: true
        enable_malware_protection: true

        # Auto-archive low severity findings
        auto_archive_filter:
          - severity: 1
            criteria:
              type:
                - "Recon:EC2/Portscan"

    # ==========================================================================
    # Security Hub - owns the hub (security-monitoring only consumes it)
    # ==========================================================================
    securityhub/main:
      metadata:
        component: securityhub
        inherits:
          - securityhub/defaults
      vars:
        # AWS auto-subscribes AWS-FSBP and CIS under enable_default_standards
        # (catalog default). Listing them here as well collides at apply, so
        # `standards` carries only what AWS does not enable for us.
        standards:
          - "pci-dss/v/3.2.1"

    # ==========================================================================
    # Amazon Inspector - owns the enabler (security-monitoring only routes its
    # findings). Off, as in the catalog: Inspector bills per resource scanned.
    # ==========================================================================
    inspector2/main:
      metadata:
        component: inspector2
        inherits:
          - inspector2/defaults

    # ==========================================================================
    # API Gateway account settings - the per-region CloudWatch Logs role that
    # REST execution/access logging needs (apigateway/main and apigateway/data
    # depend on it). One instance per account and region: a second one would
    # overwrite this one's setting.
    # ==========================================================================
    apigateway-account/main:
      metadata:
        component: apigateway-account
        inherits:
          - apigateway-account/defaults

    # ==========================================================================
    # Security finding routing (GuardDuty + Security Hub + Inspector -> SNS)
    # ==========================================================================
    security-monitoring/main:
      metadata:
        component: security-monitoring
        inherits:
          - security-monitoring/defaults

    # ==========================================================================
    # AWS Backup - vault, plans and tag-based selection for rds/main,
    # rds/data (Backup=true in their own services.yaml vars.tags) and any
    # EC2/EBS resource tagged the same way. Retention matches the account's
    # pci-sox-gdpr compliance tag (globals.yaml): 7-year monthly retention for
    # SOX. Vault lock and cross-region replication stay off until an owner
    # explicitly configures a replica region/key.
    # ==========================================================================
    backup/main:
      metadata:
        component: backup
        inherits:
          - backup/defaults
      vars:
        daily_retention_days: 35
        weekly_retention_days: 90
        monthly_retention_days: 2555 # 7 years, SOX
        # Only prod re-enables cold storage: 2555 days of retention easily
        # clears AWS Backup's delete_after >= cold_storage_after + 90
        # requirement. backup/defaults sets this to null so dev's and
        # staging's shorter monthly retention (30/90 days) don't inherit a
        # cold-storage floor they can't satisfy (round-5 review HIGH fix).
        monthly_cold_storage_days: 90
        notification_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.critical_alerts 1 }}"

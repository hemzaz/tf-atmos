---
# =============================================================================
# Global settings for fnx-ew1-prod (EU production, GDPR)
# =============================================================================
# fnx-ue1-prod's tags (orgs/fnx/prod/us-east-1/components/globals.yaml) with
# Compliance "pci-sox-gdpr": the EU stacks' tag, which check-data-residency.py
# requires on every instance of a GDPR-scoped stack. EKS settings and the
# cluster admins as in fnx-ue1-prod.
# The catalogs are imported first, as in the US globals, so these vars win
# over catalog/_base/defaults' tags (Project).
# =============================================================================

import:
  - catalog/iam/defaults
  - catalog/vpc/defaults
  - catalog/network/defaults
  - catalog/eks/defaults

vars:
  tags:
    Team: "Platform"
    CostCenter: "Production"
    Project: "Infrastructure"
    ManagedBy: "Terraform"
    Tenant: "fnx"
    Application: "Production"
    Provisioner: "Atmos"
    DataClassification: "confidential"
    Compliance: "pci-sox-gdpr"
    CriticalityLevel: "high"
    SLA: "99.9"
    BackupRequired: "true"

# The stack's one domain, as in the US globals (every zone, record, certificate
# and API domain derives from it). A SEPARATE EU apex owned by the prod-eu
# account, never a name under the US domain: no delegation from fnx-ue1-prod's
# zone and no read of US state. A placeholder until the owner registers the real
# one: the first-deploy preflight flags it (example domain, row "Domains").
settings:
  environment:
    domain_name: "fnx-eu.example.com"
    # Alert contacts and the prod-eu account's monthly budget
    # (cost-optimization/main, services.yaml): fnx-ue1-prod's placeholder
    # values until the owner sets the EU ones (the preflight flags the
    # example.com addresses, row "Alert recipients"; the budget is row
    # "Budgets", a preflight notice).
    monitoring:
      critical_alerts:
        - "prod-critical@example.com"
        - "oncall@example.com"
      warning_alerts:
        - "prod-alerts@example.com"
      budget_monthly_limit: "10000"
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    rds_engine: "postgres"
    rds_engine_version: "14"
    use_external_secrets: true
    # eks-backend-services/main's images (compute.yaml), the release
    # pipeline's, as in fnx-ue1-prod: the same release in both regions.
    # Placeholders until it publishes them (docs/OPERATIONS.md,
    # "First-deploy inputs", Backend service images).
    backend_service_images:
      api_gateway: "ghcr.io/fnx-platform/api-gateway:1.4.2"
      platform_api: "ghcr.io/fnx-platform/platform-api:1.4.2"
      auth_service: "ghcr.io/fnx-platform/auth-service:1.4.2"
      job_processor: "ghcr.io/fnx-platform/job-processor:1.4.2"

components:
  terraform:
    # Human cluster admins of eks/main, as in fnx-ue1-prod's globals.yaml
    # (which explains the format): each rolearn, an IAM role in the prod-eu
    # account, must also be in the EU backend's access_roles.prod_write
    # allowed_principal_arns (stacks/orgs/fnx/root/eu-west-1.yaml);
    # check-cluster-api-ci.py fails one that is not, and warns while this is
    # empty. Empty until the owner supplies the ARN (the preflight flags it,
    # row "EKS cluster admins").
    eks/defaults:
      vars:
        map_additional_iam_roles: []

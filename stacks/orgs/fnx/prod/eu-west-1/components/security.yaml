---
# =============================================================================
# Security for fnx-ew1-prod (EU production, its own account)
# =============================================================================
# The account and identity layer: iam/main (cross-account role, Auto Scaling
# service-linked role) and iam/ci (GitHub OIDC provider and CI roles). As in
# fnx-ue1-prod (orgs/fnx/prod/us-east-1/components/security.yaml, which
# explains each input), except:
#   - a new account: iam/ci creates the account's GitHub OIDC provider and
#     iam/main the Auto Scaling service-linked role; nothing here reads a US
#     stack (fnx-ue2-prod shares the US prod account's, this stack cannot);
#   - state: the EU backend's prod roles (settings.tfstate, fnx-ew1-root),
#     which trust these CI roles (stacks/orgs/fnx/root/eu-west-1.yaml);
#   - no ci_apply_kms_key_aliases, ci_runner_pool_names or lambda uploader
#     yet: the PRs adding kms/main, the runner pool and the Lambda bucket add
#     them.
# Both catalog/iam dependencies resolve to backend/main in fnx-ew1-root.
# =============================================================================

# catalog/iam/defaults comes through globals, which imports it before its own
# vars; importing it again here, after globals, would let catalog/_base's
# tags (Project) override the globals' ones.
import:
  - orgs/fnx/prod/eu-west-1/components/globals

components:
  terraform:
    iam/main:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"
        require_mfa: true
        # The account's one Auto Scaling service-linked role, which kms/main's
        # allow_autoscaling_ebs grant names (catalog/kms/defaults.yaml).
        enable_autoscaling_service_linked_role: true

    # GitHub Actions OIDC roles of this stack: <full id>-ci-plan/-apply.
    # Prod trust (owner decision D3): master only, for both roles.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        # The prod-eu account's one provider (IAM OIDC providers are per account).
        github_oidc_create_provider: true
        ci_role_name_prefix: "{{ .atmos_stack }}-ci"
        ci_apply_role_enabled: true
        ci_apply_role_trusted_github_repos:
          - "hemzaz/tf-atmos:master"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        ci_plan_role_subjects:
          - "repo:hemzaz/tf-atmos:ref:refs/heads/master"
        # State access: the EU backend's PROD roles only, in the management
        # account (settings.tfstate.role_prefix is fnx-ew1-terraform-backend).
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.tfstate.role_prefix }}-prod-read-role"
        ci_backend_write_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.tfstate.role_prefix }}-prod-role"

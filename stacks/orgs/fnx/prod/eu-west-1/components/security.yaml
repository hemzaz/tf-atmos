---
# =============================================================================
# Security for fnx-ew1-prod (EU production, its own account)
# =============================================================================
# The account and identity layer (iam/main, iam/ci), the stack's key
# (kms/main) and the prod-eu account's singletons: the multi-region CloudTrail
# trail (cloudtrail/main) and AWS Config's global-resource recording
# (awsconfig/main); the account budget is cost-optimization/main
# (services.yaml). Then the regional security services: GuardDuty, Security
# Hub, Inspector and finding routing with the CIS metric filters on this
# stack's trail (security-monitoring/main); the API Gateway account settings,
# backups, the EU apex's certificate and the prod secret sets. As in fnx-ue1-prod
# (orgs/fnx/prod/us-east-1/components/security.yaml; the iam, kms, acm and
# secretsmanager wiring is catalog/<c>/<i>-prod, which explains each input,
# and the shared prod settings are catalog/<component>/prod), except:
#   - DR copies (kms/main's replica, backup/main's copies) go to
#     eu-central-1, the EU DR region, never us-east-2;
#   - a new account: this stack owns every singleton fnx-ue2-prod leaves to
#     fnx-ue1-prod (the GitHub OIDC provider, the Auto Scaling service-linked
#     role, the trail, global-resource recording, the budget); nothing here
#     reads a US stack;
#   - state: the EU backend's prod roles in the management account
#     (settings.tfstate, role_prefix fnx-ew1-terraform-backend, fnx-ew1-root),
#     which trust these CI roles (stacks/orgs/fnx/root/eu-west-1.yaml);
#   - no lambda uploader yet: the PR adding the Lambda bucket adds it.
# Both catalog/iam dependencies resolve to backend/main in fnx-ew1-root.
# Every finding stays in eu-west-1: no Security Hub cross-region aggregation,
# no GuardDuty export, the alert topic on kms/main, and no enrichment Lambda
# (check-data-residency.py fails enable_alert_enrichment in a GDPR-scoped
# stack: it posts findings, IPs included, to Slack/PagerDuty).
# The secrets' EU replica (eu-central-1 only) is catalog/secretsmanager/
# {app,infra}-prod's, in settings.dr.region (stacks/orgs/fnx/prod/
# eu-west-1.yaml). The apex's certificate is validated in network/main's
# zone (networking.yaml), its *.api SAN's record also validates fnx-ec1-prod's
# acm/main; there is no acm/services (no services zone here). This file keeps
# the per-stack values.
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-1/components/globals
  - catalog/iam/main-prod
  - catalog/iam/ci-prod
  - catalog/kms/main-prod
  - catalog/cloudtrail/defaults
  - catalog/awsconfig/defaults
  - catalog/guardduty/prod
  - catalog/securityhub/prod
  - catalog/inspector2/defaults
  - catalog/security-monitoring/defaults
  - catalog/apigateway-account/defaults
  - catalog/backup/prod
  - catalog/acm/main-prod
  - catalog/secretsmanager/app-prod
  - catalog/secretsmanager/infra-prod

components:
  terraform:
    kms/main:
      vars:
        description: EU production main encryption key
        # cost-optimization/main's budget and anomaly notifications publish to
        # its cost-alerts topic on this key (billing_notifications_sns_enabled).
        allow_billing_notifications: true
        # Replicated to the EU DR region only (never a US one; replica_regions
        # is catalog/kms/main-prod's settings.dr.region): fnx-ec1-prod, the EU
        # DR stack, reads the replica's ARN cross-stack and reaches it by its
        # own prefix's alias, as fnx-ue2-prod does ue1's (ue2-main).
        replica_alias_names:
          eu-central-1: ec1-main

    # The prod-eu account's multi-region trail: it records every region's API
    # events into this region's bucket and log group (both on kms/main), so
    # the logs stay in the EU. fnx-ec1-prod adds no trail.
    cloudtrail/main:
      metadata:
        component: cloudtrail
        inherits:
          - cloudtrail/defaults

    # The prod-eu account's global-resource (IAM) recorder:
    # include_global_resource_types stays true (catalog default) here and
    # only here; fnx-ec1-prod's awsconfig sets it false, as fnx-ue2-prod does.
    awsconfig/main:
      metadata:
        component: awsconfig
        inherits:
          - awsconfig/defaults
      vars:
        kms_key_arn: !terraform.state kms/main .key_arn
      dependencies:
        components:
          - component: kms/main

    guardduty/main:
      metadata:
        component: guardduty
        inherits:
          - guardduty/prod

    # This region records the account's global resources (awsconfig/main) and
    # holds the trail's log group, so unlike fnx-ue2-prod no IAM, KMS or
    # CloudWatch control is disabled.
    securityhub/main:
      metadata:
        component: securityhub
        inherits:
          - securityhub/prod

    # Off, as in fnx-ue1-prod: Inspector bills per resource scanned.
    inspector2/main:
      metadata:
        component: inspector2
        inherits:
          - inspector2/defaults

    # Finding routing (GuardDuty, Security Hub, Inspector, security group
    # changes) to an SNS topic on kms/main, and the CIS metric filters on
    # cloudtrail/main's log group: all in this stack and region.
    security-monitoring/main:
      metadata:
        component: security-monitoring
        inherits:
          - security-monitoring/defaults

    # The region's API Gateway CloudWatch Logs role setting, for the EU REST
    # APIs to come (a per-account, per-region singleton).
    apigateway-account/main:
      metadata:
        component: apigateway-account
        inherits:
          - apigateway-account/defaults

    # Retention and notifications as in fnx-ue1-prod (catalog/backup/prod).
    # Recovery points are copied to the EU DR region only, never a US one:
    # vault <Environment>-backup-replica in eu-central-1 on kms/main's replica
    # there (ec1-main), created by this stack as fnx-ue1-prod creates
    # ue1-backup-replica in us-east-2; fnx-ec1-prod's backup/main is that
    # region's own vault and plans.
    # check-data-residency.py fails a non-EU replica_region or key.
    backup/main:
      metadata:
        component: backup
        inherits:
          - backup/prod
      vars:
        kms_key_arn: !terraform.state kms/main .key_arn
        enable_cross_region_backup: true
        replica_region: eu-central-1
        replica_kms_key_arn: !terraform.state kms/main '.replica_keys["eu-central-1"].key_arn'
      dependencies:
        components:
          - component: kms/main

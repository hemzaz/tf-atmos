---
# =============================================================================
# Compute for fnx-ew1-prod (EU production, its own account)
# =============================================================================
# fnx-ue1-prod's main cluster and what runs around it, from the shared prod
# instance files (catalog/<component>/<i>-prod): eks/main (ew1-main, the name
# vpc/main's load balancer subnet tags expect), the bastion, the in-VPC runner
# pool, and the in-cluster external-secrets/main, eks-addons/main (external-dns
# and cert-manager in the EU apex's zone, network/main) and
# eks-backend-services/main (on services.yaml's rds/main and
# elasticache/main). No eks/data: the EU data plane (data VPC, eks/data,
# rds/data) is not in this stack. This file keeps the bastion's egress rules.
#
# The endpoint is private, so CI runs the in-cluster instances on this
# stack's own pool (settings.github.runner: in-vpc, owner decision Q8), which
# CI starts in eu-west-1 (its vars.region, #350); iam/ci lets only this
# stack's apply role start it (ci_runner_pool_names, security.yaml). The
# pool's alarms name the ew1-main-alarms topic, which monitoring/main
# (services.yaml) creates.
#
# Everything stays in eu-west-1 (check-data-residency.py): control-plane logs
# and Container Insights go to this region's CloudWatch on kms/main, the
# runners' JIT configuration to this region's SSM. The GitHub App private key
# is a parameter in the prod-eu account's SSM (docs/OPERATIONS.md,
# "First-deploy inputs", GitHub App).
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-1/components/globals
  - catalog/eks/main-prod
  - catalog/github-runners/main-prod
  - catalog/ec2/bastion-prod
  - catalog/external-secrets/main-prod
  - catalog/eks-addons/main-prod
  - catalog/eks-backend-services/main-prod

components:
  terraform:
    # The SSH rule names this stack's one VPC.
    ec2/bastion:
      vars:
        allowed_egress_rules:
          - from_port: 443
            to_port: 443
            protocol: "tcp"
            cidr_blocks: ["0.0.0.0/0"]
            description: "HTTPS outbound"
          - from_port: 22
            to_port: 22
            protocol: "tcp"
            cidr_blocks: ["{{ .settings.network.vpc_cidrs.main }}"]
            description: "SSH to VPC resources"

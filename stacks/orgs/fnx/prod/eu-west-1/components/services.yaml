---
# =============================================================================
# Services for fnx-ew1-prod (EU production, its own account)
# =============================================================================
# fnx-ue1-prod's serving path (orgs/fnx/prod/us-east-1/components/services.yaml,
# which explains each input) from the shared prod catalogs
# (catalog/<component>/prod): the main database and cache, the backend
# services on eks/main, the user pool, the main API and monitoring, plus the
# prod-eu account's budget. Its DR warm standby is fnx-ec1-prod
# (eu-central-1), as fnx-ue2-prod is fnx-ue1-prod's:
#   - elasticache/main is a Global Datastore primary, rds/main the source of
#     fnx-ec1-prod's read replica, cognito/main has the dr-migration client
#     fnx-ec1-prod's user-migration trigger signs in with, and
#     apigateway/main is the PRIMARY half of api.<EU apex>'s Route 53
#     failover pair. All EU to EU, except what Route 53 has only in
#     us-east-1: the health check, its alarm and the EventBridge rule, targets
#     and role relaying the alarm to both EU regions (configuration only,
#     nothing persisted, no personal data), plus two of its three checker
#     regions (eu-west-1 is the only EU one); owner decision B5;
#   - its own user pool, never a migration from fnx-ue1-prod's (owner
#     decision): EU users sign up here;
#   - no ECS cluster, analytics database, data API or Lambda functions.
# Every database snapshot, backup copy (backup/main: eu-central-1 only) and
# log stays in the EU (check-data-residency.py).
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-1/components/globals
  - catalog/cost-optimization/defaults
  - catalog/rds/prod
  - catalog/elasticache/prod
  - catalog/cognito/prod
  - catalog/apigateway/prod
  - catalog/monitoring/prod

components:
  terraform:
    # Multi-AZ in vpc/main's database subnets, on kms/main, selected into
    # backup/main by its Backup tag.
    rds/main:
      metadata:
        component: rds
        inherits:
          - rds/main-prod

    elasticache/main:
      metadata:
        component: elasticache
        inherits:
          - elasticache/main-prod
      vars:
        # DR, as fnx-ue1-prod's: a Global Datastore with this cache as
        # primary; fnx-ec1-prod's elasticache/main (eu-central-1) is its
        # secondary. The suffix is global per account, so it carries the full
        # id. Both members are EU stacks: check-data-residency.py fails a
        # non-GDPR stack that joins it.
        global_replication_group_id_suffix: "{{ .atmos_stack }}-cache"

    # The EU pool, as fnx-ue1-prod's: the api client and the dr-migration
    # client fnx-ec1-prod's user-migration trigger signs in with (EU to EU).
    cognito/main:
      metadata:
        component: cognito
        inherits:
          - cognito/prod
      vars:
        name_prefix: '{{ .atmos_stack }}'
        clients:
          api:
            generate_secret: true
            access_token_validity_minutes: 30
          # DR (as fnx-ue1-prod's): fnx-ec1-prod's
          # lambda/cognito-user-migration checks a user's password against this
          # pool with AdminInitiateAuth, which needs a client allowing the
          # admin password flow and, without a secret, no SECRET_HASH. Admin
          # flows are IAM-signed calls, so no browser can use this client. The
          # tokens it issues are discarded: the shortest lifetimes.
          dr-migration:
            generate_secret: false
            explicit_auth_flows: ["ALLOW_ADMIN_USER_PASSWORD_AUTH", "ALLOW_REFRESH_TOKEN_AUTH"]
            access_token_validity_minutes: 5
            id_token_validity_minutes: 5
            refresh_token_validity_days: 1

    # api.<EU apex>, as fnx-ue1-prod's: the PRIMARY half of its Route 53
    # failover pair, health-checked on this region's stage root;
    # fnx-ec1-prod's apigateway/main is the SECONDARY.
    apigateway/main:
      metadata:
        component: apigateway
        inherits:
          - apigateway/main-prod
      vars:
        route53_failover_type: PRIMARY
        route53_set_identifier: "{{ .settings.prefix }}"
        # The checkers: eu-west-1, the only EU checker region, plus two others
        # (Route 53 needs three): probes of the API's stage root, a residency
        # exemption (check-data-residency.py EXEMPTIONS).
        health_check_regions: ["eu-west-1", "us-east-1", "ap-southeast-1"]
        # The health check's alarm lives in us-east-1 (Route 53's metrics are
        # only there). fnx-ue1-prod's notifies its monitoring topic there; this
        # stack keeps nothing persistent in us-east-1 (no topic, key or email
        # addresses), so EventBridge relays the alarm's state changes to the
        # default bus of BOTH EU regions, where each monitoring/main delivers
        # them to its topic (ew1-main-alarms, ec1-main-alarms): an eu-west-1
        # outage, the one this alarm reports, still reaches ec1-main-alarms.
        # What sits in us-east-1 for it: the Route 53 health check, its alarm,
        # and an EventBridge rule, its targets and their IAM role (configuration
        # only: no topic, key, subscription, archive or queue, nothing
        # persisted; no personal data). Owner decision B5.
        health_check_alarm_relay_regions: ["eu-west-1", "eu-central-1"]

    # Owns <Environment>-main-alarms (ew1-main-alarms), the topic the runner
    # pool's alarms name (compute.yaml), and delivers the relayed us-east-1
    # health check alarms of the EU failover pair to it (apigateway/main).
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/main-prod
      vars:
        receive_relayed_health_check_alarms: true

    # As in fnx-ue1-prod (orgs/fnx/prod/us-east-1/components/services.yaml):
    # Savings Plan/RI analyzer, resource cleanup, cost anomaly detection and
    # the monthly budget (on this stack's Environment tag, ew1). Cost data is
    # account metadata, not personal data.
    cost-optimization/main:
      metadata:
        component: cost-optimization
        inherits:
          - cost-optimization/defaults
      vars:
        monthly_budget_limit: "{{ .settings.environment.monitoring.budget_monthly_limit }}"
        budget_notification_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"
        cost_anomaly_notification_email: "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        cost_alert_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

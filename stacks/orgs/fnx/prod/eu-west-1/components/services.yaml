---
# =============================================================================
# Services for fnx-ew1-prod (EU production, its own account)
# =============================================================================
# fnx-ue1-prod's serving path (orgs/fnx/prod/us-east-1/components/services.yaml,
# which explains each input) from the shared prod catalogs
# (catalog/<component>/prod): the main database and cache, the backend
# services on eks/main, the user pool, the main API and monitoring, plus the
# prod-eu account's budget. Without fnx-ue1-prod's DR or US-only parts:
#   - no Global Datastore, read replica or Route 53 failover pair yet: the EU
#     DR stack fnx-ec1-prod has only its foundation (network, CI roles,
#     security services, backup vault). Without failover, apigateway/main
#     has no Route 53 health check, so none of its alarms is in us-east-1;
#   - its own user pool, never a migration from fnx-ue1-prod's (owner
#     decision): EU users sign up here;
#   - no ECS cluster, analytics database, data API or Lambda functions.
# Every database snapshot, backup copy (backup/main: eu-central-1 only) and
# log stays in the EU (check-data-residency.py).
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-1/components/globals
  - catalog/cost-optimization/defaults
  - catalog/rds/prod
  - catalog/elasticache/prod
  - catalog/cognito/prod
  - catalog/apigateway/prod
  - catalog/monitoring/prod

components:
  terraform:
    # Multi-AZ in vpc/main's database subnets, on kms/main, selected into
    # backup/main by its Backup tag.
    rds/main:
      metadata:
        component: rds
        inherits:
          - rds/main-prod

    elasticache/main:
      metadata:
        component: elasticache
        inherits:
          - elasticache/main-prod

    # The EU pool: the api client only (no dr-migration client: nothing
    # migrates users out of this pool yet).
    cognito/main:
      metadata:
        component: cognito
        inherits:
          - cognito/prod
      vars:
        name_prefix: '{{ .atmos_stack }}'
        clients:
          api:
            generate_secret: true
            access_token_validity_minutes: 30

    # api.<EU apex> as a plain alias record in network/main's zone.
    apigateway/main:
      metadata:
        component: apigateway
        inherits:
          - apigateway/main-prod

    # Owns <Environment>-main-alarms (ew1-main-alarms), the topic the runner
    # pool's alarms name (compute.yaml).
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/main-prod

    # As in fnx-ue1-prod (orgs/fnx/prod/us-east-1/components/services.yaml):
    # Savings Plan/RI analyzer, resource cleanup, cost anomaly detection and
    # the monthly budget (on this stack's Environment tag, ew1). Cost data is
    # account metadata, not personal data.
    cost-optimization/main:
      metadata:
        component: cost-optimization
        inherits:
          - cost-optimization/defaults
      vars:
        monthly_budget_limit: "{{ .settings.environment.monitoring.budget_monthly_limit }}"
        budget_notification_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"
        cost_anomaly_notification_email: "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        cost_alert_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

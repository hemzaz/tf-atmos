---
# =============================================================================
# Security Component Configurations for Production Environment
# =============================================================================
# PRODUCTION SECURITY - Maximum protection for business-critical data
# IAM with least privilege, KMS encryption, secrets rotation enabled
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-2/production/components/globals
  - catalog/iam/defaults
  - catalog/backend/defaults
  - catalog/kms/defaults
  - catalog/secretsmanager/defaults
  - catalog/acm/defaults

components:
  terraform:
    # ==========================================================================
    # IAM Roles - Production with Strict Permissions
    # ==========================================================================
    iam/main:
      metadata:
        component: iam
        inherits:
          - iam
      vars:

        # Cross-account access configuration
        cross_account_role_name: "production-prod-fnx-CrossAccountRole"
        policy_name: "production-prod-fnx-CrossAccountPolicy"
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"

        # MFA required for production access (trust condition)
        require_mfa: true

        # MFA required for production access
      dependencies:
        components:
          - component: backend/main
    # GitHub Actions OIDC role. This is what repo variable AWS_PLAN_ROLE_ARN
    # must point at before CI can run a real plan; every AWS job currently skips
    # because it is unset. The trust policy is pinned to exact subject claims -
    # never a wildcard - so no other repo can assume it.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: true
        # Roles become <prefix>-plan and <prefix>-apply. Naming convention from
        # catalog/iam/defaults.yaml, so context.environment (the instance name)
        # is the right key here -- unlike the `environment` variable, a tier.
        ci_role_name_prefix: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-ci"
        # Deliberately OFF. AWS_PLAN_ROLE_ARN needs only the PLAN role, which
        # ships safe: ReadOnlyAccess by default, admin policies rejected at
        # variables.tf:295. The APPLY role has no such guardrail and no
        # defensible default -- it deploys the iam component itself, so
        # PowerUserAccess+IAMFullAccess is admin with extra steps. Enable it
        # only with a scoped customer-managed policy and a permissions boundary.
        ci_apply_role_enabled: false
        ci_apply_role_environments:
          - "fnx-prod-production"
        # Lets the plan role take the .tflock rather than only read state.
        # backend/main is already a declared dependency below.
        ci_state_bucket_name: !terraform.state backend/main .backend_bucket
        ci_state_kms_key_arn: !terraform.state backend/main .backend_kms_key_arn
      dependencies:
        components:
          - component: backend/main
    backend/main:
      metadata:
        component: backend
        inherits:
          - backend
      vars:
        bucket_name: "fnx-production-terraform-state"
        iam_role_name: "fnx-production-terraform-backend-role"
        enable_access_logging: true
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Production main encryption key (EKS secrets, EC2/EBS, RDS)
        alias_name: production-main  # without the alias/ prefix
        deletion_window_in_days: 30  # prod keeps the full window
        # IAM roles referenced here must exist before apply (the iam ci/eks-node
        # instances are disabled; EKS-managed node roles need their ARNs here)
        key_users:
          - arn:aws:iam::{{ .settings.environment.aws_account_id }}:role/production-eks-node-role
          - arn:aws:iam::{{ .settings.environment.aws_account_id }}:role/production-ci-role

    # ==========================================================================
    # ACM Certificates - Production
    # ==========================================================================
    acm/main:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          main_wildcard:
            domain_name: "*.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "{{ .settings.environment.domain_name }}"
              - "*.api.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    acm/services:
      metadata:
        component: acm
        inherits:
          - acm/defaults
      vars:
        zone_id: "{{ .settings.environment.hosted_zone_id }}"
        dns_domains:
          services_wildcard:
            domain_name: "*.services.{{ .settings.environment.domain_name }}"
            subject_alternative_names:
              - "api.services.{{ .settings.environment.domain_name }}"
              - "data.services.{{ .settings.environment.domain_name }}"
            validation_method: "DNS"
            wait_for_validation: true

    # ==========================================================================
    # Secrets Manager - Production with Rotation
    # ==========================================================================
    secretsmanager/app:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/defaults
      vars:
        # No rotation Lambdas are deployed: rotation settings were removed.
        # The RDS master password is rotated by RDS itself.
        secrets:
          app_credentials:
            name: "credentials"
            description: "Production application credentials"
            path: "production/app"
            generate_random_password: true
            password_length: 48
          api_keys:
            name: "api-keys"
            description: "Production API integration keys"
            path: "production/app/api"
            generate_random_password: true
            password_length: 64
          database_credentials:
            name: "db-credentials"
            description: "Production database credentials"
            path: "production/app/database"
            generate_random_password: true
            password_length: 32
        context_name: "production/app"
        default_recovery_window_in_days: 30
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        secrets:
          tls_certificates:
            name: "tls-certificates"
            description: "Production TLS certificates"
            path: "production/certificates"
          ssh_keys:
            name: "ssh-keys"
            description: "Production SSH keys"
            path: "production/ssh"
          service_accounts:
            name: "service-accounts"
            description: "Production service account credentials"
            path: "production/service-accounts"

        context_name: "production/infra"
        default_recovery_window_in_days: 30

    # ==========================================================================
    # GuardDuty Configuration
    # ==========================================================================
    guardduty/main:
      metadata:
        component: guardduty
      vars:
        enable: true
        enable_s3_protection: true
        enable_kubernetes_protection: true
        enable_malware_protection: true
        finding_publishing_frequency: "FIFTEEN_MINUTES"

        # Auto-archive low severity findings
        auto_archive_filter:
          - severity: 1
            criteria:
              type:
                - "Recon:EC2/Portscan"

    # ==========================================================================
    # Security Hub Configuration
    # ==========================================================================
    securityhub/main:
      metadata:
        component: securityhub
      vars:
        enable: true
        # AWS auto-subscribes AWS-FSBP and CIS under this flag. Listing them
        # here as well collides at apply, so `standards` carries only what AWS
        # does not enable for us.
        enable_default_standards: true
        standards:
          - "pci-dss/v/3.2.1"

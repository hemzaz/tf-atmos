---
# =============================================================================
# Services Component Configurations for Production Environment
# =============================================================================
# Production services with full monitoring, alerting, and compliance
# Multi-AZ RDS, comprehensive CloudWatch, PagerDuty integration
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-2/production/components/globals
  - catalog/apigateway/defaults
  - catalog/cognito/defaults
  - catalog/monitoring/defaults

components:
  terraform:
    # ==========================================================================
    # Cognito - user pool backing the API Gateway authorizer
    # ==========================================================================
    cognito/main:
      metadata:
        component: cognito
        inherits:
          - cognito/defaults
      vars:
        name_prefix: '{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}'
        # Production tightens both knobs over the inherited defaults: MFA is
        # mandatory rather than opt-in, and the pool cannot be deleted while it
        # holds real users.
        mfa_configuration: "ON"
        deletion_protection: true
        clients:
          api:
            generate_secret: true
            access_token_validity_minutes: 30

    # ==========================================================================
    # API Gateway - Main API (Production)
    # ==========================================================================
    apigateway/main:
      metadata:
        component: apigateway
      vars:
        description: "Production Main API Gateway"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"
          - path_part: "users"
          - path_part: "products"

        # Methods are addressed by resource_path ("/" is the API root), because
        # a stack cannot know this API's resource IDs before apply.
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "NONE"
          - resource_path: "/api"
            http_method: "ANY"
            authorization: "COGNITO_USER_POOLS"

        # "/" stays MOCK on purpose: it is a liveness endpoint, and a canned 200
        # is the correct answer for one. "/api" is the real entry point and is
        # proxied to Lambda.
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "GET"
            type: "MOCK"
          - resource_path: "/api"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        # Authorizer for the COGNITO_USER_POOLS method above. A method that asks
        # for COGNITO_USER_POOLS without a pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        # Domain Configuration
        domain_name: "api.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        api_name: "production-main-api"
        zone_id: !terraform.state network/main .zone_ids.main

        throttling_burst_limit: 5000
        throttling_rate_limit: 10000

        enable_logging: true
        log_retention_days: 90
        create_dashboard: true
        tracing_enabled: true

        # Cache settings
        enable_caching: true
        cache_ttl_seconds: 300

        cors_configuration:
          allow_origins:
            - "https://{{ .settings.environment.domain_name }}"
            - "https://www.{{ .settings.environment.domain_name }}"
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers:
            - "Content-Type"
            - "Authorization"
            - "X-Api-Key"
            - "X-Request-Id"
          expose_headers: []
          max_age: 300
          allow_credentials: false

        enable_waf: true

        tags:
          Service: api-gateway
          Tier: edge
          CriticalityLevel: "high"
      dependencies:
        components:
          - component: network/main
          - component: acm/main
          - component: cognito/main
          - component: lambda/data-processor

    # ==========================================================================
    # API Gateway - Data API (Production)
    # ==========================================================================
    apigateway/data:
      metadata:
        component: apigateway
      vars:
        description: "Production Data API Gateway"
        stage_name: "v1"

        api_resources:
          - path_part: "data"
          - path_part: "metrics"
          - path_part: "analytics"
          - path_part: "reports"

        api_methods:
          - resource_path: "/data"
            http_method: "ANY"
            authorization: "COGNITO_USER_POOLS"

        # Real backend. lambda_function_name is required so this component can
        # grant API Gateway permission to invoke the function - without that
        # policy the integration applies fine and every call returns 500.
        api_integrations:
          - resource_path: "/data"
            http_method: "ANY"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state lambda/data-processor .function_invoke_arn
            lambda_function_name: !terraform.state lambda/data-processor .function_name

        # Authorizer for the COGNITO_USER_POOLS method above, same pool as
        # apigateway/main. A method that asks for COGNITO_USER_POOLS without a
        # pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        domain_name: "data.services.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/services .certificate_arns.services_wildcard
        throttling_burst_limit: 2000
        throttling_rate_limit: 5000

        enable_logging: true
        log_retention_days: 90
        create_dashboard: true
        enable_waf: true
        tags:
          Service: data-api
          Tier: backend

    # ==========================================================================
    # Infrastructure - Main Application Stack (Production HA)
    # ==========================================================================
        api_name: "production-data-api"
        zone_id: !terraform.state network/services .zone_ids.data
        tracing_enabled: true
      dependencies:
        components:
          - component: network/services
          - component: acm/services
          - component: cognito/main
          - component: lambda/data-processor

    # ECS Fargate cluster (was infrastructure/main.ecs). vpc_id/subnet_ids are
    # not passed: an aws_ecs_cluster has neither - those belong to ECS services.
    ecs/main:
      metadata:
        component: ecs
      vars:
        cluster_name: "production-main-apps"
        fargate_only: true
        enable_container_insights: true
      dependencies:
        components:
          - component: vpc/main

    # Application database - Multi-AZ (was infrastructure/main.rds).
    # monitoring_role_arn pointed at an iam/rds-monitoring instance that has
    # never existed; the component creates the role itself.
    rds/main:
      metadata:
        component: rds
      vars:
        # Without this, environment falls back to the module default "dev"
        # and every environment == "prod" gate in the component silently
        # passes.
        environment: "{{ .settings.context.stage }}"
        identifier: "production-main-db"
        db_name: "productionapp"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.r5.xlarge"
        allocated_storage: 100
        max_allocated_storage: 500
        multi_az: true
        storage_encrypted: true
        kms_key_id: !terraform.state kms/main .key_arn
        iam_database_authentication_enabled: true
        deletion_protection: true
        backup_retention_period: 30
        backup_window: "03:00-04:00"
        maintenance_window: "Sun:04:30-Sun:05:30"
        copy_tags_to_snapshot: true
        performance_insights_enabled: true
        performance_insights_retention_period: 7
        performance_insights_kms_key_id: !terraform.state kms/main .key_arn
        monitoring_interval: 60
        create_monitoring_role: true
        enabled_cloudwatch_logs_exports:
          - "postgresql"
          - "upgrade"
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .database_subnet_ids
        family: "postgres14"
        parameters:
          - name: "log_statement"
            value: "all"
          - name: "log_min_duration_statement"
            value: "1000"
          - name: "shared_preload_libraries"
            value: "pg_stat_statements"
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main

    # Redis cache (was infrastructure/main.elasticache)
    elasticache/main:
      metadata:
        component: elasticache
      vars:
        cluster_id: "production-cache"
        engine: "redis"
        engine_version: "7.0"
        node_type: "cache.r5.large"
        num_cache_nodes: 3
        automatic_failover_enabled: true
        multi_az_enabled: true
        at_rest_encryption_enabled: true
        transit_encryption_enabled: true
        # Secret: export PROD_ELASTICACHE_AUTH_TOKEN before plan/apply
        auth_token: !env PROD_ELASTICACHE_AUTH_TOKEN
        kms_key_id: !terraform.state kms/main .key_arn
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        # Fail closed: nothing can reach the cache until a consumer's security
        # group is listed here. ECS services are not managed by this repo, so
        # there is no group to reference yet - add it when there is one.
        allowed_security_group_ids: []
        allowed_cidr_blocks: []
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main

    # Analytics database with a read replica (was infrastructure/data.rds)
    rds/data:
      metadata:
        component: rds
      vars:
        # Without this, environment falls back to the module default "dev"
        # and every environment == "prod" gate in the component silently
        # passes.
        environment: "{{ .settings.context.stage }}"
        identifier: "production-data-db"
        db_name: "productiondata"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        instance_class: "db.r5.2xlarge"
        allocated_storage: 200
        max_allocated_storage: 1000
        multi_az: true
        storage_encrypted: true
        kms_key_id: !terraform.state kms/main .key_arn
        deletion_protection: true
        backup_retention_period: 30
        performance_insights_enabled: true
        create_read_replica: true
        read_replica_instance_class: "db.r5.xlarge"
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .database_subnet_ids
      dependencies:
        components:
          - component: vpc/services
          - component: kms/main

    # Data processing (was infrastructure/data.lambda). The lambda component is
    # single-function, so one instance per function.
    lambda/data-processor:
      metadata:
        component: lambda
      vars:
        function_name: "production-data-processor"
        handler: "main.handler"
        runtime: "python3.13"
        # Placeholder: CI builds the package and uploads it here. The bucket must
        # exist and hold this key before the first apply - see docs/DEPLOYMENT.md.
        s3_bucket: "fnx-production-lambda-artifacts"
        s3_key: "production-data-processor/latest.zip"
        memory_size: 1024
        timeout: 600
        reserved_concurrent_executions: 100
        environment_variables:
          LOG_LEVEL: "INFO"
          ENVIRONMENT: "production"
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services

    lambda/data-transformer:
      metadata:
        component: lambda
      vars:
        function_name: "production-data-transformer"
        handler: "transform.handler"
        runtime: "python3.13"
        # Placeholder: CI builds the package and uploads it here. The bucket must
        # exist and hold this key before the first apply - see docs/DEPLOYMENT.md.
        s3_bucket: "fnx-production-lambda-artifacts"
        s3_key: "production-data-transformer/latest.zip"
        memory_size: 2048
        timeout: 900
        reserved_concurrent_executions: 50
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services

    lambda/report-generator:
      metadata:
        component: lambda
      vars:
        function_name: "production-report-generator"
        handler: "reports.handler"
        runtime: "python3.13"
        # Placeholder: CI builds the package and uploads it here. The bucket must
        # exist and hold this key before the first apply - see docs/DEPLOYMENT.md.
        s3_bucket: "fnx-production-lambda-artifacts"
        s3_key: "production-report-generator/latest.zip"
        memory_size: 3008
        timeout: 900
        vpc_id: !terraform.state vpc/services .vpc_id
        subnet_ids: !terraform.state vpc/services .private_subnet_ids
      dependencies:
        components:
          - component: vpc/services


    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true

        # Certificate monitoring
        certificate_arns: !terraform.state acm/main .certificate_arns // {} | [.[]]
        certificate_expiry_threshold: 30
        alarm_email_subscriptions:
          - "prod-critical@example.com"
          - "oncall@example.com"

        # PagerDuty integration
        # Secret: export from SSM /production/pagerduty/endpoint before plan/apply
        create_sns_topic: true
        cpu_alarms:
          high_cpu_warning:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 70
            dimensions: {}
          high_cpu_critical:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 90
            dimensions: {}
        memory_alarms:
          high_memory_warning:
            namespace: "CWAgent"
            evaluation_periods: 2
            period: 300
            threshold: 80
            dimensions: {}
          high_memory_critical:
            namespace: "CWAgent"
            evaluation_periods: 1
            period: 300
            threshold: 95
            dimensions: {}
        enable_rds_monitoring: true
        rds_cpu_threshold: 80
        db_connection_alarms:
          rds_connections_high:
            evaluation_periods: 2
            period: 300
            threshold: 400
        rds_storage_threshold: 10737418240
        api_gateway_error_threshold: 10
        api_gateway_latency_threshold: 5000
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        enable_certificate_monitoring: true

        certificate_arns: !terraform.state acm/services .certificate_arns // {} | [.[]]
        certificate_expiry_threshold: 30

        alarm_email_subscriptions:
          - "prod-critical@example.com"
          - "data-team@example.com"

        create_sns_topic: true
        lambda_error_alarms:
          lambda_errors:
            evaluation_periods: 2
            period: 300
            threshold: 5
        lambda_duration_threshold: 500000
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services

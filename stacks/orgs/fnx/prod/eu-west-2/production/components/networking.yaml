---
# =============================================================================
# Networking Component Configurations for Production Environment
# =============================================================================
# VPC and network resources with full high availability
# Multi-AZ deployment, redundant NAT Gateways, comprehensive flow logging
# =============================================================================

import:
  - orgs/fnx/prod/eu-west-2/production/components/globals
  - catalog/vpc/defaults
  - catalog/network/defaults

components:
  terraform:
    # ==========================================================================
    # Primary VPC - Main Application Workloads (High Availability)
    # ==========================================================================
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        vpc_cidr: "10.20.0.0/16"
        azs:
          - eu-west-2a
          - eu-west-2b
          - eu-west-2c

        # Private subnets - application tier
        private_subnets:
          - "10.20.1.0/24"
          - "10.20.2.0/24"
          - "10.20.3.0/24"

        # Public subnets - load balancers, NAT
        public_subnets:
          - "10.20.101.0/24"
          - "10.20.102.0/24"
          - "10.20.103.0/24"

        # Database subnets - isolated tier
        database_subnets:
          - "10.20.201.0/24"
          - "10.20.202.0/24"
          - "10.20.203.0/24"

        # Elasticache subnets
        enable_nat_gateway: true
        nat_gateway_strategy: "one_per_az"

        # DNS settings
        default_sg_ingress_self_only: true
        default_sg_egress_self_only: false
        default_sg_allow_all_outbound: true

        tags:
          NetworkTier: "primary"
          HighAvailability: "true"
          CriticalityLevel: "high"

    # ==========================================================================
    # Services VPC - Dedicated Backend Services (High Availability)
    # ==========================================================================
        enable_flow_logs: true
    vpc/services:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        vpc_cidr: "10.21.0.0/16"
        azs:
          - eu-west-2a
          - eu-west-2b
          - eu-west-2c

        private_subnets:
          - "10.21.1.0/24"
          - "10.21.2.0/24"
          - "10.21.3.0/24"

        public_subnets:
          - "10.21.101.0/24"
          - "10.21.102.0/24"
          - "10.21.103.0/24"

        database_subnets:
          - "10.21.201.0/24"
          - "10.21.202.0/24"
          - "10.21.203.0/24"

        # One NAT per AZ for HA
        enable_nat_gateway: true
        nat_gateway_strategy: "one_per_az"

        tags:
          NetworkTier: "services"
          HighAvailability: "true"

    # ==========================================================================
    # VPC Peering - Connect Main and Services VPCs
    # ==========================================================================
        enable_flow_logs: true
    network/vpc-peering:
      metadata:
        component: network
        enabled: false  # no components/terraform/network root module yet (see PR notes)
      vars:
        create_vpc_peering: true
        requester_vpc_id: !terraform.state vpc/main .vpc_id
        accepter_vpc_id: !terraform.state vpc/services .vpc_id

        auto_accept: true

        requester_routes:
          - destination_cidr_block: "10.21.0.0/16"
        accepter_routes:
          - destination_cidr_block: "10.20.0.0/16"

    # ==========================================================================
    # Network Resources - DNS for Main VPC
    # ==========================================================================
    network/main:
      metadata:
        component: dns
        inherits:
          - dns
      vars:
        root_domain: fnx.example.com
        create_root_zone: false
        multi_account_dns_delegation: false
        zones:
          main:
            name: "fnx.example.com"
            comment: "Production main zone"
            force_destroy: false  # Protected in production
            enable_query_logging: true
          internal:
            name: "internal.fnx.example.com"
            comment: "Production internal DNS"
            force_destroy: false
            enable_query_logging: true
            vpc_associations:
              - !terraform.state vpc/main .vpc_id
        # Records removed in the dns remap: www (alias to alb/main, which does
        # not exist), api (apigateway manages its own custom-domain record and
        # an alias here would be a dependency cycle) and db_internal (the
        # disabled infrastructure/main). Re-add once those targets exist.
        records: {}

    # ==========================================================================
    # Network Resources - DNS for Services VPC
    # ==========================================================================
    network/services:
      metadata:
        component: dns
        inherits:
          - dns
      vars:
        root_domain: fnx.example.com
        create_root_zone: false
        zones:
          services:
            name: "services.fnx.example.com"
            comment: "Production services zone"
            force_destroy: false
            enable_query_logging: true
          data:
            name: "data.services.fnx.example.com"
            comment: "Data services DNS"
            force_destroy: false

        records:
          api_services:
            zone_name: "services"
            name: "api.services.fnx.example.com"
            type: "CNAME"
            ttl: 300
            records: ["api-internal.services.fnx.example.com"]
          # data_db (CNAME to the disabled infrastructure/data RDS) removed in the dns remap

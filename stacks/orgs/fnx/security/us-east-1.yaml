---
# =============================================================================
# fnx-ue1-security - the security account's home-region stack
# =============================================================================
# No instance of its own, and one enabled instance: its stage defaults'
# aws-account-settings (stacks/orgs/fnx/security/_defaults.yaml); the org-wide
# security components (E5) land here. Its state goes to fnx-ue1-root's bucket
# through the backend's root role (stacks/orgs/fnx/_defaults.yaml), whose
# root_write holds this stack's pattern pair (check-state-keys.py) and trusts
# the security account's OrganizationAccountAccessRole: the provider guard
# needs credentials in the security account, and that role is the way in until
# E4's Identity Center roles.
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/us-east-1
  - orgs/fnx/security/_defaults

---
# =============================================================================
# fnx-ue2-security - the security account's us-east-2 stack
# =============================================================================
# A core-account stack (owner decision QE5): its stage defaults'
# aws-account-settings, and the account's Config recorder below.
#
# The account's Config recorder for us-east-2 (aws-config, inheriting
# aws-config/main-core-region): regional resource types only, with the recorder
# role of fnx-ue1-security, the account's global-resource collector, by
# its convention ARN (catalog/aws-config/main.yaml), so deploy that home stack
# first (docs/OPERATIONS.md "Bootstrap order"). No trail: the account's one
# multi-region trail, in its home stack, records this region (owner OQ-A).
#
# The organization's GuardDuty detector and Security Hub hub for us-east-2
# (E5c4, Cloud Posse's step 1, delegated-administrator): fnx-security is
# their delegated administrator once fnx-ue1-root's root step delegates them
# (step 2); org-settings adds the members (step 3). Inspector has no step 1.
# The detector's protection plans, per catalog/aws-guardduty/defaults.yaml
# (owner OQ-GD): S3, EKS audit logs and EBS malware scanning, findings every
# FIFTEEN_MINUTES. Security Hub (catalog/aws-security-hub/us.yaml, owner
# OQ-SH): Cloud Posse's default standards, its findings aggregated into
# fnx-ue1-security's hub (us-east-1); it aggregates none.
#
# Its state goes to fnx-ue1-root's bucket
# through the backend's core role (stacks/orgs/fnx/_defaults.yaml),
# whose core_write trusts the management-account administrator and the
# security account's OrganizationAccountAccessRole, and its stage
# defaults keep it out of every CI matrix (github.actions_enabled: false). The
# scaffold's wire hook added this stack's pattern pair to core_write
# (check-state-keys.py).
#
# Not the account's home region (us-east-1, fnx-ue1-security):
# aws-account-settings/main-standby, after the stage defaults, leaves the
# account-wide IAM account alias and S3 account public access block to the
# home-region stack (check-lane-names.py SINGLETONS).
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/us-east-2
  - orgs/fnx/security/_defaults
  - catalog/aws-account-settings/main-standby
  - catalog/aws-config/main
  - catalog/aws-guardduty/defaults
  - catalog/aws-security-hub/us

components:
  terraform:
    # Cloud Posse's instance name; the variant is catalog/aws-config/main.yaml's.
    aws-config:
      metadata:
        component: aws-config
        inherits:
          - aws-config/main-core-region
    # Cloud Posse's instance names, step 1 (admin_delegated false): the
    # delegated administrator's detector and hub.
    aws-guardduty/delegated-administrator:
      metadata:
        component: aws-guardduty
        inherits:
          - aws-guardduty/delegated-administrator-defaults
    aws-security-hub/delegated-administrator:
      metadata:
        component: aws-security-hub
        inherits:
          - aws-security-hub/delegated-administrator-us

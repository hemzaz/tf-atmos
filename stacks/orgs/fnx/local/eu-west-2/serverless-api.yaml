---
# Template-check lane — fnx-local-svcapi
#
# `stacks/catalog/templates/serverless-api.yaml` is a reference template: no
# real fnx stack imports it (`grep -rl serverless-api stacks/orgs` finds
# nothing before this file), so nothing has ever exercised the
# `!terraform.state`/`dependencies.components` graph it declares. That is how
# `serverless-api/api-domain` was able to name a component
# (`apigateway-domain`) that was never written for months without
# `atmos validate stacks`, `check-dependencies.py` or `plan-sweep.sh` ever
# seeing it - none of those tools render a template that nothing imports.
#
# This lane exists so the template's dependency graph is checked the same way
# `sandbox.yaml` and `localemu.yaml` check real components: local backend, no
# real AWS account, describe/validate/plan-sweep only, never applied. Unlike
# those two lanes it does not aim for an executable apply - the template has
# other, pre-existing gaps in components this fix does not touch (for one,
# `serverless-api/cognito` passes `user_pool_name`, which the `cognito`
# component does not declare; it wants `name_prefix`). Fixing those is out of
# scope here - see the W-apigw-domain task notes - so `plan-sweep.sh
# fnx-local-svcapi` is expected to FAIL on components other than
# serverless-api/apigateway and its declared dependencies (cognito, acm).
# What this lane proves is narrower and complete: serverless-api/apigateway
# resolves with its custom-domain inputs (domain_name, certificate_arn,
# base_path, zone_id), declares serverless-api/acm as a dependency, and reads
# nothing that check-dependencies.py cannot resolve back to a real instance.
import:
  - orgs/fnx/local/_defaults
  - mixins/region/eu-west-2
  - catalog/templates/serverless-api

vars:
  region: eu-west-2

  # Referenced by the template as `.vars.<name>` (stack-level vars, not
  # component vars) - see the "Usage" comment at the top of
  # catalog/templates/serverless-api.yaml. Values are placeholders shaped like
  # what a real importing stack would supply; nothing here is ever applied.
  app_domain_name: "svcapi.example.internal"
  route53_zone_id: "Z0000000000000000SVCA"
  private_subnet_ids:
    - "subnet-00000000000000001"
    - "subnet-00000000000000002"
  waf_log_destination_arn: "arn:aws:logs:eu-west-2:000000000000:log-group:aws-waf-logs-svcapi:*"
  alarm_sns_topic_arn: "arn:aws:sns:eu-west-2:000000000000:svcapi-alarms"
  assets_kms_key_id: "arn:aws:kms:eu-west-2:000000000000:key/00000000-0000-0000-0000-000000000001"
  dynamodb_kms_key_arn: "arn:aws:kms:eu-west-2:000000000000:key/00000000-0000-0000-0000-000000000002"
  lambda_logs_kms_key_id: "arn:aws:kms:eu-west-2:000000000000:key/00000000-0000-0000-0000-000000000003"
  sqs_kms_key_id: "arn:aws:kms:eu-west-2:000000000000:key/00000000-0000-0000-0000-000000000004"
  lambda_powertools_layer_arn: "arn:aws:lambda:eu-west-2:000000000000:layer:AWSLambdaPowertoolsPythonV2:1"
  log_bucket_name: "svcapi-scratch-logs"
  oac_id: "E0000000000000"
  cognito_domain_certificate_arn: "arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000005"
  custom_message_lambda_arn: "arn:aws:lambda:eu-west-2:000000000000:function:svcapi-custom-message"
  post_confirmation_lambda_arn: "arn:aws:lambda:eu-west-2:000000000000:function:svcapi-post-confirmation"
  pre_signup_lambda_arn: "arn:aws:lambda:eu-west-2:000000000000:function:svcapi-pre-signup"
  pre_token_generation_lambda_arn: "arn:aws:lambda:eu-west-2:000000000000:function:svcapi-pre-token-generation"
  from_email_address: "no-reply@svcapi.example.internal"
  reply_to_email_address: "support@svcapi.example.internal"
  ses_source_arn: "arn:aws:ses:eu-west-2:000000000000:identity/svcapi.example.internal"

# Local, disposable state - same rationale as sandbox.yaml: the inherited S3
# backend assumes a management-account role that does not exist here.
terraform:
  backend_type: local
  backend:
    local: {}

settings:
  environment:
    description: "Serverless-api template check (describe/validate/plan-sweep only)"
    namespace: svcapi
    account: local
    aws_account_id: "000000000000"
  context:
    tenant: fnx
    environment: svcapi
    stage: local

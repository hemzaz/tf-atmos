---
# Local sandbox account defaults.
#
# Deliberately NOT a real AWS account. Everything under orgs/fnx/local targets
# the Floci emulator via the `local-aws` identity, so the account id is the
# emulator's own well-known id rather than a placeholder to be filled in.
import:
  - orgs/fnx/_defaults
  - mixins/tenant/fnx

# No provider account guard here: the Floci lane's provider config skips
# requesting the account ID, and the AWS provider then rejects any
# allowed_account_ids list (it compares against an empty ID). Removes the
# org-wide terraform.providers.aws.allowed_account_ids (orgs/fnx/_defaults.yaml).
terraform:
  providers:
    aws: !unset

settings:
  environment:
    account: local
    account_id: "000000000000"
  # Read by terraform-ci.yml/terraform-cd.yml/drift-detection.yml to keep these
  # emulator-only stacks out of the AWS plan/deploy/drift matrices: they have no
  # iam/ci plan or apply role (ci-apply-role-arn.py), and are covered instead by
  # emulator.yml. This mirrors Cloud Posse's own Atmos GitHub Action key
  # (settings.github.actions_enabled — see
  # cloudposse/github-action-atmos-terraform-plan and
  # -terraform-apply, which read exactly this path to skip a component's
  # Terraform steps), but with the default inverted: Cloud Posse's actions
  # opt a component IN with `actions_enabled: true`; here a missing value
  # means enabled (so the three real stacks need no change) and only the
  # local stacks opt OUT with `actions_enabled: false`. Data-driven (survives
  # a stack rename) rather than a `fnx-local-` name-prefix check.
  github:
    actions_enabled: false

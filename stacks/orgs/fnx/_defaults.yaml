---
# =============================================================================
# fnx Organization Defaults
# =============================================================================
# Shared by every fnx stack: identity vars, standard tags, the Terraform
# toolchain pin and the S3 state backend.
# =============================================================================

vars:
  tags:
    Tenant: "{{ .settings.context.tenant }}"
    Account: "{{ .settings.environment.account }}"
    Environment: "{{ .settings.prefix }}"
    Stage: "{{ .settings.context.stage }}"
    ManagedBy: "Terraform"

terraform:
  # Terraform binary version installed by the Atmos toolchain for every component
  dependencies:
    tools:
      terraform: "1.16.3"

  # The state backend named by settings.tfstate (bucket, region, role_prefix):
  # the bucket and access roles created by a `backend` instance, backend/main in
  # the management account. The default is fnx-ue1-root's
  # (stacks/orgs/fnx/root/us-east-1.yaml); an EU stack overrides settings.tfstate.
  # Native S3 locking replaces DynamoDB. Atmos derives `workspace_key_prefix`
  # from the component name and the workspace from the stack name, so every
  # instance gets its own state file.
  #
  # Access goes through one of the backend's access roles (Cloud Posse
  # tfstate-backend access_roles), split by stage (state objects "*/<stack>/*" and "*/<stack>-*"):
  #   <role_prefix>-role            read/write, dev/staging objects; the dev/staging CI apply roles
  #                                 and the dev/staging accounts' OrganizationAccountAccessRole
  #                                 until E4 (each reaches both stages' state, as the apply roles do)
  #   <role_prefix>-read-role       read-only, dev/staging objects; the dev/staging CI plan roles
  #   <role_prefix>-prod-role       read/write, prod objects; the prod stacks' apply roles and the
  #                                 prod account's OrganizationAccountAccessRole until E4 (EU: prod-eu's)
  #   <role_prefix>-prod-read-role  read-only, prod objects; prod's plan role only
  #   <role_prefix>-root-role       read/write, the root stacks' and the core stages' objects;
  #                                 the administrator who applies backend/main, plus each
  #                                 enabled core account's OrganizationAccountAccessRole until
  #                                 E4 (so it reaches the root stacks' state until E5's core role)
  # The role is per stack, not per job, so a job picks it with an environment
  # variable: TFSTATE_ACCESS=read selects the stage's read-only role, anything
  # else its read/write one. The plan-only CI jobs (terraform-ci.yml plan,
  # drift-detection.yml) set it and plan with -lock=false: the read-only roles
  # cannot write a .tflock object. Applies (terraform-cd.yml) leave it unset.
  # A stage "root" stack always gets the root role: no CI role touches it. So do
  # the core-account stages (audit, security, network, identity, artifacts;
  # E2), never the dev/staging roles
  # the CI apply roles hold; TFSTATE_ACCESS=read selects the root role for them
  # too, as for root. The provider guard needs credentials in the core account,
  # so the PR enabling a core stack's first instance adds the stack's pattern
  # pair and that account's OrganizationAccountAccessRole to root_write's
  # allowed_principal_arns (stacks/orgs/fnx/root/us-east-1.yaml) until E4's
  # Identity Center roles replace it. A dedicated core_write role (E5), or
  # removing the OAARs from root_write, must land before E4 grants any permission
  # set in a core account: from then on a principal there that can edit OAAR's
  # trust reaches the root stacks' state.
  #
  # TFSTATE_SOURCE=replica reads the bucket's cross-region replica instead
  # (<bucket>-replica in settings.tfstate.replica_region, backend/main's
  # s3_replication_enabled), for an outage of the bucket's region. Every role
  # can only read the replica: plan with -lock=false, never apply
  # (docs/OPERATIONS.md, "State during a us-east-1 outage").
  backend_type: s3
  backend:
    s3:
      bucket: '{{ .settings.tfstate.bucket }}{{ if eq (env "TFSTATE_SOURCE") "replica" }}-replica{{ end }}'
      key: "terraform.tfstate"
      region: '{{ if eq (env "TFSTATE_SOURCE") "replica" }}{{ .settings.tfstate.replica_region }}{{ else }}{{ .settings.tfstate.region }}{{ end }}'
      encrypt: true
      use_lockfile: true
      assume_role:
        role_arn: 'arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.tfstate.role_prefix }}{{ if has .settings.context.stage (list "root" "audit" "security" "network" "identity" "artifacts") }}-root{{ else }}{{ if eq .settings.context.stage "prod" }}-prod{{ end }}{{ if eq (env "TFSTATE_ACCESS") "read" }}-read{{ end }}{{ end }}-role'

  # Account guard: every stack's default AWS provider refuses to run in any
  # account but the stack's own (Atmos writes this into each component's
  # providers_override.tf.json; Terraform merges it into the unaliased
  # provider "aws" block). A wrong profile or role fails at provider
  # configuration, before any plan or apply. Cloud Posse's Atmos reference
  # sets this very argument in the stack `providers` section
  # (atmos.tools/stacks/providers, "AWS Provider"); its components reach the
  # same end by assuming a role that account-map's iam-roles module derives
  # for the stack's account.
  # The override never reaches an aliased block: backup's `replica` shares the
  # default provider's credentials, so the default's guard already stops it,
  # and dns's `dns_account` assumes a role in another account on purpose.
  # The emulator stacks unset this (stacks/orgs/fnx/local/_defaults.yaml).
  providers:
    aws:
      allowed_account_ids:
        - "{{ .settings.environment.account_id }}"
settings:
  # The environment-derived name prefix (tags.Environment, which components
  # start their names with): the region code, plus -<name> on a lane
  # (settings.context.name), so a lane deploys beside its stage stack in one
  # account and region (ue1, ue1-serverless; Cloud Posse null-label order).
  # Reference it as {{ .settings.prefix }}: the second template evaluation
  # (atmos.yaml) renders it. Backticks, not quotes: the expression is pasted
  # into double-quoted YAML by the first evaluation.
  prefix: '{{ .settings.context.environment }}{{ if hasKey .settings.context `name` }}-{{ .settings.context.name }}{{ end }}'
  # The GitHub App that registers the self-hosted CI runners (github-runners'
  # jit function): its ID and installation ID, not secrets. 0 until the owner
  # creates it (docs/OPERATIONS.md#first-deploy-inputs, GitHub App).
  github_app:
    app_id: "0"
    installation_id: "0"
  # ONE account map: the only place account IDs are written. Shaped like the
  # outputs of Cloud Posse's account-map component (full_account_map: account
  # name -> id, plus the names of the root, identity and audit accounts), so the
  # tf-atmos org layer (turnkey Wave E) can replace it with that component's
  # output without touching any reader. Keys are the account names: Cloud
  # Posse's core accounts (owner decision Q1) are root (the management
  # account, stack fnx-ue1-root), audit (log archive), security, network,
  # identity and artifacts; the workload accounts are each stage's
  # settings.environment.account; prod-eu is the EU prod account
  # (fnx-ew1-prod, GDPR: its own account, not prod's), whose stack overrides
  # settings.environment.account. Each core account has its home-region stack
  # fnx-ue1-<account> (stacks/orgs/fnx/<account>/).
  # The preflight fails a placeholder core account, two core accounts sharing
  # an ID and a core account equal to a workload one. Placeholder IDs: see
  # docs/OPERATIONS.md#first-deploy-inputs.
  #
  # Readers: settings.environment.management_account_id (below) and each
  # stage's settings.environment.account_id (stacks/orgs/fnx/<stage>/_defaults.yaml),
  # plus the CI role ARNs in fnx-ue1-root's and fnx-ew1-root's backend
  # access_roles (prod-eu by index: a hyphenated key is no template field). Those
  # settings are templates read by other templates, which is why atmos.yaml
  # renders templates in two evaluations.
  account_map:
    full_account_map:
      root: "123456789012"
      audit: "123456789012"
      security: "123456789012"
      network: "123456789012"
      identity: "123456789012"
      artifacts: "123456789012"
      dev: "123456789012"
      staging: "123456789012"
      prod: "123456789012"
      prod-eu: "123456789012"
    root_account_account_name: root
    identity_account_account_name: identity
    audit_account_account_name: audit
  # The same map in the shape of the static `account_map` input of Cloud Posse
  # components run with account_map_enabled: false (e.g. aws-guardduty v3.0.2,
  # src/variables.tf: "Map keys use `tenant-stage` format (e.g., `core-security`,
  # `core-audit`, `plat-prod`)"): keys <tenant>-<account>. Every value is a
  # template over settings.account_map, so the IDs stay written once; a new
  # account_map entry needs its line here. Owner decision QE5.
  static_account_map:
    full_account_map:
      '{{ .settings.context.tenant }}-root': '{{ .settings.account_map.full_account_map.root }}'
      '{{ .settings.context.tenant }}-audit': '{{ .settings.account_map.full_account_map.audit }}'
      '{{ .settings.context.tenant }}-security': '{{ .settings.account_map.full_account_map.security }}'
      '{{ .settings.context.tenant }}-network': '{{ .settings.account_map.full_account_map.network }}'
      '{{ .settings.context.tenant }}-identity': '{{ .settings.account_map.full_account_map.identity }}'
      '{{ .settings.context.tenant }}-artifacts': '{{ .settings.account_map.full_account_map.artifacts }}'
      '{{ .settings.context.tenant }}-dev': '{{ .settings.account_map.full_account_map.dev }}'
      '{{ .settings.context.tenant }}-staging': '{{ .settings.account_map.full_account_map.staging }}'
      '{{ .settings.context.tenant }}-prod': '{{ .settings.account_map.full_account_map.prod }}'
      # A CP component that split("-")s a key reads <tenant>-prod-eu as stage prod: check each consumer (E5).
      '{{ .settings.context.tenant }}-prod-eu': '{{ index .settings.account_map.full_account_map "prod-eu" }}'
    root_account_account_name: '{{ .settings.context.tenant }}-{{ .settings.account_map.root_account_account_name }}'
    identity_account_account_name: '{{ .settings.context.tenant }}-{{ .settings.account_map.identity_account_account_name }}'
    audit_account_account_name: '{{ .settings.context.tenant }}-{{ .settings.account_map.audit_account_account_name }}'
  # The state backend every stack's terraform.backend reads (above): the bucket
  # backend/main creates in fnx-ue1-root, its region and the name prefix of its
  # access roles (<role_prefix>-role, -read-role, -prod-role, -prod-read-role,
  # -root-role), and stack, the stack that deploys backend/main (iam's
  # dependency, catalog/iam). A stack keeps its state here, not in its own
  # region: a DR stack (fnx-ue2-prod) too. An EU stack overrides all of
  # settings.tfstate: bucket, region, replica_region (an EU region),
  # role_prefix and stack (backend/main in its own root stack, in the
  # management account).
  # check-state-keys.py fails a stack whose backend region differs from backend/main's.
  # replica_region: where backend/main replicates the bucket (<bucket>-replica),
  # read through TFSTATE_SOURCE=replica when region is down.
  # bucket, role_prefix and stack are templates read by templates; the second
  # evaluation (atmos.yaml) renders them. An override may reference only
  # literal settings (.settings.context.*), never .settings.prefix or
  # .settings.environment.*: a deeper chain leaks raw "{{ }}" into the backend.
  tfstate:
    region: us-east-1
    replica_region: us-east-2
    bucket: '{{ .settings.context.tenant }}-terraform-state'
    role_prefix: '{{ .settings.context.tenant }}-terraform-backend'
    stack: '{{ .settings.context.tenant }}-ue1-root'
  environment:
    management_account_id: '{{ index .settings.account_map.full_account_map .settings.account_map.root_account_account_name }}'
  context:
    tenant: fnx

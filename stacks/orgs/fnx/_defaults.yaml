---
# =============================================================================
# fnx Organization Defaults
# =============================================================================
# Shared by every fnx stack: identity vars, standard tags, the Terraform
# toolchain pin and the S3 state backend.
# =============================================================================

vars:
  tags:
    Tenant: "{{ .settings.context.tenant }}"
    Account: "{{ .settings.environment.account }}"
    Environment: "{{ .settings.context.environment }}"
    ManagedBy: "Terraform"

terraform:
  # Terraform binary version installed by the Atmos toolchain for every component
  dependencies:
    tools:
      terraform: "1.16.3"

  # ONE state backend for every stack: the bucket and access roles created by
  # the `backend` component's single instance, backend/main in the management
  # account's stack fnx-core-root (stacks/orgs/fnx/core/us-east-1/root.yaml).
  # Native S3 locking replaces DynamoDB. Atmos derives `workspace_key_prefix`
  # from the component name and the workspace from the stack name, so every
  # instance gets its own state file.
  #
  # Access goes through one of the backend's access roles (Cloud Posse
  # tfstate-backend access_roles), split by stage (state objects "*/<tenant>-<stage>-*"):
  #   <tenant>-terraform-backend-role            read/write, dev/staging objects; the dev/staging CI apply roles
  #   <tenant>-terraform-backend-read-role       read-only, dev/staging objects; the dev/staging CI plan roles
  #   <tenant>-terraform-backend-prod-role       read/write, prod objects; prod's apply role only
  #   <tenant>-terraform-backend-prod-read-role  read-only, prod objects; prod's plan role only
  #   <tenant>-terraform-backend-core-role       read/write, fnx-core-root objects; the administrator
  #                                              who applies backend/main only (read or write)
  # The role is per stack, not per job, so a job picks it with an environment
  # variable: TFSTATE_ACCESS=read selects the stage's read-only role, anything
  # else its read/write one. The plan-only CI jobs (terraform-ci.yml plan,
  # drift-detection.yml) set it and plan with -lock=false: the read-only roles
  # cannot write a .tflock object. Applies (terraform-cd.yml) leave it unset.
  # A stage "core" stack always gets the core role: no CI role touches it.
  backend_type: s3
  backend:
    s3:
      bucket: "{{ .settings.context.tenant }}-terraform-state"
      key: "terraform.tfstate"
      region: "{{ .settings.tfstate.region }}"
      encrypt: true
      use_lockfile: true
      assume_role:
        role_arn: 'arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend{{ if eq .settings.context.stage "core" }}-core{{ else }}{{ if eq .settings.context.stage "prod" }}-prod{{ end }}{{ if eq (env "TFSTATE_ACCESS") "read" }}-read{{ end }}{{ end }}-role'

settings:
  # ONE account map: the only place account IDs are written. Shaped like the
  # outputs of Cloud Posse's account-map component (full_account_map: account
  # name -> id, plus the names of the root and identity accounts), so the
  # tf-atmos org layer (turnkey Wave E) can replace it with that component's
  # output without touching any reader. Keys are the account names: `root` is
  # the management account (stack fnx-core-root); the workload accounts are
  # each stage's settings.environment.account. Wave E adds Cloud Posse's other
  # core accounts (audit, security, network, identity, artifacts); until then
  # the identity account is root. Placeholder IDs: see
  # docs/OPERATIONS.md#first-deploy-inputs.
  #
  # Readers: settings.environment.management_account_id (below) and each
  # stage's settings.environment.account_id (stacks/orgs/fnx/<stage>/_defaults.yaml),
  # plus the CI role ARNs in fnx-core-root's backend access_roles. Those
  # settings are templates read by other templates, which is why atmos.yaml
  # renders templates in two evaluations.
  account_map:
    full_account_map:
      root: "123456789012"
      dev: "123456789012"
      staging: "123456789012"
      prod: "123456789012"
    root_account_account_name: root
    identity_account_account_name: root
  # The ONE region of the state bucket (backend/main, fnx-core-root). Every stack's backend
  # reads it, not the stack's own region: a DR or EU stack still keeps its state here.
  # check-state-keys.py fails a stack whose backend region differs from backend/main's.
  tfstate:
    region: us-east-1
  environment:
    namespace: fnx
    management_account_id: '{{ index .settings.account_map.full_account_map .settings.account_map.root_account_account_name }}'
  context:
    tenant: fnx

---
# =============================================================================
# fnx Organization Defaults
# =============================================================================
# Shared by every fnx stack: identity vars, standard tags, the Terraform
# toolchain pin and the S3 state backend.
# =============================================================================

vars:
  tags:
    Tenant: "{{ .settings.context.tenant }}"
    Account: "{{ .settings.environment.account }}"
    Environment: "{{ .settings.context.environment }}"
    ManagedBy: "Terraform"

terraform:
  # Terraform binary version installed by the Atmos toolchain for every component
  dependencies:
    tools:
      terraform: "1.16.3"

  # ONE state backend for every stack: the bucket and access roles created by
  # the `backend` component's single instance, backend/main in the management
  # account's stack fnx-core-root (stacks/orgs/fnx/core/eu-west-2/root.yaml).
  # Native S3 locking replaces DynamoDB. Atmos derives `workspace_key_prefix`
  # from the component name and the workspace from the stack name, so every
  # instance gets its own state file.
  #
  # Access goes through one of the backend's two access roles (Cloud Posse
  # tfstate-backend access_roles):
  #   <tenant>-terraform-backend-role       read/write, trusted by the CI apply roles
  #   <tenant>-terraform-backend-read-role  read-only,  trusted by the CI plan roles
  # The role is per stack, not per job, so a job picks it with an environment
  # variable: TFSTATE_ACCESS=read selects the read-only role, anything else the
  # read/write one. The plan-only CI jobs (terraform-ci.yml plan,
  # drift-detection.yml) set it and plan with -lock=false: the read-only role
  # cannot write a .tflock object. Applies (terraform-cd.yml) leave it unset.
  backend_type: s3
  backend:
    s3:
      bucket: "{{ .settings.context.tenant }}-terraform-state"
      key: "terraform.tfstate"
      region: "{{ .vars.region }}"
      encrypt: true
      use_lockfile: true
      assume_role:
        role_arn: 'arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend{{ if eq (env "TFSTATE_ACCESS") "read" }}-read{{ end }}-role'
settings:
  environment:
    namespace: fnx
    management_account_id: "123456789012"
  context:
    tenant: fnx

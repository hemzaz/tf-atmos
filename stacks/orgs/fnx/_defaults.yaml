---
# =============================================================================
# fnx Organization Defaults
# =============================================================================
# Shared by every fnx stack: identity vars, standard tags, the Terraform
# toolchain pin and the S3 state backend.
# =============================================================================

vars:
  tags:
    Tenant: "{{ .settings.context.tenant }}"
    Account: "{{ .settings.environment.account }}"
    Environment: "{{ .settings.context.environment }}"
    ManagedBy: "Terraform"

terraform:
  # Terraform binary version installed by the Atmos toolchain for every component
  dependencies:
    tools:
      terraform: "1.16.3"

  # State lives in the bucket created by the `backend` component
  # (stacks/catalog/backend/defaults.yaml). Native S3 locking replaces DynamoDB.
  # Atmos derives `workspace_key_prefix` from the component name and the
  # workspace from the stack name, so every instance gets its own state file.
  backend_type: s3
  backend:
    s3:
      bucket: "{{ .settings.context.tenant }}-terraform-state"
      key: "terraform.tfstate"
      region: "{{ .vars.region }}"
      encrypt: true
      use_lockfile: true
      assume_role:
        role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-role"
settings:
  environment:
    namespace: fnx
    management_account_id: "123456789012"
  context:
    tenant: fnx

# fnx-ue1-fixtures-msplatform: stacks/catalog/templates/
# microservices-platform.yaml under CI's checks. Never deployed (see
# ../_defaults.yaml).
import:
  - orgs/fnx/fixtures/_defaults
  - catalog/network/defaults
  - catalog/templates/microservices-platform

settings:
  context:
    name: msplatform
  # The template's REQUIREMENTS 2. Placeholders.
  microservices:
    app_domain_name: fixtures.example.com
    hosted_zone_id: Z0123456789ABCDEFGHIJ
    letsencrypt_email: ops@example.com
    cognito_user_pool_id: us-east-1_Fixtures0
    cognito_client_id: fixturesclientid0000000000
    welcome_email_version: "1.0.0"
    dns_component: network/main
    dns_zone_key: main

components:
  terraform:

    # The template's REQUIREMENTS 4: the dns instance holding app_domain_name's
    # public zone.
    network/main:
      metadata:
        component: dns
        inherits:
          - dns
      vars:
        root_domain: fixtures.example.com
        zones:
          main:
            name: fixtures.example.com
            comment: Template fixture zone

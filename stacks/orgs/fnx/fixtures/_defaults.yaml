# Template fixtures: one stack per stacks/catalog/templates/*.yaml, so the
# templates are resolved and checked by CI (check-dependencies, plan-sweep,
# validate-all) although no real stack imports them. NEVER deployed:
# settings.github.actions_enabled: false keeps them out of the CI plan, CD and
# drift matrices (as for orgs/fnx/local), disaster-recovery.yml only accepts
# the three real stacks, and deploy-full-stack refuses stage "fixtures".
#
# A template still being ported is listed in KNOWN_BROKEN_FIXTURES
# (workflows/scripts/common/fixtures.py): its failures are reported but do not
# fail the run. See docs/OPERATIONS.md, "Template fixtures".
import:
  - catalog/_base/defaults
  - orgs/fnx/_defaults
  - mixins/tenant/fnx
  - mixins/region/us-east-1
  - catalog/kms/defaults
  - catalog/aws-iam-service-linked-roles/main
  - catalog/aws-github-oidc-provider/main
  - catalog/aws-iam-role/ci

vars:
  region: us-east-1

settings:
  environment:
    account: fixtures
    # Placeholder, never deployed.
    account_id: "000000000000"
  context:
    stage: fixtures
  github:
    actions_enabled: false

# What every template expects its importing stack to provide (each template's
# REQUIREMENTS header): the stack's kms/main, the aws-iam-service-linked-roles
# instance (catalog/aws-iam-service-linked-roles/main) that provisions the Auto
# Scaling service-linked role kms/main's key policy names, and the CI roles
# (catalog/aws-iam-role/ci: eks access entries read both roles' ARNs, so the
# apply role is on here too; check-ci-state-roles.py skips stage fixtures).
# aws-iam-service-linked-roles (the Auto Scaling SLR) and
# aws-github-oidc-provider (the GitHub OIDC provider the CI roles trust) are
# account-global singletons: fixture-only, never applied.
components:
  terraform:
    aws-iam-role/ci-apply:
      vars:
        policy_statements:
          # Every pool a fixture can hold: a stack's own, and the
          # microservices-platform template's.
          StartRunners:
            resources:
              - "arn:aws:autoscaling:{{ .vars.region }}:{{ .settings.environment.account_id }}:autoScalingGroup:*:autoScalingGroupName/{{ .settings.prefix }}-github-runners"
              - "arn:aws:autoscaling:{{ .vars.region }}:{{ .settings.environment.account_id }}:autoScalingGroup:*:autoScalingGroupName/{{ .settings.prefix }}-microservices-runners"

    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Template fixture key
        alias_name: '{{ .settings.prefix }}-main'
        deletion_window_in_days: 7
      dependencies:
        components:
          - component: aws-iam-service-linked-roles

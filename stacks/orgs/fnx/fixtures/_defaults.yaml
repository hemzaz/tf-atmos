# Template fixtures: one stack per stacks/catalog/templates/*.yaml, so the
# templates are resolved and checked by CI (check-dependencies, plan-sweep,
# validate-all) although no real stack imports them. NEVER deployed:
# settings.github.actions_enabled: false keeps them out of the CI plan, CD and
# drift matrices (as for orgs/fnx/local), disaster-recovery.yml only accepts
# the three real stacks, and deploy-full-stack refuses stage "fixtures".
#
# A template still being ported is listed in KNOWN_BROKEN_FIXTURES
# (workflows/scripts/common/fixtures.py): its failures are reported but do not
# fail the run. See docs/OPERATIONS.md, "Template fixtures".
import:
  - catalog/_base/defaults
  - orgs/fnx/_defaults
  - mixins/tenant/fnx
  - mixins/region/us-east-1
  - catalog/iam/defaults
  - catalog/kms/defaults

vars:
  region: us-east-1

settings:
  environment:
    account: fixtures
    # Placeholder, never deployed.
    account_id: "000000000000"
    aws_profile: "fixtures"
  context:
    stage: fixtures
  github:
    actions_enabled: false

# What every template expects its importing stack to provide (each template's
# REQUIREMENTS header): the stack's kms/main, the iam instance that provisions
# the Auto Scaling service-linked role kms/main's key policy names, and iam/ci
# (eks access entries read its CI role ARNs).
components:
  terraform:
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        environment: dev
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: true
        ci_role_name_prefix: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-ci"
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-read-role"


    iam/fixtures:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        # The iam component validates a lifecycle tier (dev/staging/prod).
        environment: dev
        enable_autoscaling_service_linked_role: true

    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Template fixture key
        alias_name: '{{ .settings.context.environment }}-main'
        deletion_window_in_days: 7
      dependencies:
        components:
          - component: iam/fixtures

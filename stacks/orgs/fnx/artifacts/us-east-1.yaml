---
# =============================================================================
# fnx-ue1-artifacts - the artifacts account's home-region stack
# =============================================================================
# No instance of its own, and one enabled instance: its stage defaults'
# aws-account-settings (stacks/orgs/fnx/artifacts/_defaults.yaml); no Wave E
# component is placed here yet. Its state goes to fnx-ue1-root's bucket through
# the backend's root role (stacks/orgs/fnx/_defaults.yaml), whose root_write
# holds this stack's pattern pair (check-state-keys.py) and trusts the
# artifacts account's OrganizationAccountAccessRole: the provider guard needs
# credentials in the artifacts account, and that role is the way in until E4's
# Identity Center roles.
# =============================================================================

import:
  - catalog/_base/defaults
  - mixins/region/us-east-1
  - orgs/fnx/artifacts/_defaults

---
# =============================================================================
# network/main in the nonprod stacks (dev and staging)
# =============================================================================
# The stage's public zone, and the private internal zone on vpc/main. Each
# stack keeps its zone comments and its records' addresses
# (the stack file, orgs/fnx/<stage>/<region>.yaml). The public zone is
# <stage>.<apex>, delegated from fnx-ue1-network's apex by the stage's
# aws-dns-delegated (imported here, disabled with it): see
# catalog/aws-dns-delegated/main for the external_zones form main takes when
# it is enabled.
# =============================================================================

import:
  - catalog/network/defaults
  - catalog/aws-dns-delegated/main

components:
  terraform:
    network/main:
      metadata:
        component: dns
        inherits:
          - dns
      vars:
        root_domain: "{{ .settings.environment.domain_name }}"
        create_root_zone: false
        multi_account_dns_delegation: false
        # Pins the account-wide query-logging resource policy and key alias
        # (route53-query-logging-<suffix>): derived from the first query-logged
        # zone, they would be replaced when E6b moves the public zone to
        # external_zones or adds one that sorts earlier. network/services, in
        # the same account, keeps its own derived name.
        query_logging_name: "{{ .settings.prefix }}-main"
        zones:
          main:
            name: "{{ .settings.environment.domain_name }}"
            force_destroy: true
            enable_query_logging: true
          internal:
            name: "internal.{{ .settings.environment.domain_name }}"
            force_destroy: true
            vpc_associations:
              - !terraform.state vpc/main .vpc_id
        records:
          # Delegates services.<domain> (network/services, dns-zones layer)
          # from this zone: ACM validates acm/services' names there.
          services_delegation:
            zone_name: "main"
            name: "services.{{ .settings.environment.domain_name }}"
            type: "NS"
            ttl: 30 # Cloud Posse dns-delegated's NS TTL
            records: !terraform.state network/services .zone_name_servers.services
          # services.<domain>'s DNSSEC DS record, continuing the chain of trust
          # below the apex. Coupled to network/services' dnssec_ds_enabled: its
          # ds_records is empty while that is off, and the dns module then
          # drops this record (all values null) instead of failing.
          services_ds:
            zone_name: "main"
            name: "services.{{ .settings.environment.domain_name }}"
            type: "DS"
            ttl: 30
            records:
              - !terraform.state network/services .ds_records.services
          www_main:
            zone_name: "main"
            name: "www.{{ .settings.environment.domain_name }}"
            type: "A"
            ttl: 300
          db_internal:
            zone_name: "internal"
            name: "db.internal.{{ .settings.environment.domain_name }}"
            type: "A"
            ttl: 60
      dependencies:
        components:
          - component: network/services
          - component: vpc/main

---
components:
  terraform:
    vpc:
      metadata:
        component: vpc
        type: abstract
      vars:
        vpc_cidr: "10.0.0.0/16"
        azs:
          - '{{ .vars.region }}a'
          - '{{ .vars.region }}b'
          - '{{ .vars.region }}c'
        private_subnets:
          - "10.0.1.0/24"
          - "10.0.2.0/24"
          - "10.0.3.0/24"
        public_subnets:
          - "10.0.101.0/24"
          - "10.0.102.0/24"
          - "10.0.103.0/24"
        enable_nat_gateway: true
        enable_vpn_gateway: false
        enable_transit_gateway: false
        transit_gateway_id: ""
        ram_resource_share_arn: ""
        create_vpc_iam_role: true

        tags:
          Component: "Network"
    dns:
      metadata:
        component: dns
        type: abstract
      vars:
        enabled: true
        root_domain: "{{ .settings.context.tenant }}.com"
        create_root_zone: false
        multi_account_dns_delegation: false

        # Configure zones
        zones:
          main:
            name: '{{ .settings.context.environment }}.{{ .settings.context.tenant }}.com'
            comment: Main zone for {{ .settings.context.environment }} environment
            force_destroy: false
            enable_query_logging: true
            vpc_associations: []
          internal:
            name: internal.{{ .settings.context.environment }}.{{ .settings.context.tenant }}.com
            comment: Internal DNS for {{ .settings.context.environment }} environment
            vpc_associations:
              - !terraform.state vpc/main .vpc_id
            force_destroy: false

        # Optional records configuration
        records: {}

        # Health checks configuration
        health_checks: {}

        # VPC DNS resolution
        vpc_dns_resolution:
          main_vpc:
            vpc_id: !terraform.state vpc/main .vpc_id
            associated_zones:
              - internal

        tags:
          Component: "DNS"

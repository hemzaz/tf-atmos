---
components:
  terraform:
    vpc:
      metadata:
        component: vpc
        type: abstract
      vars:
        ipv4_primary_cidr_block: "10.0.0.0/16"
        availability_zones:
          - '{{ .vars.region }}a'
          - '{{ .vars.region }}b'
          - '{{ .vars.region }}c'
        private_subnets:
          - "10.0.1.0/24"
          - "10.0.2.0/24"
          - "10.0.3.0/24"
        public_subnets:
          - "10.0.101.0/24"
          - "10.0.102.0/24"
          - "10.0.103.0/24"
        nat_gateway_enabled: true
        enable_vpn_gateway: false
        enable_transit_gateway: false
        transit_gateway_id: ""
        ram_resource_share_arn: ""

        tags:
          Component: "Network"
    dns:
      metadata:
        component: dns
        type: abstract
      vars:
        create_root_zone: false
        multi_account_dns_delegation: false
        # Zones (and their zone_ids output keys), records and root_domain are set
        # per instance; a zone with vpc_associations is created as a private zone.
        zones: {}
        records: {}

        tags:
          Component: "DNS"

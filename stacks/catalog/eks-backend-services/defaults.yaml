---
# Catalog defaults for eks-backend-services. The EKS/ClusterSecretStore/
# database/redis wiring (all !terraform.state) is not here, because those
# targets differ per stack (redis only in prod): the DR standbys set it in
# their catalog instance file (main-standby.yaml, main-standby-failover.yaml),
# the prod primaries inherit eks-backend-services/prod, and dev and staging
# import catalog/eks-backend-services/main.
components:
  terraform:
    eks-backend-services/defaults:
      metadata:
        component: eks-backend-services
        type: abstract
      # Talks to the private EKS API: CI/CD/drift run it on the in-VPC runners
      # (see catalog/eks-addons/defaults.yaml).
      settings:
        github:
          runner: in-vpc
      vars:
        # Only the prod primaries and their DR standbys run an
        # elasticache/main instance (stacks/catalog/elasticache/); every stack
        # starts with redis off and the prod instances turn it on explicitly.
        redis_enabled: false
        # No stack in this repo installs the Prometheus Operator or its CRDs
        # (monitoring.coreos.com), so ServiceMonitor resources have no schema
        # to resolve against the live API server and every plan would fail.
        # Flip to true only once a stack wires kube-prometheus-stack (or
        # equivalent) into eks-addons for that cluster.
        enable_prometheus_monitoring: false
        enable_database_migrations: true

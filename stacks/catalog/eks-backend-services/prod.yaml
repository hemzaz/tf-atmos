---
import:
  - catalog/eks-backend-services/defaults

# The backend microservices on the production main cluster, shared by
# fnx-ue1-prod's and fnx-ew1-prod's eks-backend-services/main: eks/main, the
# external-secrets/main store, rds/main's database and elasticache/main's
# cache (prod turns redis on), and the release pipeline's images from the
# stack's settings.environment.backend_service_images. Plans/applies in the
# "services" layer of workflows/deploy-full-stack.yaml (after compute,
# platform, data and addons), so it can read that state on a first deploy.
components:
  terraform:
    eks-backend-services/prod:
      metadata:
        component: eks-backend-services
        type: abstract
        inherits:
          - eks-backend-services/defaults
      vars:
        environment: "{{ .settings.context.stage }}"
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        cluster_secret_store_name: !terraform.state external-secrets/main .default_cluster_secret_store_name
        database_secret_arn: !terraform.state rds/main .password_secret_arn
        database_endpoint: !terraform.state rds/main .instance_endpoint
        database_name: !terraform.state rds/main .instance_name
        redis_enabled: true
        redis_secret_arn: !terraform.state elasticache/main .auth_token_secret_arn
        redis_host: !terraform.state elasticache/main .primary_endpoint_address
        redis_port: !terraform.state elasticache/main .port
        api_gateway_image: '{{ required "settings.environment.backend_service_images.api_gateway must be set" .settings.environment.backend_service_images.api_gateway }}'
        platform_api_image: '{{ required "settings.environment.backend_service_images.platform_api must be set" .settings.environment.backend_service_images.platform_api }}'
        auth_service_image: '{{ required "settings.environment.backend_service_images.auth_service must be set" .settings.environment.backend_service_images.auth_service }}'
        job_processor_image: '{{ required "settings.environment.backend_service_images.job_processor must be set" .settings.environment.backend_service_images.job_processor }}'
      dependencies:
        components:
          - component: eks/main
          - component: eks-addons/main
          - component: external-secrets/main
          - component: rds/main
          - component: elasticache/main

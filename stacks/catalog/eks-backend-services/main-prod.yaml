---
# =============================================================================
# eks-backend-services/main in the prod primary stacks: the backend microservices
# =============================================================================
# The instance file, not the abstract: the wiring is the
# eks-backend-services/prod abstract's (prod.yaml), on eks/main, rds/main and
# elasticache/main (only prod runs it, so only prod turns redis_enabled on)
# through external-secrets/main's store. Plans/applies in the "services" layer
# of workflows/deploy-full-stack.yaml (after compute, platform, data and
# addons), so it can read that state on a first deploy.
# =============================================================================

import:
  - catalog/eks-backend-services/prod

components:
  terraform:
    eks-backend-services/main:
      metadata:
        component: eks-backend-services
        inherits:
          - eks-backend-services/prod

---
# =============================================================================
# The CI roles and iam/ci in the nonprod stacks
# =============================================================================
# The GitHub Actions OIDC plan and apply roles are the vendored aws-iam-role's
# aws-iam-role/ci-plan and aws-iam-role/ci-apply (catalog/aws-iam-role/ci,
# E6a4), and the application repo's Lambda package uploader is
# aws-iam-role/lambda-uploader (catalog/aws-iam-role/lambda-uploader, E6a5,
# off until a stack names the repo), imported here with the account's GitHub
# OIDC provider. iam/ci creates nothing; this file stays the stacks' import
# path until E6a6 moves their imports and deletes catalog/iam. Every name is
# derived from the stack, so the instances are the same in each nonprod stack.
# =============================================================================

import:
  - catalog/iam/defaults
  - catalog/aws-github-oidc-provider/main
  - catalog/aws-iam-role/lambda-uploader

components:
  terraform:
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      dependencies:
        components:
          - component: backend/main
            stack: "{{ .settings.tfstate.stack }}"
          - component: aws-github-oidc-provider

---
import:
  - catalog/_base/defaults

components:
  terraform:
    iam:
      metadata:
        component: iam
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages IAM roles for cross-account access and CI/CD"
          category: "security"
      vars:
        # Component-specific variables only
        # Base variables (tenant, account, environment, region) inherited from _base
        enabled: true
        cross_account_role_name: "{{ .vars.tenant }}-{{ .vars.account }}-{{ .vars.environment }}-CrossAccountRole"
        policy_name: "{{ .vars.tenant }}-{{ .vars.account }}-{{ .vars.environment }}-CrossAccountPolicy"

        tags:
          Component: "IAM"

      providers:
        aws:
          assume_role:
            role_arn: "arn:aws:iam::{{ .vars.target_account_id | default .vars.account_id }}:role/{{ .vars.tenant }}-{{ .vars.account }}-{{ .vars.environment }}-TerraformExecutionRole"

      dependencies:
        components:
          - component: backend/main

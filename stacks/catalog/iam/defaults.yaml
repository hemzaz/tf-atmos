---
import:
  - catalog/_base/defaults

components:
  terraform:
    iam:
      metadata:
        component: iam
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages IAM service-linked roles and the GitHub Actions CI roles"
          category: "security"
      vars:
        # No cross-account operator role: human access is IAM Identity Center
        # permission sets (catalog/aws-identity-center), Cloud Posse's model.
        # The account's GitHub OIDC provider, which the CI roles trust: the
        # vendored aws-github-oidc-provider in the account's first stack
        # (catalog/aws-github-oidc-provider) creates it, and AWS fixes its ARN
        # (oidc-provider/<url host>), so it is derived here, the one place,
        # rather than read from state (each CI-role instance depends on the
        # provider instance for ordering).
        github_oidc_provider_arn: "arn:aws:iam::{{ .settings.environment.account_id }}:oidc-provider/token.actions.githubusercontent.com"
        tags:
          Component: "IAM"

      # The single state backend lives in the management account's stack
      # (settings.tfstate.stack). Every iam instance that inherits catalog/iam
      # gets this; one that sets its own dependencies.components replaces the
      # list and repeats it.
      dependencies:
        components:
          - component: backend/main
            stack: "{{ .settings.tfstate.stack }}"

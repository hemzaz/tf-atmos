---
import:
  - catalog/_base/defaults

components:
  terraform:
    iam:
      metadata:
        component: iam
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages IAM roles for cross-account access and CI/CD"
          category: "security"
      vars:
        # The lifecycle tier the component validates (dev/staging/prod).
        # context.environment is the instance name (`testenv-01`) and fails it.
        environment: "{{ .settings.context.stage }}"
        account_id: "{{ .settings.environment.account_id }}"
        # Principals allowed to assume the cross-account role
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"
        # Trust condition: the module requires require_mfa, external_id or
        # trusted_principal_org_id when trusting another account.
        # TODO(placeholder): replace with the real AWS Organizations ID.
        trusted_principal_org_id: "o-xxxxxxxxxx"
        cross_account_role_name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-CrossAccountRole"
        policy_name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-CrossAccountPolicy"

        tags:
          Component: "IAM"

      providers:
        aws:
          assume_role:
            role_arn: "arn:aws:iam::{{ .settings.environment.account_id }}:role/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-TerraformExecutionRole"

      dependencies:
        components:
          - component: backend/main

---
import:
  - catalog/_base/defaults

components:
  terraform:
    iam:
      metadata:
        component: iam
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages IAM roles for cross-account access and CI/CD"
          category: "security"
      vars:
        # The lifecycle tier the component validates (dev/staging/prod).
        # context.environment is the region code (`ue1`) and fails it.
        environment: "{{ .settings.context.stage }}"
        account_id: "{{ .settings.environment.account_id }}"
        # Principals allowed to assume the cross-account role
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"
        # ...narrowed to exactly these role ARNs (aws:PrincipalArn, the
        # backend's access_roles pattern); the component requires at least one
        # when it creates the cross-account role, and rejects wildcards. The
        # role need not exist yet: until it does, nobody can assume the
        # cross-account role (fails closed).
        # TODO(placeholder): replace with the management-account role(s) that
        # actually operate this account (full ARN, path included).
        trusted_principal_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-cross-account-operator"
        # Trust condition: the module requires require_mfa, external_id or
        # trusted_principal_org_id when trusting another account.
        # TODO(placeholder): replace with the real AWS Organizations ID.
        trusted_principal_org_id: "o-xxxxxxxxxx"
        cross_account_role_name: "{{ .atmos_stack }}-CrossAccountRole"
        policy_name: "{{ .atmos_stack }}-CrossAccountPolicy"

        tags:
          Component: "IAM"

      # The single state backend lives in the management account's stack
      # (settings.tfstate.stack). Every iam instance that inherits catalog/iam
      # gets this; one that sets its own dependencies.components replaces the
      # list and repeats it.
      dependencies:
        components:
          - component: backend/main
            stack: "{{ .settings.tfstate.stack }}"

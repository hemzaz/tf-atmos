---
# =============================================================================
# iam/main in the prod primary stacks: the account IAM instance
# =============================================================================
# main.yaml's instance with an MFA condition on the cross-account trust. The
# account's one Auto Scaling service-linked role, which kms/main's key policy
# names (catalog/kms/main-prod.yaml depends on this instance). A DR standby
# stack has no iam/main: its primary's is the account's.
# =============================================================================

import:
  - catalog/iam/defaults

components:
  terraform:
    iam/main:
      metadata:
        component: iam
        inherits:
          - iam
      vars:

        # Cross-account access configuration
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"

        # MFA required for production access (trust condition)
        require_mfa: true

        # kms/main's allow_autoscaling_ebs grant (catalog/kms/defaults.yaml)
        # names the Auto Scaling service-linked role directly as a
        # key-policy principal; this is the one iam instance per account
        # that provisions it.
        enable_autoscaling_service_linked_role: true

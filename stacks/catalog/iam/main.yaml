# =============================================================================
# The account's service-linked roles, for a nonprod stack (staging)
# =============================================================================
# The house iam no longer creates the Auto Scaling service-linked role: the
# vendored aws-iam-service-linked-roles does (E6a2). This file stays only as the
# stacks' import path until E6a6 moves each stack's import to
# catalog/aws-iam-service-linked-roles/main and deletes catalog/iam.
# =============================================================================

import:
  - catalog/aws-iam-service-linked-roles/main

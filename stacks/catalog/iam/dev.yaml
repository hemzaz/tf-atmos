---
# =============================================================================
# iam/dev: the dev stage's account IAM instance
# =============================================================================
# Cross-account trust and the Auto Scaling service-linked role that kms/main's
# key policy names (catalog/kms/main-dev.yaml depends on this instance).
# =============================================================================

import:
  - catalog/iam/defaults

components:
  terraform:
    iam/dev:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        # Role and policy names
        trusted_account_ids:
          - "{{ .settings.environment.management_account_id }}"
        # kms/main's allow_autoscaling_ebs grant (catalog/kms/defaults.yaml)
        # names the Auto Scaling service-linked role directly as a
        # key-policy principal; this is the one iam instance per account
        # that provisions it.
        enable_autoscaling_service_linked_role: true

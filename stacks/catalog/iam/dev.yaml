---
# =============================================================================
# The account's service-linked roles, for the dev stage
# =============================================================================
# The house iam no longer creates the Auto Scaling service-linked role: the
# vendored aws-iam-service-linked-roles does (E6a2), one instance name in every
# account in place of iam/dev and iam/main. This file stays only as the stack's
# import path until E6a6 moves it to catalog/aws-iam-service-linked-roles/main
# and deletes catalog/iam.
# =============================================================================

import:
  - catalog/aws-iam-service-linked-roles/main

---
# =============================================================================
# aws-config variants: the abstract a stack's aws-config instance inherits
# =============================================================================
# Each stack writes its own instance (Cloud Posse's name), inheriting the one
# variant that fits it:
#
#   components:
#     terraform:
#       aws-config:
#         metadata:
#           component: aws-config
#           inherits:
#             - aws-config/main
#
#   aws-config/main          the account's home stack (its global resource
#                            collector region): creates the recorder role.
#   aws-config/main-region   a DR standby: the role of the primary it stands by
#                            for (settings.dr.standby_of, same account and
#                            residency), from that stack's state.
#   aws-config/main-eu-core  a shared account's eu-west-1 stack (fnx-ew1-root,
#                            fnx-ew1-audit): the role of its fnx-ue1-<stage>
#                            home stack by its convention ARN, since
#                            check-data-residency.py forbids an EU stack's
#                            dependency on a US one (IAM is global). Deploy the
#                            home stack first.
#   aws-config/security      fnx-ue1-security: main plus the US account
#                            aggregator.
#
# Upstream's own read of the collector region's role (remote state of
# "aws-config-<region code>") is bypassed (remote-state_override.tf); these
# variants set iam_role_arn instead.
# =============================================================================

import:
  - catalog/aws-config/defaults

components:
  terraform:
    aws-config/main:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/defaults
      vars:
        create_iam_role: true

    aws-config/main-region:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/defaults
      vars:
        iam_role_arn: !terraform.state aws-config {{ .settings.dr.standby_of }} .aws_config_iam_role
      # A list replaces the inherited one: defaults' bucket entry is repeated.
      dependencies:
        components:
          - component: config-bucket
            stack: '{{ .settings.context.tenant }}-{{ if hasPrefix "e" .settings.context.environment }}ew1{{ else }}ue1{{ end }}-audit'
          - component: aws-config
            stack: "{{ .settings.dr.standby_of }}"

    aws-config/main-eu-core:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/defaults
      vars:
        # The home stack's recorder role: the null-label id of its
        # aws-config (<tenant>-ue1-<stage>-aws-config) plus Cloud Posse's
        # "config" attribute (cloudposse/config aws_config_label).
        iam_role_arn: 'arn:aws:iam::{{ .settings.environment.account_id }}:role/{{ .settings.context.tenant }}-ue1-{{ .settings.context.stage }}-aws-config-config'

    # OQ-B: the aggregator covers every account but prod-eu (whose data stays
    # in the EU: its aggregator is fnx-ew1-security's, E5c). Cloud Posse
    # hardcodes all_regions, so it also reads the shared accounts' eu-west-1
    # recorders: the accepted, scoped check-data-residency exemption.
    aws-config/security:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/main
      vars:
        delegated_accounts:
          - '{{ .settings.account_map.full_account_map.root }}'
          - '{{ .settings.account_map.full_account_map.audit }}'
          - '{{ .settings.account_map.full_account_map.security }}'
          - '{{ .settings.account_map.full_account_map.network }}'
          - '{{ .settings.account_map.full_account_map.identity }}'
          - '{{ .settings.account_map.full_account_map.artifacts }}'
          - '{{ .settings.account_map.full_account_map.dev }}'
          - '{{ .settings.account_map.full_account_map.staging }}'
          - '{{ .settings.account_map.full_account_map.prod }}'

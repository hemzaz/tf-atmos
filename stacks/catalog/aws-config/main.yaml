---
# =============================================================================
# aws-config variants: the abstract a stack's aws-config instance inherits
# =============================================================================
# Each stack writes its own instance (Cloud Posse's name), inheriting the one
# variant that fits it:
#
#   components:
#     terraform:
#       aws-config:
#         metadata:
#           component: aws-config
#           inherits:
#             - aws-config/main
#
#   aws-config/main          the account's home stack (its global resource
#                            collector region): creates the recorder role.
#   aws-config/main-core-region
#                            a core account's US stack outside its home region
#                            (fnx-ue2-root, fnx-ue2-security), or a nonprod
#                            account's second stack: the role of its
#                            fnx-ue1-<stage> home stack by its convention ARN,
#                            since check-data-residency.py forbids an EU
#                            stack's dependency on a US one (IAM is global).
#                            Deploy the home stack first.
#   aws-config/main-core-region-eu
#                            a shared account's EU stack (fnx-ew1-root,
#                            fnx-ew1-audit, fnx-ec1-root, fnx-ec1-security):
#                            main-core-region (US home collector region, so
#                            regional types only, no second IAM recording)
#                            authorizing the EU aggregator (security,
#                            eu-west-1) instead of the US one (owner
#                            2026-11-13: EU Config data stays in the EU).
#   aws-config/security      fnx-ue1-security: main plus the US account
#                            aggregator, over the US regions only.
#
# A DR standby's variant, aws-config/main-region (the primary's role from its
# state), is in main-region.yaml, imported by the standby stacks only: its
# !terraform.state read resolves for every stack that imports it.
#
# Upstream's own read of the collector region's role (remote state of
# "aws-config-<region code>") is bypassed (remote-state_override.tf); these
# variants set iam_role_arn instead. fnx-ew1-security's variant, aws-config/security-eu
# (its own collector and the EU aggregator), is in security-eu.yaml.
# =============================================================================

import:
  - catalog/aws-config/defaults

components:
  terraform:
    aws-config/main:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/defaults
      vars:
        create_iam_role: true

    aws-config/main-core-region:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/defaults
      vars:
        # The home stack's recorder role: the null-label id of its
        # aws-config (<tenant>-ue1-<stage>-aws-config) plus Cloud Posse's
        # "config" attribute (cloudposse/config aws_config_label).
        iam_role_arn: &home_role 'arn:aws:iam::{{ .settings.environment.account_id }}:role/{{ .settings.context.tenant }}-ue1-{{ .settings.context.stage }}-aws-config-config'
        # That role's own sns:Publish names only its home (us-east-1) topic:
        # this region's topic grants it in its topic policy (E5b4b).
        allowed_iam_arns_for_sns_publish:
          - *home_role

    aws-config/main-core-region-eu:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/main-core-region
      vars:
        # The EU aggregator's region (fnx-ew1-security, security-eu.yaml):
        # the house authorization (aggregator-regions_house.tf) goes to
        # (central account, this region) in place of Cloud Posse's, to the
        # collector region, which stays the US home (no IAM recording here).
        # The recorder role stays the account's home one (IAM is global).
        aggregator_authorization_region: eu-west-1

    # OQ-B: the aggregator covers every account but prod-eu (whose data stays
    # in the EU: its aggregator is fnx-ew1-security's, security-eu.yaml), over
    # the US regions only (owner 2026-11-13): Cloud Posse hardcodes
    # all_regions, and an aggregator reads its own account's data in every
    # region, so aggregator_regions (aggregator-regions_house.tf) names them:
    # the regions a stack may take outside the EU (the scaffold's).
    # check-data-residency.py fails an eu- one or a missing non-EU recorder region.
    aws-config/security:
      metadata:
        component: aws-config
        type: abstract
        inherits:
          - aws-config/main
      vars:
        delegated_accounts:
          - '{{ .settings.account_map.full_account_map.root }}'
          - '{{ .settings.account_map.full_account_map.audit }}'
          - '{{ .settings.account_map.full_account_map.security }}'
          - '{{ .settings.account_map.full_account_map.network }}'
          - '{{ .settings.account_map.full_account_map.identity }}'
          - '{{ .settings.account_map.full_account_map.artifacts }}'
          - '{{ .settings.account_map.full_account_map.dev }}'
          - '{{ .settings.account_map.full_account_map.staging }}'
          - '{{ .settings.account_map.full_account_map.prod }}'
        aggregator_regions:
          - us-east-1
          - us-east-2
          - us-west-2

---
# Base Catalog Defaults
# Global vars shared by every stack that imports this file. Identity vars
# (tenant, account, environment, region) come from the org/account/stack files.
# The former `_base` abstract component was never inherited, so its tags now
# live in the global `vars.tags` (deep-merged into every component's tags).

vars:
  # Default feature flags that can be overridden per environment
  tags:
    Provisioner: "Atmos"
    Project: "tf-atmos"
settings:
  environment:
    default_tags_enabled: true
    encryption_enabled: true
    monitoring_enabled: true

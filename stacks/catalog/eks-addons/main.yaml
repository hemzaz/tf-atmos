---
# =============================================================================
# eks-addons/main in the nonprod stacks: eks/main's add-ons
# =============================================================================
# The load balancer controller, cluster-autoscaler, metrics-server,
# external-dns, cert-manager and Container Insights, each with its own IRSA
# role. external-dns and cert-manager may change records only in network/main's
# public zone; Container Insights logs on the stack's kms/main. A stack may set
# clusters.main.cert_manager_acme_server (orgs/fnx/<stage>/<region>/components/compute.yaml).
# The cluster endpoints are private, so plan/apply this from inside the VPC
# (see the eks-addons README).
# =============================================================================

import:
  - catalog/eks-addons/defaults

components:
  terraform:
    eks-addons/main:
      metadata:
        component: eks-addons
        inherits:
          - eks-addons
      vars:
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/main .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/main .eks_cluster_identity_oidc_issuer
        clusters:
          main:
            enable_aws_load_balancer_controller: true
            enable_cluster_autoscaler: true
            enable_metrics_server: true
            enable_external_dns: true
            enable_cert_manager: true
            # CloudWatch agent + Fluent Bit; log groups on kms/main
            enable_container_insights: true
            container_insights_kms_key_arn: !terraform.state kms/main .key_arn
            container_insights_log_retention_days: 7
            vpc_id: !terraform.state vpc/main .vpc_id
            # Public zones only; internal.* is private and stays out.
            dns_zone_ids: !terraform.state network/main '.zone_ids.main | [.]'
            cert_manager_letsencrypt_email: "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
      dependencies:
        components:
          - component: eks/main
          - component: vpc/main
          - component: network/main
          - component: kms/main

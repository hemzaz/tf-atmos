---
components:
  terraform:
    eks-addons:
      metadata:
        component: eks-addons
        type: abstract
        custom:
          version: "1.0.0"
          description: "EKS cluster addons and Kubernetes resources"
          category: "container-orchestration"
          namespace: "k8s"
      # Talks to the EKS API (kubernetes/helm providers), which is private
      # (cluster_endpoint_public_access: false), so GitHub-hosted runners
      # cannot reach it. runner: in-vpc puts its CI plans, CD deploys and
      # drift detection on the stack's self-hosted runners in the VPC
      # (github-runners; the label is the stack's full id unless
      # settings.github.runner_label says otherwise), which every eks instance
      # it depends on must admit (docs/OPERATIONS.md, "In-cluster components").
      # workflows/scripts/common/check-cluster-api-ci.py enforces this.
      settings:
        github:
          runner: in-vpc
      # Only variables the component declares. The add-on switches
      # (enable_aws_load_balancer_controller, enable_cluster_autoscaler,
      # enable_metrics_server, enable_external_dns, enable_cert_manager) and
      # their settings (vpc_id, dns_zone_ids, cert_manager_letsencrypt_email)
      # live under clusters.<key>, set per instance. Each switch installs its
      # chart and IRSA role (see the component README).
      vars:
        # Connection for the kubernetes/helm providers, and the default
        # cluster name and OIDC provider of each clusters entry; instances
        # read these from their eks instance's outputs.
        cluster_name: ""
        host: ""
        cluster_ca_certificate: ""
        oidc_provider_arn: ""
        oidc_provider_url: ""

        # Map of clusters with add-on switches, addons, Helm releases, and
        # Kubernetes manifests
        clusters: {}

        tags:
          Component: "EKS-Addons"
      # Instances declare the eks, vpc and dns instances they read.

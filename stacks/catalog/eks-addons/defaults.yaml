---
components:
  terraform:
    eks-addons:
      metadata:
        component: eks-addons
        type: abstract
        custom:
          version: "1.0.0"
          description: "EKS cluster addons and Kubernetes resources"
          category: "container-orchestration"
          namespace: "k8s"
      # Only variables the component declares. The add-on switches
      # (enable_aws_load_balancer_controller, enable_cluster_autoscaler, ...)
      # and the rest of each cluster's settings live under clusters.<cluster
      # name>, set per instance; top-level copies of them were undeclared and
      # reached nothing.
      vars:
        # Connection for the kubernetes/helm providers; instances read these
        # from their eks instance's outputs.
        cluster_name: ""
        host: ""
        cluster_ca_certificate: ""
        oidc_provider_arn: ""
        oidc_provider_url: ""

        # Map of clusters with addons, Helm releases, and Kubernetes manifests
        clusters: {}

        tags:
          Component: "EKS-Addons"
      # Instances declare the eks instance they read (e.g. eks/main).

---
# =============================================================================
# inspector2/main in every environment stack: Inspector
# =============================================================================
# The catalog defaults as they are (inspector2/defaults). Nonprod, the prod
# primaries and the DR standbys all import this file, so a change here changes
# the DR standbys too; a stack that differs sets vars in its own file.
# =============================================================================

import:
  - catalog/inspector2/defaults

components:
  terraform:
    # ==========================================================================
    # Amazon Inspector - owns the enabler (security-monitoring only routes its
    # findings). Off, as in the catalog: Inspector bills per resource scanned.
    # ==========================================================================
    inspector2/main:
      metadata:
        component: inspector2
        inherits:
          - inspector2/defaults

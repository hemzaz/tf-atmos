---
# =============================================================================
# ec2/bastion in the nonprod stacks: the operator path into the private clusters
# =============================================================================
# The bastion's wiring: a private subnet of vpc/main and its generated SSH key
# on the stack's kms/main. Each stack keeps its tags, volume settings and
# ingress/egress rules (the stack file, orgs/fnx/<stage>/<region>.yaml).
# =============================================================================

import:
  - catalog/ec2/defaults

components:
  terraform:
    ec2/bastion:
      metadata:
        component: ec2
        inherits:
          - ec2
      vars:
        name: bastion
        vpc_id: !terraform.state vpc/main .vpc_id
        instance_type: "t3.small"
        # No ssh_key_pair: the component generates the bastion's key (catalog
        # defaults) and stores the private key in Secrets Manager, encrypted
        # with kms/main. app-server launches with it.
        ssh_key_secret_kms_key_id: !terraform.state kms/main .key_arn
        # A private subnet, as in prod: the SSM agent reaches SSM through the
        # NAT gateway. In a public subnet the bastion gets no public IP
        # (map_public_ip_on_launch and associate_public_ip_address are off) and
        # the VPC has no SSM endpoints, so it could not register with SSM.
        subnet: !terraform.state vpc/main .private_subnet_ids[0]
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main

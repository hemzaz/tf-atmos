---
components:
  terraform:
    ec2:
      metadata:
        component: ec2
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages EC2 instances and SSH keys"
          category: "compute"
      vars:
        environment: "{{ .settings.context.environment }}"
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # SSH key configuration
        create_ssh_keys: true
        store_ssh_keys_in_secrets_manager: true
        ssh_key_algorithm: "RSA"
        ssh_key_rsa_bits: 4096

        # Global SSH key for environment-wide use
        global_key_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-ssh-key"

        # Instances configuration
        instances: {}

        tags:
          Component: "EC2"
      dependencies:
        components:
          - component: vpc/main

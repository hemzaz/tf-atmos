---
components:
  terraform:
    ec2:
      metadata:
        component: ec2
        type: abstract
        custom:
          version: "2.0.0"
          description: "Manages one EC2 instance per component instance"
          category: "compute"
      vars:
        # The lifecycle tier the component validates (dev/staging/prod).
        # context.environment is the instance name (`testenv-01`) and fails it.
        environment: "{{ .settings.context.stage }}"
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # SSH key configuration: an ED25519 key pair is generated per instance
        # (named after it, private key in Secrets Manager at
        # ssh-key/<Environment>/<name>) unless the instance sets `ssh_key_pair`
        # to an existing one. No shared "global" key: with one instance per
        # component, every instance in a stack would create the same key pair
        # and secret.
        create_ssh_keys: true
        store_ssh_keys_in_secrets_manager: true
        ssh_key_algorithm: "ED25519"

        tags:
          Component: "EC2"
      dependencies:
        components:
          - component: vpc/main

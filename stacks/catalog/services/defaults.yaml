---
components:
  terraform:
    api_gateway:
      metadata:
        component: api_gateway
        type: abstract
      vars:
        enabled: true
        name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
        description: "API Gateway for {{ .settings.context.environment }} environment"
        endpoint_type: "REGIONAL"

        tags:
          Component: "API Gateway"
    load_balancer:
      metadata:
        component: load_balancer
        type: abstract
      vars:
        enabled: true
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .public_subnet_ids
        name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-alb"
        internal: false

        tags:
          Component: "Load Balancer"
    cloudfront:
      metadata:
        component: cloudfront
        type: abstract
      vars:
        enabled: true
        comment: "{{ .settings.context.tenant }}-{{ .settings.context.environment }} CloudFront distribution"
        default_cache_behavior:
          allowed_methods:
            - "GET"
            - "HEAD"
          cached_methods:
            - "GET"
            - "HEAD"
          target_origin_id: "default"
          viewer_protocol_policy: "redirect-to-https"
          min_ttl: 0
          default_ttl: 3600
          max_ttl: 86400

        tags:
          Component: "CloudFront"
    ec2:
      metadata:
        component: ec2
        type: abstract
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # SSH Key Management Configuration
        create_ssh_keys: true
        store_ssh_keys_in_secrets_manager: true
        ssh_key_algorithm: "ED25519"

        # One instance per component instance. A key pair is generated per
        # instance unless the instance names an existing one in `ssh_key_pair`;
        # `ami` empty resolves the latest Amazon Linux 2.

        tags:
          Component: "EC2"

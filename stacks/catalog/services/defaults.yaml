---
components:
  terraform:
    api_gateway:
      metadata:
        component: api_gateway
        type: abstract
      vars:
        enabled: true
        name: "{{ .vars.tenant }}-{{ .vars.environment }}-api"
        description: "API Gateway for {{ .vars.environment }} environment"
        endpoint_type: "REGIONAL"

        tags:
          Component: "API Gateway"
    load_balancer:
      metadata:
        component: load_balancer
        type: abstract
      vars:
        enabled: true
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .public_subnet_ids
        name: "{{ .vars.tenant }}-{{ .vars.environment }}-alb"
        internal: false

        tags:
          Component: "Load Balancer"
    cloudfront:
      metadata:
        component: cloudfront
        type: abstract
      vars:
        enabled: true
        comment: "{{ .vars.tenant }}-{{ .vars.environment }} CloudFront distribution"
        default_cache_behavior:
          allowed_methods:
            - "GET"
            - "HEAD"
          cached_methods:
            - "GET"
            - "HEAD"
          target_origin_id: "default"
          viewer_protocol_policy: "redirect-to-https"
          min_ttl: 0
          default_ttl: 3600
          max_ttl: 86400

        tags:
          Component: "CloudFront"
    ec2:
      metadata:
        component: ec2
        type: abstract
      vars:
        enabled: true
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # SSH Key Management Configuration
        create_ssh_keys: true
        store_ssh_keys_in_secrets_manager: true
        ssh_key_algorithm: "RSA"
        ssh_key_rsa_bits: 4096

        # Optional: Define a global key for the environment
        # global_key_name: "{{ .vars.environment }}-shared-key" # Uncomment to use a global key

        # Optional: Use an existing key as default
        # default_key_name: "existing-key-name" # Uncomment to use an existing key

        # Default configuration for a secure EC2 deployment
        default_ami_id: ""  # Will be selected based on data source if not specified
        instances: {}  # Will be defined in environment-specific configuration

        tags:
          Component: "EC2"

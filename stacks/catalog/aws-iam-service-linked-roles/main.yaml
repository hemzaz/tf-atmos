---
# =============================================================================
# aws-iam-service-linked-roles in an account's first stack
# =============================================================================
# The catalog defaults as they are: the account's service-linked roles.
# Imported by the stack that owns its account's singletons (fnx-ue1-dev,
# fnx-ue1-staging, the prod primaries); a DR standby or an account's other
# region imports none (check-lane-names.py allows each role once per account).
# =============================================================================

import:
  - catalog/aws-iam-service-linked-roles/defaults

components:
  terraform:
    aws-iam-service-linked-roles:
      metadata:
        component: aws-iam-service-linked-roles
        inherits:
          - aws-iam-service-linked-roles/defaults

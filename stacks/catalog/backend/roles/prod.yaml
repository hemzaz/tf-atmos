---
# The prod access roles of a backend whose bucket holds prod state
# (catalog/backend/defaults has the key layout and the stage table).
# fnx-ue1-root (US prod) and fnx-ew1-root (EU prod, fnx-ew1-prod) import it.
import:
  - catalog/backend/defaults

components:
  terraform:
    backend:
      vars:
        access_roles:
          prod_read:
            role_name: "{{ .settings.tfstate.role_prefix }}-prod-read-role"
            write_enabled: false
            object_key_patterns: []
          prod_write:
            role_name: "{{ .settings.tfstate.role_prefix }}-prod-role"
            write_enabled: true
            object_key_patterns: []

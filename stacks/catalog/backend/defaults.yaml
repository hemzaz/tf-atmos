---
components:
  terraform:
    backend:
      metadata:
        component: backend
        type: abstract
      vars:
        enabled: true
        bucket_name: "{{ .vars.tenant }}-terraform-state"
        dynamodb_table_name: "{{ .vars.tenant }}-terraform-locks"
        state_file_key: "{{ .vars.environment }}/{{ .atmos_component }}/terraform.tfstate"
        iam_role_name: "{{ .vars.tenant }}-terraform-backend-role"
        iam_role_arn: "arn:aws:iam::{{ .vars.management_account_id }}:role/{{ .vars.tenant }}-terraform-backend-role"

---
# A Terraform state backend (bucket, KMS key, access roles), deployed as
# backend/main in a management-account root stack: fnx-ue1-root
# (stacks/orgs/fnx/root/us-east-1.yaml) for the US stacks, fnx-ew1-root
# (stacks/orgs/fnx/root/eu-west-1.yaml) for the EU stacks (GDPR residency).
# Workload stacks never create one.
#
# This file holds what every backend has: its own state's root_write role.
# The stage roles come from catalog/backend/roles/nonprod (read, write) and
# catalog/backend/roles/prod (prod_read, prod_write), each imported by a root
# stack whose bucket holds that stage's state.
components:
  terraform:
    backend:
      metadata:
        component: backend
        type: abstract
      vars:
        tenant: "{{ .settings.context.tenant }}"
        account_id: "{{ .settings.environment.account_id }}"
        # The bucket and role names come from settings.tfstate
        # (stacks/orgs/fnx/_defaults.yaml), the same values every stack's
        # terraform.backend reads, so the backend and its readers agree.
        bucket_name: "{{ .settings.tfstate.bucket }}"
        # Cloud Posse tfstate-backend access_roles. The role names are what
        # stacks/orgs/fnx/_defaults.yaml assumes (terraform.backend.s3.assume_role);
        # the allowed principals and the state each role reaches
        # (object_key_patterns) are set on the instance, next to each other
        # (stacks/orgs/fnx/root/us-east-1.yaml).
        #
        # Reads AND writes are split by stage within a bucket. State keys
        # are "<workspace_key_prefix>/<workspace>/terraform.tfstate" (+ ".tflock"):
        # Atmos sets workspace_key_prefix to the component (iam, eks, ...) and
        # the workspace to the stack name, with "-<instance>" appended for a
        # derived instance (e.g. fnx-ue1-prod-iam-ci). Each stack gets
        # an exact pair, "*/<stack>/*" (its own workspace) and "*/<stack>-*"
        # (its derived instances), on its stage's roles only. The pair does not
        # depend on where the stage sits in the stack name, so it holds under
        # any name_template. S3's "*" also spans "/". check-state-keys.py
        # (validate-all, lint) evaluates these patterns against every state
        # key and fails a key that no role, or another stage's role, matches,
        # and a role that matches no state key:
        # a new stack needs its pair on the instance before its first init.
        # object_key_patterns is [] here, not the component's ["*"] default:
        # a role the instance forgets fails the plan (the variable requires a
        # non-empty list) instead of reaching every stack's state.
        #
        #   stage        read (TFSTATE_ACCESS=read)  write (TFSTATE_ACCESS unset)
        #   dev/staging  read                        write
        #   prod         prod_read                   prod_write
        #   root         root_write                  root_write
        access_roles:
          # The backend's own state (its root stack). No allowed_principal_arns:
          # only the administrator applying backend/main (the caller, always
          # trusted) may assume it; no CI role can read or write root state.
          root_write:
            role_name: "{{ .settings.tfstate.role_prefix }}-root-role"
            write_enabled: true
            object_key_patterns: []

---
components:
  terraform:
    securitygroup:
      metadata:
        component: securitygroup
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages security groups"
          category: "networking"
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id

        # One group per entry; instances set their own.
        security_groups: {}

        tags:
          Component: "SecurityGroup"
      dependencies:
        components:
          - component: vpc/main

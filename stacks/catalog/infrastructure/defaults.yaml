---
components:
  terraform:
    rds:
      metadata:
        component: rds
        type: abstract
        custom:
          version: "1.0.0"
          description: "RDS database instances configuration"
          category: "databases"
      vars:
        enabled: true
        identifier: "{{ .vars.tenant }}-{{ .vars.account }}-{{ .vars.environment }}-db"
        engine: "{{ .vars.rds_engine | default \"postgres\" }}"
        engine_version: "{{ .vars.rds_engine_version | default \"14\" }}"
        instance_class: "db.t3.micro"
        allocated_storage: 20
        max_allocated_storage: 100
        db_name: "app"
        username: "dbadmin"
        port: 5432

        # High availability settings based on environment type
        backup_retention_period: 7
        backup_window: "03:00-04:00"
        maintenance_window: "sun:04:30-sun:05:30"

        # Security settings
        deletion_protection: false
        skip_final_snapshot: "{{ not .vars.is_production }}"
        final_snapshot_identifier: "{{ .vars.tenant }}-{{ .vars.account }}-{{ .vars.environment }}-db-final"
        storage_encrypted: true

        # Network settings
        subnet_ids: !terraform.state vpc/main .database_subnet_ids // .private_subnet_ids
        vpc_security_group_ids: [!terraform.state securitygroup .database_security_group_id]
        tags:
          Component: "RDS"
      dependencies:
        components:
          - component: vpc/main

---
# =============================================================================
# config-bucket in fnx-ew1-audit: the EU AWS Config archive
# =============================================================================
# The key admits the recorders of prod-eu and of the shared accounts that have
# an eu-west-1 stack (root, audit, security: owner decision 2026-11-03, E5a
# OQ4), whose eu-west-1 configuration data stays in the EU. Every other
# account delivers to the US bucket (main.yaml). A literal 12-digit account here
# is invisible to check-data-residency.py: the list stays templated from
# settings.account_map. One list (the &residency anchor) feeds the key's
# config_source_accounts and the bucket policy's residency_account_ids
# (E5a4b); the preflight (check-first-deploy-inputs.py) fails a difference.
# =============================================================================

import:
  - catalog/aws-config-bucket/defaults

components:
  terraform:
    kms/config-bucket:
      metadata:
        component: kms
        inherits:
          - kms/config-bucket/defaults
      vars:
        config_source_accounts: &residency
          - '{{ index .settings.account_map.full_account_map "prod-eu" }}'
          - '{{ .settings.account_map.full_account_map.root }}'
          - '{{ .settings.account_map.full_account_map.audit }}'
          - '{{ .settings.account_map.full_account_map.security }}'

    config-bucket:
      metadata:
        component: aws-config-bucket
        inherits:
          - config-bucket/defaults
      vars:
        kms_master_key_arn: !terraform.state kms/config-bucket .key_arn
        residency_account_ids: *residency
      dependencies:
        components:
          - component: kms/config-bucket

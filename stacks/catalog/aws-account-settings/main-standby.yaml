---
# =============================================================================
# aws-account-settings in an account's other regions
# =============================================================================
# A stack in the same account as one that imports main.yaml (the prod DR
# standbys, a nonprod stack with account_singletons=no, the management
# account's EU stack): this region's settings only. The IAM account alias and
# the S3 account public access block are account-wide and belong to that
# stack (check-lane-names.py allows each once per account).
# =============================================================================

import:
  - catalog/aws-account-settings/defaults

components:
  terraform:
    aws-account-settings:
      metadata:
        component: aws-account-settings
        inherits:
          - aws-account-settings/defaults
      vars:
        account_alias_enabled: false
        s3_block_public_access_enabled: false

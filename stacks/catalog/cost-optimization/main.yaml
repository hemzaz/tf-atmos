---
# =============================================================================
# cost-optimization/main in the nonprod and US prod primary stacks
# =============================================================================
# Instance scheduler, Savings Plan/RI analyzer, resource cleanup, cost anomaly
# detection and the monthly budget, with the budget limit and the recipients
# taken from the stack's settings.environment.monitoring. The scheduler only
# where the stage's settings turn auto_shutdown on: prod's turn it off
# (components/terraform/cost-optimization/main.tf), so a prod stack gets no
# scheduler Lambda, role or schedule. A change here changes prod.
#
# Per stack, in the stack file: a DR primary's
# budget_additional_environment_tags (its standby shares the account and has
# no budget of its own; dr-pair.py --lint fails a standby missing there). The
# EU (GDPR) primaries' shape is main-prod-eu.yaml.
# =============================================================================

import:
  - catalog/cost-optimization/defaults

components:
  terraform:
    cost-optimization/main:
      metadata:
        component: cost-optimization
        inherits:
          - cost-optimization/defaults
      vars:
        monthly_budget_limit: "{{ .settings.environment.monitoring.budget_monthly_limit }}"
        budget_notification_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"
        cost_anomaly_notification_email: "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        cost_alert_emails:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.warning_alerts 0 }}"

---
##################################################
# Catalog Configuration for Cost Optimization
##################################################
# One instance per stack (Instance Scheduler, Savings Plan/RI analyzer and
# resource cleanup Lambdas, cost anomaly detection, a monthly budget).
# Instances inherit this base and set `monthly_budget_limit`,
# `budget_notification_emails`, `cost_anomaly_notification_email` and
# `cost_alert_emails` from settings.environment.monitoring.

components:
  terraform:
    cost-optimization/defaults:
      metadata:
        component: cost-optimization
        type: abstract
      # kms_key_arn reads kms/main, so the key is applied first.
      # workflows/scripts/common/check-dependencies.py enforces that every
      # component read via !terraform.state is declared here.
      dependencies:
        components:
          - component: kms/main
      vars:
        name: main
        # Every stack runs a kms/main instance (catalog/kms/defaults) with
        # allow_cloudwatch_logs on, so this resolves everywhere for the
        # Lambda functions' log groups. The cost-alerts SNS topic is also
        # encrypted with this key: publishing to it works two ways -
        # cloudwatch.amazonaws.com (the three *_errors alarms) relies on
        # kms/main's allow_cloudwatch_alarms flag (also on in
        # catalog/kms/defaults.yaml), while the savings-analyzer/cleanup
        # Lambda roles get their own scoped grant instead (iam.tf).
        kms_key_arn: !terraform.state kms/main .key_arn
        # The lifecycle tier (dev/staging/prod), NOT the real per-stack
        # environment name: selects the per-stage schedule/auto-shutdown
        # settings (components/terraform/cost-optimization/main.tf).
        environment: "{{ .settings.context.stage }}"
        cleanup_dry_run: "true"
        tags:
          Component: "CostOptimization"

---
# =============================================================================
# secretsmanager/infra in a nonprod stack: infrastructure secrets
# =============================================================================
# Each stack keeps its secrets map and its recovery window. infra-dev.yaml is
# the same instance for a stack that feeds a static_value secret through the
# ephemeral secret_data variable.
# =============================================================================

import:
  - catalog/secretsmanager/defaults

components:
  terraform:
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        context_name: "infra"

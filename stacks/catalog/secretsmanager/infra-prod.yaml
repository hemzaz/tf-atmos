---
# =============================================================================
# secretsmanager/infra in a prod primary stack: the prod infrastructure secrets
# =============================================================================
# The secret set is catalog/secretsmanager/prod's (secretsmanager/infra-prod-defaults),
# shared by the prod primary stacks. Replicated to the stack's DR region only
# (settings.dr.region: us-east-2 for the US primary, eu-central-1 for the
# EU one) on kms/main's replica key there, so the DR standby's
# external-secrets stores read the same names during an outage of the primary
# region (promote a replica to write it). An EU stack's DR region is an EU one:
# the values never leave the EU (check-data-residency.py checks
# replica_regions). A stack without settings.dr.region fails to render.
# =============================================================================

import:
  - catalog/secretsmanager/prod

components:
  terraform:
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-prod-defaults
      vars:
        replica_regions:
          - region: '{{ required "settings.dr.region (the DR region of a prod primary stack) is not set" .settings.dr.region }}'
            kms_key_id: !terraform.state kms/main '.replica_keys["{{ required "settings.dr.region (the DR region of a prod primary stack) is not set" .settings.dr.region }}"].key_arn'

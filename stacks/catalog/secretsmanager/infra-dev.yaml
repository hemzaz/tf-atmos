---
# =============================================================================
# secretsmanager/infra in a nonprod stack with a static_value secret
# =============================================================================
# infra.yaml's instance plus the env that carries the ephemeral secret_data
# variable for the istio_certificates secret. The stack keeps its secrets map.
# =============================================================================

import:
  - catalog/secretsmanager/defaults

components:
  terraform:
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-defaults
      vars:
        context_name: "infra"
      # secret_data is ephemeral, so it travels in TF_VAR_secret_data, not
      # vars: Terraform needs an ephemeral value set at plan again when the
      # saved plan is applied, and `deploy --from-plan` applies the planfile
      # without the varfile. Atmos exports `env` to every terraform command.
      # This value is only a reference to an SSM path. A real secret goes in
      # that instance's own `env:` entry in the stack file, never in this
      # shared reference value, e.g.
      # `TF_VAR_secret_data: !env FNX_DEV_INFRA_SECRET_DATA`, and never as a
      # global TF_VAR_secret_data (see the component README).
      env:
        TF_VAR_secret_data: >-
          {"istio_certificates": "{\"tls.crt_ssm_parameter\": \"/fnx/certificates/example.com-wildcard/cert\", \"reference_only\": \"true\"}"}

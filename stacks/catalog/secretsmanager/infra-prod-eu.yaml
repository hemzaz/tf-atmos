---
# =============================================================================
# secretsmanager/infra in an EU prod primary stack: the prod infrastructure secrets
# =============================================================================
# The secret set is catalog/secretsmanager/prod's (secretsmanager/infra-prod),
# shared by the prod primary stacks. Replicated to the EU DR region only
# (eu-central-1, fnx-ec1-prod) on kms/main's replica key there: the values
# never leave the EU (check-data-residency.py checks replica_regions), and the
# DR standby's external-secrets stores read the same names during an
# eu-west-1 outage. A US stack uses infra-prod.yaml.
# =============================================================================

import:
  - catalog/secretsmanager/prod

components:
  terraform:
    secretsmanager/infra:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/infra-prod
      vars:
        replica_regions:
          - region: eu-central-1
            kms_key_id: !terraform.state kms/main '.replica_keys["eu-central-1"].key_arn'

---
# =============================================================================
# awsconfig/main in the nonprod and prod primary stacks: the Config recorder
# =============================================================================
# Records this region's resources and the account's global ones (IAM), with
# the stack's own kms/main key.
# =============================================================================

import:
  - catalog/awsconfig/defaults

components:
  terraform:
    # ==========================================================================
    # AWS Config - the recorder Security Hub's FSBP/CIS controls evaluate on.
    # ==========================================================================
    awsconfig/main:
      metadata:
        component: awsconfig
        inherits:
          - awsconfig/defaults
      vars:
        kms_key_arn: !terraform.state kms/main .key_arn
      dependencies:
        components:
          - component: kms/main

---
import:
  - catalog/_base/defaults

components:
  terraform:
    vpc/defaults:
      metadata:
        # Abstract components can't be provisioned and serve as base components (blueprints) for real components
        component: vpc
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages VPC with subnets, NAT gateways, and routing"
          category: "networking"
      vars:
        ipv4_primary_cidr_block: "10.0.0.0/16"

        # Availability zones - will be overridden per region
        availability_zones:
          - "{{ .vars.region }}a"
          - "{{ .vars.region }}b"
          - "{{ .vars.region }}c"

        # Subnet configuration
        private_subnets:
          - "10.0.1.0/24"
          - "10.0.2.0/24"
          - "10.0.3.0/24"
        public_subnets:
          - "10.0.101.0/24"
          - "10.0.102.0/24"
          - "10.0.103.0/24"
        database_subnets: []

        # NAT Gateway configuration
        nat_gateway_enabled: true
        nat_gateway_strategy: "single"  # "single" or "one_per_az"

        # VPN/Transit Gateway (disabled by default)
        enable_vpn_gateway: false
        enable_transit_gateway: false
        transit_gateway_id: ""
        ram_resource_share_arn: ""

        # VPC Flow Logs
        vpc_flow_logs_enabled: true
        # flow_logs_kms_key_arn is NOT set here: this abstract component is
        # inherited by every vpc/main and vpc/services instance, including
        # the LocalEmu lane (fnx-local-localemu), which has no kms/main
        # instance at all. Atmos resolves deferred `!terraform.state`
        # functions inherited from an abstract component even when an
        # instance overrides the resulting var with a literal, so a
        # catalog-level default here breaks any stack without kms/main. Set
        # `flow_logs_kms_key_arn: !terraform.state kms/main .key_arn` (plus
        # the matching `dependencies.components` entry) per instance, only in
        # stacks that actually declare kms/main.

        # Default security group configuration
        default_sg_ingress_self_only: true
        default_sg_egress_self_only: true
        default_sg_allow_all_outbound: false


        tags:
          Component: "VPC"
          NetworkTier: "core"

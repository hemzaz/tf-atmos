---
# =============================================================================
# backup/main in the prod primary stacks: the region's vault, plans and copies
# =============================================================================
# The production retention and notifications (catalog/backup/prod: 7-year
# monthly retention for SOX, the prod accounts' pci-sox compliance tag), on the
# stack's own kms/main key. Every recovery point is also copied to the stack's
# DR region (owner decision Q5; settings.dr.region: us-east-2 for the US
# primary, eu-central-1 for the EU one): vault <Environment>-backup-replica
# there, on kms/main's replica key, kept as long as the source point (Cloud
# Posse aws-backup's copy_action destination_vault_arn). An EU stack's DR
# region is an EU one: check-data-residency.py fails a non-EU replica_region
# or key. The DR standby's backup/main (main-standby.yaml) is that region's
# own vault and plans. Vault lock stays off. A stack without
# settings.dr.region fails to render.
# =============================================================================

import:
  - catalog/backup/prod

components:
  terraform:
    # ==========================================================================
    # AWS Backup - vault, plans and tag-based selection for rds/main,
    # rds/data (Backup=true in their catalog/rds files' vars.tags) and any
    # EC2/EBS resource tagged the same way.
    # ==========================================================================
    backup/main:
      metadata:
        component: backup
        inherits:
          - backup/prod
      vars:
        kms_key_arn: !terraform.state kms/main .key_arn
        enable_cross_region_backup: true
        replica_region: '{{ required "settings.dr.region (the DR region of a prod primary stack) is not set" .settings.dr.region }}'
        replica_kms_key_arn: !terraform.state kms/main '.replica_keys["{{ required "settings.dr.region (the DR region of a prod primary stack) is not set" .settings.dr.region }}"].key_arn'
      dependencies:
        components:
          - component: kms/main

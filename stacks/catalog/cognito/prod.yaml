---
import:
  - catalog/cognito/defaults

# Production pool settings, shared by each prod primary's cognito/main and
# its DR standby's copy (owner decision 2026-10-07), in the US and the EU
# pair alike: the user-migration trigger copies a user's
# attributes from one pool into the other, so their schema, sign-in
# attributes, password policy and MFA must not drift apart. MFA is
# mandatory rather than opt-in, and the pool cannot be deleted while it holds
# real users (check-prod-protection.py). The api client is per instance: the
# DR standbys' pools (main-standby.yaml) add the admin password flow user
# migration needs.
components:
  terraform:
    cognito/prod:
      metadata:
        component: cognito
        type: abstract
        inherits:
          - cognito/defaults
      vars:
        mfa_configuration: "ON"
        deletion_protection: true

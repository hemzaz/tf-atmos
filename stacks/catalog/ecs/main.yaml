---
# =============================================================================
# ecs/main: the Fargate cluster for the main apps
# =============================================================================
# Shared by dev, staging and the prod primary with the data plane: a change
# here changes prod. Was
# infrastructure/main.ecs. vpc_id/subnet_ids are not passed: an
# aws_ecs_cluster has neither - those belong to ECS services, which this
# component does not manage. Each stack keeps its cluster name and any
# Container Insights setting (the stack file, orgs/fnx/<stage>/<region>.yaml).
# =============================================================================

components:
  terraform:
    ecs/main:
      metadata:
        component: ecs
      vars:
        fargate_only: true
      dependencies:
        components:
          - component: vpc/main

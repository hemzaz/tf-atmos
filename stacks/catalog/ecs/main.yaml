---
# =============================================================================
# ecs/main in the nonprod stacks: the Fargate cluster for the main apps
# =============================================================================
# Was infrastructure/main.ecs. vpc_id/subnet_ids are not passed: an
# aws_ecs_cluster has neither - those belong to ECS services, which this
# component does not manage. Each stack keeps its cluster name and Container
# Insights setting (orgs/fnx/<stage>/<region>/components/services.yaml).
# =============================================================================

components:
  terraform:
    ecs/main:
      metadata:
        component: ecs
      vars:
        fargate_only: true
      dependencies:
        components:
          - component: vpc/main

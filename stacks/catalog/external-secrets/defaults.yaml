---
##################################################
# Catalog Configuration for External Secrets
##################################################
# Instances set cluster_name/host/cluster_ca_certificate/oidc_provider_* from
# the matching EKS instance via !terraform.state.

components:
  terraform:
    external-secrets/defaults:
      metadata:
        component: external-secrets
        type: abstract
      # Talks to the private EKS API: CI/CD/drift run it on the in-VPC runners
      # (see catalog/eks-addons/defaults.yaml).
      settings:
        github:
          runner: in-vpc
      dependencies:
        # The helm provider's exec plugin runs `aws eks get-token`; the atmos
        # image has no aws CLI (check-cluster-api-ci.py checks the tools).
        tools:
          aws/aws-cli: "2.36.49"
      vars:
        enabled: true

        namespace: "external-secrets"
        create_namespace: true
        service_account_name: "external-secrets"
        # The one pin for every instance. 2.11 is tested on Kubernetes 1.36
        # (external-secrets.io stability-support) and serves only
        # external-secrets.io/v1.
        chart_version: "2.11.0"
        # Each store has its own IRSA role and must name the namespaces that
        # may use it: instances set allowed_namespaces for aws-secretsmanager.
        create_default_cluster_secret_store: true
        create_certificate_secret_store: true
        # eks-addons' Istio gateway certificate ExternalSecret.
        certificate_allowed_namespaces: ["istio-ingress"]

        # Each instance sets kms_key_arn (no local reads in an abstract: CLAUDE.md).

        tags:
          Component: "external-secrets"
          Team: "platform"

---
##################################################
# Catalog Configuration for External Secrets
##################################################
# Instances set cluster_name/host/cluster_ca_certificate/oidc_provider_* from
# the matching EKS instance via !terraform.state.

components:
  terraform:
    external-secrets/defaults:
      metadata:
        component: external-secrets
        type: abstract
      vars:
        enabled: true

        # Optional settings with defaults
        namespace:
          name: "external-secrets"
          create: true
        serviceaccount:
          name: "external-secrets"
        helm:
          chart_version: "0.9.9"
        certificate_store:
          path_template: "certificates/{name}"
        secret_stores:
          default_cluster:
            create: true
          certificate:
            create: true

        tags:
          Component: "external-secrets"
          Team: "platform"

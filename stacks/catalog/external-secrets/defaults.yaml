---
##################################################
# Catalog Configuration for External Secrets
##################################################
# Instances set cluster_name/host/cluster_ca_certificate/oidc_provider_* from
# the matching EKS instance via !terraform.state.

components:
  terraform:
    external-secrets/defaults:
      metadata:
        component: external-secrets
        type: abstract
      # Talks to the private EKS API: off hosted-runner CI/CD/drift, applied
      # from inside the VPC (see catalog/eks-addons/defaults.yaml).
      settings:
        github:
          actions_enabled: false
      # kms_key_arn below reads kms/main, so the key must be applied first.
      # workflows/scripts/common/check-dependencies.py enforces that every
      # component read via !terraform.state is declared here.
      dependencies:
        components:
          - component: kms/main
      vars:
        enabled: true

        namespace: "external-secrets"
        create_namespace: true
        service_account_name: "external-secrets"
        # The one pin for every instance. 2.11 is tested on Kubernetes 1.36
        # (external-secrets.io stability-support) and serves only
        # external-secrets.io/v1.
        chart_version: "2.11.0"
        # Each store has its own IRSA role and must name the namespaces that
        # may use it: instances set allowed_namespaces for aws-secretsmanager.
        create_default_cluster_secret_store: true
        create_certificate_secret_store: true
        # eks-addons' Istio gateway certificate ExternalSecret.
        certificate_allowed_namespaces: ["istio-ingress"]

        # The same per-stack customer-managed key secretsmanager/defaults uses
        # as default_kms_key_id: every environment runs a kms/main instance
        # (catalog/kms/defaults), so this resolves in all stacks.
        kms_key_arn: !terraform.state kms/main .key_arn

        # Scopes the one-level-nested secret/parameter match to this stack's
        # own context instead of a depth-agnostic "*/<prefix>/*" wildcard.
        # settings.environment.stage is the descriptive stage name each
        # stack's security.yaml already hardcodes as the leading segment of
        # its secretsmanager/app and secretsmanager/infra context_name
        # ("production/app", "staging/infra", plain "app"/"infra" in dev
        # where there's no stage prefix to match). Note this is NOT the same
        # as Atmos's own settings.context.stage (the short stage folder name,
        # e.g. "prod"), which secretsmanager/defaults uses for its
        # "environment" var, a *different* segment of full_path.
        secret_path_context_prefixes:
          - "{{ .settings.environment.stage }}"

        tags:
          Component: "external-secrets"
          Team: "platform"

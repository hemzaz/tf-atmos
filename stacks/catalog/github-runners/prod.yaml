---
import:
  - catalog/github-runners/defaults

# The production in-VPC runner pool, shared by fnx-ue1-prod's and
# fnx-ew1-prod's github-runners/main: vpc/main's private subnets, labelled
# with the stack's full id, registered just in time with the owner's GitHub
# App (settings.github_app; docs/OPERATIONS.md, "First-deploy inputs", GitHub
# App). CI runs the in-cluster instances (settings.github.runner: in-vpc) on
# them and starts the pool in its own region (vars.region, ci-components.py
# --pools).
components:
  terraform:
    github-runners/prod:
      metadata:
        component: github-runners
        type: abstract
        inherits:
          - github-runners/defaults
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        # Alarms to the stack's monitoring/main topic, <Environment>-main-alarms,
        # named rather than read: monitoring deploys in the last layer, this
        # pool in connectivity (kms/main lets CloudWatch alarms publish to it).
        # monitoring names it from tags.Environment, this ARN from
        # settings.prefix: it relies on tags.Environment staying settings.prefix
        # (stacks/orgs/fnx/_defaults.yaml).
        alarm_sns_topic_arns:
          - "arn:aws:sns:{{ .vars.region }}:{{ .settings.environment.account_id }}:{{ .settings.prefix }}-main-alarms"
      dependencies:
        components:
          - component: kms/main
          - component: vpc/main

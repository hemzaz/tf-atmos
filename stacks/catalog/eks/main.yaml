---
# =============================================================================
# eks/main in the nonprod stacks: the application cluster
# =============================================================================
# The cluster's wiring: vpc/main's private subnets, the operator's and the CI
# runners' paths to the private endpoint, secrets and node volumes on the
# stack's kms/main, and the monitoring node group. Each stack keeps its
# endpoint access, log types, tags and the workers group's sizes
# (orgs/fnx/<stage>/<region>/components/compute.yaml).
# =============================================================================

import:
  - catalog/eks/defaults

components:
  terraform:
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        name: main
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        # The operator's path to the private endpoint (docs/OPERATIONS.md,
        # "In-cluster components"): TCP 443 on the cluster security group from
        # the bastion's own security group, whose SSM port-forward carries it.
        allowed_security_group_ids:
          - !terraform.state ec2/bastion .security_group_id
          # The stack's in-VPC CI runners (github-runners/main), for the in-cluster instances.
          - !terraform.state github-runners/main .security_group_id
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
        cluster_endpoint_private_access: true
        # Prod already used kms/main for secrets; nonprod matches so the
        # component's own per-cluster key is never created here either.
        cluster_encryption_config_kms_key_id: !terraform.state kms/main .key_arn
        node_group_ebs_kms_key_id: !terraform.state kms/main .key_arn
        node_groups:
          workers:
            instance_types: ["t3.medium"]
            kubernetes_labels:
              role: worker
          monitoring:
            instance_types: ["t3.large"]
            desired_group_size: 1
            min_group_size: 1
            max_group_size: 2
            kubernetes_labels:
              role: monitoring
            kubernetes_taints:
              - key: dedicated
                value: monitoring
                effect: "NO_SCHEDULE"
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
          - component: iam/ci
          - component: ec2/bastion
          - component: github-runners/main

---
components:
  terraform:
    eks/defaults:
      metadata:
        component: eks
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages EKS clusters"
          category: "container-orchestration"
          namespace: "k8s"
      vars:
        enabled: true
        kubernetes_version: "{{ .vars.eks_kubernetes_version | default \"1.28\" }}"
        cluster_name: "{{ .vars.tenant }}-{{ .vars.account }}-{{ .vars.environment }}-eks"
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # Cluster endpoint configuration
        endpoint_private_access: true
        endpoint_public_access: false

        # Security settings
        encrypt_secrets: true
        enable_cluster_logging: true
        enabled_cluster_log_types:

        # Node group configuration
          - api
          - audit
          - authenticator
          - controllerManager
          - scheduler
        node_groups: {}

        # Cluster configuration
        clusters: {}

        tags:
          Component: "EKS"
      dependencies:
        components:
          - component: vpc/main

---
components:
  terraform:
    eks/defaults:
      metadata:
        component: eks
        type: abstract
        custom:
          version: "2.0.0"
          description: "Manages one EKS cluster per component instance"
          category: "container-orchestration"
          namespace: "k8s"
      vars:
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version | default \"1.36\" }}"

        # One cluster per instance, as in cloudposse-terraform-components/aws-eks-cluster.
        # Each instance sets `name` and its `node_groups` map. The cluster is
        # "<Environment>-<name>", so `name` must not repeat the Environment
        # (`main`, not `ue1-main`).

        # Each instance sets subnet_ids and node_group_ebs_kms_key_id (no local
        # reads in an abstract: CLAUDE.md). kms/main's allow_autoscaling_ebs lets
        # the Auto Scaling service-linked role launch the node groups' volumes.

        # Kubernetes API access: API authentication mode, no hidden
        # cluster-creator admin (the component defaults, Cloud Posse's
        # access_config), and one access entry per CI role. The CI plan role
        # reads (AmazonEKSViewPolicy); the CI apply role administers
        # (AmazonEKSClusterAdminPolicy). While the endpoint is private, CI runs
        # the in-cluster components on the stack's in-VPC runners with these
        # roles; an operator (break-glass) applies them from inside the VPC
        # with their own access entry: the stack's map_additional_iam_roles,
        # set in its stack file (docs/OPERATIONS.md, "In-cluster
        # components"). Cloud Posse's list form
        # (access_entries + access_policy_associations), not access_entry_map:
        # the role ARNs come from !terraform.state, and an Atmos YAML function
        # cannot produce a map key. iam/ci returns a null ci_apply_role_arn
        # while its apply role is disabled; the component skips null
        # principals. Every instance also lists iam/ci in dependencies.components.
        access_entries:
          - principal_arn: !terraform.state iam/ci .ci_plan_role_arn
          - principal_arn: !terraform.state iam/ci .ci_apply_role_arn
        access_policy_associations:
          - principal_arn: !terraform.state iam/ci .ci_plan_role_arn
            policy_arn: AmazonEKSViewPolicy
            access_scope:
              type: cluster
          - principal_arn: !terraform.state iam/ci .ci_apply_role_arn
            policy_arn: AmazonEKSClusterAdminPolicy
            access_scope:
              type: cluster

        # Human cluster admins (break-glass, docs/OPERATIONS.md "In-cluster
        # components"): each account's Identity Center AdministratorAccess
        # (Managers, DevOps; operator-access decision 2026-09-30), by name, as
        # Cloud Posse's eks/cluster aws_sso_permission_sets_rbac; system:masters
        # is a cluster-scoped AmazonEKSClusterAdminPolicy entry. The plan looks
        # the set's role up in the stack's account and fails unless exactly one
        # exists, so every eks instance (dev, staging, prod and its DR standby,
        # prod-eu's two) plans only after aws-identity-center (fnx-gbl-root)
        # has assigned AdministratorAccess there: its account_assignments do in
        # dev, staging, prod and prod-eu. That is deploy-accounts' last phase
        # (identity-center), which must run before any eks plan of a workload
        # stack (docs/OPERATIONS.md, "In-cluster components"); no state read
        # links the two, so check-dependencies/check-deploy-layers cannot
        # enforce it. Each backend's write role trusts the set by its pattern
        # (stacks/orgs/fnx/root/*.yaml); check-cluster-api-ci.py fails a stack
        # whose set is not trusted there or not assigned in its account. A
        # stack file may add roles in map_additional_iam_roles.
        aws_sso_permission_sets_rbac:
          - aws_sso_permission_set: AdministratorAccess
            groups:
              - "system:masters"

        tags:
          Component: "EKS"
      dependencies:
        components:
          - component: iam/ci

---
components:
  terraform:
    eks/defaults:
      metadata:
        component: eks
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages EKS clusters"
          category: "container-orchestration"
          namespace: "k8s"
      vars:
        default_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version | default \"1.28\" }}"
        subnet_ids: !terraform.state vpc/main .private_subnet_ids

        # One entry per cluster (key = cluster name); instances define theirs.
        # Endpoint access, log types and secrets encryption are per cluster;
        # the module defaults are private endpoint only and all log types.
        clusters: {}

        tags:
          Component: "EKS"
      dependencies:
        components:
          - component: vpc/main

---
components:
  terraform:
    eks/defaults:
      metadata:
        component: eks
        type: abstract
        custom:
          version: "2.0.0"
          description: "Manages one EKS cluster per component instance"
          category: "container-orchestration"
          namespace: "k8s"
      vars:
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version | default \"1.36\" }}"

        # One cluster per instance, as in cloudposse-terraform-components/aws-eks-cluster.
        # Each instance sets `name` and its `node_groups` map. The cluster is
        # "<Environment>-<name>", so `name` must not repeat the Environment
        # (`main`, not `ue1-main`).

        # subnet_ids and node_group_ebs_kms_key_id are NOT set here (as in
        # catalog/vpc/defaults): Atmos resolves a `!terraform.state` inherited
        # from an abstract component even when the instance overrides the var,
        # so a read here fails every stack without its target. The DR standbys
        # (fnx-ue2-prod, fnx-ec1-prod) have no kms/main and read the primary's
        # replica key; the msplatform fixture has no vpc/main. Each instance
        # sets `subnet_ids` (its vpc instance's .private_subnet_ids) and
        # `node_group_ebs_kms_key_id` (every managed node group's EBS volumes:
        # its stack's `!terraform.state kms/main .key_arn`, whose
        # allow_autoscaling_ebs grants the AWS Auto Scaling service-linked role
        # what it needs to launch them), and lists both targets in
        # dependencies.components.

        # Kubernetes API access: API authentication mode, no hidden
        # cluster-creator admin (the component defaults, Cloud Posse's
        # access_config), and one access entry per CI role. The CI plan role
        # reads (AmazonEKSViewPolicy); the CI apply role administers
        # (AmazonEKSClusterAdminPolicy). While the endpoint is private, CI runs
        # the in-cluster components on the stack's in-VPC runners with these
        # roles; an operator (break-glass) applies them from inside the VPC
        # with their own access entry: the stack's map_additional_iam_roles,
        # set in its components/globals.yaml (docs/OPERATIONS.md, "In-cluster
        # components"). Cloud Posse's list form
        # (access_entries + access_policy_associations), not access_entry_map:
        # the role ARNs come from !terraform.state, and an Atmos YAML function
        # cannot produce a map key. iam/ci returns a null ci_apply_role_arn
        # while its apply role is disabled; the component skips null
        # principals. Every instance also lists iam/ci in dependencies.components.
        access_entries:
          - principal_arn: !terraform.state iam/ci .ci_plan_role_arn
          - principal_arn: !terraform.state iam/ci .ci_apply_role_arn
        access_policy_associations:
          - principal_arn: !terraform.state iam/ci .ci_plan_role_arn
            policy_arn: AmazonEKSViewPolicy
            access_scope:
              type: cluster
          - principal_arn: !terraform.state iam/ci .ci_apply_role_arn
            policy_arn: AmazonEKSClusterAdminPolicy
            access_scope:
              type: cluster

        tags:
          Component: "EKS"
      dependencies:
        components:
          - component: iam/ci

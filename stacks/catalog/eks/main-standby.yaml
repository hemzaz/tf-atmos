---
# =============================================================================
# eks/main in the DR warm standby stacks
# =============================================================================
# Warm = the same cluster shape as the eks/main of the primary stack it stands
# by for (settings.dr.standby_of), at its floor: the workers node group runs at
# 2 nodes, spread over vpc/main's three private subnets like every group here,
# the monitoring and memory-optimized groups at 0, each keeping the primary's
# max_group_size. Failover scales them with aws eks update-nodegroup-config,
# and a PR setting min_group_size/desired_group_size in the stack file
# reconciles Terraform afterwards (docs/OPERATIONS.md, "Disaster recovery").
# Cloud Posse's eks/cluster node groups take the same min/desired/max inputs.
# This region's key: the primary stack's kms/main multi-region replica.
# =============================================================================

import:
  - catalog/eks/defaults

components:
  terraform:
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        # The cluster is "<Environment>-<name>": ue2-main, ec1-main.
        name: main
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        allowed_security_group_ids:
          - !terraform.state ec2/bastion .security_group_id
          - !terraform.state github-runners/main .security_group_id
        tags:
          Cluster: "{{ .settings.prefix }}-main"
          Purpose: "application-workloads"
          CriticalityLevel: "high"
          SLA: "99.9"
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: false
        enabled_cluster_log_types:
          - "api"
          - "audit"
          - "authenticator"
          - "controllerManager"
          - "scheduler"
        cluster_encryption_config_kms_key_id: !terraform.state kms/main {{ .settings.dr.standby_of }} '.replica_keys["{{ .vars.region }}"].key_arn'
        node_group_ebs_kms_key_id: !terraform.state kms/main {{ .settings.dr.standby_of }} '.replica_keys["{{ .vars.region }}"].key_arn'
        cluster_log_retention_period: 90
        node_groups:
          workers:
            instance_types: ["m5.xlarge"]
            desired_group_size: 2
            min_group_size: 2
            max_group_size: 12
            kubernetes_labels:
              role: worker
              environment: "{{ .settings.context.stage }}"
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
            subnet_ids: !terraform.state vpc/main .private_subnet_ids
            tags:
              NodeGroup: workers
          monitoring:
            instance_types: ["m5.large"]
            desired_group_size: 0
            min_group_size: 0
            max_group_size: 4
            kubernetes_labels:
              role: monitoring
            kubernetes_taints:
              - key: dedicated
                value: monitoring
                effect: "NO_SCHEDULE"
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 200
          memory-optimized:
            instance_types: ["r5.xlarge"]
            desired_group_size: 0
            min_group_size: 0
            max_group_size: 6
            kubernetes_labels:
              role: memory-optimized
            capacity_type: "ON_DEMAND"
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
            stack: "{{ .settings.dr.standby_of }}"
          - component: iam/ci
          - component: ec2/bastion
          - component: github-runners/main

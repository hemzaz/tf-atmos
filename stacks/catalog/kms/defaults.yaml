---
##################################################
# Catalog Configuration for AWS KMS
##################################################
# Every environment runs one `kms/main` instance so that components requiring a
# customer-managed key (secretsmanager, rds, eks, ebs) resolve to a real key via
# `!terraform.state kms/main .key_arn` in all stacks rather than only in prod.
#
# Concrete instances inherit this base and supply the env-specific `alias_name`
# and `description`. No instance adds `key_users`/`key_administrators`: see
# below.

components:
  terraform:
    # Common configuration for all KMS key instances
    kms/defaults:
      metadata:
        component: kms
        type: abstract
      vars:
        name_prefix: '{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}'
        key_spec: SYMMETRIC_DEFAULT
        key_usage: ENCRYPT_DECRYPT
        enable_key_rotation: true
        rotation_period_in_days: 365
        deletion_window_in_days: 30
        # Root-account access (the Cloud Posse aws-kms/aws-kms-key default)
        # keeps the key usable by whichever role applies the stack, and is how
        # every real consumer gets key use: through their OWN IAM policy scoped
        # to this key, never through `key_users`/`key_administrators` -- see
        # the note below on why naming principals there is unsafe in this repo.
        enable_default_policy: true
        # CloudWatch Logs and EventBridge are service principals, which the
        # root-account statement does not reach. Components encrypting log
        # groups (eventbridge, apigateway, ...) or event buses with this key
        # need these; each statement is limited to this account and region.
        allow_cloudwatch_logs: true
        # CloudWatch Logs delivery (delivery.logs.amazonaws.com), a separate
        # principal from logs.<region>.amazonaws.com above: needed for a
        # resource whose logs ship via CloudWatch Logs delivery (Step
        # Functions execution history) to write into its own CMK-encrypted
        # log group. stepfunctions is the only consumer today.
        allow_log_delivery: true
        allow_eventbridge: true
        # security-monitoring encrypts its alert SNS topic with this key, so the
        # CloudWatch alarms publishing to it need kms:GenerateDataKey*/Decrypt
        # (EventBridge rules are covered by allow_eventbridge), limited to this
        # account's SNS topics.
        allow_cloudwatch_alarms: true
        # cloudtrail/main encrypts its trail log files with this key.
        allow_cloudtrail: true
        # SNS subscriptions delivering to SQS queues encrypted with this key
        # (sqs, sns components), limited to this account's topics in this
        # region. EventBridge rules delivering to such queues are covered by
        # allow_eventbridge.
        allow_sns: true
        # S3 event notifications delivering to SQS queues (or SNS topics)
        # encrypted with this key, e.g. batch-processing's trigger queue,
        # limited to this account's buckets.
        allow_s3: true
        # eks node groups' launch templates set node_group_ebs_kms_key_id to
        # this key (eks/defaults), and the AWS Auto Scaling service-linked
        # role that launches their EBS volumes needs kms:CreateGrant plus
        # Encrypt/Decrypt/DescribeKey to do so, or new instances fail to
        # launch. The key policy statement names that role directly (see
        # components/terraform/kms/README.md); each stack's iam instance
        # provisions the role (enable_autoscaling_service_linked_role, see
        # components/terraform/iam/README.md) and kms/main declares a
        # dependencies.components edge to it so the role exists before
        # kms/main's first apply. The sandbox lane
        # (stacks/orgs/fnx/local/us-east-1/sandbox.yaml) overrides this to
        # false: it runs no Auto Scaling or EKS node groups, and has no iam
        # instance.
        allow_autoscaling_ebs: true
        # backup/main encrypts its job-notifications SNS topic with this key;
        # AWS Backup needs this to publish to it, limited to this account's
        # topics in this region.
        allow_backup: true
        # CloudFront reading SSE-KMS origin objects through OAC (any
        # distribution of this account). Off: no stack has a cloudfront
        # instance yet; a stack that adds one sets it on its kms/main.
        allow_cloudfront: false
        # No named `key_administrators` here. The root-account statement above
        # already delegates key administration to IAM (the Cloud Posse aws-kms
        # design), and a templated ARN is unsafe in a shared base: Go templates
        # render before YAML functions, so in dev `aws_account_id` (an `!env`
        # tag) lands in the ARN as raw text and CreateKey rejects the policy.
        # No instance names one either (prod doesn't): KMS validates every
        # named principal at CreateKey/PutKeyPolicy time, and this repo's IaC
        # creates no admin role to name (see prod's security.yaml). Add named
        # administrators only once a real instance provisions that role, with
        # a literal account id.
        #
        # Real consumers (CI/deploy roles, application roles) that need
        # least-privilege key use, as opposed to full administration, should
        # get it through their OWN IAM identity policy scoped to this key —
        # by ARN (`!terraform.state kms/main .key_arn`) when the consumer
        # deploys in a later layer than kms, or by alias (`kms:ResourceAliases`
        # condition) when it must plan/apply earlier, as iam/ci's
        # ci_apply_kms_key_aliases does (`components/terraform/iam/README.md`)
        # — the Cloud Posse pattern of root-account delegation plus a
        # consumer's own scoped IAM policy
        # (`cloudposse/terraform-aws-kms-key`'s default key policy) — never by
        # adding them to `key_users`/`key_administrators` here: that list is a
        # key-policy principal list, so every entry must already exist at
        # apply time or the whole key fails to create.

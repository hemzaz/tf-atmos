---
# =============================================================================
# kms/main in a nonprod stack: the account's customer-managed key
# =============================================================================
# The key depends on aws-iam-service-linked-roles, which provisions the Auto
# Scaling service-linked role its key policy names. Each stack keeps its key's
# description.
# =============================================================================

import:
  - catalog/kms/defaults

components:
  terraform:
    # ==========================================================================
    # KMS - customer-managed key for Secrets Manager and other encrypted services
    # ==========================================================================
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        alias_name: "{{ .settings.prefix }}-main"  # without the alias/ prefix
        deletion_window_in_days: 7   # non-prod: shorter window, faster teardown
      dependencies:
        components:
          # allow_autoscaling_ebs (kms/defaults) names the Auto Scaling
          # service-linked role directly as a principal;
          # aws-iam-service-linked-roles provisions it so KMS does not
          # reject the key policy.
          - component: aws-iam-service-linked-roles

---
# =============================================================================
# cloudtrail - one multi-region trail per account, in its home stack (E5b)
# =============================================================================
# Vendored Cloud Posse aws-cloudtrail v1.539.0 (vendor.yaml) with the values
# of its README's catalog entry, as a per-account trail (owner, 2026-11-05: no
# org trail). Owner decisions (E5b plan, 2026-11-07):
#   - OQ-A: one trail per account, in the account's home stack only (prod-eu:
#     fnx-ew1-prod; the rest: their fnx-ue1-* stack), never in a DR standby or
#     a shared account's eu-west-1 stack. Multi-region with global service
#     events (CIS 3.1), so it records every region of the account; the shared
#     accounts' eu-west-1 control-plane events land in the US bucket under a
#     scoped check-data-residency exemption.
#   - OQ-C: Cloud Posse's per-account trail key (the component always creates
#     it; it has no kms_key_arn input), also on the log group
#     (kms_key_enabled), and readable by the audit account (audit_access_enabled,
#     for Athena there).
#   - OQ-E: the bucket is the residency's audit-stack cloudtrail-bucket,
#     named from cloudtrail_bucket_environment_name/_stage_name by
#     components/terraform/aws-cloudtrail/remote-state_override.tf (no remote
#     state read, no bucket name typed). EU (an eu- region, the GDPR scope of
#     check-data-residency.py) delivers to fnx-ew1-audit, the rest to
#     fnx-ue1-audit; the E5a bucket policy denies any other pairing.
# Deviation: cloudwatch_logs_retention_in_days 365 (the hand-written trail's
# value and the component default; Cloud Posse's README uses 730).
#
# A stack imports this file only once the E5b3 singleton guard
# (check-lane-names.py: one multi-region trail per account) is on master.
# =============================================================================

import:
  - catalog/_base/vendored
  - catalog/_base/account-map-bypass

components:
  terraform:
    aws-cloudtrail/defaults:
      metadata:
        component: aws-cloudtrail
        type: abstract
        inherits:
          - vendored
          - account-map-bypass
      vars:
        enabled: true
        name: cloudtrail
        # The residency from the stack's region code (mixins/region:
        # settings.context.environment; Cloud Posse's fixed codes of the eu-
        # regions, and only those, start with "e"), not vars.region, which a
        # stack may set to a template (fnx-ew1-root) that is not yet rendered
        # when this one is.
        cloudtrail_bucket_environment_name: '{{ if hasPrefix "e" .settings.context.environment }}ew1{{ else }}ue1{{ end }}'
        cloudtrail_bucket_stage_name: audit
        # CIS AWS Foundations 3.1 / 3.2.
        is_multi_region_trail: true
        include_global_service_events: true
        enable_log_file_validation: true
        is_organization_trail: false
        kms_key_enabled: true
        audit_access_enabled: true
        cloudwatch_logs_retention_in_days: 365
        tags:
          Component: "CloudTrail"
      dependencies:
        components:
          - component: cloudtrail-bucket
            stack: '{{ .settings.context.tenant }}-{{ if hasPrefix "e" .settings.context.environment }}ew1{{ else }}ue1{{ end }}-audit'

    # The instance (Cloud Posse's name).
    cloudtrail:
      metadata:
        component: aws-cloudtrail
        inherits:
          - aws-cloudtrail/defaults

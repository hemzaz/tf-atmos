---
import:
  - catalog/monitoring/defaults

# The production main stack's monitoring, shared by fnx-ue1-prod's and
# fnx-ew1-prod's monitoring/main: the <Environment>-main-alarms topic on
# kms/main (the runner pool's and the APIs' alarms name it), the dashboards,
# and alarms on eks/main, rds/main, elasticache/main, apigateway/main and
# acm/main's certificates. Alerts go to the stack's
# settings.environment.monitoring.critical_alerts. fnx-ue1-prod adds ECS.
components:
  terraform:
    monitoring/main-prod:
      metadata:
        component: monitoring
        type: abstract
        inherits:
          - monitoring/defaults
      vars:
        # Cloud Posse null-label style: every resource this component creates
        # is named "<Environment>-<name>-<suffix>". monitoring/main and
        # monitoring/data previously both named resources from Environment
        # alone and collided (ResourceAlreadyExists) on the second apply.
        name: main
        # kms/main already allows CloudWatch alarms to publish to encrypted
        # topics (catalog/kms/defaults.yaml allow_cloudwatch_alarms).
        kms_key_id: !terraform.state kms/main .key_arn
        create_dashboard: true
        enable_certificate_monitoring: true

        # Certificate monitoring
        certificate_arns: !terraform.state acm/main .certificate_arns // {} | [.[]]
        certificate_expiry_threshold: 30
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
          - "{{ index .settings.environment.monitoring.critical_alerts 1 }}"

        # Dashboard/alarm dimensions: the sources this stack actually
        # deploys, so the infrastructure and backend dashboards plot real
        # data instead of empty widgets (they default to [] / ""), and
        # enable_rds_monitoring's alarms below have RDS instances to watch.
        eks_cluster_name: !terraform.state eks/main .eks_cluster_id
        # eks/main's node_groups (compute.yaml): workers (min_group_size 3) +
        # monitoring (min_group_size 2) + memory-optimized (min_group_size 2)
        # = 7 guaranteed nodes. The eks_node_count_low alarm (monitoring's
        # alarms.tf) only fires below this floor.
        eks_min_node_count: 7
        rds_instances: !terraform.state rds/main .instance_identifier | [.]
        elasticache_clusters: !terraform.state elasticache/main .member_clusters
        api_gateway_name: !terraform.state apigateway/main .api_name
        api_gateway_stages: !terraform.state apigateway/main .rest_api_stage_name | [.]

        # PagerDuty integration
        # Secret: export from SSM /production/pagerduty/endpoint before plan/apply
        create_sns_topic: true
        cpu_alarms:
          high_cpu_warning:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 70
            dimensions: {}
          high_cpu_critical:
            namespace: "AWS/EC2"
            evaluation_periods: 2
            period: 300
            threshold: 90
            dimensions: {}
        memory_alarms:
          high_memory_warning:
            namespace: "CWAgent"
            evaluation_periods: 2
            period: 300
            threshold: 80
            dimensions: {}
          high_memory_critical:
            namespace: "CWAgent"
            evaluation_periods: 1
            period: 300
            threshold: 95
            dimensions: {}
        enable_rds_monitoring: true
        rds_cpu_threshold: 80
        db_connection_alarms:
          rds_connections_high:
            evaluation_periods: 2
            period: 300
            threshold: 400
        rds_storage_threshold: 10737418240
        api_gateway_error_threshold: 10
        api_gateway_latency_threshold: 5000
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
          - component: kms/main
          - component: eks/main
          - component: rds/main
          - component: elasticache/main
          - component: apigateway/main

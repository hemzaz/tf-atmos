---
# =============================================================================
# monitoring/main in the prod primary stacks with a data plane
# =============================================================================
# main-prod.yaml's instance (the monitoring/main-prod-defaults abstract, prod.yaml)
# plus the ecs/main dimension of a primary that runs the ECS cluster, with
# the full dependencies list restated for that read (a list replaces the
# abstract's, never merges with it).
# =============================================================================

import:
  - catalog/monitoring/prod

components:
  terraform:
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/main-prod-defaults
      vars:
        ecs_clusters: !terraform.state ecs/main .cluster_name | [.]
      dependencies:
        components:
          - component: vpc/main
          - component: acm/main
          - component: kms/main
          - component: eks/main
          - component: rds/main
          - component: ecs/main
          - component: elasticache/main
          - component: apigateway/main

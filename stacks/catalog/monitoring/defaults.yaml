---
components:
  terraform:
    monitoring/defaults:
      metadata:
        component: monitoring
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages CloudWatch dashboards, alarms, and monitoring resources"
          category: "monitoring"
      vars:
        # The lifecycle tier the component validates (dev/staging/prod).
        # context.environment is the instance name (`testenv-01`) and fails it.
        environment: "{{ .settings.context.stage }}"
        enable_certificate_monitoring: true

        # Certificate monitoring configuration
        certificate_arns: []
        certificate_names: []
        certificate_domains: []
        certificate_expiry_threshold: 30

        # EKS monitoring
        eks_cluster_name: ''

        # Alarm notification configuration
        create_sns_topic: true
        alarm_email_subscriptions: []

        # Dashboard configuration
        create_dashboard: true

        tags:
          Component: "Monitoring"
      dependencies:
        components:
          - component: vpc/main

# kms_key_id (encrypting aws_sns_topic.alarms with kms/main; kms/main already
# allows CloudWatch alarms to publish to encrypted topics via
# allow_cloudwatch_alarms in catalog/kms/defaults.yaml) is set per real-stack
# instance below, not here: this abstract is also inherited by 5
# stacks/catalog/templates/*.yaml (off limits for this change) whose
# monitoring instances declare their own dependencies.components without
# kms/main, so a shared kms_key_id here would reference an undeclared
# dependency for them.

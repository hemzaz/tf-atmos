---
components:
  terraform:
    monitoring/defaults:
      metadata:
        component: monitoring
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages CloudWatch dashboards, alarms, and monitoring resources"
          category: "monitoring"
      vars:
        enabled: true
        enable_certificate_monitoring: true
        enable_resource_monitoring: true
        enable_cost_monitoring: true

        # Certificate monitoring configuration
        certificate_arns: {}
        certificate_names: []
        certificate_domains: []
        certificate_expiry_threshold: 30

        # EKS monitoring
        eks_cluster_name: ''

        # Alarm notification configuration
        alarm_notifications_enabled: true
        alarm_email_addresses: []
        sns_topic_name: "{{ .vars.tenant }}-{{ .vars.environment }}-alarms"

        # Dashboard configuration
        create_dashboard: true
        dashboard_name: "{{ .vars.tenant }}-{{ .vars.environment }}-dashboard"

        tags:
          Component: "Monitoring"
      dependencies:
        components:
          - component: vpc/main

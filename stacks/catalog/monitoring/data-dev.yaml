---
# =============================================================================
# monitoring/data in a single-stack dev shape: the data dashboard and alarms
# =============================================================================
# The data plane's dashboards and alarms: the stack's kms/main key,
# acm/services' certificates and the eks/data and rds/data dimensions, with
# critical alerts only. Dev has no RDS connection alarm, so no rds/data read
# inside the alarm map (the staging shape has one).
# =============================================================================

import:
  - catalog/monitoring/defaults

components:
  terraform:
    monitoring/data:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        name: data
        kms_key_id: !terraform.state kms/main .key_arn
        create_dashboard: true
        enable_certificate_monitoring: true

        # Certificate monitoring configuration
        certificate_arns: !terraform.state acm/services .certificate_arns // {} | [.[]]
        certificate_expiry_threshold: 30

        # Dashboard/alarm dimensions: the sources this stack actually
        # deploys, so the infrastructure and backend dashboards plot real
        # data instead of empty widgets (they default to [] / "").
        eks_cluster_name: !terraform.state eks/data .eks_cluster_id
        rds_instances: !terraform.state rds/data .instance_identifier | [.]
        # lambda/data-processor is disabled (no package yet), and
        # apigateway/data with it: no API or Lambda dimensions until they are
        # enabled. Then add back, each read also in dependencies:
        #   api_gateway_name: !terraform.state apigateway/data .api_name
        #   api_gateway_stages: !terraform.state apigateway/data .rest_api_stage_name | [.]
        #   lambda_functions:
        #     - !terraform.state lambda/data-processor .function_name

        # Alert emails - only send critical alerts
        alarm_email_subscriptions:
          - "{{ index .settings.environment.monitoring.critical_alerts 0 }}"
        create_sns_topic: true
      dependencies:
        components:
          - component: vpc/main
          - component: acm/services
          - component: kms/main
          - component: eks/data
          - component: rds/data

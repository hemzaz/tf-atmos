---
##################################################
# Catalog Configuration for Service Control Policies
##################################################
# Vendored Cloud Posse aws-scp v0.3.0 (vendor.yaml), the single-resource
# pattern: one SCP per instance, attached to vars.target_ids. The instances are
# in the management account's global stack fnx-gbl-root
# (stacks/orgs/fnx/root/global-region.yaml), one per policy and OU, each
# reading its OU's id from that stack's state there (a read in these abstracts
# would be resolved for every inheriting instance,
# check-inherited-state-reads.py). One OU per instance, not a target_ids list:
# each attachment has its own state, and the sweep's synthetic OU id is the
# same for every OU, which the component's unique-targets validation refuses.
#
# Owner decision QE3 (a), attached to OUs only, never the organization root
# (SCPs never apply to the management account, and a root attachment would
# reach every OU at once). scripts/check-scp-policies.py (lint) fails a root
# or literal target, a policy over the 5,120-character limit, an OU with more
# than four of these (AWS's five per target includes FullAWSAccess, which every
# OU keeps: these are deny lists, so FullAWSAccess is the Allow each level
# needs), a NotAction or deny-all with no region or principal condition, an
# Identity Center exception outside its reserved path, a role-name exception
# no Deny protects from squatting, a misspelled condition key, a region list missing a global service, a stack in
# a region its OU denies or denied a us-east-1 call its components make (the
# relay, DNSSEC, query logging), and an EU account allowed data calls there.
#
#   policy             core  plat  eu   source
#   baseline            x     x    (1)  Cloud Posse catalog (catalog/*.yaml)
#   security-services   x     x    (1)  house: the catalog's have no exception;
#                                       plat's trail/Config one omits
#                                       OrganizationAccountAccessRole (OQ-F)
#   region-plat               x    (1)  house: the catalog has no region policy
#   region-eu                       x   house
#   (1) eu is under plat: plat's policies apply to its accounts too.
#
# Create or import (owner decision QE2): set vars.import_policy_id
# (p-<8+ chars>) and vars.import_target_ids on an instance to import an existing
# policy and its attachment; null creates one. A changed policy is an in-place
# update (UpdatePolicy), applied to every account under the OU at once.

import:
  - catalog/_base/vendored

components:
  terraform:
    aws-scp/defaults:
      metadata:
        component: aws-scp
        type: abstract
        inherits:
          - vendored
      vars:
        enabled: true
        tags:
          Component: "ServiceControlPolicy"

    # Cloud Posse's catalog statements, !included unedited. Its identical
    # DenyIAMRootAccount is not repeated.
    aws-scp/baseline-defaults:
      metadata:
        component: aws-scp
        type: abstract
        inherits:
          - aws-scp/defaults
      vars:
        policy_description: "Baseline: deny leaving the organization, root-user actions and IAM user or access-key creation"
        policy_statements:
          - !include stacks/catalog/aws-scp/catalog/DenyLeavingOrganization.yaml
          - !include stacks/catalog/aws-scp/catalog/DenyRootAccountAccess.yaml
          # Identity comes from Identity Center (E4). No component creates an
          # IAM user or access key (CI uses GitHub OIDC roles).
          - !include stacks/catalog/aws-scp/catalog/DenyIAMCreatingUsers.yaml

    # House: Cloud Posse's DenyCloudTrailActions, DenyConfigRulesDelete and
    # DenyDisablingGuardDuty have no principal exception, so they would deny the
    # roles that configure these services (each account's own trail and Config
    # under QE7 (c), E5's delegated administrators), and the catalog has nothing
    # for Security Hub or Access Analyzer. Two statements (E5b8, owner decision
    # OQ-F), since their exceptions differ: DenyTrailConfigTampering, the
    # catalog's CloudTrail and Config actions, and DenyDetectorTampering, the
    # disable and disassociate actions of the other three (not the catalog's
    # whole GuardDuty list, which also denies routine finding triage), which E5c
    # narrows to the delegated-admin path.
    #
    # Excepted (the shared &deploy_roles list): each stack's CI apply role
    # (iam/ci: <stack>-ci-apply, which deploys these components),
    # OrganizationAccountAccessRole (the management account's way in, the
    # bootstrap and core stacks' operator until E3e's order retires it: dropping
    # it before Identity Center is applied locks the core stacks out), and the
    # Identity Center roles of the TerraformApplyAccess sets (-Prod and -Eu
    # too) and AdministratorAccess (the break-glass), by their reserved path
    # aws-reserved/sso.amazonaws.com/ (no region segment: the home region is
    # us-east-1; the * admits the regional form). Identity Center creates these
    # roles through its service-linked role AWSServiceRoleForSSO, which alone
    # writes under that path (Identity Center user guide, "Using service-linked
    # roles"), and DenyProtectedRoleTampering below denies everyone else there.
    # Service-linked roles (org auto-enable, and Identity Center's own, which
    # creates the AWSReservedSSO_ roles) are outside SCPs.
    #
    # DenyProtectedRoleTampering closes role-name squatting: an exception by
    # role name holds only while no one else can create or re-trust a role of
    # that name, so only the same deploy roles may create, re-trust, re-policy,
    # retag or delete the CI roles, OrganizationAccountAccessRole, or any role
    # under aws-reserved/ (defence in depth for the SSO exception). The CI
    # apply role keeps managing iam/ci (itself and ci-plan) through Terraform;
    # OrganizationAccountAccessRole creates them at bootstrap.
    #
    # Per OU (OQ-F): core keeps OrganizationAccountAccessRole in every
    # exception, since it applies the core stacks' trails and recorders
    # (OPERATIONS, Bootstrap order step 6). plat's DenyTrailConfigTampering
    # drops it (security-services-plat-defaults): a workload trail or recorder is applied
    # only by its stack's CI apply role, the TerraformApplyAccess sets and the
    # AdministratorAccess break-glass. plat's DenyProtectedRoleTampering drops
    # it from its exception too, or it could create or re-trust a CI apply role
    # and act as that; it stays a protected role (a resource of that Deny, not
    # an exempt principal). The workload stacks' bootstrap as
    # OrganizationAccountAccessRole (iam, including the CI roles, and VPCs,
    # `full -f bootstrap`) runs while these SCPs are disabled, and the state
    # backends stop trusting that role when Identity Center is applied, before
    # these are enabled (root/global-region.yaml; check-scp-policies.py fails an
    # enabled one while aws-identity-center is disabled). plat's
    # DenyDetectorTampering keeps it until E5c narrows that statement.
    # check-scp-policies.py fails the role in plat's trail/Config exception, or
    # its absence from core's.
    aws-scp/security-services-core-defaults:
      metadata:
        component: aws-scp
        type: abstract
        inherits:
          - aws-scp/defaults
      vars:
        policy_description: &security_services_description "Deny disabling CloudTrail, Config, GuardDuty, Security Hub and Access Analyzer, and changing the deploy roles, except to the deploy roles"
        policy_statements:
          - sid: "DenyTrailConfigTampering"
            effect: "Deny"
            actions: &trail_config_actions
              - "cloudtrail:DeleteTrail"
              - "cloudtrail:PutEventSelectors"
              - "cloudtrail:StopLogging"
              - "cloudtrail:UpdateTrail"
              - "config:DeleteConfigRule"
              - "config:DeleteConfigurationRecorder"
              - "config:DeleteDeliveryChannel"
              - "config:StopConfigurationRecorder"
              - "config:DeleteRetentionConfiguration"
              - "config:DeleteEvaluationResults"
              - "config:DeleteConfigurationAggregator"
            resources:
              - "*"
            conditions:
              - test: "ArnNotLike"
                variable: "aws:PrincipalArn"
                values: &deploy_roles
                  - "arn:aws:iam::*:role/{{ .settings.context.tenant }}-*-ci-apply"
                  - "arn:aws:iam::*:role/OrganizationAccountAccessRole"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformApplyAccess_*"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformApplyAccess-*"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
          - &detector_tampering
            sid: "DenyDetectorTampering"
            effect: "Deny"
            actions:
              - "guardduty:DeleteDetector"
              - "guardduty:UpdateDetector"
              - "guardduty:DisassociateFromMasterAccount"
              - "guardduty:DisassociateFromAdministratorAccount"
              - "guardduty:DisassociateMembers"
              - "guardduty:DeleteMembers"
              - "guardduty:StopMonitoringMembers"
              - "guardduty:DeletePublishingDestination"
              - "guardduty:UpdatePublishingDestination"
              - "securityhub:DisableSecurityHub"
              - "securityhub:DisassociateFromMasterAccount"
              - "securityhub:DisassociateFromAdministratorAccount"
              - "securityhub:DisassociateMembers"
              - "securityhub:DeleteMembers"
              - "securityhub:BatchDisableStandards"
              - "securityhub:DeleteFindingAggregator"
              - "access-analyzer:DeleteAnalyzer"
              - "access-analyzer:CreateArchiveRule"
              - "access-analyzer:UpdateArchiveRule"
            resources:
              - "*"
            conditions:
              - test: "ArnNotLike"
                variable: "aws:PrincipalArn"
                values: *deploy_roles
          - sid: "DenyProtectedRoleTampering"
            effect: "Deny"
            actions: &protected_role_actions
              - "iam:CreateRole"
              - "iam:DeleteRole"
              - "iam:UpdateRole"
              - "iam:UpdateRoleDescription"
              - "iam:UpdateAssumeRolePolicy"
              - "iam:PutRolePolicy"
              - "iam:DeleteRolePolicy"
              - "iam:AttachRolePolicy"
              - "iam:DetachRolePolicy"
              - "iam:PutRolePermissionsBoundary"
              - "iam:DeleteRolePermissionsBoundary"
              - "iam:TagRole"
              - "iam:UntagRole"
            resources: &protected_roles
              - "arn:aws:iam::*:role/{{ .settings.context.tenant }}-*-ci-apply"
              - "arn:aws:iam::*:role/{{ .settings.context.tenant }}-*-ci-plan"
              - "arn:aws:iam::*:role/OrganizationAccountAccessRole"
              - "arn:aws:iam::*:role/aws-reserved/*"
            conditions:
              - test: "ArnNotLike"
                variable: "aws:PrincipalArn"
                values: *deploy_roles

    # The workload OU's copy: core's, but without OrganizationAccountAccessRole
    # in DenyTrailConfigTampering's and DenyProtectedRoleTampering's exceptions
    # (&workload_roles, above). Same protected roles: that role stays one, so
    # no one else may squat on or re-trust it. Dropping it from the protected
    # roles' exception too closes the escalation the trail/Config narrowing
    # would otherwise leave: create or re-trust a <stack>-ci-apply role, assume
    # it, then stop the trail (check-scp-policies.py: whoever may create or
    # re-trust an exempt role must be exempt from every other statement).
    aws-scp/security-services-plat-defaults:
      metadata:
        component: aws-scp
        type: abstract
        inherits:
          - aws-scp/defaults
      vars:
        policy_description: *security_services_description
        policy_statements:
          - sid: "DenyTrailConfigTampering"
            effect: "Deny"
            actions: *trail_config_actions
            resources:
              - "*"
            conditions:
              - test: "ArnNotLike"
                variable: "aws:PrincipalArn"
                values: &workload_roles
                  - "arn:aws:iam::*:role/{{ .settings.context.tenant }}-*-ci-apply"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformApplyAccess_*"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_TerraformApplyAccess-*"
                  - "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_AdministratorAccess_*"
          - *detector_tampering
          - sid: "DenyProtectedRoleTampering"
            effect: "Deny"
            actions: *protected_role_actions
            resources: *protected_roles
            conditions:
              - test: "ArnNotLike"
                variable: "aws:PrincipalArn"
                values: *workload_roles

    # House region allow-lists. The NotAction list is AWS Control Tower's
    # Region deny control (GRREGIONDENY, controlreference/primary-region-deny-policy):
    # the global services, served from us-east-1, that aws:RequestedRegion
    # must not deny (IAM, STS, Organizations, Route 53, CloudFront and its ACM
    # certificates and WAF, Budgets, Cost Explorer, Support, Identity Center,
    # KMS for Route 53 DNSSEC keys). No principal exception: the deploy roles
    # work in these regions too, and a residency control must hold for them.
    # Both policies share the list (the YAML anchor), and check-scp-policies.py
    # fails it when a required global service is missing.
    #
    # plat: the US regions and the two EU regions, since eu sits under plat and
    # needs an Allow (no Deny) at every level: a region plat denies, eu's
    # accounts cannot use either.
    aws-scp/region-plat-defaults:
      metadata:
        component: aws-scp
        type: abstract
        inherits:
          - aws-scp/defaults
      vars:
        policy_description: "Deny regional services outside us-east-1, us-east-2, eu-west-1 and eu-central-1"
        policy_statements:
          - sid: "DenyOutsideAllowedRegions"
            effect: "Deny"
            not_actions: &global_services
              - "a4b:*"
              - "access-analyzer:*"
              - "account:*"
              - "acm:*"
              - "activate:*"
              - "artifact:*"
              - "aws-marketplace-management:*"
              - "aws-marketplace:*"
              - "aws-portal:*"
              - "billing:*"
              - "billingconductor:*"
              - "budgets:*"
              - "ce:*"
              - "chatbot:*"
              - "chime:*"
              - "cloudfront:*"
              - "cloudtrail:LookupEvents"
              - "compute-optimizer:*"
              - "config:*"
              - "consoleapp:*"
              - "consolidatedbilling:*"
              - "cur:*"
              - "datapipeline:GetAccountLimits"
              - "devicefarm:*"
              - "directconnect:*"
              - "ec2:DescribeRegions"
              - "ec2:DescribeTransitGateways"
              - "ec2:DescribeVpnGateways"
              - "ecr-public:*"
              - "fms:*"
              - "freetier:*"
              - "globalaccelerator:*"
              - "health:*"
              - "iam:*"
              - "importexport:*"
              - "invoicing:*"
              - "iq:*"
              - "kms:*"
              - "license-manager:ListReceivedLicenses"
              - "lightsail:Get*"
              - "mobileanalytics:*"
              - "networkmanager:*"
              - "notifications-contacts:*"
              - "notifications:*"
              - "organizations:*"
              - "payments:*"
              - "pricing:*"
              - "quicksight:DescribeAccountSubscription"
              - "resource-explorer-2:*"
              - "route53-recovery-cluster:*"
              - "route53-recovery-control-config:*"
              - "route53-recovery-readiness:*"
              - "route53:*"
              - "route53domains:*"
              - "s3:CreateMultiRegionAccessPoint"
              - "s3:DeleteMultiRegionAccessPoint"
              - "s3:DescribeMultiRegionAccessPointOperation"
              - "s3:GetAccountPublicAccessBlock"
              - "s3:GetBucketLocation"
              - "s3:GetBucketPolicyStatus"
              - "s3:GetBucketPublicAccessBlock"
              - "s3:GetMultiRegionAccessPoint"
              - "s3:GetMultiRegionAccessPointPolicy"
              - "s3:GetMultiRegionAccessPointPolicyStatus"
              - "s3:GetStorageLensConfiguration"
              - "s3:GetStorageLensDashboard"
              - "s3:ListAllMyBuckets"
              - "s3:ListMultiRegionAccessPoints"
              - "s3:ListStorageLensConfigurations"
              - "s3:PutAccountPublicAccessBlock"
              - "s3:PutMultiRegionAccessPointPolicy"
              - "savingsplans:*"
              - "shield:*"
              - "sso:*"
              - "sts:*"
              - "support:*"
              - "supportapp:*"
              - "supportplans:*"
              - "sustainability:*"
              - "tag:GetResources"
              - "tax:*"
              - "trustedadvisor:*"
              - "vendor-insights:ListEntitledSecurityProfiles"
              - "waf-regional:*"
              - "waf:*"
              - "wafv2:*"
              # Not Control Tower's: the us-east-1 relay's alarm, rule and
              # targets, the lifecycle and refresh calls the provider makes
              # (region-eu, below), never cloudwatch:* or events:*: PutEvents,
              # CreateArchive, PutMetricData and PutDashboard stay regional.
              # The second statement of each policy (relay_actions, the same
              # entries) denies these outside its regions.
              - "cloudwatch:PutMetricAlarm"
              - "cloudwatch:DeleteAlarms"
              - "cloudwatch:DescribeAlarms"
              - "cloudwatch:ListTagsForResource"
              - "cloudwatch:TagResource"
              - "cloudwatch:UntagResource"
              - "events:PutRule"
              - "events:DeleteRule"
              - "events:DescribeRule"
              - "events:EnableRule"
              - "events:DisableRule"
              - "events:PutTargets"
              - "events:RemoveTargets"
              - "events:ListTargetsByRule"
              - "events:ListTagsForResource"
              - "events:TagResource"
              - "events:UntagResource"
            resources:
              - "*"
            conditions:
              - test: "StringNotEquals"
                variable: "aws:RequestedRegion"
                values: &plat_regions
                  - "us-east-1"
                  - "us-east-2"
                  - "eu-west-1"
                  - "eu-central-1"
          - sid: "DenyMonitoringOutsideAllowedRegions"
            effect: "Deny"
            actions: &relay_actions
              - "cloudwatch:PutMetricAlarm"
              - "cloudwatch:DeleteAlarms"
              - "cloudwatch:DescribeAlarms"
              - "cloudwatch:ListTagsForResource"
              - "cloudwatch:TagResource"
              - "cloudwatch:UntagResource"
              - "events:PutRule"
              - "events:DeleteRule"
              - "events:DescribeRule"
              - "events:EnableRule"
              - "events:DisableRule"
              - "events:PutTargets"
              - "events:RemoveTargets"
              - "events:ListTargetsByRule"
              - "events:ListTagsForResource"
              - "events:TagResource"
              - "events:UntagResource"
            resources:
              - "*"
            conditions:
              - test: "StringNotEquals"
                variable: "aws:RequestedRegion"
                values: *plat_regions

    # eu (prod-eu, GDPR, owner B5 decisions): eu-* only, so B5's data
    # residency is an AWS control and not only a lint. The one us-east-1 need
    # beyond the global services is B5's Route 53 health-check alarm relay
    # (apigateway health-check-alarm-relay.tf): Route 53 publishes the metric
    # only in us-east-1, so the alarm (cloudwatch) and the EventBridge rule and
    # targets (events) live there, holding no data (no SNS topic, key or log
    # group, B5 round 5). The first statement exempts only the relay's own
    # alarm, rule and target actions (the shared list), the second allows them
    # in eu-* and us-east-1 only; every other cloudwatch and events action
    # (PutEvents, CreateArchive, PutMetricData, PutDashboard) is eu-* only.
    # Effective regions are eu-west-1 and eu-central-1: region-plat still
    # applies.
    aws-scp/region-eu-defaults:
      metadata:
        component: aws-scp
        type: abstract
        inherits:
          - aws-scp/defaults
      vars:
        policy_description: "Deny regional services outside eu-*, but the us-east-1 Route 53 health-check alarm relay"
        policy_statements:
          - sid: "DenyOutsideEU"
            effect: "Deny"
            not_actions: *global_services
            resources:
              - "*"
            conditions:
              - test: "StringNotLike"
                variable: "aws:RequestedRegion"
                values:
                  - "eu-*"
          - sid: "DenyMonitoringOutsideEUButRelay"
            effect: "Deny"
            actions: *relay_actions
            resources:
              - "*"
            conditions:
              - test: "StringNotLike"
                variable: "aws:RequestedRegion"
                values:
                  - "eu-*"
                  - "us-east-1"

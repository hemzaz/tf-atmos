---
import:
  - catalog/guardduty/defaults

# Production detector settings, shared by every prod stack's guardduty/main
# (the prod primaries and the DR standbys): prod turns on the protection
# plans the catalog leaves
# opt-in (EKS audit logs and EBS malware scanning bill per event / per GB
# scanned) and auto-archives port-scan noise.
components:
  terraform:
    guardduty/prod:
      metadata:
        component: guardduty
        type: abstract
        inherits:
          - guardduty/defaults
      vars:
        enable_kubernetes_protection: true
        enable_malware_protection: true
        auto_archive_filter:
          - severity: 1
            criteria:
              type:
                - "Recon:EC2/Portscan"

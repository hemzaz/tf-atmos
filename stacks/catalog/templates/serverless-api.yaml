---
# =============================================================================
# SERVERLESS API STACK TEMPLATE
# =============================================================================
# Serverless REST API: API Gateway -> Lambda -> DynamoDB, with Cognito auth,
# an SQS work queue, a CloudFront-fronted S3 bucket for static assets and a
# private S3 bucket for browser uploads.
#
# Architecture:
#   - API Gateway REST API (REGIONAL) at api.<app domain>: on / and
#     /{proxy+}, every method AWS_PROXY to lambda-api-handler. GET and HEAD
#     take an access token with the API's read or write scope, POST, PUT,
#     PATCH and DELETE one with the write scope (COGNITO_USER_POOLS
#     authorizer); OPTIONS (the CORS preflight) is unauthenticated. One usage
#     plan; a REGIONAL WAF on the stage.
#   - Cognito user pool with a hosted UI prefix domain, a resource server
#     (<tenant>-<environment>-api, scopes read and write) and three clients:
#     web and mobile (public, code flow with PKCE) and api
#     (confidential, client_credentials).
#   - Lambdas: api-handler (the API), async-processor (the tasks queue).
#     api-authorizer is a disabled custom (TOKEN) authorizer, kept for a
#     stack that wants one in place of Cognito.
#   - DynamoDB: main (single-table design, two GSIs) and sessions.
#   - SQS: tasks and notifications, each with its own dead-letter queue.
#   - S3 assets bucket, read by CloudFront at assets.<app domain> through
#     origin access control; a separate private uploads bucket (never a
#     CloudFront origin); CloudFront standard logging (v2) to a log bucket.
#   - CloudWatch dashboard and alarms (API, Lambdas, DynamoDB, DLQs).
#
# Request path: client -> api.<app domain> (WAF) -> stage -> Cognito
# authorizer -> lambda-api-handler. Assets: viewer -> CloudFront
# (assets.<app domain>) -> S3 (OAC). Uploads: the browser PUTs to a presigned
# URL the API handler issues for the uploads bucket (its CORS admits the app
# origin).
#
# Encryption: the stack's customer managed key, kms/main, encrypts the tables,
# the queues, the buckets, the Lambdas' environment and log groups, the API
# access log group, the WAF log group and the monitoring alarm topic.
#
# Cost Estimates (Monthly):
#   Development:  ~$10-50/month (minimal traffic; Cognito PLUS is per MAU)
#   Staging:      ~$50-200/month
#   Production:   ~$200-2,000/month (scales with usage)
#
# Deployment Time: 15-25 minutes
#
# Usage (instances are serverless-api/<part>):
#   atmos terraform plan serverless-api/apigateway -s <tenant>-<stage>-<environment>
#   atmos workflow deploy -f deploy-full-stack -s <tenant>-<stage>-<environment>
#
# =============================================================================
# REQUIREMENTS FOR THE IMPORTING STACK
# =============================================================================
# 1. A kms/main instance (every fnx org stack has one, in components/security.yaml,
#    from catalog/kms/defaults). This template does not define it: doing so would
#    deep-merge over that stack's own alias_name/description. It must keep the
#    grants catalog/kms/defaults turns on (allow_cloudwatch_logs for the
#    Lambda, API and WAF log groups, allow_cloudwatch_alarms for the alarm
#    topic) and also set
#      allow_cloudfront: true        # CloudFront decrypts the assets through OAC
#      allow_log_delivery_s3: true   # CloudFront log delivery into the log bucket
# 2. An apigateway-account/main instance (the three AWS stacks have one, in
#    components/security.yaml): REST stage logging needs the account's API
#    Gateway CloudWatch role, one per account and region, never per template.
# 3. s3/lambda-artifacts (imported below; an fnx org stack imports the same file
#    in components/services.yaml) applied, with
#    api-handler/<api_handler_version>.zip and
#    async-processor/<async_processor_version>.zip in it, before the Lambdas:
#    deploy-full-stack's storage layer applies it before compute.
# 4. settings.serverless_api, the inputs this template cannot create:
#      settings:
#        serverless_api:
#          app_domain_name: app.example.com    # api.<it> and assets.<it>; the web origin https://<it>
#          dns_component: network/main         # dns instance holding app_domain_name's public zone
#          dns_zone_key: main                  # that zone's key in its zone_ids output
#          api_handler_version: "1.0.0"        # package keys; bump to deploy new code
#          async_processor_version: "1.0.0"
#          # AWS Lambda Powertools for Python (v3, python3.13, arm64), e.g.
#          # arn:aws:lambda:<region>:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-arm64:<version>
#          powertools_layer_arn: arn:aws:lambda:<region>:017000801446:layer:<name>:<version>
#    A missing key fails every describe/plan of the stack with its name
#    (gomplate `required`); `atmos validate stacks` does not render templates.
#    settings.environment.account_id (set by every fnx stage _defaults)
#    scopes the CloudFront log bucket's delivery policy to this account.
# 5. That dns instance manages app_domain_name's PUBLIC, delegated zone: ACM
#    validates the certificates there, and the API's custom domain and
#    CloudFront write their alias records into it.
# 6. A prod stack turns on serverless-api/cognito's deletion_protection and the
#    tables' deletion_protection_enabled (see ENVIRONMENT-SPECIFIC OVERRIDES at
#    the end).
# 7. On-call addresses, if any, in serverless-api/monitoring's
#    alarm_email_subscriptions.
# 8. S3 access logging is off: the target must be a separate SSE-S3 bucket (S3
#    cannot deliver access logs to an SSE-KMS bucket) and this template has
#    none. Enable it per stack on serverless-api/s3/assets and s3/uploads
#    (vars.logging).
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/cognito/defaults
  - catalog/dynamodb/defaults
  - catalog/sqs/defaults
  - catalog/s3/defaults
  - catalog/acm/defaults
  - catalog/waf/defaults
  - catalog/cloudfront/defaults
  - catalog/monitoring/defaults
  # s3/lambda-artifacts, the stack's lambda package bucket (an fnx org stack
  # imports the same file in components/services.yaml).
  - catalog/s3/lambda-artifacts

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # AUTHENTICATION (Cognito, security layer)
    # =========================================================================
    # The pool is <tenant>-<environment>-<stage>-users, each client
    # <tenant>-<environment>-<stage>-<key>. Globally unique names (the hosted
    # UI domain prefix, the buckets) carry the stage, so stages sharing an
    # environment (a region code) do not collide. Lambda triggers, SES email, account
    # recovery settings and a custom hosted UI domain are not inputs of the
    # cognito component; the pool uses Cognito's email and the
    # <domain_prefix>.auth.<region>.amazoncognito.com hosted UI.

    serverless-api/cognito:
      metadata:
        component: cognito
        type: real
        inherits:
          - cognito/defaults
      vars:
        name_prefix: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}"

        # Threat protection in audit mode (a Plus-plan feature; the component
        # validates the pair). catalog/cognito/defaults sets ENFORCED.
        advanced_security_mode: "AUDIT"
        user_pool_tier: "PLUS"

        # A deletable pool for non-prod stacks; prod turns it on (REQUIREMENTS 6).
        deletion_protection: false

        # Self-signup on: the web and mobile apps register their own users.
        allow_admin_create_user_only: false

        # User attributes. Attributes cannot be changed or removed once the
        # pool exists; new ones can be added.
        string_schemas:
          - name: "email"
            required: true
            string_attribute_constraints:
              min_length: 5
              max_length: 256
          - name: "name"
            string_attribute_constraints:
              min_length: 1
              max_length: 256
          # custom:tenant_id
          - name: "tenant_id"
            string_attribute_constraints:
              min_length: 1
              max_length: 128

        # Hosted UI and token endpoint (<prefix>.auth.<region>.amazoncognito.com):
        # the code flow's authorize endpoint, and the api client's
        # client_credentials token endpoint, which the component requires a
        # domain for.
        domain_prefix: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}-api"

        # The API's OAuth scopes. serverless-api/apigateway's GET and HEAD
        # accept an access token carrying either, the write verbs only write.
        resource_servers:
          - identifier: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
            name: "API Resource Server"
            scope:
              - scope_name: "read"
                scope_description: "Read access to the API"
              - scope_name: "write"
                scope_description: "Write access to the API"

        clients:
          # Browser app: public client (no secret), authorization code flow
          # with PKCE. The implicit flow is not offered (OAuth 2.0 Security
          # BCP).
          web:
            generate_secret: false
            allowed_oauth_flows:
              - "code"
            allowed_oauth_scopes:
              - "email"
              - "openid"
              - "profile"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
            callback_urls:
              - 'https://{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}/callback'
            logout_urls:
              - 'https://{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}/logout'

          # Native app: a public client (RFC 8252: an installed app cannot
          # keep a secret), authorization code flow with PKCE, like web.
          mobile:
            generate_secret: false
            allowed_oauth_flows:
              - "code"
            allowed_oauth_scopes:
              - "email"
              - "openid"
              - "profile"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
            callback_urls:
              - "myapp://callback"
            logout_urls:
              - "myapp://logout"

          # Machine-to-machine: client_credentials only, with a secret, no
          # user sign-in flow.
          api:
            generate_secret: true
            explicit_auth_flows:
              - "ALLOW_REFRESH_TOKEN_AUTH"
            allowed_oauth_flows:
              - "client_credentials"
            allowed_oauth_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"

        tags:
          Layer: "authentication"
          Application: "serverless-api"

    # =========================================================================
    # DATA STORAGE (DynamoDB, storage layer)
    # =========================================================================
    # One table per instance (Cloud Posse aws-dynamodb), each
    # <Environment>-<name>, encrypted with kms/main and with point-in-time
    # recovery (dynamodb/defaults). PAY_PER_REQUEST: no capacity to scale.

    # Main application table (single-table design).
    serverless-api/dynamodb/main:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: "api-data"
        hash_key: "pk"
        range_key: "sk"
        dynamodb_attributes:
          - name: "gsi1pk"
            type: "S"
          - name: "gsi1sk"
            type: "S"
          - name: "gsi2pk"
            type: "S"
          - name: "gsi2sk"
            type: "S"
        global_secondary_index_map:
          - name: "gsi1"
            hash_key: "gsi1pk"
            range_key: "gsi1sk"
            projection_type: "ALL"
          - name: "gsi2"
            hash_key: "gsi2pk"
            range_key: "gsi2sk"
            projection_type: "KEYS_ONLY"
        ttl_enabled: true
        ttl_attribute: "ttl"
        tags:
          Layer: "data"
          Application: "serverless-api"

    # API sessions and tokens; items expire through TTL. Short-lived data, so
    # no point-in-time recovery.
    serverless-api/dynamodb/sessions:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: "api-sessions"
        hash_key: "session_id"
        dynamodb_attributes:
          - name: "user_id"
            type: "S"
        global_secondary_index_map:
          - name: "user-index"
            hash_key: "user_id"
            projection_type: "ALL"
        ttl_enabled: true
        ttl_attribute: "expires_at"
        point_in_time_recovery_enabled: false
        tags:
          Layer: "data"
          Application: "serverless-api"

    # =========================================================================
    # MESSAGE QUEUES (SQS, storage layer)
    # =========================================================================
    # One queue per instance with its own dead-letter queue (Cloud Posse
    # aws-sqs-queue), <Environment>-<name> and <Environment>-<name>-dlq, both
    # encrypted with kms/main (sqs/defaults).

    # Work the API hands off; lambda-async-processor consumes it.
    serverless-api/sqs/tasks:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: "api-tasks"
        # Above lambda-async-processor's 300 s timeout, or a message becomes
        # visible again while it is still being processed.
        visibility_timeout_seconds: 330
        message_retention_seconds: 1209600  # 14 days
        receive_wait_time_seconds: 20       # long polling
        kms_data_key_reuse_period_seconds: 300
        dlq_enabled: true
        dlq_max_receive_count: 3
        tags:
          Layer: "messaging"
          Application: "serverless-api"

    # Notifications the API publishes for downstream consumers outside this
    # template.
    serverless-api/sqs/notifications:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: "api-notifications"
        visibility_timeout_seconds: 60
        message_retention_seconds: 86400    # 1 day
        dlq_enabled: true
        dlq_max_receive_count: 5
        tags:
          Layer: "messaging"
          Application: "serverless-api"

    # =========================================================================
    # STATIC ASSETS, UPLOADS AND CDN LOGS (S3, storage layer)
    # =========================================================================
    # Bucket names are global, so each starts with the full id
    # (bucket_name: <tenant>-<environment>-<stage>-api-<purpose>, as
    # batch-processing's); name is still required by the s3 component. SSE-KMS
    # on kms/main with versioning (s3/defaults); the component blocks public
    # access.
    #
    # Two buckets, not one with prefixes: origin access control grants
    # CloudFront the whole origin bucket (allow_cloudfront_oac_read, as Cloud
    # Posse's cloudfront-s3-cdn origin policy does), so user uploads in the
    # served bucket would be public at assets.<app domain>, and any HTML or SVG
    # among them would run on a sibling of the app's origin. CloudFront serves
    # only s3/assets, which the release pipeline writes; s3/uploads is never
    # an origin.

    # Static assets the release pipeline publishes. CloudFront reads it
    # through origin access control (kms/main allow_cloudfront, REQUIREMENTS 1).
    serverless-api/s3/assets:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "api-assets"
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}-api-assets"
        allow_cloudfront_oac_read: true
        lifecycle_configuration_rules:
          - id: "noncurrent-versions"
            abort_incomplete_multipart_upload_days: 7
            noncurrent_version_expiration:
              noncurrent_days: 30
        tags:
          Layer: "storage"
          Application: "serverless-api"

    # User uploads: private, reached only through presigned URLs the API
    # handler signs. Browsers PUT and GET those URLs from the app origin, so
    # CORS admits it.
    serverless-api/s3/uploads:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "api-uploads"
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}-api-uploads"
        cors_configuration:
          - allowed_headers:
              - "*"
            allowed_methods:
              - "GET"
              - "PUT"
              - "POST"
            allowed_origins:
              - 'https://{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}'
              - 'https://www.{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}'
            expose_headers:
              - "ETag"
            max_age_seconds: 3600
        lifecycle_configuration_rules:
          - id: "transition-uploads"
            filter_and:
              prefix: "uploads/"
            transition:
              - days: 30
                storage_class: "STANDARD_IA"
              # Instant Retrieval: uploads are read back through presigned
              # GETs, which a GLACIER (Flexible Retrieval) object refuses with
              # InvalidObjectState until restored.
              - days: 90
                storage_class: "GLACIER_IR"
          - id: "expire-temp"
            filter_and:
              prefix: "temp/"
            expiration:
              days: 1
          - id: "noncurrent-versions"
            abort_incomplete_multipart_upload_days: 7
            noncurrent_version_expiration:
              noncurrent_days: 30
        tags:
          Layer: "storage"
          Application: "serverless-api"

    # CloudFront standard logging (v2) delivers through CloudWatch Logs
    # (delivery.logs.amazonaws.com), which would add this statement to the
    # bucket policy itself on first delivery; the s3 component would revert
    # that, so it is declared here (components/terraform/cloudfront/README.md).
    # The bucket is SSE-KMS on kms/main: REQUIREMENTS 1 (allow_log_delivery_s3).
    serverless-api/s3/cdn-logs:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        # <tenant>-<environment>-<stage>-api-cdn-logs. The bucket policy
        # below names the same bucket from the same settings.context values;
        # change both together (vars are not reliably resolved at template
        # time).
        name: "api-cdn-logs"
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}-api-cdn-logs"
        lifecycle_configuration_rules:
          - id: "expire-logs"
            abort_incomplete_multipart_upload_days: 7
            expiration:
              days: 90
            noncurrent_version_expiration:
              noncurrent_days: 30
        source_policy_documents:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "AWSLogDeliveryWrite",
                  "Effect": "Allow",
                  "Principal": {"Service": "delivery.logs.amazonaws.com"},
                  "Action": "s3:PutObject",
                  "Resource": "arn:aws:s3:::{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}-api-cdn-logs/*",
                  "Condition": {
                    "StringEquals": {
                      "s3:x-amz-acl": "bucket-owner-full-control",
                      "aws:SourceAccount": "{{ .settings.environment.account_id }}"
                    },
                    "ArnLike": {"aws:SourceArn": "arn:aws:logs:us-east-1:{{ .settings.environment.account_id }}:delivery-source:*"}
                  }
                },
                {
                  "Sid": "AWSLogDeliveryAclCheck",
                  "Effect": "Allow",
                  "Principal": {"Service": "delivery.logs.amazonaws.com"},
                  "Action": "s3:GetBucketAcl",
                  "Resource": "arn:aws:s3:::{{ .settings.context.tenant }}-{{ .settings.context.environment }}-{{ .settings.context.stage }}-api-cdn-logs",
                  "Condition": {
                    "StringEquals": {"aws:SourceAccount": "{{ .settings.environment.account_id }}"},
                    "ArnLike": {"aws:SourceArn": "arn:aws:logs:us-east-1:{{ .settings.environment.account_id }}:delivery-source:*"}
                  }
                }
              ]
            }
        tags:
          Layer: "cdn"
          Application: "serverless-api"

    # =========================================================================
    # LAMBDA FUNCTIONS (compute layer)
    # =========================================================================
    # Packages come from s3/lambda-artifacts (REQUIREMENTS 3). Each function
    # is <Environment>-<function_name>; kms/main encrypts its environment and
    # log group. No VPC: every dependency is an AWS API.

    # The API's backend: API Gateway invokes it for ANY / and ANY /{proxy+}
    # (serverless-api/apigateway grants the invoke, so this function does not
    # read the API). It returns the CORS headers itself (AWS_PROXY).
    serverless-api/lambda-api-handler:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "api-handler"
        description: "Main API handler function"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: 'api-handler/{{ required "settings.serverless_api.api_handler_version is required" .settings.serverless_api.api_handler_version }}.zip'

        runtime: "python3.13"
        handler: "app.handler"
        timeout: 30
        memory_size: 512
        architectures:
          - "arm64"
        reserved_concurrent_executions: 100

        layers:
          - '{{ required "settings.serverless_api.powertools_layer_arn is required" .settings.serverless_api.powertools_layer_arn }}'

        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn

        environment_variables:
          ENVIRONMENT: "{{ .settings.context.stage }}"
          TABLE_NAME: !terraform.state serverless-api/dynamodb/main .table_name
          SESSIONS_TABLE_NAME: !terraform.state serverless-api/dynamodb/sessions .table_name
          TASKS_QUEUE_URL: !terraform.state serverless-api/sqs/tasks .queue_url
          NOTIFICATIONS_QUEUE_URL: !terraform.state serverless-api/sqs/notifications .queue_url
          UPLOADS_BUCKET: !terraform.state serverless-api/s3/uploads .bucket_id
          USER_POOL_ID: !terraform.state serverless-api/cognito .user_pool_id
          LOG_LEVEL: "INFO"
          POWERTOOLS_SERVICE_NAME: "{{ .settings.context.tenant }}-{{ .settings.context.stage }}-api"
          POWERTOOLS_METRICS_NAMESPACE: "{{ .settings.context.tenant }}/{{ .settings.context.stage }}/api"

        tracing_mode: "Active"

        # Statements, because this function combines grants on resources read
        # from several instances. Each kms/main grant is scoped by
        # kms:ViaService to the service that uses it.
        iam_policies:
          - sid: Tables
            actions:
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:UpdateItem"
              - "dynamodb:DeleteItem"
              - "dynamodb:Query"
            resources:
              - !terraform.state serverless-api/dynamodb/main .table_arn
              - !terraform.state serverless-api/dynamodb/main '.table_arn + "/index/*"'
              - !terraform.state serverless-api/dynamodb/sessions .table_arn
              - !terraform.state serverless-api/dynamodb/sessions '.table_arn + "/index/*"'
          - sid: TablesKMS
            actions: ["kms:Decrypt", "kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "dynamodb.{{ .vars.region }}.amazonaws.com"
          - sid: SendQueues
            actions: ["sqs:SendMessage", "sqs:GetQueueAttributes"]
            resources:
              - !terraform.state serverless-api/sqs/tasks .queue_arn
              - !terraform.state serverless-api/sqs/notifications .queue_arn
          - sid: SendQueuesKMS
            actions: ["kms:Decrypt", "kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "sqs.{{ .vars.region }}.amazonaws.com"
          # Presigned GET/PUT URLs for uploads are signed with this role, so it
          # needs the object access they grant.
          - sid: Uploads
            actions: ["s3:GetObject", "s3:PutObject"]
            resources:
              - !terraform.state serverless-api/s3/uploads '.bucket_arn + "/*"'
          - sid: UploadsKMS
            actions: ["kms:Decrypt", "kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "s3.{{ .vars.region }}.amazonaws.com"
          - sid: UserPool
            actions:
              - "cognito-idp:AdminGetUser"
              - "cognito-idp:AdminUpdateUserAttributes"
            resources:
              - !terraform.state serverless-api/cognito .user_pool_arn
          # Active tracing: the component attaches no X-Ray policy. These
          # actions take no resource-level permissions.
          - sid: XRay
            actions: ["xray:PutTraceSegments", "xray:PutTelemetryRecords"]
            resources: ["*"]

        tags:
          Layer: "compute"
          Application: "serverless-api"
          Function: "api-handler"

      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          - component: serverless-api/cognito
          - component: serverless-api/dynamodb/main
          - component: serverless-api/dynamodb/sessions
          - component: serverless-api/sqs/tasks
          - component: serverless-api/sqs/notifications
          - component: serverless-api/s3/uploads

    # A custom (TOKEN) authorizer, for a stack that wants one in place of the
    # Cognito authorizer. Disabled: serverless-api/apigateway uses Cognito.
    # To use it, enable it, publish api-authorizer/<version>.zip, set
    # s3_key below to it, and point the apigateway instance's
    # authorizer_type (TOKEN), lambda_authorizer_uri (this function's
    # .function_invoke_arn) and lambda_authorizer_role_arn at it.
    serverless-api/lambda-authorizer:
      metadata:
        component: lambda
        type: real
        enabled: false
      vars:
        function_name: "api-authorizer"
        description: "Custom API authorizer (optional)"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: "api-authorizer/0.0.0.zip"

        runtime: "python3.13"
        handler: "authorizer.handler"
        timeout: 10
        memory_size: 256
        architectures:
          - "arm64"
        reserved_concurrent_executions: 50

        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn

        environment_variables:
          ENVIRONMENT: "{{ .settings.context.stage }}"
          USER_POOL_ID: !terraform.state serverless-api/cognito .user_pool_id
          CLIENT_ID: !terraform.state serverless-api/cognito .client_ids.web

        tracing_mode: "Active"
        iam_policies:
          - sid: XRay
            actions: ["xray:PutTraceSegments", "xray:PutTelemetryRecords"]
            resources: ["*"]

        tags:
          Layer: "compute"
          Application: "serverless-api"
          Function: "authorizer"

      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          - component: serverless-api/cognito

    # Consumes the tasks queue. Failed messages are retried by the queue and,
    # after dlq_max_receive_count receives, moved to its dead-letter queue;
    # ReportBatchItemFailures retries only the failed messages of a batch.
    serverless-api/lambda-async-processor:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "async-processor"
        description: "Processes async tasks from SQS"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: 'async-processor/{{ required "settings.serverless_api.async_processor_version is required" .settings.serverless_api.async_processor_version }}.zip'

        runtime: "python3.13"
        handler: "processor.handler"
        timeout: 300
        memory_size: 1024
        architectures:
          - "arm64"
        reserved_concurrent_executions: 50

        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn

        environment_variables:
          ENVIRONMENT: "{{ .settings.context.stage }}"
          TABLE_NAME: !terraform.state serverless-api/dynamodb/main .table_name
          LOG_LEVEL: "INFO"

        # The component grants the queue's receive/delete and, through
        # event_source_kms_key_arns, kms:Decrypt on its key.
        event_source_mappings:
          sqs:
            event_source_arn: !terraform.state serverless-api/sqs/tasks .queue_arn
            batch_size: 10
            maximum_batching_window_in_seconds: 5
            function_response_types:
              - "ReportBatchItemFailures"
        event_source_kms_key_arns:
          - !terraform.state kms/main .key_arn

        tracing_mode: "Active"

        iam_policies:
          - sid: Table
            actions:
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:UpdateItem"
              - "dynamodb:Query"
            resources:
              - !terraform.state serverless-api/dynamodb/main .table_arn
              - !terraform.state serverless-api/dynamodb/main '.table_arn + "/index/*"'
          - sid: TableKMS
            actions: ["kms:Decrypt", "kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "dynamodb.{{ .vars.region }}.amazonaws.com"
          - sid: XRay
            actions: ["xray:PutTraceSegments", "xray:PutTelemetryRecords"]
            resources: ["*"]

        tags:
          Layer: "compute"
          Application: "serverless-api"
          Function: "async-processor"

      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          - component: serverless-api/dynamodb/main
          - component: serverless-api/sqs/tasks

    # =========================================================================
    # SSL/TLS CERTIFICATES (certificates layer)
    # =========================================================================
    # us-east-1, as CloudFront requires (the stacks run there), validated in
    # the app domain's zone (REQUIREMENTS 5).

    serverless-api/acm:
      metadata:
        component: acm
        type: real
        inherits:
          - acm/defaults
      vars:
        dns_domains:
          api:
            domain_name: 'api.{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}'
            validation_method: "DNS"
          assets:
            domain_name: 'assets.{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}'
            validation_method: "DNS"
        zone_id: !terraform.state '{{ required "settings.serverless_api.dns_component is required" .settings.serverless_api.dns_component }} .zone_ids.{{ required "settings.serverless_api.dns_zone_key is required" .settings.serverless_api.dns_zone_key }}'

        tags:
          Layer: "security"
          Application: "serverless-api"
      dependencies:
        components:
          - component: '{{ required "settings.serverless_api.dns_component is required" .settings.serverless_api.dns_component }}'

    # =========================================================================
    # API GATEWAY (services layer)
    # =========================================================================
    # <Environment>-serverless-api. The custom domain is on this component,
    # as in cloudposse-terraform-components/aws-api-gateway-rest-api (a
    # REGIONAL domain, TLS_1_2, base path mapping and Route53 alias).

    serverless-api/apigateway:
      metadata:
        component: apigateway
        type: real
      vars:
        api_name: "serverless-api"
        description: "Serverless REST API"
        api_type: "REST"
        endpoint_type:
          - "REGIONAL"

        binary_media_types:
          - "application/octet-stream"
          - "image/*"
          - "multipart/form-data"
        minimum_compression_size: 10240

        # The whole API is one Lambda proxy on the root and on {proxy+}, which
        # matches every deeper path. AWS_PROXY passes the request through and
        # returns the function's response, CORS headers included
        # (cors_configuration is HTTP-API-only). One method per verb, not ANY:
        # an ANY behind the authorizer also covers OPTIONS, so a browser's
        # preflight (which carries no Authorization header) would get a 401,
        # and the scopes on one method are OR'd, so read and write could not
        # differ. GET and HEAD take the read or write scope, the other verbs
        # the write scope, and OPTIONS is unauthenticated.
        api_resources:
          - path_part: "{proxy+}"
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/"
            http_method: "HEAD"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/"
            http_method: "POST"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/"
            http_method: "PUT"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/"
            http_method: "PATCH"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/"
            http_method: "DELETE"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/"
            http_method: "OPTIONS"
            authorization: "NONE"
          - resource_path: "/{proxy+}"
            http_method: "GET"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/{proxy+}"
            http_method: "HEAD"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/{proxy+}"
            http_method: "POST"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/{proxy+}"
            http_method: "PUT"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/{proxy+}"
            http_method: "PATCH"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/{proxy+}"
            http_method: "DELETE"
            authorization: "COGNITO_USER_POOLS"
            authorization_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"
          - resource_path: "/{proxy+}"
            http_method: "OPTIONS"
            authorization: "NONE"
        # This component grants API Gateway lambda:InvokeFunction for each
        # (lambda_function_name).
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/"
            http_method: "HEAD"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/"
            http_method: "POST"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/"
            http_method: "PUT"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/"
            http_method: "PATCH"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/"
            http_method: "DELETE"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/"
            http_method: "OPTIONS"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "GET"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "HEAD"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "POST"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "PUT"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "PATCH"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "DELETE"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name
          - resource_path: "/{proxy+}"
            http_method: "OPTIONS"
            integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
            type: "AWS_PROXY"
            uri: !terraform.state serverless-api/lambda-api-handler .function_invoke_arn
            lambda_function_name: !terraform.state serverless-api/lambda-api-handler .function_name

        # Cognito authorizer: an access token carrying a scope the method
        # lists (authorization_scopes above), from any of the pool's clients.
        authorizer_type: "COGNITO_USER_POOLS"
        authorizer_identity_source: "method.request.header.Authorization"
        cognito_user_pool_arns:
          - !terraform.state serverless-api/cognito .user_pool_arn

        # Access logs, on kms/main (allow_cloudwatch_logs).
        enable_logging: true
        log_format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "caller":"$context.identity.caller", "user":"$context.identity.user", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "resourcePath":"$context.resourcePath", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "integrationError":"$context.integrationErrorMessage", "integrationLatency":"$context.integrationLatency" }'
        log_retention_days: 30
        kms_key_id: !terraform.state kms/main .key_arn

        stage_name: "{{ .settings.context.stage }}"

        # Stage throttling (requests per second)
        throttling_rate_limit: 10000
        throttling_burst_limit: 5000

        # One usage plan on the stage. API keys are created per consumer and
        # added to it; methods do not require one.
        create_usage_plan: true
        usage_plan_quota_limit: 10000
        usage_plan_quota_period: "MONTH"
        usage_plan_throttle_burst_limit: 100
        usage_plan_throttle_rate_limit: 50
        create_api_key: false

        tracing_enabled: true

        # serverless-api/waf associates its own ACL with this stage; a stage
        # has one associated ACL, so this component's own WAF stays off.
        enable_waf: false

        # serverless-api/monitoring holds the dashboard and the alarms.
        create_dashboard: false

        domain_name: 'api.{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}'
        certificate_arn: !terraform.state serverless-api/acm .certificate_arns.api
        zone_id: !terraform.state '{{ required "settings.serverless_api.dns_component is required" .settings.serverless_api.dns_component }} .zone_ids.{{ required "settings.serverless_api.dns_zone_key is required" .settings.serverless_api.dns_zone_key }}'

        tags:
          Layer: "api"
          Application: "serverless-api"

      dependencies:
        components:
          # Ordering only: REST stage logging needs the account's CloudWatch
          # role (REQUIREMENTS 2).
          - component: apigateway-account/main
          - component: kms/main
          - component: serverless-api/cognito
          - component: serverless-api/lambda-api-handler
          - component: serverless-api/acm
          - component: '{{ required "settings.serverless_api.dns_component is required" .settings.serverless_api.dns_component }}'

    # =========================================================================
    # WAF (REGIONAL, regional-waf layer)
    # =========================================================================
    # Associated with the API stage, so it deploys after it (deploy-full-stack's
    # regional-waf layer follows services).

    serverless-api/waf:
      metadata:
        component: waf
        type: real
        inherits:
          - waf/defaults
      vars:
        name: "api-waf"
        scope: "REGIONAL"

        # Every stack runs a kms/main instance (catalog/kms/defaults); see
        # stacks/catalog/waf/defaults.yaml for why this is set per REGIONAL
        # instance rather than defaulted.
        kms_key_arn: !terraform.state kms/main .key_arn

        association_resource_arns:
          - !terraform.state serverless-api/apigateway .rest_api_stage_arn

        managed_rule_group_statement_rules:
          - name: "AWSManagedRulesCommonRuleSet"
            priority: 10
          - name: "AWSManagedRulesKnownBadInputsRuleSet"
            priority: 20
          - name: "AWSManagedRulesAmazonIpReputationList"
            priority: 30
          - name: "AWSManagedRulesSQLiRuleSet"
            priority: 40
          - name: "AWSManagedRulesAnonymousIpList"
            priority: 50

        # Viewers reach the stage directly (no CloudFront in front), so the
        # source IP is the viewer's.
        rate_based_statement_rules:
          - name: "RateLimitPerIP"
            priority: 1
            limit: 2000
            aggregate_key_type: "IP"
            action: "block"

        # Deep-merged onto waf/defaults' authorization + cookie redaction: an
        # X-Api-Key header (usage plan keys) is a credential too.
        redacted_fields:
          x_api_key:
            single_header: ["x-api-key"]

        tags:
          Layer: "security"
          Application: "serverless-api"

      dependencies:
        components:
          - component: serverless-api/apigateway
          - component: kms/main

    # =========================================================================
    # CDN (CloudFront, services layer)
    # =========================================================================
    # assets.<app domain> in front of the assets bucket through origin access
    # control. The alias record goes into the app domain's zone (replacing a
    # separate dns instance).

    serverless-api/cloudfront:
      metadata:
        component: cloudfront
        type: real
        inherits:
          - cloudfront/defaults
      vars:
        # <Environment>-api-assets-cdn
        name: "api-assets-cdn"
        origin_bucket_regional_domain_name: !terraform.state serverless-api/s3/assets .bucket_regional_domain_name

        custom_error_response:
          - error_code: 403
            response_code: 404
            response_page_path: "/404.html"
            error_caching_min_ttl: 300
          - error_code: 404
            response_code: 404
            response_page_path: "/404.html"
            error_caching_min_ttl: 300

        aliases:
          - 'assets.{{ required "settings.serverless_api.app_domain_name is required" .settings.serverless_api.app_domain_name }}'
        acm_certificate_arn: !terraform.state serverless-api/acm .certificate_arns.assets
        dns_alias_enabled: true
        parent_zone_id: !terraform.state '{{ required "settings.serverless_api.dns_component is required" .settings.serverless_api.dns_component }} .zone_ids.{{ required "settings.serverless_api.dns_zone_key is required" .settings.serverless_api.dns_zone_key }}'

        # Standard logging (v2) to the template's log bucket
        logging_enabled: true
        access_log_bucket_arn: !terraform.state serverless-api/s3/cdn-logs .bucket_arn
        log_prefix: "assets"

        tags:
          Layer: "cdn"
          Application: "serverless-api"

      dependencies:
        components:
          - component: kms/main
          - component: serverless-api/s3/assets
          - component: serverless-api/s3/cdn-logs
          - component: serverless-api/acm
          - component: '{{ required "settings.serverless_api.dns_component is required" .settings.serverless_api.dns_component }}'

    # =========================================================================
    # MONITORING (monitoring layer)
    # =========================================================================

    serverless-api/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        # <Environment>-serverless-api-<suffix>
        name: "serverless-api"
        # kms/main allows CloudWatch alarms to publish to the encrypted topic
        # (catalog/kms/defaults allow_cloudwatch_alarms).
        kms_key_id: !terraform.state kms/main .key_arn

        # No VPC in this template: no infrastructure dashboard.
        create_dashboard: false
        create_infrastructure_dashboard: false
        certificate_arns: !terraform.state serverless-api/acm .certificate_arns // {} | [.[]]
        certificate_names: !terraform.state serverless-api/acm .certificate_domains // {} | keys
        certificate_domains: !terraform.state serverless-api/acm .certificate_domains // {} | [.[]]

        # REST API metrics are dimensioned by ApiName (the API's real name).
        metric_dashboards:
          api-overview:
            widgets:
              - title: "API Gateway Requests"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/ApiGateway"
                    metric: "Count"
                    dimensions:
                      ApiName: !terraform.state serverless-api/apigateway .api_name
                  - namespace: "AWS/ApiGateway"
                    metric: "4XXError"
                    dimensions:
                      ApiName: !terraform.state serverless-api/apigateway .api_name
                  - namespace: "AWS/ApiGateway"
                    metric: "5XXError"
                    dimensions:
                      ApiName: !terraform.state serverless-api/apigateway .api_name
              - title: "API Handler Duration"
                period: 60
                stat: "p99"
                metrics:
                  - namespace: "AWS/Lambda"
                    metric: "Duration"
                    dimensions:
                      FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
              - title: "Lambda Invocations and Errors"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Lambda"
                    metric: "Invocations"
                    dimensions:
                      FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
                  - namespace: "AWS/Lambda"
                    metric: "Errors"
                    dimensions:
                      FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
                  - namespace: "AWS/Lambda"
                    metric: "Errors"
                    dimensions:
                      FunctionName: !terraform.state serverless-api/lambda-async-processor .function_name
              - title: "DynamoDB Consumed Capacity"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/DynamoDB"
                    metric: "ConsumedReadCapacityUnits"
                    dimensions:
                      TableName: !terraform.state serverless-api/dynamodb/main .table_name
                  - namespace: "AWS/DynamoDB"
                    metric: "ConsumedWriteCapacityUnits"
                    dimensions:
                      TableName: !terraform.state serverless-api/dynamodb/main .table_name
              - title: "Authentication"
                period: 300
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Cognito"
                    metric: "SignInSuccesses"
                    dimensions:
                      UserPool: !terraform.state serverless-api/cognito .user_pool_id
                  - namespace: "AWS/Cognito"
                    metric: "SignUpSuccesses"
                    dimensions:
                      UserPool: !terraform.state serverless-api/cognito .user_pool_id

        # Alarms, named <Environment>-<key>, notifying the monitoring topic.
        metric_alarms:
          api-5xx-errors:
            namespace: "AWS/ApiGateway"
            metric_name: "5XXError"
            dimensions:
              ApiName: !terraform.state serverless-api/apigateway .api_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          api-4xx-errors:
            namespace: "AWS/ApiGateway"
            metric_name: "4XXError"
            dimensions:
              ApiName: !terraform.state serverless-api/apigateway .api_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          api-latency:
            namespace: "AWS/ApiGateway"
            metric_name: "Latency"
            dimensions:
              ApiName: !terraform.state serverless-api/apigateway .api_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5000  # 5 seconds
            evaluation_periods: 3
            period: 300
            extended_statistic: "p99"
          api-handler-errors:
            namespace: "AWS/Lambda"
            metric_name: "Errors"
            dimensions:
              FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          api-handler-throttles:
            namespace: "AWS/Lambda"
            metric_name: "Throttles"
            dimensions:
              FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
            treat_missing_data: "notBreaching"
          api-handler-duration:
            namespace: "AWS/Lambda"
            metric_name: "Duration"
            dimensions:
              FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 25000  # 25 of its 30 seconds
            evaluation_periods: 2
            period: 300
            extended_statistic: "p99"
          async-processor-errors:
            namespace: "AWS/Lambda"
            metric_name: "Errors"
            dimensions:
              FunctionName: !terraform.state serverless-api/lambda-async-processor .function_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          dynamodb-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "ThrottledRequests"
            dimensions:
              TableName: !terraform.state serverless-api/dynamodb/main .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
            treat_missing_data: "notBreaching"
          tasks-dlq-messages:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state serverless-api/sqs/tasks .dead_letter_queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Maximum"
          notifications-dlq-messages:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state serverless-api/sqs/notifications .dead_letter_queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Maximum"

        tags:
          Layer: "monitoring"
          Application: "serverless-api"

      dependencies:
        components:
          - component: kms/main
          - component: serverless-api/acm
          - component: serverless-api/apigateway
          - component: serverless-api/cognito
          - component: serverless-api/lambda-api-handler
          - component: serverless-api/lambda-async-processor
          - component: serverless-api/dynamodb/main
          - component: serverless-api/sqs/tasks
          - component: serverless-api/sqs/notifications

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
# Override the instances' vars in the importing stack, e.g. for production:
#
#   serverless-api/cognito:            deletion_protection: true, mfa_configuration: "ON",
#                                      advanced_security_mode: "ENFORCED"
#   serverless-api/dynamodb/main:      deletion_protection_enabled: true
#   serverless-api/dynamodb/sessions:  deletion_protection_enabled: true
#   serverless-api/lambda-api-handler: memory_size: 1024, reserved_concurrent_executions: 200
#   serverless-api/lambda-async-processor: reserved_concurrent_executions: 100
#   serverless-api/apigateway:         throttling_rate_limit: 20000, throttling_burst_limit: 10000,
#                                      log_retention_days: 90
#   serverless-api/cloudfront:         price_class: "PriceClass_All"
#
# Development: mfa_configuration "OFF", advanced_security_mode "OFF" with
# user_pool_tier "ESSENTIALS" (no per-MAU Plus charge), tracing off
# (apigateway tracing_enabled, the Lambdas' tracing_mode null), and smaller
# reserved concurrency (a new account's concurrency quota is 10, and AWS keeps
# 10 unreserved).

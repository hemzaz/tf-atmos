---
# =============================================================================
# SERVERLESS API STACK TEMPLATE
# =============================================================================
# Complete serverless API platform infrastructure
#
# Architecture:
#   - API Gateway (REST or HTTP)
#   - Lambda functions for API handlers
#   - DynamoDB tables for data storage
#   - Cognito for user authentication
#   - S3 for static assets and uploads
#   - CloudFront for CDN
#   - WAF for API protection
#   - CloudWatch for monitoring and logging
#
# Cost Estimates (Monthly):
#   Development:  ~$10-50/month (minimal traffic)
#   Staging:      ~$50-200/month
#   Production:   ~$200-2,000/month (scales with usage)
#
# Key Benefits:
#   - Zero infrastructure to manage
#   - Pay-per-use pricing
#   - Auto-scaling by default
#   - High availability built-in
#
# Deployment Time: 15-25 minutes
#
# Usage:
#   atmos terraform plan serverless-api -s <tenant>-<account>-<environment>
#   atmos terraform apply serverless-api -s <tenant>-<account>-<environment>
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/iam/defaults
  - catalog/acm/defaults
  - catalog/waf/defaults
  - catalog/monitoring/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # AUTHENTICATION (Cognito)
    # =========================================================================

    serverless-api/cognito:
      metadata:
        component: cognito
        type: real
      vars:
        user_pool_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-users"
        description: "User pool for serverless API authentication"

        # Password policy
        password_policy:
          minimum_length: 12
          require_lowercase: true
          require_uppercase: true
          require_numbers: true
          require_symbols: true
          temporary_password_validity_days: 7

        # MFA configuration
        mfa_configuration: "OPTIONAL"
        software_token_mfa_configuration:
          enabled: true

        # Account recovery
        account_recovery_setting:
          recovery_mechanisms:
            - name: "verified_email"
              priority: 1
            - name: "verified_phone_number"
              priority: 2

        # User attributes
        schema:
          - name: "email"
            attribute_data_type: "String"
            required: true
            mutable: true
            string_attribute_constraints:
              min_length: 5
              max_length: 256
          - name: "name"
            attribute_data_type: "String"
            required: false
            mutable: true
            string_attribute_constraints:
              min_length: 1
              max_length: 256
          - name: "custom:tenant_id"
            attribute_data_type: "String"
            required: false
            mutable: true
            string_attribute_constraints:
              min_length: 1
              max_length: 128

        # Auto-verified attributes
        auto_verified_attributes:
          - "email"

        # Email configuration
        email_configuration:
          email_sending_account: "COGNITO_DEFAULT"
          source_arn: "{{ .vars.ses_source_arn }}"
          from_email_address: "{{ .vars.from_email_address }}"
          reply_to_email_address: "{{ .vars.reply_to_email_address }}"

        # User pool domain
        domain: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
        domain_certificate_arn: "{{ .vars.cognito_domain_certificate_arn }}"

        # App clients
        clients:
          web:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-web-client"
            generate_secret: false
            allowed_oauth_flows:
              - "code"
              - "implicit"
            allowed_oauth_flows_user_pool_client: true
            allowed_oauth_scopes:
              - "email"
              - "openid"
              - "profile"
              - "aws.cognito.signin.user.admin"
            callback_urls:
              - http://localhost:3000/callback
            logout_urls:
              - http://localhost:3000/logout
            supported_identity_providers:
              - "COGNITO"
            explicit_auth_flows:
              - "ALLOW_USER_SRP_AUTH"
              - "ALLOW_REFRESH_TOKEN_AUTH"
            prevent_user_existence_errors: "ENABLED"
            id_token_validity: 60
            access_token_validity: 60
            refresh_token_validity: 30
            token_validity_units:
              id_token: "minutes"
              access_token: "minutes"
              refresh_token: "days"

          mobile:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-mobile-client"
            generate_secret: true
            allowed_oauth_flows:
              - "code"
            allowed_oauth_flows_user_pool_client: true
            allowed_oauth_scopes:
              - "email"
              - "openid"
              - "profile"
            callback_urls:
              - myapp://callback
            logout_urls:
              - myapp://logout
            supported_identity_providers:
              - "COGNITO"
            explicit_auth_flows:
              - "ALLOW_USER_SRP_AUTH"
              - "ALLOW_REFRESH_TOKEN_AUTH"
            prevent_user_existence_errors: "ENABLED"

          api:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-client"
            generate_secret: true
            allowed_oauth_flows:
              - "client_credentials"
            allowed_oauth_flows_user_pool_client: true
            allowed_oauth_scopes:
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/read"
              - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api/write"

        # Resource server (for API scopes)
        resource_servers:
          api:
            identifier: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
            name: "API Resource Server"
            scopes:
              - scope_name: "read"
                scope_description: "Read access to API"
              - scope_name: "write"
                scope_description: "Write access to API"

        # Lambda triggers
        lambda_config:
          pre_sign_up: "{{ .vars.pre_signup_lambda_arn }}"
          post_confirmation: "{{ .vars.post_confirmation_lambda_arn }}"
          pre_token_generation: "{{ .vars.pre_token_generation_lambda_arn }}"
          custom_message: "{{ .vars.custom_message_lambda_arn }}"

        # Advanced security
        user_pool_add_ons:
          advanced_security_mode: "AUDIT"

        # Deletion protection
        deletion_protection: "INACTIVE"

        tags:
          Layer: "authentication"
          Service: "cognito"

    # =========================================================================
    # API GATEWAY
    # =========================================================================

    serverless-api/apigateway:
      metadata:
        component: apigateway
        type: real
      vars:
        api_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-serverless-api"
        description: "Serverless REST API"
        api_type: "REST"

        # Endpoint configuration
        endpoint_type:
          - "REGIONAL"

        # REST API specific configurations
        binary_media_types:
          - "application/octet-stream"
          - "image/*"
          - "multipart/form-data"
        minimum_compression_size: 10240

        # CORS configuration (for HTTP API)
        cors_configuration:
          allow_origins:
            - "https://{{ .vars.app_domain_name }}"
            - "https://www.{{ .vars.app_domain_name }}"
          allow_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "PATCH"
            - "OPTIONS"
          allow_headers:
            - "Content-Type"
            - "Authorization"
            - "X-Api-Key"
            - "X-Amz-Date"
            - "X-Amz-Security-Token"
          expose_headers:
            - "X-Request-Id"
          max_age: 300
          allow_credentials: true

        # Cognito authorizer
        authorizers:
          cognito:
            name: "cognito-authorizer"
            type: "COGNITO_USER_POOLS"
            provider_arns:
              - !terraform.state serverless-api/cognito .user_pool_arn
            identity_source: "method.request.header.Authorization"

        # Logging
        enable_logging: true
        log_format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "caller":"$context.identity.caller", "user":"$context.identity.user", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "resourcePath":"$context.resourcePath", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "integrationError":"$context.integrationErrorMessage", "integrationLatency":"$context.integrationLatency" }'

        # Stage configuration
        stage_name: "{{ .settings.context.environment }}"
        auto_deploy: true

        # Stage variables
        stage_variables:
          # The lifecycle tier the component validates (dev/staging/prod).
          # context.environment is the instance name (`testenv-01`) and fails it.
          environment: "{{ .settings.context.stage }}"
          log_level: "INFO"

        # Throttling (account-level defaults)
        throttle_settings:
          burst_limit: 5000
          rate_limit: 10000

        # API keys and usage plans
        create_api_key: false
        usage_plans:
          basic:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-basic-plan"
            description: "Basic usage plan"
            throttle:
              burst_limit: 100
              rate_limit: 50
            quota:
              limit: 10000
              period: "MONTH"
          premium:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-premium-plan"
            description: "Premium usage plan"
            throttle:
              burst_limit: 500
              rate_limit: 200
            quota:
              limit: 100000
              period: "MONTH"

        # X-Ray tracing
        tracing_enabled: true

        # The serverless-api/waf component below associates its own ACL with
        # this stage's ARN. A stage can only ever have one associated ACL, so
        # this component's own optional WAF (main.tf:445-581) stays off.
        enable_waf: false

        # Request validation
        request_validators:
          all:
            name: "validate-all"
            validate_request_body: true
            validate_request_parameters: true
          body_only:
            name: "validate-body-only"
            validate_request_body: true
            validate_request_parameters: false

        tags:
          Layer: "api"
          Service: "api-gateway"

    # =========================================================================
    # API CUSTOM DOMAIN
    # =========================================================================

      dependencies:
        components:
          - component: serverless-api/cognito
    serverless-api/api-domain:
      metadata:
        component: apigateway-domain
        type: real
      vars:
        domain_name: "api.{{ .vars.app_domain_name }}"
        certificate_arn: !terraform.state serverless-api/acm .certificate_arns.api

        # Base path mapping
        base_path_mappings:
          - api_id: !terraform.state serverless-api/apigateway .api_id
            stage_name: "{{ .settings.context.environment }}"
            base_path: ""

        # Security policy
        security_policy: "TLS_1_2"

        # Endpoint configuration
        endpoint_configuration:
          types:
            - "REGIONAL"

        # Route53 record
        create_route53_record: true
        zone_id: "{{ .vars.route53_zone_id }}"

        tags:
          Layer: "api"
          Service: "custom-domain"

    # =========================================================================
    # SSL/TLS CERTIFICATES
    # =========================================================================

      dependencies:
        components:
          - component: serverless-api/apigateway
          - component: serverless-api/acm
    serverless-api/acm:
      metadata:
        component: acm
        type: real
        inherits:
          - acm/defaults
      vars:
        dns_domains:
          api:
            domain_name: "api.{{ .vars.app_domain_name }}"
            validation_method: "DNS"
          assets:
            domain_name: "assets.{{ .vars.app_domain_name }}"
            validation_method: "DNS"
        zone_id: "{{ .vars.route53_zone_id }}"

        tags:
          Layer: "security"
          Service: "certificates"

    # =========================================================================
    # LAMBDA FUNCTIONS
    # =========================================================================

    serverless-api/lambda-api-handler:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "api-handler"
        description: "Main API handler function"

        # Runtime configuration
        runtime: "python3.13"
        handler: "app.handler"
        timeout: 30
        memory_size: 512

        # Architecture
        architectures:
          - "arm64"

        # Reserved concurrency
        reserved_concurrent_executions: 100

        # Environment variables
        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          TABLE_NAME: !terraform.state serverless-api/dynamodb .table_names.main
          USER_POOL_ID: !terraform.state serverless-api/cognito .user_pool_id
          LOG_LEVEL: "INFO"
          POWERTOOLS_SERVICE_NAME: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
          POWERTOOLS_METRICS_NAMESPACE: "{{ .settings.context.tenant }}/{{ .settings.context.environment }}/api"

        # Layers (AWS Lambda Powertools, etc.)
        layers:
          - "{{ .vars.lambda_powertools_layer_arn }}"

        # X-Ray tracing
        tracing_mode: "Active"

        # CloudWatch logs
        kms_key_id: "{{ .vars.lambda_logs_kms_key_id }}"

        # VPC configuration (optional - for database access)
        subnet_ids: "{{ .vars.private_subnet_ids }}"

        # IAM permissions
        policy_statements:
          dynamodb:
            effect: "Allow"
            actions:
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:UpdateItem"
              - "dynamodb:DeleteItem"
              - "dynamodb:Query"
              - "dynamodb:Scan"
            resources:
              - !terraform.state serverless-api/dynamodb .table_arns.main
              - !terraform.state serverless-api/dynamodb .table_arns.main | . + "/index/*"
          cognito:
            effect: "Allow"
            actions:
              - "cognito-idp:AdminGetUser"
              - "cognito-idp:AdminUpdateUserAttributes"
            resources:
              - !terraform.state serverless-api/cognito .user_pool_arn
          xray:
            effect: "Allow"
            actions:
              - "xray:PutTraceSegments"
              - "xray:PutTelemetryRecords"
            resources:
              - "*"

        # API Gateway integration
        api_gateway_source_arn: !terraform.state serverless-api/apigateway .execution_arn | . + "/*/*/*"

        # Performance alarms
        create_performance_alarms: true
        duration_alarm_threshold: 25000  # 25 seconds
        error_rate_alarm_threshold: 5
        throttle_alarm_threshold: 10
        sns_topic_arn: "{{ .vars.alarm_sns_topic_arn }}"

        tags:
          Layer: "compute"
          Function: "api-handler"

      dependencies:
        components:
          - component: serverless-api/dynamodb
    serverless-api/lambda-authorizer:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "api-authorizer"
        description: "Custom API authorizer (optional)"

        # Runtime configuration
        runtime: "python3.13"
        handler: "authorizer.handler"
        timeout: 10
        memory_size: 256

        # Architecture
        architectures:
          - "arm64"

        # Reserved concurrency
        reserved_concurrent_executions: 50

        # Environment variables
        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          USER_POOL_ID: !terraform.state serverless-api/cognito .user_pool_id
          CLIENT_ID: !terraform.state serverless-api/cognito .client_ids.web

        # X-Ray tracing
        tracing_mode: "Active"

        # CloudWatch logs

        # API Gateway integration
        api_gateway_source_arn: !terraform.state serverless-api/apigateway .execution_arn | . + "/authorizers/*"

        tags:
          Layer: "compute"
          Function: "authorizer"

    serverless-api/lambda-async-processor:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "async-processor"
        description: "Processes async tasks from SQS"

        # Runtime configuration
        runtime: "python3.13"
        handler: "processor.handler"
        timeout: 300
        memory_size: 1024

        # Architecture
        architectures:
          - "arm64"

        # Reserved concurrency
        reserved_concurrent_executions: 50

        # Environment variables
        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          TABLE_NAME: !terraform.state serverless-api/dynamodb .table_names.main
          LOG_LEVEL: "INFO"

        # SQS event source mapping
        event_source_mappings:
          sqs:
            event_source_arn: !terraform.state serverless-api/sqs .queue_arns.tasks
            batch_size: 10
            maximum_batching_window_in_seconds: 5
            function_response_types:
              - "ReportBatchItemFailures"

        # X-Ray tracing
        tracing_mode: "Active"

        # CloudWatch logs

        # Dead letter queue
        dead_letter_target_arn: !terraform.state serverless-api/sqs .queue_arns.dlq

        # IAM permissions
        policy_statements:
          dynamodb:
            effect: "Allow"
            actions:
              - "dynamodb:GetItem"
              - "dynamodb:PutItem"
              - "dynamodb:UpdateItem"
              - "dynamodb:Query"
            resources:
              - !terraform.state serverless-api/dynamodb .table_arns.main
          sqs:
            effect: "Allow"
            actions:
              - "sqs:ReceiveMessage"
              - "sqs:DeleteMessage"
              - "sqs:GetQueueAttributes"
            resources:
              - !terraform.state serverless-api/sqs .queue_arns.tasks
          sqs_dlq:
            effect: "Allow"
            actions:
              - "sqs:SendMessage"
            resources:
              - !terraform.state serverless-api/sqs .queue_arns.dlq

        tags:
          Layer: "compute"
          Function: "async-processor"

    # =========================================================================
    # DATA STORAGE (DynamoDB)
    # =========================================================================

      dependencies:
        components:
          - component: serverless-api/dynamodb
          - component: serverless-api/sqs
    serverless-api/dynamodb:
      metadata:
        component: dynamodb
        type: real
      vars:
        tables:
          # Main application table (single-table design)
          main:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-data"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "pk"
            range_key: "sk"
            attributes:
              - name: "pk"
                type: "S"
              - name: "sk"
                type: "S"
              - name: "gsi1pk"
                type: "S"
              - name: "gsi1sk"
                type: "S"
              - name: "gsi2pk"
                type: "S"
              - name: "gsi2sk"
                type: "S"
            global_secondary_indexes:
              - name: "gsi1"
                hash_key: "gsi1pk"
                range_key: "gsi1sk"
                projection_type: "ALL"
              - name: "gsi2"
                hash_key: "gsi2pk"
                range_key: "gsi2sk"
                projection_type: "KEYS_ONLY"
            local_secondary_indexes: []
            ttl:
              enabled: true
              attribute_name: "ttl"
            point_in_time_recovery: true
            server_side_encryption:
              enabled: true
              kms_key_arn: "{{ .vars.dynamodb_kms_key_arn }}"
            stream_enabled: false
            stream_view_type: "NEW_AND_OLD_IMAGES"
            # Contributor Insights for analysis
            contributor_insights_enabled: false
            # Auto-scaling (for PROVISIONED mode)
            autoscaling:
              enabled: false
              read:
                min_capacity: 5
                max_capacity: 100
                target_utilization: 70
              write:
                min_capacity: 5
                max_capacity: 100
                target_utilization: 70

          # Sessions table (for API sessions/tokens)
          sessions:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-sessions"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "session_id"
            attributes:
              - name: "session_id"
                type: "S"
              - name: "user_id"
                type: "S"
            global_secondary_indexes:
              - name: "user-index"
                hash_key: "user_id"
                projection_type: "ALL"
            ttl:
              enabled: true
              attribute_name: "expires_at"
            point_in_time_recovery: false
            server_side_encryption:
              enabled: true

        tags:
          Layer: "data"
          Service: "dynamodb"

    # =========================================================================
    # MESSAGE QUEUES (SQS)
    # =========================================================================

    serverless-api/sqs:
      metadata:
        component: sqs
        type: real
      vars:
        queues:
          # Task processing queue
          tasks:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-tasks"
            visibility_timeout_seconds: 330  # Lambda timeout + buffer
            message_retention_seconds: 1209600  # 14 days
            max_message_size: 262144  # 256 KB
            delay_seconds: 0
            receive_wait_time_seconds: 20  # Long polling
            content_based_deduplication: false
            fifo_queue: false
            kms_master_key_id: "{{ .vars.sqs_kms_key_id }}"
            kms_data_key_reuse_period_seconds: 300
            redrive_policy:
              dead_letter_target_arn: "dlq"
              max_receive_count: 3

          # Dead letter queue
          dlq:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-dlq"
            visibility_timeout_seconds: 60
            message_retention_seconds: 1209600  # 14 days
            kms_master_key_id: "{{ .vars.sqs_kms_key_id }}"

          # Notifications queue
          notifications:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-notifications"
            visibility_timeout_seconds: 60
            message_retention_seconds: 86400  # 1 day
            kms_master_key_id: "{{ .vars.sqs_kms_key_id }}"
            redrive_policy:
              dead_letter_target_arn: "dlq"
              max_receive_count: 5

        tags:
          Layer: "messaging"
          Service: "sqs"

    # =========================================================================
    # STATIC ASSETS (S3)
    # =========================================================================

    serverless-api/s3-assets:
      metadata:
        component: s3
        type: real
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-assets"
        description: "Static assets and user uploads"

        # Versioning
        versioning_enabled: true

        # Encryption
        server_side_encryption:
          sse_algorithm: "aws:kms"
          kms_master_key_id: "{{ .vars.assets_kms_key_id }}"

        # CORS configuration
        cors_rules:
          - allowed_headers:
              - "*"
            allowed_methods:
              - "GET"
              - "PUT"
              - "POST"
            allowed_origins:
              - "https://{{ .vars.app_domain_name }}"
              - "https://www.{{ .vars.app_domain_name }}"
            expose_headers:
              - "ETag"
            max_age_seconds: 3600

        # Lifecycle rules
        lifecycle_rules:
          - id: "transition-uploads"
            enabled: true
            prefix: "uploads/"
            transitions:
              - days: 30
                storage_class: "STANDARD_IA"
              - days: 90
                storage_class: "GLACIER"
          - id: "expire-temp"
            enabled: true
            prefix: "temp/"
            expiration:
              days: 1

        # Access control
        block_public_access: true

        # Logging
        logging:
          target_bucket: "{{ .vars.log_bucket_name }}"
          target_prefix: "s3-access-logs/assets/"

        # Object lock (for compliance)
        object_lock_enabled: false

        tags:
          Layer: "storage"
          Service: "assets"

    # =========================================================================
    # CDN (CloudFront)
    # =========================================================================

    serverless-api/cloudfront:
      metadata:
        component: cloudfront
        type: real
      vars:
        distribution_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-assets-cdn"

        # Origins
        origins:
          s3:
            domain_name: !terraform.state serverless-api/s3-assets .bucket_regional_domain_name
            origin_id: "s3-assets"
            origin_access_control_id: "{{ .vars.oac_id }}"
            s3_origin_config:
              origin_access_identity: ""

        # Default cache behavior
        default_cache_behavior:
          target_origin_id: "s3-assets"
          viewer_protocol_policy: "redirect-to-https"
          allowed_methods:
            - "GET"
            - "HEAD"
            - "OPTIONS"
          cached_methods:
            - "GET"
            - "HEAD"
          compress: true
          cache_policy_id: "658327ea-f89d-4fab-a63d-7e88639e58f6"  # CachingOptimized
          response_headers_policy_id: "67f7725c-6f97-4210-82d7-5512b31e9d03"  # SecurityHeadersPolicy
          function_associations: []

        # Custom error responses
        custom_error_responses:
          - error_code: 403
            response_code: 404
            response_page_path: "/404.html"
            error_caching_min_ttl: 300
          - error_code: 404
            response_code: 404
            response_page_path: "/404.html"
            error_caching_min_ttl: 300

        # SSL/TLS configuration
        viewer_certificate:
          acm_certificate_arn: !terraform.state serverless-api/acm .certificate_arns.assets
          ssl_support_method: "sni-only"
          minimum_protocol_version: "TLSv1.2_2021"

        # Aliases
        aliases:
          - "assets.{{ .vars.app_domain_name }}"

        # Geographic restrictions
        geo_restriction:
          restriction_type: "none"

        # Logging
        logging:
          enabled: true
          bucket: "{{ .vars.log_bucket_name }}.s3.amazonaws.com"
          prefix: "cloudfront-logs/assets/"
          include_cookies: false

        # Price class
        price_class: "PriceClass_100"

        # HTTP/2 and HTTP/3
        http_version: "http2and3"

        # IPv6
        is_ipv6_enabled: true

        tags:
          Layer: "cdn"
          Service: "cloudfront"

    # =========================================================================
    # WAF
    # =========================================================================

      dependencies:
        components:
          - component: serverless-api/s3-assets
          - component: serverless-api/acm
    serverless-api/waf:
      metadata:
        component: waf
        type: real
        inherits:
          - waf/defaults
      vars:
        name: "api-waf"
        scope: "REGIONAL"

        # Associate with the API Gateway stage. apigateway's own enable_waf is
        # off (see serverless-api/apigateway above) so the stage has exactly
        # one associated ACL, not two.
        association_resource_arns:
          - !terraform.state serverless-api/apigateway .rest_api_stage_arn

        # WAF rules
        managed_rule_group_statement_rules:
          - name: "AWSManagedRulesCommonRuleSet"
            priority: 10
          - name: "AWSManagedRulesKnownBadInputsRuleSet"
            priority: 20
          - name: "AWSManagedRulesAmazonIpReputationList"
            priority: 30
          - name: "AWSManagedRulesSQLiRuleSet"
            priority: 40
          - name: "AWSManagedRulesAnonymousIpList"
            priority: 50

        # Rate limiting
        rate_based_statement_rules:
          - name: "RateLimitPerIP"
            priority: 1
            limit: 2000
            aggregate_key_type: "IP"
            action: "block"

        # Custom rule, ported from this component's earlier (never-built)
        # custom_rules shape onto the waf component's byte_match_statement_rules.
        byte_match_statement_rules:
          - name: "BlockBadUserAgents"
            priority: 5
            action: "block"
            search_string: "curl/"
            positional_constraint: "STARTS_WITH"
            header_name: "user-agent"
            text_transformation_type: "LOWERCASE"

        tags:
          Layer: "security"
          Service: "waf"

    # =========================================================================
    # DNS
    # =========================================================================

      dependencies:
        components:
          - component: serverless-api/apigateway
    serverless-api/dns:
      metadata:
        component: dns
        type: real
      vars:
        zone_id: "{{ .vars.route53_zone_id }}"

        records:
          # Assets CDN
          assets:
            name: "assets.{{ .vars.app_domain_name }}"
            type: "A"
            alias:
              name: !terraform.state serverless-api/cloudfront .domain_name
              zone_id: !terraform.state serverless-api/cloudfront .hosted_zone_id
              evaluate_target_health: false

        tags:
          Layer: "dns"
          Service: "route53"

    # =========================================================================
    # MONITORING
    # =========================================================================

      dependencies:
        components:
          - component: serverless-api/cloudfront
          - component: serverless-api/api-domain
    serverless-api/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        dashboard_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-serverless-api-dashboard"

        # Enable monitoring features
        enable_resource_monitoring: true

        # Custom dashboard
        dashboards:
          api_overview:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-overview"
            widgets:
              # API Gateway metrics
              - type: "metric"
                properties:
                  title: "API Gateway Requests"
                  metrics:
                    - namespace: "AWS/ApiGateway"
                      metric: "Count"
                      dimensions:
                        ApiId: !terraform.state serverless-api/apigateway .api_id
                      stat: "Sum"
                      period: 60
                    - namespace: "AWS/ApiGateway"
                      metric: "4XXError"
                      dimensions:
                        ApiId: !terraform.state serverless-api/apigateway .api_id
                      stat: "Sum"
                      period: 60
                    - namespace: "AWS/ApiGateway"
                      metric: "5XXError"
                      dimensions:
                        ApiId: !terraform.state serverless-api/apigateway .api_id
                      stat: "Sum"
                      period: 60

              # Lambda metrics
              - type: "metric"
                properties:
                  title: "Lambda Performance"
                  metrics:
                    - namespace: "AWS/Lambda"
                      metric: "Duration"
                      dimensions:
                        FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
                      stat: "p99"
                      period: 60
                    - namespace: "AWS/Lambda"
                      metric: "Invocations"
                      dimensions:
                        FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
                      stat: "Sum"
                      period: 60
                    - namespace: "AWS/Lambda"
                      metric: "Errors"
                      dimensions:
                        FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name
                      stat: "Sum"
                      period: 60

              # DynamoDB metrics
              - type: "metric"
                properties:
                  title: "DynamoDB Operations"
                  metrics:
                    - namespace: "AWS/DynamoDB"
                      metric: "ConsumedReadCapacityUnits"
                      dimensions:
                        TableName: !terraform.state serverless-api/dynamodb .table_names.main
                      stat: "Sum"
                      period: 60
                    - namespace: "AWS/DynamoDB"
                      metric: "ConsumedWriteCapacityUnits"
                      dimensions:
                        TableName: !terraform.state serverless-api/dynamodb .table_names.main
                      stat: "Sum"
                      period: 60

              # Cognito metrics
              - type: "metric"
                properties:
                  title: "Authentication"
                  metrics:
                    - namespace: "AWS/Cognito"
                      metric: "SignInSuccesses"
                      dimensions:
                        UserPool: !terraform.state serverless-api/cognito .user_pool_id
                      stat: "Sum"
                      period: 300
                    - namespace: "AWS/Cognito"
                      metric: "SignUpSuccesses"
                      dimensions:
                        UserPool: !terraform.state serverless-api/cognito .user_pool_id
                      stat: "Sum"
                      period: 300

        # Alarms
        alarms:
          # API Gateway alarms
          api_5xx_errors:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-5xx-errors"
            metric_name: "5XXError"
            namespace: "AWS/ApiGateway"
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              ApiId: !terraform.state serverless-api/apigateway .api_id

          api_4xx_errors:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-4xx-errors"
            metric_name: "4XXError"
            namespace: "AWS/ApiGateway"
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              ApiId: !terraform.state serverless-api/apigateway .api_id

          api_latency:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-latency"
            metric_name: "Latency"
            namespace: "AWS/ApiGateway"
            comparison_operator: "GreaterThanThreshold"
            threshold: 5000  # 5 seconds
            evaluation_periods: 3
            period: 300
            statistic: "p99"
            dimensions:
              ApiId: !terraform.state serverless-api/apigateway .api_id

          # Lambda alarms
          lambda_errors:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-lambda-errors"
            metric_name: "Errors"
            namespace: "AWS/Lambda"
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name

          lambda_throttles:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-lambda-throttles"
            metric_name: "Throttles"
            namespace: "AWS/Lambda"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
            dimensions:
              FunctionName: !terraform.state serverless-api/lambda-api-handler .function_name

          # DynamoDB alarms
          dynamodb_throttled:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-dynamodb-throttled"
            metric_name: "ThrottledRequests"
            namespace: "AWS/DynamoDB"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
            dimensions:
              TableName: !terraform.state serverless-api/dynamodb .table_names.main

          # SQS DLQ alarm
          dlq_messages:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-dlq-messages"
            metric_name: "ApproximateNumberOfMessagesVisible"
            namespace: "AWS/SQS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
            dimensions:
              QueueName: !terraform.state serverless-api/sqs .queue_names.dlq

        # SNS notifications
        alarm_notifications_enabled: true
        alarm_email_addresses: []
        sns_topic_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-serverless-api-alarms"

        tags:
          Layer: "monitoring"
          Service: "cloudwatch"


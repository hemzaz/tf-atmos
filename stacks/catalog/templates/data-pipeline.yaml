---
# =============================================================================
# DATA PIPELINE STACK TEMPLATE
# =============================================================================
# Complete data processing pipeline infrastructure
#
# Architecture (streaming path):
#   producers -> kinesis-ingest -> lambda-transformer (enriches from the
#   dynamodb-lookup table) -> kinesis-enriched -> lambda-validator ->
#   kinesis-validated -> firehose-processed (Parquet, partitioned by source)
#   -> s3-processed. firehose-raw also delivers kinesis-ingest as Parquet to
#   s3-raw. Records the Lambdas fail to process go to sqs/stream-dlq.
# Batch path: the daily-etl state machine (EventBridge, 02:00 UTC) runs the
# Glue jobs and an Athena data quality query, then notifies sns/notifications.
#   - Kinesis Data Streams (ingest, enriched, validated)
#   - Lambda functions for transformation and validation
#   - Amazon Data Firehose for delivery to the S3 data lake
#   - Glue catalog, crawlers and ETL jobs; Athena workgroup and saved queries
#   - Step Functions state machines (one instance each) and EventBridge rules
#   - S3 buckets with lifecycle policies, a DynamoDB lookup table
#   - An SNS topic for pipeline notifications, CloudWatch dashboard and alarms
#   - QuickSight for visualization (manual setup, not in this template)
#
# Encryption: the stack's customer managed key, kms/main, encrypts the
# buckets, the streams, the Glue Data Catalog, the Lambdas' environment and
# log groups, the queue, the topics, the table, the state machines and every
# log group here.
#
# Cost Estimates (Monthly):
#   Development:  ~$100-250/month
#   Staging:      ~$300-600/month
#   Production:   ~$800-5,000/month (depending on data volume)
#
# Deployment Time: 20-35 minutes
#
# Usage (instances are data-pipeline/<part>):
#   atmos terraform plan data-pipeline/kinesis-ingest -s <tenant>-<stage>-<environment>
#   atmos workflow deploy -f deploy-full-stack -s <tenant>-<stage>-<environment>
#
# =============================================================================
# REQUIREMENTS FOR THE IMPORTING STACK
# =============================================================================
# 1. A kms/main instance (every fnx org stack has one, in components/security.yaml,
#    from catalog/kms/defaults). This template does not define it: doing so would
#    deep-merge over that stack's own alias_name/description. It must keep the
#    grants catalog/kms/defaults turns on: allow_cloudwatch_logs and
#    allow_log_delivery (the Lambda, Firehose, state machine, EventBridge and
#    Glue log groups) and allow_cloudwatch_alarms (the Lambdas' alarms and the
#    monitoring alarm topic).
# 2. s3/lambda-artifacts (imported below; an fnx org stack imports the same file
#    in components/services.yaml) applied, with
#    pipeline-transformer/<transformer_version>.zip and
#    pipeline-validator/<validator_version>.zip in it, before the Lambdas:
#    deploy-full-stack's storage layer applies it before compute.
# 3. settings.data_pipeline, the inputs this template cannot create:
#      settings:
#        data_pipeline:
#          transformer_version: "1.0.0"   # package keys; bump to deploy new code
#          validator_version: "1.0.0"
#          # Where lambda-validator reads the record schemas (SCHEMA_REGISTRY_URL).
#          schema_registry_url: https://schemas.example.com
#          # The data-quality state machine's checks and the crawler-completion
#          # rule's target, Lambda functions deployed elsewhere.
#          schema_validation_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#          completeness_validation_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#          accuracy_validation_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#          crawler_completion_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#    A missing key fails every describe/plan of the stack with its name
#    (gomplate `required`); `atmos validate stacks` does not render templates.
#    settings.environment.account_id (set by every fnx stage _defaults) builds
#    the ARNs of resources this template names but cannot read from state.
# 4. data-pipeline/glue-database encrypts the Glue Data Catalog with kms/main,
#    one setting per account and region: every other principal reading the
#    catalog in this account and region (Athena users, other jobs, crawlers or
#    roles) needs kms:Decrypt on kms/main. The roles here get it from this
#    template; Athena users get it from data-pipeline/athena's query_policy.
#    Otherwise catalog reads fail, for Firehose silently: conversion cannot load
#    the schema and every record lands under errors/.
# 5. The externally supplied Lambdas (3.) are invoked by the data-quality state
#    machine and the crawler-completion rule; their own permissions are theirs.
# 6. On-call addresses, if any, in data-pipeline/monitoring's
#    alarm_email_subscriptions and data-pipeline/sns/notifications' subscribers.
# 7. S3 access logging is off: the target must be a separate SSE-S3 bucket (S3
#    cannot deliver access logs to an SSE-KMS bucket) and this template has
#    none. Enable it per stack on each bucket instance, e.g.:
#      data-pipeline/s3-raw:
#        vars:
#          logging:
#            bucket_name: "my-log-bucket"
#            prefix: "s3-access-logs/raw/"
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/iam/defaults
  - catalog/monitoring/defaults
  - catalog/kinesis/defaults
  - catalog/s3/defaults
  - catalog/glue/defaults
  - catalog/athena/defaults
  - catalog/firehose/defaults
  - catalog/dynamodb/defaults
  - catalog/sqs/defaults
  - catalog/sns/defaults
  - catalog/stepfunctions/defaults
  - catalog/eventbridge/defaults
  # s3/lambda-artifacts, the stack's lambda package bucket (an fnx org stack
  # imports the same file in components/services.yaml).
  - catalog/s3/lambda-artifacts

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # DATA LAKE STORAGE (S3)
    # =========================================================================

    # Every bucket inherits s3/defaults (imported above), which supplies
    # kms_key_arn (kms/main) and versioning_enabled: true; the s3 component
    # always encrypts with SSE-KMS and blocks public access. Each bucket is
    # "<Environment>-<name>-<account id>" (the s3 component's naming); every
    # reader takes its name or ARN from state. Access logging is off
    # (REQUIREMENTS 7).
    data-pipeline/s3-raw:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "data-lake-raw"

        lifecycle_configuration_rules:
          - id: "transition-to-ia"
            enabled: true
            filter_and:
              prefix: ""
            transition:
              - days: 30
                storage_class: "STANDARD_IA"
              - days: 90
                storage_class: "GLACIER"
            expiration:
              days: 365
            noncurrent_version_transition:
              - days: 30
                storage_class: "GLACIER"
            noncurrent_version_expiration:
              noncurrent_days: 90

        tags:
          DataClassification: "raw"
          DataPipeline: "ingestion"

    data-pipeline/s3-processed:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "data-lake-processed"

        # Lifecycle rules keep processed data longer than raw.
        lifecycle_configuration_rules:
          - id: "transition-to-ia"
            enabled: true
            filter_and:
              prefix: ""
            transition:
              - days: 90
                storage_class: "STANDARD_IA"
              - days: 365
                storage_class: "GLACIER"
            noncurrent_version_expiration:
              noncurrent_days: 180

        tags:
          DataClassification: "processed"
          DataPipeline: "transformation"

    data-pipeline/s3-curated:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "data-lake-curated"

        # Lifecycle rules: analytics data is retained longest of the three.
        lifecycle_configuration_rules:
          - id: "transition-to-ia"
            enabled: true
            filter_and:
              prefix: ""
            transition:
              - days: 180
                storage_class: "STANDARD_IA"
            noncurrent_version_expiration:
              noncurrent_days: 365

        tags:
          DataClassification: "curated"
          DataPipeline: "analytics"

    # Athena query result bucket, read by data-pipeline/athena's
    # output_location below. Separate from s3-curated (which Glue crawls) so
    # Athena's own scratch/result objects never land in a crawled prefix.
    data-pipeline/s3-athena-results:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "athena-results"
        # Query results are reproducible from the source data; a short
        # expiration keeps result storage from growing unbounded.
        versioning_enabled: false
        lifecycle_configuration_rules:
          - id: "expire-old-results"
            enabled: true
            filter_and:
              prefix: ""
            expiration:
              days: 30

        tags:
          DataPipeline: "analytics"
          QueryEngine: "athena"

    # Glue job scripts (uploaded by data-pipeline/glue-database under
    # scripts/<Environment>-data-lake/) and the jobs' --TempDir
    # (temporary/<Environment>-data-lake/). Kept apart from the data lake
    # buckets so no crawler ever catalogs code or Spark scratch files.
    data-pipeline/s3-glue-assets:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "glue-assets"
        lifecycle_configuration_rules:
          - id: "expire-temporary"
            enabled: true
            filter_and:
              prefix: "temporary/"
            expiration:
              days: 7
            noncurrent_version_expiration:
              noncurrent_days: 7
          - id: "expire-old-script-versions"
            enabled: true
            filter_and:
              prefix: "scripts/"
            noncurrent_version_expiration:
              noncurrent_days: 90

        tags:
          DataPipeline: "etl"

    # =========================================================================
    # DATA INGESTION (Kinesis)
    # =========================================================================
    # One stream per instance, "<Environment>-<name>" (the kinesis component's
    # naming, not the <tenant>-<environment>-<suffix> the buckets use),
    # encrypted with kms/main (kinesis/defaults). ON_DEMAND (kinesis/defaults):
    # no shard_count, which the component rejects with ON_DEMAND; switch to
    # stream_mode: PROVISIONED and set shard_count to size a stream explicitly.

    # Producers write here. lambda-transformer reads it through its own
    # enhanced fan-out consumer; firehose-raw reads it with shared throughput
    # (Firehose cannot use a registered consumer, so it has none).
    data-pipeline/kinesis-ingest:
      metadata:
        component: kinesis
        type: real
        inherits:
          - kinesis/defaults
      vars:
        name: "data-ingest"

        # Retention (kinesis/defaults already sets 24; explicit for clarity)
        retention_period: 24

        # Enhanced monitoring
        shard_level_metrics:
          - "IncomingBytes"
          - "IncomingRecords"
          - "OutgoingBytes"
          - "OutgoingRecords"
          - "WriteProvisionedThroughputExceeded"
          - "ReadProvisionedThroughputExceeded"
          - "IteratorAgeMilliseconds"

        # Enhanced fan-out consumers (aws_kinesis_stream_consumer); the key is
        # the registered consumer name, read back from .consumer_arns.
        consumers:
          lambda_transformer: {}

        tags:
          DataPipeline: "ingestion"
          StreamType: "ingest"

    # Written by lambda-transformer, read by lambda-validator.
    data-pipeline/kinesis-enriched:
      metadata:
        component: kinesis
        type: real
        inherits:
          - kinesis/defaults
      vars:
        name: "data-enriched"

        retention_period: 24

        # Enhanced monitoring
        shard_level_metrics:
          - "IncomingBytes"
          - "IncomingRecords"
          - "OutgoingBytes"
          - "OutgoingRecords"
          - "IteratorAgeMilliseconds"

        tags:
          DataPipeline: "transformation"
          StreamType: "enriched"

    # Written by lambda-validator (the records that pass validation), read by
    # firehose-processed: processed_events holds validated events only.
    data-pipeline/kinesis-validated:
      metadata:
        component: kinesis
        type: real
        inherits:
          - kinesis/defaults
      vars:
        name: "data-validated"

        retention_period: 24

        # Enhanced monitoring
        shard_level_metrics:
          - "IncomingBytes"
          - "IncomingRecords"
          - "OutgoingBytes"
          - "OutgoingRecords"
          - "IteratorAgeMilliseconds"

        tags:
          DataPipeline: "validation"
          StreamType: "validated"

    # =========================================================================
    # LOOKUP DATA (DynamoDB)
    # =========================================================================

    # "<Environment>-data-lookup", read by lambda-transformer
    # (ENRICHMENT_TABLE). Encryption with kms/main and point-in-time recovery
    # come from dynamodb/defaults.
    data-pipeline/dynamodb-lookup:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: "data-lookup"
        hash_key: "lookup_type"
        range_key: "lookup_key"
        ttl_enabled: true
        ttl_attribute: "expires_at"

        tags:
          DataPipeline: "enrichment"
          DataStore: "lookup"

    # =========================================================================
    # MESSAGING (SQS, SNS)
    # =========================================================================

    # The Lambdas' Kinesis mappings send a record batch's failure metadata
    # (shard, sequence numbers) here once its retries or maximum age run
    # out, so the batch can be replayed from the stream within its retention.
    # Nothing consumes it: failures wait 14 days (the sqs maximum) for an
    # operator; data-pipeline/monitoring alarms on it.
    data-pipeline/sqs/stream-dlq:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: "data-pipeline-stream-dlq"
        message_retention_seconds: 1209600
        tags:
          DataPipeline: "ingestion"

    # The daily-etl state machine publishes SUCCESS / FAILED here, and the
    # Lambdas' performance alarms notify it (cloudwatch.amazonaws.com may
    # publish; kms/main's allow_cloudwatch_alarms lets it use the key).
    # Subscribe consumers per stack (REQUIREMENTS 6), e.g.:
    #   data-pipeline/sns/notifications:
    #     vars:
    #       subscribers:
    #         ops:
    #           protocol: email
    #           endpoint: ops@example.com
    data-pipeline/sns/notifications:
      metadata:
        component: sns
        type: real
        inherits:
          - sns/defaults
      vars:
        name: "data-pipeline-notifications"
        allowed_aws_services_for_sns_published:
          - "cloudwatch.amazonaws.com"
        tags:
          DataPipeline: "orchestration"

    # =========================================================================
    # DATA TRANSFORMATION (Lambda)
    # =========================================================================
    # Both functions are "<Environment>-<function_name>", packaged in
    # s3/lambda-artifacts as <function_name>/<version>.zip (REQUIREMENTS 2), with
    # the stack key for their environment and log group. No VPC: they reach
    # Kinesis, DynamoDB and S3 through the AWS endpoints. The component
    # derives each mapping's read grant from its ARN, and kms:Decrypt on the
    # streams' key from event_source_kms_key_arns.

    data-pipeline/lambda-transformer:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "pipeline-transformer"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: 'pipeline-transformer/{{ required "settings.data_pipeline.transformer_version is required" .settings.data_pipeline.transformer_version }}.zip'

        # Runtime configuration
        runtime: "python3.13"
        handler: "handler.process_records"
        timeout: 300
        memory_size: 1024

        # Reserved concurrency
        reserved_concurrent_executions: 100

        # Environment variables and the function's log group, with the stack key.
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn

        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          OUTPUT_STREAM: !terraform.state data-pipeline/kinesis-enriched .stream_name
          ENRICHMENT_TABLE: !terraform.state data-pipeline/dynamodb-lookup .table_name
          LOG_LEVEL: "INFO"

        # Reads kinesis-ingest through its enhanced fan-out consumer (dedicated
        # throughput per shard, independent of firehose-raw's reads).
        event_source_mappings:
          kinesis:
            event_source_arn: !terraform.state data-pipeline/kinesis-ingest .consumer_arns.lambda_transformer
            starting_position: "LATEST"
            batch_size: 100
            maximum_batching_window_in_seconds: 5
            parallelization_factor: 10
            maximum_retry_attempts: 3
            maximum_record_age_in_seconds: 3600
            bisect_batch_on_function_error: true
            destination_config:
              on_failure:
                destination_arn: !terraform.state data-pipeline/sqs/stream-dlq .queue_arn
        event_source_kms_key_arns:
          - !terraform.state kms/main .key_arn
        # The dead-letter queue is encrypted with kms/main (sqs/defaults).
        delivery_kms_key_arn: !terraform.state kms/main .key_arn

        # X-Ray tracing
        tracing_mode: "Active"

        # Writes kinesis-enriched (OUTPUT_STREAM), the statements of that
        # stream's writer_policy output, and reads the lookup table
        # (ENRICHMENT_TABLE); both are encrypted with kms/main. Statements, not
        # custom_policy: !terraform.state returns a JSON-string output such as
        # writer_policy as an object (Atmos re-reads the value as YAML), which
        # custom_policy (a string) rejects.
        iam_policies:
          - sid: WriteEnrichedStream
            actions: ["kinesis:PutRecord", "kinesis:PutRecords", "kinesis:DescribeStreamSummary"]
            resources:
              - !terraform.state data-pipeline/kinesis-enriched .stream_arn
          - sid: WriteEnrichedStreamKMS
            actions: ["kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "kinesis.{{ .vars.region }}.amazonaws.com"
              - test: StringEquals
                variable: "kms:EncryptionContext:aws:kinesis:arn"
                values:
                  - !terraform.state data-pipeline/kinesis-enriched .stream_arn
          - sid: ReadLookupTable
            actions: ["dynamodb:GetItem", "dynamodb:BatchGetItem", "dynamodb:Query"]
            resources:
              - !terraform.state data-pipeline/dynamodb-lookup .table_arn
          - sid: ReadLookupTableKMS
            actions: ["kms:Decrypt"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "dynamodb.{{ .vars.region }}.amazonaws.com"

        # Performance alarms
        create_performance_alarms: true
        duration_alarm_threshold: 250000  # 250 seconds
        error_rate_alarm_threshold: 5
        throttle_alarm_threshold: 10
        sns_topic_arn: !terraform.state data-pipeline/sns/notifications .sns_topic_arn

        tags:
          DataPipeline: "transformation"
          Function: "transformer"

      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          - component: data-pipeline/kinesis-ingest
          - component: data-pipeline/kinesis-enriched
          - component: data-pipeline/dynamodb-lookup
          - component: data-pipeline/sqs/stream-dlq
          - component: data-pipeline/sns/notifications

    # Validates kinesis-enriched against the schemas at SCHEMA_REGISTRY_URL:
    # valid records go to kinesis-validated, invalid ones to
    # s3-raw/invalid/ (outside raw_events' data/ location).
    data-pipeline/lambda-validator:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "pipeline-validator"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: 'pipeline-validator/{{ required "settings.data_pipeline.validator_version is required" .settings.data_pipeline.validator_version }}.zip'

        # Runtime configuration
        runtime: "python3.13"
        handler: "handler.validate_records"
        timeout: 60
        memory_size: 512

        # Reserved concurrency
        reserved_concurrent_executions: 50

        # Environment variables and the function's log group, with the stack key.
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn

        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          SCHEMA_REGISTRY_URL: '{{ required "settings.data_pipeline.schema_registry_url is required" .settings.data_pipeline.schema_registry_url }}'
          VALID_RECORDS_STREAM: !terraform.state data-pipeline/kinesis-validated .stream_name
          INVALID_RECORDS_BUCKET: !terraform.state data-pipeline/s3-raw .bucket_name
          INVALID_RECORDS_PREFIX: "invalid/"
          LOG_LEVEL: "INFO"

        # Kinesis event source mapping
        event_source_mappings:
          kinesis:
            event_source_arn: !terraform.state data-pipeline/kinesis-enriched .stream_arn
            starting_position: "LATEST"
            batch_size: 50
            maximum_batching_window_in_seconds: 3
            parallelization_factor: 5
            maximum_retry_attempts: 2
            bisect_batch_on_function_error: true
            destination_config:
              on_failure:
                destination_arn: !terraform.state data-pipeline/sqs/stream-dlq .queue_arn
        event_source_kms_key_arns:
          - !terraform.state kms/main .key_arn
        # The dead-letter queue is encrypted with kms/main (sqs/defaults).
        delivery_kms_key_arn: !terraform.state kms/main .key_arn

        # X-Ray tracing
        tracing_mode: "Active"

        # Writes kinesis-validated (VALID_RECORDS_STREAM), the statements of
        # that stream's writer_policy output (see lambda-transformer for why
        # not custom_policy), and invalid records under s3-raw/invalid/; both
        # are encrypted with kms/main.
        iam_policies:
          - sid: WriteValidatedStream
            actions: ["kinesis:PutRecord", "kinesis:PutRecords", "kinesis:DescribeStreamSummary"]
            resources:
              - !terraform.state data-pipeline/kinesis-validated .stream_arn
          - sid: WriteValidatedStreamKMS
            actions: ["kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "kinesis.{{ .vars.region }}.amazonaws.com"
              - test: StringEquals
                variable: "kms:EncryptionContext:aws:kinesis:arn"
                values:
                  - !terraform.state data-pipeline/kinesis-validated .stream_arn
          - sid: WriteInvalidRecords
            actions: ["s3:PutObject"]
            resources:
              - !terraform.state data-pipeline/s3-raw .bucket_arn | . + "/invalid/*"
          - sid: WriteInvalidRecordsKMS
            actions: ["kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "s3.{{ .vars.region }}.amazonaws.com"

        tags:
          DataPipeline: "validation"
          Function: "validator"

      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          - component: data-pipeline/kinesis-enriched
          - component: data-pipeline/kinesis-validated
          - component: data-pipeline/s3-raw
          - component: data-pipeline/sqs/stream-dlq

    # =========================================================================
    # DATA DELIVERY (Amazon Data Firehose)
    # =========================================================================
    # One delivery stream per instance, "<Environment>-<name>", each with its
    # own delivery and source roles (the firehose component creates them),
    # reading a Kinesis stream and writing Parquet to one bucket. Objects and
    # the delivery log group use kms/main (firehose/defaults). The Glue Data
    # Catalog is encrypted with kms/main (data-pipeline/glue-database), so
    # schema_configuration.kms_key_arn gives the delivery role kms:Decrypt
    # through Glue; without it conversion fails and every record lands under
    # errors/. Conversion needs buffering_size >= 64 and compression_format
    # UNCOMPRESSED (the serializer compresses with SNAPPY).

    # Every ingest record, as Parquet against raw_events' schema, under
    # s3-raw/data/year=/month=/day=/hour=/ (raw_events' partition projection).
    # A Lambda processor can be added with processor_lambda_arn (a lambda
    # instance's .function_arn); none is set, as before.
    data-pipeline/firehose-raw:
      metadata:
        component: firehose
        type: real
        inherits:
          - firehose/defaults
      vars:
        name: "data-lake-raw"

        # Source: kinesis-ingest, encrypted with kms/main.
        kinesis_source_stream_arn: !terraform.state data-pipeline/kinesis-ingest .stream_arn
        kinesis_source_kms_key_arn: !terraform.state kms/main .key_arn

        # S3 destination
        s3_bucket_arn: !terraform.state data-pipeline/s3-raw .bucket_arn
        s3_prefix: "data/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/"
        s3_error_output_prefix: "errors/!{firehose:error-output-type}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        buffering_size: 128
        buffering_interval: 300
        compression_format: "UNCOMPRESSED"

        # Data format conversion (Hive JSON -> Parquet)
        data_format_conversion:
          input_format: "HIVE_JSON"
          compression: "SNAPPY"
          parquet:
            enable_dictionary_compression: true
            max_padding_bytes: 0
            page_size_bytes: 1048576
            writer_version: "V2"
          schema_configuration:
            database_name: !terraform.state data-pipeline/glue-database .database_name
            table_name: !terraform.state data-pipeline/glue-database .table_names.raw_events
            kms_key_arn: !terraform.state kms/main .key_arn

        tags:
          DataPipeline: "delivery"
          Destination: "s3-raw"

      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/kinesis-ingest
          - component: data-pipeline/s3-raw
          - component: data-pipeline/glue-database

    # Validated records, as Parquet against processed_events' schema, under
    # s3-processed/data/source=/year=/month=/day=/: the source partition key is
    # each record's .source (dynamic partitioning).
    data-pipeline/firehose-processed:
      metadata:
        component: firehose
        type: real
        inherits:
          - firehose/defaults
      vars:
        name: "data-lake-processed"

        # Source: kinesis-validated, encrypted with kms/main.
        kinesis_source_stream_arn: !terraform.state data-pipeline/kinesis-validated .stream_arn
        kinesis_source_kms_key_arn: !terraform.state kms/main .key_arn

        # S3 destination
        s3_bucket_arn: !terraform.state data-pipeline/s3-processed .bucket_arn
        s3_prefix: "data/source=!{partitionKeyFromQuery:source}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        s3_error_output_prefix: "errors/!{firehose:error-output-type}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        buffering_size: 128
        buffering_interval: 300
        compression_format: "UNCOMPRESSED"

        # Data format conversion (OpenX JSON -> Parquet)
        data_format_conversion:
          input_format: "OPENX_JSON"
          open_x_json:
            convert_dots_in_json_keys_to_underscores: true
            case_insensitive: true
          compression: "SNAPPY"
          parquet:
            enable_dictionary_compression: true
          schema_configuration:
            database_name: !terraform.state data-pipeline/glue-database .database_name
            table_name: !terraform.state data-pipeline/glue-database .table_names.processed_events
            kms_key_arn: !terraform.state kms/main .key_arn

        # Dynamic partitioning on each record's source field.
        dynamic_partitioning:
          jq_queries:
            source: ".source"
          retry_duration: 300

        tags:
          DataPipeline: "delivery"
          Destination: "s3-processed"

      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/kinesis-validated
          - component: data-pipeline/s3-processed
          - component: data-pipeline/glue-database

    # =========================================================================
    # DATA CATALOG (Glue)
    # =========================================================================
    # The whole Glue side of the pipeline in one glue instance (catalog
    # database, tables, crawlers, ETL jobs, triggers, their shared role and
    # KMS security configuration - see components/terraform/glue/README.md).
    # The instance name predates the component and is kept so the
    # `!terraform.state data-pipeline/glue-database ...` reads elsewhere in
    # this template (firehose, athena, stepfunctions, eventbridge) stay
    # stable; it replaces the former data-pipeline/glue-crawlers instance.
    # deploy-full-stack applies it in the compute layer, after the buckets it
    # reads (storage) and before athena and the state machines (platform) and
    # firehose (data), which read it.
    #
    # Flow: firehose-raw converts ingest records to Parquet against
    # raw_events' schema and writes s3-raw/data/year=/month=/day=/hour=/
    # (raw_events uses partition projection, so Athena sees new hours with
    # no crawl). firehose-processed (the streaming path) writes
    # s3-processed/data/ = processed_events, the one canonical processed
    # table; the processed_data crawler adds its partitions every 6 hours.
    # data-pipeline/stepfunctions/daily-etl (02:00 UTC) runs the transformation job
    # (raw -> processed_events_batch under s3-processed/batch/, registering
    # its partitions through a catalog-updating sink), an Athena data quality
    # query, then the curation job (processed_events, de-duplicated on
    # event_id -> s3-curated/daily_event_summary/), whose success fires the
    # crawl-curated trigger to catalog the curated table.
    #
    # processed_events_batch is the reprocessing/backfill path: it re-derives
    # the same events from s3-raw, so it is kept in its own prefix and table
    # rather than appended to processed_events (which would count every event
    # twice). Nothing reads it by default; point a curation run's
    # --input_path at s3-processed/batch/ to rebuild a day from raw.
    #
    # Day semantics: both jobs process the PREVIOUS UTC day of the run's
    # --date (EventBridge's $.time), so the 02:00 UTC run covers all 24 hours
    # of yesterday. Pass --process_date YYYY-MM-DD (used as-is) to backfill a
    # specific day. Both jobs are idempotent: re-running a day replaces that
    # day's output instead of appending to it.
    data-pipeline/glue-database:
      metadata:
        component: glue
        type: real
        inherits:
          - glue/defaults
      vars:
        name: "data-lake"
        database_description: "Data lake catalog database"

        # Location
        location_uri: !terraform.state data-pipeline/s3-curated .bucket_name | "s3://" + . + "/"

        # The Data Catalog's own metadata and connection-password encryption
        # (kms/main) is one setting per account and region; this is the only
        # glue instance in the template, so it owns it.
        enable_data_catalog_encryption: true

        # Permissions
        create_table_default_permissions:
          - principal:
              data_lake_principal_identifier: "IAM_ALLOWED_PRINCIPALS"
            permissions:
              - "ALL"

        # Job scripts and --TempDir; job inputs/outputs. Buckets the crawlers
        # read (s3 targets, table locations) are granted automatically.
        assets_bucket_name: !terraform.state data-pipeline/s3-glue-assets .bucket_name
        s3_read_buckets:
          - !terraform.state data-pipeline/s3-raw .bucket_name
        s3_write_buckets:
          - !terraform.state data-pipeline/s3-processed .bucket_name
          - !terraform.state data-pipeline/s3-curated .bucket_name

        tables:
          # Written by firehose-raw (Parquet conversion against this schema).
          raw_events:
            description: "Raw ingest events (Parquet, from firehose-raw)"
            location: !terraform.state data-pipeline/s3-raw .bucket_name | "s3://" + . + "/data/"
            input_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
            output_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
            serialization_library: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
            parameters:
              classification: "parquet"
              EXTERNAL: "TRUE"
              # Partition projection: Athena computes the partitions from
              # these ranges; the component derives storage.location.template
              # from the location and partition keys.
              projection.enabled: "true"
              projection.year.type: "integer"
              projection.year.range: "2024,2099"
              projection.month.type: "integer"
              projection.month.range: "1,12"
              projection.month.digits: "2"
              projection.day.type: "integer"
              projection.day.range: "1,31"
              projection.day.digits: "2"
              projection.hour.type: "integer"
              projection.hour.range: "0,23"
              projection.hour.digits: "2"
            columns:
              - name: "event_id"
                type: "string"
              - name: "event_time"
                type: "timestamp"
              - name: "event_type"
                type: "string"
              - name: "source"
                type: "string"
              - name: "user_id"
                type: "string"
              - name: "error_code"
                type: "string"
              - name: "error_message"
                type: "string"
              - name: "payload"
                type: "string"
            partition_keys:
              - name: "year"
                type: "string"
              - name: "month"
                type: "string"
              - name: "day"
                type: "string"
              - name: "hour"
                type: "string"

          # Written by firehose-processed only (the streaming path); the
          # canonical processed table curation reads. Partitioned by source
          # too (firehose-processed's dynamic partitioning), whose values are
          # open-ended, so no projection: the processed_data crawler adds
          # partitions. Firehose delivers at least once, so readers
          # de-duplicate on event_id.
          processed_events:
            description: "Validated events from the streaming path (Parquet, from firehose-processed)"
            location: !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/data/"
            input_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
            output_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
            serialization_library: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
            parameters:
              classification: "parquet"
              EXTERNAL: "TRUE"
            columns:
              - name: "event_id"
                type: "string"
              - name: "event_time"
                type: "timestamp"
              - name: "event_type"
                type: "string"
              - name: "user_id"
                type: "string"
              - name: "error_code"
                type: "string"
              - name: "error_message"
                type: "string"
              - name: "payload"
                type: "string"
            partition_keys:
              - name: "source"
                type: "string"
              - name: "year"
                type: "string"
              - name: "month"
                type: "string"
              - name: "day"
                type: "string"

          # Written by the transformation job only: raw_events re-derived
          # in batch (reprocessing/backfill path). Same schema and
          # partitioning as processed_events, its own prefix so the two
          # never mix; the job's catalog-updating sink registers its
          # partitions (source is open-ended, so no projection).
          processed_events_batch:
            description: "Batch-reprocessed events from raw_events (Parquet, from the transformation job)"
            location: !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/batch/"
            input_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
            output_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
            serialization_library: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
            parameters:
              classification: "parquet"
              EXTERNAL: "TRUE"
            columns:
              - name: "event_id"
                type: "string"
              - name: "event_time"
                type: "timestamp"
              - name: "event_type"
                type: "string"
              - name: "user_id"
                type: "string"
              - name: "error_code"
                type: "string"
              - name: "error_message"
                type: "string"
              - name: "payload"
                type: "string"
            partition_keys:
              - name: "source"
                type: "string"
              - name: "year"
                type: "string"
              - name: "month"
                type: "string"
              - name: "day"
                type: "string"

        crawlers:
          # No raw_events crawler: raw_events uses partition projection, and
          # Athena ignores catalog partitions on a projection table.
          #
          # Adds the processed_events partitions firehose-processed writes
          # (the transformation job registers processed_events_batch's own
          # through its sink). update_behavior LOG: the table is
          # Terraform-owned, so the crawler only adds partitions and logs
          # schema changes instead of rewriting the table (which would drift
          # against every plan).
          processed_data:
            description: "Crawls processed_events (catalog target)"
            schedule: "cron(0 */6 * * ? *)"  # Every 6 hours
            catalog_tables:
              - processed_events
            schema_change_policy:
              delete_behavior: "LOG"
              update_behavior: "LOG"
            # A JSON string (the glue component's crawlers[].configuration).
            configuration: '{"Version": 1.0, "CrawlerOutput": {"Partitions": {"AddOrUpdateBehavior": "InheritFromTable"}}}'

          # Discovers the curation job's output tables (curated_*); run by
          # the crawl-curated trigger after every curation job.
          curated_data:
            description: "Crawls curated data in S3"
            s3_targets:
              - path: !terraform.state data-pipeline/s3-curated .bucket_name | "s3://" + . + "/"
            schema_change_policy:
              delete_behavior: "LOG"
              update_behavior: "UPDATE_IN_DATABASE"
            table_prefix: "curated_"

        # Run by data-pipeline/stepfunctions/daily-etl (glue:startJobRun.sync) with
        # --input_path, --output_path and --date (the run's ISO-8601 time;
        # the jobs process the previous UTC day of it). An optional
        # --process_date YYYY-MM-DD replaces --date and is processed as-is
        # (backfills).
        jobs:
          transformation:
            description: "Raw -> processed_events_batch: drop incomplete and duplicate events, partition by source/day"
            job_bookmark_option: "job-bookmark-disable"  # each run selects its own day
            # --catalog_database is added by the component.
            default_arguments:
              "--output_table": "processed_events_batch"
            script: |
              import sys
              from datetime import date, timedelta

              import boto3
              from awsglue.context import GlueContext
              from awsglue.dynamicframe import DynamicFrame
              from awsglue.job import Job
              from awsglue.utils import getResolvedOptions
              from pyspark.context import SparkContext
              from pyspark.sql import functions as F

              # --date is the run's ISO-8601 start time (EventBridge $.time);
              # the 02:00 UTC run processes the previous, complete UTC day.
              # --process_date YYYY-MM-DD, when given, is processed as-is
              # (backfills) and replaces --date.
              date_arg = "process_date" if "--process_date" in sys.argv else "date"
              args = getResolvedOptions(
                  sys.argv,
                  ["JOB_NAME", "input_path", "output_path", date_arg, "catalog_database", "output_table"],
              )
              glue_context = GlueContext(SparkContext.getOrCreate())
              spark = glue_context.spark_session
              job = Job(glue_context)
              job.init(args["JOB_NAME"], args)

              if date_arg == "process_date":
                  run_day = date.fromisoformat(args["process_date"])
              else:
                  run_day = date.fromisoformat(args["date"][:10]) - timedelta(days=1)
              year, month, day = run_day.isoformat().split("-")
              day_path = args["input_path"] + "year=" + year + "/month=" + month + "/day=" + day + "/"

              events = (
                  spark.read.parquet(day_path)
                  .drop("hour")
                  .dropna(subset=["event_id", "event_time", "source"])
                  .dropDuplicates(["event_id"])
                  .withColumn("year", F.lit(year))
                  .withColumn("month", F.lit(month))
                  .withColumn("day", F.lit(day))
              )

              # Idempotent re-runs: the sink below appends, so first purge
              # this day's existing output under every source= prefix
              # (partitions are source/year/month/day, so the day is one
              # prefix per source). The partitions stay registered and are
              # refilled by the write.
              bucket, _, prefix = args["output_path"][len("s3://"):].partition("/")
              pages = boto3.client("s3").get_paginator("list_objects_v2").paginate(
                  Bucket=bucket, Prefix=prefix, Delimiter="/"
              )
              for page in pages:
                  for source_prefix in page.get("CommonPrefixes", []):
                      glue_context.purge_s3_path(
                          "s3://" + bucket + "/" + source_prefix["Prefix"]
                          + "year=" + year + "/month=" + month + "/day=" + day + "/",
                          {"retentionPeriod": 0},
                      )

              # Writing through a catalog-updating sink registers new
              # processed_events_batch partitions as part of the run.
              sink = glue_context.getSink(
                  connection_type="s3",
                  path=args["output_path"],
                  enableUpdateCatalog=True,
                  updateBehavior="LOG",
                  partitionKeys=["source", "year", "month", "day"],
              )
              sink.setFormat("glueparquet")
              sink.setCatalogInfo(catalogDatabase=args["catalog_database"], catalogTableName=args["output_table"])
              sink.writeFrame(DynamicFrame.fromDF(events, glue_context, "events"))

              job.commit()

          curation:
            description: "Processed -> curated: daily event summary per source and event type"
            job_bookmark_option: "job-bookmark-disable"  # each run selects its own day
            script: |
              import sys
              from datetime import date, timedelta

              from awsglue.context import GlueContext
              from awsglue.job import Job
              from awsglue.utils import getResolvedOptions
              from pyspark.context import SparkContext
              from pyspark.sql import functions as F

              # Same day semantics as transformation: the previous UTC day of
              # --date, or --process_date YYYY-MM-DD as-is (backfills).
              date_arg = "process_date" if "--process_date" in sys.argv else "date"
              args = getResolvedOptions(sys.argv, ["JOB_NAME", "input_path", "output_path", date_arg])
              glue_context = GlueContext(SparkContext.getOrCreate())
              spark = glue_context.spark_session
              # Re-running a day overwrites only that day's event_date partition.
              spark.conf.set("spark.sql.sources.partitionOverwriteMode", "dynamic")
              job = Job(glue_context)
              job.init(args["JOB_NAME"], args)

              if date_arg == "process_date":
                  run_day = date.fromisoformat(args["process_date"])
              else:
                  run_day = date.fromisoformat(args["date"][:10]) - timedelta(days=1)
              run_date = run_day.isoformat()
              year, month, day = run_date.split("-")

              # --input_path is processed_events (the streaming path, the one
              # canonical source). Firehose delivers at least once, so drop
              # duplicate event_ids before counting.
              summary = (
                  spark.read.parquet(args["input_path"])
                  .where((F.col("year") == year) & (F.col("month") == month) & (F.col("day") == day))
                  .dropDuplicates(["event_id"])
                  .groupBy("source", "event_type")
                  .agg(
                      F.count(F.lit(1)).alias("event_count"),
                      F.countDistinct("user_id").alias("unique_users"),
                      F.sum(F.when(F.col("error_code").isNotNull(), 1).otherwise(0)).alias("error_count"),
                  )
                  .withColumn("event_date", F.lit(run_date))
              )

              (
                  summary.write.mode("overwrite")
                  .partitionBy("event_date")
                  .parquet(args["output_path"] + "daily_event_summary/")
              )

              job.commit()

        # The curation job writes plain Parquet, so its success crawls the
        # curated bucket to (re)catalog curated_daily_event_summary.
        triggers:
          crawl-curated:
            description: "Crawl the curated bucket after a successful curation run"
            type: "CONDITIONAL"
            actions:
              - crawler: "curated_data"
            predicate:
              conditions:
                - job: "curation"
                  state: "SUCCEEDED"

        tags:
          DataPipeline: "catalog"
          CatalogType: "database"

      # list_merge_strategy is `replace` (atmos.yaml), so this instance-level
      # dependencies.components REPLACES glue/defaults' own ([kms/main])
      # rather than adding to it - both, plus every bucket read above, must
      # be listed here.
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/s3-raw
          - component: data-pipeline/s3-processed
          - component: data-pipeline/s3-curated
          - component: data-pipeline/s3-glue-assets

    # =========================================================================
    # QUERY ENGINE (Athena)
    # =========================================================================

    # The workgroup "<Environment>-data-pipeline". deploy-full-stack applies it
    # in the platform layer, after glue-database (compute), which it reads;
    # data-pipeline/stepfunctions/daily-etl shares that layer and builds the
    # workgroup name instead of reading it.
    data-pipeline/athena:
      metadata:
        component: athena
        type: real
        inherits:
          - athena/defaults
      vars:
        name: "data-pipeline"
        description: "Athena workgroup for data pipeline queries"

        # Output configuration - the s3-athena-results instance's own bucket,
        # not a bare bucket name: that instance carries this repo's standard
        # bucket hardening (TLS-only policy, public access block, SSE-KMS).
        output_location: !terraform.state data-pipeline/s3-athena-results .bucket_name | "s3://" + . + "/"

        # Configuration (the component always enforces the workgroup's own
        # output location and SSE_KMS encryption)
        publish_cloudwatch_metrics_enabled: true
        bytes_scanned_cutoff_per_query: 10737418240                                     # 10 GB

        # Engine version
        engine_version: "Athena engine version 3"

        # Requester pays (for cross-account queries)
        requester_pays_enabled: false

        # Named queries (saved queries). Athena's own Name field only
        # allows alphanumerics/./_/- (no spaces), so the component computes
        # it from the map key rather than a free-text `name` field - the
        # descriptive titles the original placeholders carried as `name`
        # (e.g. "Daily Summary") now live in `description` instead.
        named_queries:
          daily_summary:
            description: "Daily event summary by source"
            database: !terraform.state data-pipeline/glue-database .database_name
            query: |
              SELECT
                source,
                DATE(event_time) as event_date,
                COUNT(*) as event_count,
                COUNT(DISTINCT user_id) as unique_users
              FROM processed_events
              WHERE year = CAST(YEAR(CURRENT_DATE) AS VARCHAR)
                AND month = LPAD(CAST(MONTH(CURRENT_DATE) AS VARCHAR), 2, '0')
              GROUP BY source, DATE(event_time)
              ORDER BY event_date DESC, event_count DESC

          error_analysis:
            description: "Analyze error patterns"
            database: !terraform.state data-pipeline/glue-database .database_name
            query: |
              SELECT
                error_code,
                error_message,
                COUNT(*) as error_count,
                MIN(event_time) as first_occurrence,
                MAX(event_time) as last_occurrence
              FROM raw_events
              WHERE error_code IS NOT NULL
                AND year = CAST(YEAR(CURRENT_DATE) AS VARCHAR)
              GROUP BY error_code, error_message
              ORDER BY error_count DESC
              LIMIT 100

          data_quality_check:
            description: "Check for data quality issues"
            database: !terraform.state data-pipeline/glue-database .database_name
            query: |
              SELECT
                'null_user_id' as check_name,
                COUNT(*) as issue_count
              FROM processed_events
              WHERE user_id IS NULL
              UNION ALL
              SELECT
                'future_events' as check_name,
                COUNT(*) as issue_count
              FROM processed_events
              WHERE event_time > CURRENT_TIMESTAMP
              UNION ALL
              SELECT
                'missing_required_fields' as check_name,
                COUNT(*) as issue_count
              FROM processed_events
              WHERE event_type IS NULL OR source IS NULL

        # Scope of the query_policy output (for principals running queries
        # here): catalog read on the data lake database, read on the data
        # lake buckets.
        query_database_names:
          - !terraform.state data-pipeline/glue-database .database_name
        query_source_buckets:
          - !terraform.state data-pipeline/s3-raw .bucket_name
          - !terraform.state data-pipeline/s3-processed .bucket_name
          - !terraform.state data-pipeline/s3-curated .bucket_name

        tags:
          DataPipeline: "analytics"
          QueryEngine: "athena"

      # Same list_merge_strategy: replace note as glue-database above.
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/glue-database
          - component: data-pipeline/s3-athena-results
          - component: data-pipeline/s3-raw
          - component: data-pipeline/s3-processed
          - component: data-pipeline/s3-curated

    # =========================================================================
    # WORKFLOW ORCHESTRATION (Step Functions)
    # =========================================================================
    # One state machine per instance, "<Environment>-<name>" (the Cloud Posse
    # aws-step-functions model), its execution role, X-Ray tracing and a log
    # group encrypted with kms/main (stepfunctions/defaults). Each role gets
    # exactly what its Tasks call (iam_policies), and an EventBridge role
    # (events_role_enabled) for the rules below.

    # Daily ETL: the transformation job, an Athena data quality query on
    # processed_events, then the curation job; both jobs process the previous
    # UTC day of $.execution_date (see data-pipeline/glue-database). Crawls are
    # not states: raw_events uses partition projection, the transformation job
    # registers its own processed_events_batch partitions, and glue-database's
    # crawl-curated trigger crawls the curation job's output.
    # data-pipeline/athena shares deploy-full-stack's platform layer, so it is
    # not read from state: its workgroup is "<Environment>-data-pipeline" (its
    # name), and the dependency below applies it first.
    data-pipeline/stepfunctions/daily-etl:
      metadata:
        component: stepfunctions
        type: real
        inherits:
          - stepfunctions/defaults
      vars:
        name: "daily-etl"
        events_role_enabled: true
        definition:
          Comment: "Daily ETL workflow"
          StartAt: "RunTransformationJob"
          States:
            RunTransformationJob:
              Type: "Task"
              Resource: "arn:aws:states:::glue:startJobRun.sync"
              Parameters:
                JobName: !terraform.state data-pipeline/glue-database .job_names.transformation
                Arguments:
                  "--input_path": !terraform.state data-pipeline/s3-raw .bucket_name | "s3://" + . + "/data/"
                  # processed_events_batch (reprocessing path), never
                  # processed_events: see data-pipeline/glue-database.
                  "--output_path": !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/batch/"
                  "--date.$": "$.execution_date"
              ResultPath: "$.transformation"
              Next: "RunDataQualityChecks"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  Next: "NotifyFailure"

            RunDataQualityChecks:
              Type: "Task"
              Resource: "arn:aws:states:::athena:startQueryExecution.sync"
              Parameters:
                QueryString: !terraform.state data-pipeline/glue-database .database_name | "SELECT COUNT(*) FROM " + . + ".processed_events WHERE year = CAST(YEAR(CURRENT_DATE) AS VARCHAR)"
                WorkGroup: "{{ .settings.context.environment }}-data-pipeline"
              ResultPath: "$.data_quality"
              Next: "CreateCuratedDataset"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  Next: "NotifyFailure"

            CreateCuratedDataset:
              Type: "Task"
              Resource: "arn:aws:states:::glue:startJobRun.sync"
              Parameters:
                JobName: !terraform.state data-pipeline/glue-database .job_names.curation
                Arguments:
                  # processed_events (streaming), the canonical source.
                  "--input_path": !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/data/"
                  "--output_path": !terraform.state data-pipeline/s3-curated .bucket_name | "s3://" + . + "/"
                  "--date.$": "$.execution_date"
              Next: "NotifySuccess"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  Next: "NotifyFailure"

            NotifySuccess:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state data-pipeline/sns/notifications .sns_topic_arn
                Message:
                  Status: "SUCCESS"
                  Pipeline: "Daily ETL"
                  ExecutionId.$: "$$.Execution.Id"
                  CompletedAt.$: "$$.State.EnteredTime"
              End: true

            NotifyFailure:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state data-pipeline/sns/notifications .sns_topic_arn
                Message:
                  Status: "FAILED"
                  Pipeline: "Daily ETL"
                  ExecutionId.$: "$$.Execution.Id"
                  Error.$: "$.Error"
                  Cause.$: "$.Cause"
              Next: "FailState"

            FailState:
              Type: "Fail"
              Error: "ETLFailed"
              Cause: "Daily ETL workflow failed"
        iam_policies:
          # glue:startJobRun.sync starts the job and polls its run.
          - sid: RunGlueJobs
            actions: ["glue:StartJobRun", "glue:GetJobRun", "glue:GetJobRuns", "glue:BatchStopJobRun"]
            resources:
              - !terraform.state data-pipeline/glue-database .job_arns.transformation
              - !terraform.state data-pipeline/glue-database .job_arns.curation
          # athena:startQueryExecution.sync runs the query as this role.
          - sid: RunAthenaQuery
            actions:
              - "athena:StartQueryExecution"
              - "athena:GetQueryExecution"
              - "athena:GetQueryResults"
              - "athena:StopQueryExecution"
              - "athena:GetWorkGroup"
            resources:
              - 'arn:aws:athena:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:workgroup/{{ .settings.context.environment }}-data-pipeline'
          - sid: ReadCatalog
            actions: ["glue:GetDatabase", "glue:GetTable", "glue:GetPartition", "glue:GetPartitions", "glue:BatchGetPartition"]
            resources:
              - 'arn:aws:glue:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:catalog'
              - !terraform.state data-pipeline/glue-database .database_arn
              - !terraform.state data-pipeline/glue-database .table_arns.processed_events
          - sid: ReadProcessedData
            actions: ["s3:GetBucketLocation", "s3:ListBucket", "s3:GetObject"]
            resources:
              - !terraform.state data-pipeline/s3-processed .bucket_arn
              - !terraform.state data-pipeline/s3-processed .bucket_arn | . + "/*"
          - sid: WriteQueryResults
            actions:
              - "s3:GetBucketLocation"
              - "s3:ListBucket"
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:AbortMultipartUpload"
              - "s3:ListMultipartUploadParts"
            resources:
              - !terraform.state data-pipeline/s3-athena-results .bucket_arn
              - !terraform.state data-pipeline/s3-athena-results .bucket_arn | . + "/*"
          # The buckets and the Data Catalog are encrypted with kms/main.
          - sid: DataKMS
            actions: ["kms:Decrypt", "kms:GenerateDataKey"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:ViaService"
                values:
                  - "s3.{{ .vars.region }}.amazonaws.com"
                  - "glue.{{ .vars.region }}.amazonaws.com"
          - sid: PublishNotifications
            actions: ["sns:Publish"]
            resources:
              - !terraform.state data-pipeline/sns/notifications .sns_topic_arn
          # The topic is encrypted with kms/main; Publish to it carries the
          # aws:sns:topicArn encryption context, so this grant is scoped to
          # that one topic, not the whole key.
          - sid: PublishNotificationsKMS
            actions: ["kms:GenerateDataKey*", "kms:Decrypt"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:EncryptionContext:aws:sns:topicArn"
                values:
                  - !terraform.state data-pipeline/sns/notifications .sns_topic_arn
        tags:
          DataPipeline: "orchestration"
          Workflow: "daily-etl"
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/glue-database
          - component: data-pipeline/athena
          - component: data-pipeline/s3-raw
          - component: data-pipeline/s3-processed
          - component: data-pipeline/s3-curated
          - component: data-pipeline/s3-athena-results
          - component: data-pipeline/sns/notifications

    # Data quality: three checks, Lambda functions deployed elsewhere
    # (REQUIREMENTS 3). EXPRESS, logging errors only, without execution data.
    data-pipeline/stepfunctions/data-quality:
      metadata:
        component: stepfunctions
        type: real
        inherits:
          - stepfunctions/defaults
      vars:
        name: "data-quality"
        type: "EXPRESS"
        events_role_enabled: true
        logging_configuration:
          level: "ERROR"
          include_execution_data: false
        definition:
          Comment: "Data quality validation"
          StartAt: "ValidateSchema"
          States:
            ValidateSchema:
              Type: "Task"
              Resource: '{{ required "settings.data_pipeline.schema_validation_lambda_arn is required" .settings.data_pipeline.schema_validation_lambda_arn }}'
              Next: "ValidateCompleteness"
            ValidateCompleteness:
              Type: "Task"
              Resource: '{{ required "settings.data_pipeline.completeness_validation_lambda_arn is required" .settings.data_pipeline.completeness_validation_lambda_arn }}'
              Next: "ValidateAccuracy"
            ValidateAccuracy:
              Type: "Task"
              Resource: '{{ required "settings.data_pipeline.accuracy_validation_lambda_arn is required" .settings.data_pipeline.accuracy_validation_lambda_arn }}'
              End: true
        iam_policies:
          - sid: InvokeValidations
            actions: ["lambda:InvokeFunction"]
            resources:
              - "{{ .settings.data_pipeline.schema_validation_lambda_arn }}"
              - "{{ .settings.data_pipeline.schema_validation_lambda_arn }}:*"
              - "{{ .settings.data_pipeline.completeness_validation_lambda_arn }}"
              - "{{ .settings.data_pipeline.completeness_validation_lambda_arn }}:*"
              - "{{ .settings.data_pipeline.accuracy_validation_lambda_arn }}"
              - "{{ .settings.data_pipeline.accuracy_validation_lambda_arn }}:*"
        tags:
          DataPipeline: "orchestration"
          Workflow: "data-quality"

    # =========================================================================
    # SCHEDULING (EventBridge)
    # =========================================================================
    # One rule per instance on the default bus, each "<Environment>-<name>"
    # and logging what it fires on to its own CloudWatch log group (the Cloud
    # Posse aws-eventbridge model). Every instance lists kms/main itself: its
    # own dependencies list replaces the one inherited from
    # eventbridge/defaults. Step Functions targets use the state machine's own
    # events role.

    # Daily ETL at 02:00 UTC; execution_date is the time the schedule fired.
    data-pipeline/eventbridge/daily-etl:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: "daily-etl-trigger"
        cloudwatch_event_rule_description: "Triggers the daily ETL workflow"
        schedule_expression: "cron(0 2 * * ? *)"  # 2 AM UTC daily
        targets:
          daily-etl:
            arn: !terraform.state data-pipeline/stepfunctions/daily-etl .state_machine_arn
            role_arn: !terraform.state data-pipeline/stepfunctions/daily-etl .events_role_arn
            input_transformer:
              input_paths:
                time: "$.time"
              input_template: '{"execution_date": "<time>"}'
        tags:
          DataPipeline: "scheduling"
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/stepfunctions/daily-etl

    # Hourly data quality checks. Off by default (the old rule was DISABLED);
    # set metadata.enabled: true in a stack to run it.
    data-pipeline/eventbridge/hourly-quality-check:
      metadata:
        component: eventbridge
        type: real
        enabled: false
        inherits:
          - eventbridge/defaults
      vars:
        name: "hourly-quality-check"
        cloudwatch_event_rule_description: "Triggers hourly data quality checks"
        schedule_expression: "rate(1 hour)"
        targets:
          data-quality:
            arn: !terraform.state data-pipeline/stepfunctions/data-quality .state_machine_arn
            role_arn: !terraform.state data-pipeline/stepfunctions/data-quality .events_role_arn
        tags:
          DataPipeline: "scheduling"
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/stepfunctions/data-quality

    # This pipeline's crawlers finishing (data-pipeline/glue-database) go to
    # the crawler-completion Lambda (REQUIREMENTS 3); the component adds its
    # invoke permission for this rule.
    data-pipeline/eventbridge/crawler-completion:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: "crawler-completion"
        cloudwatch_event_rule_description: "Handles Glue crawler completion events"
        cloudwatch_event_rule_pattern:
          source:
            - "aws.glue"
          detail-type:
            - "Glue Crawler State Change"
          detail:
            state:
              - "Succeeded"
              - "Failed"
            crawlerName: !terraform.state data-pipeline/glue-database .crawler_names | [.[]]
        targets:
          process-crawler-completion:
            arn: '{{ required "settings.data_pipeline.crawler_completion_lambda_arn is required" .settings.data_pipeline.crawler_completion_lambda_arn }}'
        tags:
          DataPipeline: "scheduling"
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/glue-database

    # =========================================================================
    # MONITORING
    # =========================================================================

    # Resources are "<Environment>-data-pipeline-<suffix>" (name), alarms
    # "<Environment>-<key>", all notifying the instance's KMS-encrypted alarm
    # topic. No VPC in this template, so no infrastructure dashboard.
    data-pipeline/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        name: "data-pipeline"
        kms_key_id: !terraform.state kms/main .key_arn

        # No certificates or VPC in this template.
        enable_certificate_monitoring: false
        create_dashboard: false
        create_infrastructure_dashboard: false

        metric_dashboards:
          data-pipeline-overview:
            widgets:
              - title: "Kinesis Ingestion Rate"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Kinesis"
                    metric: "IncomingRecords"
                    dimensions:
                      StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name
                  - namespace: "AWS/Kinesis"
                    metric: "IncomingBytes"
                    dimensions:
                      StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name
              - title: "Lambda Duration"
                period: 60
                stat: "Average"
                metrics:
                  - namespace: "AWS/Lambda"
                    metric: "Duration"
                    dimensions:
                      FunctionName: !terraform.state data-pipeline/lambda-transformer .function_name
                  - namespace: "AWS/Lambda"
                    metric: "Duration"
                    dimensions:
                      FunctionName: !terraform.state data-pipeline/lambda-validator .function_name
              - title: "Lambda Errors"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Lambda"
                    metric: "Errors"
                    dimensions:
                      FunctionName: !terraform.state data-pipeline/lambda-transformer .function_name
                  - namespace: "AWS/Lambda"
                    metric: "Errors"
                    dimensions:
                      FunctionName: !terraform.state data-pipeline/lambda-validator .function_name
              - title: "Firehose Records Delivered"
                period: 300
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Firehose"
                    metric: "DeliveryToS3.Records"
                    dimensions:
                      DeliveryStreamName: !terraform.state data-pipeline/firehose-raw .delivery_stream_name
                  - namespace: "AWS/Firehose"
                    metric: "DeliveryToS3.Records"
                    dimensions:
                      DeliveryStreamName: !terraform.state data-pipeline/firehose-processed .delivery_stream_name
              - title: "Firehose Delivery Success"
                period: 300
                stat: "Average"
                metrics:
                  - namespace: "AWS/Firehose"
                    metric: "DeliveryToS3.Success"
                    dimensions:
                      DeliveryStreamName: !terraform.state data-pipeline/firehose-raw .delivery_stream_name
                  - namespace: "AWS/Firehose"
                    metric: "DeliveryToS3.Success"
                    dimensions:
                      DeliveryStreamName: !terraform.state data-pipeline/firehose-processed .delivery_stream_name
              - title: "ETL Workflow Status"
                period: 86400
                stat: "Sum"
                metrics:
                  - namespace: "AWS/States"
                    metric: "ExecutionsSucceeded"
                    dimensions:
                      StateMachineArn: !terraform.state data-pipeline/stepfunctions/daily-etl .state_machine_arn
                  - namespace: "AWS/States"
                    metric: "ExecutionsFailed"
                    dimensions:
                      StateMachineArn: !terraform.state data-pipeline/stepfunctions/daily-etl .state_machine_arn
              - title: "Stream Dead-letter Queue Depth"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/SQS"
                    metric: "ApproximateNumberOfMessagesVisible"
                    dimensions:
                      QueueName: !terraform.state data-pipeline/sqs/stream-dlq .queue_name

        metric_alarms:
          pipeline-kinesis-iterator-age:
            namespace: "AWS/Kinesis"
            metric_name: "GetRecords.IteratorAgeMilliseconds"
            dimensions:
              StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 60000  # 1 minute
            evaluation_periods: 3
            period: 300
            statistic: "Maximum"
          pipeline-kinesis-write-throttled:
            namespace: "AWS/Kinesis"
            metric_name: "WriteProvisionedThroughputExceeded"
            dimensions:
              StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          pipeline-transformer-errors:
            namespace: "AWS/Lambda"
            metric_name: "Errors"
            dimensions:
              FunctionName: !terraform.state data-pipeline/lambda-transformer .function_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          pipeline-firehose-raw-freshness:
            namespace: "AWS/Firehose"
            metric_name: "DeliveryToS3.DataFreshness"
            dimensions:
              DeliveryStreamName: !terraform.state data-pipeline/firehose-raw .delivery_stream_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 900  # 15 minutes
            evaluation_periods: 2
            period: 300
            statistic: "Maximum"
          pipeline-firehose-processed-freshness:
            namespace: "AWS/Firehose"
            metric_name: "DeliveryToS3.DataFreshness"
            dimensions:
              DeliveryStreamName: !terraform.state data-pipeline/firehose-processed .delivery_stream_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 900  # 15 minutes
            evaluation_periods: 2
            period: 300
            statistic: "Maximum"
          pipeline-etl-failed:
            namespace: "AWS/States"
            metric_name: "ExecutionsFailed"
            dimensions:
              StateMachineArn: !terraform.state data-pipeline/stepfunctions/daily-etl .state_machine_arn
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 86400
            statistic: "Sum"
          # Record batches the Lambdas gave up on.
          pipeline-stream-dlq:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state data-pipeline/sqs/stream-dlq .queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"

        # On-call addresses per stack (REQUIREMENTS 6).
        alarm_email_subscriptions: []

        tags:
          DataPipeline: "monitoring"
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/kinesis-ingest
          - component: data-pipeline/lambda-transformer
          - component: data-pipeline/lambda-validator
          - component: data-pipeline/firehose-raw
          - component: data-pipeline/firehose-processed
          - component: data-pipeline/stepfunctions/daily-etl
          - component: data-pipeline/sqs/stream-dlq

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES (examples, set on the instances above)
# =============================================================================
#
# Development:
#   data-pipeline/kinesis-*: retention_period 24 (ON_DEMAND, the default)
#   data-pipeline/firehose-*: buffering_size 64, buffering_interval 60
#   data-pipeline/lambda-transformer: memory_size 512,
#     reserved_concurrent_executions 10
#   data-pipeline/athena: bytes_scanned_cutoff_per_query 1073741824  # 1 GB
#
# Staging:
#   data-pipeline/kinesis-*: retention_period 48
#   data-pipeline/lambda-transformer: memory_size 1024,
#     reserved_concurrent_executions 50
#   data-pipeline/athena: bytes_scanned_cutoff_per_query 5368709120  # 5 GB
#
# Production:
#   data-pipeline/kinesis-*: stream_mode PROVISIONED, shard_count 10,
#     retention_period 168  # 7 days
#   data-pipeline/lambda-transformer: memory_size 2048,
#     reserved_concurrent_executions 200
#   data-pipeline/athena: bytes_scanned_cutoff_per_query 107374182400  # 100 GB
#   data-pipeline/eventbridge/hourly-quality-check: metadata.enabled true
#   data-pipeline/lambda-*, data-pipeline/firehose-*: log_retention_days 90

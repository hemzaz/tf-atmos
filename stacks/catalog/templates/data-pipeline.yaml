---
# =============================================================================
# DATA PIPELINE STACK TEMPLATE
# =============================================================================
# Complete data processing pipeline infrastructure
#
# Architecture:
#   - Kinesis Data Streams for real-time ingestion
#   - Lambda functions for data transformation
#   - Kinesis Firehose for delivery to S3 (Data Lake)
#   - Glue Catalog and Crawlers for schema management
#   - Athena for ad-hoc SQL queries
#   - QuickSight for visualization (manual setup required)
#   - EventBridge for pipeline orchestration
#   - Step Functions for complex ETL workflows
#   - S3 buckets with lifecycle policies
#
# Cost Estimates (Monthly):
#   Development:  ~$100-250/month
#   Staging:      ~$300-600/month
#   Production:   ~$800-5,000/month (depending on data volume)
#
# Deployment Time: 20-35 minutes
#
# Usage:
#   atmos terraform plan data-pipeline -s <tenant>-<account>-<environment>
#   atmos terraform apply data-pipeline -s <tenant>-<account>-<environment>
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/iam/defaults
  - catalog/monitoring/defaults
  - catalog/kinesis/defaults
  - catalog/s3/defaults
  - catalog/glue/defaults
  - catalog/athena/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # DATA LAKE STORAGE (S3)
    # =========================================================================

    # The three buckets below inherit s3/defaults (imported above), which
    # supplies kms_key_arn (from kms/main) and versioning_enabled: true; the
    # legacy `server_side_encryption`/`block_public_access*`/
    # `replication_configuration`/`inventory_configuration` inputs below no
    # longer exist on the s3 component (it always encrypts with SSE-KMS,
    # always blocks public access, and does not implement replication or
    # inventory - see components/terraform/s3/README.md) and have been
    # dropped rather than silently ignored. `logging` keeps pointing at the
    # `log_bucket_name` placeholder (documented at the bottom of this file):
    # the s3 component requires that target to be a separate SSE-S3 bucket
    # (S3 cannot deliver access logs to an SSE-KMS bucket), and no such
    # bucket exists in this template yet, so it stays a deployer-supplied
    # input rather than this task standing up a fourth bucket out of scope.
    data-pipeline/s3-raw:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-lake-raw"

        lifecycle_configuration_rules:
          - id: "transition-to-ia"
            enabled: true
            filter_and:
              prefix: ""
            transition:
              - days: 30
                storage_class: "STANDARD_IA"
              - days: 90
                storage_class: "GLACIER"
            expiration:
              days: 365
            noncurrent_version_transition:
              - days: 30
                storage_class: "GLACIER"
            noncurrent_version_expiration:
              noncurrent_days: 90

        logging:
          bucket_name: "{{ .vars.log_bucket_name }}"
          prefix: "s3-access-logs/raw/"

        tags:
          DataClassification: "raw"
          DataPipeline: "ingestion"

    data-pipeline/s3-processed:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-lake-processed"

        # Lifecycle rules keep processed data longer than raw.
        lifecycle_configuration_rules:
          - id: "transition-to-ia"
            enabled: true
            filter_and:
              prefix: ""
            transition:
              - days: 90
                storage_class: "STANDARD_IA"
              - days: 365
                storage_class: "GLACIER"
            noncurrent_version_expiration:
              noncurrent_days: 180

        logging:
          bucket_name: "{{ .vars.log_bucket_name }}"
          prefix: "s3-access-logs/processed/"

        tags:
          DataClassification: "processed"
          DataPipeline: "transformation"

    data-pipeline/s3-curated:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-lake-curated"

        # Lifecycle rules: analytics data is retained longest of the three.
        lifecycle_configuration_rules:
          - id: "transition-to-ia"
            enabled: true
            filter_and:
              prefix: ""
            transition:
              - days: 180
                storage_class: "STANDARD_IA"
            noncurrent_version_expiration:
              noncurrent_days: 365

        logging:
          bucket_name: "{{ .vars.log_bucket_name }}"
          prefix: "s3-access-logs/curated/"

        tags:
          DataClassification: "curated"
          DataPipeline: "analytics"

    # Athena query result bucket, read by data-pipeline/athena's
    # output_location below. Separate from s3-curated (which Glue crawls) so
    # Athena's own scratch/result objects never land in a crawled prefix.
    data-pipeline/s3-athena-results:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-athena-results"
        # Query results are reproducible from the source data; a short
        # expiration keeps result storage from growing unbounded.
        versioning_enabled: false
        lifecycle_configuration_rules:
          - id: "expire-old-results"
            enabled: true
            filter_and:
              prefix: ""
            expiration:
              days: 30

        tags:
          DataPipeline: "analytics"
          QueryEngine: "athena"

    # Glue job scripts (uploaded by data-pipeline/glue-database under
    # scripts/<Environment>-data-lake/) and the jobs' --TempDir
    # (temporary/<Environment>-data-lake/). Kept apart from the data lake
    # buckets so no crawler ever catalogs code or Spark scratch files.
    data-pipeline/s3-glue-assets:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-glue-assets"
        lifecycle_configuration_rules:
          - id: "expire-temporary"
            enabled: true
            filter_and:
              prefix: "temporary/"
            expiration:
              days: 7
            noncurrent_version_expiration:
              noncurrent_days: 7
          - id: "expire-old-script-versions"
            enabled: true
            filter_and:
              prefix: "scripts/"
            noncurrent_version_expiration:
              noncurrent_days: 90

        tags:
          DataPipeline: "etl"

    # =========================================================================
    # DATA INGESTION (Kinesis)
    # =========================================================================

    data-pipeline/kinesis-ingest:
      metadata:
        component: kinesis
        type: real
        inherits:
          - kinesis/defaults
      vars:
        # Stream name is <Environment>-<name> (kinesis component convention,
        # not the tenant-account-environment naming the older, full-name
        # components below use).
        name: "data-ingest"

        # ON_DEMAND (inherited from kinesis/defaults): no shard_count here,
        # since the component's own validation rejects setting shard_count
        # together with ON_DEMAND. Switch to stream_mode: PROVISIONED and add
        # shard_count to size this explicitly.

        # Retention (kinesis/defaults already sets 24; explicit for clarity)
        retention_period: 24

        # Enhanced monitoring
        shard_level_metrics:
          - "IncomingBytes"
          - "IncomingRecords"
          - "OutgoingBytes"
          - "OutgoingRecords"
          - "WriteProvisionedThroughputExceeded"
          - "ReadProvisionedThroughputExceeded"
          - "IteratorAgeMilliseconds"

        # Enhanced fan-out consumers (aws_kinesis_stream_consumer)
        consumers:
          lambda-processor: {}
          firehose-delivery: {}

        tags:
          DataPipeline: "ingestion"
          StreamType: "ingest"

    data-pipeline/kinesis-enriched:
      metadata:
        component: kinesis
        type: real
        inherits:
          - kinesis/defaults
      vars:
        name: "data-enriched"

        retention_period: 24

        # Enhanced monitoring
        shard_level_metrics:
          - "IncomingBytes"
          - "IncomingRecords"
          - "OutgoingBytes"
          - "OutgoingRecords"
          - "IteratorAgeMilliseconds"

        # lambda-transformer both reads kinesis-ingest and writes this
        # stream, but the lambda component's custom_policy accepts only one
        # policy document. Folding kinesis-ingest's reader_policy into this
        # stream's own combined_policy (rather than the other way around, or
        # in a Go template at the YAML layer - see the kinesis component's
        # README) gives lambda-transformer one combined document to read via
        # a single, ordinary !terraform.state call below. writer_policy
        # itself is left untouched by this - it always stays exactly this
        # stream's own write grant.
        additional_policy_json: !terraform.state data-pipeline/kinesis-ingest .reader_policy

        tags:
          DataPipeline: "transformation"
          StreamType: "enriched"

      # list_merge_strategy is `replace` (atmos.yaml), so this instance-level
      # dependencies.components REPLACES kinesis/defaults' own
      # ([kms/main]) rather than adding to it - both must be listed here.
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/kinesis-ingest

    # =========================================================================
    # DATA TRANSFORMATION (Lambda)
    # =========================================================================

    data-pipeline/lambda-transformer:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "data-transformer"
        description: "Transforms and enriches incoming data"

        # Runtime configuration
        runtime: "python3.13"
        handler: "handler.process_records"
        timeout: 300
        memory_size: 1024

        # Reserved concurrency
        reserved_concurrent_executions: 100

        # VPC configuration (if needed for enrichment lookups)
        subnet_ids: "{{ .vars.private_subnet_ids }}"

        # Environment variables
        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          OUTPUT_STREAM: !terraform.state data-pipeline/kinesis-enriched .stream_name
          ENRICHMENT_TABLE: !terraform.state data-pipeline/dynamodb-lookup .table_name
          LOG_LEVEL: "INFO"

        # Kinesis event source mapping
        event_source_mappings:
          kinesis:
            event_source_arn: !terraform.state data-pipeline/kinesis-ingest .stream_arn
            starting_position: "LATEST"
            batch_size: 100
            maximum_batching_window_in_seconds: 5
            parallelization_factor: 10
            maximum_retry_attempts: 3
            maximum_record_age_in_seconds: 3600
            bisect_batch_on_function_error: true
            tumbling_window_in_seconds: 0
            destination_config:
              on_failure:
                destination_arn: "{{ .vars.dlq_arn }}"

        # X-Ray tracing
        tracing_mode: "Active"

        # CloudWatch logs
        kms_key_id: "{{ .vars.lambda_logs_kms_key_id }}"

        # This function is both a consumer and a producer: its event source
        # mapping polls kinesis-ingest (a reader), and its handler calls
        # PutRecord[s] against kinesis-enriched via OUTPUT_STREAM above (a
        # writer). The `lambda` component's custom_policy accepts exactly one
        # IAM policy document, so kinesis-ingest's reader_policy is folded
        # into kinesis-enriched's combined_policy (via that instance's own
        # additional_policy_json, above) rather than merged here - see the
        # kinesis component's README ("Combining grants across two
        # streams") for why. This reads that single, already-combined
        # output (kinesis-enriched's plain writer_policy output intentionally
        # never carries kinesis-ingest's grants, so any other consumer that
        # attaches it stays scoped to kinesis-enriched alone).
        custom_policy: !terraform.state data-pipeline/kinesis-enriched .combined_policy

        # Performance alarms
        create_performance_alarms: true
        duration_alarm_threshold: 250000  # 250 seconds
        error_rate_alarm_threshold: 5
        throttle_alarm_threshold: 10
        sns_topic_arn: "{{ .vars.alarm_sns_topic_arn }}"

        tags:
          DataPipeline: "transformation"
          Function: "transformer"

      dependencies:
        components:
          - component: data-pipeline/kinesis-ingest
          - component: data-pipeline/kinesis-enriched
          - component: data-pipeline/dynamodb-lookup
    data-pipeline/lambda-validator:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "data-validator"
        description: "Validates data schema and quality"

        # Runtime configuration
        runtime: "python3.13"
        handler: "handler.validate_records"
        timeout: 60
        memory_size: 512

        # Reserved concurrency
        reserved_concurrent_executions: 50

        # Environment variables
        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          SCHEMA_REGISTRY_URL: "{{ .vars.schema_registry_url }}"
          VALID_RECORDS_STREAM: "{{ .vars.valid_records_stream_name }}"
          INVALID_RECORDS_BUCKET: !terraform.state data-pipeline/s3-raw .bucket_name
          INVALID_RECORDS_PREFIX: "invalid/"
          LOG_LEVEL: "INFO"

        # Kinesis event source mapping
        event_source_mappings:
          kinesis:
            event_source_arn: !terraform.state data-pipeline/kinesis-enriched .stream_arn
            starting_position: "LATEST"
            batch_size: 50
            maximum_batching_window_in_seconds: 3
            parallelization_factor: 5
            maximum_retry_attempts: 2
            bisect_batch_on_function_error: true

        # X-Ray tracing
        tracing_mode: "Active"

        # Kinesis read actions plus kms:Decrypt on the enriched stream,
        # scoped to that stream alone (kinesis's reader_policy output): this
        # function's intended event source would poll kinesis-enriched with
        # its own execution role, which needs this grant to read an
        # encrypted stream. (The `lambda` component does not yet implement
        # event_source_mappings - see "Out of scope" in the PR - so this
        # grant is forward-looking, wired ahead of that gap being closed.)
        custom_policy: !terraform.state data-pipeline/kinesis-enriched .reader_policy

        tags:
          DataPipeline: "validation"
          Function: "validator"

    # =========================================================================
    # DATA DELIVERY (Kinesis Firehose)
    # =========================================================================

      dependencies:
        components:
          - component: data-pipeline/kinesis-enriched
          - component: data-pipeline/s3-raw
    data-pipeline/firehose-raw:
      metadata:
        component: firehose
        type: real
      vars:
        delivery_stream_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-firehose-raw"
        description: "Delivers raw data to S3 data lake"

        # Source configuration
        kinesis_source_configuration:
          kinesis_stream_arn: !terraform.state data-pipeline/kinesis-ingest .stream_arn
          role_arn: "{{ .vars.firehose_kinesis_role_arn }}"

        # S3 destination
        s3_configuration:
          bucket_arn: !terraform.state data-pipeline/s3-raw .bucket_arn
          prefix: "data/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/"
          error_output_prefix: "errors/!{firehose:error-output-type}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
          buffering_hints:
            size_in_mb: 128
            interval_in_seconds: 300
          compression_format: "GZIP"
          kms_key_arn: !terraform.state kms/main .key_arn

        # Data format conversion (Parquet)
        data_format_conversion:
          enabled: true
          input_format_configuration:
            deserializer:
              hive_json_ser_de: {}
          output_format_configuration:
            serializer:
              parquet_ser_de:
                compression: "SNAPPY"
                enable_dictionary_compression: true
                max_padding_bytes: 0
                page_size_bytes: 1048576
                writer_version: "V2"
          schema_configuration:
            database_name: !terraform.state data-pipeline/glue-database .database_name
            table_name: !terraform.state data-pipeline/glue-database .table_names.raw_events
            region: "{{ .vars.region }}"
            # glue-database sets account-wide Data Catalog encryption
            # (kms/main), so this role needs kms:Decrypt on kms/main as well
            # as glue:GetTable*; without it Firehose cannot read the schema
            # and silently routes every record to errors/.
            role_arn: "{{ .vars.firehose_glue_role_arn }}"

        # CloudWatch logging
        cloudwatch_logging_options:
          enabled: true
          log_group_name: "/aws/kinesisfirehose/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-firehose-raw"
          log_stream_name: "delivery"

        # Processing configuration (optional Lambda transformation)
        processing_configuration:
          enabled: false
          processors:
            - type: "Lambda"
              parameters:
                - name: "LambdaArn"
                  value: "{{ .vars.firehose_transformer_lambda_arn }}"
                - name: "BufferSizeInMBs"
                  value: "1"
                - name: "BufferIntervalInSeconds"
                  value: "60"

        tags:
          DataPipeline: "delivery"
          Destination: "s3-raw"

      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/kinesis-ingest
          - component: data-pipeline/s3-raw
          - component: data-pipeline/glue-database
    data-pipeline/firehose-processed:
      metadata:
        component: firehose
        type: real
      vars:
        delivery_stream_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-firehose-processed"
        description: "Delivers processed data to S3 data lake"

        # Source configuration
        kinesis_source_configuration:
          kinesis_stream_arn: !terraform.state data-pipeline/kinesis-enriched .stream_arn
          role_arn: "{{ .vars.firehose_kinesis_role_arn }}"

        # S3 destination
        s3_configuration:
          bucket_arn: !terraform.state data-pipeline/s3-processed .bucket_arn
          prefix: "data/source=!{partitionKeyFromQuery:source}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
          error_output_prefix: "errors/!{firehose:error-output-type}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
          buffering_hints:
            size_in_mb: 128
            interval_in_seconds: 300
          compression_format: "UNCOMPRESSED"  # Parquet handles compression
          kms_key_arn: !terraform.state kms/main .key_arn

        # Data format conversion (Parquet)
        data_format_conversion:
          enabled: true
          input_format_configuration:
            deserializer:
              open_x_json_ser_de:
                convert_dots_in_json_keys_to_underscores: true
                case_insensitive: true
          output_format_configuration:
            serializer:
              parquet_ser_de:
                compression: "SNAPPY"
                enable_dictionary_compression: true
          schema_configuration:
            database_name: !terraform.state data-pipeline/glue-database .database_name
            table_name: !terraform.state data-pipeline/glue-database .table_names.processed_events
            region: "{{ .vars.region }}"
            # glue-database sets account-wide Data Catalog encryption
            # (kms/main), so this role needs kms:Decrypt on kms/main as well
            # as glue:GetTable*; without it Firehose cannot read the schema
            # and silently routes every record to errors/.
            role_arn: "{{ .vars.firehose_glue_role_arn }}"

        # Dynamic partitioning
        dynamic_partitioning_configuration:
          enabled: true
          retry_options:
            duration_in_seconds: 300

        # CloudWatch logging
        cloudwatch_logging_options:
          enabled: true
          log_group_name: "/aws/kinesisfirehose/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-firehose-processed"
          log_stream_name: "delivery"

        tags:
          DataPipeline: "delivery"
          Destination: "s3-processed"

    # =========================================================================
    # DATA CATALOG (Glue)
    # =========================================================================

      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/kinesis-enriched
          - component: data-pipeline/s3-processed
          - component: data-pipeline/glue-database
    # The whole Glue side of the pipeline in one glue instance (catalog
    # database, tables, crawlers, ETL jobs, triggers, their shared role and
    # KMS security configuration - see components/terraform/glue/README.md).
    # The instance name predates the component and is kept so the
    # `!terraform.state data-pipeline/glue-database ...` reads elsewhere in
    # this template (firehose, athena, step-functions, eventbridge) stay
    # stable; it replaces the former data-pipeline/glue-crawlers instance.
    #
    # Flow: firehose-raw converts ingest records to Parquet against
    # raw_events' schema and writes s3-raw/data/year=/month=/day=/hour=/
    # (raw_events uses partition projection, so Athena sees new hours with
    # no crawl). firehose-processed (the streaming path) writes
    # s3-processed/data/ = processed_events, the one canonical processed
    # table; the processed_data crawler adds its partitions every 6 hours.
    # step-functions' daily ETL (02:00 UTC) runs the transformation job
    # (raw -> processed_events_batch under s3-processed/batch/, registering
    # its partitions through a catalog-updating sink), an Athena data quality
    # query, then the curation job (processed_events, de-duplicated on
    # event_id -> s3-curated/daily_event_summary/), whose success fires the
    # crawl-curated trigger to catalog the curated table.
    #
    # processed_events_batch is the reprocessing/backfill path: it re-derives
    # the same events from s3-raw, so it is kept in its own prefix and table
    # rather than appended to processed_events (which would count every event
    # twice). Nothing reads it by default; point a curation run's
    # --input_path at s3-processed/batch/ to rebuild a day from raw.
    #
    # Day semantics: both jobs process the PREVIOUS UTC day of the run's
    # --date (EventBridge's $.time), so the 02:00 UTC run covers all 24 hours
    # of yesterday. Pass --process_date YYYY-MM-DD (used as-is) to backfill a
    # specific day. Both jobs are idempotent: re-running a day replaces that
    # day's output instead of appending to it.
    data-pipeline/glue-database:
      metadata:
        component: glue
        type: real
        inherits:
          - glue/defaults
      vars:
        name: "data-lake"
        database_description: "Data lake catalog database"

        # Location
        location_uri: !terraform.state data-pipeline/s3-curated .bucket_name | "s3://" + . + "/"

        # The Data Catalog's own metadata and connection-password encryption
        # (kms/main) is one setting per account and region; this is the only
        # glue instance in the template, so it owns it.
        enable_data_catalog_encryption: true

        # Permissions
        create_table_default_permissions:
          - principal:
              data_lake_principal_identifier: "IAM_ALLOWED_PRINCIPALS"
            permissions:
              - "ALL"

        # Job scripts and --TempDir; job inputs/outputs. Buckets the crawlers
        # read (s3 targets, table locations) are granted automatically.
        assets_bucket_name: !terraform.state data-pipeline/s3-glue-assets .bucket_name
        s3_read_buckets:
          - !terraform.state data-pipeline/s3-raw .bucket_name
        s3_write_buckets:
          - !terraform.state data-pipeline/s3-processed .bucket_name
          - !terraform.state data-pipeline/s3-curated .bucket_name

        tables:
          # Written by firehose-raw (Parquet conversion against this schema).
          raw_events:
            description: "Raw ingest events (Parquet, from firehose-raw)"
            location: !terraform.state data-pipeline/s3-raw .bucket_name | "s3://" + . + "/data/"
            input_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
            output_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
            serialization_library: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
            parameters:
              classification: "parquet"
              EXTERNAL: "TRUE"
              # Partition projection: Athena computes the partitions from
              # these ranges; the component derives storage.location.template
              # from the location and partition keys.
              projection.enabled: "true"
              projection.year.type: "integer"
              projection.year.range: "2024,2099"
              projection.month.type: "integer"
              projection.month.range: "1,12"
              projection.month.digits: "2"
              projection.day.type: "integer"
              projection.day.range: "1,31"
              projection.day.digits: "2"
              projection.hour.type: "integer"
              projection.hour.range: "0,23"
              projection.hour.digits: "2"
            columns:
              - name: "event_id"
                type: "string"
              - name: "event_time"
                type: "timestamp"
              - name: "event_type"
                type: "string"
              - name: "source"
                type: "string"
              - name: "user_id"
                type: "string"
              - name: "error_code"
                type: "string"
              - name: "error_message"
                type: "string"
              - name: "payload"
                type: "string"
            partition_keys:
              - name: "year"
                type: "string"
              - name: "month"
                type: "string"
              - name: "day"
                type: "string"
              - name: "hour"
                type: "string"

          # Written by firehose-processed only (the streaming path); the
          # canonical processed table curation reads. Partitioned by source
          # too (firehose-processed's dynamic partitioning), whose values are
          # open-ended, so no projection: the processed_data crawler adds
          # partitions. Firehose delivers at least once, so readers
          # de-duplicate on event_id.
          processed_events:
            description: "Validated events from the streaming path (Parquet, from firehose-processed)"
            location: !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/data/"
            input_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
            output_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
            serialization_library: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
            parameters:
              classification: "parquet"
              EXTERNAL: "TRUE"
            columns:
              - name: "event_id"
                type: "string"
              - name: "event_time"
                type: "timestamp"
              - name: "event_type"
                type: "string"
              - name: "user_id"
                type: "string"
              - name: "error_code"
                type: "string"
              - name: "error_message"
                type: "string"
              - name: "payload"
                type: "string"
            partition_keys:
              - name: "source"
                type: "string"
              - name: "year"
                type: "string"
              - name: "month"
                type: "string"
              - name: "day"
                type: "string"

          # Written by the transformation job only: raw_events re-derived
          # in batch (reprocessing/backfill path). Same schema and
          # partitioning as processed_events, its own prefix so the two
          # never mix; the job's catalog-updating sink registers its
          # partitions (source is open-ended, so no projection).
          processed_events_batch:
            description: "Batch-reprocessed events from raw_events (Parquet, from the transformation job)"
            location: !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/batch/"
            input_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat"
            output_format: "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat"
            serialization_library: "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe"
            parameters:
              classification: "parquet"
              EXTERNAL: "TRUE"
            columns:
              - name: "event_id"
                type: "string"
              - name: "event_time"
                type: "timestamp"
              - name: "event_type"
                type: "string"
              - name: "user_id"
                type: "string"
              - name: "error_code"
                type: "string"
              - name: "error_message"
                type: "string"
              - name: "payload"
                type: "string"
            partition_keys:
              - name: "source"
                type: "string"
              - name: "year"
                type: "string"
              - name: "month"
                type: "string"
              - name: "day"
                type: "string"

        crawlers:
          # No raw_events crawler: raw_events uses partition projection, and
          # Athena ignores catalog partitions on a projection table.
          #
          # Adds the processed_events partitions firehose-processed writes
          # (the transformation job registers processed_events_batch's own
          # through its sink). update_behavior LOG: the table is
          # Terraform-owned, so the crawler only adds partitions and logs
          # schema changes instead of rewriting the table (which would drift
          # against every plan).
          processed_data:
            description: "Crawls processed_events (catalog target)"
            schedule: "cron(0 */6 * * ? *)"  # Every 6 hours
            catalog_tables:
              - processed_events
            schema_change_policy:
              delete_behavior: "LOG"
              update_behavior: "LOG"
            configuration:
              Version: 1.0
              CrawlerOutput:
                Partitions:
                  AddOrUpdateBehavior: "InheritFromTable"

          # Discovers the curation job's output tables (curated_*); run by
          # the crawl-curated trigger after every curation job.
          curated_data:
            description: "Crawls curated data in S3"
            s3_targets:
              - path: !terraform.state data-pipeline/s3-curated .bucket_name | "s3://" + . + "/"
            schema_change_policy:
              delete_behavior: "LOG"
              update_behavior: "UPDATE_IN_DATABASE"
            table_prefix: "curated_"

        # Run by step-functions' daily_etl (glue:startJobRun.sync) with
        # --input_path, --output_path and --date (the run's ISO-8601 time;
        # the jobs process the previous UTC day of it). An optional
        # --process_date YYYY-MM-DD replaces --date and is processed as-is
        # (backfills).
        jobs:
          transformation:
            description: "Raw -> processed_events_batch: drop incomplete and duplicate events, partition by source/day"
            job_bookmark_option: "job-bookmark-disable"  # each run selects its own day
            # --catalog_database is added by the component.
            default_arguments:
              "--output_table": "processed_events_batch"
            script: |
              import sys
              from datetime import date, timedelta

              import boto3
              from awsglue.context import GlueContext
              from awsglue.dynamicframe import DynamicFrame
              from awsglue.job import Job
              from awsglue.utils import getResolvedOptions
              from pyspark.context import SparkContext
              from pyspark.sql import functions as F

              # --date is the run's ISO-8601 start time (EventBridge $.time);
              # the 02:00 UTC run processes the previous, complete UTC day.
              # --process_date YYYY-MM-DD, when given, is processed as-is
              # (backfills) and replaces --date.
              date_arg = "process_date" if "--process_date" in sys.argv else "date"
              args = getResolvedOptions(
                  sys.argv,
                  ["JOB_NAME", "input_path", "output_path", date_arg, "catalog_database", "output_table"],
              )
              glue_context = GlueContext(SparkContext.getOrCreate())
              spark = glue_context.spark_session
              job = Job(glue_context)
              job.init(args["JOB_NAME"], args)

              if date_arg == "process_date":
                  run_day = date.fromisoformat(args["process_date"])
              else:
                  run_day = date.fromisoformat(args["date"][:10]) - timedelta(days=1)
              year, month, day = run_day.isoformat().split("-")
              day_path = args["input_path"] + "year=" + year + "/month=" + month + "/day=" + day + "/"

              events = (
                  spark.read.parquet(day_path)
                  .drop("hour")
                  .dropna(subset=["event_id", "event_time", "source"])
                  .dropDuplicates(["event_id"])
                  .withColumn("year", F.lit(year))
                  .withColumn("month", F.lit(month))
                  .withColumn("day", F.lit(day))
              )

              # Idempotent re-runs: the sink below appends, so first purge
              # this day's existing output under every source= prefix
              # (partitions are source/year/month/day, so the day is one
              # prefix per source). The partitions stay registered and are
              # refilled by the write.
              bucket, _, prefix = args["output_path"][len("s3://"):].partition("/")
              pages = boto3.client("s3").get_paginator("list_objects_v2").paginate(
                  Bucket=bucket, Prefix=prefix, Delimiter="/"
              )
              for page in pages:
                  for source_prefix in page.get("CommonPrefixes", []):
                      glue_context.purge_s3_path(
                          "s3://" + bucket + "/" + source_prefix["Prefix"]
                          + "year=" + year + "/month=" + month + "/day=" + day + "/",
                          {"retentionPeriod": 0},
                      )

              # Writing through a catalog-updating sink registers new
              # processed_events_batch partitions as part of the run.
              sink = glue_context.getSink(
                  connection_type="s3",
                  path=args["output_path"],
                  enableUpdateCatalog=True,
                  updateBehavior="LOG",
                  partitionKeys=["source", "year", "month", "day"],
              )
              sink.setFormat("glueparquet")
              sink.setCatalogInfo(catalogDatabase=args["catalog_database"], catalogTableName=args["output_table"])
              sink.writeFrame(DynamicFrame.fromDF(events, glue_context, "events"))

              job.commit()

          curation:
            description: "Processed -> curated: daily event summary per source and event type"
            job_bookmark_option: "job-bookmark-disable"  # each run selects its own day
            script: |
              import sys
              from datetime import date, timedelta

              from awsglue.context import GlueContext
              from awsglue.job import Job
              from awsglue.utils import getResolvedOptions
              from pyspark.context import SparkContext
              from pyspark.sql import functions as F

              # Same day semantics as transformation: the previous UTC day of
              # --date, or --process_date YYYY-MM-DD as-is (backfills).
              date_arg = "process_date" if "--process_date" in sys.argv else "date"
              args = getResolvedOptions(sys.argv, ["JOB_NAME", "input_path", "output_path", date_arg])
              glue_context = GlueContext(SparkContext.getOrCreate())
              spark = glue_context.spark_session
              # Re-running a day overwrites only that day's event_date partition.
              spark.conf.set("spark.sql.sources.partitionOverwriteMode", "dynamic")
              job = Job(glue_context)
              job.init(args["JOB_NAME"], args)

              if date_arg == "process_date":
                  run_day = date.fromisoformat(args["process_date"])
              else:
                  run_day = date.fromisoformat(args["date"][:10]) - timedelta(days=1)
              run_date = run_day.isoformat()
              year, month, day = run_date.split("-")

              # --input_path is processed_events (the streaming path, the one
              # canonical source). Firehose delivers at least once, so drop
              # duplicate event_ids before counting.
              summary = (
                  spark.read.parquet(args["input_path"])
                  .where((F.col("year") == year) & (F.col("month") == month) & (F.col("day") == day))
                  .dropDuplicates(["event_id"])
                  .groupBy("source", "event_type")
                  .agg(
                      F.count(F.lit(1)).alias("event_count"),
                      F.countDistinct("user_id").alias("unique_users"),
                      F.sum(F.when(F.col("error_code").isNotNull(), 1).otherwise(0)).alias("error_count"),
                  )
                  .withColumn("event_date", F.lit(run_date))
              )

              (
                  summary.write.mode("overwrite")
                  .partitionBy("event_date")
                  .parquet(args["output_path"] + "daily_event_summary/")
              )

              job.commit()

        # The curation job writes plain Parquet, so its success crawls the
        # curated bucket to (re)catalog curated_daily_event_summary.
        triggers:
          crawl-curated:
            description: "Crawl the curated bucket after a successful curation run"
            type: "CONDITIONAL"
            actions:
              - crawler: "curated_data"
            predicate:
              conditions:
                - job: "curation"
                  state: "SUCCEEDED"

        tags:
          DataPipeline: "catalog"
          CatalogType: "database"

      # list_merge_strategy is `replace` (atmos.yaml), so this instance-level
      # dependencies.components REPLACES glue/defaults' own ([kms/main])
      # rather than adding to it - both, plus every bucket read above, must
      # be listed here.
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/s3-raw
          - component: data-pipeline/s3-processed
          - component: data-pipeline/s3-curated
          - component: data-pipeline/s3-glue-assets

    # =========================================================================
    # QUERY ENGINE (Athena)
    # =========================================================================

    data-pipeline/athena:
      metadata:
        component: athena
        type: real
        inherits:
          - athena/defaults
      vars:
        name: "data-pipeline"
        description: "Athena workgroup for data pipeline queries"

        # Output configuration - the s3-athena-results instance's own bucket,
        # not a bare bucket name: that instance carries this repo's standard
        # bucket hardening (TLS-only policy, public access block, SSE-KMS).
        output_location: !terraform.state data-pipeline/s3-athena-results .bucket_name | "s3://" + . + "/"

        # Configuration (the component always enforces the workgroup's own
        # output location and SSE_KMS encryption)
        publish_cloudwatch_metrics_enabled: true
        bytes_scanned_cutoff_per_query: 10737418240                                     # 10 GB

        # Engine version
        engine_version: "Athena engine version 3"

        # Requester pays (for cross-account queries)
        requester_pays_enabled: false

        # Named queries (saved queries). Athena's own Name field only
        # allows alphanumerics/./_/- (no spaces), so the component computes
        # it from the map key rather than a free-text `name` field - the
        # descriptive titles the original placeholders carried as `name`
        # (e.g. "Daily Summary") now live in `description` instead.
        named_queries:
          daily_summary:
            description: "Daily event summary by source"
            database: !terraform.state data-pipeline/glue-database .database_name
            query: |
              SELECT
                source,
                DATE(event_time) as event_date,
                COUNT(*) as event_count,
                COUNT(DISTINCT user_id) as unique_users
              FROM processed_events
              WHERE year = CAST(YEAR(CURRENT_DATE) AS VARCHAR)
                AND month = LPAD(CAST(MONTH(CURRENT_DATE) AS VARCHAR), 2, '0')
              GROUP BY source, DATE(event_time)
              ORDER BY event_date DESC, event_count DESC

          error_analysis:
            description: "Analyze error patterns"
            database: !terraform.state data-pipeline/glue-database .database_name
            query: |
              SELECT
                error_code,
                error_message,
                COUNT(*) as error_count,
                MIN(event_time) as first_occurrence,
                MAX(event_time) as last_occurrence
              FROM raw_events
              WHERE error_code IS NOT NULL
                AND year = CAST(YEAR(CURRENT_DATE) AS VARCHAR)
              GROUP BY error_code, error_message
              ORDER BY error_count DESC
              LIMIT 100

          data_quality_check:
            description: "Check for data quality issues"
            database: !terraform.state data-pipeline/glue-database .database_name
            query: |
              SELECT
                'null_user_id' as check_name,
                COUNT(*) as issue_count
              FROM processed_events
              WHERE user_id IS NULL
              UNION ALL
              SELECT
                'future_events' as check_name,
                COUNT(*) as issue_count
              FROM processed_events
              WHERE event_time > CURRENT_TIMESTAMP
              UNION ALL
              SELECT
                'missing_required_fields' as check_name,
                COUNT(*) as issue_count
              FROM processed_events
              WHERE event_type IS NULL OR source IS NULL

        # Scope of the query_policy output (for principals running queries
        # here): catalog read on the data lake database, read on the data
        # lake buckets.
        query_database_names:
          - !terraform.state data-pipeline/glue-database .database_name
        query_source_buckets:
          - !terraform.state data-pipeline/s3-raw .bucket_name
          - !terraform.state data-pipeline/s3-processed .bucket_name
          - !terraform.state data-pipeline/s3-curated .bucket_name

        tags:
          DataPipeline: "analytics"
          QueryEngine: "athena"

      # Same list_merge_strategy: replace note as glue-database above.
      dependencies:
        components:
          - component: kms/main
          - component: data-pipeline/glue-database
          - component: data-pipeline/s3-athena-results
          - component: data-pipeline/s3-raw
          - component: data-pipeline/s3-processed
          - component: data-pipeline/s3-curated

    # =========================================================================
    # WORKFLOW ORCHESTRATION (Step Functions)
    # =========================================================================

    # The state machines' execution role reads the Glue Data Catalog
    # (the Athena query on processed_events), which
    # data-pipeline/glue-database encrypts account-wide with kms/main: that
    # role needs kms:Decrypt on kms/main, as does every other catalog reader.
    data-pipeline/step-functions:
      metadata:
        component: step-functions
        type: real
      vars:
        state_machines:
          # Daily ETL workflow
          daily_etl:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-daily-etl"
            description: "Daily ETL workflow for data processing"
            type: "STANDARD"
            logging_configuration:
              level: "ALL"
              include_execution_data: true
              log_destination: "arn:aws:logs:{{ .vars.region }}:{{ .vars.account_id }}:log-group:/aws/states/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-daily-etl:*"
            tracing_configuration:
              enabled: true
            definition:
              Comment: "Daily ETL workflow"
              # Crawls are not states here: raw_events uses partition
              # projection, the transformation job registers its own
              # processed_events_batch partitions, and
              # data-pipeline/glue-database's crawl-curated trigger crawls
              # the curation job's output. Both jobs process the previous
              # UTC day of $.execution_date (see data-pipeline/glue-database).
              StartAt: "RunTransformationJob"
              States:
                RunTransformationJob:
                  Type: "Task"
                  Resource: "arn:aws:states:::glue:startJobRun.sync"
                  Parameters:
                    JobName: !terraform.state data-pipeline/glue-database .job_names.transformation
                    Arguments:
                      "--input_path": !terraform.state data-pipeline/s3-raw .bucket_name | "s3://" + . + "/data/"
                      # processed_events_batch (reprocessing path), never
                      # processed_events: see data-pipeline/glue-database.
                      "--output_path": !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/batch/"
                      "--date.$": "$.execution_date"
                  Next: "RunDataQualityChecks"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                RunDataQualityChecks:
                  Type: "Task"
                  Resource: "arn:aws:states:::athena:startQueryExecution.sync"
                  Parameters:
                    QueryString: !terraform.state data-pipeline/glue-database .database_name | "SELECT COUNT(*) FROM " + . + ".processed_events WHERE year = CAST(YEAR(CURRENT_DATE) AS VARCHAR)"
                    WorkGroup: !terraform.state data-pipeline/athena .workgroup_name
                  Next: "CreateCuratedDataset"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                CreateCuratedDataset:
                  Type: "Task"
                  Resource: "arn:aws:states:::glue:startJobRun.sync"
                  Parameters:
                    JobName: !terraform.state data-pipeline/glue-database .job_names.curation
                    Arguments:
                      # processed_events (streaming), the canonical source.
                      "--input_path": !terraform.state data-pipeline/s3-processed .bucket_name | "s3://" + . + "/data/"
                      "--output_path": !terraform.state data-pipeline/s3-curated .bucket_name | "s3://" + . + "/"
                      "--date.$": "$.execution_date"
                  Next: "NotifySuccess"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                NotifySuccess:
                  Type: "Task"
                  Resource: "arn:aws:states:::sns:publish"
                  Parameters:
                    TopicArn: "{{ .vars.data_pipeline_sns_topic_arn }}"
                    Message:
                      Status: "SUCCESS"
                      Pipeline: "Daily ETL"
                      ExecutionId.$: "$$.Execution.Id"
                      CompletedAt.$: "$$.State.EnteredTime"
                  End: true

                NotifyFailure:
                  Type: "Task"
                  Resource: "arn:aws:states:::sns:publish"
                  Parameters:
                    TopicArn: "{{ .vars.data_pipeline_sns_topic_arn }}"
                    Message:
                      Status: "FAILED"
                      Pipeline: "Daily ETL"
                      ExecutionId.$: "$$.Execution.Id"
                      Error.$: "$.Error"
                      Cause.$: "$.Cause"
                  Next: "FailState"

                FailState:
                  Type: "Fail"
                  Error: "ETLFailed"
                  Cause: "Daily ETL workflow failed"

          # Data quality workflow
          data_quality:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-quality"
            description: "Data quality validation workflow"
            type: "EXPRESS"
            logging_configuration:
              level: "ERROR"
              include_execution_data: false
            definition:
              Comment: "Data quality validation"
              StartAt: "ValidateSchema"
              States:
                ValidateSchema:
                  Type: "Task"
                  Resource: "{{ .vars.schema_validation_lambda_arn }}"
                  Next: "ValidateCompleteness"
                ValidateCompleteness:
                  Type: "Task"
                  Resource: "{{ .vars.completeness_validation_lambda_arn }}"
                  Next: "ValidateAccuracy"
                ValidateAccuracy:
                  Type: "Task"
                  Resource: "{{ .vars.accuracy_validation_lambda_arn }}"
                  End: true

        tags:
          DataPipeline: "orchestration"
          Workflow: "step-functions"

    # =========================================================================
    # SCHEDULING (EventBridge)
    # =========================================================================

      dependencies:
        components:
          - component: data-pipeline/glue-database
          - component: data-pipeline/athena
          - component: data-pipeline/s3-raw
          - component: data-pipeline/s3-processed
          - component: data-pipeline/s3-curated
    data-pipeline/eventbridge:
      metadata:
        component: eventbridge
        type: real
      vars:
        rules:
          # Daily ETL trigger
          daily_etl_trigger:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-daily-etl-trigger"
            description: "Triggers daily ETL workflow"
            schedule_expression: "cron(0 2 * * ? *)"  # 2 AM UTC daily
            state: "ENABLED"
            targets:
              - id: "daily-etl-state-machine"
                arn: !terraform.state data-pipeline/step-functions .state_machine_arns.daily_etl
                role_arn: "{{ .vars.eventbridge_step_functions_role_arn }}"
                input:
                  execution_date.$: "$.time"

          # Hourly data quality check
          hourly_quality_check:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-hourly-quality-check"
            description: "Triggers hourly data quality checks"
            schedule_expression: "rate(1 hour)"
            state: "DISABLED"
            targets:
              - id: "data-quality-state-machine"
                arn: !terraform.state data-pipeline/step-functions .state_machine_arns.data_quality
                role_arn: "{{ .vars.eventbridge_step_functions_role_arn }}"

          # Crawler completion events
          crawler_completion:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-crawler-completion"
            description: "Handle Glue crawler completion events"
            event_pattern:
              source:
                - "aws.glue"
              detail-type:
                - "Glue Crawler State Change"
              detail:
                state:
                  - "Succeeded"
                  - "Failed"
                # This pipeline's own crawlers (data-pipeline/glue-database).
                crawlerName: !terraform.state data-pipeline/glue-database .crawler_names | [.[]]
            targets:
              - id: "process-crawler-completion"
                arn: "{{ .vars.crawler_completion_lambda_arn }}"

        tags:
          DataPipeline: "scheduling"
          Orchestration: "eventbridge"

    # =========================================================================
    # LOOKUP DATA (DynamoDB)
    # =========================================================================

      dependencies:
        components:
          - component: data-pipeline/step-functions
          - component: data-pipeline/glue-database
    data-pipeline/dynamodb-lookup:
      metadata:
        component: dynamodb
        type: real
      vars:
        tables:
          lookup:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-lookup"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "lookup_type"
            range_key: "lookup_key"
            attributes:
              - name: "lookup_type"
                type: "S"
              - name: "lookup_key"
                type: "S"
            point_in_time_recovery: true
            server_side_encryption:
              enabled: true
              kms_key_arn: "{{ .vars.dynamodb_kms_key_arn }}"
            ttl:
              enabled: true
              attribute_name: "expires_at"

        tags:
          DataPipeline: "enrichment"
          DataStore: "lookup"

    # =========================================================================
    # MONITORING
    # =========================================================================

    data-pipeline/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        dashboard_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-pipeline-dashboard"

        # Enable all monitoring features
        enable_resource_monitoring: true

        # Custom dashboard
        dashboards:
          data_pipeline_overview:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-pipeline-overview"
            widgets:
              # Kinesis metrics
              - type: "metric"
                properties:
                  title: "Kinesis Ingestion Rate"
                  metrics:
                    - namespace: "AWS/Kinesis"
                      metric: "IncomingRecords"
                      dimensions:
                        StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name
                      stat: "Sum"
                      period: 60
                    - namespace: "AWS/Kinesis"
                      metric: "IncomingBytes"
                      dimensions:
                        StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name
                      stat: "Sum"
                      period: 60

              # Lambda metrics
              - type: "metric"
                properties:
                  title: "Lambda Transformer Performance"
                  metrics:
                    - namespace: "AWS/Lambda"
                      metric: "Duration"
                      dimensions:
                        FunctionName: !terraform.state data-pipeline/lambda-transformer .function_name
                      stat: "Average"
                      period: 60
                    - namespace: "AWS/Lambda"
                      metric: "Errors"
                      dimensions:
                        FunctionName: !terraform.state data-pipeline/lambda-transformer .function_name
                      stat: "Sum"
                      period: 60

              # Firehose metrics
              - type: "metric"
                properties:
                  title: "Firehose Delivery"
                  metrics:
                    - namespace: "AWS/Firehose"
                      metric: "DeliveryToS3.Records"
                      dimensions:
                        DeliveryStreamName: !terraform.state data-pipeline/firehose-raw .delivery_stream_name
                      stat: "Sum"
                      period: 300
                    - namespace: "AWS/Firehose"
                      metric: "DeliveryToS3.Success"
                      dimensions:
                        DeliveryStreamName: !terraform.state data-pipeline/firehose-raw .delivery_stream_name
                      stat: "Average"
                      period: 300

              # Step Functions metrics
              - type: "metric"
                properties:
                  title: "ETL Workflow Status"
                  metrics:
                    - namespace: "AWS/States"
                      metric: "ExecutionsSucceeded"
                      dimensions:
                        StateMachineArn: !terraform.state data-pipeline/step-functions .state_machine_arns.daily_etl
                      stat: "Sum"
                      period: 86400
                    - namespace: "AWS/States"
                      metric: "ExecutionsFailed"
                      dimensions:
                        StateMachineArn: !terraform.state data-pipeline/step-functions .state_machine_arns.daily_etl
                      stat: "Sum"
                      period: 86400

        # Alarms
        alarms:
          # Kinesis alarms
          kinesis_iterator_age:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-kinesis-iterator-age"
            metric_name: "GetRecords.IteratorAgeMilliseconds"
            namespace: "AWS/Kinesis"
            comparison_operator: "GreaterThanThreshold"
            threshold: 60000  # 1 minute
            evaluation_periods: 3
            period: 300
            statistic: "Maximum"
            dimensions:
              StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name

          kinesis_write_throttled:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-kinesis-write-throttled"
            metric_name: "WriteProvisionedThroughputExceeded"
            namespace: "AWS/Kinesis"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
            dimensions:
              StreamName: !terraform.state data-pipeline/kinesis-ingest .stream_name

          # Lambda alarms
          lambda_errors:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-transformer-errors"
            metric_name: "Errors"
            namespace: "AWS/Lambda"
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              FunctionName: !terraform.state data-pipeline/lambda-transformer .function_name

          # Firehose alarms
          firehose_delivery_failed:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-firehose-delivery-failed"
            metric_name: "DeliveryToS3.DataFreshness"
            namespace: "AWS/Firehose"
            comparison_operator: "GreaterThanThreshold"
            threshold: 900  # 15 minutes
            evaluation_periods: 2
            period: 300
            statistic: "Maximum"
            dimensions:
              DeliveryStreamName: !terraform.state data-pipeline/firehose-raw .delivery_stream_name

          # Step Functions alarms
          etl_failed:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-etl-failed"
            metric_name: "ExecutionsFailed"
            namespace: "AWS/States"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 86400
            statistic: "Sum"
            dimensions:
              StateMachineArn: !terraform.state data-pipeline/step-functions .state_machine_arns.daily_etl

        # SNS notifications
        alarm_notifications_enabled: true
        alarm_email_addresses: []
        sns_topic_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-pipeline-alarms"

        tags:
          DataPipeline: "monitoring"

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
#
# Development:
#   data-pipeline/kinesis-ingest, data-pipeline/kinesis-enriched vars:
#     stream_mode: "ON_DEMAND"
#     retention_period: 24
#   vars:
#     firehose_buffer_size: 64
#     firehose_buffer_interval: 60
#     transformer_memory: 512
#     transformer_concurrency: 10
#     athena_bytes_limit: 1073741824  # 1 GB
#     enable_cross_region_replication: false
#
# Staging:
#   data-pipeline/kinesis-ingest, data-pipeline/kinesis-enriched vars:
#     stream_mode: "ON_DEMAND"
#     retention_period: 48
#   vars:
#     firehose_buffer_size: 128
#     firehose_buffer_interval: 300
#     transformer_memory: 1024
#     transformer_concurrency: 50
#     athena_bytes_limit: 5368709120  # 5 GB
#     enable_cross_region_replication: false
#
# Production:
#   data-pipeline/kinesis-ingest, data-pipeline/kinesis-enriched vars:
#     stream_mode: "PROVISIONED"
#     shard_count: 10
#     retention_period: 168  # 7 days
#   vars:
#     firehose_buffer_size: 128
#     firehose_buffer_interval: 300
#     transformer_memory: 2048
#     transformer_concurrency: 200
#     athena_bytes_limit: 107374182400  # 100 GB
#     enable_cross_region_replication: true
#     enable_hourly_quality_check: "ENABLED"
#     log_retention_days: 90

# =============================================================================
# REQUIRED VARIABLES
# =============================================================================
# lambda_logs_kms_key_id: "arn:aws:kms:..."
# dynamodb_kms_key_arn: "arn:aws:kms:..."
# log_bucket_name: "my-log-bucket"
# firehose_kinesis_role_arn: "arn:aws:iam::..."
# firehose_glue_role_arn: "arn:aws:iam::..."   # needs kms:Decrypt on kms/main (see below)
# eventbridge_step_functions_role_arn: "arn:aws:iam::..."
# data_pipeline_sns_topic_arn: "arn:aws:sns:..."
# dlq_arn: "arn:aws:sqs:..."
# alarm_email_addresses: ["ops@example.com"]
#
# data-pipeline/glue-database enables Data Catalog encryption with kms/main,
# which is account-wide: every principal that reads the Glue catalog in this
# account/region (firehose_glue_role_arn, the step-functions execution role,
# Athena users, any other job or crawler role) needs kms:Decrypt on kms/main.
# Otherwise catalog reads fail - for Firehose silently: Parquet conversion
# cannot load the schema and every record lands under errors/.
      dependencies:
        components:
          - component: data-pipeline/kinesis-ingest
          - component: data-pipeline/lambda-transformer
          - component: data-pipeline/firehose-raw
          - component: data-pipeline/step-functions

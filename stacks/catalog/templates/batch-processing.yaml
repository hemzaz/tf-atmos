---
# =============================================================================
# BATCH PROCESSING STACK TEMPLATE
# =============================================================================
# Complete batch processing infrastructure
#
# Architecture:
#   - AWS Batch compute environment (Fargate or EC2)
#   - SQS queues for job submission
#   - ECS Fargate for containerized jobs
#   - S3 for input/output data
#   - EventBridge for scheduling
#   - Step Functions for workflow orchestration
#   - CloudWatch for monitoring and logging
#   - Auto-scaling based on queue depth
#
# Cost Estimates (Monthly):
#   Development:  ~$50-150/month (minimal jobs)
#   Staging:      ~$200-500/month
#   Production:   ~$500-5,000/month (scales with job volume)
#
# Key Benefits:
#   - Managed compute - no servers to manage
#   - Auto-scaling - scales to zero when idle
#   - Cost-effective - pay only for compute used
#   - Flexible - supports any container workload
#
# Deployment Time: 15-25 minutes
#
# Usage:
#   atmos terraform plan batch-processing -s <tenant>-<account>-<environment>
#   atmos terraform apply batch-processing -s <tenant>-<account>-<environment>
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/iam/defaults
  - catalog/monitoring/defaults
  - catalog/eventbridge/defaults
  - catalog/sqs/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING
    # =========================================================================

    batch-processing/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        name: "batch"

        # VPC CIDR configuration
        vpc_cidr: "10.30.0.0/16"

        # Availability zones
        azs:
          - "{{ .vars.region }}a"
          - "{{ .vars.region }}b"
          - "{{ .vars.region }}c"

        # Subnets - batch jobs typically run in private subnets
        private_subnets:
          - "10.30.1.0/24"
          - "10.30.2.0/24"
          - "10.30.3.0/24"
        public_subnets:
          - "10.30.101.0/24"
          - "10.30.102.0/24"
          - "10.30.103.0/24"

        # NAT Gateway - required for private subnet internet access
        enable_nat_gateway: true
        nat_gateway_strategy: "single"

        # VPC Flow Logs
        vpc_flow_logs_enabled: true
        vpc_flow_logs_traffic_type: "ALL"

        # VPC Endpoints for cost optimization
        enable_vpc_endpoints: true
        vpc_endpoints:
          - s3
          - ecr.api
          - ecr.dkr
          - logs
          - sts
          - secretsmanager

        tags:
          Layer: "networking"
          Platform: "batch-processing"

    # =========================================================================
    # SECURITY GROUPS
    # =========================================================================

    batch-processing/securitygroups:
      metadata:
        component: securitygroup
        type: real
      vars:
        vpc_id: !terraform.state batch-processing/vpc .vpc_id

        # source_security_group_id below names a sibling key in this map,
        # not an sg- id: the component resolves it to that group's id once
        # the group exists. An unknown key fails var.security_groups
        # validation at plan.
        security_groups:
          # Batch compute security group
          batch_compute:
            # Every consumer of these groups is another component (it reads the
            # id through !terraform.state), so a replaced group would leave them
            # on an emptied old one until they are re-applied. Keep the id; only
            # a changed rule is briefly absent while it is replaced. See the
            # component README.
            # Every rule carries an explicit `key`: without one a rule is keyed
            # by its position, and removing an earlier rule would replace the
            # ones after it. Adding or renaming a key on a live rule takes two
            # applies (see the README).
            preserve_security_group_id: true
            description: "Security group for AWS Batch compute"
            ingress_rules: []  # No inbound needed
            egress_rules:
              - key: "https-aws"
                description: "HTTPS to AWS services"
                from_port: 443
                to_port: 443
                protocol: "tcp"
                cidr_blocks:
                  - "0.0.0.0/0"
              - key: "dns"
                description: "DNS"
                from_port: 53
                to_port: 53
                protocol: "udp"
                cidr_blocks:
                  - "0.0.0.0/0"

          # EFS security group (if using shared storage)
          efs:
            preserve_security_group_id: true
            description: "Security group for EFS mount targets"
            ingress_rules:
              - key: "nfs-from-compute"
                description: "NFS from batch compute"
                from_port: 2049
                to_port: 2049
                protocol: "tcp"
                source_security_group_id: "batch_compute"
            egress_rules: []
        tags:
          Layer: "security"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/vpc

    # =========================================================================
    # STORAGE (S3)
    # =========================================================================

    batch-processing/s3-input:
      metadata:
        component: s3
        type: real
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-input"
        description: "Input data for batch jobs"

        # Versioning
        versioning_enabled: true

        # Encryption
        server_side_encryption:
          sse_algorithm: "aws:kms"
          kms_master_key_id: "{{ .vars.batch_kms_key_id }}"

        # Lifecycle rules
        lifecycle_rules:
          - id: "expire-processed"
            enabled: true
            prefix: "processed/"
            expiration:
              days: 30
          - id: "transition-archive"
            enabled: true
            prefix: "archive/"
            transitions:
              - days: 1
                storage_class: "GLACIER"

        # Access control
        block_public_access: true

        # Event notifications
        event_notifications:
          sqs:
            - queue_arn: !terraform.state batch-processing/sqs/trigger .queue_arn
              events:
                - "s3:ObjectCreated:*"
              filter_prefix: "incoming/"
              filter_suffix: ""

        # Logging
        logging:
          target_bucket: "{{ .vars.log_bucket_name }}"
          target_prefix: "s3-access-logs/batch-input/"

        tags:
          Layer: "storage"
          DataType: "input"
      dependencies:
        components:
          - component: batch-processing/sqs/trigger

    batch-processing/s3-output:
      metadata:
        component: s3
        type: real
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-output"
        description: "Output data from batch jobs"

        # Versioning
        versioning_enabled: true

        # Encryption
        server_side_encryption:
          sse_algorithm: "aws:kms"
          kms_master_key_id: "{{ .vars.batch_kms_key_id }}"

        # Lifecycle rules
        lifecycle_rules:
          - id: "transition-ia"
            enabled: true
            prefix: ""
            transitions:
              - days: 30
                storage_class: "STANDARD_IA"
              - days: 90
                storage_class: "GLACIER"
          - id: "expire-temp"
            enabled: true
            prefix: "temp/"
            expiration:
              days: 7

        # Access control
        block_public_access: true

        # Logging
        logging:
          target_bucket: "{{ .vars.log_bucket_name }}"
          target_prefix: "s3-access-logs/batch-output/"

        tags:
          Layer: "storage"
          DataType: "output"

    batch-processing/s3-scripts:
      metadata:
        component: s3
        type: real
      vars:
        bucket_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-scripts"
        description: "Batch job scripts and configurations"

        # Versioning (important for scripts)
        versioning_enabled: true

        # Encryption
        server_side_encryption:
          sse_algorithm: "aws:kms"
          kms_master_key_id: "{{ .vars.batch_kms_key_id }}"

        # No lifecycle - keep scripts indefinitely

        # Access control
        block_public_access: true

        tags:
          Layer: "storage"
          DataType: "scripts"

    # =========================================================================
    # MESSAGE QUEUES (SQS)
    # =========================================================================

    # One queue per instance (the sqs component, Cloud Posse aws-sqs-queue
    # model), each "<Environment>-<name>" and encrypted with kms/main
    # (sqs/defaults). The two job queues each get their own dead-letter queue
    # (dlq_enabled) in place of the old shared one.

    # Job submission queue (high priority)
    batch-processing/sqs/jobs-high:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-jobs-high
        visibility_timeout_seconds: 43200  # 12 hours max job time
        message_retention_seconds: 1209600  # 14 days
        max_message_size: 262144  # 256 KB
        delay_seconds: 0
        receive_wait_time_seconds: 20
        dlq_enabled: true
        dlq_max_receive_count: 3
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # Job submission queue (low priority)
    batch-processing/sqs/jobs-low:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-jobs-low
        visibility_timeout_seconds: 43200
        message_retention_seconds: 1209600
        max_message_size: 262144
        delay_seconds: 0
        receive_wait_time_seconds: 20
        dlq_enabled: true
        dlq_max_receive_count: 3
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # S3 event trigger queue. The input bucket's event notifications send here;
    # the policy is scoped to that bucket, and the sqs component adds
    # aws:SourceAccount = <this account>. S3 uses the queue's key under
    # kms/main's AllowS3 statement (allow_s3, on in catalog/kms/defaults).
    batch-processing/sqs/trigger:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-trigger
        visibility_timeout_seconds: 300
        message_retention_seconds: 86400
        iam_policy:
          - statements:
              - sid: AllowInputBucketEvents
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "s3.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:s3:::{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-input"
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # The EventBridge rules' queues are applied before the rules, and their
    # policies name those rules by ARN, built from names rather than read from
    # state: arn:aws:events:<region>:<account>:rule/<rule> (the rules sit on
    # the default bus, so there is no bus segment), each rule
    # "<Environment>-<name>" (the batch-processing/eventbridge/* instances
    # below). The account segment is "*" because the sqs component adds
    # aws:SourceAccount = <this account> to every Allow
    # (iam_policy_limit_to_current_account, on in sqs/defaults), which pins
    # it. So no queue reads eventbridge state and there is no dependency
    # cycle. kms/main's AllowEventBridgeSQSQueues (allow_eventbridge, on in
    # catalog/kms/defaults) lets EventBridge use the queues' key.

    # Job completion notifications, delivered by the batch-status rule.
    batch-processing/sqs/notifications:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-notifications
        visibility_timeout_seconds: 60
        message_retention_seconds: 86400
        iam_policy:
          - statements:
              - sid: AllowBatchStatusRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-batch-status"
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # The dead-letter queue of every EventBridge rule target below, so
    # EventBridge may send to it from each of those rules. Nothing consumes
    # it: failed deliveries wait here, 14 days (the sqs maximum), for an
    # operator to inspect and replay; batch-processing/monitoring alarms on it.
    batch-processing/sqs/eventbridge-dlq:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-eventbridge-dlq
        message_retention_seconds: 1209600
        iam_policy:
          - statements:
              - sid: AllowBatchRules
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-daily-batch"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-hourly-batch"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-s3-trigger"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-batch-status"
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # =========================================================================
    # AWS BATCH
    # =========================================================================

    batch-processing/batch-compute-fargate:
      metadata:
        component: batch
        type: real
      vars:
        # Compute environment name
        compute_environment_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-fargate"
        compute_environment_type: "MANAGED"
        service_role_arn: "{{ .vars.batch_service_role_arn }}"

        # Fargate compute resources
        compute_resources:
          type: "FARGATE"
          max_vcpus: 256
          subnets: !terraform.state batch-processing/vpc .private_subnet_ids
          security_group_ids:
            - !terraform.state batch-processing/securitygroups .security_group_ids.batch_compute

        # State
        state: "ENABLED"

        tags:
          ComputeType: "fargate"
          Platform: "batch-processing"

      dependencies:
        components:
          - component: batch-processing/vpc
          - component: batch-processing/securitygroups
    batch-processing/batch-compute-fargate-spot:
      metadata:
        component: batch
        type: real
      vars:
        # Compute environment name
        compute_environment_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-fargate-spot"
        compute_environment_type: "MANAGED"
        service_role_arn: "{{ .vars.batch_service_role_arn }}"

        # Fargate Spot compute resources (cost-optimized)
        compute_resources:
          type: "FARGATE_SPOT"
          max_vcpus: 512
          subnets: !terraform.state batch-processing/vpc .private_subnet_ids
          security_group_ids:
            - !terraform.state batch-processing/securitygroups .security_group_ids.batch_compute

        # State
        state: "ENABLED"

        tags:
          ComputeType: "fargate-spot"
          Platform: "batch-processing"

      dependencies:
        components:
          - component: batch-processing/vpc
          - component: batch-processing/securitygroups
    batch-processing/batch-compute-ec2:
      metadata:
        component: batch
        type: real
      vars:
        # Compute environment name
        compute_environment_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-ec2"
        compute_environment_type: "MANAGED"
        service_role_arn: "{{ .vars.batch_service_role_arn }}"

        # EC2 compute resources (for GPU or specific instance needs)
        compute_resources:
          type: "BEST_FIT_PROGRESSIVE"
          allocation_strategy: "BEST_FIT_PROGRESSIVE"
          min_vcpus: 0
          max_vcpus: 256
          desired_vcpus: 0
          instance_types:
            - optimal
          subnets: !terraform.state batch-processing/vpc .private_subnet_ids
          security_group_ids:
            - !terraform.state batch-processing/securitygroups .security_group_ids.batch_compute
          instance_role: "{{ .vars.batch_instance_role_arn }}"
          tags:
            Name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-ec2"

        # Launch template (optional - for custom AMI, EBS, etc.)
        launch_template:
          launch_template_id: "{{ .vars.batch_launch_template_id }}"
          version: "$Latest"

        # State
        state: "DISABLED"

        tags:
          ComputeType: "ec2"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/vpc
          - component: batch-processing/securitygroups

    # =========================================================================
    # BATCH JOB QUEUES
    # =========================================================================

    batch-processing/batch-job-queues:
      metadata:
        component: batch-job-queue
        type: real
      vars:
        job_queues:
          # High priority queue - Fargate only
          high_priority:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-high"
            state: "ENABLED"
            priority: 100
            compute_environments:
              - compute_environment: !terraform.state batch-processing/batch-compute-fargate .compute_environment_arn
                order: 1

          # Default queue - Fargate then Spot
          default:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-default"
            state: "ENABLED"
            priority: 50
            compute_environments:
              - compute_environment: !terraform.state batch-processing/batch-compute-fargate .compute_environment_arn
                order: 1
              - compute_environment: !terraform.state batch-processing/batch-compute-fargate-spot .compute_environment_arn
                order: 2

          # Low priority queue - Spot only (cost-optimized)
          low_priority:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-low"
            state: "ENABLED"
            priority: 10
            compute_environments:
              - compute_environment: !terraform.state batch-processing/batch-compute-fargate-spot .compute_environment_arn
                order: 1

          # GPU queue (if EC2 enabled)
          gpu:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-gpu"
            state: "DISABLED"
            priority: 75
            compute_environments:
              - compute_environment: !terraform.state batch-processing/batch-compute-ec2 .compute_environment_arn
                order: 1

        tags:
          Layer: "compute"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/batch-compute-fargate
          - component: batch-processing/batch-compute-fargate-spot
          - component: batch-processing/batch-compute-ec2

    # =========================================================================
    # BATCH JOB DEFINITIONS
    # =========================================================================

    batch-processing/batch-job-definitions:
      metadata:
        component: batch-job-definition
        type: real
      vars:
        job_definitions:
          # Data processing job
          data_processor:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-data-processor"
            type: "container"
            platform_capabilities:
              - "FARGATE"
            container_properties:
              image: "{{ .vars.data_processor_image }}"
              resourceRequirements:
                - type: "VCPU"
                  value: "1"
                - type: "MEMORY"
                  value: "2048"
              jobRoleArn: "{{ .vars.batch_job_role_arn }}"
              executionRoleArn: "{{ .vars.batch_execution_role_arn }}"
              networkConfiguration:
                assignPublicIp: "DISABLED"
              fargatePlatformConfiguration:
                platformVersion: "LATEST"
              logConfiguration:
                logDriver: "awslogs"
                options:
                  awslogs-group: "/aws/batch/{{ .settings.context.tenant }}-{{ .settings.context.environment }}"
                  awslogs-region: "{{ .vars.region }}"
                  awslogs-stream-prefix: "data-processor"
              environment:
                - name: "ENVIRONMENT"
                  value: "{{ .settings.context.environment }}"
                - name: "INPUT_BUCKET"
                  value: !terraform.state batch-processing/s3-input .bucket_name
                - name: "OUTPUT_BUCKET"
                  value: !terraform.state batch-processing/s3-output .bucket_name
                - name: "AWS_REGION"
                  value: "{{ .vars.region }}"
              secrets:
                - name: "DB_PASSWORD"
                  valueFrom: "{{ .vars.db_password_secret_arn }}"
            retry_strategy:
              attempts: 3
              evaluate_on_exit:
                - on_status_reason: "Host EC2*"
                  action: "RETRY"
                - on_reason: "*error*"
                  action: "EXIT"
            timeout:
              attempt_duration_seconds: 3600

          # ETL job
          etl_job:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-etl-job"
            type: "container"
            platform_capabilities:
              - "FARGATE"
            container_properties:
              image: "{{ .vars.etl_job_image }}"
              resourceRequirements:
                - type: "VCPU"
                  value: "2"
                - type: "MEMORY"
                  value: "4096"
              jobRoleArn: "{{ .vars.batch_job_role_arn }}"
              executionRoleArn: "{{ .vars.batch_execution_role_arn }}"
              networkConfiguration:
                assignPublicIp: "DISABLED"
              fargatePlatformConfiguration:
                platformVersion: "LATEST"
              logConfiguration:
                logDriver: "awslogs"
                options:
                  awslogs-group: "/aws/batch/{{ .settings.context.tenant }}-{{ .settings.context.environment }}"
                  awslogs-region: "{{ .vars.region }}"
                  awslogs-stream-prefix: "etl-job"
              command:
                - "--input"
                - "Ref::input_path"
                - "--output"
                - "Ref::output_path"
                - "--date"
                - "Ref::processing_date"
              environment:
                - name: "ENVIRONMENT"
                  value: "{{ .settings.context.environment }}"
            retry_strategy:
              attempts: 2
            timeout:
              attempt_duration_seconds: 7200

          # Report generator
          report_generator:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-report-generator"
            type: "container"
            platform_capabilities:
              - "FARGATE"
            container_properties:
              image: "{{ .vars.report_generator_image }}"
              resourceRequirements:
                - type: "VCPU"
                  value: "0.5"
                - type: "MEMORY"
                  value: "1024"
              jobRoleArn: "{{ .vars.batch_job_role_arn }}"
              executionRoleArn: "{{ .vars.batch_execution_role_arn }}"
              networkConfiguration:
                assignPublicIp: "DISABLED"
              fargatePlatformConfiguration:
                platformVersion: "LATEST"
              logConfiguration:
                logDriver: "awslogs"
                options:
                  awslogs-group: "/aws/batch/{{ .settings.context.tenant }}-{{ .settings.context.environment }}"
                  awslogs-region: "{{ .vars.region }}"
                  awslogs-stream-prefix: "report-generator"
            retry_strategy:
              attempts: 1
            timeout:
              attempt_duration_seconds: 1800

          # GPU job (if EC2 enabled)
          ml_training:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-ml-training"
            type: "container"
            platform_capabilities:
              - "EC2"
            container_properties:
              image: "{{ .vars.ml_training_image }}"
              resourceRequirements:
                - type: "VCPU"
                  value: "8"
                - type: "MEMORY"
                  value: "32768"
                - type: "GPU"
                  value: "1"
              jobRoleArn: "{{ .vars.batch_job_role_arn }}"
              privileged: false
              logConfiguration:
                logDriver: "awslogs"
                options:
                  awslogs-group: "/aws/batch/{{ .settings.context.tenant }}-{{ .settings.context.environment }}"
                  awslogs-region: "{{ .vars.region }}"
                  awslogs-stream-prefix: "ml-training"
              linuxParameters:
                sharedMemorySize: 4096
                devices:
                  - hostPath: "/dev/nvidia0"
                    containerPath: "/dev/nvidia0"
                    permissions:
                      - "READ"
                      - "WRITE"
            retry_strategy:
              attempts: 2
            timeout:
              attempt_duration_seconds: 86400

        tags:
          Layer: "compute"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/s3-input
          - component: batch-processing/s3-output

    # =========================================================================
    # WORKFLOW ORCHESTRATION (Step Functions)
    # =========================================================================

    batch-processing/step-functions:
      metadata:
        component: step-functions
        type: real
      vars:
        state_machines:
          # Data pipeline workflow
          data_pipeline:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-data-pipeline"
            description: "Orchestrates data processing batch jobs"
            type: "STANDARD"
            logging_configuration:
              level: "ALL"
              include_execution_data: true
              log_destination: "arn:aws:logs:{{ .vars.region }}:{{ .vars.account_id }}:log-group:/aws/states/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-data-pipeline:*"
            tracing_configuration:
              enabled: true
            definition:
              Comment: "Data processing pipeline workflow"
              StartAt: "ValidateInput"
              States:
                ValidateInput:
                  Type: "Task"
                  Resource: "arn:aws:states:::lambda:invoke"
                  Parameters:
                    FunctionName: "{{ .vars.validation_lambda_arn }}"
                    Payload.$: "$"
                  ResultPath: "$.validation"
                  Next: "CheckValidation"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                CheckValidation:
                  Type: "Choice"
                  Choices:
                    - Variable: "$.validation.Payload.valid"
                      BooleanEquals: true
                      Next: "SubmitProcessingJob"
                  Default: "NotifyInvalidInput"

                NotifyInvalidInput:
                  Type: "Task"
                  Resource: "arn:aws:states:::sns:publish"
                  Parameters:
                    TopicArn: "{{ .vars.batch_sns_topic_arn }}"
                    Message:
                      Status: "INVALID_INPUT"
                      Input.$: "$.input_path"
                      Errors.$: "$.validation.Payload.errors"
                  End: true

                SubmitProcessingJob:
                  Type: "Task"
                  Resource: "arn:aws:states:::batch:submitJob.sync"
                  Parameters:
                    JobName.$: "States.Format('process-{}', $.job_id)"
                    JobDefinition: !terraform.state batch-processing/batch-job-definitions .job_definition_arns.data_processor
                    JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_arns.default
                    ContainerOverrides:
                      Command.$: "States.Array('--input', $.input_path, '--output', $.output_path)"
                  ResultPath: "$.processing_result"
                  Next: "CheckProcessingResult"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                CheckProcessingResult:
                  Type: "Choice"
                  Choices:
                    - Variable: "$.processing_result.Status"
                      StringEquals: "SUCCEEDED"
                      Next: "SubmitETLJob"
                  Default: "NotifyFailure"

                SubmitETLJob:
                  Type: "Task"
                  Resource: "arn:aws:states:::batch:submitJob.sync"
                  Parameters:
                    JobName.$: "States.Format('etl-{}', $.job_id)"
                    JobDefinition: !terraform.state batch-processing/batch-job-definitions .job_definition_arns.etl_job
                    JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_arns.default
                    Parameters:
                      input_path.$: "$.output_path"
                      output_path.$: "$.final_output_path"
                      processing_date.$: "$.processing_date"
                  ResultPath: "$.etl_result"
                  Next: "GenerateReport"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                GenerateReport:
                  Type: "Task"
                  Resource: "arn:aws:states:::batch:submitJob.sync"
                  Parameters:
                    JobName.$: "States.Format('report-{}', $.job_id)"
                    JobDefinition: !terraform.state batch-processing/batch-job-definitions .job_definition_arns.report_generator
                    JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_arns.low_priority
                  ResultPath: "$.report_result"
                  Next: "NotifySuccess"
                  Catch:
                    - ErrorEquals:
                        - "States.ALL"
                      Next: "NotifyFailure"

                NotifySuccess:
                  Type: "Task"
                  Resource: "arn:aws:states:::sns:publish"
                  Parameters:
                    TopicArn: "{{ .vars.batch_sns_topic_arn }}"
                    Message:
                      Status: "SUCCESS"
                      JobId.$: "$.job_id"
                      OutputPath.$: "$.final_output_path"
                      Duration.$: "$$.State.EnteredTime"
                  End: true

                NotifyFailure:
                  Type: "Task"
                  Resource: "arn:aws:states:::sns:publish"
                  Parameters:
                    TopicArn: "{{ .vars.batch_sns_topic_arn }}"
                    Message:
                      Status: "FAILED"
                      JobId.$: "$.job_id"
                      Error.$: "$.error"
                      ExecutionId.$: "$$.Execution.Id"
                  Next: "FailState"

                FailState:
                  Type: "Fail"
                  Error: "PipelineFailed"
                  Cause: "Data pipeline workflow failed"

          # Parallel processing workflow
          parallel_processor:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-parallel"
            description: "Processes multiple files in parallel"
            type: "STANDARD"
            definition:
              Comment: "Parallel batch processing workflow"
              StartAt: "ListInputFiles"
              States:
                ListInputFiles:
                  Type: "Task"
                  Resource: "arn:aws:states:::lambda:invoke"
                  Parameters:
                    FunctionName: "{{ .vars.list_files_lambda_arn }}"
                    Payload.$: "$"
                  ResultPath: "$.files"
                  Next: "ProcessFilesInParallel"

                ProcessFilesInParallel:
                  Type: "Map"
                  ItemsPath: "$.files.Payload"
                  MaxConcurrency: 10
                  Iterator:
                    StartAt: "ProcessSingleFile"
                    States:
                      ProcessSingleFile:
                        Type: "Task"
                        Resource: "arn:aws:states:::batch:submitJob.sync"
                        Parameters:
                          JobName.$: "States.Format('parallel-{}', $.file_id)"
                          JobDefinition: !terraform.state batch-processing/batch-job-definitions .job_definition_arns.data_processor
                          JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_arns.low_priority
                          ContainerOverrides:
                            Command.$: "States.Array('--input', $.file_path)"
                        End: true
                  ResultPath: "$.processing_results"
                  Next: "AggregateResults"

                AggregateResults:
                  Type: "Task"
                  Resource: "arn:aws:states:::lambda:invoke"
                  Parameters:
                    FunctionName: "{{ .vars.aggregate_lambda_arn }}"
                    Payload.$: "$"
                  End: true

        tags:
          Layer: "orchestration"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/batch-job-definitions
          - component: batch-processing/batch-job-queues

    # =========================================================================
    # SCHEDULING (EventBridge)
    # =========================================================================
    # One rule per instance on the default bus, each "<Environment>-<name>"
    # and logging what it fires on to its own CloudWatch log group (the Cloud
    # Posse aws-eventbridge model). The queue policies above name these rules,
    # so a renamed rule must be renamed there too. A delivery that still fails
    # after the retry policy goes to batch-processing/sqs/eventbridge-dlq.
    # Every instance lists kms/main itself: its own dependencies list replaces
    # the one inherited from eventbridge/defaults.

    # Daily batch processing: starts the data pipeline at 2 AM UTC. The paths
    # are built from the bucket names the s3 instances set (bucket_name).
    # job_id is the event ID, since Batch job names take no colons (the
    # pipeline names jobs "process-<job_id>"); processing_date is the time the
    # schedule fired.
    batch-processing/eventbridge/daily-batch:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: daily-batch
        cloudwatch_event_rule_description: "Triggers daily batch processing"
        schedule_expression: "cron(0 2 * * ? *)"  # 2 AM UTC
        targets:
          data-pipeline:
            arn: !terraform.state batch-processing/step-functions .state_machine_arns.data_pipeline
            role_arn: "{{ .vars.eventbridge_step_functions_role_arn }}"
            input_transformer:
              input_paths:
                id: "$.id"
                time: "$.time"
              input_template: '{"job_id": "<id>", "input_path": "s3://{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-input/incoming/", "output_path": "s3://{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-output/processed/", "final_output_path": "s3://{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-output/final/", "processing_date": "<time>"}'
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/step-functions
          - component: batch-processing/sqs/eventbridge-dlq

    # Hourly lightweight processing: submits a data-processor job to the
    # low-priority queue. Off by default (the old rule was DISABLED); set
    # metadata.enabled: true in a stack to run it.
    batch-processing/eventbridge/hourly-batch:
      metadata:
        component: eventbridge
        type: real
        enabled: false
        inherits:
          - eventbridge/defaults
      vars:
        name: hourly-batch
        cloudwatch_event_rule_description: "Triggers hourly lightweight batch jobs"
        schedule_expression: "rate(1 hour)"
        targets:
          lightweight-job:
            arn: !terraform.state batch-processing/batch-job-queues .job_queue_arns.low_priority
            role_arn: "{{ .vars.eventbridge_batch_role_arn }}"
            batch_target:
              job_definition: !terraform.state batch-processing/batch-job-definitions .job_definition_arns.data_processor
              job_name: "hourly-process"
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/batch-job-queues
          - component: batch-processing/batch-job-definitions
          - component: batch-processing/sqs/eventbridge-dlq

    # S3 event processing: runs the parallel processor for each object created
    # under incoming/ in the input bucket (named as batch-processing/s3-input
    # sets it). S3 only sends these events once the bucket's EventBridge
    # notifications are on.
    batch-processing/eventbridge/s3-trigger:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: s3-trigger
        cloudwatch_event_rule_description: "Processes new files uploaded to S3"
        cloudwatch_event_rule_pattern:
          source:
            - "aws.s3"
          detail-type:
            - "Object Created"
          detail:
            bucket:
              name:
                - "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-input"
            object:
              key:
                - prefix: "incoming/"
        targets:
          parallel-processor:
            arn: !terraform.state batch-processing/step-functions .state_machine_arns.parallel_processor
            role_arn: "{{ .vars.eventbridge_step_functions_role_arn }}"
            input_transformer:
              input_paths:
                bucket: "$.detail.bucket.name"
                key: "$.detail.object.key"
              input_template: '{"bucket": "<bucket>", "key": "<key>"}'
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/step-functions
          - component: batch-processing/sqs/eventbridge-dlq

    # Batch job status changes: this stack's failed and succeeded jobs go to
    # the notifications queue, whose policy lets this rule send
    # (batch-processing/sqs/notifications).
    batch-processing/eventbridge/batch-status:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: batch-status
        cloudwatch_event_rule_description: "Monitors batch job status changes"
        cloudwatch_event_rule_pattern:
          source:
            - "aws.batch"
          detail-type:
            - "Batch Job State Change"
          detail:
            status:
              - "FAILED"
              - "SUCCEEDED"
            # The event carries the queue's ARN, not its name.
            jobQueue:
              - wildcard: "arn:aws:batch:{{ .vars.region }}:*:job-queue/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-*"
        targets:
          notification-queue:
            arn: !terraform.state batch-processing/sqs/notifications .queue_arn
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/sqs/notifications
          - component: batch-processing/sqs/eventbridge-dlq

    # =========================================================================
    # LAMBDA FUNCTIONS (Supporting)
    # =========================================================================
    batch-processing/lambda-job-submitter:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "batch-job-submitter"
        description: "Submits batch jobs from SQS messages"

        # Runtime configuration
        runtime: "python3.13"
        handler: "handler.submit_job"
        timeout: 60
        memory_size: 256

        # Reserved concurrency
        reserved_concurrent_executions: 10

        # Environment variables
        environment_variables:
          ENVIRONMENT: "{{ .settings.context.environment }}"
          HIGH_PRIORITY_QUEUE: !terraform.state batch-processing/batch-job-queues .job_queue_arns.high_priority
          DEFAULT_QUEUE: !terraform.state batch-processing/batch-job-queues .job_queue_arns.default
          LOW_PRIORITY_QUEUE: !terraform.state batch-processing/batch-job-queues .job_queue_arns.low_priority
          JOB_DEFINITION: !terraform.state batch-processing/batch-job-definitions .job_definition_arns.data_processor

        # SQS event source mapping
        event_source_mappings:
          sqs_high:
            event_source_arn: !terraform.state batch-processing/sqs/jobs-high .queue_arn
            batch_size: 10
            maximum_batching_window_in_seconds: 0
          sqs_low:
            event_source_arn: !terraform.state batch-processing/sqs/jobs-low .queue_arn
            batch_size: 10
            maximum_batching_window_in_seconds: 60

        # IAM permissions
        policy_statements:
          batch:
            effect: "Allow"
            actions:
              - "batch:SubmitJob"
              - "batch:DescribeJobs"
            resources:
              - "*"
          sqs:
            effect: "Allow"
            actions:
              - "sqs:ReceiveMessage"
              - "sqs:DeleteMessage"
              - "sqs:GetQueueAttributes"
            resources:
              - !terraform.state batch-processing/sqs/jobs-high .queue_arn
              - !terraform.state batch-processing/sqs/jobs-low .queue_arn

        # CloudWatch logs

        tags:
          Layer: "compute"
          Function: "job-submitter"
      dependencies:
        components:
          - component: batch-processing/sqs/jobs-high
          - component: batch-processing/sqs/jobs-low
          - component: batch-processing/batch-job-queues
          - component: batch-processing/batch-job-definitions

    # =========================================================================
    # MONITORING
    # =========================================================================

    batch-processing/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        dashboard_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-dashboard"

        # Enable monitoring features
        enable_resource_monitoring: true

        # Custom dashboard
        dashboards:
          batch_overview:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-overview"
            widgets:
              # Batch compute metrics
              - type: "metric"
                properties:
                  title: "Compute Environment"
                  metrics:
                    - namespace: "AWS/Batch"
                      metric: "DesiredvCPUs"
                      dimensions:
                        ComputeEnvironmentName: !terraform.state batch-processing/batch-compute-fargate .compute_environment_name
                      stat: "Average"
                      period: 60
                    - namespace: "AWS/Batch"
                      metric: "RunningvCPUs"
                      dimensions:
                        ComputeEnvironmentName: !terraform.state batch-processing/batch-compute-fargate .compute_environment_name
                      stat: "Average"
                      period: 60

              # Job queue metrics
              - type: "metric"
                properties:
                  title: "Job Queue Status"
                  metrics:
                    - namespace: "AWS/Batch"
                      metric: "JobsSubmitted"
                      dimensions:
                        JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_names.default
                      stat: "Sum"
                      period: 300
                    - namespace: "AWS/Batch"
                      metric: "JobsRunning"
                      dimensions:
                        JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_names.default
                      stat: "Average"
                      period: 60
                    - namespace: "AWS/Batch"
                      metric: "JobsFailed"
                      dimensions:
                        JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_names.default
                      stat: "Sum"
                      period: 300

              # Step Functions metrics
              - type: "metric"
                properties:
                  title: "Workflow Executions"
                  metrics:
                    - namespace: "AWS/States"
                      metric: "ExecutionsSucceeded"
                      dimensions:
                        StateMachineArn: !terraform.state batch-processing/step-functions .state_machine_arns.data_pipeline
                      stat: "Sum"
                      period: 300
                    - namespace: "AWS/States"
                      metric: "ExecutionsFailed"
                      dimensions:
                        StateMachineArn: !terraform.state batch-processing/step-functions .state_machine_arns.data_pipeline
                      stat: "Sum"
                      period: 300
                    - namespace: "AWS/States"
                      metric: "ExecutionTime"
                      dimensions:
                        StateMachineArn: !terraform.state batch-processing/step-functions .state_machine_arns.data_pipeline
                      stat: "Average"
                      period: 300

              # SQS metrics
              - type: "metric"
                properties:
                  title: "Queue Depth"
                  metrics:
                    - namespace: "AWS/SQS"
                      metric: "ApproximateNumberOfMessagesVisible"
                      dimensions:
                        QueueName: !terraform.state batch-processing/sqs/jobs-high .queue_name
                      stat: "Average"
                      period: 60
                    - namespace: "AWS/SQS"
                      metric: "ApproximateNumberOfMessagesVisible"
                      dimensions:
                        QueueName: !terraform.state batch-processing/sqs/jobs-low .queue_name
                      stat: "Average"
                      period: 60
                    - namespace: "AWS/SQS"
                      metric: "ApproximateNumberOfMessagesVisible"
                      dimensions:
                        QueueName: !terraform.state batch-processing/sqs/jobs-high .dead_letter_queue_name
                      stat: "Sum"
                      period: 60
                    - namespace: "AWS/SQS"
                      metric: "ApproximateNumberOfMessagesVisible"
                      dimensions:
                        QueueName: !terraform.state batch-processing/sqs/jobs-low .dead_letter_queue_name
                      stat: "Sum"
                      period: 60

        # Alarms
        alarms:
          # Batch job failures
          batch_job_failures:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-job-failures"
            metric_name: "JobsFailed"
            namespace: "AWS/Batch"
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
            dimensions:
              JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_names.default

          # Job queue depth (too many pending)
          batch_queue_depth:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-queue-depth"
            metric_name: "JobsPending"
            namespace: "AWS/Batch"
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 3
            period: 300
            statistic: "Average"
            dimensions:
              JobQueue: !terraform.state batch-processing/batch-job-queues .job_queue_names.default

          # Step Functions failures
          workflow_failures:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-workflow-failures"
            metric_name: "ExecutionsFailed"
            namespace: "AWS/States"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
            dimensions:
              StateMachineArn: !terraform.state batch-processing/step-functions .state_machine_arns.data_pipeline

          # DLQ messages, one alarm per job queue's dead-letter queue
          dlq_high_messages:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-jobs-high-dlq"
            metric_name: "ApproximateNumberOfMessagesVisible"
            namespace: "AWS/SQS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
            dimensions:
              QueueName: !terraform.state batch-processing/sqs/jobs-high .dead_letter_queue_name
          dlq_low_messages:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-jobs-low-dlq"
            metric_name: "ApproximateNumberOfMessagesVisible"
            namespace: "AWS/SQS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
            dimensions:
              QueueName: !terraform.state batch-processing/sqs/jobs-low .dead_letter_queue_name

          # EventBridge deliveries that failed after their retries
          eventbridge_dlq_messages:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-eventbridge-dlq"
            metric_name: "ApproximateNumberOfMessagesVisible"
            namespace: "AWS/SQS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
            dimensions:
              QueueName: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_name

          # Compute environment not scaling
          compute_not_scaling:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-compute-stuck"
            metric_name: "DesiredvCPUs"
            namespace: "AWS/Batch"
            comparison_operator: "GreaterThanThreshold"
            threshold: 256
            evaluation_periods: 3
            period: 300
            statistic: "Maximum"
            dimensions:
              ComputeEnvironmentName: !terraform.state batch-processing/batch-compute-fargate .compute_environment_name

        # SNS notifications
        alarm_notifications_enabled: true
        alarm_email_addresses: []
        sns_topic_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-batch-alarms"

        tags:
          Layer: "monitoring"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/batch-compute-fargate
          - component: batch-processing/batch-job-queues
          - component: batch-processing/step-functions
          - component: batch-processing/sqs/jobs-high
          - component: batch-processing/sqs/jobs-low
          - component: batch-processing/sqs/eventbridge-dlq


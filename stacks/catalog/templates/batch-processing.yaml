---
# =============================================================================
# BATCH PROCESSING STACK TEMPLATE
# =============================================================================
# Complete batch processing infrastructure
#
# Architecture:
#   - VPC with private subnets (NAT, VPC endpoints) for the jobs
#   - One AWS Batch instance (batch-processing/batch): Fargate, Fargate Spot
#     and a GPU EC2 compute environment, four job queues and four container
#     job definitions with their job roles, execution role and KMS-encrypted
#     log group
#   - SQS queues for job submission (each with its dead-letter queue), the
#     input bucket's event queue, job-status notifications and the EventBridge
#     dead-letter queue
#   - S3 buckets for input, output and scripts
#   - Step Functions state machines (one instance each): the data pipeline and
#     the parallel processor
#   - EventBridge rules: daily and hourly schedules, the S3 trigger and the
#     job-status rule
#   - A Lambda that submits Batch jobs from the job queues
#   - An SNS topic for pipeline notifications
#   - CloudWatch dashboard and alarms
#
# Encryption: the stack's customer managed key, kms/main, encrypts the
# buckets, the queues, the SNS topic, the state machines and their log groups,
# the job log group, the EventBridge log groups, the Lambda's environment and
# log group, and the monitoring alarm topic.
#
# Cost Estimates (Monthly):
#   Development:  ~$50-150/month (minimal jobs)
#   Staging:      ~$200-500/month
#   Production:   ~$500-5,000/month (scales with job volume)
#
# Deployment Time: 15-25 minutes
#
# Usage (instances are batch-processing/<part>):
#   atmos terraform plan batch-processing/batch -s <tenant>-<stage>-<environment>
#   atmos workflow deploy -f deploy-full-stack -s <tenant>-<stage>-<environment>
#
# =============================================================================
# REQUIREMENTS FOR THE IMPORTING STACK
# =============================================================================
# 1. A kms/main instance (every fnx org stack has one, in components/security.yaml,
#    from catalog/kms/defaults). This template does not define it: doing so would
#    deep-merge over that stack's own alias_name/description. It must keep the
#    grants catalog/kms/defaults turns on: allow_cloudwatch_logs and
#    allow_log_delivery (the job, state machine, EventBridge and Lambda log
#    groups), allow_eventbridge (delivery to the encrypted queues), allow_s3
#    (the input bucket's notifications to the trigger queue) and
#    allow_cloudwatch_alarms (the alarm topic).
# 2. s3/lambda-artifacts (imported below; an fnx org stack imports the same file
#    in components/services.yaml) applied, with
#    batch-job-submitter/<job_submitter_version>.zip in it, before
#    batch-processing/lambda-job-submitter: deploy-full-stack's storage layer
#    applies it before compute.
# 3. settings.batch_processing, the inputs this template cannot create:
#      settings:
#        batch_processing:
#          data_processor_image: <account>.dkr.ecr.<region>.amazonaws.com/processor:1.0
#          etl_job_image: <account>.dkr.ecr.<region>.amazonaws.com/etl:1.0
#          report_generator_image: <account>.dkr.ecr.<region>.amazonaws.com/reporter:1.0
#          ml_training_image: <account>.dkr.ecr.<region>.amazonaws.com/trainer:1.0
#          # The data processor's DB_PASSWORD: a full Secrets Manager ARN, with
#          # its 6-character suffix (the execution role is granted exactly it).
#          db_password_secret_arn: arn:aws:secretsmanager:<region>:<account>:secret:<name>-AbCdEf
#          # The pipelines' Lambda functions, deployed elsewhere.
#          validation_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#          list_files_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#          aggregate_lambda_arn: arn:aws:lambda:<region>:<account>:function:<name>
#          job_submitter_version: "1.0.0"   # package key; bump to deploy new code
#    A missing key fails every describe/plan of the stack with its name
#    (gomplate `required`); `atmos validate stacks` does not render templates.
#    settings.environment.account_id (set by every fnx stage _defaults) builds
#    the ARNs of resources this template names but cannot read from state.
# 4. If db_password_secret_arn is encrypted with a customer managed key, set
#    batch-processing/batch's secrets_kms_key_arn to it.
# 5. The externally supplied Lambdas' execution roles read and write the
#    buckets, which are encrypted with kms/main: each needs its own IAM grant
#    of kms:Decrypt and kms:GenerateDataKey* on kms/main's key, scoped with
#    kms:ViaService s3.<region>.amazonaws.com (kms/main delegates to IAM, so no
#    key-policy change). The job roles below get theirs from this template.
# 6. On-call addresses, if any, in batch-processing/monitoring's
#    alarm_email_subscriptions.
# 7. batch-processing/sqs/trigger receives the input bucket's incoming/ object
#    events but has no consumer here (the EventBridge s3-trigger rule starts
#    the pipeline): point an external consumer at it, or leave it to expire.
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/iam/defaults
  - catalog/monitoring/defaults
  - catalog/eventbridge/defaults
  - catalog/sqs/defaults
  - catalog/s3/defaults
  - catalog/sns/defaults
  - catalog/batch/defaults
  - catalog/stepfunctions/defaults
  # s3/lambda-artifacts, the stack's lambda package bucket (an fnx org stack
  # imports the same file in components/services.yaml).
  - catalog/s3/lambda-artifacts

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING
    # =========================================================================

    batch-processing/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        # VPC CIDR configuration
        ipv4_primary_cidr_block: "10.30.0.0/16"

        # Availability zones
        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4

        # Subnets - batch jobs typically run in private subnets
        private_subnets:
          - "10.30.1.0/24"
          - "10.30.2.0/24"
          - "10.30.3.0/24"
        public_subnets:
          - "10.30.101.0/24"
          - "10.30.102.0/24"
          - "10.30.103.0/24"

        # NAT Gateway - required for private subnet internet access
        nat_gateway_enabled: true
        nat_gateway_strategy: "single"

        # VPC Flow Logs
        vpc_flow_logs_enabled: true
        vpc_flow_logs_traffic_type: "ALL"

        # VPC Endpoints for cost optimization
        enable_vpc_endpoints: true
        vpc_endpoints:
          - s3
          - ecr.api
          - ecr.dkr
          - logs
          - sts
          - secretsmanager

        tags:
          Layer: "networking"
          Platform: "batch-processing"

    # =========================================================================
    # SECURITY GROUPS
    # =========================================================================

    batch-processing/securitygroups:
      metadata:
        component: securitygroup
        type: real
      vars:
        vpc_id: !terraform.state batch-processing/vpc .vpc_id

        # source_security_group_id below names a sibling key in this map,
        # not an sg- id: the component resolves it to that group's id once
        # the group exists. An unknown key fails var.security_groups
        # validation at plan.
        security_groups:
          # Batch compute security group
          batch_compute:
            # Every consumer of these groups is another component (it reads the
            # id through !terraform.state), so a replaced group would leave them
            # on an emptied old one until they are re-applied. Keep the id; only
            # a changed rule is briefly absent while it is replaced. See the
            # component README.
            # Every rule carries an explicit `key`: without one a rule is keyed
            # by its position, and removing an earlier rule would replace the
            # ones after it. Adding or renaming a key on a live rule takes two
            # applies (see the README).
            preserve_security_group_id: true
            description: "Security group for AWS Batch compute"
            ingress_rules: []  # No inbound needed
            egress_rules:
              - key: "https-aws"
                description: "HTTPS to AWS services"
                from_port: 443
                to_port: 443
                protocol: "tcp"
                cidr_blocks:
                  - "0.0.0.0/0"
              - key: "dns"
                description: "DNS"
                from_port: 53
                to_port: 53
                protocol: "udp"
                cidr_blocks:
                  - "0.0.0.0/0"

          # EFS security group (if using shared storage)
          efs:
            preserve_security_group_id: true
            description: "Security group for EFS mount targets"
            ingress_rules:
              - key: "nfs-from-compute"
                description: "NFS from batch compute"
                from_port: 2049
                to_port: 2049
                protocol: "tcp"
                source_security_group_id: "batch_compute"
            egress_rules: []
        tags:
          Layer: "security"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: batch-processing/vpc

    # =========================================================================
    # STORAGE (S3)
    # =========================================================================

    # The three buckets below inherit s3/defaults (imported above), which
    # supplies kms_key_arn (from kms/main) and versioning_enabled: true; the
    # legacy `description`/`server_side_encryption`/`lifecycle_rules`/
    # `block_public_access` inputs no longer exist on the s3 component (it
    # always encrypts with SSE-KMS via kms/main and always blocks public
    # access; lifecycle rules are `lifecycle_configuration_rules`) and have
    # been dropped or converted rather than silently ignored. `bucket_name`
    # is kept explicit on all three: the trigger queue's policy (below),
    # the s3-trigger EventBridge pattern and the job-definition/schedule
    # input/output paths all reference these names literally. They start
    # with the stack's full id, its name (tenant-environment-stage[-name],
    # Cloud Posse's null-label id order): S3 bucket names are global, and environment alone
    # repeats across stages once it is a region code. `logging` is
    # left unset (disabled, the s3 component's default) rather than pointed
    # at a `{{ .vars.log_bucket_name }}` placeholder: atmos.yaml sets no
    # `missingkey` option, so an unset template key renders as the literal
    # string `<no value>`, which fails the s3 component's logging.bucket_name
    # validation at plan time. The target must be a separate SSE-S3 bucket
    # anyway (S3 cannot deliver access logs to an SSE-KMS bucket), and no such
    # bucket exists in this template, so enable it per stack instead by
    # overriding the instance directly, e.g.:
    #   batch-processing/s3-input:
    #     vars:
    #       logging:
    #         bucket_name: "my-log-bucket"
    #         prefix: "s3-access-logs/batch-input/"
    batch-processing/s3-input:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        # name is required even though bucket_name overrides the name it would
        # otherwise generate.
        name: "batch-input"
        bucket_name: "{{ .atmos_stack }}-batch-input"

        lifecycle_configuration_rules:
          - id: "expire-processed"
            enabled: true
            abort_incomplete_multipart_upload_days: 7
            filter_and:
              prefix: "processed/"
            expiration:
              days: 30
            noncurrent_version_expiration:
              noncurrent_days: 30
          - id: "transition-archive"
            enabled: true
            abort_incomplete_multipart_upload_days: 7
            filter_and:
              prefix: "archive/"
            transition:
              - days: 1
                storage_class: "GLACIER"

        # S3 sends these once PutBucketNotification finds the trigger
        # queue's policy already admitting s3.amazonaws.com (that policy is
        # on batch-processing/sqs/trigger, listed in dependencies.components
        # below so Atmos applies it first) and the aws.s3 "Object Created"
        # pattern below is matched only once EventBridge notifications
        # (eventbridge: true) are on. The queue ARN is built from the trigger
        # queue's name ("<Environment>-batch-trigger") rather than read from
        # its state: the sqs and s3 instances share deploy-full-stack's
        # storage layer, which plans before it applies.
        event_notification_details:
          enabled: true
          eventbridge: true
          queue_list:
            - queue_arn: 'arn:aws:sqs:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:{{ .settings.prefix }}-batch-trigger'
              events:
                - "s3:ObjectCreated:*"
              filter_prefix: "incoming/"

        # logging disabled by default -- see the STORAGE (S3) note above
        # for how to enable it per stack.

        tags:
          Layer: "storage"
          DataType: "input"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/sqs/trigger

    batch-processing/s3-output:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "batch-output"
        bucket_name: "{{ .atmos_stack }}-batch-output"

        lifecycle_configuration_rules:
          - id: "transition-ia"
            enabled: true
            abort_incomplete_multipart_upload_days: 7
            filter_and:
              prefix: ""
            transition:
              - days: 30
                storage_class: "STANDARD_IA"
              - days: 90
                storage_class: "GLACIER"
          - id: "expire-temp"
            enabled: true
            abort_incomplete_multipart_upload_days: 7
            filter_and:
              prefix: "temp/"
            expiration:
              days: 7
            noncurrent_version_expiration:
              noncurrent_days: 7

        # logging disabled by default -- see the STORAGE (S3) note above
        # for how to enable it per stack.

        tags:
          Layer: "storage"
          DataType: "output"

    batch-processing/s3-scripts:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        name: "batch-scripts"
        bucket_name: "{{ .atmos_stack }}-batch-scripts"

        # No lifecycle rules - keep scripts indefinitely.

        tags:
          Layer: "storage"
          DataType: "scripts"

    # =========================================================================
    # MESSAGE QUEUES (SQS)
    # =========================================================================

    # One queue per instance (the sqs component, Cloud Posse aws-sqs-queue
    # model), each "<Environment>-<name>" and encrypted with kms/main
    # (sqs/defaults). The two job queues each get their own dead-letter queue
    # (dlq_enabled) in place of the old shared one.

    # Job submission queue (high priority)
    batch-processing/sqs/jobs-high:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-jobs-high
        visibility_timeout_seconds: 43200  # 12 hours max job time
        message_retention_seconds: 1209600  # 14 days
        max_message_size: 262144  # 256 KB
        delay_seconds: 0
        receive_wait_time_seconds: 20
        dlq_enabled: true
        dlq_max_receive_count: 3
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # Job submission queue (low priority)
    batch-processing/sqs/jobs-low:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-jobs-low
        visibility_timeout_seconds: 43200
        message_retention_seconds: 1209600
        max_message_size: 262144
        delay_seconds: 0
        receive_wait_time_seconds: 20
        dlq_enabled: true
        dlq_max_receive_count: 3
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # S3 event trigger queue. The input bucket's event notifications send here;
    # the policy is scoped to that bucket, and the sqs component adds
    # aws:SourceAccount = <this account>. S3 uses the queue's key under
    # kms/main's AllowS3 statement (allow_s3, on in catalog/kms/defaults).
    # Nothing in this template consumes it: the pipeline starts from the same
    # uploads through the EventBridge s3-trigger rule. The queue is for an
    # external consumer (REQUIREMENTS 7); its messages expire after a day.
    # Named "<Environment>-batch-trigger": batch-processing/s3-input builds
    # this ARN from that name, so a rename must be made there too.
    batch-processing/sqs/trigger:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-trigger
        visibility_timeout_seconds: 300
        message_retention_seconds: 86400
        iam_policy:
          - statements:
              - sid: AllowInputBucketEvents
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "s3.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:s3:::{{ .atmos_stack }}-batch-input"
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # The EventBridge rules' queues are applied before the rules, and their
    # policies name those rules by ARN, built from names rather than read from
    # state: arn:aws:events:<region>:<account>:rule/<rule> (the rules sit on
    # the default bus, so there is no bus segment), each rule
    # "<Environment>-<name>" (the batch-processing/eventbridge/* instances
    # below). The account segment is "*" because the sqs component adds
    # aws:SourceAccount = <this account> to every Allow
    # (iam_policy_limit_to_current_account, on in sqs/defaults), which pins
    # it. So no queue reads eventbridge state and there is no dependency
    # cycle. kms/main's AllowEventBridgeSQSQueues (allow_eventbridge, on in
    # catalog/kms/defaults) lets EventBridge use the queues' key.

    # Job completion notifications, delivered by the batch-status rule.
    batch-processing/sqs/notifications:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-notifications
        visibility_timeout_seconds: 60
        message_retention_seconds: 86400
        iam_policy:
          - statements:
              - sid: AllowBatchStatusRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-batch-status"
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # The dead-letter queue of every EventBridge rule target below, so
    # EventBridge may send to it from each of those rules. Nothing consumes
    # it: failed deliveries wait here, 14 days (the sqs maximum), for an
    # operator to inspect and replay; batch-processing/monitoring alarms on it.
    batch-processing/sqs/eventbridge-dlq:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: batch-eventbridge-dlq
        message_retention_seconds: 1209600
        iam_policy:
          - statements:
              - sid: AllowBatchRules
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-daily-batch"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-hourly-batch"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-s3-trigger"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-batch-status"
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # =========================================================================
    # SNS (pipeline notifications)
    # =========================================================================

    # The data pipeline publishes its SUCCESS / FAILED / INVALID_INPUT
    # messages here (its execution role's grant is on the state machine
    # below). Subscribe consumers per stack, e.g.:
    #   batch-processing/sns/notifications:
    #     vars:
    #       subscribers:
    #         ops:
    #           protocol: email
    #           endpoint: ops@example.com
    batch-processing/sns/notifications:
      metadata:
        component: sns
        type: real
        inherits:
          - sns/defaults
      vars:
        name: batch-notifications
        tags:
          Layer: "messaging"
          Platform: "batch-processing"

    # =========================================================================
    # AWS BATCH
    # =========================================================================

    # One instance (Cloud Posse has no Batch component; see
    # components/terraform/batch/README.md): compute environments, job queues
    # and job definitions, each named <Environment>-batch-<key>. No service
    # role (Batch uses its service-linked role), and the EC2 environment's
    # instance profile and IMDSv2 launch template are the component's own
    # (set image_id_override for a custom AMI). The job definitions' log group
    # is /aws/batch/<Environment>-batch, encrypted with kms/main; the
    # component creates the Fargate execution role and one job role per
    # definition from job_role_policy_json.
    # batch-processing/lambda-job-submitter builds its queue and job definition
    # names and its IAM ARNs from this instance's name and keys
    # (<Environment>-batch-<key>): renaming name, the high_priority, default or
    # low_priority queue or data_processor needs the same change there.
    batch-processing/batch:
      metadata:
        component: batch
        type: real
        inherits:
          - batch/defaults
      vars:
        name: batch
        log_kms_key_arn: !terraform.state kms/main .key_arn
        # batch-processing/eventbridge/hourly-batch's target role.
        events_role_enabled: true

        compute_environments:
          fargate:
            type: FARGATE
            max_vcpus: 256
            subnet_ids: !terraform.state batch-processing/vpc .private_subnet_ids
            security_group_ids:
              - !terraform.state batch-processing/securitygroups .security_group_ids.batch_compute
            tags:
              ComputeType: "fargate"
          # Cost-optimized.
          fargate-spot:
            type: FARGATE_SPOT
            max_vcpus: 512
            subnet_ids: !terraform.state batch-processing/vpc .private_subnet_ids
            security_group_ids:
              - !terraform.state batch-processing/securitygroups .security_group_ids.batch_compute
            tags:
              ComputeType: "fargate-spot"
          # GPU instances for ml_training, scaling from zero. Disabled, like
          # the gpu queue: enable both per stack. "optimal" (the old value)
          # picks only CPU families, on which a GPU job never starts, so the
          # instance types are GPU families on the NVIDIA ECS AMI.
          ec2:
            type: EC2
            state: DISABLED
            allocation_strategy: BEST_FIT_PROGRESSIVE
            min_vcpus: 0
            max_vcpus: 256
            instance_types:
              - g5
            image_type: ECS_AL2023_NVIDIA
            subnet_ids: !terraform.state batch-processing/vpc .private_subnet_ids
            security_group_ids:
              - !terraform.state batch-processing/securitygroups .security_group_ids.batch_compute
            tags:
              ComputeType: "ec2"

        # Readers take .job_queue_arns.<key> (queues) and
        # .job_definition_names.<key> (definitions: SubmitJob runs the latest
        # active revision of a name; the revisioned ARN changes on every edit).
        job_queues:
          # Fargate only.
          high_priority:
            priority: 100
            compute_environment_order:
              - order: 1
                compute_environment: fargate
          # Fargate, then Spot.
          default:
            priority: 50
            compute_environment_order:
              - order: 1
                compute_environment: fargate
              - order: 2
                compute_environment: fargate-spot
          # Spot only (cost-optimized).
          low_priority:
            priority: 10
            compute_environment_order:
              - order: 1
                compute_environment: fargate-spot
          gpu:
            priority: 75
            state: DISABLED
            compute_environment_order:
              - order: 1
                compute_environment: ec2

        job_definitions:
          data_processor:
            image: '{{ required "settings.batch_processing.data_processor_image is required" .settings.batch_processing.data_processor_image }}'
            vcpu: 1
            memory: 2048
            log_stream_prefix: data-processor
            environment:
              ENVIRONMENT: "{{ .settings.context.stage }}"
              INPUT_BUCKET: !terraform.state batch-processing/s3-input .bucket_name
              OUTPUT_BUCKET: !terraform.state batch-processing/s3-output .bucket_name
              AWS_REGION: "{{ .vars.region }}"
            secrets:
              DB_PASSWORD: '{{ required "settings.batch_processing.db_password_secret_arn is required" .settings.batch_processing.db_password_secret_arn }}'
            # Read the input and output buckets, write the output bucket,
            # through S3 with kms/main (both buckets' key).
            job_role_policy_json: &batch_job_data_policy >-
              {"Version": "2012-10-17", "Statement": [
              {"Sid": "ListBuckets", "Effect": "Allow", "Action": "s3:ListBucket",
              "Resource": ["arn:aws:s3:::{{ .atmos_stack }}-batch-input",
              "arn:aws:s3:::{{ .atmos_stack }}-batch-output"]},
              {"Sid": "ReadObjects", "Effect": "Allow", "Action": "s3:GetObject",
              "Resource": ["arn:aws:s3:::{{ .atmos_stack }}-batch-input/*",
              "arn:aws:s3:::{{ .atmos_stack }}-batch-output/*"]},
              {"Sid": "WriteOutput", "Effect": "Allow", "Action": "s3:PutObject",
              "Resource": "arn:aws:s3:::{{ .atmos_stack }}-batch-output/*"},
              {"Sid": "BucketKeyThroughS3", "Effect": "Allow", "Action": ["kms:Decrypt", "kms:GenerateDataKey*"],
              "Resource": "arn:aws:kms:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:key/*",
              "Condition": {"StringEquals": {"kms:ViaService": "s3.{{ .vars.region }}.amazonaws.com"},
              "StringLike": {"kms:EncryptionContext:aws:s3:arn": [
              "arn:aws:s3:::{{ .atmos_stack }}-batch-input*",
              "arn:aws:s3:::{{ .atmos_stack }}-batch-output*"]}}}]}
            retry_strategy:
              attempts: 3
              # Retry a lost host; exit when the application itself failed
              # (any exit code). Infrastructure failures, such as a Fargate Spot
              # interruption, carry no exit code, so they match neither entry
              # and use the remaining attempts. A pattern takes a wildcard only
              # at its end, so the old on_reason "*error*" could not be kept.
              evaluate_on_exit:
                - on_status_reason: "Host EC2*"
                  action: RETRY
                - on_exit_code: "*"
                  action: EXIT
            timeout_seconds: 3600

          etl_job:
            image: '{{ required "settings.batch_processing.etl_job_image is required" .settings.batch_processing.etl_job_image }}'
            vcpu: 2
            memory: 4096
            log_stream_prefix: etl-job
            # Ref:: placeholders: batch-processing/stepfunctions/data-pipeline
            # passes them as job Parameters.
            command:
              - "--input"
              - "Ref::input_path"
              - "--output"
              - "Ref::output_path"
              - "--date"
              - "Ref::processing_date"
            environment:
              ENVIRONMENT: "{{ .settings.context.stage }}"
            job_role_policy_json: *batch_job_data_policy
            retry_strategy:
              attempts: 2
            timeout_seconds: 7200

          report_generator:
            image: '{{ required "settings.batch_processing.report_generator_image is required" .settings.batch_processing.report_generator_image }}'
            vcpu: 0.5
            memory: 1024
            log_stream_prefix: report-generator
            job_role_policy_json: *batch_job_data_policy
            retry_strategy:
              attempts: 1
            timeout_seconds: 1800

          # On the gpu queue (disabled by default).
          ml_training:
            platform_capability: EC2
            image: '{{ required "settings.batch_processing.ml_training_image is required" .settings.batch_processing.ml_training_image }}'
            vcpu: 8
            memory: 32768
            gpu: 1
            log_stream_prefix: ml-training
            linux_parameters:
              shared_memory_size: 4096
              devices:
                - host_path: "/dev/nvidia0"
                  container_path: "/dev/nvidia0"
                  permissions:
                    - "READ"
                    - "WRITE"
            job_role_policy_json: *batch_job_data_policy
            retry_strategy:
              attempts: 2
            timeout_seconds: 86400

        tags:
          Layer: "compute"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/vpc
          - component: batch-processing/securitygroups
          - component: batch-processing/s3-input
          - component: batch-processing/s3-output

    # =========================================================================
    # WORKFLOW ORCHESTRATION (Step Functions)
    # =========================================================================
    # One state machine per instance (stepfunctions, the Cloud Posse
    # aws-step-functions model), "<Environment>-<name>", KMS-encrypted and
    # logging (level ALL with execution data) with X-Ray on, each with its own
    # execution role. events_role_enabled creates the role the EventBridge
    # rules below start it with.
    #
    # .sync Batch tasks need, besides batch:SubmitJob on the queues and
    # definitions, batch:DescribeJobs/TerminateJob (no resource-level scope
    # for DescribeJobs) and the managed StepFunctionsGetEventsForBatchJobsRule
    # (AWS's documented policy for the Batch .sync integration).

    # Data pipeline: validate, process, ETL, report, notify.
    batch-processing/stepfunctions/data-pipeline:
      metadata:
        component: stepfunctions
        type: real
        inherits:
          - stepfunctions/defaults
      vars:
        name: batch-data-pipeline
        events_role_enabled: true
        # Every Catch keeps the state's input and records the error at
        # $.error, which NotifyFailure publishes with $.job_id.
        definition:
          Comment: "Data processing pipeline workflow"
          StartAt: "ValidateInput"
          States:
            ValidateInput:
              Type: "Task"
              Resource: "arn:aws:states:::lambda:invoke"
              Parameters:
                FunctionName: '{{ required "settings.batch_processing.validation_lambda_arn is required" .settings.batch_processing.validation_lambda_arn }}'
                Payload.$: "$"
              ResultPath: "$.validation"
              Next: "CheckValidation"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  ResultPath: "$.error"
                  Next: "NotifyFailure"

            CheckValidation:
              Type: "Choice"
              Choices:
                - Variable: "$.validation.Payload.valid"
                  BooleanEquals: true
                  Next: "SubmitProcessingJob"
              Default: "NotifyInvalidInput"

            NotifyInvalidInput:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state batch-processing/sns/notifications .sns_topic_arn
                Message:
                  Status: "INVALID_INPUT"
                  Input.$: "$.input_path"
                  Errors.$: "$.validation.Payload.errors"
              End: true

            SubmitProcessingJob:
              Type: "Task"
              Resource: "arn:aws:states:::batch:submitJob.sync"
              Parameters:
                JobName.$: "States.Format('process-{}', $.job_id)"
                JobDefinition: !terraform.state batch-processing/batch .job_definition_names.data_processor
                JobQueue: !terraform.state batch-processing/batch .job_queue_arns.default
                ContainerOverrides:
                  Command.$: "States.Array('--input', $.input_path, '--output', $.output_path)"
              ResultPath: "$.processing_result"
              Next: "CheckProcessingResult"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  ResultPath: "$.error"
                  Next: "NotifyFailure"

            CheckProcessingResult:
              Type: "Choice"
              Choices:
                - Variable: "$.processing_result.Status"
                  StringEquals: "SUCCEEDED"
                  Next: "SubmitETLJob"
              Default: "ProcessingJobFailed"

            # The job ended without SUCCEEDED but raised no error, so there is
            # no $.error for NotifyFailure yet: record one, keeping the input.
            ProcessingJobFailed:
              Type: "Pass"
              Parameters:
                Error: "ProcessingJobFailed"
                Status.$: "$.processing_result.Status"
              ResultPath: "$.error"
              Next: "NotifyFailure"

            SubmitETLJob:
              Type: "Task"
              Resource: "arn:aws:states:::batch:submitJob.sync"
              Parameters:
                JobName.$: "States.Format('etl-{}', $.job_id)"
                JobDefinition: !terraform.state batch-processing/batch .job_definition_names.etl_job
                JobQueue: !terraform.state batch-processing/batch .job_queue_arns.default
                Parameters:
                  input_path.$: "$.output_path"
                  output_path.$: "$.final_output_path"
                  processing_date.$: "$.processing_date"
              ResultPath: "$.etl_result"
              Next: "GenerateReport"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  ResultPath: "$.error"
                  Next: "NotifyFailure"

            GenerateReport:
              Type: "Task"
              Resource: "arn:aws:states:::batch:submitJob.sync"
              Parameters:
                JobName.$: "States.Format('report-{}', $.job_id)"
                JobDefinition: !terraform.state batch-processing/batch .job_definition_names.report_generator
                JobQueue: !terraform.state batch-processing/batch .job_queue_arns.low_priority
              ResultPath: "$.report_result"
              Next: "NotifySuccess"
              Catch:
                - ErrorEquals:
                    - "States.ALL"
                  ResultPath: "$.error"
                  Next: "NotifyFailure"

            NotifySuccess:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state batch-processing/sns/notifications .sns_topic_arn
                Message:
                  Status: "SUCCESS"
                  JobId.$: "$.job_id"
                  OutputPath.$: "$.final_output_path"
                  Duration.$: "$$.State.EnteredTime"
              End: true

            NotifyFailure:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state batch-processing/sns/notifications .sns_topic_arn
                Message:
                  Status: "FAILED"
                  JobId.$: "$.job_id"
                  Error.$: "$.error"
                  ExecutionId.$: "$$.Execution.Id"
              Next: "FailState"

            FailState:
              Type: "Fail"
              Error: "PipelineFailed"
              Cause: "Data pipeline workflow failed"
        iam_policies:
          - sid: InvokeValidation
            actions: ["lambda:InvokeFunction"]
            resources:
              - "{{ .settings.batch_processing.validation_lambda_arn }}"
              - "{{ .settings.batch_processing.validation_lambda_arn }}:*"
          - sid: SubmitBatchJobs
            actions: ["batch:SubmitJob"]
            resources:
              - !terraform.state batch-processing/batch .job_queue_arns.default
              - !terraform.state batch-processing/batch .job_queue_arns.low_priority
              - !terraform.state batch-processing/batch .job_definition_arn_prefixes.data_processor | . + ":*"
              - !terraform.state batch-processing/batch .job_definition_arn_prefixes.etl_job | . + ":*"
              - !terraform.state batch-processing/batch .job_definition_arn_prefixes.report_generator | . + ":*"
          # DescribeJobs takes no resource-level scope.
          - sid: DescribeBatchJobs
            actions: ["batch:DescribeJobs"]
            resources: ["*"]
          # .sync stops the job when the execution is stopped or times out.
          - sid: TerminateBatchJobs
            actions: ["batch:TerminateJob"]
            resources:
              - 'arn:aws:batch:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:job/*'
          - sid: BatchSyncEventsRule
            actions: ["events:PutTargets", "events:PutRule", "events:DescribeRule"]
            resources:
              - 'arn:aws:events:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:rule/StepFunctionsGetEventsForBatchJobsRule'
          - sid: PublishNotifications
            actions: ["sns:Publish"]
            resources:
              - !terraform.state batch-processing/sns/notifications .sns_topic_arn
          # The topic is encrypted with kms/main; Publish to it carries the
          # aws:sns:topicArn encryption context, so this grant is scoped to
          # that one topic, not the whole key.
          - sid: PublishNotificationsKMS
            actions: ["kms:GenerateDataKey*", "kms:Decrypt"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:EncryptionContext:aws:sns:topicArn"
                values:
                  - !terraform.state batch-processing/sns/notifications .sns_topic_arn
        tags:
          Layer: "orchestration"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/batch
          - component: batch-processing/sns/notifications

    # Parallel processor: lists the input files and runs a data-processor job
    # for each, then aggregates.
    batch-processing/stepfunctions/parallel-processor:
      metadata:
        component: stepfunctions
        type: real
        inherits:
          - stepfunctions/defaults
      vars:
        name: batch-parallel
        events_role_enabled: true
        definition:
          Comment: "Parallel batch processing workflow"
          StartAt: "ListInputFiles"
          States:
            ListInputFiles:
              Type: "Task"
              Resource: "arn:aws:states:::lambda:invoke"
              Parameters:
                FunctionName: '{{ required "settings.batch_processing.list_files_lambda_arn is required" .settings.batch_processing.list_files_lambda_arn }}'
                Payload.$: "$"
              ResultPath: "$.files"
              Next: "ProcessFilesInParallel"

            ProcessFilesInParallel:
              Type: "Map"
              ItemsPath: "$.files.Payload"
              MaxConcurrency: 10
              Iterator:
                StartAt: "ProcessSingleFile"
                States:
                  ProcessSingleFile:
                    Type: "Task"
                    Resource: "arn:aws:states:::batch:submitJob.sync"
                    Parameters:
                      JobName.$: "States.Format('parallel-{}', $.file_id)"
                      JobDefinition: !terraform.state batch-processing/batch .job_definition_names.data_processor
                      JobQueue: !terraform.state batch-processing/batch .job_queue_arns.low_priority
                      ContainerOverrides:
                        Command.$: "States.Array('--input', $.file_path)"
                    End: true
              ResultPath: "$.processing_results"
              Next: "AggregateResults"

            AggregateResults:
              Type: "Task"
              Resource: "arn:aws:states:::lambda:invoke"
              Parameters:
                FunctionName: '{{ required "settings.batch_processing.aggregate_lambda_arn is required" .settings.batch_processing.aggregate_lambda_arn }}'
                Payload.$: "$"
              End: true
        iam_policies:
          - sid: InvokeLambdas
            actions: ["lambda:InvokeFunction"]
            resources:
              - "{{ .settings.batch_processing.list_files_lambda_arn }}"
              - "{{ .settings.batch_processing.list_files_lambda_arn }}:*"
              - "{{ .settings.batch_processing.aggregate_lambda_arn }}"
              - "{{ .settings.batch_processing.aggregate_lambda_arn }}:*"
          - sid: SubmitBatchJobs
            actions: ["batch:SubmitJob"]
            resources:
              - !terraform.state batch-processing/batch .job_queue_arns.low_priority
              - !terraform.state batch-processing/batch .job_definition_arn_prefixes.data_processor | . + ":*"
          # DescribeJobs takes no resource-level scope.
          - sid: DescribeBatchJobs
            actions: ["batch:DescribeJobs"]
            resources: ["*"]
          # .sync stops the job when the execution is stopped or times out.
          - sid: TerminateBatchJobs
            actions: ["batch:TerminateJob"]
            resources:
              - 'arn:aws:batch:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:job/*'
          - sid: BatchSyncEventsRule
            actions: ["events:PutTargets", "events:PutRule", "events:DescribeRule"]
            resources:
              - 'arn:aws:events:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:rule/StepFunctionsGetEventsForBatchJobsRule'
        tags:
          Layer: "orchestration"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/batch

    # =========================================================================
    # SCHEDULING (EventBridge)
    # =========================================================================
    # One rule per instance on the default bus, each "<Environment>-<name>"
    # and logging what it fires on to its own CloudWatch log group (the Cloud
    # Posse aws-eventbridge model). The queue policies above name these rules,
    # so a renamed rule must be renamed there too. A delivery that still fails
    # after the retry policy goes to batch-processing/sqs/eventbridge-dlq.
    # Every instance lists kms/main itself: its own dependencies list replaces
    # the one inherited from eventbridge/defaults. Step Functions targets use
    # the state machine's own events role, the Batch target the batch
    # instance's.

    # Daily batch processing: starts the data pipeline at 2 AM UTC. The paths
    # are built from the bucket names the s3 instances set (bucket_name).
    # job_id is the event ID, since Batch job names take no colons (the
    # pipeline names jobs "process-<job_id>"); processing_date is the time the
    # schedule fired.
    batch-processing/eventbridge/daily-batch:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: daily-batch
        cloudwatch_event_rule_description: "Triggers daily batch processing"
        schedule_expression: "cron(0 2 * * ? *)"  # 2 AM UTC
        targets:
          data-pipeline:
            arn: !terraform.state batch-processing/stepfunctions/data-pipeline .state_machine_arn
            role_arn: !terraform.state batch-processing/stepfunctions/data-pipeline .events_role_arn
            input_transformer:
              input_paths:
                id: "$.id"
                time: "$.time"
              input_template: '{"job_id": "<id>", "input_path": "s3://{{ .atmos_stack }}-batch-input/incoming/", "output_path": "s3://{{ .atmos_stack }}-batch-output/processed/", "final_output_path": "s3://{{ .atmos_stack }}-batch-output/final/", "processing_date": "<time>"}'
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/stepfunctions/data-pipeline
          - component: batch-processing/sqs/eventbridge-dlq

    # Hourly lightweight processing: submits a data-processor job to the
    # low-priority queue. Off by default (the old rule was DISABLED); set
    # metadata.enabled: true in a stack to run it.
    batch-processing/eventbridge/hourly-batch:
      metadata:
        component: eventbridge
        type: real
        enabled: false
        inherits:
          - eventbridge/defaults
      vars:
        name: hourly-batch
        cloudwatch_event_rule_description: "Triggers hourly lightweight batch jobs"
        schedule_expression: "rate(1 hour)"
        targets:
          lightweight-job:
            arn: !terraform.state batch-processing/batch .job_queue_arns.low_priority
            role_arn: !terraform.state batch-processing/batch .events_role_arn
            batch_target:
              job_definition: !terraform.state batch-processing/batch .job_definition_names.data_processor
              job_name: "hourly-process"
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/batch
          - component: batch-processing/sqs/eventbridge-dlq

    # S3 event processing: runs the parallel processor for each object created
    # under incoming/ in the input bucket (named as batch-processing/s3-input
    # sets it). S3 only sends these events once the bucket's EventBridge
    # notifications are on.
    batch-processing/eventbridge/s3-trigger:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: s3-trigger
        cloudwatch_event_rule_description: "Processes new files uploaded to S3"
        cloudwatch_event_rule_pattern:
          source:
            - "aws.s3"
          detail-type:
            - "Object Created"
          detail:
            bucket:
              name:
                - "{{ .atmos_stack }}-batch-input"
            object:
              key:
                - prefix: "incoming/"
        targets:
          parallel-processor:
            arn: !terraform.state batch-processing/stepfunctions/parallel-processor .state_machine_arn
            role_arn: !terraform.state batch-processing/stepfunctions/parallel-processor .events_role_arn
            input_transformer:
              input_paths:
                bucket: "$.detail.bucket.name"
                key: "$.detail.object.key"
              input_template: '{"bucket": "<bucket>", "key": "<key>"}'
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/stepfunctions/parallel-processor
          - component: batch-processing/sqs/eventbridge-dlq

    # Batch job status changes: this stack's failed and succeeded jobs go to
    # the notifications queue, whose policy lets this rule send
    # (batch-processing/sqs/notifications).
    batch-processing/eventbridge/batch-status:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: batch-status
        cloudwatch_event_rule_description: "Monitors batch job status changes"
        cloudwatch_event_rule_pattern:
          source:
            - "aws.batch"
          detail-type:
            - "Batch Job State Change"
          detail:
            status:
              - "FAILED"
              - "SUCCEEDED"
            # The event carries the queue's ARN, not its name; the queues are
            # batch-processing/batch's "<Environment>-batch-<key>".
            jobQueue:
              - wildcard: "arn:aws:batch:{{ .vars.region }}:*:job-queue/{{ .settings.prefix }}-batch-*"
        targets:
          notification-queue:
            arn: !terraform.state batch-processing/sqs/notifications .queue_arn
            dead_letter_config:
              arn: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "scheduling"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/sqs/notifications
          - component: batch-processing/sqs/eventbridge-dlq

    # =========================================================================
    # LAMBDA FUNCTIONS (Supporting)
    # =========================================================================

    # Submits Batch jobs from the two job queues' messages. The function is
    # "<Environment>-batch-job-submitter", packaged in s3/lambda-artifacts
    # (REQUIREMENTS 2). It shares deploy-full-stack's compute layer with
    # batch-processing/batch, so it cannot read that instance's state (a
    # layer plans before it applies): the queue and job definition names are
    # built from the batch instance's naming, "<Environment>-batch-<key>"
    # (SubmitJob takes a queue name and runs a definition name's latest
    # revision), and the dependency below applies batch first.
    batch-processing/lambda-job-submitter:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: "batch-job-submitter"
        runtime: "python3.13"
        handler: "handler.submit_job"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: 'batch-job-submitter/{{ required "settings.batch_processing.job_submitter_version is required" .settings.batch_processing.job_submitter_version }}.zip'
        timeout: 60
        memory_size: 256
        reserved_concurrent_executions: 10
        # Environment variables and the function's log group, with the stack key.
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn

        environment_variables:
          ENVIRONMENT: "{{ .settings.context.stage }}"
          HIGH_PRIORITY_QUEUE: "{{ .settings.prefix }}-batch-high_priority"
          DEFAULT_QUEUE: "{{ .settings.prefix }}-batch-default"
          LOW_PRIORITY_QUEUE: "{{ .settings.prefix }}-batch-low_priority"
          JOB_DEFINITION: "{{ .settings.prefix }}-batch-data_processor"

        # The queues' visibility timeout (43200 s) is well over 6x this
        # function's timeout plus the batching window. The component grants
        # the role sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes on
        # exactly these queues, and kms:Decrypt on their key below.
        event_source_mappings:
          sqs_high:
            event_source_arn: !terraform.state batch-processing/sqs/jobs-high .queue_arn
            batch_size: 10
            maximum_batching_window_in_seconds: 0
          sqs_low:
            event_source_arn: !terraform.state batch-processing/sqs/jobs-low .queue_arn
            batch_size: 10
            maximum_batching_window_in_seconds: 60
        # Both queues are encrypted with kms/main (sqs/defaults).
        event_source_kms_key_arns:
          - !terraform.state kms/main .key_arn

        # Submit the data processor to the three Fargate queues.
        custom_policy: >-
          {"Version": "2012-10-17", "Statement": [
          {"Sid": "SubmitJobs", "Effect": "Allow", "Action": "batch:SubmitJob",
          "Resource": [
          "arn:aws:batch:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:job-queue/{{ .settings.prefix }}-batch-high_priority",
          "arn:aws:batch:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:job-queue/{{ .settings.prefix }}-batch-default",
          "arn:aws:batch:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:job-queue/{{ .settings.prefix }}-batch-low_priority",
          "arn:aws:batch:{{ .vars.region }}:{{ required "settings.environment.account_id is required" .settings.environment.account_id }}:job-definition/{{ .settings.prefix }}-batch-data_processor:*"]},
          {"Sid": "DescribeJobs", "Effect": "Allow", "Action": "batch:DescribeJobs", "Resource": "*"}]}

        tags:
          Layer: "compute"
          Function: "job-submitter"
      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          - component: batch-processing/sqs/jobs-high
          - component: batch-processing/sqs/jobs-low
          - component: batch-processing/batch

    # =========================================================================
    # MONITORING
    # =========================================================================

    # Resources are "<Environment>-batch-<suffix>" (name), alarms
    # "<Environment>-<key>", all notifying the instance's KMS-encrypted alarm
    # topic.
    batch-processing/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        name: batch
        kms_key_id: !terraform.state kms/main .key_arn

        # No certificates in this template.
        enable_certificate_monitoring: false

        # Infrastructure dashboard for the template's VPC.
        create_dashboard: true
        vpc_id: !terraform.state batch-processing/vpc .vpc_id

        metric_dashboards:
          batch-overview:
            widgets:
              - title: "Compute Environment"
                period: 60
                stat: "Average"
                metrics:
                  - namespace: "AWS/Batch"
                    metric: "DesiredvCPUs"
                    dimensions:
                      ComputeEnvironmentName: !terraform.state batch-processing/batch .compute_environment_names.fargate
                  - namespace: "AWS/Batch"
                    metric: "RunningvCPUs"
                    dimensions:
                      ComputeEnvironmentName: !terraform.state batch-processing/batch .compute_environment_names.fargate
              - title: "Jobs Submitted / Failed"
                period: 300
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Batch"
                    metric: "JobsSubmitted"
                    dimensions:
                      JobQueue: !terraform.state batch-processing/batch .job_queue_names.default
                  - namespace: "AWS/Batch"
                    metric: "JobsFailed"
                    dimensions:
                      JobQueue: !terraform.state batch-processing/batch .job_queue_names.default
              - title: "Jobs Running"
                period: 60
                stat: "Average"
                metrics:
                  - namespace: "AWS/Batch"
                    metric: "JobsRunning"
                    dimensions:
                      JobQueue: !terraform.state batch-processing/batch .job_queue_names.default
              - title: "Workflow Executions"
                period: 300
                stat: "Sum"
                metrics:
                  - namespace: "AWS/States"
                    metric: "ExecutionsSucceeded"
                    dimensions:
                      StateMachineArn: !terraform.state batch-processing/stepfunctions/data-pipeline .state_machine_arn
                  - namespace: "AWS/States"
                    metric: "ExecutionsFailed"
                    dimensions:
                      StateMachineArn: !terraform.state batch-processing/stepfunctions/data-pipeline .state_machine_arn
              - title: "Workflow Execution Time"
                period: 300
                stat: "Average"
                metrics:
                  - namespace: "AWS/States"
                    metric: "ExecutionTime"
                    dimensions:
                      StateMachineArn: !terraform.state batch-processing/stepfunctions/data-pipeline .state_machine_arn
              - title: "Queue Depth"
                period: 60
                stat: "Average"
                metrics:
                  - namespace: "AWS/SQS"
                    metric: "ApproximateNumberOfMessagesVisible"
                    dimensions:
                      QueueName: !terraform.state batch-processing/sqs/jobs-high .queue_name
                  - namespace: "AWS/SQS"
                    metric: "ApproximateNumberOfMessagesVisible"
                    dimensions:
                      QueueName: !terraform.state batch-processing/sqs/jobs-low .queue_name
              - title: "Dead-letter Queue Depth"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/SQS"
                    metric: "ApproximateNumberOfMessagesVisible"
                    dimensions:
                      QueueName: !terraform.state batch-processing/sqs/jobs-high .dead_letter_queue_name
                  - namespace: "AWS/SQS"
                    metric: "ApproximateNumberOfMessagesVisible"
                    dimensions:
                      QueueName: !terraform.state batch-processing/sqs/jobs-low .dead_letter_queue_name

        metric_alarms:
          batch-job-failures:
            namespace: "AWS/Batch"
            metric_name: "JobsFailed"
            dimensions:
              JobQueue: !terraform.state batch-processing/batch .job_queue_names.default
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
          # Too many pending jobs.
          batch-queue-depth:
            namespace: "AWS/Batch"
            metric_name: "JobsPending"
            dimensions:
              JobQueue: !terraform.state batch-processing/batch .job_queue_names.default
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 3
            period: 300
            statistic: "Average"
          batch-workflow-failures:
            namespace: "AWS/States"
            metric_name: "ExecutionsFailed"
            dimensions:
              StateMachineArn: !terraform.state batch-processing/stepfunctions/data-pipeline .state_machine_arn
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
          # One alarm per job queue's dead-letter queue.
          batch-jobs-high-dlq:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state batch-processing/sqs/jobs-high .dead_letter_queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
          batch-jobs-low-dlq:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state batch-processing/sqs/jobs-low .dead_letter_queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
          # EventBridge deliveries that failed after their retries.
          batch-eventbridge-dlq:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state batch-processing/sqs/eventbridge-dlq .queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Sum"
          # Fargate environment pinned at its max_vcpus.
          batch-compute-stuck:
            namespace: "AWS/Batch"
            metric_name: "DesiredvCPUs"
            dimensions:
              ComputeEnvironmentName: !terraform.state batch-processing/batch .compute_environment_names.fargate
            comparison_operator: "GreaterThanOrEqualToThreshold"
            threshold: 256
            evaluation_periods: 3
            period: 300
            statistic: "Maximum"

        # On-call addresses per stack (REQUIREMENTS 6).
        alarm_email_subscriptions: []

        tags:
          Layer: "monitoring"
          Platform: "batch-processing"
      dependencies:
        components:
          - component: kms/main
          - component: batch-processing/vpc
          - component: batch-processing/batch
          - component: batch-processing/stepfunctions/data-pipeline
          - component: batch-processing/sqs/jobs-high
          - component: batch-processing/sqs/jobs-low
          - component: batch-processing/sqs/eventbridge-dlq

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES (examples, set on the instances above)
# =============================================================================
#
# Development:
#   batch-processing/batch: compute_environments.fargate.max_vcpus 64,
#     fargate-spot 128; job_definitions.data_processor vcpu 0.5 / memory 1024,
#     timeout_seconds 1800
#   batch-processing/vpc: nat_gateway_strategy "single"
#
# Staging:
#   batch-processing/batch: fargate 128, fargate-spot 256
#   batch-processing/eventbridge/hourly-batch: metadata.enabled true
#
# Production:
#   batch-processing/vpc: nat_gateway_strategy "one_per_az"
#   batch-processing/batch: fargate 512, fargate-spot 1024; compute_environments.ec2
#     and job_queues.gpu state ENABLED; data_processor vcpu 2 / memory 4096,
#     timeout_seconds 7200; etl_job vcpu 4 / memory 8192
#   batch-processing/eventbridge/hourly-batch: metadata.enabled true

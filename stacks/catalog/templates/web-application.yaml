---
# =============================================================================
# WEB APPLICATION STACK TEMPLATE
# =============================================================================
# Complete 3-tier web application infrastructure
#
# Architecture:
#   - VPC with public/private/database subnets
#   - ALB with WAF protection
#   - ECS Fargate or EC2 Auto-scaling for compute
#   - RDS Aurora or single instance for database
#   - ElastiCache Redis for caching
#   - CloudFront for CDN
#   - Route53 for DNS
#   - ACM for SSL/TLS certificates
#   - CloudWatch for monitoring
#   - Security groups and NACLs for network security
#
# Cost Estimates (Monthly):
#   Development:  ~$150-300/month
#   Staging:      ~$300-600/month
#   Production:   ~$800-2,500/month (depending on traffic and redundancy)
#
# Deployment Time: 25-40 minutes
#
# Usage:
#   atmos terraform plan web-application -s <tenant>-<account>-<environment>
#   atmos terraform apply web-application -s <tenant>-<account>-<environment>
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/securitygroup/defaults
  - catalog/acm/defaults
  - catalog/alb/defaults
  - catalog/waf/defaults
  - catalog/monitoring/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING LAYER
    # =========================================================================

    web-application/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        name: "webapp"

        # VPC CIDR configuration
        # Development uses smaller CIDR, production uses larger
        ipv4_primary_cidr_block: "10.10.0.0/16"

        # Availability zones for high availability
        availability_zones:
          - "{{ .vars.region }}a"
          - "{{ .vars.region }}b"
          - "{{ .vars.region }}c"

        # Subnet configuration - 3-tier architecture
        private_subnets:
          - "10.10.1.0/24"   # Application tier AZ-a
          - "10.10.2.0/24"   # Application tier AZ-b
          - "10.10.3.0/24"   # Application tier AZ-c
        public_subnets:
          - "10.10.101.0/24" # ALB/NAT tier AZ-a
          - "10.10.102.0/24" # ALB/NAT tier AZ-b
          - "10.10.103.0/24" # ALB/NAT tier AZ-c
        database_subnets:
          - "10.10.201.0/24" # Database tier AZ-a
          - "10.10.202.0/24" # Database tier AZ-b
          - "10.10.203.0/24" # Database tier AZ-c

        # NAT Gateway strategy
        # single: cost-optimized for dev/staging
        # one_per_az: high availability for production
        nat_gateway_enabled: true
        nat_gateway_strategy: "single"

        # VPC Flow Logs for security and troubleshooting
        vpc_flow_logs_enabled: true
        vpc_flow_logs_traffic_type: "ALL"

        # Security settings
        default_sg_ingress_self_only: true
        default_sg_egress_self_only: false

        tags:
          Layer: "networking"
          Application: "web-application"

    # =========================================================================
    # SECURITY LAYER
    # =========================================================================

    web-application/securitygroups:
      metadata:
        component: securitygroup
        type: real
      vars:
        vpc_id: !terraform.state web-application/vpc .vpc_id

        # source_security_group_id below is either a sibling key in this map
        # (resolved to that group's id once the group exists) or, for
        # "http-from-alb", a literal sg- id read from the alb component (the
        # ALB owns its own security group; there is no sibling "alb" group in
        # this map any more). An unknown key or malformed id fails
        # var.security_groups validation at plan.
        security_groups:
          # Application Security Group - allows traffic from the ALB only
          application:
            preserve_security_group_id: true
            description: "Security group for web application containers"
            ingress_rules:
              - key: "http-from-alb"
                description: "HTTP from ALB"
                from_port: 8080
                to_port: 8080
                protocol: "tcp"
                source_security_group_id: !terraform.state web-application/alb .security_group_id
            egress_rules:
              - key: "https-aws"
                description: "HTTPS to AWS services"
                from_port: 443
                to_port: 443
                protocol: "tcp"
                cidr_blocks:
                  - "0.0.0.0/0"
              - key: "postgres"
                description: "Database access"
                from_port: 5432
                to_port: 5432
                protocol: "tcp"
                source_security_group_id: "database"
              - key: "redis"
                description: "Redis cache access"
                from_port: 6379
                to_port: 6379
                protocol: "tcp"
                source_security_group_id: "cache"

          # Database Security Group - allows traffic from application only
          database:
            preserve_security_group_id: true
            description: "Security group for RDS database"
            ingress_rules:
              - key: "postgres-from-app"
                description: "PostgreSQL from application"
                from_port: 5432
                to_port: 5432
                protocol: "tcp"
                source_security_group_id: "application"
            egress_rules: []

          # Cache Security Group - allows traffic from application only
          cache:
            preserve_security_group_id: true
            description: "Security group for ElastiCache"
            ingress_rules:
              - key: "redis-from-app"
                description: "Redis from application"
                from_port: 6379
                to_port: 6379
                protocol: "tcp"
                source_security_group_id: "application"
            egress_rules: []
        tags:
          Layer: "security"
          Application: "web-application"

    # =========================================================================
    # SSL/TLS CERTIFICATES
    # =========================================================================

      dependencies:
        components:
          - component: web-application/vpc
          # For the application group's "http-from-alb" rule, which reads the
          # ALB's own security group id. The ALB does not depend on this
          # component (it owns its security group), so this is not a cycle.
          - component: web-application/alb
    web-application/acm:
      metadata:
        component: acm
        type: real
        inherits:
          - acm/defaults
      vars:
        dns_domains:
          main:
            domain_name: "{{ .vars.app_domain_name }}"
            subject_alternative_names:
              - "*.{{ .vars.app_domain_name }}"
            validation_method: "DNS"
        zone_id: "{{ .vars.route53_zone_id }}"

        tags:
          Layer: "security"
          Application: "web-application"

    # =========================================================================
    # LOAD BALANCER LAYER
    # =========================================================================

    web-application/alb:
      metadata:
        component: alb
        type: real
        inherits:
          - alb/defaults
      vars:
        # Short name: the component prefixes it with Environment (see
        # components/terraform/alb/README.md). ecs-service, cloudfront and
        # monitoring (later tasks / below) read this instance's outputs --
        # alb_arn, alb_arn_suffix, alb_dns_name, alb_zone_id,
        # https_listener_arn, default_target_group_arn, security_group_id,
        # access_logs_bucket_id.
        name: "webapp-alb"

        vpc_id: !terraform.state web-application/vpc .vpc_id
        subnets: !terraform.state web-application/vpc .public_subnet_ids
        certificate_arn: !terraform.state web-application/acm .certificate_arns.main

        # The default target group is what web-application/ecs-service
        # registers its tasks into (see the load_balancer.target_group_arn
        # reference below); the webapp container (see its portMappings /
        # healthCheck below) serves /health on 8080, not the target group's
        # default "/".
        health_check_path: "/health"

        access_logs_prefix: "webapp"

        tags:
          Layer: "load-balancer"
          Application: "web-application"

    # =========================================================================
    # WAF PROTECTION
    # =========================================================================

      dependencies:
        components:
          - component: web-application/vpc
          - component: web-application/acm
    web-application/waf:
      metadata:
        component: waf
        type: real
        inherits:
          - waf/defaults
      vars:
        name: "webapp-waf"
        scope: "REGIONAL"

        # Every stack runs a kms/main instance (catalog/kms/defaults), so this
        # resolves everywhere; see stacks/catalog/waf/defaults.yaml for why
        # this is set per REGIONAL instance rather than defaulted.
        kms_key_arn: !terraform.state kms/main .key_arn

        # Associate with the ALB
        association_resource_arns:
          - !terraform.state web-application/alb .alb_arn

        # WAF rules
        managed_rule_group_statement_rules:
          - name: "AWSManagedRulesCommonRuleSet"
            priority: 10
          - name: "AWSManagedRulesKnownBadInputsRuleSet"
            priority: 20
          - name: "AWSManagedRulesSQLiRuleSet"
            priority: 30
          - name: "AWSManagedRulesLinuxRuleSet"
            priority: 40

        # Rate limiting
        rate_based_statement_rules:
          - name: "RateLimitRule"
            priority: 1
            limit: 2000
            aggregate_key_type: "IP"
            action: "block"

        tags:
          Layer: "security"
          Application: "web-application"

      dependencies:
        components:
          - component: web-application/alb
          - component: kms/main

    # =========================================================================
    # WAF PROTECTION (CLOUDFRONT SCOPE)
    # =========================================================================
    # No association: a CLOUDFRONT-scope web ACL is attached by setting the
    # distribution's web_acl_id to this instance's `arn` output, which the
    # later web-application/cloudfront task reads (see the cloudfront section
    # below). region is pinned to us-east-1 -- an AWS requirement for
    # CLOUDFRONT-scope web ACLs -- independent of this stack's own region.
    web-application/waf-cloudfront:
      metadata:
        component: waf
        type: real
        inherits:
          - waf/defaults
      vars:
        region: "us-east-1"
        name: "webapp-waf-cf"
        scope: "CLOUDFRONT"
        # kms/main lives in this stack's own region (eu-west-2) and cannot
        # encrypt a us-east-1 log group; see components/terraform/waf/README.md.
        kms_key_arn: null

        managed_rule_group_statement_rules:
          - name: "AWSManagedRulesCommonRuleSet"
            priority: 10
          - name: "AWSManagedRulesKnownBadInputsRuleSet"
            priority: 20

        rate_based_statement_rules:
          - name: "RateLimitRule"
            priority: 1
            limit: 2000
            aggregate_key_type: "IP"
            action: "block"

        tags:
          Layer: "security"
          Application: "web-application"

    # =========================================================================
    # COMPUTE LAYER - ECS FARGATE
    # =========================================================================

    web-application/ecs-cluster:
      metadata:
        component: ecs
        type: real
      vars:
        cluster_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp"

        # Fargate-only cluster (no EC2 instances to manage)
        fargate_only: true
        enable_container_insights: true

        # Capacity providers
        capacity_providers:
          - "FARGATE"
          - "FARGATE_SPOT"

        default_capacity_provider_strategy:
          - capacity_provider: "FARGATE"
            weight: 1
            base: 1
          - capacity_provider: "FARGATE_SPOT"
            weight: 4

        tags:
          Layer: "compute"
          Application: "web-application"

    web-application/ecs-service:
      metadata:
        component: ecs-service
        type: real
      vars:
        name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-service"
        cluster_arn: !terraform.state web-application/ecs-cluster .cluster_arn

        # Task definition
        task_definition:
          family: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp"
          cpu: 256
          memory: 512
          network_mode: "awsvpc"
          requires_compatibilities:
            - "FARGATE"
          execution_role_arn: "{{ .vars.ecs_execution_role_arn }}"
          task_role_arn: "{{ .vars.ecs_task_role_arn }}"

          container_definitions:
            - name: "webapp"
              image: "{{ .vars.app_container_image }}"
              essential: true
              portMappings:
                - containerPort: 8080
                  protocol: "tcp"
              environment:
                - name: "ENVIRONMENT"
                  value: "{{ .settings.context.environment }}"
                - name: "DATABASE_HOST"
                  value: !terraform.state web-application/rds .endpoint
                - name: "REDIS_HOST"
                  value: !terraform.state web-application/elasticache .endpoint
              secrets:
                - name: "DATABASE_PASSWORD"
                  valueFrom: "{{ .vars.database_password_secret_arn }}"
              logConfiguration:
                logDriver: "awslogs"
                options:
                  awslogs-group: "/ecs/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp"
                  awslogs-region: "{{ .vars.region }}"
                  awslogs-stream-prefix: "webapp"
              healthCheck:
                command:
                  - "CMD-SHELL"
                  - "curl -f http://localhost:8080/health || exit 1"
                interval: 30
                timeout: 5
                retries: 3
                startPeriod: 60

        # Service configuration
        desired_count: 2
        deployment_minimum_healthy_percent: 50
        deployment_maximum_percent: 200

        # Network configuration
        network_configuration:
          subnets: !terraform.state web-application/vpc .private_subnet_ids
          security_groups:
            - !terraform.state web-application/securitygroups .security_group_ids.application
          assign_public_ip: false

        # Load balancer configuration
        load_balancer:
          target_group_arn: !terraform.state web-application/alb .default_target_group_arn
          container_name: "webapp"
          container_port: 8080

        # Auto-scaling configuration
        enable_autoscaling: true
        autoscaling:
          min_capacity: 2
          max_capacity: 10
          target_tracking_policies:
            - name: "cpu"
              target_value: 70
              predefined_metric_type: "ECSServiceAverageCPUUtilization"
              scale_in_cooldown: 300
              scale_out_cooldown: 60
            - name: "memory"
              target_value: 80
              predefined_metric_type: "ECSServiceAverageMemoryUtilization"
              scale_in_cooldown: 300
              scale_out_cooldown: 60

        # Deployment circuit breaker
        deployment_circuit_breaker:
          enable: true
          rollback: true

        tags:
          Layer: "compute"
          Application: "web-application"

    # =========================================================================
    # DATABASE LAYER
    # =========================================================================

      dependencies:
        components:
          - component: web-application/ecs-cluster
          - component: web-application/alb
          - component: web-application/securitygroups
    web-application/rds:
      metadata:
        component: rds
        type: real
      vars:
        identifier: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-db"

        # Engine configuration
        engine: "postgres"
        engine_version: "15.4"
        family: "postgres15"

        # Instance configuration
        # dev: db.t3.micro, staging: db.t3.small, prod: db.r6g.large
        instance_class: "db.t3.micro"
        allocated_storage: 20
        max_allocated_storage: 100
        storage_type: "gp3"
        storage_encrypted: true

        # Database configuration
        db_name: "webapp"
        username: "webapp_admin"
        port: 5432

        # Network configuration
        db_subnet_group_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-db-subnet"
        subnet_ids: !terraform.state web-application/vpc .database_subnet_ids
        vpc_security_group_ids:
          - !terraform.state web-application/securitygroups .security_group_ids.database
        publicly_accessible: false

        # High availability
        # dev/staging: false, prod: true
        multi_az: false

        # Backup configuration
        backup_retention_period: 7
        # RDS rejects a maintenance window that overlaps the backup window and
        # wants >= 30 minutes of separation. These two were adjacent (backup
        # closing at 04:00, maintenance opening at 04:00) - the same defect #142
        # fixed in the component default and in staging and prod. Anyone copying
        # this template would have hit it at CreateDBInstance.
        backup_window: "03:00-04:00"
        maintenance_window: "sun:04:30-sun:05:30"
        copy_tags_to_snapshot: true
        delete_automated_backups: false

        # Performance and monitoring
        performance_insights_enabled: true
        performance_insights_retention_period: 7
        monitoring_interval: 60
        enabled_cloudwatch_logs_exports:
          - "postgresql"
          - "upgrade"

        # Deletion protection
        # Enable for production
        deletion_protection: false
        skip_final_snapshot: true
        final_snapshot_identifier: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-db-final"

        # Parameter group
        parameters:
          - name: "log_statement"
            value: "all"
          - name: "log_min_duration_statement"
            value: "1000"
          - name: "shared_preload_libraries"
            value: "pg_stat_statements"

        tags:
          Layer: "database"
          Application: "web-application"

    # =========================================================================
    # CACHING LAYER
    # =========================================================================

      dependencies:
        components:
          - component: web-application/vpc
          - component: web-application/securitygroups
    web-application/elasticache:
      metadata:
        component: elasticache
        type: real
      vars:
        cluster_id: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-cache"

        # Engine configuration
        engine: "redis"
        engine_version: "7.0"

        # Node configuration
        # dev: cache.t3.micro, staging: cache.t3.small, prod: cache.r6g.large
        node_type: "cache.t3.micro"
        num_cache_nodes: 1

        # Network configuration
        subnet_group_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-cache-subnet"
        subnet_ids: !terraform.state web-application/vpc .private_subnet_ids
        security_group_ids:
          - !terraform.state web-application/securitygroups .security_group_ids.cache

        # Port configuration
        port: 6379

        # Cluster mode (for production)
        cluster_mode_enabled: false

        # Security
        at_rest_encryption_enabled: true
        transit_encryption_enabled: true
        auth_token_enabled: true

        # Maintenance
        maintenance_window: "sun:05:00-sun:06:00"
        snapshot_retention_limit: 1
        snapshot_window: "04:00-05:00"

        # Auto minor version upgrade
        auto_minor_version_upgrade: true

        # Parameter group
        parameter_group_family: "redis7"
        parameters:
          - name: "maxmemory-policy"
            value: "volatile-lru"

        tags:
          Layer: "caching"
          Application: "web-application"

    # =========================================================================
    # CDN LAYER
    # =========================================================================

      dependencies:
        components:
          - component: web-application/vpc
          - component: web-application/securitygroups
    web-application/cloudfront:
      metadata:
        component: cloudfront
        type: real
      vars:
        distribution_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-cdn"

        # Origin configuration
        origins:
          alb:
            domain_name: !terraform.state web-application/alb .alb_dns_name
            origin_id: "alb-origin"
            custom_origin_config:
              http_port: 80
              https_port: 443
              origin_protocol_policy: "https-only"
              origin_ssl_protocols:
                - "TLSv1.2"
              origin_read_timeout: 60
              origin_keepalive_timeout: 5

        # Default cache behavior
        default_cache_behavior:
          target_origin_id: "alb-origin"
          viewer_protocol_policy: "redirect-to-https"
          allowed_methods:
            - "GET"
            - "HEAD"
            - "OPTIONS"
            - "PUT"
            - "POST"
            - "PATCH"
            - "DELETE"
          cached_methods:
            - "GET"
            - "HEAD"
          compress: true
          # Use managed cache policy for dynamic content
          cache_policy_id: "658327ea-f89d-4fab-a63d-7e88639e58f6"  # CachingDisabled
          origin_request_policy_id: "216adef6-5c7f-47e4-b989-5492eafa07d3"  # AllViewer
          response_headers_policy_id: "67f7725c-6f97-4210-82d7-5512b31e9d03"  # SecurityHeadersPolicy

        # Additional cache behaviors for static assets
        ordered_cache_behaviors:
          - path_pattern: "/static/*"
            target_origin_id: "alb-origin"
            viewer_protocol_policy: "redirect-to-https"
            allowed_methods:
              - "GET"
              - "HEAD"
            cached_methods:
              - "GET"
              - "HEAD"
            compress: true
            cache_policy_id: "658327ea-f89d-4fab-a63d-7e88639e58f6"  # CachingOptimized
            ttl:
              default: 86400
              max: 31536000
              min: 0
          - path_pattern: "/api/*"
            target_origin_id: "alb-origin"
            viewer_protocol_policy: "redirect-to-https"
            allowed_methods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
              - "PUT"
              - "POST"
              - "PATCH"
              - "DELETE"
            cached_methods:
              - "GET"
              - "HEAD"
            compress: true
            cache_policy_id: "658327ea-f89d-4fab-a63d-7e88639e58f6"  # CachingDisabled

        # SSL/TLS configuration
        viewer_certificate:
          acm_certificate_arn: !terraform.state web-application/acm .certificate_arns.main
          ssl_support_method: "sni-only"
          minimum_protocol_version: "TLSv1.2_2021"

        # Aliases (custom domains)
        aliases:
          - "{{ .vars.app_domain_name }}"
          - "www.{{ .vars.app_domain_name }}"

        # Geographic restrictions (optional)
        geo_restriction:
          restriction_type: "none"

        # Logging
        logging:
          enabled: true
          bucket: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-cloudfront-logs.s3.amazonaws.com"
          prefix: "webapp/"
          include_cookies: false

        # Price class
        price_class: "PriceClass_100"

        # Enable HTTP/2 and HTTP/3
        http_version: "http2and3"

        # IPv6
        is_ipv6_enabled: true

        # WAF integration (CloudFront requires scope: CLOUDFRONT in us-east-1)
        web_acl_id: "{{ .vars.cloudfront_waf_acl_id }}"

        tags:
          Layer: "cdn"
          Application: "web-application"

    # =========================================================================
    # DNS LAYER
    # =========================================================================

      dependencies:
        components:
          - component: web-application/alb
          - component: web-application/acm
    web-application/dns:
      metadata:
        component: dns
        type: real
      vars:
        zone_id: "{{ .vars.route53_zone_id }}"

        records:
          # Root domain pointing to CloudFront
          root:
            name: "{{ .vars.app_domain_name }}"
            type: "A"
            alias:
              name: !terraform.state web-application/cloudfront .domain_name
              zone_id: !terraform.state web-application/cloudfront .hosted_zone_id
              evaluate_target_health: false

          # WWW subdomain pointing to CloudFront
          www:
            name: "www.{{ .vars.app_domain_name }}"
            type: "A"
            alias:
              name: !terraform.state web-application/cloudfront .domain_name
              zone_id: !terraform.state web-application/cloudfront .hosted_zone_id
              evaluate_target_health: false

        tags:
          Layer: "dns"
          Application: "web-application"

    # =========================================================================
    # MONITORING LAYER
    # =========================================================================

      dependencies:
        components:
          - component: web-application/cloudfront
    web-application/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        dashboard_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-dashboard"

        # Enable monitoring features
        enable_resource_monitoring: true

        # ALB alarms
        alb_alarms:
          - name: "alb-5xx-errors"
            metric_name: "HTTPCode_ELB_5XX_Count"
            namespace: "AWS/ApplicationELB"
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              LoadBalancer: !terraform.state web-application/alb .alb_arn_suffix
          - name: "alb-4xx-errors"
            metric_name: "HTTPCode_ELB_4XX_Count"
            namespace: "AWS/ApplicationELB"
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              LoadBalancer: !terraform.state web-application/alb .alb_arn_suffix
          - name: "alb-target-response-time"
            metric_name: "TargetResponseTime"
            namespace: "AWS/ApplicationELB"
            comparison_operator: "GreaterThanThreshold"
            threshold: 2
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              LoadBalancer: !terraform.state web-application/alb .alb_arn_suffix

        # ECS alarms
        ecs_alarms:
          - name: "ecs-cpu-high"
            metric_name: "CPUUtilization"
            namespace: "AWS/ECS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              ClusterName: !terraform.state web-application/ecs-cluster .cluster_name
              ServiceName: !terraform.state web-application/ecs-service .service_name
          - name: "ecs-memory-high"
            metric_name: "MemoryUtilization"
            namespace: "AWS/ECS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              ClusterName: !terraform.state web-application/ecs-cluster .cluster_name
              ServiceName: !terraform.state web-application/ecs-service .service_name

        # RDS alarms
        rds_alarms:
          - name: "rds-cpu-high"
            metric_name: "CPUUtilization"
            namespace: "AWS/RDS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              DBInstanceIdentifier: !terraform.state web-application/rds .identifier
          - name: "rds-connections-high"
            metric_name: "DatabaseConnections"
            namespace: "AWS/RDS"
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              DBInstanceIdentifier: !terraform.state web-application/rds .identifier
          - name: "rds-free-storage-low"
            metric_name: "FreeStorageSpace"
            namespace: "AWS/RDS"
            comparison_operator: "LessThanThreshold"
            threshold: 5368709120  # 5GB in bytes
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              DBInstanceIdentifier: !terraform.state web-application/rds .identifier

        # ElastiCache alarms
        elasticache_alarms:
          - name: "cache-cpu-high"
            metric_name: "CPUUtilization"
            namespace: "AWS/ElastiCache"
            comparison_operator: "GreaterThanThreshold"
            threshold: 75
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              CacheClusterId: !terraform.state web-application/elasticache .cluster_id
          - name: "cache-memory-high"
            metric_name: "DatabaseMemoryUsagePercentage"
            namespace: "AWS/ElastiCache"
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              CacheClusterId: !terraform.state web-application/elasticache .cluster_id

        # SNS for notifications
        alarm_notifications_enabled: true
        alarm_email_addresses: []
        sns_topic_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-webapp-alarms"

        tags:
          Layer: "monitoring"
          Application: "web-application"


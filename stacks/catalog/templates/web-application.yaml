---
# =============================================================================
# WEB APPLICATION STACK TEMPLATE
# =============================================================================
# Complete 3-tier web application infrastructure
#
# Architecture:
#   - VPC with public/private/database subnets
#   - CloudFront in front of everything, with a CLOUDFRONT-scope WAF, aliases
#     for the app domain and www, and standard logging (v2) to an S3 bucket
#   - An internal ALB in the private subnets, reached by CloudFront only,
#     through a CloudFront VPC origin (service-managed ENIs in the VPC): no
#     internet path and no shared secret. Its security group admits the
#     CloudFront origin-facing prefix list, its HTTPS listener answers 403
#     unless a listener rule matches (defence in depth), and a REGIONAL WAF is
#     associated with it as well.
#   - An ECS Fargate service (Fargate and Fargate Spot) behind the ALB, with
#     target-tracking autoscaling
#   - RDS PostgreSQL and ElastiCache Redis (AUTH token, TLS) admitting only the
#     application security group
#   - One ACM certificate (app domain and *.app domain) for CloudFront and the
#     ALB's origin name (origin.<app domain>)
#   - CloudWatch dashboard and alarms
#
# Request path: viewer -> CloudFront (WAF, aliases) -> VPC origin -> the
# internal ALB, TLS to origin.<app domain> -> listener rule -> tasks.
#
# Encryption: the stack's customer managed key, kms/main, encrypts the RDS
# storage, Performance Insights and master user secret, the Redis cache and its
# AUTH token secret, the ECS log group, the WAF log groups, the CloudFront log
# bucket and the monitoring alarm topic. The ALB access-log bucket is SSE-S3
# (ALB log delivery does not support SSE-KMS).
#
# Cost Estimates (Monthly):
#   Development:  ~$150-300/month
#   Staging:      ~$300-600/month
#   Production:   ~$800-2,500/month (depending on traffic and redundancy)
#
# Deployment Time: 25-40 minutes
#
# Usage (instances are web-application/<part>):
#   atmos terraform plan web-application/alb -s <tenant>-<stage>-<environment>
#   atmos workflow deploy -f deploy-full-stack -s <tenant>-<stage>-<environment>
#
# =============================================================================
# REQUIREMENTS FOR THE IMPORTING STACK
# =============================================================================
# 1. A kms/main instance (every fnx org stack has one, in components/security.yaml,
#    from catalog/kms/defaults). This template does not define it: doing so would
#    deep-merge over that stack's own alias_name/description. It must keep the
#    grants catalog/kms/defaults turns on (allow_cloudwatch_logs for the ECS and
#    WAF log groups, allow_cloudwatch_alarms for the alarm topic) and also set
#      allow_log_delivery_s3: true
#    so CloudFront's log delivery (delivery.logs.amazonaws.com) can write into
#    the SSE-KMS log bucket.
# 2. settings.web_application, the inputs this template cannot create:
#      settings:
#        web_application:
#          app_domain_name: app.example.com      # CloudFront aliases: it and www.<it>
#          dns_component: network/main           # dns instance holding app_domain_name's public zone
#          dns_zone_key: main                    # that zone's key in its zone_ids output
#          app_container_image: <account>.dkr.ecr.<region>.amazonaws.com/webapp:1.0
#    A missing key fails every describe/plan of the stack with its name
#    (gomplate `required`); `atmos validate stacks` does not render templates.
#    settings.environment.account_id (set by every fnx stage _defaults) names
#    the CloudFront log bucket in its own bucket policy.
# 3. That dns instance manages app_domain_name's PUBLIC, delegated zone: ACM
#    validates the certificate there, and the ALB (origin.<app domain>) and
#    CloudFront (app domain, www) write their alias records into it.
#    origin.<app domain> therefore publishes the internal ALB's private IPs in
#    public DNS. That is accepted: CloudFront needs a name the certificate
#    covers. A private hosted zone for it is a possible later change.
# 4. A prod stack sets web-application/rds's environment: prod (its production
#    validations: multi_az, deletion_protection, backup retention) and sizes
#    the instances up (see ENVIRONMENT-SPECIFIC OVERRIDES at the end).
# 5. On-call addresses, if any, in web-application/monitoring's
#    alarm_email_subscriptions.
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/s3/defaults
  - catalog/acm/defaults
  - catalog/alb/defaults
  - catalog/waf/defaults
  - catalog/ecs-service/defaults
  - catalog/rds/defaults
  - catalog/elasticache/defaults
  - catalog/cloudfront/defaults
  - catalog/monitoring/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING LAYER
    # =========================================================================

    web-application/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        # VPC CIDR configuration
        # Development uses smaller CIDR, production uses larger
        ipv4_primary_cidr_block: "10.10.0.0/16"

        # Availability zones for high availability
        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4

        # Subnet configuration - 3-tier architecture
        private_subnets:
          - "10.10.1.0/24"   # Application tier AZ-a
          - "10.10.2.0/24"   # Application tier AZ-b
          - "10.10.3.0/24"   # Application tier AZ-c
        public_subnets:
          - "10.10.101.0/24" # ALB/NAT tier AZ-a
          - "10.10.102.0/24" # ALB/NAT tier AZ-b
          - "10.10.103.0/24" # ALB/NAT tier AZ-c
        database_subnets:
          - "10.10.201.0/24" # Database tier AZ-a
          - "10.10.202.0/24" # Database tier AZ-b
          - "10.10.203.0/24" # Database tier AZ-c

        # NAT Gateway strategy
        # single: cost-optimized for dev/staging
        # one_per_az: high availability for production
        nat_gateway_enabled: true
        nat_gateway_strategy: "single"

        # VPC Flow Logs for security and troubleshooting
        vpc_flow_logs_enabled: true
        vpc_flow_logs_traffic_type: "ALL"

        # Security settings
        default_sg_ingress_self_only: true
        default_sg_egress_self_only: false

        tags:
          Layer: "networking"
          Application: "web-application"

    # =========================================================================
    # SECURITY GROUPS (connectivity layer)
    # =========================================================================
    # "alb" has no rules: the ALB attaches it beside its own group (the alb
    # component's security_group_ids), and "application" admits the ALB by it.
    # The ALB's own group, which holds the CloudFront ingress and open egress,
    # only exists after the addons layer, so reading it here would read a
    # later layer. RDS and ElastiCache create their own groups, admitting
    # "application" (allowed_security_groups / allowed_security_group_ids).
    # source_security_group_id is a sibling key of this map.

    web-application/securitygroups:
      metadata:
        component: securitygroup
        type: real
      vars:
        vpc_id: !terraform.state web-application/vpc .vpc_id

        security_groups:
          alb:
            preserve_security_group_id: true
            # The ALB's own group already allows all egress.
            allow_all_egress: false
            description: "Attached to the web application ALB; the application group admits it"

          # Application Security Group - allows traffic from the ALB only
          application:
            preserve_security_group_id: true
            # Only the egress rules below.
            allow_all_egress: false
            description: "Security group for web application containers"
            ingress_rules:
              - key: "http-from-alb"
                description: "HTTP from ALB"
                from_port: 8080
                to_port: 8080
                protocol: "tcp"
                source_security_group_id: "alb"
            egress_rules:
              - key: "https-aws"
                description: "HTTPS to AWS services"
                from_port: 443
                to_port: 443
                protocol: "tcp"
                cidr_blocks:
                  - "0.0.0.0/0"
              - key: "postgres"
                description: "Database access"
                from_port: 5432
                to_port: 5432
                protocol: "tcp"
                cidr_blocks: !terraform.state web-application/vpc '.vpc_cidr | [.]'
              - key: "redis"
                description: "Redis cache access"
                from_port: 6379
                to_port: 6379
                protocol: "tcp"
                cidr_blocks: !terraform.state web-application/vpc '.vpc_cidr | [.]'
        tags:
          Layer: "security"
          Application: "web-application"
      dependencies:
        components:
          - component: web-application/vpc

    # =========================================================================
    # CLOUDFRONT LOG BUCKET (storage layer)
    # =========================================================================
    # CloudFront standard logging (v2) delivers through CloudWatch Logs
    # (delivery.logs.amazonaws.com), which would add this statement to the
    # bucket policy itself on first delivery; the s3 component would revert
    # that, so it is declared here (components/terraform/cloudfront/README.md).
    # The bucket is SSE-KMS on kms/main: requirement 1 (allow_log_delivery_s3).

    web-application/s3/cdn-logs:
      metadata:
        component: s3
        type: real
        inherits:
          - s3/defaults
      vars:
        # <Environment>-cdn-logs-<account id>. The s3 component takes
        # <Environment> from tags.Environment; the bucket policy below uses
        # settings.context.environment, which is the same value only because
        # stacks/orgs/fnx/_defaults.yaml sets tags.Environment from it. Change
        # both together (vars are not reliably resolved at template time).
        name: cdn-logs
        lifecycle_configuration_rules:
          - id: "expire-logs"
            abort_incomplete_multipart_upload_days: 7
            expiration:
              days: 90
            noncurrent_version_expiration:
              noncurrent_days: 30
        source_policy_documents:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "AWSLogDeliveryWrite",
                  "Effect": "Allow",
                  "Principal": {"Service": "delivery.logs.amazonaws.com"},
                  "Action": "s3:PutObject",
                  "Resource": "arn:aws:s3:::{{ .settings.context.environment }}-cdn-logs-{{ .settings.environment.account_id }}/*",
                  "Condition": {
                    "StringEquals": {
                      "s3:x-amz-acl": "bucket-owner-full-control",
                      "aws:SourceAccount": "{{ .settings.environment.account_id }}"
                    },
                    "ArnLike": {"aws:SourceArn": "arn:aws:logs:us-east-1:{{ .settings.environment.account_id }}:delivery-source:*"}
                  }
                },
                {
                  "Sid": "AWSLogDeliveryAclCheck",
                  "Effect": "Allow",
                  "Principal": {"Service": "delivery.logs.amazonaws.com"},
                  "Action": "s3:GetBucketAcl",
                  "Resource": "arn:aws:s3:::{{ .settings.context.environment }}-cdn-logs-{{ .settings.environment.account_id }}",
                  "Condition": {
                    "StringEquals": {"aws:SourceAccount": "{{ .settings.environment.account_id }}"},
                    "ArnLike": {"aws:SourceArn": "arn:aws:logs:us-east-1:{{ .settings.environment.account_id }}:delivery-source:*"}
                  }
                }
              ]
            }
        tags:
          Layer: "cdn"
          Application: "web-application"

    # =========================================================================
    # SSL/TLS CERTIFICATES (certificates layer)
    # =========================================================================
    # One us-east-1 certificate serves CloudFront (app domain, www) and the
    # ALB's origin name (origin.<app domain>), both under the wildcard SAN.

    web-application/acm:
      metadata:
        component: acm
        type: real
        inherits:
          - acm/defaults
      vars:
        dns_domains:
          main:
            domain_name: '{{ required "settings.web_application.app_domain_name is required" .settings.web_application.app_domain_name }}'
            subject_alternative_names:
              - '*.{{ required "settings.web_application.app_domain_name is required" .settings.web_application.app_domain_name }}'
            validation_method: "DNS"
        zone_id: !terraform.state '{{ required "settings.web_application.dns_component is required" .settings.web_application.dns_component }} .zone_ids.{{ required "settings.web_application.dns_zone_key is required" .settings.web_application.dns_zone_key }}'

        tags:
          Layer: "security"
          Application: "web-application"
      dependencies:
        components:
          - component: '{{ required "settings.web_application.dns_component is required" .settings.web_application.dns_component }}'

    # =========================================================================
    # LOAD BALANCER LAYER (addons layer)
    # =========================================================================

    web-application/alb:
      metadata:
        component: alb
        type: real
        inherits:
          - alb/defaults
      vars:
        # Short name: the component prefixes it with Environment (see
        # components/terraform/alb/README.md).
        name: "webapp-alb"

        # Internal, in the private subnets: CloudFront reaches it through a VPC
        # origin (web-application/cloudfront), nothing else from the internet.
        # VPC origins need an internet gateway in the VPC (the vpc component
        # creates one for the public subnets) and are unsupported in use1-az3;
        # the vpc instance uses use1-az1, az2 and az4.
        internal: true
        vpc_id: !terraform.state web-application/vpc .vpc_id
        subnets: !terraform.state web-application/vpc .private_subnet_ids
        certificate_arn: !terraform.state web-application/acm .certificate_arns.main
        # The application group admits this one (see the securitygroups instance).
        # Ingress stays the CloudFront origin-facing prefix list the component
        # always admits: AWS allows it or the service-managed
        # CloudFront-VPCOrigins-Service-SG for VPC origins, and that group only
        # exists once web-application/cloudfront (services layer, after this
        # addons-layer ALB) has created the first VPC origin, so it cannot be
        # read here. An internal ALB has no internet path, so the prefix-list
        # rule only matches traffic already in this VPC: CloudFront's
        # VPC-origin ENIs. (Either way, any VPC origin for this ALB created in
        # this account, or shared to another through RAM, can reach it.)
        security_group_ids:
          - !terraform.state web-application/securitygroups .security_group_ids.alb

        # Defence in depth: only web-application/ecs-service's listener rule
        # forwards; anything else that reaches the listener gets this.
        listener_https_fixed_response:
          content_type: "text/plain"
          message_body: "Forbidden"
          status_code: "403"

        # CloudFront's origin domain: a name the certificate covers
        # (*.<app domain>). A VPC origin still checks the ALB certificate
        # against the origin domain name, and internal-*.elb.amazonaws.com is
        # not on it (components/terraform/cloudfront/README.md).
        dns_alias_enabled: true
        parent_zone_id: !terraform.state '{{ required "settings.web_application.dns_component is required" .settings.web_application.dns_component }} .zone_ids.{{ required "settings.web_application.dns_zone_key is required" .settings.web_application.dns_zone_key }}'
        dns_aliases:
          - 'origin.{{ required "settings.web_application.app_domain_name is required" .settings.web_application.app_domain_name }}'

        access_logs_prefix: "webapp"

        tags:
          Layer: "load-balancer"
          Application: "web-application"
      dependencies:
        components:
          - component: web-application/vpc
          - component: web-application/acm
          - component: web-application/securitygroups
          - component: '{{ required "settings.web_application.dns_component is required" .settings.web_application.dns_component }}'

    # =========================================================================
    # WAF PROTECTION (REGIONAL, regional-waf layer)
    # =========================================================================
    # Associated with the ALB, so it deploys after it: deploy-full-stack puts
    # every scope REGIONAL waf in its regional-waf layer, after addons and
    # services (CLOUDFRONT ones are in security).

    web-application/waf:
      metadata:
        component: waf
        type: real
        inherits:
          - waf/defaults
      vars:
        name: "webapp-waf"
        scope: "REGIONAL"

        # Every stack runs a kms/main instance (catalog/kms/defaults), so this
        # resolves everywhere; see stacks/catalog/waf/defaults.yaml for why
        # this is set per REGIONAL instance rather than defaulted.
        kms_key_arn: !terraform.state kms/main .key_arn

        # Associate with the ALB
        association_resource_arns:
          - !terraform.state web-application/alb .alb_arn

        # WAF rules
        managed_rule_group_statement_rules:
          - name: "AWSManagedRulesCommonRuleSet"
            priority: 10
          - name: "AWSManagedRulesKnownBadInputsRuleSet"
            priority: 20
          - name: "AWSManagedRulesSQLiRuleSet"
            priority: 30
          - name: "AWSManagedRulesLinuxRuleSet"
            priority: 40

        # No rate_based_statement_rules: the ALB admits only CloudFront, so
        # this ACL sees CloudFront edge IPs and an IP limit would throttle
        # whole edges shared by many viewers. waf-cloudfront rate-limits by
        # viewer IP; this component has no FORWARDED_IP aggregation
        # (components/terraform/waf/variables.tf).

        tags:
          Layer: "security"
          Application: "web-application"

      dependencies:
        components:
          - component: web-application/alb
          - component: kms/main

    # =========================================================================
    # WAF PROTECTION (CLOUDFRONT SCOPE, security layer)
    # =========================================================================
    # No association: web-application/cloudfront sets its web_acl_id to this
    # instance's `arn`. region is pinned to us-east-1 -- an AWS requirement for
    # CLOUDFRONT-scope web ACLs -- independent of this stack's own region.
    web-application/waf-cloudfront:
      metadata:
        component: waf
        type: real
        inherits:
          - waf/defaults
      vars:
        region: "us-east-1"
        name: "webapp-waf-cf"
        scope: "CLOUDFRONT"
        # The stacks run in us-east-1, so the stack's own kms/main can encrypt
        # this us-east-1 log group (components/terraform/waf/README.md).
        kms_key_arn: !terraform.state kms/main .key_arn

        managed_rule_group_statement_rules:
          - name: "AWSManagedRulesCommonRuleSet"
            priority: 10
          - name: "AWSManagedRulesKnownBadInputsRuleSet"
            priority: 20

        rate_based_statement_rules:
          - name: "RateLimitRule"
            priority: 1
            limit: 2000
            aggregate_key_type: "IP"
            action: "block"

        tags:
          Layer: "security"
          Application: "web-application"

      dependencies:
        components:
          - component: kms/main

    # =========================================================================
    # COMPUTE LAYER - ECS FARGATE
    # =========================================================================

    # Fargate only: the component gives the cluster the FARGATE and FARGATE_SPOT
    # capacity providers; the service below picks its strategy.
    web-application/ecs-cluster:
      metadata:
        component: ecs
        type: real
      vars:
        cluster_name: "{{ .settings.context.environment }}-webapp"
        fargate_only: true
        enable_container_insights: true

        tags:
          Layer: "compute"
          Application: "web-application"

    # Services layer: after the cluster (compute), the data stores (data) and
    # the ALB (addons). Behind CloudFront: the internal ALB is reachable only
    # through the VPC origin, so the listener rule matches every path.
    web-application/ecs-service:
      metadata:
        component: ecs-service
        type: real
        inherits:
          - ecs-service/defaults
      vars:
        # <Environment>-webapp: the service, task family and target group.
        name: "webapp"
        ecs_cluster_arn: !terraform.state web-application/ecs-cluster .cluster_arn

        # Task size (a Fargate cpu/memory pair)
        task_cpu: 256
        task_memory: 512

        containers:
          webapp:
            image: '{{ required "settings.web_application.app_container_image is required" .settings.web_application.app_container_image }}'
            port_mappings:
              - container_port: 8080
            environment:
              ENVIRONMENT: "{{ .settings.context.stage }}"
              DATABASE_HOST: !terraform.state web-application/rds .instance_address
              DATABASE_PORT: "5432"
              DATABASE_NAME: !terraform.state web-application/rds .instance_name
              REDIS_HOST: !terraform.state web-application/elasticache .primary_endpoint_address
              REDIS_PORT: "6379"
            # The RDS-managed master secret ({username, password}) and the
            # cache's AUTH token secret ({auth_token}), by JSON key. RDS
            # requires TLS (rds.force_ssl) and Redis has transit encryption on.
            secrets:
              DATABASE_USERNAME: !terraform.state web-application/rds '.password_secret_arn + ":username::"'
              DATABASE_PASSWORD: !terraform.state web-application/rds '.password_secret_arn + ":password::"'
              REDIS_AUTH_TOKEN: !terraform.state web-application/elasticache '.auth_token_secret_arn + ":auth_token::"'
            healthcheck:
              command:
                - "CMD-SHELL"
                - "curl -f http://localhost:8080/health || exit 1"
              interval: 30
              timeout: 5
              retries: 3
              start_period: 60
        # Both secrets are encrypted with kms/main (rds
        # master_user_secret_kms_key_id, elasticache auth_token_secret_kms_key_id).
        secrets_kms_key_arn: !terraform.state kms/main .key_arn

        # Service configuration
        desired_count: 2
        deployment_minimum_healthy_percent: 50
        deployment_maximum_percent: 200

        # One task always on FARGATE, the rest 1:4 FARGATE:FARGATE_SPOT.
        capacity_provider_strategies:
          - capacity_provider: "FARGATE"
            weight: 1
            base: 1
          - capacity_provider: "FARGATE_SPOT"
            weight: 4

        # Network configuration
        subnet_ids: !terraform.state web-application/vpc .private_subnet_ids
        security_group_ids:
          - !terraform.state web-application/securitygroups .security_group_ids.application

        # Load balancer configuration
        load_balancer:
          listener_arn: !terraform.state web-application/alb .https_listener_arn
          vpc_id: !terraform.state web-application/vpc .vpc_id
          container_name: "webapp"
          container_port: 8080
          priority: 100
          path_patterns:
            - "/*"
          health_check:
            path: "/health"

        # Auto-scaling configuration
        autoscaling:
          min_capacity: 2
          max_capacity: 10
          cpu_utilization_target: 70
          memory_utilization_target: 80
          scale_in_cooldown: 300
          scale_out_cooldown: 60

        tags:
          Layer: "compute"
          Application: "web-application"
      dependencies:
        components:
          - component: kms/main
          - component: web-application/vpc
          - component: web-application/ecs-cluster
          - component: web-application/alb
          - component: web-application/securitygroups
          - component: web-application/rds
          - component: web-application/elasticache

    # =========================================================================
    # DATABASE LAYER
    # =========================================================================

    web-application/rds:
      metadata:
        component: rds
        type: real
        inherits:
          - rds/defaults
      vars:
        # <Environment>-webapp-db
        identifier: "webapp-db"

        # Engine configuration (the parameter group family derives from it)
        engine: "postgres"
        engine_version: "15"

        # Instance configuration
        # dev: db.t3.micro, staging: db.t3.small, prod: db.r6g.large
        instance_class: "db.t3.micro"
        allocated_storage: 20
        max_allocated_storage: 100
        storage_type: "gp3"
        kms_key_id: !terraform.state kms/main .key_arn
        master_user_secret_kms_key_id: !terraform.state kms/main .key_arn

        # Database configuration
        db_name: "webapp"
        username: "webapp_admin"
        port: 5432

        # Network configuration: the database subnets, a security group of
        # its own admitting the application group.
        vpc_id: !terraform.state web-application/vpc .vpc_id
        subnet_ids: !terraform.state web-application/vpc .database_subnet_ids
        allowed_security_groups:
          - !terraform.state web-application/securitygroups .security_group_ids.application
        publicly_accessible: false

        # High availability
        # dev/staging: false, prod: true
        multi_az: false

        # Backup configuration
        backup_retention_period: 7
        # RDS rejects a maintenance window that overlaps the backup window and
        # wants >= 30 minutes of separation.
        backup_window: "03:00-04:00"
        maintenance_window: "sun:04:30-sun:05:30"

        # Performance and monitoring
        performance_insights_enabled: true
        performance_insights_retention_period: 7
        performance_insights_kms_key_id: !terraform.state kms/main .key_arn
        monitoring_interval: 60
        enabled_cloudwatch_logs_exports:
          - "postgresql"
          - "upgrade"

        # Deletion protection
        # Enable for production
        deletion_protection: false
        skip_final_snapshot: true

        # Parameter group, over the component's defaults (rds.force_ssl = 1,
        # log_statement = ddl)
        parameters:
          - name: "log_min_duration_statement"
            value: "1000"
          - name: "shared_preload_libraries"
            value: "pg_stat_statements"
            apply_method: "pending-reboot"

        tags:
          Layer: "database"
          Application: "web-application"
      dependencies:
        components:
          - component: kms/main
          - component: web-application/vpc
          - component: web-application/securitygroups

    # =========================================================================
    # CACHING LAYER
    # =========================================================================

    web-application/elasticache:
      metadata:
        component: elasticache
        type: real
        inherits:
          - elasticache/defaults
      vars:
        # The replication group is <Environment>-webapp-cache.
        cluster_id: "webapp-cache"

        engine_version: "7.0"

        # Node configuration
        # dev: cache.t3.micro, staging: cache.t3.small, prod: cache.r6g.large
        # with num_cache_nodes >= 2, automatic failover and Multi-AZ.
        node_type: "cache.t3.micro"
        num_cache_nodes: 1
        automatic_failover_enabled: false
        multi_az_enabled: false

        # Network configuration: the database subnets, a security group of
        # its own admitting the application group.
        vpc_id: !terraform.state web-application/vpc .vpc_id
        subnet_ids: !terraform.state web-application/vpc .database_subnet_ids
        allowed_security_group_ids:
          - !terraform.state web-application/securitygroups .security_group_ids.application
        port: 6379

        # Cluster mode (for production)
        cluster_mode_enabled: false

        # Security: at rest on kms/main, TLS, and an AUTH token the component
        # generates into the redis-auth/<Environment>/webapp-cache secret,
        # which the service reads (REDIS_AUTH_TOKEN).
        kms_key_id: !terraform.state kms/main .key_arn
        auth_token_secret_kms_key_id: !terraform.state kms/main .key_arn

        # Maintenance (non-overlapping windows)
        maintenance_window: "sun:05:00-sun:06:00"
        snapshot_retention_limit: 1
        snapshot_window: "04:00-05:00"

        # Parameter group
        family: "redis7"
        parameters:
          - name: "maxmemory-policy"
            value: "volatile-lru"

        tags:
          Layer: "caching"
          Application: "web-application"
      dependencies:
        components:
          - component: kms/main
          - component: web-application/vpc
          - component: web-application/securitygroups

    # =========================================================================
    # CDN LAYER (services layer)
    # =========================================================================
    # One origin: the internal ALB as a CloudFront VPC origin (the component
    # creates it; up to 15 minutes), TLS to origin.<app domain> (on the
    # certificate). No origin-verify secret: the ALB has no internet path.
    # Host is not forwarded (AllViewerExceptHostHeader), so the ALB sees the
    # origin name. No Lambda@Edge origin triggers (VPC origins do not support
    # them). The aliases' alias records go into the app domain's zone.

    web-application/cloudfront:
      metadata:
        component: cloudfront
        type: real
        inherits:
          - cloudfront/defaults
      vars:
        # <Environment>-webapp-cdn
        name: "webapp-cdn"

        custom_origins:
          - origin_id: "alb"
            domain_name: 'origin.{{ required "settings.web_application.app_domain_name is required" .settings.web_application.app_domain_name }}'
            vpc_origin:
              arn: !terraform.state web-application/alb .alb_arn
              origin_protocol_policy: "https-only"
              origin_ssl_protocols:
                - "TLSv1.2"
              origin_read_timeout: 60
              origin_keepalive_timeout: 5
        default_origin_id: "alb"

        # Default cache behavior: dynamic content, not cached
        allowed_methods:
          - "GET"
          - "HEAD"
          - "OPTIONS"
          - "PUT"
          - "POST"
          - "PATCH"
          - "DELETE"
        cached_methods:
          - "GET"
          - "HEAD"
        cache_policy_id: "CachingDisabled"
        origin_request_policy_id: "AllViewerExceptHostHeader"
        response_headers_policy_id: "SecurityHeadersPolicy"

        # Static assets are cached
        ordered_cache:
          - path_pattern: "/static/*"
            target_origin_id: "alb"
            cache_policy_id: "CachingOptimized"

        # Aliases (custom domains) on the us-east-1 certificate
        aliases:
          - '{{ required "settings.web_application.app_domain_name is required" .settings.web_application.app_domain_name }}'
          - 'www.{{ required "settings.web_application.app_domain_name is required" .settings.web_application.app_domain_name }}'
        acm_certificate_arn: !terraform.state web-application/acm .certificate_arns.main
        dns_alias_enabled: true
        parent_zone_id: !terraform.state '{{ required "settings.web_application.dns_component is required" .settings.web_application.dns_component }} .zone_ids.{{ required "settings.web_application.dns_zone_key is required" .settings.web_application.dns_zone_key }}'

        # Standard logging (v2) to the template's log bucket
        logging_enabled: true
        access_log_bucket_arn: !terraform.state web-application/s3/cdn-logs .bucket_arn
        log_prefix: "webapp"

        # WAF (scope CLOUDFRONT, us-east-1)
        web_acl_id: !terraform.state web-application/waf-cloudfront .arn

        tags:
          Layer: "cdn"
          Application: "web-application"
      dependencies:
        components:
          - component: web-application/acm
          - component: web-application/alb
          - component: web-application/waf-cloudfront
          - component: web-application/s3/cdn-logs
          - component: '{{ required "settings.web_application.dns_component is required" .settings.web_application.dns_component }}'

    # =========================================================================
    # MONITORING LAYER
    # =========================================================================

    web-application/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        # <Environment>-webapp-<suffix>
        name: webapp
        # kms/main allows CloudWatch alarms to publish to the encrypted topic
        # (catalog/kms/defaults allow_cloudwatch_alarms).
        kms_key_id: !terraform.state kms/main .key_arn

        create_dashboard: true
        vpc_id: !terraform.state web-application/vpc .vpc_id
        certificate_arns: !terraform.state web-application/acm .certificate_arns // {} | [.[]]
        certificate_names: !terraform.state web-application/acm .certificate_domains // {} | keys
        certificate_domains: !terraform.state web-application/acm .certificate_domains // {} | [.[]]

        # Dashboard dimensions
        load_balancers: !terraform.state web-application/alb .alb_arn_suffix | [.]
        ecs_clusters: !terraform.state web-application/ecs-cluster .cluster_name | [.]
        rds_instances: !terraform.state web-application/rds .instance_identifier | [.]
        elasticache_clusters: !terraform.state web-application/elasticache .member_clusters

        # Alarms, named <Environment>-<key>
        metric_alarms:
          # ALB
          alb-5xx-errors:
            namespace: "AWS/ApplicationELB"
            metric_name: "HTTPCode_ELB_5XX_Count"
            dimensions:
              LoadBalancer: !terraform.state web-application/alb .alb_arn_suffix
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          # The application's 4xx, not the ALB's: HTTPCode_ELB_4XX_Count also
          # counts the listener's fixed 403 and the ALB's own rejections.
          alb-target-4xx-errors:
            namespace: "AWS/ApplicationELB"
            metric_name: "HTTPCode_Target_4XX_Count"
            dimensions:
              LoadBalancer: !terraform.state web-application/alb .alb_arn_suffix
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          alb-target-response-time:
            namespace: "AWS/ApplicationELB"
            metric_name: "TargetResponseTime"
            dimensions:
              LoadBalancer: !terraform.state web-application/alb .alb_arn_suffix
            comparison_operator: "GreaterThanThreshold"
            threshold: 2
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          # ECS
          ecs-cpu-high:
            namespace: "AWS/ECS"
            metric_name: "CPUUtilization"
            dimensions:
              ClusterName: !terraform.state web-application/ecs-cluster .cluster_name
              ServiceName: !terraform.state web-application/ecs-service .service_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          ecs-memory-high:
            namespace: "AWS/ECS"
            metric_name: "MemoryUtilization"
            dimensions:
              ClusterName: !terraform.state web-application/ecs-cluster .cluster_name
              ServiceName: !terraform.state web-application/ecs-service .service_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          # RDS
          rds-cpu-high:
            namespace: "AWS/RDS"
            metric_name: "CPUUtilization"
            dimensions:
              DBInstanceIdentifier: !terraform.state web-application/rds .instance_identifier
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          rds-connections-high:
            namespace: "AWS/RDS"
            metric_name: "DatabaseConnections"
            dimensions:
              DBInstanceIdentifier: !terraform.state web-application/rds .instance_identifier
            comparison_operator: "GreaterThanThreshold"
            threshold: 100
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          rds-free-storage-low:
            namespace: "AWS/RDS"
            metric_name: "FreeStorageSpace"
            dimensions:
              DBInstanceIdentifier: !terraform.state web-application/rds .instance_identifier
            comparison_operator: "LessThanThreshold"
            threshold: 5368709120  # 5GB in bytes
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          # ElastiCache: per node; the primary is the first member cluster.
          cache-cpu-high:
            namespace: "AWS/ElastiCache"
            metric_name: "CPUUtilization"
            dimensions:
              CacheClusterId: !terraform.state web-application/elasticache .member_clusters[0]
            comparison_operator: "GreaterThanThreshold"
            threshold: 75
            evaluation_periods: 2
            period: 300
            statistic: "Average"
          cache-memory-high:
            namespace: "AWS/ElastiCache"
            metric_name: "DatabaseMemoryUsagePercentage"
            dimensions:
              CacheClusterId: !terraform.state web-application/elasticache .member_clusters[0]
            comparison_operator: "GreaterThanThreshold"
            threshold: 80
            evaluation_periods: 2
            period: 300
            statistic: "Average"

        tags:
          Layer: "monitoring"
          Application: "web-application"
      dependencies:
        components:
          - component: kms/main
          - component: web-application/vpc
          - component: web-application/acm
          - component: web-application/alb
          - component: web-application/ecs-cluster
          - component: web-application/ecs-service
          - component: web-application/rds
          - component: web-application/elasticache

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
# Override the instances' vars in the importing stack, e.g. for production:
#
#   web-application/vpc:          nat_gateway_strategy: "one_per_az"
#   web-application/rds:          environment: prod, instance_class: "db.r6g.large",
#                                 multi_az: true, deletion_protection: true,
#                                 skip_final_snapshot: false, backup_retention_period: 30
#   web-application/elasticache:  node_type: "cache.r6g.large", num_cache_nodes: 2,
#                                 automatic_failover_enabled: true, multi_az_enabled: true
#   web-application/ecs-service:  desired_count: 3, autoscaling: {min_capacity: 3, max_capacity: 20, ...}
#   web-application/cloudfront:   price_class: "PriceClass_All"
#
# Development: desired_count 1 and autoscaling min_capacity 1, max_capacity 3.

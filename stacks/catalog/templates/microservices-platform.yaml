---
# =============================================================================
# MICROSERVICES PLATFORM STACK TEMPLATE
# =============================================================================
# Complete microservices infrastructure with container orchestration
#
# Architecture:
#   - VPC with private subnets for pods, public subnets for load balancers and
#     database subnets, tagged for EKS load balancer discovery
#   - EKS cluster with managed node groups (system, application, spot)
#   - EKS add-on intent (load balancer controller, autoscaler, metrics server,
#     external-dns, cert-manager, External Secrets, CloudWatch agent/Fluent Bit)
#   - HTTP API Gateway with a JWT authorizer and a VPC link into the VPC
#   - EventBridge bus (archived) with audit and domain-event rules, delivering
#     to SQS queues (inventory, notifications) and a welcome-email Lambda, with
#     an SQS dead-letter queue for the bus and its targets
#   - DynamoDB tables for service state, distributed locks and saga state
#   - ElastiCache Redis in cluster mode for distributed caching
#   - CloudWatch dashboards, alarms and Logs Insights queries, X-Ray sampling
#   - Secrets Manager secrets for the platform (the Redis AUTH token among them)
#
# Encryption: the stack's customer managed key, kms/main, encrypts the EKS
# secrets, DynamoDB tables, the EventBridge bus, archive and log groups, the
# SQS queues, the Lambda's environment and log group, the API Gateway log
# group, ElastiCache and the Secrets Manager secrets. Not yet:
# EKS node EBS volumes use the AWS managed aws/ebs key, the eks and vpc log
# groups use those components' own keys, and the monitoring SNS topic is
# unencrypted.
#
# Cost Estimates (Monthly):
#   Development:  ~$200-400/month
#   Staging:      ~$500-1,000/month
#   Production:   ~$1,500-5,000/month (depending on scale)
#
# Usage (instances are microservices/<part>):
#   atmos terraform plan microservices/eks -s <tenant>-<stage>-<environment>
#   atmos workflow deploy -f deploy-full-stack -s <tenant>-<stage>-<environment>
#
# =============================================================================
# REQUIREMENTS FOR THE IMPORTING STACK
# =============================================================================
# 1. A kms/main instance (every fnx org stack has one, in components/security.yaml,
#    from catalog/kms/defaults). This template does not define it: doing so would
#    deep-merge over that stack's own alias_name/description. CloudWatch Logs
#    (the EventBridge, Lambda and API Gateway log groups) and EventBridge (the
#    bus and archive, and delivery to the encrypted queues) use the key as
#    service principals, so the stack's kms/main must keep the two scoped
#    grants that catalog/kms/defaults turns on:
#      allow_cloudwatch_logs: true
#      allow_eventbridge: true
# 2. settings.microservices, read by eks-addons, apigateway and the
#    welcome-email Lambda:
#      settings:
#        microservices:
#          app_domain_name: example.com          # external-dns filter, CORS origins, SES sender
#          letsencrypt_email: ops@example.com    # cert-manager ACME account
#          cognito_user_pool_id: eu-west-2_xxxx  # JWT issuer
#          cognito_client_id: xxxxxxxx           # JWT audience
#          lambda_artifacts_bucket: my-artifacts # holds welcome-email/latest.zip
#    A missing key fails every describe/plan of the stack with its name
#    (gomplate `required`); `atmos validate stacks` does not render templates.
# 3. On-call addresses, if any, in microservices/monitoring's
#    alarm_email_subscriptions.
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/eks-addons/defaults
  - catalog/monitoring/defaults
  - catalog/dynamodb/defaults
  - catalog/eventbridge/defaults
  - catalog/sqs/defaults
  - catalog/secretsmanager/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING LAYER
    # =========================================================================

    microservices/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        # Larger CIDR for microservices (many pods need IPs)
        vpc_cidr: "10.20.0.0/16"

        azs:
          - "{{ .vars.region }}a"
          - "{{ .vars.region }}b"
          - "{{ .vars.region }}c"

        # Larger subnets for EKS pods
        private_subnets:
          - "10.20.0.0/18"    # ~16,000 IPs for pods AZ-a
          - "10.20.64.0/18"   # ~16,000 IPs for pods AZ-b
          - "10.20.128.0/18"  # ~16,000 IPs for pods AZ-c
        public_subnets:
          - "10.20.192.0/22"  # Load balancers AZ-a
          - "10.20.196.0/22"  # Load balancers AZ-b
          - "10.20.200.0/22"  # Load balancers AZ-c
        database_subnets:
          - "10.20.204.0/24"  # Data stores AZ-a
          - "10.20.205.0/24"  # Data stores AZ-b
          - "10.20.206.0/24"  # Data stores AZ-c

        # HA NAT for production microservices
        enable_nat_gateway: true
        nat_gateway_strategy: "one_per_az"

        # Flow logs capture ALL traffic; DNS hostnames and support are always
        # on in the vpc component (EKS needs both).
        enable_flow_logs: true

        # Subnet tags for EKS load balancer discovery. The cluster tag names
        # the cluster, which the eks component names "<Environment>-<name>":
        # microservices/eks below sets name: microservices.
        public_subnets_additional_tags:
          "kubernetes.io/role/elb": "1"
          "kubernetes.io/cluster/{{ .settings.context.environment }}-microservices": "shared"
        private_subnets_additional_tags:
          "kubernetes.io/role/internal-elb": "1"
          "kubernetes.io/cluster/{{ .settings.context.environment }}-microservices": "shared"

        tags:
          Layer: "networking"
          Platform: "microservices"

    # =========================================================================
    # EKS CLUSTER
    # =========================================================================

    microservices/eks:
      metadata:
        component: eks
        type: real
        inherits:
          - eks/defaults
      vars:
        # One cluster per instance (components/terraform/eks): the cluster is
        # "<Environment>-microservices". Not part of the eks component, and
        # dropped from this template: vpc_id (derived from subnet_ids), the
        # extra cluster/node security group rules, cluster_addons (installed by
        # eks-addons), authentication_mode and access_entries. IRSA (the OIDC
        # provider) is always on.
        name: microservices
        cluster_kubernetes_version: "1.36"

        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids

        # Secrets encryption with the stack's customer managed key.
        cluster_encryption_config_kms_key_id: !terraform.state kms/main .key_arn

        # Cluster endpoint access. A public endpoint must name its CIDRs in
        # public_access_cidrs; 0.0.0.0/0 is rejected.
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: false

        # Cluster logging
        enabled_cluster_log_types:
          - "api"
          - "audit"
          - "authenticator"
          - "controllerManager"
          - "scheduler"
        cluster_log_retention_period: 30

        # Managed node groups
        node_groups:
          # System node group for cluster components
          system:
            instance_types:
              - "t3.medium"
            capacity_type: "ON_DEMAND"
            min_group_size: 2
            max_group_size: 4
            desired_group_size: 2
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 50
            kubernetes_labels:
              role: "system"
              node-type: "system"
            kubernetes_taints:
              - key: "CriticalAddonsOnly"
                value: "true"
                effect: "NO_SCHEDULE"
            update_config:
              max_unavailable_percentage: 33
            ami_type: "AL2023_x86_64_STANDARD" # no AL2 EKS AMIs for 1.33+
            detailed_monitoring_enabled: true

          # Application node group for microservices
          application:
            instance_types:
              - "t3.large"
            capacity_type: "ON_DEMAND"
            min_group_size: 3
            max_group_size: 20
            desired_group_size: 3
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
            kubernetes_labels:
              role: "application"
              node-type: "application"
            update_config:
              max_unavailable_percentage: 25
            ami_type: "AL2023_x86_64_STANDARD" # no AL2 EKS AMIs for 1.33+
            detailed_monitoring_enabled: true

          # Spot node group for cost optimization (non-critical workloads)
          spot:
            instance_types:
              - "t3.large"
              - "t3.xlarge"
              - "m5.large"
              - "m5.xlarge"
            capacity_type: "SPOT"
            min_group_size: 0
            max_group_size: 10
            desired_group_size: 0
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
            kubernetes_labels:
              role: "spot"
              node-type: "spot"
            kubernetes_taints:
              - key: "spot"
                value: "true"
                effect: "NO_SCHEDULE"
            update_config:
              max_unavailable_percentage: 50
            ami_type: "AL2023_x86_64_STANDARD" # no AL2 EKS AMIs for 1.33+
            detailed_monitoring_enabled: true

        tags:
          Layer: "compute"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: kms/main

    # =========================================================================
    # EKS ADDONS (Kubernetes-level)
    # =========================================================================
    # The kubernetes/helm providers connect with the top-level cluster_name,
    # host and cluster_ca_certificate; everything the component installs is
    # keyed under clusters.<cluster name> (main.tf looks the cluster up by that
    # key, so it must be the real name, "<Environment>-microservices").
    #
    # NOTE: eks-addons declares the enable_* flags below but its main.tf does
    # not act on them yet: it installs only what clusters.<key>.addons,
    # helm_releases and kubernetes_manifests list. They record the intended
    # add-on set in the component's own interface. See the eks-addons README.

    microservices/eks-addons:
      metadata:
        component: eks-addons
        type: real
        inherits:
          - eks-addons
      vars:
        cluster_name: !terraform.state microservices/eks .eks_cluster_id
        host: !terraform.state microservices/eks .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state microservices/eks .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer

        clusters:
          "{{ .settings.context.environment }}-microservices":
            cluster_name: !terraform.state microservices/eks .eks_cluster_id
            kubernetes_host: !terraform.state microservices/eks .eks_cluster_endpoint
            cluster_ca_certificate: !terraform.state microservices/eks .eks_cluster_certificate_authority_data
            oidc_provider_arn: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer_arn
            oidc_provider_url: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer

            # Ingress, scaling and metrics
            enable_aws_load_balancer_controller: true
            enable_cluster_autoscaler: true
            enable_metrics_server: true
            enable_karpenter: false

            # DNS and certificates
            enable_external_dns: true
            external_dns_domain_filters:
              - '{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
            enable_cert_manager: true
            cert_manager_letsencrypt_email: '{{ required "settings.microservices.letsencrypt_email is required" .settings.microservices.letsencrypt_email }}'

            # Secret sync from Secrets Manager
            enable_external_secrets: true

            # CloudWatch Container Insights (agent) and container logs (Fluent Bit)
            enable_aws_cloudwatch_metrics: true
            enable_aws_for_fluentbit: true
            log_retention_days: 30

        tags:
          Layer: "addons"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/eks

    # =========================================================================
    # API GATEWAY (HTTP API)
    # =========================================================================

    microservices/apigateway:
      metadata:
        component: apigateway
        type: real
      vars:
        enabled: true
        # Resources are "<Environment>-microservices-api".
        api_name: "microservices-api"
        description: "API Gateway for microservices platform"
        api_type: "HTTP"

        cors_configuration:
          allow_origins:
            - 'https://{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
            - 'https://*.{{ .settings.microservices.app_domain_name }}'
          allow_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "PATCH"
            - "OPTIONS"
          allow_headers:
            - "Content-Type"
            - "Authorization"
            - "X-Request-ID"
            - "X-Correlation-ID"
          expose_headers:
            - "X-Request-ID"
            - "X-Correlation-ID"
          max_age: 300
          allow_credentials: true

        # VPC link for private integrations with services in the cluster.
        # Routes are not declared here: an HTTP API route to the cluster
        # targets the listener of the ALB that the in-cluster load balancer
        # controller creates from an Ingress, which no Terraform state holds.
        # The link's network interfaces get their own group
        # (microservices/securitygroup/vpc-link below), which services in the
        # cluster admit as a source.
        vpc_link_subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
        vpc_link_security_group_ids: !terraform.state microservices/securitygroup/vpc-link '.security_group_ids.vpc_link | [.]'

        # JWT authorization via Cognito
        authorizer_type: "JWT"
        authorizer_identity_source: "$request.header.Authorization"
        jwt_audience:
          - '{{ required "settings.microservices.cognito_client_id is required" .settings.microservices.cognito_client_id }}'
        jwt_issuer: 'https://cognito-idp.{{ .vars.region }}.amazonaws.com/{{ required "settings.microservices.cognito_user_pool_id is required" .settings.microservices.cognito_user_pool_id }}'

        # Access logging, encrypted with the stack's key. responseLatency feeds
        # the slow-requests Logs Insights query in microservices/monitoring.
        enable_logging: true
        log_format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "responseLatency":"$context.responseLatency", "integrationError":"$context.integrationErrorMessage", "correlationId":"$context.requestId" }'
        log_retention_days: 30
        kms_key_id: !terraform.state kms/main .key_arn

        stage_name: "{{ .settings.context.environment }}"
        auto_deploy: true

        # Stage-wide throttling
        throttling_burst_limit: 5000
        throttling_rate_limit: 10000

        create_dashboard: true
        # HTTP APIs have no X-Ray tracing (a REST API stage setting).
        tracing_enabled: false

        tags:
          Layer: "api-gateway"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/securitygroup/vpc-link
          - component: kms/main

    # The API Gateway VPC link's own security group. The link's interfaces
    # only open connections to targets in the VPC, so the group admits no
    # ingress at all (and 0.0.0.0/0 ingress is refused outright); egress is
    # open, which this repo allows. Not the vpc component's shared default
    # group: the link should be a distinct source that services admit.
    microservices/securitygroup/vpc-link:
      metadata:
        component: securitygroup
        type: real
      vars:
        vpc_id: !terraform.state microservices/vpc .vpc_id
        enforce_no_public_ingress: true
        security_groups:
          vpc_link:
            description: "API Gateway VPC link for the microservices HTTP API"
            ingress_rules: []
            allow_all_egress: true
        tags:
          Layer: "api-gateway"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc

    # =========================================================================
    # EVENT BUS (EventBridge)
    # =========================================================================
    # One bus, archived for replay, with one rule per instance; each rule logs
    # what it matches to its own CloudWatch log group (the Cloud Posse
    # aws-eventbridge model).

    microservices/eventbridge:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        # The bus and its archive are "<Environment>-microservices". AWS caps
        # archive names at 48 characters and the component checks it at plan,
        # so this leaves Environment up to 34 characters.
        name: microservices
        create_event_bus: true
        archive_enabled: true
        archive_retention_days: 30
        # AWS recommends a dead-letter queue on a CMK-encrypted bus, so events
        # that fail to encrypt or decrypt are kept, not dropped.
        event_bus_dlq_arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
        # Catch-all for auditing
        cloudwatch_event_rule_description: "Archive all microservices events for auditing"
        cloudwatch_event_rule_pattern:
          source:
            - prefix: "microservices."
        event_log_retention_in_days: 30
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/sqs/event-bus-dlq

    # Domain events on that bus, each rule delivering to its consumers as well
    # as to its log group. A delivery that still fails after the retry policy
    # goes to the bus's dead-letter queue.
    microservices/eventbridge/order-created:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: order-created
        event_bus_name: !terraform.state microservices/eventbridge .event_bus_name
        cloudwatch_event_rule_description: "Route order created events"
        cloudwatch_event_rule_pattern:
          source:
            - "microservices.orders"
          detail-type:
            - "OrderCreated"
        event_log_retention_in_days: 30
        targets:
          # The queue's policy lets this rule send (microservices/sqs/order-inventory).
          inventory:
            arn: !terraform.state microservices/sqs/order-inventory .queue_arn
            dead_letter_config:
              arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/eventbridge
          - component: microservices/sqs/order-inventory
          - component: microservices/sqs/event-bus-dlq

    microservices/eventbridge/user-registered:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: user-registered
        event_bus_name: !terraform.state microservices/eventbridge .event_bus_name
        cloudwatch_event_rule_description: "Route user registration events"
        cloudwatch_event_rule_pattern:
          source:
            - "microservices.users"
          detail-type:
            - "UserRegistered"
        event_log_retention_in_days: 30
        targets:
          # The queue's policy lets this rule send (microservices/sqs/user-notifications).
          notifications:
            arn: !terraform.state microservices/sqs/user-notifications .queue_arn
            dead_letter_config:
              arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
          # The component grants this rule lambda:InvokeFunction on the function.
          welcome-email:
            arn: !terraform.state microservices/lambda/welcome-email .function_arn
            input_path: "$.detail"
            dead_letter_config:
              arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/eventbridge
          - component: microservices/sqs/user-notifications
          - component: microservices/sqs/event-bus-dlq
          - component: microservices/lambda/welcome-email

    # =========================================================================
    # EVENT CONSUMERS (SQS, Lambda)
    # =========================================================================
    # The queues are applied before the rules that target them, and their
    # policies name those rules by ARN, built from names rather than read from
    # state: arn:aws:events:<region>:<account>:rule/<bus>/<rule>, where the bus
    # is "<Environment>-microservices" and each rule "<Environment>-<name>"
    # (the eventbridge instances above). The account segment is "*" because
    # the sqs component adds aws:SourceAccount = <this account> to every Allow
    # (iam_policy_limit_to_current_account, on in sqs/defaults), which pins it.
    # So nothing here reads eventbridge state and there is no dependency cycle.
    # kms/main's AllowEventBridgeSQSQueues lets EventBridge use the key.

    # Consumed by the inventory service; its own DLQ takes messages the
    # service fails to process 5 times.
    microservices/sqs/order-inventory:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: order-inventory
        dlq_enabled: true
        iam_policy:
          - statements:
              - sid: AllowOrderCreatedRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-microservices/{{ .settings.context.environment }}-order-created"
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # Consumed by the notification service; its own DLQ as above.
    microservices/sqs/user-notifications:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: user-notifications
        dlq_enabled: true
        iam_policy:
          - statements:
              - sid: AllowUserRegisteredRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-microservices/{{ .settings.context.environment }}-user-registered"
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # The bus's dead-letter queue (event_bus_dlq_arn), also the dead-letter
    # queue of every rule target above, so EventBridge may send to it from the
    # bus and from both rules. Nothing consumes it: failed events wait here,
    # 14 days (the sqs maximum), for an operator to inspect and replay.
    microservices/sqs/event-bus-dlq:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: event-bus-dlq
        message_retention_seconds: 1209600
        iam_policy:
          - statements:
              - sid: AllowEventBusAndRules
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:event-bus/{{ .settings.context.environment }}-microservices"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-microservices/{{ .settings.context.environment }}-order-created"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.context.environment }}-microservices/{{ .settings.context.environment }}-user-registered"
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # Sends the welcome email for a UserRegistered event (the rule passes the
    # event's detail). The package is built and uploaded by the service's CI;
    # it must be in settings.microservices.lambda_artifacts_bucket before the
    # first apply. It sends through SES from the app domain's identity.
    microservices/lambda/welcome-email:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: welcome-email
        handler: "index.handler"
        runtime: "nodejs22.x"
        s3_bucket: '{{ required "settings.microservices.lambda_artifacts_bucket is required" .settings.microservices.lambda_artifacts_bucket }}'
        s3_key: "welcome-email/latest.zip"
        memory_size: 256
        timeout: 30
        log_retention_days: 30
        # Environment variables and the function's log group, with the stack key.
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn
        environment_variables:
          SENDER_ADDRESS: 'no-reply@{{ .settings.microservices.app_domain_name }}'
        custom_policy: >-
          {"Version": "2012-10-17", "Statement": [{"Sid": "SendWelcomeEmail",
          "Effect": "Allow", "Action": ["ses:SendEmail", "ses:SendRawEmail"],
          "Resource": "arn:aws:ses:{{ .vars.region }}:*:identity/{{ .settings.microservices.app_domain_name }}",
          "Condition": {"StringEquals": {"ses:FromAddress": "no-reply@{{ .settings.microservices.app_domain_name }}"}}}]}
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main

    # =========================================================================
    # STATE MANAGEMENT (DynamoDB) - one table per instance
    # =========================================================================

    # Service state table
    microservices/dynamodb/service-state:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: service-state
        hash_key: "pk"
        range_key: "sk"
        dynamodb_attributes:
          - name: "gsi1pk"
            type: "S"
          - name: "gsi1sk"
            type: "S"
        global_secondary_index_map:
          - name: "gsi1"
            hash_key: "gsi1pk"
            range_key: "gsi1sk"
            projection_type: "ALL"
        ttl_enabled: true
        ttl_attribute: "ttl"
        point_in_time_recovery_enabled: true
        streams_enabled: true
        stream_view_type: "NEW_AND_OLD_IMAGES"
        tags:
          Layer: "data"
          Platform: "microservices"

    # Distributed locks table
    microservices/dynamodb/distributed-locks:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: distributed-locks
        hash_key: "lock_key"
        ttl_enabled: true
        ttl_attribute: "expires_at"
        # Locks are short-lived and rebuilt on restart
        point_in_time_recovery_enabled: false
        tags:
          Layer: "data"
          Platform: "microservices"

    # Saga state table (for distributed transactions)
    microservices/dynamodb/saga-state:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: saga-state
        hash_key: "saga_id"
        range_key: "step_id"
        dynamodb_attributes:
          - name: "status"
            type: "S"
        global_secondary_index_map:
          - name: "status-index"
            hash_key: "status"
            projection_type: "ALL"
        ttl_enabled: true
        ttl_attribute: "ttl"
        point_in_time_recovery_enabled: true
        streams_enabled: true
        stream_view_type: "NEW_AND_OLD_IMAGES"
        tags:
          Layer: "data"
          Platform: "microservices"

    # =========================================================================
    # DISTRIBUTED CACHING (ElastiCache)
    # =========================================================================

    microservices/elasticache:
      metadata:
        component: elasticache
        type: real
      vars:
        enabled: true
        # The replication group is "<Environment>-microservices-cache".
        cluster_id: "microservices-cache"

        engine: "redis"
        engine_version: "7.0"

        # Cluster mode for scalability
        cluster_mode_enabled: true
        cluster_mode_num_node_groups: 2
        cluster_mode_replicas_per_node_group: 1
        node_type: "cache.r6g.large"

        # Network: private subnets, reachable from the EKS cluster security
        # group (managed node groups attach it to every node).
        vpc_id: !terraform.state microservices/vpc .vpc_id
        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
        allowed_security_group_ids: !terraform.state microservices/eks '.eks_cluster_managed_security_group_id | [.]'

        # Security: encryption at rest (stack key) and in transit, AUTH token
        # generated by microservices/secrets.
        at_rest_encryption_enabled: true
        transit_encryption_enabled: true
        auth_token: !terraform.state microservices/secrets .generated_passwords.redis
        kms_key_id: !terraform.state kms/main .key_arn

        # High availability
        automatic_failover_enabled: true
        multi_az_enabled: true

        # Maintenance and backups (non-overlapping windows)
        maintenance_window: "sun:05:00-sun:06:00"
        snapshot_retention_limit: 7
        snapshot_window: "03:00-04:00"

        # Parameter group (the component adds cluster-enabled=yes)
        family: "redis7"
        parameters:
          - name: "maxmemory-policy"
            value: "volatile-lru"
          - name: "notify-keyspace-events"
            value: "Ex"  # Expiry events for cache invalidation

        # CPU and memory alarms per node: microservices/monitoring
        # (elasticache_clusters).

        tags:
          Layer: "caching"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/eks
          - component: microservices/secrets
          - component: kms/main

    # =========================================================================
    # OBSERVABILITY
    # =========================================================================

    microservices/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        # No certificates in this template
        enable_certificate_monitoring: false

        # Infrastructure dashboard, and CPU/memory alarms on every cache node
        create_dashboard: true
        vpc_id: !terraform.state microservices/vpc .vpc_id
        elasticache_clusters: !terraform.state microservices/elasticache .member_clusters

        # EKS backend dashboard and node/pod alarms (Container Insights)
        eks_cluster_name: !terraform.state microservices/eks .eks_cluster_id

        # X-Ray sampling rule (the component samples 10% of requests)
        enable_tracing: true

        # Custom dashboards
        metric_dashboards:
          eks-overview:
            widgets:
              - title: "Node Resource Utilization"
                period: 300
                metrics:
                  - namespace: "ContainerInsights"
                    metric: "node_cpu_utilization"
                    dimensions:
                      ClusterName: !terraform.state microservices/eks .eks_cluster_id
                  - namespace: "ContainerInsights"
                    metric: "node_memory_utilization"
                    dimensions:
                      ClusterName: !terraform.state microservices/eks .eks_cluster_id
          api-metrics:
            widgets:
              - title: "API Gateway Metrics"
                period: 60
                metrics:
                  - namespace: "AWS/ApiGateway"
                    metric: "Count"
                    dimensions:
                      ApiId: !terraform.state microservices/apigateway .http_api_id
                  - namespace: "AWS/ApiGateway"
                    metric: "Latency"
                    dimensions:
                      ApiId: !terraform.state microservices/apigateway .http_api_id
          eventbridge-metrics:
            widgets:
              - title: "EventBridge Metrics"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Events"
                    metric: "Invocations"
                    dimensions:
                      EventBusName: !terraform.state microservices/eventbridge .event_bus_name
                  - namespace: "AWS/Events"
                    metric: "FailedInvocations"
                    dimensions:
                      EventBusName: !terraform.state microservices/eventbridge .event_bus_name

        # Alarms on metrics the fixed-purpose inputs cannot express. HTTP APIs
        # publish 5xx/Latency by ApiId (REST uses ApiName and 5XXError).
        metric_alarms:
          eks-failed-nodes:
            namespace: "ContainerInsights"
            metric_name: "cluster_failed_node_count"
            dimensions:
              ClusterName: !terraform.state microservices/eks .eks_cluster_id
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 2
            period: 300
            statistic: "Maximum"
          api-5xx-errors:
            namespace: "AWS/ApiGateway"
            metric_name: "5xx"
            dimensions:
              ApiId: !terraform.state microservices/apigateway .http_api_id
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          api-latency-high:
            namespace: "AWS/ApiGateway"
            metric_name: "Latency"
            dimensions:
              ApiId: !terraform.state microservices/apigateway .http_api_id
            comparison_operator: "GreaterThanThreshold"
            threshold: 3000  # 3 seconds
            evaluation_periods: 3
            period: 300
            extended_statistic: "p99"
          eventbridge-failures:
            namespace: "AWS/Events"
            metric_name: "FailedInvocations"
            dimensions:
              EventBusName: !terraform.state microservices/eventbridge .event_bus_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          # Per-table throttling is published as Read/WriteThrottleEvents by
          # TableName (ThrottledRequests also needs an Operation dimension).
          dynamodb-read-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "ReadThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/service-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-write-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "WriteThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/service-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"

        # SNS notifications (topic "<Environment>-alarms")
        create_sns_topic: true
        # The importing stack lists its on-call addresses here.
        alarm_email_subscriptions: []

        # Log insights queries
        log_insights_queries:
          error-analysis:
            log_group_names: !terraform.state microservices/eks '.cloudwatch_log_group_name | [.]'
            query: |
              fields @timestamp, @message
              | filter @message like /error|Error|ERROR/
              | sort @timestamp desc
              | limit 100
          slow-requests:
            log_group_names: !terraform.state microservices/apigateway '.log_group_name | [.]'
            query: |
              fields @timestamp, routeKey, status, responseLatency
              | filter responseLatency > 1000
              | sort responseLatency desc
              | limit 100

        tags:
          Layer: "observability"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/eks
          - component: microservices/apigateway
          - component: microservices/eventbridge
          - component: microservices/dynamodb/service-state
          - component: microservices/elasticache

    # =========================================================================
    # SECRETS MANAGEMENT
    # =========================================================================
    # Secrets are "microservices/<stage>/<path>/<name>", encrypted with kms/main
    # (default_kms_key_id, from secretsmanager/defaults). Rotation is off
    # (default_rotation_automatically: false): no rotation function exists.

    microservices/secrets:
      metadata:
        component: secretsmanager
        type: real
        inherits:
          - secretsmanager/defaults
      vars:
        context_name: "microservices"
        secrets:
          # Database credentials
          database:
            name: "credentials"
            description: "Database credentials for microservices"
            path: "database"
            recovery_window_in_days: 7
            generate_random_password: true

          # Redis AUTH token, read by microservices/elasticache
          # (generated_passwords.redis). The generator's special characters
          # exclude the / " @ and space that ElastiCache rejects.
          redis:
            name: "auth-token"
            description: "Redis auth token for microservices"
            path: "cache"
            recovery_window_in_days: 7
            generate_random_password: true

          # API keys, filled in by operators after apply
          api_keys:
            name: "api-keys"
            description: "API keys for microservices"
            path: "api"
            recovery_window_in_days: 7

          # JWT signing key
          jwt_signing:
            name: "jwt-signing"
            description: "JWT signing key for microservices"
            path: "auth"
            recovery_window_in_days: 30
            generate_random_password: true

        tags:
          Layer: "security"
          Platform: "microservices"

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
# Override the instances above per stack, e.g.:
#
# Development:
#   microservices/vpc:         nat_gateway_strategy: "single"
#   microservices/eks:         node_groups.system.min_group_size: 1,
#                              node_groups.application.capacity_type: "SPOT"
#   microservices/elasticache: cluster_mode_enabled: false, node_type: "cache.t4g.micro"
#
# Production:
#   microservices/eks:         cluster_log_retention_period: 90,
#                              node_groups.application.max_group_size: 50
#   microservices/elasticache: node_type: "cache.r6g.xlarge", cluster_mode_num_node_groups: 3,
#                              cluster_mode_replicas_per_node_group: 2
#   microservices/eventbridge: archive_retention_days: 90

---
# =============================================================================
# MICROSERVICES PLATFORM STACK TEMPLATE
# =============================================================================
# Complete microservices infrastructure with container orchestration
#
# Architecture:
#   - VPC with isolated subnets for services
#   - EKS cluster with managed node groups
#   - Service mesh (AWS App Mesh or Istio-ready)
#   - API Gateway for external access
#   - EventBridge for async communication
#   - DynamoDB for state management
#   - ElastiCache for distributed caching
#   - CloudWatch Container Insights
#   - X-Ray for distributed tracing
#   - External Secrets Operator for secret sync
#
# Cost Estimates (Monthly):
#   Development:  ~$200-400/month
#   Staging:      ~$500-1,000/month
#   Production:   ~$1,500-5,000/month (depending on scale)
#
# Deployment Time: 30-45 minutes
#
# Usage:
#   atmos terraform plan microservices-platform -s <tenant>-<account>-<environment>
#   atmos terraform apply microservices-platform -s <tenant>-<account>-<environment>
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/eks-addons/defaults
  - catalog/monitoring/defaults
  - catalog/secretsmanager/defaults

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING LAYER
    # =========================================================================

    microservices/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        name: "microservices"

        # Larger CIDR for microservices (many pods need IPs)
        vpc_cidr: "10.20.0.0/16"

        # Availability zones
        azs:
          - "{{ .vars.region }}a"
          - "{{ .vars.region }}b"
          - "{{ .vars.region }}c"

        # Larger subnets for EKS pods
        private_subnets:
          - "10.20.0.0/18"    # ~16,000 IPs for pods AZ-a
          - "10.20.64.0/18"   # ~16,000 IPs for pods AZ-b
          - "10.20.128.0/18"  # ~16,000 IPs for pods AZ-c
        public_subnets:
          - "10.20.192.0/22"  # Load balancers AZ-a
          - "10.20.196.0/22"  # Load balancers AZ-b
          - "10.20.200.0/22"  # Load balancers AZ-c
        database_subnets:
          - "10.20.204.0/24"  # Data stores AZ-a
          - "10.20.205.0/24"  # Data stores AZ-b
          - "10.20.206.0/24"  # Data stores AZ-c

        # HA NAT for production microservices
        enable_nat_gateway: true
        nat_gateway_strategy: "one_per_az"

        # VPC Flow Logs
        vpc_flow_logs_enabled: true
        vpc_flow_logs_traffic_type: "ALL"

        # Enable DNS hostnames (required for EKS)
        enable_dns_hostnames: true
        enable_dns_support: true

        # Subnet tags for EKS auto-discovery
        public_subnet_tags:
          "kubernetes.io/role/elb": "1"
          "kubernetes.io/cluster/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eks": "shared"
        private_subnet_tags:
          "kubernetes.io/role/internal-elb": "1"
          "kubernetes.io/cluster/{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eks": "shared"

        tags:
          Layer: "networking"
          Platform: "microservices"

    # =========================================================================
    # EKS CLUSTER
    # =========================================================================

    microservices/eks:
      metadata:
        component: eks
        type: real
        inherits:
          - eks/defaults
      vars:
        cluster_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eks"
        kubernetes_version: "1.29"

        vpc_id: !terraform.state microservices/vpc .vpc_id
        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids

        # Cluster endpoint access
        endpoint_private_access: true
        endpoint_public_access: "{{ .vars.eks_public_access | default true }}"
        public_access_cidrs:
          - "0.0.0.0/0"

        # Cluster encryption
        encrypt_secrets: true
        kms_key_arn: "{{ .vars.eks_kms_key_arn }}"

        # Cluster logging
        enable_cluster_logging: true
        enabled_cluster_log_types:
          - "api"
          - "audit"
          - "authenticator"
          - "controllerManager"
          - "scheduler"
        cloudwatch_log_group_retention_in_days: "{{ .vars.log_retention_days | default 30 }}"

        # Cluster security group rules
        cluster_security_group_additional_rules:
          egress_nodes_ephemeral_ports_tcp:
            description: "Cluster API to node groups"
            protocol: "tcp"
            from_port: 1025
            to_port: 65535
            type: "egress"
            source_node_security_group: true

        # Node security group rules
        node_security_group_additional_rules:
          ingress_self_all:
            description: "Node to node all ports/protocols"
            protocol: "-1"
            from_port: 0
            to_port: 0
            type: "ingress"
            self: true
          egress_all:
            description: "Node all egress"
            protocol: "-1"
            from_port: 0
            to_port: 0
            type: "egress"
            cidr_blocks:
              - "0.0.0.0/0"

        # Managed node groups
        node_groups:
          # System node group for cluster components
          system:
            name: "system"
            instance_types:
              - "t3.medium"
            capacity_type: "ON_DEMAND"
            min_size: 2
            max_size: 4
            desired_size: 2
            disk_size: 50
            labels:
              role: "system"
              node-type: "system"
            taints:
              - key: "CriticalAddonsOnly"
                value: "true"
                effect: "NO_SCHEDULE"
            update_config:
              max_unavailable_percentage: 33
            ami_type: "AL2_x86_64"
            enable_monitoring: true

          # Application node group for microservices
          application:
            name: "application"
            instance_types:
              - "t3.large"
            capacity_type: "ON_DEMAND"
            min_size: 3
            max_size: 20
            desired_size: 3
            disk_size: 100
            labels:
              role: "application"
              node-type: "application"
            update_config:
              max_unavailable_percentage: 25
            ami_type: "AL2_x86_64"
            enable_monitoring: true

          # Spot node group for cost optimization (non-critical workloads)
          spot:
            name: "spot"
            instance_types:
              - "t3.large"
              - "t3.xlarge"
              - "m5.large"
              - "m5.xlarge"
            capacity_type: "SPOT"
            min_size: 0
            max_size: 10
            desired_size: 0
            disk_size: 100
            labels:
              role: "spot"
              node-type: "spot"
            taints:
              - key: "spot"
                value: "true"
                effect: "NO_SCHEDULE"
            update_config:
              max_unavailable_percentage: 50
            ami_type: "AL2_x86_64"
            enable_monitoring: true

        # OIDC provider for IRSA
        enable_irsa: true

        # Cluster addons
        cluster_addons:
          coredns:
            most_recent: true
            resolve_conflicts_on_create: "OVERWRITE"
            resolve_conflicts_on_update: "OVERWRITE"
          kube-proxy:
            most_recent: true
            resolve_conflicts_on_create: "OVERWRITE"
            resolve_conflicts_on_update: "OVERWRITE"
          vpc-cni:
            most_recent: true
            resolve_conflicts_on_create: "OVERWRITE"
            resolve_conflicts_on_update: "OVERWRITE"
            configuration_values: |
              {
                "env": {
                  "ENABLE_PREFIX_DELEGATION": "true",
                  "WARM_PREFIX_TARGET": "1"
                }
              }
          aws-ebs-csi-driver:
            most_recent: true
            resolve_conflicts_on_create: "OVERWRITE"
            service_account_role_arn: "{{ .vars.ebs_csi_role_arn }}"

        # Authentication mode
        authentication_mode: "API_AND_CONFIG_MAP"

        # Access entries (RBAC)
        access_entries:
          admin:
            principal_arn: "{{ .vars.eks_admin_role_arn }}"
            type: "STANDARD"
            policy_associations:
              admin:
                policy_arn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
                access_scope:
                  type: "cluster"

        tags:
          Layer: "compute"
          Platform: "microservices"

    # =========================================================================
    # EKS ADDONS (Kubernetes-level)
    # =========================================================================

      dependencies:
        components:
          - component: microservices/vpc
    microservices/eks-addons:
      metadata:
        component: eks-addons
        type: real
        inherits:
          - eks-addons/defaults
      vars:
        cluster_name: !terraform.state microservices/eks .cluster_id
        cluster_endpoint: !terraform.state microservices/eks .cluster_endpoint
        cluster_certificate_authority_data: !terraform.state microservices/eks .cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state microservices/eks .oidc_provider_arn

        # AWS Load Balancer Controller
        enable_aws_load_balancer_controller: true
        aws_load_balancer_controller:
          namespace: "kube-system"
          service_account_name: "aws-load-balancer-controller"

        # Cluster Autoscaler
        enable_cluster_autoscaler: true
        cluster_autoscaler:
          namespace: "kube-system"
          service_account_name: "cluster-autoscaler"
          extra_args:
            - "--balance-similar-node-groups"
            - "--skip-nodes-with-system-pods=false"
            - "--expander=least-waste"
            - "--scale-down-delay-after-add=5m"
            - "--scale-down-unneeded-time=5m"

        # Metrics Server
        enable_metrics_server: true
        metrics_server:
          namespace: "kube-system"

        # External DNS
        enable_external_dns: true
        external_dns:
          namespace: "kube-system"
          service_account_name: "external-dns"
          domain_filters:
            - "{{ .vars.app_domain_name }}"
          zone_id_filters:
            - "{{ .vars.route53_zone_id }}"

        # Cert Manager
        enable_cert_manager: true
        cert_manager:
          namespace: "cert-manager"
          service_account_name: "cert-manager"

        # External Secrets Operator
        enable_external_secrets: true
        external_secrets:
          namespace: "external-secrets"
          service_account_name: "external-secrets"

        # Karpenter for advanced autoscaling (optional)
        enable_karpenter: false
        karpenter:
          namespace: "karpenter"
          service_account_name: "karpenter"

        # AWS X-Ray for distributed tracing
        enable_aws_xray: true
        aws_xray:
          namespace: "aws-otel"
          service_account_name: "aws-otel-collector"

        # CloudWatch Container Insights
        enable_cloudwatch_container_insights: true
        cloudwatch_container_insights:
          namespace: "amazon-cloudwatch"

        tags:
          Layer: "addons"
          Platform: "microservices"

    # =========================================================================
    # API GATEWAY
    # =========================================================================

      dependencies:
        components:
          - component: microservices/eks
    microservices/apigateway:
      metadata:
        component: apigateway
        type: real
      vars:
        api_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-api"
        description: "API Gateway for microservices platform"
        api_type: "HTTP"

        # HTTP API specific configurations
        cors_configuration:
          allow_origins:
            - "https://{{ .vars.app_domain_name }}"
            - "https://*.{{ .vars.app_domain_name }}"
          allow_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "PATCH"
            - "OPTIONS"
          allow_headers:
            - "Content-Type"
            - "Authorization"
            - "X-Request-ID"
            - "X-Correlation-ID"
          expose_headers:
            - "X-Request-ID"
            - "X-Correlation-ID"
          max_age: 300
          allow_credentials: true

        # VPC Link for private integration with EKS
        enable_vpc_link: true
        vpc_link:
          name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eks-vpc-link"
          subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
          security_group_ids:
            - !terraform.state microservices/vpc .default_security_group_id

        # JWT authorization via Cognito or custom authorizer
        authorizer_type: "JWT"
        jwt_configuration:
          audience:
            - "{{ .vars.cognito_client_id }}"
          issuer: "https://cognito-idp.{{ .vars.region }}.amazonaws.com/{{ .vars.cognito_user_pool_id }}"

        # Logging
        enable_logging: true
        log_format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "integrationError":"$context.integrationErrorMessage", "correlationId":"$context.requestContext.requestId" }'
        log_retention_days: 30

        # Stage configurations
        stage_name: "{{ .settings.context.environment }}"
        auto_deploy: true

        # Routes - integrate with ALB Ingress in EKS
        routes:
          # Health check route
          - route_key: "GET /health"
            integration_type: "HTTP_PROXY"
            integration_uri: "http://{{ .vars.eks_alb_dns }}/health"
            integration_method: "GET"

          # Service routes (proxy to EKS ALB)
          - route_key: "$default"
            integration_type: "HTTP_PROXY"
            integration_uri: "http://{{ .vars.eks_alb_dns }}/{proxy}"
            integration_method: "ANY"

        # Throttling
        throttling:
          burst_limit: 5000
          rate_limit: 10000

        # Monitoring
        create_dashboard: true
        tracing_enabled: true

        tags:
          Layer: "api-gateway"
          Platform: "microservices"

    # =========================================================================
    # EVENT BUS (EventBridge)
    # =========================================================================

      dependencies:
        components:
          - component: microservices/eks
    microservices/eventbridge:
      metadata:
        component: eventbridge
        type: real
      vars:
        bus_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-bus"
        description: "Event bus for microservices async communication"

        # Event bus configuration
        event_bus:
          name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-bus"
          archive_enabled: true
          archive_retention_days: 30

        # Event rules for service-to-service communication
        rules:
          # Order events
          order_created:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-order-created"
            description: "Route order created events"
            event_pattern:
              source:
                - "microservices.orders"
              detail-type:
                - "OrderCreated"
            targets:
              - id: "inventory-service"
                arn: "{{ .vars.inventory_service_queue_arn }}"
              - id: "notification-service"
                arn: "{{ .vars.notification_service_queue_arn }}"

          # User events
          user_registered:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-user-registered"
            description: "Route user registration events"
            event_pattern:
              source:
                - "microservices.users"
              detail-type:
                - "UserRegistered"
            targets:
              - id: "welcome-email"
                arn: "{{ .vars.email_service_lambda_arn }}"

          # Catch-all for auditing
          all_events:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-all-events-audit"
            description: "Archive all events for auditing"
            event_pattern:
              source:
                - prefix: "microservices."
            targets:
              - id: "s3-archive"
                arn: "{{ .vars.event_archive_bucket_arn }}"
                input_transformer:
                  input_paths:
                    source: "$.source"
                    detail-type: "$.detail-type"
                    time: "$.time"
                    detail: "$.detail"
                  input_template: '{"source": <source>, "detail-type": <detail-type>, "time": <time>, "detail": <detail>}'

        # Schema discovery
        enable_schema_discovery: true

        # Cross-account event sharing (optional)
        enable_cross_account: false
        cross_account_principals: []

        tags:
          Layer: "messaging"
          Platform: "microservices"

    # =========================================================================
    # STATE MANAGEMENT (DynamoDB)
    # =========================================================================

    microservices/dynamodb:
      metadata:
        component: dynamodb
        type: real
      vars:
        tables:
          # Service state table
          service_state:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-service-state"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "pk"
            range_key: "sk"
            attributes:
              - name: "pk"
                type: "S"
              - name: "sk"
                type: "S"
              - name: "gsi1pk"
                type: "S"
              - name: "gsi1sk"
                type: "S"
            global_secondary_indexes:
              - name: "gsi1"
                hash_key: "gsi1pk"
                range_key: "gsi1sk"
                projection_type: "ALL"
            ttl:
              enabled: true
              attribute_name: "ttl"
            point_in_time_recovery: true
            server_side_encryption:
              enabled: true
              kms_key_arn: "{{ .vars.dynamodb_kms_key_arn }}"
            stream_enabled: true
            stream_view_type: "NEW_AND_OLD_IMAGES"

          # Distributed locks table
          distributed_locks:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-distributed-locks"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "lock_key"
            attributes:
              - name: "lock_key"
                type: "S"
            ttl:
              enabled: true
              attribute_name: "expires_at"
            point_in_time_recovery: false
            server_side_encryption:
              enabled: true

          # Saga state table (for distributed transactions)
          saga_state:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-saga-state"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "saga_id"
            range_key: "step_id"
            attributes:
              - name: "saga_id"
                type: "S"
              - name: "step_id"
                type: "S"
              - name: "status"
                type: "S"
            global_secondary_indexes:
              - name: "status-index"
                hash_key: "status"
                projection_type: "ALL"
            ttl:
              enabled: true
              attribute_name: "ttl"
            point_in_time_recovery: true
            server_side_encryption:
              enabled: true
            stream_enabled: true
            stream_view_type: "NEW_AND_OLD_IMAGES"

        tags:
          Layer: "data"
          Platform: "microservices"

    # =========================================================================
    # DISTRIBUTED CACHING (ElastiCache)
    # =========================================================================

    microservices/elasticache:
      metadata:
        component: elasticache
        type: real
      vars:
        cluster_id: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-cache"

        # Redis for distributed caching
        engine: "redis"
        engine_version: "7.0"

        # Cluster mode for scalability
        cluster_mode_enabled: true

        # Node configuration
        node_type: "cache.r6g.large"
        num_node_groups: 2
        replicas_per_node_group: 1

        # Network configuration
        subnet_group_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-cache-subnet"
        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
        security_group_ids: []  # Will be created

        # Security
        at_rest_encryption_enabled: true
        transit_encryption_enabled: true
        auth_token_enabled: true
        kms_key_id: "{{ .vars.cache_kms_key_id }}"

        # High availability
        automatic_failover_enabled: true
        multi_az_enabled: true

        # Maintenance
        maintenance_window: "sun:05:00-sun:06:00"
        snapshot_retention_limit: 7
        snapshot_window: "04:00-05:00"

        # Parameter group
        parameter_group_family: "redis7"
        parameters:
          - name: "maxmemory-policy"
            value: "volatile-lru"
          - name: "cluster-enabled"
            value: "yes"
          - name: "notify-keyspace-events"
            value: "Ex"  # Expiry events for cache invalidation

        # CloudWatch alarms
        create_cloudwatch_alarms: true
        alarm_cpu_threshold: 75
        alarm_memory_threshold: 80
        alarm_connections_threshold: 5000

        tags:
          Layer: "caching"
          Platform: "microservices"

    # =========================================================================
    # OBSERVABILITY
    # =========================================================================

      dependencies:
        components:
          - component: microservices/vpc
    microservices/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        dashboard_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-dashboard"

        # Enable all monitoring features
        enable_resource_monitoring: true
        enable_cost_monitoring: true
        enable_container_insights: true

        # Container Insights metrics
        container_insights:
          cluster_name: !terraform.state microservices/eks .cluster_id
          namespace_filter:
            - "*"

        # X-Ray tracing configuration
        xray_tracing:
          enable: true
          sampling_rate: 0.05                                     # 5% sampling
          service_graph_enabled: true

        # Custom dashboards
        dashboards:
          # EKS cluster overview
          eks_overview:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eks-overview"
            widgets:
              - type: "metric"
                properties:
                  metrics:
                    - namespace: "ContainerInsights"
                      metric: "node_cpu_utilization"
                      dimensions:
                        ClusterName: !terraform.state microservices/eks .cluster_id
                    - namespace: "ContainerInsights"
                      metric: "node_memory_utilization"
                      dimensions:
                        ClusterName: !terraform.state microservices/eks .cluster_id
                  title: "Node Resource Utilization"
                  period: 300

          # API Gateway metrics
          api_metrics:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-metrics"
            widgets:
              - type: "metric"
                properties:
                  metrics:
                    - namespace: "AWS/ApiGateway"
                      metric: "Count"
                      dimensions:
                        ApiId: !terraform.state microservices/apigateway .api_id
                    - namespace: "AWS/ApiGateway"
                      metric: "Latency"
                      dimensions:
                        ApiId: !terraform.state microservices/apigateway .api_id
                  title: "API Gateway Metrics"
                  period: 60

          # Event bus metrics
          eventbridge_metrics:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eventbridge-metrics"
            widgets:
              - type: "metric"
                properties:
                  metrics:
                    - namespace: "AWS/Events"
                      metric: "Invocations"
                      dimensions:
                        EventBusName: !terraform.state microservices/eventbridge .bus_name
                    - namespace: "AWS/Events"
                      metric: "FailedInvocations"
                      dimensions:
                        EventBusName: !terraform.state microservices/eventbridge .bus_name
                  title: "EventBridge Metrics"
                  period: 60

        # Alarms
        alarms:
          # EKS alarms
          eks_node_not_ready:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eks-node-not-ready"
            metric_name: "cluster_failed_node_count"
            namespace: "ContainerInsights"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 2
            period: 300
            statistic: "Maximum"
            dimensions:
              ClusterName: !terraform.state microservices/eks .cluster_id

          # API Gateway alarms
          api_5xx_errors:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-5xx-errors"
            metric_name: "5XXError"
            namespace: "AWS/ApiGateway"
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              ApiId: !terraform.state microservices/apigateway .api_id

          api_latency_high:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api-latency-high"
            metric_name: "Latency"
            namespace: "AWS/ApiGateway"
            comparison_operator: "GreaterThanThreshold"
            threshold: 3000  # 3 seconds
            evaluation_periods: 3
            period: 300
            statistic: "p99"
            dimensions:
              ApiId: !terraform.state microservices/apigateway .api_id

          # EventBridge alarms
          eventbridge_failed_invocations:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-eventbridge-failures"
            metric_name: "FailedInvocations"
            namespace: "AWS/Events"
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
            dimensions:
              EventBusName: !terraform.state microservices/eventbridge .bus_name

          # DynamoDB alarms
          dynamodb_throttled:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-dynamodb-throttled"
            metric_name: "ThrottledRequests"
            namespace: "AWS/DynamoDB"
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
            dimensions:
              TableName: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-service-state"

          # ElastiCache alarms
          cache_cpu_high:
            name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-cache-cpu-high"
            metric_name: "CPUUtilization"
            namespace: "AWS/ElastiCache"
            comparison_operator: "GreaterThanThreshold"
            threshold: 75
            evaluation_periods: 2
            period: 300
            statistic: "Average"
            dimensions:
              CacheClusterId: !terraform.state microservices/elasticache .cluster_id

        # SNS notifications
        alarm_notifications_enabled: true
        alarm_email_addresses: []
        sns_topic_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-microservices-alarms"

        # Log insights queries
        log_insights_queries:
          error_analysis:
            name: "Error Analysis"
            log_group_name: !terraform.state microservices/eks .cluster_id | "/aws/eks/" + . + "/cluster"
            query: |
              fields @timestamp, @message
              | filter @message like /error|Error|ERROR/
              | sort @timestamp desc
              | limit 100

          slow_requests:
            name: "Slow Requests"
            log_group_name: !terraform.state microservices/apigateway .api_id | "/aws/apigateway/" + .
            query: |
              fields @timestamp, @message
              | filter responseTime > 1000
              | sort responseTime desc
              | limit 100

        tags:
          Layer: "observability"
          Platform: "microservices"

    # =========================================================================
    # SECRETS MANAGEMENT
    # =========================================================================

      dependencies:
        components:
          - component: microservices/eks
          - component: microservices/apigateway
          - component: microservices/eventbridge
          - component: microservices/dynamodb
          - component: microservices/elasticache
    microservices/secrets:
      metadata:
        component: secretsmanager
        type: real
        inherits:
          - secretsmanager/defaults
      vars:
        secrets:
          # Database credentials
          database:
            name: "{{ .settings.context.tenant }}/{{ .settings.context.environment }}/microservices/database"
            description: "Database credentials for microservices"
            recovery_window_in_days: 7
            generate_secret_string:
              secret_string_template: '{"username": "microservices_admin"}'
              generate_string_key: "password"
              password_length: 32
              exclude_characters: "\"@/\\"

          # Redis auth token
          redis:
            name: "{{ .settings.context.tenant }}/{{ .settings.context.environment }}/microservices/redis"
            description: "Redis auth token for microservices"
            recovery_window_in_days: 7
            generate_secret_string:
              generate_string_key: "auth_token"
              password_length: 64
              exclude_characters: "\"@/\\"

          # API keys
          api_keys:
            name: "{{ .settings.context.tenant }}/{{ .settings.context.environment }}/microservices/api-keys"
            description: "API keys for microservices"
            recovery_window_in_days: 7
            secret_string: "{{ .vars.api_keys_json }}"

          # JWT signing key
          jwt_signing:
            name: "{{ .settings.context.tenant }}/{{ .settings.context.environment }}/microservices/jwt-signing"
            description: "JWT signing key for microservices"
            recovery_window_in_days: 30
            generate_secret_string:
              generate_string_key: "signing_key"
              password_length: 64
              exclude_characters: ""

        # KMS encryption
        kms_key_id: "{{ .vars.secrets_kms_key_id }}"

        # Secret rotation (optional)
        enable_rotation: false
        rotation_lambda_arn: "{{ .vars.secret_rotation_lambda_arn }}"
        rotation_rules:
          automatically_after_days: 30

        tags:
          Layer: "security"
          Platform: "microservices"


---
# =============================================================================
# MICROSERVICES PLATFORM STACK TEMPLATE
# =============================================================================
# Complete microservices infrastructure with container orchestration
#
# Architecture:
#   - VPC with private subnets for pods, public subnets for load balancers and
#     database subnets, tagged for EKS load balancer discovery
#   - EKS cluster with managed node groups (system, application, spot)
#   - EKS add-on intent (load balancer controller, autoscaler, metrics server,
#     external-dns, cert-manager, External Secrets, CloudWatch agent/Fluent Bit)
#   - An ACM certificate for the internal ALB below, DNS-validated through the
#     account's public delegated zone (settings.microservices.hosted_zone_id) --
#     validation only needs a public DNS record, not a reachable endpoint, so an
#     internal-scheme ALB can still carry a publicly-issued certificate
#   - An internal ALB the load balancer controller provisions from a shared
#     IngressGroup (alb-controller-ingress-group), looked up in Terraform so
#     HTTP API Gateway can route to it over TLS
#   - HTTP API Gateway with a JWT authorizer, a VPC link into the VPC, and a
#     catch-all TLS route (HTTP_PROXY over the VPC link) to that ALB's HTTPS
#     listener
#   - EventBridge bus (archived) with audit and domain-event rules, delivering
#     to SQS queues (inventory, notifications) and a welcome-email Lambda, with
#     an SQS dead-letter queue for the bus and its targets
#   - DynamoDB tables for service state, distributed locks and saga state
#   - ElastiCache Redis in cluster mode for distributed caching
#   - CloudWatch dashboards, alarms and Logs Insights queries, X-Ray sampling
#   - Secrets Manager secrets for the platform (the Redis AUTH token among
#     them), with the Redis AUTH token and the JWT signing key on 30-day
#     automatic rotation via two dedicated Lambda functions
#
# Encryption: the stack's customer managed key, kms/main, encrypts the EKS
# secrets, control-plane log group and managed node groups' EBS volumes, the
# VPC's flow-log group, DynamoDB tables, the EventBridge bus, archive and log
# groups, the SQS queues, the Lambdas' environment and log groups, the API
# Gateway log group, ElastiCache and the Secrets Manager secrets. Not yet: the
# monitoring SNS topic is unencrypted.
#
# Cost Estimates (Monthly):
#   Development:  ~$200-400/month
#   Staging:      ~$500-1,000/month
#   Production:   ~$1,500-5,000/month (depending on scale)
#
# Usage (instances are microservices/<part>):
#   atmos terraform plan microservices/eks -s <tenant>-<stage>-<environment>
#   atmos workflow deploy -f deploy-full-stack -s <tenant>-<stage>-<environment>
#
# =============================================================================
# REQUIREMENTS FOR THE IMPORTING STACK
# =============================================================================
# 1. A kms/main instance (every fnx org stack has one, in components/security.yaml,
#    from catalog/kms/defaults). This template does not define it: doing so would
#    deep-merge over that stack's own alias_name/description. CloudWatch Logs
#    (the EventBridge, Lambda and API Gateway log groups) and EventBridge (the
#    bus and archive, and delivery to the encrypted queues) use the key as
#    service principals, and the EC2 Auto Scaling service-linked role needs it
#    for the EKS managed node groups' CMK-encrypted EBS volumes, so the
#    stack's kms/main must keep the three scoped grants that
#    catalog/kms/defaults turns on:
#      allow_cloudwatch_logs: true
#      allow_eventbridge: true
#      allow_autoscaling_ebs: true
#    allow_autoscaling_ebs names the Auto Scaling service-linked role
#    directly, so the importing stack also needs the role provisioned first:
#    one of its iam instances sets enable_autoscaling_service_linked_role:
#    true (see components/terraform/iam/README.md), and kms/main declares a
#    dependencies.components edge to that instance (every real dev/staging/
#    prod stack already does both). s3/lambda-artifacts (imported below) must
#    be applied too, with welcome-email/<version>.zip in it, before
#    microservices/lambda/welcome-email: deploy-full-stack's storage layer
#    applies it; the template's deploy-microservices workflow does not.
# 2. settings.microservices, read by eks-addons, apigateway and the
#    welcome-email Lambda:
#      settings:
#        microservices:
#          app_domain_name: example.com          # external-dns filter, CORS origins, SES sender
#          hosted_zone_id: Z0123456789ABCDEFGHIJ # app_domain_name's Route 53 zone
#          letsencrypt_email: ops@example.com    # cert-manager ACME account
#          cognito_user_pool_id: us-east-1_xxxx  # JWT issuer
#          cognito_client_id: xxxxxxxx           # JWT audience
#          welcome_email_version: "1.4.2"        # package key (welcome-email/<version>.zip); bump to deploy new code
#          dns_component: network/main           # dns instance holding the domain's public zone
#          dns_zone_key: main                    # that zone's key in its zone_ids output
#    A missing key fails every describe/plan of the stack with its name
#    (gomplate `required`); `atmos validate stacks` does not render templates.
# 3. On-call addresses, if any, in microservices/monitoring's
#    alarm_email_subscriptions.
# 4. That dns instance (settings.microservices.dns_component) manages
#    app_domain_name's PUBLIC, delegated zone: microservices/ses writes the
#    domain's DKIM records there, and SES verifies the domain through them.
# 5. Manual, once per account and region: SES starts in the sandbox (sends
#    only to verified addresses, 200 a day). Request production access (SES
#    console, or `aws sesv2 put-account-details`) before the welcome email
#    can reach real users. Terraform cannot do this.
# 6. settings.github_app (every fnx stack inherits it from
#    stacks/orgs/fnx/_defaults.yaml): microservices/github-runners registers
#    its runners with that GitHub App. Its private key goes in this pool's own
#    parameter, /github/runners/microservices-runners/app-private-key, besides
#    the stack's own pool's (components/terraform/github-runners/README.md).
# =============================================================================

import:
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/eks-addons/defaults
  - catalog/acm/defaults
  - catalog/alb-controller-ingress-group/defaults
  - catalog/monitoring/defaults
  - catalog/dynamodb/defaults
  - catalog/eventbridge/defaults
  - catalog/sqs/defaults
  - catalog/ses/defaults
  - catalog/secretsmanager/defaults
  - catalog/github-runners/defaults
  # s3/lambda-artifacts, the stack's lambda package bucket (an fnx org stack
  # imports the same file in components/services.yaml).
  - catalog/s3/lambda-artifacts

# =============================================================================
# COMPONENT DEFINITIONS
# =============================================================================

components:
  terraform:
    # =========================================================================
    # NETWORKING LAYER
    # =========================================================================

    microservices/vpc:
      metadata:
        component: vpc
        type: real
        inherits:
          - vpc/defaults
      vars:
        # Larger CIDR for microservices (many pods need IPs)
        ipv4_primary_cidr_block: "10.20.0.0/16"

        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4

        # Larger subnets for EKS pods
        private_subnets:
          - "10.20.0.0/18"    # ~16,000 IPs for pods AZ-a
          - "10.20.64.0/18"   # ~16,000 IPs for pods AZ-b
          - "10.20.128.0/18"  # ~16,000 IPs for pods AZ-c
        public_subnets:
          - "10.20.192.0/22"  # Load balancers AZ-a
          - "10.20.196.0/22"  # Load balancers AZ-b
          - "10.20.200.0/22"  # Load balancers AZ-c
        database_subnets:
          - "10.20.204.0/24"  # Data stores AZ-a
          - "10.20.205.0/24"  # Data stores AZ-b
          - "10.20.206.0/24"  # Data stores AZ-c

        # HA NAT for production microservices
        nat_gateway_enabled: true
        nat_gateway_strategy: "one_per_az"

        # Flow logs capture ALL traffic; DNS hostnames and support are always
        # on in the vpc component (EKS needs both).
        vpc_flow_logs_enabled: true
        # kms/main's allow_cloudwatch_logs already grants every log group in
        # this account and region, so the flow-log group uses it instead of
        # creating its own per-VPC key.
        flow_logs_kms_key_arn: !terraform.state kms/main .key_arn

        # Subnet tags for EKS load balancer discovery. The cluster tag names
        # the cluster, which the eks component names "<Environment>-<name>":
        # microservices/eks below sets name: microservices.
        public_subnets_additional_tags:
          "kubernetes.io/role/elb": "1"
          "kubernetes.io/cluster/{{ .settings.prefix }}-microservices": "shared"
        private_subnets_additional_tags:
          "kubernetes.io/role/internal-elb": "1"
          "kubernetes.io/cluster/{{ .settings.prefix }}-microservices": "shared"

        # redis-auth-rotation (below) is VPC-attached and calls the Secrets
        # Manager and ElastiCache control-plane APIs. Without these, both
        # calls go out the NAT gateway to a public endpoint, and the reply
        # comes back to the Lambda's own Hyperplane-ENI source port -- which
        # can fall anywhere in 1024-65535 -- but the private NACL's only /0
        # ingress rule admits just 32768-65535 (see
        # components/terraform/vpc/network-acls.tf). Widening that /0 rule
        # would need explicit owner sign-off; enabling these Interface
        # endpoints instead keeps both calls' replies inside the VPC CIDR,
        # which the existing VPC-CIDR NACL rules already admit.
        enable_vpc_endpoints: true
        vpc_endpoints:
          - secretsmanager
          - elasticache

        tags:
          Layer: "networking"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main

    # =========================================================================
    # CI RUNNERS (self-hosted, in this VPC)
    # =========================================================================
    # The private microservices/eks API is reachable only from inside this
    # VPC: CI runs the in-cluster instances (eks-addons, alb-ingress-group;
    # settings.github.runner: in-vpc) on these ephemeral runners, which the
    # cluster admits. Labelled <full id>-microservices so those jobs never land
    # on the importing stack's own pool (github-runners/main, in vpc/main);
    # the in-cluster instances below ask for that label (runner_label).

    microservices/github-runners:
      metadata:
        component: github-runners
        type: real
        inherits:
          - github-runners/defaults
      vars:
        # <Environment>-microservices-runners, beside the stack's own pool.
        name: microservices-runners
        vpc_id: !terraform.state microservices/vpc .vpc_id
        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
        # Alarms to microservices/monitoring's topic, <Environment>-monitoring-alarms,
        # named rather than read: monitoring deploys in the last layer. monitoring
        # names it from tags.Environment, this ARN from settings.prefix: it relies
        # on tags.Environment staying settings.prefix (stacks/orgs/fnx/_defaults.yaml).
        alarm_sns_topic_arns:
          - "arn:aws:sns:{{ .vars.region }}:{{ .settings.environment.account_id }}:{{ .settings.prefix }}-monitoring-alarms"
        runner_labels:
          - "{{ .atmos_stack }}-microservices"
        tags:
          Layer: "ci"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/vpc

    # =========================================================================
    # EKS CLUSTER
    # =========================================================================

    microservices/eks:
      metadata:
        component: eks
        type: real
        inherits:
          - eks/defaults
      vars:
        # One cluster per instance (components/terraform/eks): the cluster is
        # "<Environment>-microservices", its VPC derived from subnet_ids. The
        # eks component installs the vpc-cni addon with its IRSA role
        # (vpc_cni_addon); every other addon is microservices/eks-addons'.
        # Kubernetes API access (API authentication mode, the CI roles' access
        # entries) comes from eks/defaults; human admins are the stack's
        # map_additional_iam_roles. IRSA (the OIDC provider) is always on.
        name: microservices
        cluster_kubernetes_version: "1.36"

        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids

        # Secrets encryption with the stack's customer managed key.
        cluster_encryption_config_kms_key_id: !terraform.state kms/main .key_arn

        # Cluster endpoint access. A public endpoint must name its CIDRs in
        # public_access_cidrs; 0.0.0.0/0 is rejected.
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: false
        # The in-VPC CI runners (above) reach the private endpoint on 443.
        allowed_security_group_ids:
          - !terraform.state microservices/github-runners .security_group_id

        # Cluster logging
        enabled_cluster_log_types:
          - "api"
          - "audit"
          - "authenticator"
          - "controllerManager"
          - "scheduler"
        cluster_log_retention_period: 30

        # Managed node groups
        node_groups:
          # System node group for cluster components
          system:
            instance_types:
              - "t3.medium"
            capacity_type: "ON_DEMAND"
            min_group_size: 2
            max_group_size: 4
            desired_group_size: 2
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 50
            kubernetes_labels:
              role: "system"
              node-type: "system"
            kubernetes_taints:
              - key: "CriticalAddonsOnly"
                value: "true"
                effect: "NO_SCHEDULE"
            update_config:
              max_unavailable_percentage: 33
            ami_type: "AL2023_x86_64_STANDARD" # no AL2 EKS AMIs for 1.33+
            detailed_monitoring_enabled: true

          # Application node group for microservices
          application:
            instance_types:
              - "t3.large"
            capacity_type: "ON_DEMAND"
            min_group_size: 3
            max_group_size: 20
            desired_group_size: 3
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
            kubernetes_labels:
              role: "application"
              node-type: "application"
            update_config:
              max_unavailable_percentage: 25
            ami_type: "AL2023_x86_64_STANDARD" # no AL2 EKS AMIs for 1.33+
            detailed_monitoring_enabled: true

          # Spot node group for cost optimization (non-critical workloads)
          spot:
            instance_types:
              - "t3.large"
              - "t3.xlarge"
              - "m5.large"
              - "m5.xlarge"
            capacity_type: "SPOT"
            min_group_size: 0
            max_group_size: 10
            desired_group_size: 0
            block_device_map:
              "/dev/xvda":
                ebs:
                  volume_size: 100
            kubernetes_labels:
              role: "spot"
              node-type: "spot"
            kubernetes_taints:
              - key: "spot"
                value: "true"
                effect: "NO_SCHEDULE"
            update_config:
              max_unavailable_percentage: 50
            ami_type: "AL2023_x86_64_STANDARD" # no AL2 EKS AMIs for 1.33+
            detailed_monitoring_enabled: true

        tags:
          Layer: "compute"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: kms/main
          # eks/defaults gives the CI roles EKS access entries; every fnx org
          # stack has an iam/ci instance (components/security.yaml).
          - component: iam/ci
          - component: microservices/github-runners

    # =========================================================================
    # EKS ADDONS (Kubernetes-level)
    # =========================================================================
    # The kubernetes/helm providers connect with the top-level cluster_name,
    # host and cluster_ca_certificate; everything the component installs is
    # keyed under clusters.<key>, whose cluster name and OIDC provider default
    # to those top-level values.
    #
    # Each enable_* switch installs its chart and an IRSA role (see the
    # eks-addons README). external-dns and cert-manager may change records
    # only in settings.microservices.hosted_zone_id. External Secrets is the
    # external-secrets component. The CloudWatch agent and Fluent Bit come
    # with enable_container_insights; Karpenter has no switch (install it
    # through clusters.<key>.helm_releases).

    microservices/eks-addons:
      metadata:
        component: eks-addons
        type: real
        inherits:
          - eks-addons
      # CI runs it on microservices/github-runners, in this cluster's VPC.
      settings:
        github:
          runner_label: "{{ .atmos_stack }}-microservices"
      vars:
        cluster_name: !terraform.state microservices/eks .eks_cluster_id
        host: !terraform.state microservices/eks .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state microservices/eks .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer

        clusters:
          "{{ .settings.prefix }}-microservices":
            cluster_name: !terraform.state microservices/eks .eks_cluster_id
            kubernetes_host: !terraform.state microservices/eks .eks_cluster_endpoint
            cluster_ca_certificate: !terraform.state microservices/eks .eks_cluster_certificate_authority_data
            oidc_provider_arn: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer_arn
            oidc_provider_url: !terraform.state microservices/eks .eks_cluster_identity_oidc_issuer

            # Ingress, scaling and metrics
            enable_aws_load_balancer_controller: true
            vpc_id: !terraform.state microservices/vpc .vpc_id
            enable_cluster_autoscaler: true
            enable_metrics_server: true

            # CloudWatch Container Insights: agent metrics and Fluent Bit
            # container logs, log groups on the stack's kms/main
            enable_container_insights: true
            container_insights_kms_key_arn: !terraform.state kms/main .key_arn
            container_insights_log_retention_days: 30

            # DNS and certificates
            enable_external_dns: true
            dns_zone_ids:
              - '{{ required "settings.microservices.hosted_zone_id is required" .settings.microservices.hosted_zone_id }}'
            external_dns_domain_filters:
              - '{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
            enable_cert_manager: true
            cert_manager_letsencrypt_email: '{{ required "settings.microservices.letsencrypt_email is required" .settings.microservices.letsencrypt_email }}'

        tags:
          Layer: "addons"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/eks
          - component: microservices/vpc
          - component: kms/main

    # =========================================================================
    # ACM (internal ALB certificate)
    # =========================================================================
    # A certificate for microservices/alb-ingress-group's HTTPS listener, so
    # the apigateway -> ALB hop below is TLS, not plaintext HTTP. DNS
    # validation only requires a public record in the account's delegated
    # zone (settings.microservices.hosted_zone_id / app_domain_name, already
    # required by this template's header and by eks-addons's external-dns);
    # it does not require the certificate's own resource to be reachable, so
    # an internal-scheme ALB can carry a publicly-issued certificate. Same
    # dns_domains/zone_id shape as serverless-api/acm and web-application/acm.

    microservices/acm:
      metadata:
        component: acm
        type: real
        inherits:
          - acm/defaults
      vars:
        dns_domains:
          ingress:
            domain_name: 'ingress.{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
            validation_method: "DNS"
        zone_id: '{{ required "settings.microservices.hosted_zone_id is required" .settings.microservices.hosted_zone_id }}'

        tags:
          Layer: "api-gateway"
          Platform: "microservices"

    # =========================================================================
    # ALB CONTROLLER INGRESS GROUP
    # =========================================================================
    # The shared ALB the in-cluster AWS Load Balancer Controller (enabled
    # above, microservices/eks-addons) provisions from an IngressGroup: no
    # rules of its own, just the group's settings, so its listener can be
    # looked up here in Terraform and handed to apigateway's HTTP API routes
    # below. Always internal (the controller's default IngressClass pins
    # scheme: internal regardless) and admits only the API Gateway VPC
    # link's security group (microservices/securitygroup/vpc-link) -- never
    # a CIDR. certificate_arn comes from microservices/acm above, so the
    # controller opens only an HTTPS (443) listener -- no plaintext HTTP.

    microservices/alb-ingress-group:
      metadata:
        component: alb-controller-ingress-group
        type: real
        inherits:
          - alb-controller-ingress-group/defaults
      # CI runs it on microservices/github-runners, in this cluster's VPC.
      settings:
        github:
          runner_label: "{{ .atmos_stack }}-microservices"
      vars:
        cluster_name: !terraform.state microservices/eks .eks_cluster_id
        host: !terraform.state microservices/eks .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state microservices/eks .eks_cluster_certificate_authority_data
        vpc_id: !terraform.state microservices/vpc .vpc_id

        # Resources are "<Environment>-<group_name>".
        group_name: "microservices-http"
        admit_security_group_ids: !terraform.state microservices/securitygroup/vpc-link '.security_group_ids.vpc_link | [.]'
        certificate_arn: !terraform.state microservices/acm .certificate_arns.ingress

        tags:
          Layer: "api-gateway"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/eks
          - component: microservices/eks-addons
          - component: microservices/vpc
          - component: microservices/securitygroup/vpc-link
          - component: microservices/acm

    # =========================================================================
    # API GATEWAY (HTTP API)
    # =========================================================================

    # An HTTP API: its access logs need no account-level CloudWatch role, so it
    # does not depend on apigateway-account/main. Switch api_type to REST and
    # it does (see serverless-api.yaml's apigateway dependencies).
    microservices/apigateway:
      metadata:
        component: apigateway
        type: real
      vars:
        enabled: true
        # Resources are "<Environment>-microservices-api".
        api_name: "microservices-api"
        description: "API Gateway for microservices platform"
        api_type: "HTTP"

        # allow_origins lists explicit origins only. API Gateway HTTP API CORS
        # accepts exact origins, the literal "*" (refused below by
        # allow_credentials: true), or the whole-scheme prefix forms
        # "https://*" / "http://*" -- it has no embedded-subdomain-glob
        # support, so a 'https://*.<domain>' entry (this template's prior
        # config) never matches any real browser Origin and silently grants
        # no subdomain access at all, while looking like it does. The
        # component's own validation only catches a literal "*" paired with
        # allow_credentials (components/terraform/apigateway/variables.tf),
        # not this glob, so it plans clean and fails silently instead. List
        # every real origin that needs CORS (additional subdomains included)
        # explicitly here.
        cors_configuration:
          allow_origins:
            - 'https://{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
          allow_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "PATCH"
            - "OPTIONS"
          allow_headers:
            - "Content-Type"
            - "Authorization"
            - "X-Request-ID"
            - "X-Correlation-ID"
          expose_headers:
            - "X-Request-ID"
            - "X-Correlation-ID"
          max_age: 300
          allow_credentials: true

        # VPC link for private integrations with services in the cluster.
        # The link's network interfaces get their own group
        # (microservices/securitygroup/vpc-link below), which
        # microservices/alb-ingress-group's security group admits as a
        # source, and which every microservice's own security group must
        # also admit for its own path prefix (not modelled here: this
        # template proxies the whole HTTP API to the shared ALB, see
        # http_routes below).
        vpc_link_subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
        vpc_link_security_group_ids: !terraform.state microservices/securitygroup/vpc-link '.security_group_ids.vpc_link | [.]'

        # A single catch-all route to the shared ALB microservices/alb-ingress-group
        # provisions: HTTP_PROXY over the VPC link above, targeting the ALB's
        # HTTPS listener (microservices/alb-ingress-group carries
        # certificate_arn from microservices/acm, so it has one).
        # tls_server_name_to_verify names that same certificate's domain, so
        # this hop is TLS end to end, not plaintext HTTP. Per-microservice
        # Ingresses join that ALB's IngressGroup and route by path/host inside
        # the cluster; this component only needs one route to reach it. JWT
        # authorization uses the authorizer_type below.
        #
        # IMPORTANT for per-microservice Ingresses joining that IngressGroup:
        # the AWS Load Balancer Controller merges (unions) the listen-ports
        # annotation across every Ingress in the group rather than requiring
        # it to match. microservices/alb-ingress-group is HTTPS-only
        # ([{"HTTPS":443}], certificate_arn is set), but a member Ingress
        # that omits listen-ports still defaults to [{"HTTP":80}] and the
        # controller adds that plaintext :80 listener to the shared ALB
        # instead of rejecting the group. This route above only ever reaches
        # https_listener_arn (443), so any microservice rules that land on
        # the merged-in :80 listener never receive traffic through this API.
        # Every member Ingress must set alb.ingress.kubernetes.io/listen-ports
        # explicitly to microservices/alb-ingress-group's
        # member_listen_ports_annotation output -- see that component's
        # README "Notes" for the full annotation-merge
        # rules (scheme/security-groups/ssl-policy are exclusive instead;
        # members must omit those, never set a different value).
        http_routes:
          "ANY /{proxy+}":
            integration_type: "HTTP_PROXY"
            connection_type: "VPC_LINK"
            # connection_id is left unset: it defaults to this component's
            # own VPC link (vpc_link_subnet_ids/vpc_link_security_group_ids
            # above) -- a self-reference via !terraform.state is not
            # possible here, this route is defined on the same instance
            # that creates the link.
            integration_uri: !terraform.state microservices/alb-ingress-group .https_listener_arn
            tls_server_name_to_verify: 'ingress.{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
            authorization_type: "JWT"

        # JWT authorization via Cognito
        authorizer_type: "JWT"
        authorizer_identity_source: "$request.header.Authorization"
        jwt_audience:
          - '{{ required "settings.microservices.cognito_client_id is required" .settings.microservices.cognito_client_id }}'
        jwt_issuer: 'https://cognito-idp.{{ .vars.region }}.amazonaws.com/{{ required "settings.microservices.cognito_user_pool_id is required" .settings.microservices.cognito_user_pool_id }}'

        # Access logging, encrypted with the stack's key. responseLatency feeds
        # the slow-requests Logs Insights query in microservices/monitoring.
        enable_logging: true
        log_format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "responseLatency":"$context.responseLatency", "integrationError":"$context.integrationErrorMessage", "correlationId":"$context.requestId" }'
        log_retention_days: 30
        kms_key_id: !terraform.state kms/main .key_arn

        stage_name: "{{ .settings.context.stage }}"
        auto_deploy: true

        # Stage-wide throttling
        throttling_burst_limit: 5000
        throttling_rate_limit: 10000

        # The dashboard this component would build (create_dashboard) uses the
        # ApiName dimension from its dashboard.json.tpl, which only REST APIs
        # publish; an HTTP API (api_type above) publishes AWS/ApiGateway
        # metrics dimensioned by ApiId instead, so those widgets would render
        # empty. microservices/monitoring's api-metrics dashboard already
        # covers this API with the correct ApiId dimension (and the matching
        # api-5xx-errors/api-latency-high alarms below it), so this stays off
        # to avoid a second, non-functional API dashboard.
        create_dashboard: false
        # HTTP APIs have no X-Ray tracing (a REST API stage setting).
        tracing_enabled: false

        tags:
          Layer: "api-gateway"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/securitygroup/vpc-link
          - component: microservices/alb-ingress-group
          - component: kms/main

    # The API Gateway VPC link's own security group. The link's interfaces
    # only open connections to targets in the VPC, so the group admits no
    # ingress at all (and 0.0.0.0/0 ingress is refused outright); egress is
    # open, which this repo allows. Not the vpc component's shared default
    # group: the link should be a distinct source that services admit.
    microservices/securitygroup/vpc-link:
      metadata:
        component: securitygroup
        type: real
      vars:
        vpc_id: !terraform.state microservices/vpc .vpc_id
        enforce_no_public_ingress: true
        security_groups:
          vpc_link:
            description: "API Gateway VPC link for the microservices HTTP API"
            ingress_rules: []
            allow_all_egress: true
        tags:
          Layer: "api-gateway"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc

    # =========================================================================
    # EVENT BUS (EventBridge)
    # =========================================================================
    # One bus, archived for replay, with one rule per instance; each rule logs
    # what it matches to its own CloudWatch log group (the Cloud Posse
    # aws-eventbridge model). The bus instance (create_event_bus: true, with
    # its catch-all audit rule) deploys in deploy-full-stack's platform layer,
    # before the rule instances (services) that read its event_bus_name.

    microservices/eventbridge:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        # The bus and its archive are "<Environment>-microservices". AWS caps
        # archive names at 48 characters and the component checks it at plan,
        # so this leaves Environment up to 34 characters.
        name: microservices
        create_event_bus: true
        archive_enabled: true
        archive_retention_days: 30
        # AWS recommends a dead-letter queue on a CMK-encrypted bus, so events
        # that fail to encrypt or decrypt are kept, not dropped.
        event_bus_dlq_arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
        # Catch-all for auditing
        cloudwatch_event_rule_description: "Archive all microservices events for auditing"
        cloudwatch_event_rule_pattern:
          source:
            - prefix: "microservices."
        event_log_retention_in_days: 30
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/sqs/event-bus-dlq

    # Domain events on that bus, each rule delivering to its consumers as well
    # as to its log group. A delivery that still fails after the retry policy
    # goes to the bus's dead-letter queue.
    microservices/eventbridge/order-created:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: order-created
        event_bus_name: !terraform.state microservices/eventbridge .event_bus_name
        cloudwatch_event_rule_description: "Route order created events"
        cloudwatch_event_rule_pattern:
          source:
            - "microservices.orders"
          detail-type:
            - "OrderCreated"
        event_log_retention_in_days: 30
        targets:
          # The queue's policy lets this rule send (microservices/sqs/order-inventory).
          inventory:
            arn: !terraform.state microservices/sqs/order-inventory .queue_arn
            dead_letter_config:
              arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/eventbridge
          - component: microservices/sqs/order-inventory
          - component: microservices/sqs/event-bus-dlq

    microservices/eventbridge/user-registered:
      metadata:
        component: eventbridge
        type: real
        inherits:
          - eventbridge/defaults
      vars:
        name: user-registered
        event_bus_name: !terraform.state microservices/eventbridge .event_bus_name
        cloudwatch_event_rule_description: "Route user registration events"
        cloudwatch_event_rule_pattern:
          source:
            - "microservices.users"
          detail-type:
            - "UserRegistered"
        event_log_retention_in_days: 30
        targets:
          # The queue's policy lets this rule send (microservices/sqs/user-notifications).
          notifications:
            arn: !terraform.state microservices/sqs/user-notifications .queue_arn
            dead_letter_config:
              arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
          # The component grants this rule lambda:InvokeFunction on the function.
          welcome-email:
            arn: !terraform.state microservices/lambda/welcome-email .function_arn
            input_path: "$.detail"
            dead_letter_config:
              arn: !terraform.state microservices/sqs/event-bus-dlq .queue_arn
            retry_policy:
              maximum_event_age_in_seconds: 3600
              maximum_retry_attempts: 10
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: microservices/eventbridge
          - component: microservices/sqs/user-notifications
          - component: microservices/sqs/event-bus-dlq
          - component: microservices/lambda/welcome-email

    # =========================================================================
    # EVENT CONSUMERS (SQS, Lambda)
    # =========================================================================
    # The queues are applied before the rules that target them, and their
    # policies name those rules by ARN, built from names rather than read from
    # state: arn:aws:events:<region>:<account>:rule/<bus>/<rule>, where the bus
    # is "<Environment>-microservices" and each rule "<Environment>-<name>"
    # (the eventbridge instances above). The account segment is "*" because
    # the sqs component adds aws:SourceAccount = <this account> to every Allow
    # (iam_policy_limit_to_current_account, on in sqs/defaults), which pins it.
    # So nothing here reads eventbridge state and there is no dependency cycle.
    # kms/main's AllowEventBridgeSQSQueues lets EventBridge use the key.

    # Consumed by the inventory service; its own DLQ takes messages the
    # service fails to process 5 times.
    microservices/sqs/order-inventory:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: order-inventory
        dlq_enabled: true
        iam_policy:
          - statements:
              - sid: AllowOrderCreatedRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-microservices/{{ .settings.prefix }}-order-created"
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # Consumed by the notification service; its own DLQ as above.
    microservices/sqs/user-notifications:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: user-notifications
        dlq_enabled: true
        iam_policy:
          - statements:
              - sid: AllowUserRegisteredRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-microservices/{{ .settings.prefix }}-user-registered"
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # The bus's dead-letter queue (event_bus_dlq_arn), also the dead-letter
    # queue of every rule target above, so EventBridge may send to it from the
    # bus and from both rules. Nothing consumes it: failed events wait here,
    # 14 days (the sqs maximum), for an operator to inspect and replay.
    microservices/sqs/event-bus-dlq:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: event-bus-dlq
        message_retention_seconds: 1209600
        iam_policy:
          - statements:
              - sid: AllowEventBusAndRules
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      - "arn:aws:events:{{ .vars.region }}:*:event-bus/{{ .settings.prefix }}-microservices"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-microservices/{{ .settings.prefix }}-order-created"
                      - "arn:aws:events:{{ .vars.region }}:*:rule/{{ .settings.prefix }}-microservices/{{ .settings.prefix }}-user-registered"
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # Sends the welcome email for a UserRegistered event (the rule passes the
    # event's detail). The service's CI builds the package and uploads it as
    # welcome-email/<version>.zip to the stack's s3/lambda-artifacts bucket;
    # bumping settings.microservices.welcome_email_version changes s3_key, which
    # is what makes Terraform deploy the new code. It sends through SES from
    # the app domain's identity (microservices/ses). An invocation that still
    # fails after the retries goes to microservices/sqs/welcome-email-failures
    # (the rule target's dead-letter queue only catches failed deliveries).
    microservices/lambda/welcome-email:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: welcome-email
        handler: "index.handler"
        runtime: "nodejs22.x"
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        s3_key: 'welcome-email/{{ required "settings.microservices.welcome_email_version is required" .settings.microservices.welcome_email_version }}.zip'
        memory_size: 256
        timeout: 30
        log_retention_days: 30
        # Environment variables and the function's log group, with the stack key.
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn
        # Asynchronous invocations (EventBridge's): 2 retries within an hour,
        # then the event goes to the failure queue. The component lets the
        # role send there and use the queue's key.
        configure_event_invoke: true
        maximum_retry_attempts: 2
        maximum_event_age_in_seconds: 3600
        on_failure_destination: !terraform.state microservices/sqs/welcome-email-failures .queue_arn
        delivery_kms_key_arn: !terraform.state kms/main .key_arn
        environment_variables:
          SENDER_ADDRESS: 'no-reply@{{ .settings.microservices.app_domain_name }}'
        custom_policy: >-
          {"Version": "2012-10-17", "Statement": [{"Sid": "SendWelcomeEmail",
          "Effect": "Allow", "Action": ["ses:SendEmail", "ses:SendRawEmail"],
          "Resource": "arn:aws:ses:{{ .vars.region }}:*:identity/{{ .settings.microservices.app_domain_name }}",
          "Condition": {"StringEquals": {"ses:FromAddress": "no-reply@{{ .settings.microservices.app_domain_name }}"}}}]}
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: kms/main
          - component: s3/lambda-artifacts
          # Not microservices/ses: the function reads none of its state (its
          # policy names the identity by ARN), and SES is only needed when it
          # sends, so the identity deploys later (certificates layer, after the
          # dns zone it writes its DKIM records into).
          - component: microservices/sqs/welcome-email-failures

    # Failed asynchronous invocations of the welcome-email function (its
    # on_failure destination). The function's role sends here; nothing else
    # does, so the queue needs no policy.
    microservices/sqs/welcome-email-failures:
      metadata:
        component: sqs
        type: real
        inherits:
          - sqs/defaults
      vars:
        name: welcome-email-failures
        message_retention_seconds: 1209600
        tags:
          Layer: "messaging"
          Platform: "microservices"

    # The app domain as an SES identity, verified with Easy DKIM: the three
    # DKIM records go into the domain's public zone, from the stack's dns
    # instance (settings.microservices.dns_component / dns_zone_key).
    microservices/ses:
      metadata:
        component: ses
        type: real
        inherits:
          - ses/defaults
      vars:
        domain: '{{ required "settings.microservices.app_domain_name is required" .settings.microservices.app_domain_name }}'
        zone_id: !terraform.state '{{ required "settings.microservices.dns_component is required" .settings.microservices.dns_component }} .zone_ids.{{ required "settings.microservices.dns_zone_key is required" .settings.microservices.dns_zone_key }}'
        tags:
          Layer: "messaging"
          Platform: "microservices"
      dependencies:
        components:
          - component: '{{ .settings.microservices.dns_component }}'

    # =========================================================================
    # STATE MANAGEMENT (DynamoDB) - one table per instance
    # =========================================================================

    # Service state table
    microservices/dynamodb/service-state:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: service-state
        hash_key: "pk"
        range_key: "sk"
        dynamodb_attributes:
          - name: "gsi1pk"
            type: "S"
          - name: "gsi1sk"
            type: "S"
        global_secondary_index_map:
          - name: "gsi1"
            hash_key: "gsi1pk"
            range_key: "gsi1sk"
            projection_type: "ALL"
        ttl_enabled: true
        ttl_attribute: "ttl"
        point_in_time_recovery_enabled: true
        streams_enabled: true
        stream_view_type: "NEW_AND_OLD_IMAGES"
        tags:
          Layer: "data"
          Platform: "microservices"

    # Distributed locks table
    microservices/dynamodb/distributed-locks:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: distributed-locks
        hash_key: "lock_key"
        ttl_enabled: true
        ttl_attribute: "expires_at"
        # Locks are short-lived and rebuilt on restart
        point_in_time_recovery_enabled: false
        tags:
          Layer: "data"
          Platform: "microservices"

    # Saga state table (for distributed transactions)
    microservices/dynamodb/saga-state:
      metadata:
        component: dynamodb
        type: real
        inherits:
          - dynamodb/defaults
      vars:
        name: saga-state
        hash_key: "saga_id"
        range_key: "step_id"
        dynamodb_attributes:
          - name: "status"
            type: "S"
        global_secondary_index_map:
          - name: "status-index"
            hash_key: "status"
            projection_type: "ALL"
        ttl_enabled: true
        ttl_attribute: "ttl"
        point_in_time_recovery_enabled: true
        streams_enabled: true
        stream_view_type: "NEW_AND_OLD_IMAGES"
        tags:
          Layer: "data"
          Platform: "microservices"

    # =========================================================================
    # DISTRIBUTED CACHING (ElastiCache)
    # =========================================================================

    microservices/elasticache:
      metadata:
        component: elasticache
        type: real
      vars:
        enabled: true
        # The replication group is "<Environment>-microservices-cache".
        cluster_id: "microservices-cache"

        engine: "redis"
        engine_version: "7.0"

        # Cluster mode for scalability
        cluster_mode_enabled: true
        cluster_mode_num_node_groups: 2
        cluster_mode_replicas_per_node_group: 1
        node_type: "cache.r6g.large"

        # Network: the VPC's dedicated database subnets (microservices/vpc sets
        # database_subnets above), not the pod subnets -- Cloud Posse's
        # terraform-aws-elasticache-redis examples place the replication
        # group in isolated data-tier subnets, reachable only by security
        # group reference: from the EKS cluster security group below (managed
        # node groups attach it to every node) and from anything attached to
        # client_security_group_id (the rotation Lambda's
        # additional_security_group_ids), never by CIDR from the pod subnets
        # directly. This cache's own security group never has to read the
        # Lambda's own security group back (which WOULD close a dependency
        # cycle, since the Lambda already reads this cache's outputs); the
        # client SG is created unconditionally by THIS component instance,
        # and the Lambda attaches to it instead.
        vpc_id: !terraform.state microservices/vpc .vpc_id
        subnet_ids: !terraform.state microservices/vpc .database_subnet_ids
        allowed_security_group_ids: !terraform.state microservices/eks '.eks_cluster_managed_security_group_id | [.]'

        # Security: encryption at rest (stack key) and in transit. The
        # component generates the initial AUTH token write-only (never in
        # state) and sends it again only when auth_token_version changes.
        # microservices/lambda/redis-auth-rotation below then owns the token:
        # its first rotation (rotate_immediately: true) ROTATEs in a new token
        # from microservices/secrets .redis (rotation_managed_externally:
        # true) and SETs it, cutting the generated one off. Leave
        # auth_token_version alone here: a bump would ROTATE a Terraform
        # token back in as a second valid credential.
        at_rest_encryption_enabled: true
        transit_encryption_enabled: true
        kms_key_id: !terraform.state kms/main .key_arn
        # No copy of the generated token: nothing in this template reads it,
        # and the Lambda's first rotation replaces it.
        store_auth_token_in_secrets_manager: false

        # High availability
        automatic_failover_enabled: true
        multi_az_enabled: true

        # Maintenance and backups (non-overlapping windows)
        maintenance_window: "sun:05:00-sun:06:00"
        snapshot_retention_limit: 7
        snapshot_window: "03:00-04:00"

        # Parameter group (the component adds cluster-enabled=yes)
        family: "redis7"
        parameters:
          - name: "maxmemory-policy"
            value: "volatile-lru"
          - name: "notify-keyspace-events"
            value: "Ex"  # Expiry events for cache invalidation

        # CPU and memory alarms per node: microservices/monitoring
        # (elasticache_clusters).

        # Folded into rotation_policy below alongside this cache's own
        # ModifyReplicationGroup/DescribeReplicationGroups grant, so
        # microservices/lambda/redis-auth-rotation's single custom_policy
        # input gets both grants from one !terraform.state read (see
        # elasticache's additional_policy_json variable for why this can't
        # be two separate !terraform.state reads combined in YAML instead).
        additional_policy_json: !terraform.state microservices/secrets '.secret_access_policy.redis | tojson'

        tags:
          Layer: "caching"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/eks
          - component: microservices/secrets
          - component: kms/main

    # =========================================================================
    # OBSERVABILITY
    # =========================================================================

    microservices/monitoring:
      metadata:
        component: monitoring
        type: real
        inherits:
          - monitoring/defaults
      vars:
        # No certificates in this template
        enable_certificate_monitoring: false

        # Infrastructure dashboard, and CPU/memory alarms on every cache node
        create_dashboard: true
        vpc_id: !terraform.state microservices/vpc .vpc_id
        elasticache_clusters: !terraform.state microservices/elasticache .member_clusters

        # EKS backend dashboard and node/pod alarms (Container Insights)
        eks_cluster_name: !terraform.state microservices/eks .eks_cluster_id

        # X-Ray sampling rule (the component samples 10% of requests)
        enable_tracing: true

        # Custom dashboards
        metric_dashboards:
          eks-overview:
            widgets:
              - title: "Node Resource Utilization"
                period: 300
                metrics:
                  - namespace: "ContainerInsights"
                    metric: "node_cpu_utilization"
                    dimensions:
                      ClusterName: !terraform.state microservices/eks .eks_cluster_id
                  - namespace: "ContainerInsights"
                    metric: "node_memory_utilization"
                    dimensions:
                      ClusterName: !terraform.state microservices/eks .eks_cluster_id
          api-metrics:
            widgets:
              - title: "API Gateway Metrics"
                period: 60
                metrics:
                  - namespace: "AWS/ApiGateway"
                    metric: "Count"
                    dimensions:
                      ApiId: !terraform.state microservices/apigateway .http_api_id
                  - namespace: "AWS/ApiGateway"
                    metric: "Latency"
                    dimensions:
                      ApiId: !terraform.state microservices/apigateway .http_api_id
          # Both rules sit on the custom bus "<Environment>-microservices"
          # (microservices/eventbridge, create_event_bus: true), not the
          # account's default bus. Per AWS's EventBridge monitoring docs:
          # "Metrics that specify only the RuleName dimension refer to the
          # default event bus. Metrics that specify both the EventBusName
          # and RuleName dimensions refer to a Custom Event Bus - Classic."
          # so both dimensions are required for these series to have data.
          # RuleName's value is each rule's own name, "<Environment>-<name>"
          # (the eventbridge instances' cloudwatch_event_rule_name output).
          eventbridge-metrics:
            widgets:
              - title: "EventBridge Metrics: order-created"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Events"
                    metric: "Invocations"
                    dimensions:
                      RuleName: !terraform.state microservices/eventbridge/order-created .cloudwatch_event_rule_name
                      EventBusName: !terraform.state microservices/eventbridge/order-created .event_bus_name
                  - namespace: "AWS/Events"
                    metric: "FailedInvocations"
                    dimensions:
                      RuleName: !terraform.state microservices/eventbridge/order-created .cloudwatch_event_rule_name
                      EventBusName: !terraform.state microservices/eventbridge/order-created .event_bus_name
              - title: "EventBridge Metrics: user-registered"
                period: 60
                stat: "Sum"
                metrics:
                  - namespace: "AWS/Events"
                    metric: "Invocations"
                    dimensions:
                      RuleName: !terraform.state microservices/eventbridge/user-registered .cloudwatch_event_rule_name
                      EventBusName: !terraform.state microservices/eventbridge/user-registered .event_bus_name
                  - namespace: "AWS/Events"
                    metric: "FailedInvocations"
                    dimensions:
                      RuleName: !terraform.state microservices/eventbridge/user-registered .cloudwatch_event_rule_name
                      EventBusName: !terraform.state microservices/eventbridge/user-registered .event_bus_name

        # Alarms on metrics the fixed-purpose inputs cannot express. HTTP APIs
        # publish 5xx/Latency by ApiId (REST uses ApiName and 5XXError).
        metric_alarms:
          eks-failed-nodes:
            namespace: "ContainerInsights"
            metric_name: "cluster_failed_node_count"
            dimensions:
              ClusterName: !terraform.state microservices/eks .eks_cluster_id
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 2
            period: 300
            statistic: "Maximum"
          api-5xx-errors:
            namespace: "AWS/ApiGateway"
            metric_name: "5xx"
            dimensions:
              ApiId: !terraform.state microservices/apigateway .http_api_id
            comparison_operator: "GreaterThanThreshold"
            threshold: 10
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          api-latency-high:
            namespace: "AWS/ApiGateway"
            metric_name: "Latency"
            dimensions:
              ApiId: !terraform.state microservices/apigateway .http_api_id
            comparison_operator: "GreaterThanThreshold"
            threshold: 3000  # 3 seconds
            evaluation_periods: 3
            period: 300
            extended_statistic: "p99"
          # Both rules sit on the custom bus (see the eventbridge-metrics
          # dashboard note above), so FailedInvocations needs EventBusName
          # alongside RuleName -- one alarm per rule that has consumers, so a
          # delivery failure to either is caught.
          eventbridge-order-created-failures:
            namespace: "AWS/Events"
            metric_name: "FailedInvocations"
            dimensions:
              RuleName: !terraform.state microservices/eventbridge/order-created .cloudwatch_event_rule_name
              EventBusName: !terraform.state microservices/eventbridge/order-created .event_bus_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          eventbridge-user-registered-failures:
            namespace: "AWS/Events"
            metric_name: "FailedInvocations"
            dimensions:
              RuleName: !terraform.state microservices/eventbridge/user-registered .cloudwatch_event_rule_name
              EventBusName: !terraform.state microservices/eventbridge/user-registered .event_bus_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 5
            evaluation_periods: 2
            period: 300
            statistic: "Sum"
          # Per-table throttling and system errors, on every DynamoDB table
          # (all three, per #191's review): ReadThrottleEvents and
          # WriteThrottleEvents publish by TableName alone (ThrottledRequests
          # would also need an Operation dimension, so it is not used here);
          # SystemErrors (5xx responses from DynamoDB itself) does too.
          dynamodb-service-state-read-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "ReadThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/service-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-service-state-write-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "WriteThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/service-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-service-state-system-errors:
            namespace: "AWS/DynamoDB"
            metric_name: "SystemErrors"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/service-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-distributed-locks-read-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "ReadThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/distributed-locks .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-distributed-locks-write-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "WriteThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/distributed-locks .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-distributed-locks-system-errors:
            namespace: "AWS/DynamoDB"
            metric_name: "SystemErrors"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/distributed-locks .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-saga-state-read-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "ReadThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/saga-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-saga-state-write-throttled:
            namespace: "AWS/DynamoDB"
            metric_name: "WriteThrottleEvents"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/saga-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          dynamodb-saga-state-system-errors:
            namespace: "AWS/DynamoDB"
            metric_name: "SystemErrors"
            dimensions:
              TableName: !terraform.state microservices/dynamodb/saga-state .table_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 60
            statistic: "Sum"
          # Anything in a dead-letter or failure queue is an event that was
          # never handled.
          event-bus-dlq-messages:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state microservices/sqs/event-bus-dlq .queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Maximum"
          order-inventory-dlq-messages:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state microservices/sqs/order-inventory .dead_letter_queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Maximum"
          user-notifications-dlq-messages:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state microservices/sqs/user-notifications .dead_letter_queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Maximum"
          welcome-email-failures-messages:
            namespace: "AWS/SQS"
            metric_name: "ApproximateNumberOfMessagesVisible"
            dimensions:
              QueueName: !terraform.state microservices/sqs/welcome-email-failures .queue_name
            comparison_operator: "GreaterThanThreshold"
            threshold: 0
            evaluation_periods: 1
            period: 300
            statistic: "Maximum"

        # SNS notifications (topic "<Environment>-alarms")
        create_sns_topic: true
        # The importing stack lists its on-call addresses here.
        alarm_email_subscriptions: []

        # Log insights queries
        log_insights_queries:
          error-analysis:
            log_group_names: !terraform.state microservices/eks '.cloudwatch_log_group_name | [.]'
            query: |
              fields @timestamp, @message
              | filter @message like /error|Error|ERROR/
              | sort @timestamp desc
              | limit 100
          slow-requests:
            log_group_names: !terraform.state microservices/apigateway '.log_group_name | [.]'
            query: |
              fields @timestamp, routeKey, status, responseLatency
              | filter responseLatency > 1000
              | sort responseLatency desc
              | limit 100

        tags:
          Layer: "observability"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/eks
          - component: microservices/apigateway
          - component: microservices/eventbridge
          - component: microservices/eventbridge/order-created
          - component: microservices/eventbridge/user-registered
          - component: microservices/dynamodb/service-state
          - component: microservices/dynamodb/distributed-locks
          - component: microservices/dynamodb/saga-state
          - component: microservices/elasticache
          - component: microservices/sqs/event-bus-dlq
          - component: microservices/sqs/order-inventory
          - component: microservices/sqs/user-notifications
          - component: microservices/sqs/welcome-email-failures

    # =========================================================================
    # SECRET ROTATION (Lambda functions)
    # =========================================================================
    # Two AWS Secrets Manager rotation functions (the lambda component's
    # source_dir packaging -- see components/terraform/lambda/functions/),
    # each implementing the standard four-step protocol (createSecret ->
    # setSecret -> testSecret -> finishSecret).
    #
    # Rotation itself is configured from THESE instances (rotation_secret_arn
    # below), not from microservices/secrets. A rotation Lambda that itself
    # reads the secret it rotates (to scope its own custom_policy, and for
    # redis-auth-rotation, elasticache's replication group ARN and endpoint
    # too) cannot have aws_secretsmanager_secret_rotation configured on the
    # SECRET's own component instance: Secrets Manager's RotateSecret API
    # invokes the function -- at minimum running its testSecret step against
    # a temporary AWSPENDING version it creates and then removes -- even when
    # rotate_immediately is false, and on microservices/secrets' own first
    # apply, these functions and their secretsmanager.amazonaws.com invoke
    # permissions do not exist yet. Configuring it here instead is safe: each
    # Lambda instance already depends on microservices/secrets (to read the
    # secret's ARN), so by the time ITS OWN aws_secretsmanager_secret_rotation
    # applies, the function, its permission and its IAM role policies already
    # exist (the lambda component's depends_on covers all of them). See the
    # lambda component's rotation_secret_arn for the full rationale, and
    # microservices/secrets below, which sets rotation_managed_externally:
    # true on the redis and jwt_signing entries instead of
    # rotation_lambda_arn/rotation_automatically.
    #
    # redis-auth-rotation sets rotate_immediately: true below (jwt-secret-
    # rotation keeps the default false). At rotate_immediately = false, only
    # testSecret runs, against a temporary AWSPENDING version Secrets
    # Manager manufactures itself for the test -- setSecret, the step that
    # actually calls ElastiCache ModifyReplicationGroup to push a new token
    # onto the replication group, never runs, so this path never exercises
    # that call. rotate_immediately: true is set on redis-auth-rotation so
    # every apply that (re)configures this resource performs and verifies a
    # real end-to-end rotation instead of a same-value round-trip.
    # jwt-secret-rotation's testSecret only confirms the AWSPENDING value is
    # non-empty (setSecret is a no-op for it either way), so it keeps the
    # safer rotate_immediately = false default -- see that function's own
    # test_secret docstring for why it does NOT check the value's length.

    # Redis AUTH token rotation: setSecret calls ElastiCache
    # ModifyReplicationGroup with AuthTokenUpdateStrategy=ROTATE (the new
    # token becomes valid ALONGSIDE the current one), testSecret opens a TLS
    # connection to the cache and issues a RESP AUTH command by hand (no
    # third-party Redis client library to vendor for one command), and only
    # once that succeeds does finishSecret call ModifyReplicationGroup again
    # with AuthTokenUpdateStrategy=SET to cut the old token off and move
    # Secrets Manager's AWSCURRENT label. Runs in the VPC's private subnets;
    # its Secrets Manager and ElastiCache API calls reach the `secretsmanager`
    # and `elasticache` Interface VPC endpoints microservices/vpc enables
    # below (see that instance's comment), staying inside the VPC CIDR
    # instead of round-tripping the NAT gateway. The cache itself sits in the
    # database subnets, whose NACL admits 6379 from the VPC CIDR, and is not
    # reachable from outside the VPC. The database NACL's egress rule 100
    # spans 1024-65535, not just 32768-65535, so testSecret's TLS/AUTH
    # reply -- addressed to whatever source port this function's Hyperplane
    # ENI picked, which for a VPC-attached Lambda can be anywhere in that
    # wider range -- is not silently dropped on its way back (see
    # components/terraform/vpc/network-acls.tf). Attached to elasticache's
    # client_security_group_id (additional_security_group_ids)
    # for cache access -- elasticache's own security group never has to read
    # this function's security group back, which would close a dependency
    # cycle since this function already reads elasticache's other outputs.
    # timeout=900s to give setSecret/finishSecret's own wait-then-modify-
    # then-wait sequence headroom on a cluster-mode group, where a token
    # change rolls across every node. custom_policy folds this cache's own
    # ModifyReplicationGroup/DescribeReplicationGroups grant (elasticache's
    # rotation_policy output) together with the redis secret's own read/write
    # grant (secretsmanager's secret_access_policy output, folded into
    # elasticache's rotation_policy above via additional_policy_json).
    # It reads elasticache (data layer), so deploy-full-stack deploys it, like
    # every lambda that sets rotation_secret_arn, in addons, after data.
    microservices/lambda/redis-auth-rotation:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: redis-auth-rotation
        handler: "lambda_function.lambda_handler"
        runtime: "python3.13"
        source_dir: "functions/redis-auth-rotation"
        memory_size: 256
        timeout: 900
        log_retention_days: 30
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn
        vpc_id: !terraform.state microservices/vpc .vpc_id
        subnet_ids: !terraform.state microservices/vpc .private_subnet_ids
        additional_security_group_ids: !terraform.state microservices/elasticache '.client_security_group_id | [.]'
        environment_variables:
          REPLICATION_GROUP_ID: !terraform.state microservices/elasticache .replication_group_id
          REDIS_HOST: !terraform.state microservices/elasticache .configuration_endpoint_address
          REDIS_PORT: !terraform.state microservices/elasticache .port
        custom_egress_rules:
          # Redis AUTH check in testSecret, scoped by SECURITY GROUP to the
          # cache's own security group -- not the client_security_group_id
          # this function attaches to (that one carries no rules of its own;
          # it exists purely for elasticache's ingress rule above to
          # reference by ID). No cycle: this is an egress rule on this
          # function's own security group, referencing elasticache's
          # security_group_id, which this function already reads elsewhere.
          - description: "Redis AUTH check during rotation testSecret"
            from_port: !terraform.state microservices/elasticache .port
            to_port: !terraform.state microservices/elasticache .port
            protocol: "tcp"
            security_groups:
              - !terraform.state microservices/elasticache .security_group_id
          # GetSecretValue/PutSecretValue/DescribeSecret/UpdateSecretVersionStage
          # and ModifyReplicationGroup/DescribeReplicationGroups both resolve
          # (private_dns_enabled) to the Interface VPC endpoints
          # microservices/vpc creates for secretsmanager and elasticache, so
          # this egress rule is scoped to those endpoints' own shared security
          # group (vpc_endpoint_security_group_id), not the whole VPC CIDR --
          # the same security-group-referencing shape as the Redis AUTH rule
          # above, and narrower than a CIDR block since only traffic actually
          # destined for an ENI in that group is admitted. Non-null here
          # because enable_vpc_endpoints: true and vpc_endpoints (above) is
          # non-empty, so microservices/vpc always creates
          # aws_security_group.vpc_endpoints for this instance. Egress to
          # anywhere is allowed by this repo's rules regardless, so this is
          # least-privilege tightening, not a required fix -- see
          # components/terraform/vpc/network-acls.tf and this template's
          # microservices/vpc comment for why the endpoints exist at all.
          - description: "HTTPS to the secretsmanager/elasticache VPC endpoints"
            from_port: 443
            to_port: 443
            protocol: "tcp"
            security_groups:
              - !terraform.state microservices/vpc .vpc_endpoint_security_group_id
        secretsmanager_source_arn: !terraform.state microservices/secrets .secret_arns.redis
        rotation_secret_arn: !terraform.state microservices/secrets .secret_arns.redis
        rotation_days: 30
        # See the SECRET ROTATION comment above: at rotate_immediately =
        # false only testSecret runs, against a copy of the current token,
        # and setSecret never runs; true makes every apply that
        # (re)configures this resource perform and verify a real rotation
        # (ModifyReplicationGroup ROTATE -> AUTH test -> SET).
        rotate_immediately: true
        custom_policy: !terraform.state microservices/elasticache '.rotation_policy | tojson'
        tags:
          Layer: "security"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/vpc
          - component: microservices/elasticache
          - component: microservices/secrets
          - component: kms/main

    # JWT signing secret rotation: nothing outside Secrets Manager holds a
    # copy of the key, so setSecret is a no-op and testSecret only confirms
    # the new value round-trips. No VPC needed (nothing in a VPC to reach).
    # See the function's own module docstring for the grace-period/dual-key
    # note any real JWT verifier for this secret must follow.
    microservices/lambda/jwt-secret-rotation:
      metadata:
        component: lambda
        type: real
      vars:
        function_name: jwt-secret-rotation
        handler: "lambda_function.lambda_handler"
        runtime: "python3.13"
        source_dir: "functions/jwt-secret-rotation"
        memory_size: 128
        timeout: 30
        log_retention_days: 30
        kms_key_arn: !terraform.state kms/main .key_arn
        kms_key_id: !terraform.state kms/main .key_arn
        secretsmanager_source_arn: !terraform.state microservices/secrets .secret_arns.jwt_signing
        rotation_secret_arn: !terraform.state microservices/secrets .secret_arns.jwt_signing
        rotation_days: 30
        custom_policy: !terraform.state microservices/secrets '.secret_access_policy.jwt_signing | tojson'
        tags:
          Layer: "security"
          Platform: "microservices"
      dependencies:
        components:
          - component: microservices/secrets
          - component: kms/main

    # =========================================================================
    # SECRETS MANAGEMENT
    # =========================================================================
    # Secrets are "microservices/<environment>/<path>/<name>", encrypted with
    # kms/main (default_kms_key_id, from secretsmanager/defaults). The redis
    # and jwt_signing secrets are rotated every 30 days by the two Lambda
    # instances above, which configure that rotation from THEIR OWN component
    # instances (rotation_secret_arn) -- see the comment on that section for
    # why. rotation_managed_externally: true here records that the Lambda
    # owns the value; it does not itself configure any rotation. Generated
    # values are ephemeral and write-only (never in plan or state), sent on
    # create and again only on a secret_string_version bump, so this
    # component never overwrites a rotated value on a routine apply. Do not
    # bump secret_string_version on redis or jwt_signing: rotate them with
    # `aws secretsmanager rotate-secret`.
    #
    # var.environment is the stage (secretsmanager/defaults): stacks sharing an
    # account and stage differ by region, and secrets are regional, so the
    # full_path stays unique and the component's prod recovery-window guard
    # keys on the stage.

    microservices/secrets:
      metadata:
        component: secretsmanager
        type: real
        inherits:
          - secretsmanager/defaults
      vars:
        context_name: "microservices"
        secrets:
          # Database credentials
          database:
            name: "credentials"
            description: "Database credentials for microservices"
            path: "database"
            recovery_window_in_days: 7
            generate_random_password: true

          # Redis AUTH token for microservices/elasticache. The cache starts
          # on its own write-only generated token; this secret's value
          # becomes the cache's token at the Lambda's first rotation, which
          # never reads the initial value. override_special is the ElastiCache
          # AUTH token's own allowed punctuation set (! & # $ ^ < > -; the
          # component default random_password_override_special includes
          # several characters ElastiCache rejects, e.g. % * ( ) _ = + [ ]
          # { } : ?). Rotated every 30 days by microservices/lambda/redis-
          # auth-rotation above -- see that section's own comment for why
          # rotation is configured from the Lambda's own instance
          # (rotation_secret_arn), not here.
          redis:
            name: "auth-token"
            description: "Redis auth token for microservices"
            path: "cache"
            recovery_window_in_days: 7
            generate_random_password: true
            random_password_override_special: "!&#$^<>-"
            rotation_managed_externally: true

          # API keys, filled in by operators after apply (created empty)
          api_keys:
            name: "api-keys"
            description: "API keys for microservices"
            path: "api"
            recovery_window_in_days: 7

          # JWT signing key. Rotated every 30 days by microservices/lambda/
          # jwt-secret-rotation above -- see that Lambda's own module
          # docstring for the grace-period/dual-key note a real JWT
          # verifier for this secret must follow before this goes live.
          jwt_signing:
            name: "jwt-signing"
            description: "JWT signing key for microservices"
            path: "auth"
            recovery_window_in_days: 30
            generate_random_password: true
            rotation_managed_externally: true

        tags:
          Layer: "security"
          Platform: "microservices"

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
# Override the instances above per stack, e.g.:
#
# Development:
#   microservices/vpc:         nat_gateway_strategy: "single"
#   microservices/eks:         node_groups.system.min_group_size: 1,
#                              node_groups.application.capacity_type: "SPOT"
#   microservices/elasticache: cluster_mode_enabled: false, node_type: "cache.t4g.micro"
#
# Production:
#   microservices/eks:         cluster_log_retention_period: 90,
#                              node_groups.application.max_group_size: 50
#   microservices/elasticache: node_type: "cache.r6g.xlarge", cluster_mode_num_node_groups: 3,
#                              cluster_mode_replicas_per_node_group: 2
#   microservices/eventbridge: archive_retention_days: 90

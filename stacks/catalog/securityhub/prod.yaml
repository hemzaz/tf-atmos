---
import:
  - catalog/securityhub/defaults

# Production hub settings, shared by every prod stack's securityhub/main
# (the prod primaries and the DR standbys): PCI DSS on top of
# the default standards. AWS auto-subscribes AWS-FSBP and CIS under
# enable_default_standards (catalog default); listing them here as well
# collides at apply, so `standards` carries only what AWS does not enable.
# A stack outside the region that records global resources adds its
# disabled_security_controls: main-standby.yaml adds them for the DR standbys.
components:
  terraform:
    securityhub/prod:
      metadata:
        component: securityhub
        type: abstract
        inherits:
          - securityhub/defaults
      vars:
        standards:
          - "pci-dss/v/3.2.1"

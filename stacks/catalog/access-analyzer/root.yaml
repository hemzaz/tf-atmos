---
# =============================================================================
# access-analyzer/root in the management account's stack (fnx-ue1-root)
# =============================================================================
# Cloud Posse aws-access-analyzer README, "Root Account Configuration (Step 1)":
# from the organization management account, delegate Access Analyzer to the
# security account (<tenant>-security) and create the service-linked role the
# delegated administrator's organization analyzers need. Global, so one stack
# only: not fnx-ew1-root, which is the same management account.
#
# Enabled in E5c5 (Cloud Posse step 1 of this component, before E5c7's
# access-analyzer/delegated-administrator in the security stacks): E3's
# aws-organization enables Organizations trusted access for
# access-analyzer.amazonaws.com (catalog/aws-organization/defaults.yaml), and
# the accounts layer creates the security account before fnx-ue1-root's
# security layer runs (docs/OPERATIONS.md "Bootstrap order"). Like the other
# vendored security components, the first-deploy preflight fails its
# placeholder account IDs at deploy (warn-only in lint); the backend cold start
# applies backend/main alone, so its preflight (--cold-start) skips it.
# =============================================================================

import:
  - catalog/access-analyzer/defaults

components:
  terraform:
    access-analyzer/root:
      metadata:
        component: access-analyzer
        inherits:
          - access-analyzer/defaults
      vars:
        organizations_delegated_administrator_enabled: true
        service_linked_role_enabled: true

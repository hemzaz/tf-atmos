---
##################################################
# Catalog Configuration for IAM Access Analyzer
##################################################
# Vendored Cloud Posse aws-access-analyzer v2.0.1 (vendor.yaml), configured as
# its README's "Defaults (Abstract Component)": every flag off, an instance
# turns on its step. The component has organization analyzers only (no
# ACCOUNT analyzer), in two steps:
#   1. access-analyzer/root (root.yaml) in the management account
#      (fnx-ue1-root): delegates Access Analyzer to the security account and
#      creates the service-linked role. Once per organization.
#   2. access-analyzer/delegated-administrator in the security account, per
#      region: the ORGANIZATION and ORGANIZATION_UNUSED_ACCESS analyzers.
#      Not yet: the security account has no stack (Wave E).
# account_map is the static map (account_map_enabled false, the CP default),
# from the abstract account-map-bypass (catalog/_base/account-map-bypass):
# settings.static_account_map (stacks/orgs/fnx/_defaults.yaml), keys
# <tenant>-<account>; account verification checks <tenant>-<stage> there.

import:
  - catalog/_base/vendored
  - catalog/_base/account-map-bypass

components:
  terraform:
    access-analyzer/defaults:
      metadata:
        component: access-analyzer
        type: abstract
        inherits:
          - vendored
          - account-map-bypass
      vars:
        enabled: true
        name: access-analyzer
        delegated_administrator_account_name: "{{ .settings.context.tenant }}-security"
        accessanalyzer_service_principal: "access-analyzer.amazonaws.com"
        accessanalyzer_organization_enabled: false
        accessanalyzer_organization_unused_access_enabled: false
        organizations_delegated_administrator_enabled: false
        service_linked_role_enabled: true
        tags:
          Component: "AccessAnalyzer"

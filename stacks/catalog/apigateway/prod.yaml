---
import:
  - catalog/apigateway/defaults

# The production main API, shared by fnx-ue1-prod's and fnx-ew1-prod's
# apigateway/main: api.<domain> on acm/main's wildcard certificate in
# network/main's zone, authorized by the stack's cognito/main pool, behind
# WAF, with logging and tracing. Each adds the PRIMARY half of its Route 53
# failover pair (DR: fnx-ue2-prod, fnx-ec1-prod).
components:
  terraform:
    apigateway/main-prod:
      metadata:
        component: apigateway
        type: abstract
      vars:
        description: "Production Main API Gateway"
        stage_name: "v1"

        # API resources
        api_resources:
          - path_part: "api"
          - path_part: "auth"
          - path_part: "health"
          - path_part: "users"
          - path_part: "products"

        # Methods are addressed by resource_path ("/" is the API root), because
        # a stack cannot know this API's resource IDs before apply.
        # lambda/data-processor is disabled (no package yet), so "/api" has no
        # method. When it is enabled, append these items to the two lists below
        # (delete "#   " to keep the indentation) and add
        # `- component: lambda/data-processor` to dependencies.components:
        #   api_methods:
        #     - resource_path: "/api"
        #       http_method: "ANY"
        #       authorization: "COGNITO_USER_POOLS"
        #   api_integrations:
        #     - resource_path: "/api"
        #       http_method: "ANY"
        #       integration_http_method: "POST"   # AWS_PROXY always POSTs to Lambda
        #       type: "AWS_PROXY"
        #       uri: !terraform.state lambda/data-processor .function_invoke_arn
        #       lambda_function_name: !terraform.state lambda/data-processor .function_name
        api_methods:
          - resource_path: "/"
            http_method: "GET"
            authorization: "NONE"

        # "/" stays MOCK on purpose: it is a liveness endpoint, and a canned 200
        # is the correct answer for one. The real entry point, "/api" proxied to
        # Lambda, comes back with lambda/data-processor (see above).
        api_integrations:
          - resource_path: "/"
            http_method: "GET"
            integration_http_method: "GET"
            type: "MOCK"

        # Authorizer for the "/api" COGNITO_USER_POOLS method. A method that asks
        # for COGNITO_USER_POOLS without a pool here fails at apply.
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns:
          - !terraform.state cognito/main .user_pool_arn

        # Domain Configuration
        domain_name: "api.{{ .settings.environment.domain_name }}"
        certificate_arn: !terraform.state acm/main .certificate_arns.main_wildcard
        api_name: "{{ .settings.context.stage }}-main-api"
        zone_id: !terraform.state network/main .zone_ids.main
        throttling_burst_limit: 5000
        throttling_rate_limit: 10000

        enable_logging: true
        log_retention_days: 90
        create_dashboard: true
        tracing_enabled: true

        # No response caching. This used to cache "*/*", every method including
        # COGNITO_USER_POOLS ones, keyed without the caller's identity, so one
        # user's response could be served to another. Nothing here is worth
        # caching today: "/" is a MOCK liveness check and "/api" is disabled.
        # The cache cluster is billed per hour (0.5 GB, the smallest, is about
        # $15/month), so it stays off until a method is worth caching. To cache
        # a public GET, set:
        #   enable_caching: true
        #   cache_method_paths: ["GET /products"]   # an api_methods key
        #   cache_ttl_seconds: 300
        # An authorized method also needs method.request.header.Authorization
        # in its request_parameters and its integration's cache_key_parameters
        # (the component rejects it otherwise).
        enable_caching: false

        cors_configuration:
          allow_origins:
            - "https://{{ .settings.environment.domain_name }}"
            - "https://www.{{ .settings.environment.domain_name }}"
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers:
            - "Content-Type"
            - "Authorization"
            - "X-Api-Key"
            - "X-Request-Id"
          expose_headers: []
          max_age: 300
          allow_credentials: false

        enable_waf: true

        tags:
          Service: api-gateway
          Tier: edge
          CriticalityLevel: "high"
      dependencies:
        components:
          # Ordering only: REST stage logging needs the account's
          # CloudWatch role set first (no output is read).
          - component: apigateway-account/main
          - component: network/main
          - component: acm/main
          - component: cognito/main

---
components:
  terraform:
    apigateway_rest:
      metadata:
        component: apigateway
        type: abstract
      vars:
        enabled: true
        api_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-rest-api"
        description: "REST API Gateway for {{ .settings.context.environment }} environment"
        api_type: "REST"
        endpoint_type: ["REGIONAL"]

        # REST API specific configurations
        binary_media_types:
          - "application/octet-stream"
          - "image/*"
        minimum_compression_size: 10240

        # Authorization
        authorizer_type: "COGNITO_USER_POOLS"
        cognito_user_pool_arns: [] # required: set the Cognito user pool ARN(s) per instance
        authorizer_identity_source: "method.request.header.Authorization"

        # API Gateway access logging
        enable_logging: true
        log_format: "{ \"requestId\":\"$context.requestId\", \"ip\": \"$context.identity.sourceIp\", \"requestTime\":\"$context.requestTime\", \"httpMethod\":\"$context.httpMethod\", \"resourcePath\":\"$context.resourcePath\", \"status\":\"$context.status\", \"protocol\":\"$context.protocol\", \"responseLength\":\"$context.responseLength\", \"integrationError\":\"$context.integrationErrorMessage\" }"
        log_retention_days: 30

        # Stage configurations
        stage_name: "{{ .settings.context.environment }}"

        # API Keys and Usage Plans
        create_api_key: false
        create_usage_plan: false
        usage_plan_quota_limit: 10000
        usage_plan_quota_period: "MONTH"
        usage_plan_throttle_burst_limit: 5000
        usage_plan_throttle_rate_limit: 10000

        # Integration timeouts
        api_integrations: []

        # Monitoring
        create_dashboard: true
        # X-Ray bills per recorded trace; prod opts in explicitly (orgs/fnx/prod/.../services.yaml)
        tracing_enabled: false

        tags:
          Component: "ApiGateway"
    apigateway_http:
      metadata:
        component: apigateway
        type: abstract
      vars:
        enabled: true
        api_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-http-api"
        description: "HTTP API Gateway for {{ .settings.context.environment }} environment"
        api_type: "HTTP"

        # HTTP API specific configurations
        cors_configuration:
          allow_origins:
            - "*"
          allow_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "OPTIONS"
          allow_headers:
            - "Content-Type"
            - "Authorization"
          expose_headers: []
          max_age: 300
          allow_credentials: false

        # Authentication options
        authorizer_type: "JWT"
        jwt_audience: [] # required: set the Cognito app client ID(s) per instance
        jwt_issuer: null # required: https://cognito-idp.<region>.amazonaws.com/<user_pool_id>

        # Logging
        enable_logging: true
        log_format: "{ \"requestId\":\"$context.requestId\", \"ip\": \"$context.identity.sourceIp\", \"requestTime\":\"$context.requestTime\", \"httpMethod\":\"$context.httpMethod\", \"routeKey\":\"$context.routeKey\", \"status\":\"$context.status\", \"protocol\":\"$context.protocol\", \"responseLength\":\"$context.responseLength\", \"integrationError\":\"$context.integrationErrorMessage\" }"
        log_retention_days: 30

        # Stage configurations
        stage_name: "{{ .settings.context.environment }}"
        auto_deploy: true

        # Monitoring
        create_dashboard: true
        # X-Ray bills per recorded trace; prod opts in explicitly (orgs/fnx/prod/.../services.yaml)
        tracing_enabled: false

        tags:
          Component: "ApiGateway"
    apigateway_domain:
      metadata:
        component: apigateway
        type: abstract
      vars:
        enabled: true
        api_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-domain"
        api_type: "REST"
        domain_name: null # required: e.g. api.<environment>.<root domain>
        certificate_arn: null # required: ACM certificate ARN
        zone_id: null # required: Route53 hosted zone ID

        # Stage mapping
        stage_name: "{{ .settings.context.environment }}"
        base_path: null

        # Logging (minimal for domain component)
        enable_logging: false

        tags:
          Component: "ApiGateway Domain"

##################################################
# Catalog Configuration for CloudFront
##################################################
# One distribution per instance in front of an optional S3 bucket (through
# origin access control) and custom origins such as an ALB or API Gateway (the
# Cloud Posse terraform-aws-cloudfront-s3-cdn model). Instances inherit this
# base and set `name` and either `origin_bucket_regional_domain_name` (an s3
# instance's .bucket_regional_domain_name) or `custom_origins` with
# `default_origin_id`; ordered_cache routes paths to origins. default_root_object
# is left to the component: index.html for an S3 default origin, none for a
# custom one. For a custom domain also set `aliases`,
# `acm_certificate_arn` (an acm instance's .certificate_arns.<key>, us-east-1)
# and, for alias records, `dns_alias_enabled: true` with `parent_zone_id` (a
# dns instance's .zone_ids.<key>); optionally `web_acl_id` (a CLOUDFRONT-scope
# waf instance's .arn). List each instance read in dependencies.components.
#
# Origin access is account-scoped (components/terraform/cloudfront/README.md):
# the origin s3 instance sets allow_cloudfront_oac_read and the stack's
# kms/main sets allow_cloudfront, so the first deploy works in one pass.
#
# Example instances:
#
#   kms/main:
#     vars:
#       allow_cloudfront: true          # CloudFront may kms:Decrypt origin objects
#
#   s3/site:
#     metadata:
#       component: s3
#       inherits: [s3/defaults]
#     vars:
#       name: site
#       allow_cloudfront_oac_read: true # any distribution of the account may read
#
#   cdn/site:
#     metadata:
#       component: cloudfront
#       inherits: [cloudfront/defaults]
#     dependencies:
#       components:
#         - component: s3/site
#         - component: kms/main
#         - component: acm/main
#         - component: network/main
#         - component: waf/cdn          # with web_acl_id
#     vars:
#       name: site
#       origin_bucket_regional_domain_name: !terraform.state s3/site .bucket_regional_domain_name
#       aliases: ["www.example.com"]
#       acm_certificate_arn: !terraform.state acm/main .certificate_arns.www
#       dns_alias_enabled: true
#       parent_zone_id: !terraform.state network/main .zone_ids.main
#       web_acl_id: !terraform.state waf/cdn .arn   # a scope CLOUDFRONT waf instance
#       enable_spa_fallback: true
#
#   cdn/app:                          # ALB-backed app, no S3 origin
#     metadata:
#       component: cloudfront
#       inherits: [cloudfront/defaults]
#     dependencies:
#       components:
#         - component: acm/main
#     vars:
#       name: app
#       custom_origins:
#         - origin_id: alb
#           domain_name: origin.app.example.com   # a name the ALB certificate covers
#           custom_headers:                       # the ALB listener rule requires it
#             - name: X-Origin-Verify
#               value: "<secret from Secrets Manager/SSM, never a literal>"
#       default_origin_id: alb
#       allowed_methods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
#       cache_policy_id: CachingDisabled
#       origin_request_policy_id: AllViewerExceptHostHeader
#       ordered_cache:
#         - path_pattern: /static/*
#           target_origin_id: alb
#       aliases: ["app.example.com"]
#       acm_certificate_arn: !terraform.state acm/main .certificate_arns.app

components:
  terraform:
    cloudfront/defaults:
      metadata:
        component: cloudfront
        type: abstract
      vars:
        enabled: true
        price_class: PriceClass_100
        http_version: http2and3
        ipv6_enabled: true
        minimum_protocol_version: TLSv1.2_2021
        cache_policy_id: CachingOptimized
        response_headers_policy_id: SecurityHeadersPolicy
        tags:
          Component: "CloudFront"

---
import:
  - catalog/elasticache/defaults

# Production keeps automatic failover and Multi-AZ on, with a week of
# snapshot retention. These values match what elasticache/main already set
# inline (this is a purely structural move: it should produce zero resolved
# diff), so the instance actually inherits its stage tier instead of
# hardcoding it.
components:
  terraform:
    elasticache/prod:
      metadata:
        component: elasticache
        type: abstract
        inherits:
          - elasticache/defaults
      vars:
        automatic_failover_enabled: true
        multi_az_enabled: true
        snapshot_retention_limit: 7

    # The production main cache, shared by fnx-ue1-prod's and fnx-ew1-prod's
    # elasticache/main: vpc/main's private subnets, every key on the stack's
    # kms/main, reachable from eks/main. fnx-ue1-prod adds its Global
    # Datastore (DR).
    elasticache/main-prod:
      metadata:
        component: elasticache
        type: abstract
        inherits:
          - elasticache/prod
      vars:
        cluster_id: "{{ .settings.context.stage }}-cache"
        engine_version: "7.0"
        node_type: "cache.r5.large"
        num_cache_nodes: 3
        # The AUTH token is generated by the component, write-only (never in
        # state); bump auth_token_version to rotate it.
        kms_key_id: !terraform.state kms/main .key_arn
        # external-secrets/main's IAM policy grants kms:Decrypt on this same
        # key (gated by kms:ViaService=secretsmanager), so the redis-auth
        # secret eks-backend-services/main reads is encrypted with the CMK,
        # not the AWS-managed aws/secretsmanager key.
        auth_token_secret_kms_key_id: !terraform.state kms/main .key_arn
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        # eks-backend-services/main's pods (on eks/main) are now the
        # consumer: their security group is the EKS cluster's managed one.
        allowed_security_group_ids: !terraform.state eks/main .eks_cluster_managed_security_group_id | [.]
        allowed_cidr_blocks: []
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
          - component: eks/main

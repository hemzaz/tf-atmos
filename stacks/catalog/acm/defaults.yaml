---
components:
  terraform:
    acm/defaults:
      metadata:
        component: acm
        type: abstract
        custom:
          version: "1.0.0"
          description: "Manages ACM certificates"
          category: "security"
      vars:
        enabled: true
        zone_id: ''

        # Define certificates
        dns_domains: {}

        # Cross-region certificate replication
        enable_cross_region_replication: false
        target_regions: []

        # Certificate validation options
        validation_method: DNS
        wait_for_validation: true

        tags:
          Component: "ACM"

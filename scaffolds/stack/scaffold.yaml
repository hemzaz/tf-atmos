---
# Generates one stage stack, stacks/orgs/<tenant>/<stage>/<region>.yaml, in the
# folded layout (the imports, then one vars/settings/components body):
#
#   atmos scaffold generate stack . --force
#   atmos scaffold generate stack . --force --defaults --set profile=standby --set ...
#
# The target is the REPOSITORY ROOT, run from the repository root: `target:`
# below places the file, and Atmos 1.229 runs hooks in the invocation directory
# where 1.233 runs them in the target directory, so `.` from the root makes the
# two the same. `--force` is required only because the root is non-empty; it
# would also overwrite an existing stack, so the `guard` hook refuses one.
# After it writes the stack, `verify` resolves it and `wire` adds it to the
# state backend's access roles (scripts/stack-wiring.py).
#
# Each profile's template is a near-copy of its reference stacks, whose answers
# are scaffolds/stack-golden/<stack>.env. scripts/check-stack-scaffold.sh (lint
# step stack-scaffold) regenerates every reference stack from its answers and
# fails unless Atmos resolves it identically, so a residue edit to a reference
# stack must update its template or .env in the same PR.
#
# Templates use the [[ ]] delimiters, so the {{ }} the stack itself needs
# (`{{ .settings.prefix }}`, `{{ .settings.environment.account_id }}`) is
# emitted verbatim; hook commands still use {{ .Answers.<field> }}. No computed
# fields (Atmos 1.229 has none): the templates derive the rest.
apiVersion: atmos/v1
kind: AtmosScaffoldConfig
metadata:
  name: stack
  description: Stage stack (stacks/orgs/<tenant>/<stage>/<region>.yaml) for an existing stage, account and region
  version: 1.0.0
spec:
  delimiters: ["[[", "]]"]
  fields:
    # nonprod: a dev or staging stack (reference stacks fnx-ue1-dev,
    # fnx-ue1-staging; nonprod_flavor picks which one's imports and sizing).
    # standby: a prod DR warm standby (reference stacks fnx-ue2-prod,
    # fnx-ec1-prod), every instance from the catalog's -standby files.
    # prod-primary: an account's prod primary, owner of its singletons, with
    # a DR warm standby in dr_region (reference stacks fnx-ue1-prod, the data
    # plane, and fnx-ew1-prod, the EU core subset).
    # The defaults are the cheapest stack, a dev one.
    - name: profile
      type: select
      label: Stack profile
      default: nonprod
      options:
        - nonprod
        - standby
        - prod-primary

    # prod-primary: whether the stack runs fnx-ue1-prod's data plane (the
    # services VPC, eks/data, rds/data, the ECS cluster, the data API and
    # Lambdas): yes for the prod account's us-east-1 primary, no for the
    # prod-eu account's EU primary (fnx-ew1-prod's core subset; owner
    # decision B5: no data plane in the EU). The guard refuses the other
    # combinations, which no reference stack pins.
    - name: data_plane
      type: select
      label: Run the data plane (yes = fnx-ue1-prod's, no = fnx-ew1-prod's core subset)
      default: "no"
      when: "answers.profile == 'prod-primary'"
      options:
        - "yes"
        - "no"

    # nonprod: whose imports and sizing (the residue) to copy: dev is
    # fnx-ue1-dev's (-dev flavors: smaller, deletable), default is
    # fnx-ue1-staging's (the un-suffixed catalog defaults, plus
    # lambda/data-transformer and sqs/data-transform). Edit the sizes in the
    # generated file afterwards.
    - name: nonprod_flavor
      type: select
      label: Nonprod flavor (dev = fnx-ue1-dev's sizing, default = fnx-ue1-staging's)
      default: dev
      when: "answers.profile == 'nonprod'"
      options:
        - dev
        - default

    - name: tenant
      type: input
      label: Tenant
      default: fnx
      validation:
        pattern: "^[a-z][a-z0-9]{1,9}$"
        message: 2-10 lowercase letters/digits, starting with a letter.

    - name: stage
      type: select
      label: Stage (an existing stacks/orgs/<tenant>/<stage>/_defaults.yaml)
      default: dev
      options:
        - dev
        - staging
        - prod

    # The settings.account_map key; empty means the stage's own account.
    - name: account
      type: input
      label: Account (settings.account_map key; empty = the stage)
      default: ""
      validation:
        pattern: "^$|^(dev|staging|prod|prod-eu)$"
        message: One of dev, staging, prod, prod-eu (or empty for the stage's account).

    - name: region
      type: select
      label: Region (an existing stacks/mixins/region/<region>.yaml)
      default: us-east-1
      options:
        - us-east-1
        - us-east-2
        - us-west-2
        - eu-west-1
        - eu-central-1

    # Must equal the region mixin's settings.context.environment (the guard
    # hook checks it); it names the stack: <tenant>-<region_code>-<stage>.
    - name: region_code
      type: input
      label: Region code (the region mixin's settings.context.environment)
      required: true
      placeholder: ue1
      validation:
        pattern: "^[a-z]{2}[a-z]?[0-9]$"
        message: A Cloud Posse short region code, e.g. ue1, ew1, ec1.

    # vpc/main's /16; its subnets are cut from it (private x.y.1-3,
    # public x.y.101-103, database x.y.201-203).
    - name: vpc_cidr_main
      type: input
      label: vpc/main CIDR (/16)
      required: true
      placeholder: 10.22.0.0/16
      validation:
        pattern: "^10\\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\\.0\\.0/16$"
        message: A 10.x.0.0/16 CIDR.

    # nonprod: whether this stack creates its account's singletons (iam/ci's
    # GitHub OIDC provider, the Auto Scaling service-linked role, the
    # multi-region CloudTrail trail, AWS Config's global-resource recording):
    # yes for the account's first stack, no for another region of it (the
    # guard checks; no gives a regional trail and Config without IAM).
    - name: account_singletons
      type: select
      label: Create the account's singletons (yes = the account's first stack)
      default: "yes"
      when: "answers.profile == 'nonprod'"
      options:
        - "yes"
        - "no"

    # nonprod, prod-primary with the data plane: vpc/services' /16, cut like
    # vpc/main's (nonprod: no database subnets).
    - name: vpc_cidr_services
      type: input
      label: vpc/services CIDR (/16)
      required: true
      placeholder: 10.23.0.0/16
      when: "answers.profile == 'nonprod' || (answers.profile == 'prod-primary' && answers.data_plane == 'yes')"
      validation:
        pattern: "^10\\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\\.0\\.0/16$"
        message: A 10.x.0.0/16 CIDR.

    - name: az_ids
      type: input
      label: Three AZ IDs, comma-separated (e.g. use2-az1,use2-az2,use2-az3)
      required: true
      validation:
        pattern: "^[a-z0-9]+-az[0-9]+,[a-z0-9]+-az[0-9]+,[a-z0-9]+-az[0-9]+$"
        message: Exactly three AZ IDs, comma-separated, no spaces.

    - name: domain_name
      type: input
      label: settings.environment.domain_name
      required: true
      placeholder: fnx.example.com
      validation:
        pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
        message: A lowercase DNS name.

    - name: critical_alerts
      type: input
      label: Critical alert emails, comma-separated
      required: true
      validation:
        pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(,[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)*$"
        message: One or more email addresses, comma-separated, no spaces.

    - name: warning_alerts
      type: input
      label: Warning alert emails, comma-separated
      required: true
      validation:
        pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(,[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)*$"
        message: One or more email addresses, comma-separated, no spaces.

    # nonprod, prod-primary: cost-optimization/main's monthly AWS Budget, in
    # USD (the standby has none: its primary owns the account budget).
    - name: budget_monthly_limit
      type: input
      label: Monthly AWS Budget (USD)
      required: true
      placeholder: "500"
      when: "answers.profile == 'nonprod' || answers.profile == 'prod-primary'"
      validation:
        pattern: "^[1-9][0-9]{0,6}$"
        message: A whole number of US dollars, 1 to 9999999.

    # nonprod, default flavor: monitoring/main's alarm_email_subscriptions
    # (the dev flavor reads the first critical and warning alert instead).
    - name: alarm_emails
      type: input
      label: monitoring/main alarm emails, comma-separated
      required: true
      when: "answers.profile == 'nonprod' && answers.nonprod_flavor == 'default'"
      validation:
        pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+(,[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)*$"
        message: One or more email addresses, comma-separated, no spaces.

    # standby: the primary stack it is the DR standby of, and that stack's
    # region (the guard hook checks the two agree).
    - name: standby_of
      type: input
      label: Primary stack (settings.dr.standby_of)
      placeholder: fnx-ue1-prod
      when: "answers.profile == 'standby'"
      validation:
        pattern: "^[a-z][a-z0-9]{1,9}-[a-z]{2}[a-z]?[0-9]-prod$"
        message: A prod stack name, <tenant>-<region code>-prod.

    - name: primary_region
      type: select
      label: The primary stack's region
      default: us-east-1
      when: "answers.profile == 'standby'"
      options:
        - us-east-1
        - us-east-2
        - us-west-2
        - eu-west-1
        - eu-central-1

    # prod-primary: the region of its DR warm standby (settings.dr.region:
    # the replica key, backup copies and secret replicas go there, and the
    # account budget also counts the standby's Environment, dr_region_code).
    - name: dr_region
      type: select
      label: DR region (settings.dr.region, the warm standby's region)
      default: us-east-2
      when: "answers.profile == 'prod-primary'"
      options:
        - us-east-1
        - us-east-2
        - us-west-2
        - eu-west-1
        - eu-central-1

    # Must equal the dr_region mixin's settings.context.environment (the
    # guard hook checks it): the standby's region code, as region_code is
    # this stack's.
    - name: dr_region_code
      type: input
      label: DR region code (the dr_region mixin's settings.context.environment)
      required: true
      placeholder: ue2
      when: "answers.profile == 'prod-primary'"
      validation:
        pattern: "^[a-z]{2}[a-z]?[0-9]$"
        message: A Cloud Posse short region code, e.g. ue2, ec1.

  # Every file under scaffolds/stack is output (a `files` entry only gates
  # one), so the goldens live beside it, in scaffolds/stack-golden.
  files:
    - path: stack/nonprod.yaml.tmpl
      target: "stacks/orgs/[[ .Config.tenant ]]/[[ .Config.stage ]]/[[ .Config.region ]].yaml"
      when: "answers.profile == 'nonprod'"
    - path: stack/standby.yaml.tmpl
      target: "stacks/orgs/[[ .Config.tenant ]]/[[ .Config.stage ]]/[[ .Config.region ]].yaml"
      when: "answers.profile == 'standby'"
    - path: stack/prod-primary.yaml.tmpl
      target: "stacks/orgs/[[ .Config.tenant ]]/[[ .Config.stage ]]/[[ .Config.region ]].yaml"
      when: "answers.profile == 'prod-primary'"

  hooks:
    # Refuses to overwrite a stack (--force alone would), and checks the
    # answers against the files they name. Hooks run in the invocation
    # directory (1.229) or the target (1.233); both are the root from `.`.
    guard:
      events:
        - before.scaffold.generate
      kind: step
      type: shell
      with:
        command: |
          set -eu
          root="$PWD"
          [ -d "$root/stacks/orgs/{{ .Answers.tenant }}/root" ] || root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          stack_file="$root/stacks/orgs/{{ .Answers.tenant }}/{{ .Answers.stage }}/{{ .Answers.region }}.yaml"
          mixin="$root/stacks/mixins/region/{{ .Answers.region }}.yaml"
          fail() { echo "scaffold stack: $*" >&2; exit 1; }
          [ ! -e "$stack_file" ] || fail "$stack_file exists; remove it first to regenerate it"
          [ -f "$root/stacks/orgs/{{ .Answers.tenant }}/{{ .Answers.stage }}/_defaults.yaml" ] \
            || fail "no stacks/orgs/{{ .Answers.tenant }}/{{ .Answers.stage }}/_defaults.yaml: a new tenant or stage is out of scope"
          [ -f "$mixin" ] || fail "no region mixin $mixin: add it first (docs/OPERATIONS.md)"
          code="$(sed -n 's/^ *environment: *\([a-z0-9]*\) *$/\1/p' "$mixin" | head -n 1)"
          [ "$code" = "{{ .Answers.region_code }}" ] \
            || fail "region_code {{ .Answers.region_code }} is not $mixin's environment ($code)"
          # The account is the stage's own, or prod-eu for an EU prod stack.
          account="{{ .Answers.account }}"
          [ -n "$account" ] || account="{{ .Answers.stage }}"
          [ "$account" = "{{ .Answers.stage }}" ] \
            || { [ "{{ .Answers.stage }}" = "prod" ] && [ "$account" = "prod-eu" ]; } \
            || fail "account $account does not belong to stage {{ .Answers.stage }} (its own, or prod-eu for prod)"
          # GDPR scope: the prod-eu account holds exactly the EU regions'
          # stacks, whatever the stage. check-data-residency.py treats any stack
          # in an eu- region as GDPR-scoped (its tags must say gdpr, its state
          # stay in the EU backend), which only the prod-eu account's stacks
          # are: so no dev or staging stack in an EU region (derived from owner
          # decision B5's residency rule).
          eu() { case "$1" in eu-*) echo yes ;; *) echo no ;; esac; }
          gdpr=no
          [ "$account" != "prod-eu" ] || gdpr=yes
          [ "$(eu "{{ .Answers.region }}")" = "$gdpr" ] \
            || fail "account $account and region {{ .Answers.region }} disagree: the EU regions are exactly the prod-eu account's (GDPR)"
          {{- if eq .Answers.profile "nonprod" }}
          # Only rendered for a nonprod stack, so a field its `when` hides
          # never reaches the shell.
            [ "{{ .Answers.stage }}" != "prod" ] || fail "a nonprod stack is a dev or staging stack, not stage prod"
            [ "{{ .Answers.vpc_cidr_services }}" != "{{ .Answers.vpc_cidr_main }}" ] \
              || fail "vpc_cidr_services and vpc_cidr_main must differ (network/vpc-peering joins them)"
            # The account's singletons (iam/ci's GitHub OIDC provider, the Auto
            # Scaling service-linked role, the multi-region trail, Config's
            # global-resource recording) are created by exactly one of its
            # stacks (check-lane-names.py, which also fails a stack trusting
            # a provider no stack creates): account_singletons=yes for the
            # account's (= the stage's) first stack, no for every other.
            others=""
            for other in "$root/stacks/orgs/{{ .Answers.tenant }}/{{ .Answers.stage }}"/*.yaml; do
              case "${other##*/}" in _defaults.yaml) continue ;; esac
              [ ! -e "$other" ] || others="$others ${other##*/}"
            done
            if [ "{{ .Answers.account_singletons }}" = "yes" ]; then
              [ -z "$others" ] \
                || fail "account_singletons=yes, but the {{ .Answers.stage }} account already has a stack ($others) that creates its singletons (GitHub OIDC provider, Auto Scaling service-linked role, multi-region trail, Config global recording): answer no"
            else
              [ -n "$others" ] \
                || fail "account_singletons=no, but the {{ .Answers.stage }} account has no other stack to create its singletons (GitHub OIDC provider, Auto Scaling service-linked role, multi-region trail, Config global recording): answer yes"
            fi
          {{- end }}
          {{- if eq .Answers.profile "standby" }}
          # Only rendered for a standby, so a field its `when` hides never
          # reaches the shell.
            [ "{{ .Answers.stage }}" = "prod" ] || fail "a standby is a prod stack (stage prod)"
            [ "{{ .Answers.region }}" != "{{ .Answers.primary_region }}" ] \
              || fail "a standby's region must differ from its primary's ({{ .Answers.primary_region }})"
            [ "$(eu "{{ .Answers.primary_region }}")" = "$gdpr" ] \
              || fail "primary_region {{ .Answers.primary_region }} and region {{ .Answers.region }} must both be EU (GDPR) or both not"
            # The US template's health check alarm notifies <primary code>-main-alarms
            # in us-east-1, where Route 53's alarms live (a CloudWatch alarm only
            # notifies a topic in its own region): only a us-east-1 primary has it.
            [ "$gdpr" = yes ] || [ "{{ .Answers.primary_region }}" = "us-east-1" ] \
              || fail "a non-EU standby's primary must be in us-east-1 (its health check alarm notifies the primary's topic there)"
            pmixin="$root/stacks/mixins/region/{{ .Answers.primary_region }}.yaml"
            [ -f "$pmixin" ] || fail "no region mixin $pmixin for primary_region"
            pcode="$(sed -n 's/^ *environment: *\([a-z0-9]*\) *$/\1/p' "$pmixin" | head -n 1)"
            [ "{{ .Answers.standby_of }}" = "{{ .Answers.tenant }}-$pcode-prod" ] \
              || fail "standby_of {{ .Answers.standby_of }} is not {{ .Answers.tenant }}-$pcode-prod ({{ .Answers.primary_region }})"
            pfile="$root/stacks/orgs/{{ .Answers.tenant }}/prod/{{ .Answers.primary_region }}.yaml"
            [ -f "$pfile" ] || fail "the primary {{ .Answers.standby_of }} ($pfile) does not exist"
            ! grep -q '^ *standby_of:' "$pfile" \
              || fail "the primary {{ .Answers.standby_of }} is itself a standby ($pfile)"
            # catalog/monitoring/main-standby reads critical_alerts[1]. Hook
            # templates have no sprig to count them, so the shell sees the
            # answer only through Go's urlquery: every character but
            # [A-Za-z0-9._~-] becomes %XX (a comma %2C), never shell syntax.
            case "{{ urlquery .Answers.critical_alerts }}" in
              *%2C*) ;;
              *) fail "a standby needs at least two critical_alerts (catalog/monitoring/main-standby reads the second)" ;;
            esac
          {{- end }}
          {{- if eq .Answers.profile "prod-primary" }}
          # Only rendered for a prod primary, so a field its `when` hides
          # never reaches the shell.
            [ "{{ .Answers.stage }}" = "prod" ] || fail "a prod primary is a prod stack (stage prod)"
            # The data plane runs in the prod account's primary only
            # (fnx-ue1-prod); the prod-eu account's EU primary has the core
            # subset (fnx-ew1-prod; owner decision B5). The other two
            # combinations have no reference stack.
            {{- if eq .Answers.data_plane "yes" }}
              [ "$gdpr" = no ] \
                || fail "data_plane=yes in the prod-eu account: the EU primary has no data plane (owner decision B5), answer no"
              # Its health check alarm notifies <region code>-main-alarms in
              # us-east-1, where Route 53's alarms live (a CloudWatch alarm only
              # notifies a topic in its own region): only a us-east-1 primary
              # owns that topic.
              [ "{{ .Answers.region }}" = "us-east-1" ] \
                || fail "a data-plane prod primary must be in us-east-1 (its health check alarm notifies its own topic there)"
              [ "{{ .Answers.vpc_cidr_services }}" != "{{ .Answers.vpc_cidr_main }}" ] \
                || fail "vpc_cidr_services and vpc_cidr_main must differ (network/vpc-peering joins them)"
            {{- else }}
              [ "$gdpr" = yes ] \
                || fail "data_plane=no in account $account: only the prod-eu account's EU primary has no data plane, answer yes"
            {{- end }}
            [ "{{ .Answers.dr_region }}" != "{{ .Answers.region }}" ] \
              || fail "dr_region must differ from region ({{ .Answers.region }}): it is the warm standby's"
            [ "$(eu "{{ .Answers.dr_region }}")" = "$gdpr" ] \
              || fail "dr_region {{ .Answers.dr_region }} and region {{ .Answers.region }} must both be EU (GDPR) or both not"
            drmixin="$root/stacks/mixins/region/{{ .Answers.dr_region }}.yaml"
            drcode="$(sed -n 's/^ *environment: *\([a-z0-9]*\) *$/\1/p' "$drmixin" 2>/dev/null | head -n 1)"
            [ "$drcode" = "{{ .Answers.dr_region_code }}" ] \
              || fail "dr_region_code {{ .Answers.dr_region_code }} is not $drmixin's environment (${drcode:-no such mixin})"
            # A prod primary creates its account's singletons (the GitHub OIDC
            # provider, the Auto Scaling service-linked role, the multi-region
            # trail, Config's global recording, the budget): one per account.
            # Its standbys (settings.dr.standby_of) create none.
            for other in "$root/stacks/orgs/{{ .Answers.tenant }}/prod"/*.yaml; do
              case "${other##*/}" in _defaults.yaml) continue ;; esac
              [ -e "$other" ] || continue
              # The value plain or quoted (account: prod, account: "prod").
              if grep -Eq "^ *account: *[\"']?$account[\"']? *\$" "$other" && ! grep -q '^ *standby_of:' "$other"; then
                fail "the $account account already has its prod primary (${other##*/}), which creates its singletons"
              fi
            done
          {{- end }}
          echo "scaffold stack: writing $stack_file"

    # The new stack resolves with the rest.
    verify:
      events:
        - after.scaffold.generate
      kind: step
      type: shell
      with:
        command: |
          set -eu
          root="$PWD"
          [ -d "$root/stacks/orgs/{{ .Answers.tenant }}/root" ] || root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          cd "$root"
          file="stacks/orgs/{{ .Answers.tenant }}/{{ .Answers.stage }}/{{ .Answers.region }}.yaml"
          # As in the wire hook: the stack must be the file just generated.
          [ -f "$file" ] || {
            echo "scaffold stack: not verifying: $root/$file does not exist, so the target is not the repository root ($root); generate from the root with: atmos scaffold generate stack . --force" >&2
            exit 1
          }
          # describe stacks -s <a stack that does not exist> prints {} and exits 0.
          if ! atmos validate stacks \
            || ! atmos describe stacks -s "{{ .Answers.tenant }}-{{ .Answers.region_code }}-{{ .Answers.stage }}" \
              --process-functions=false --format json \
              | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin) else 1)'; then
            echo "scaffold stack: the generated $file does not resolve; remove it, fix the answers and generate again" >&2
            exit 1
          fi
          echo "scaffold stack: {{ .Answers.tenant }}-{{ .Answers.region_code }}-{{ .Answers.stage }} resolves"

    # Owner decision C2 Q3: the stack's state pattern pair and CI role ARNs
    # on its stage's access roles in the backend owning its state
    # (stacks/orgs/<tenant>/root/us-east-1.yaml; eu-west-1.yaml for prod-eu),
    # which check-state-keys.py and check-ci-state-roles.py require. A second
    # run adds nothing. Every argument is a select or a field whose pattern
    # admits no shell metacharacter (tenant, account, region_code), and the
    # script validates them again. It prints the NS delegation step, which
    # needs the deployed zone and stays manual.
    # A target other than the root would get the stack while this wires the
    # root's backend: on 1.229 the guard runs in the invocation directory and
    # cannot see the target (no variable names it), so this refuses unless the
    # stack it wires is the file just generated, under the root it edits.
    wire:
      events:
        - after.scaffold.generate
      kind: step
      type: shell
      with:
        command: |
          set -eu
          root="$PWD"
          [ -d "$root/stacks/orgs/{{ .Answers.tenant }}/root" ] || root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          stack_file="$root/stacks/orgs/{{ .Answers.tenant }}/{{ .Answers.stage }}/{{ .Answers.region }}.yaml"
          [ -f "$stack_file" ] || {
            echo "scaffold stack: not wiring: $stack_file does not exist, so the target is not the repository root ($root); generate from the root with: atmos scaffold generate stack . --force" >&2
            exit 1
          }
          python3 "$root/scripts/stack-wiring.py" "{{ .Answers.tenant }}" "{{ .Answers.stage }}" \
            "{{ .Answers.account }}" "{{ .Answers.region }}" \
            "{{ .Answers.tenant }}-{{ .Answers.region_code }}-{{ .Answers.stage }}"

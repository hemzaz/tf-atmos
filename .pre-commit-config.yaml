# =============================================================================
# Pre-commit hooks: a fast local mirror of the CI gate
# =============================================================================
# The gate is CI (.github/workflows/terraform-ci.yml), which runs the Atmos
# workflows in workflows/lint.yaml. The commit-stage hooks below are the cheap,
# file-scoped part of it, with CI's own flags. The heavy parts (tflint over
# every component and stack, checkov over components/terraform) are
# manual-stage hooks that run the CI commands themselves:
#
#   pre-commit install                                  # once
#   pre-commit run --all-files                          # commit stage, every file
#   pre-commit run --hook-stage manual --all-files      # + the full lint gate and checkov
#
# Not here on purpose:
# - terraform_docs: component READMEs are purpose + wiring + gotchas, never
#   generated input/output tables (CLAUDE.md).
# - terraform_validate / terraform_tflint (per directory): the atmos-lint hook
#   runs the real tflint gate (instances with stack vars and every component
#   directory); validate-all runs in CI.
# - markdownlint, black, isort: CI enforces none of them.

repos:
  # File hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      # Helm chart templates are Go templates, not YAML.
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Atmos YAML functions (!terraform.state, ...) are custom tags
        exclude: '/charts/[^/]+/templates/'
      # policies/*.json are templatefile() templates (unquoted ${...}), not JSON.
      - id: check-json
        name: Check JSON syntax
        exclude: '^components/terraform/[^/]+/policies/'
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-executables-have-shebangs
        name: Check executables have shebangs

  # Same check as the lint gate's terraform-fmt step.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        name: Terraform format
        args:
          - --args=-recursive

  - repo: local
    hooks:
      # The lint gate's yamllint step: same config (relaxed), same paths.
      - id: yamllint
        name: YAML lint (as the CI gate)
        entry: yamllint -d relaxed
        language: python
        additional_dependencies: ['yamllint==1.38.0']
        files: ^(stacks/|workflows/|atmos\.yaml$)
        types: [yaml]
      - id: atmos-validate-stacks
        name: Atmos validate stacks
        entry: atmos validate stacks
        language: system
        pass_filenames: false
        files: ^(atmos\.yaml|stacks/)
      # checkov skips a file whose unary !x/-x ends a line before a leading
      # && / || (scripts/check-hcl-unary-newline.py has the details).
      - id: hcl-unary-newline
        name: HCL unary operand before a leading operator (checkov parse guard)
        entry: python3 scripts/check-hcl-unary-newline.py
        language: system
        files: \.tf$
      # Manual stage: the whole lint gate (fmt, yamllint, parse guard, tflint
      # over every stack instance and component directory), exactly as CI runs
      # it. Needs `atmos workflow tflint-init -f lint` once.
      - id: atmos-lint
        name: Atmos lint gate (as CI)
        entry: atmos workflow lint -f lint
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      # The CI gate's checkov run (workflows/lint.yaml security-scan), same pin
      # and flags over the whole components/terraform directory. No
      # --skip-check: CI skips nothing beyond the inline #checkov:skip
      # comments (there is no baseline). Manual stage only: a full directory scan on
      # every .tf commit is too heavy for a workstation, and CI runs it anyway.
      # Run it with `pre-commit run --hook-stage manual checkov`.
      - id: checkov
        name: Terraform security scan (Checkov, as the CI gate)
        entry: checkov
        language: python
        stages: [manual]
        additional_dependencies: ['checkov==3.3.21']
        pass_filenames: false
        files: ^components/terraform/.*\.tf$
        exclude: '/tests/'
        args:
          - --directory=components/terraform
          - --framework=terraform
          - --skip-path=/tests/
          - --quiet
          - --compact
          - --soft-fail-on=LOW,MEDIUM
          - --hard-fail-on=HIGH,CRITICAL

  # Secrets. .secrets.baseline records the audited false positives; refresh it
  # with `detect-secrets scan --baseline .secrets.baseline` and audit new entries.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(package-lock\.json|\.terraform\.lock\.hcl)$'

  # Python: correctness and security, not style.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: Flake8 linting
        args: ['--max-line-length=120', '--extend-ignore=E203,W503']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: Bandit security checks
        args: ['-ll', '--skip=B101,B601']

  # Shell scripts: errors only (warnings are style; actionlint shellchecks the
  # workflow run blocks in CI).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: Shellcheck
        args: ['--severity=error']

  # Conventional commit messages
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        name: Check commit message
        stages: [commit-msg]

default_language_version:
  python: python3

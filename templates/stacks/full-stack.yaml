---
# Full Stack Template
# Production-ready infrastructure: VPC, tiered security groups, EKS with
# add-ons, PostgreSQL on RDS, application secrets and monitoring.
#
# Usage: copy in as a lane beside a stage's own stack (settings.context.name;
# the stack name is <tenant>-<region code>-<stage>-<name>). Its names carry the
# lane (settings.prefix, <region code>-<name>), so it deploys in the same
# account and region:
#   cp templates/stacks/full-stack.yaml stacks/orgs/fnx/prod/us-east-1/platform.yaml
#   atmos validate stacks
#   atmos workflow plan -f plan-environment -s fnx-ue1-prod-platform
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.
# Environment-wide knobs live in settings.environment; components read them
# as {{ .settings.environment.<key> }}. Cross-component values use
# !terraform.state and deployment order comes from dependencies.components.

import:
  - orgs/fnx/prod/_defaults
  - mixins/region/us-east-1
  - catalog/_base/defaults
  - catalog/iam/defaults
  - catalog/kms/defaults
  - catalog/vpc/defaults
  - catalog/securitygroup/defaults
  - catalog/github-runners/defaults
  - catalog/eks/defaults
  - catalog/eks-addons/defaults
  - catalog/secretsmanager/defaults
  - catalog/monitoring/defaults
  - catalog/rds/prod
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/production

vars:
  tags:
    Template: "full-stack"

settings:
  context:
    name: platform
  environment:
    description: "Full production platform (EKS, RDS, monitoring)"
    vpc_cidr: "10.30.0.0/16"
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    rds_engine: "postgres"
    rds_engine_version: "16"
    rds_family: "postgres16"
    rds_instance_class: "db.r6g.large"
    log_retention_days: 30
    ops_email: "ops@example.com"
    # Route 53 zone external-dns and cert-manager may write to
    hosted_zone_id: "Z0123456789ABCDEFGHIJ"

components:
  terraform:
    # Core networking: one NAT gateway per AZ for high availability
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "{{ .settings.environment.vpc_cidr }}"
        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4
        public_subnets:
          - "10.30.1.0/24"
          - "10.30.2.0/24"
          - "10.30.3.0/24"
        private_subnets:
          - "10.30.10.0/24"
          - "10.30.20.0/24"
          - "10.30.30.0/24"
        database_subnets:
          - "10.30.100.0/24"
          - "10.30.101.0/24"
          - "10.30.102.0/24"
        nat_gateway_enabled: true
        nat_gateway_strategy: "one_per_az"
        vpc_flow_logs_enabled: true
        flow_logs_retention_days: 90

    # The platform's tiers, one securitygroup instance: each group admits the
    # one above it by key (source_security_group_id), so no tier reads
    # another's state before it exists (deploy-full-stack plans a layer before
    # applying it). The alb group has no ingress here: public traffic reaches
    # the platform only through CloudFront, and the ALB (the alb component,
    # catalog/alb/defaults) admits nothing but CloudFront's origin-facing
    # managed prefix list on 443 itself; this group, attached to it, is what
    # the nodes admit (as web-application's `alb` group).
    securitygroup/platform:
      metadata:
        component: securitygroup
        inherits:
          - securitygroup
      vars:
        security_groups:
          alb:
            description: "Attached to the platform ALB; the EKS nodes admit it"
          # Additional group for the EKS worker nodes (EKS creates the cluster
          # security group itself)
          eks-nodes:
            description: "EKS node group security group"
            ingress_rules:
              - key: "node-to-node"
                description: "Node to node communication"
                from_port: 0
                to_port: 65535
                protocol: "tcp"
                self: true
              - key: "from-alb"
                description: "Traffic from the load balancers"
                from_port: 1025
                to_port: 65535
                protocol: "tcp"
                source_security_group_id: "alb"
          # Database tier: PostgreSQL only from the EKS nodes
          rds:
            description: "RDS security group"
            ingress_rules:
              - key: "postgres-from-nodes"
                description: "PostgreSQL from EKS nodes"
                from_port: 5432
                to_port: 5432
                protocol: "tcp"
                source_security_group_id: "eks-nodes"
      dependencies:
        components:
          - component: vpc/main

    # The lane's own CI roles (<full id>-ci-plan/-apply): eks/main's access
    # entries read them, and CI deploys this lane with them. The GitHub OIDC
    # provider is an account singleton that fnx-ue1-prod's iam/ci creates,
    # so this instance trusts it by ARN instead of creating a second one. A
    # deployed lane also needs its state pattern pair and these role ARNs on
    # backend/main's access roles for its stage (stacks/orgs/fnx/core/us-east-1.yaml).
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: false
        github_oidc_provider_arn: "arn:aws:iam::{{ .settings.environment.account_id }}:oidc-provider/token.actions.githubusercontent.com"
        ci_role_name_prefix: "{{ .atmos_stack }}-ci"
        ci_apply_role_enabled: true
        ci_apply_role_trusted_github_repos:
          - "hemzaz/tf-atmos:master"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-prod-read-role"
        ci_backend_write_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-prod-role"
        ci_apply_kms_key_aliases:
          - "alias/{{ .settings.prefix }}-main"
        lambda_uploader_trusted_github_repos: []
        lambda_uploader_kms_key_alias: "alias/{{ .settings.prefix }}-main"
      dependencies:
        components:
          - component: backend/main
            stack: fnx-ue1-core
          - component: iam/ci
            stack: fnx-ue1-prod

    # The lane's own in-VPC CI runners (catalog/github-runners/defaults:
    # labelled with the full id, which eks-addons/main's CI jobs ask for):
    # the private cluster API is reachable only from inside this VPC, and
    # eks/main admits them on 443.
    github-runners/main:
      metadata:
        component: github-runners
        inherits:
          - github-runners/defaults
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
      dependencies:
        components:
          - component: kms/main
          - component: vpc/main

    # EKS cluster (private endpoint; subnet_ids come from eks/defaults)
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        name: main
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: "{{ .settings.environment.eks_public_access }}"
        # The in-VPC CI runners (above) reach the private endpoint on 443.
        allowed_security_group_ids:
          - !terraform.state github-runners/main .security_group_id
        associated_security_group_ids:
          - !terraform.state securitygroup/platform .security_group_ids.eks-nodes
        node_groups:
          general:
            instance_types: ["m6i.large", "m6i.xlarge"]
            capacity_type: "ON_DEMAND"
            min_group_size: 2
            max_group_size: 10
            desired_group_size: 3
      dependencies:
        components:
          - component: vpc/main
          - component: securitygroup/platform
          - component: kms/main
          - component: iam/ci
          - component: github-runners/main

    # EKS add-ons, wired to the cluster outputs
    eks-addons/main:
      metadata:
        component: eks-addons
        inherits:
          - eks-addons
      vars:
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/main .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/main .eks_cluster_identity_oidc_issuer
        clusters:
          main:
            enable_aws_load_balancer_controller: true
            vpc_id: !terraform.state vpc/main .vpc_id
            enable_cluster_autoscaler: true
            enable_external_dns: true
            dns_zone_ids:
              - "{{ .settings.environment.hosted_zone_id }}"
            enable_cert_manager: true
            cert_manager_letsencrypt_email: "{{ .settings.environment.ops_email }}"
            enable_metrics_server: true
            # CloudWatch agent + Fluent Bit; log groups on kms/main
            enable_container_insights: true
            container_insights_kms_key_arn: !terraform.state kms/main .key_arn
            container_insights_log_retention_days: "{{ .settings.environment.log_retention_days }}"
      dependencies:
        components:
          - component: eks/main
          - component: vpc/main
          - component: kms/main

    # PostgreSQL on RDS. The master password is managed by RDS in Secrets
    # Manager (output: password_secret_arn); no password lives in config.
    # Inherits multi_az/deletion_protection/monitoring from catalog/rds/prod
    # (stacks/catalog/rds/prod.yaml); backup_retention_period is overridden
    # below to 7 days for this smaller example environment instead of the
    # stage default of 30.
    rds/main:
      metadata:
        component: rds
        inherits:
          - rds/prod
      vars:
        # The tier the component's prod guards compare to; the name is
        # <Environment>-<identifier> (ue1-platform-main-db).
        environment: "{{ .settings.context.stage }}"
        identifier: "main-db"
        engine: "{{ .settings.environment.rds_engine }}"
        engine_version: "{{ .settings.environment.rds_engine_version }}"
        family: "{{ .settings.environment.rds_family }}"
        instance_class: "{{ .settings.environment.rds_instance_class }}"
        username: "app_admin"
        port: 5432
        db_name: "app"
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
        allowed_security_groups:
          - !terraform.state securitygroup/platform .security_group_ids.rds
        kms_key_id: !terraform.state kms/main .key_arn
        performance_insights_kms_key_id: !terraform.state kms/main .key_arn
        master_user_secret_kms_key_id: !terraform.state kms/main .key_arn
        allocated_storage: 100
        max_allocated_storage: 1000
        skip_final_snapshot: false
        backup_retention_period: 7
        backup_window: "03:00-04:00"
        maintenance_window: "sun:04:00-sun:05:00"
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
          - component: securitygroup/platform

    # The lane's own customer-managed key (EKS secrets, node EBS volumes,
    # Container Insights log groups). Its key policy names the Auto Scaling
    # service-linked role, an account singleton that fnx-ue1-prod's iam/main
    # provisions.
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Platform lane encryption key (EKS secrets, EBS, CloudWatch Logs)
        alias_name: "{{ .settings.prefix }}-main"
        deletion_window_in_days: 30  # prod keeps the full window
      dependencies:
        components:
          - component: iam/main
            stack: fnx-ue1-prod

    # Application secrets (random values generated by Terraform)
    secretsmanager/app:
      metadata:
        component: secretsmanager
        inherits:
          - secretsmanager/api

    # Dashboards and alarms for the platform
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        eks_cluster_name: !terraform.state eks/main .eks_cluster_id
        enable_rds_monitoring: true
        rds_instances:
          - !terraform.state rds/main .instance_id
        alarm_email_subscriptions:
          - "{{ .settings.environment.ops_email }}"
      dependencies:
        components:
          - component: vpc/main
          - component: eks/main
          - component: rds/main

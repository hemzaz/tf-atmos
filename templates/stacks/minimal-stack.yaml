---
# Minimal Stack Template
# Basic infrastructure: one VPC and tiered security groups.
#
# Usage: copy in as a lane beside a stage's own stack (settings.context.name;
# the stack name is <tenant>-<region code>-<stage>-<name>). Its names carry the
# lane (settings.prefix, <region code>-<name>), so it deploys in the same
# account and region:
#   cp templates/stacks/minimal-stack.yaml stacks/orgs/fnx/dev/us-east-1/minimal.yaml
#   atmos validate stacks
#   atmos terraform plan vpc/main -s fnx-ue1-dev-minimal
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.

import:
  - orgs/fnx/dev/_defaults
  - mixins/region/us-east-1
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/securitygroup/defaults
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/development

vars:
  tags:
    Template: "minimal-stack"

settings:
  context:
    name: minimal
  environment:
    description: "Minimal environment (VPC and security groups)"
    vpc_cidr: "10.10.0.0/16"

components:
  terraform:
    # Core networking. Other components read its outputs through
    # `!terraform.state vpc/main .<output>`; AZs come from vpc/defaults.
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "{{ .settings.environment.vpc_cidr }}"
        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4
        public_subnets:
          - "10.10.1.0/24"
          - "10.10.2.0/24"
          - "10.10.3.0/24"
        private_subnets:
          - "10.10.10.0/24"
          - "10.10.20.0/24"
          - "10.10.30.0/24"
        # A single NAT gateway keeps a minimal environment cheap
        nat_gateway_enabled: true
        nat_gateway_strategy: "single"

    # The three tiers, one securitygroup instance: each group admits the one
    # above it by key (source_security_group_id), so no tier reads another's
    # state before it exists (deploy-full-stack plans a layer before applying
    # it). Web is the group the load balancers carry. It has no ingress here:
    # public traffic arrives only through CloudFront, and the alb component
    # (catalog/alb/defaults) admits nothing but CloudFront's origin-facing
    # managed prefix list on 443 itself.
    securitygroup/tiers:
      metadata:
        component: securitygroup
        inherits:
          - securitygroup
      vars:
        security_groups:
          web:
            description: "Web tier: attached to the load balancers; the app tier admits it"
          app:
            description: "Application tier: only reachable from the web tier"
            ingress_rules:
              - key: "app-from-web"
                description: "App port from web tier"
                from_port: 8080
                to_port: 8080
                protocol: "tcp"
                source_security_group_id: "web"
          db:
            description: "Database tier: only reachable from the application tier"
            ingress_rules:
              - key: "postgres-from-app"
                description: "PostgreSQL from app tier"
                from_port: 5432
                to_port: 5432
                protocol: "tcp"
                source_security_group_id: "app"
      dependencies:
        components:
          - component: vpc/main

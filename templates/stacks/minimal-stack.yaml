---
# Minimal Stack Template
# Basic infrastructure: one VPC and tiered security groups.
#
# Usage: copy in as a lane beside a stage's own stack (settings.context.name;
# the stack name is <tenant>-<region code>-<stage>-<name>). Its names carry the
# lane (settings.prefix, <region code>-<name>), so it deploys in the same
# account and region:
#   cp templates/stacks/minimal-stack.yaml stacks/orgs/fnx/dev/us-east-1/minimal.yaml
#   atmos validate stacks
#   atmos terraform plan vpc/main -s fnx-ue1-dev-minimal
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.

import:
  - orgs/fnx/dev/_defaults
  - mixins/region/us-east-1
  - catalog/_base/defaults
  - catalog/iam/defaults
  - catalog/vpc/defaults
  - catalog/securitygroup/defaults
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/development

vars:
  tags:
    Template: "minimal-stack"

settings:
  context:
    name: minimal
  environment:
    description: "Minimal environment (VPC and security groups)"
    vpc_cidr: "10.10.0.0/16"

components:
  terraform:
    # The lane's own CI roles (<full id>-ci-plan/-apply): CI plans and deploys
    # this lane with them (terraform-ci.yml resolves them per stack). The
    # GitHub OIDC provider is an account singleton that fnx-ue1-dev's iam/ci
    # creates, so this instance trusts it by ARN instead of creating a second
    # one.
    # Deploying the lane needs one manual step: these roles' ARNs on
    # backend/main's access roles for its stage (stacks/orgs/fnx/core/us-east-1.yaml).
    # A state pattern pair of its own is optional: the stage stack's
    # "*/<stage stack>-*" pattern already covers the lane's state keys.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: false
        github_oidc_provider_arn: "arn:aws:iam::{{ .settings.environment.account_id }}:oidc-provider/token.actions.githubusercontent.com"
        ci_role_name_prefix: "{{ .atmos_stack }}-ci"
        ci_apply_role_enabled: true
        ci_apply_role_trusted_github_repos:
          - "hemzaz/tf-atmos:master"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-read-role"
        ci_backend_write_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-role"
        ci_apply_kms_key_aliases:
          - "alias/{{ .settings.prefix }}-main"
        lambda_uploader_trusted_github_repos: []
        lambda_uploader_kms_key_alias: "alias/{{ .settings.prefix }}-main"
      dependencies:
        components:
          - component: backend/main
            stack: fnx-ue1-core
          - component: iam/ci
            stack: fnx-ue1-dev

    # Core networking. Other components read its outputs through
    # `!terraform.state vpc/main .<output>`; AZs come from vpc/defaults.
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "{{ .settings.environment.vpc_cidr }}"
        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4
        public_subnets:
          - "10.10.1.0/24"
          - "10.10.2.0/24"
          - "10.10.3.0/24"
        private_subnets:
          - "10.10.10.0/24"
          - "10.10.20.0/24"
          - "10.10.30.0/24"
        # A single NAT gateway keeps a minimal environment cheap
        nat_gateway_enabled: true
        nat_gateway_strategy: "single"

    # The three tiers, one securitygroup instance: each group admits the one
    # above it by key (source_security_group_id), so no tier reads another's
    # state before it exists (deploy-full-stack plans a layer before applying
    # it). Web is the group for the load balancers a stack adds on top: it has
    # no ingress, and none may admit 0.0.0.0/0 - public traffic should arrive
    # through CloudFront, as an alb component instance (catalog/alb/defaults)
    # does by admitting only CloudFront's origin-facing prefix list on 443.
    securitygroup/tiers:
      metadata:
        component: securitygroup
        inherits:
          - securitygroup
      vars:
        security_groups:
          web:
            description: "Web tier: attached to the load balancers; the app tier admits it"
          app:
            description: "Application tier: only reachable from the web tier"
            ingress_rules:
              - key: "app-from-web"
                description: "App port from web tier"
                from_port: 8080
                to_port: 8080
                protocol: "tcp"
                source_security_group_id: "web"
          db:
            description: "Database tier: only reachable from the application tier"
            ingress_rules:
              - key: "postgres-from-app"
                description: "PostgreSQL from app tier"
                from_port: 5432
                to_port: 5432
                protocol: "tcp"
                source_security_group_id: "app"
      dependencies:
        components:
          - component: vpc/main

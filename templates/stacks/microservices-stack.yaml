---
# Microservices Stack Template
# Container platform for microservices: VPC, EKS with general and
# compute-optimized node groups, service mesh add-ons, an HTTP API Gateway
# with JWT auth, and monitoring.
#
# Usage: copy into an account/region directory as a top-level stack and set
# settings.context.environment (the stack name is <tenant>-<stage>-<environment>):
#   cp templates/stacks/microservices-stack.yaml stacks/orgs/fnx/dev/eu-west-2/micro-01.yaml
#   atmos validate stacks
#   atmos workflow plan -f plan-environment -s fnx-dev-micro-01
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.

import:
  - orgs/fnx/dev/_defaults
  - mixins/region/eu-west-2
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/securitygroup/defaults
  - catalog/eks/defaults
  - catalog/eks-addons/defaults
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/development

vars:
  tags:
    Template: "microservices-stack"

settings:
  context:
    environment: micro-01
  environment:
    description: "Microservices platform (EKS, service mesh, API Gateway)"
    vpc_cidr: "10.40.0.0/16"
    eks_kubernetes_version: "1.33"
    eks_public_access: false
    ops_email: "ops@example.com"
    # Cognito user pool that issues the API's JWTs
    jwt_issuer: "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_EXAMPLE"

components:
  terraform:
    # Container-optimized VPC: NAT per AZ for high-bandwidth image pulls
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        vpc_cidr: "{{ .settings.environment.vpc_cidr }}"
        public_subnets:
          - "10.40.1.0/24"
          - "10.40.2.0/24"
          - "10.40.3.0/24"
        # Large private subnets leave room for VPC CNI prefix delegation
        private_subnets:
          - "10.40.32.0/19"
          - "10.40.64.0/19"
          - "10.40.96.0/19"
        enable_nat_gateway: true
        nat_gateway_strategy: "one_per_az"

    # Additional security group for the worker nodes
    securitygroup/eks-nodes:
      metadata:
        component: securitygroup
        inherits:
          - securitygroup
      vars:
        security_groups:
          eks-nodes:
            description: "EKS worker nodes"
            ingress_rules:
              - description: "All TCP between nodes"
                from_port: 0
                to_port: 65535
                protocol: "tcp"
                self: true
              - description: "Istio sidecar telemetry"
                from_port: 15090
                to_port: 15090
                protocol: "tcp"
                self: true

    # EKS cluster with general and compute-optimized node groups
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        clusters:
          main:
            kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
            endpoint_private_access: true
            endpoint_public_access: "{{ .settings.environment.eks_public_access }}"
            security_group_ids:
              - !terraform.state securitygroup/eks-nodes .security_group_ids.eks-nodes
            node_groups:
              general:
                enabled: true
                instance_types: ["m6i.large"]
                min_size: 3
                max_size: 20
                desired_size: 6
                labels:
                  workload-type: "general"
              # Compute-optimized nodes for CPU-intensive services (scaled from zero)
              compute:
                enabled: true
                instance_types: ["c6i.xlarge"]
                min_size: 0
                max_size: 10
                desired_size: 0
                labels:
                  workload-type: "compute"
                taints:
                  - key: "workload-type"
                    value: "compute"
                    effect: "NO_SCHEDULE"
      dependencies:
        components:
          - component: vpc/main
          - component: securitygroup/eks-nodes

    # Service mesh, autoscaling and ingress add-ons
    eks-addons/main:
      metadata:
        component: eks-addons
        inherits:
          - eks-addons
      vars:
        istio_enabled: true
        istio_enable_tracing: true
        jaeger_enabled: true
        kiali_enabled: true
        clusters:
          main:
            cluster_name: !terraform.state eks/main .cluster_ids.main
            kubernetes_host: !terraform.state eks/main .cluster_endpoints.main
            cluster_ca_certificate: !terraform.state eks/main .cluster_ca_data.main
            oidc_provider_arn: !terraform.state eks/main .oidc_provider_arns.main
            oidc_provider_url: !terraform.state eks/main .oidc_provider_arns.main | split("oidc-provider/") | .[1]
            enable_aws_load_balancer_controller: true
            enable_cluster_autoscaler: false
            enable_karpenter: true
            enable_istio: true
            enable_external_dns: true
            enable_cert_manager: true
            cert_manager_letsencrypt_email: "{{ .settings.environment.ops_email }}"
            enable_metrics_server: true
            enable_external_secrets: true
      dependencies:
        components:
          - component: eks/main

    # HTTP API with JWT authorization and CORS (catalog: apigateway_http).
    # Routes to in-cluster services need a VPC link to the internal ingress
    # load balancer, which the apigateway component does not manage yet.
    apigateway/main:
      metadata:
        component: apigateway
        inherits:
          - apigateway_http
      vars:
        api_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
        description: "Microservices API for {{ .settings.context.environment }}"
        jwt_issuer: "{{ .settings.environment.jwt_issuer }}"
        jwt_audience:
          - "example-app-client-id" # Cognito app client ID
        cors_configuration:
          allow_origins: ["https://app.example.com"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers: ["content-type", "x-amz-date", "authorization"]
          expose_headers: []
          max_age: 300
          allow_credentials: false

    # Cluster and API monitoring
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        eks_cluster_name: !terraform.state eks/main .cluster_ids.main
        eks_pod_cpu_threshold: 80
        eks_pod_memory_threshold: 85
        api_gateway_name: "{{ .settings.context.tenant }}-{{ .settings.context.environment }}-api"
        api_gateway_latency_threshold: 1000
        alarm_email_subscriptions:
          - "{{ .settings.environment.ops_email }}"
      dependencies:
        components:
          - component: vpc/main
          - component: eks/main
          - component: apigateway/main

---
# Microservices Stack Template
# Container platform for microservices: VPC, EKS with general and
# compute-optimized node groups, service mesh add-ons, an HTTP API Gateway
# with JWT auth, and monitoring.
#
# Usage: copy in as a lane beside a stage's own stack (settings.context.name;
# the stack name is <tenant>-<region code>-<stage>-<name>). Its names carry the
# lane (settings.prefix, <region code>-<name>), so it deploys in the same
# account and region:
#   cp templates/stacks/microservices-stack.yaml stacks/orgs/fnx/dev/us-east-1/micro.yaml
#   atmos validate stacks
#   atmos workflow plan -f plan-environment -s fnx-ue1-dev-micro
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.

import:
  - orgs/fnx/dev/_defaults
  - mixins/region/us-east-1
  - catalog/_base/defaults
  - catalog/vpc/defaults
  - catalog/iam/defaults
  - catalog/kms/defaults
  - catalog/github-runners/defaults
  - catalog/eks/defaults
  - catalog/eks-addons/defaults
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/development

vars:
  tags:
    Template: "microservices-stack"

settings:
  context:
    name: micro
  environment:
    description: "Microservices platform (EKS, service mesh, API Gateway)"
    vpc_cidr: "10.40.0.0/16"
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    ops_email: "ops@example.com"
    # Route 53 zone external-dns and cert-manager may write to
    hosted_zone_id: "Z0123456789ABCDEFGHIJ"
    # Cognito user pool that issues the API's JWTs
    jwt_issuer: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EXAMPLE"

components:
  terraform:
    # Container-optimized VPC: NAT per AZ for high-bandwidth image pulls
    vpc/main:
      metadata:
        component: vpc
        inherits:
          - vpc/defaults
      vars:
        ipv4_primary_cidr_block: "{{ .settings.environment.vpc_cidr }}"
        availability_zone_ids:  # us-east-1 AZ IDs; see components/terraform/vpc/README.md
          - use1-az1
          - use1-az2
          - use1-az4
        public_subnets:
          - "10.40.1.0/24"
          - "10.40.2.0/24"
          - "10.40.3.0/24"
        # Large private subnets leave room for VPC CNI prefix delegation
        private_subnets:
          - "10.40.32.0/19"
          - "10.40.64.0/19"
          - "10.40.96.0/19"
        nat_gateway_enabled: true
        nat_gateway_strategy: "one_per_az"

    # The lane's own CI roles (<full id>-ci-plan/-apply): eks/main's access
    # entries read them, and CI deploys this lane with them. The GitHub OIDC
    # provider is an account singleton that fnx-ue1-dev's iam/ci creates,
    # so this instance trusts it by ARN instead of creating a second one.
    # Deploying the lane needs one manual step: these roles' ARNs on
    # backend/main's access roles for its stage (stacks/orgs/fnx/root/us-east-1.yaml).
    # A state pattern pair of its own is optional: the stage stack's
    # "*/<stage stack>-*" pattern already covers the lane's state keys.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: false
        github_oidc_provider_arn: "arn:aws:iam::{{ .settings.environment.account_id }}:oidc-provider/token.actions.githubusercontent.com"
        ci_role_name_prefix: "{{ .atmos_stack }}-ci"
        # This stack's runner pools (github-runners' <Environment>-<name>):
        # only the apply role may execute their +1 start policies, nothing else
        # (iam ci-runner-pools.tf; check-cluster-api-ci.py checks the list).
        ci_runner_pool_names:
          - "{{ .settings.prefix }}-github-runners"
        ci_apply_role_enabled: true
        ci_apply_role_trusted_github_repos:
          - "hemzaz/tf-atmos:master"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-read-role"
        ci_backend_write_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-role"
        ci_apply_kms_key_aliases:
          - "alias/{{ .settings.prefix }}-main"
        lambda_uploader_trusted_github_repos: []
        lambda_uploader_kms_key_alias: "alias/{{ .settings.prefix }}-main"
      dependencies:
        components:
          - component: backend/main
            stack: fnx-ue1-root
          - component: iam/ci
            stack: fnx-ue1-dev

    # The lane's own customer-managed key (EKS secrets, node EBS volumes). Its
    # key policy names the Auto Scaling service-linked role, an account
    # singleton that fnx-ue1-dev's iam/dev provisions.
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: Microservices lane encryption key (EKS secrets, EBS)
        alias_name: "{{ .settings.prefix }}-main"  # without the alias/ prefix
        deletion_window_in_days: 7
      dependencies:
        components:
          - component: iam/dev
            stack: fnx-ue1-dev

    # The lane's own in-VPC CI runners (catalog/github-runners/defaults:
    # labelled with the full id, which eks-addons/main's CI jobs ask for):
    # the private cluster API is reachable only from inside this VPC, and
    # eks/main admits them on 443.
    github-runners/main:
      metadata:
        component: github-runners
        inherits:
          - github-runners/defaults
      vars:
        vpc_id: !terraform.state vpc/main .vpc_id
        subnet_ids: !terraform.state vpc/main .private_subnet_ids
      dependencies:
        components:
          - component: kms/main
          - component: vpc/main

    # EKS cluster with general and compute-optimized node groups
    eks/main:
      metadata:
        component: eks
        inherits:
          - eks/defaults
      vars:
        name: main
        cluster_kubernetes_version: "{{ .settings.environment.eks_kubernetes_version }}"
        cluster_endpoint_private_access: true
        cluster_endpoint_public_access: "{{ .settings.environment.eks_public_access }}"
        # The in-VPC CI runners (above) reach the private endpoint on 443.
        allowed_security_group_ids:
          - !terraform.state github-runners/main .security_group_id
        node_groups:
          general:
            instance_types: ["m6i.large"]
            min_group_size: 3
            max_group_size: 20
            desired_group_size: 6
            kubernetes_labels:
              workload-type: "general"
          # Compute-optimized nodes for CPU-intensive services (scaled from zero)
          compute:
            instance_types: ["c6i.xlarge"]
            min_group_size: 0
            max_group_size: 10
            desired_group_size: 0
            kubernetes_labels:
              workload-type: "compute"
            kubernetes_taints:
              - key: "workload-type"
                value: "compute"
                effect: "NO_SCHEDULE"
      dependencies:
        components:
          - component: vpc/main
          - component: kms/main
          - component: iam/ci
          - component: github-runners/main

    # Service mesh, autoscaling and ingress add-ons
    eks-addons/main:
      metadata:
        component: eks-addons
        inherits:
          - eks-addons
      vars:
        cluster_name: !terraform.state eks/main .eks_cluster_id
        host: !terraform.state eks/main .eks_cluster_endpoint
        cluster_ca_certificate: !terraform.state eks/main .eks_cluster_certificate_authority_data
        oidc_provider_arn: !terraform.state eks/main .eks_cluster_identity_oidc_issuer_arn
        oidc_provider_url: !terraform.state eks/main .eks_cluster_identity_oidc_issuer
        clusters:
          main:
            enable_aws_load_balancer_controller: true
            vpc_id: !terraform.state vpc/main .vpc_id
            # Karpenter has no switch; install it through helm_releases to
            # replace the cluster autoscaler.
            enable_cluster_autoscaler: true
            enable_external_dns: true
            dns_zone_ids:
              - "{{ .settings.environment.hosted_zone_id }}"
            enable_cert_manager: true
            cert_manager_letsencrypt_email: "{{ .settings.environment.ops_email }}"
            enable_metrics_server: true
      dependencies:
        components:
          - component: eks/main
          - component: vpc/main

    # HTTP API with JWT authorization and CORS (catalog: apigateway_http).
    # Routes to in-cluster services need a VPC link to the internal ingress
    # load balancer, which the apigateway component does not manage yet.
    apigateway/main:
      metadata:
        component: apigateway
        inherits:
          - apigateway_http
      vars:
        api_name: "{{ .settings.context.tenant }}-{{ .settings.prefix }}-api"
        description: "Microservices API for {{ .settings.prefix }}"
        jwt_issuer: "{{ .settings.environment.jwt_issuer }}"
        jwt_audience:
          - "example-app-client-id" # Cognito app client ID
        cors_configuration:
          allow_origins: ["https://app.example.com"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers: ["content-type", "x-amz-date", "authorization"]
          expose_headers: []
          max_age: 300
          allow_credentials: false

    # Cluster and API monitoring
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        eks_cluster_name: !terraform.state eks/main .eks_cluster_id
        eks_pod_cpu_threshold: 80
        eks_pod_memory_threshold: 85
        api_gateway_name: "{{ .settings.context.tenant }}-{{ .settings.prefix }}-api"
        api_gateway_latency_threshold: 1000
        alarm_email_subscriptions:
          - "{{ .settings.environment.ops_email }}"
      dependencies:
        components:
          - component: vpc/main
          - component: eks/main
          - component: apigateway/main

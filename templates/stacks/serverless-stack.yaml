---
# Serverless Stack Template
# Event-driven serverless application: Lambda functions behind an HTTP API
# Gateway, with DynamoDB, EventBridge, Step Functions, SNS and SQS.
#
# Usage: copy into an account/region directory as a top-level stack and set
# settings.context.environment (the stack name is <tenant>-<stage>-<environment>):
#   cp templates/stacks/serverless-stack.yaml stacks/orgs/fnx/dev/eu-west-2/serverless-01.yaml
#   atmos validate stacks
#   atmos workflow plan -f plan-environment -s fnx-dev-serverless-01
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.
#
# Components without a root module in components/terraform (dynamodb,
# eventbridge, stepfunctions, sns, sqs) are declared with
# `metadata.enabled: false` so the stack shape is complete; enable each one
# once its root module exists. Enabled components never read their state.
# Resource names follow <tenant>-<account>-<environment>-<name>.

import:
  - orgs/fnx/dev/_defaults
  - mixins/region/eu-west-2
  - catalog/_base/defaults
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/development

vars:
  tags:
    Template: "serverless-stack"

settings:
  context:
    environment: serverless-01
  environment:
    description: "Serverless platform (Lambda, API Gateway, DynamoDB)"
    # Bucket holding the Lambda deployment packages (<function>.zip)
    artifacts_bucket: "fnx-dev-lambda-artifacts"
    lambda_runtime: "python3.13"
    log_retention_days: 14
    ops_email: "ops@example.com"
    # Cognito user pool that issues the API's JWTs
    jwt_issuer: "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_EXAMPLE"

components:
  terraform:
    # Shared Lambda settings; each function below inherits them
    lambda/defaults:
      metadata:
        component: lambda
        type: abstract
      vars:
        runtime: "{{ .settings.environment.lambda_runtime }}"
        architectures: ["arm64"]
        s3_bucket: "{{ .settings.environment.artifacts_bucket }}"
        timeout: 30
        memory_size: 512
        tracing_mode: "Active"
        log_retention_days: "{{ .settings.environment.log_retention_days }}"
        environment_variables:
          STAGE: "{{ .settings.context.environment }}"
          USERS_TABLE: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-users"
          ORDERS_TABLE: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-orders"
        # Read/write access to the application tables
        custom_policy: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:DeleteItem",
                  "dynamodb:Query"
                ],
                "Resource": [
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-users",
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-users/index/*",
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-orders",
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-orders/index/*"
                ]
              }
            ]
          }

    # HTTP API in front of the functions (catalog: apigateway_http)
    apigateway/main:
      metadata:
        component: apigateway
        inherits:
          - apigateway_http
      vars:
        api_name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-api"
        description: "Serverless API for {{ .settings.context.environment }}"
        jwt_issuer: "{{ .settings.environment.jwt_issuer }}"
        jwt_audience:
          - "example-app-client-id" # Cognito app client ID
        throttling_burst_limit: 2000
        throttling_rate_limit: 1000
        cors_configuration:
          allow_origins: ["https://app.example.com"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers: ["content-type", "x-amz-date", "authorization", "x-api-key"]
          expose_headers: []
          max_age: 86400
          allow_credentials: false

    # API handler, invoked by the HTTP API
    lambda/users-api:
      metadata:
        component: lambda
        inherits:
          - lambda/defaults
      vars:
        function_name: "users-api" # deployed as <environment>-users-api
        handler: "handlers.users.handler"
        s3_key: "users-api.zip"
        api_gateway_source_arn: !terraform.state 'apigateway/main .http_api_execution_arn + "/*/*"'
      dependencies:
        components:
          - component: apigateway/main

    # Background processor, triggered by EventBridge "Order Created" events
    lambda/order-processor:
      metadata:
        component: lambda
        inherits:
          - lambda/defaults
      vars:
        function_name: "order-processor" # deployed as <environment>-order-processor
        handler: "processors.orders.handler"
        s3_key: "order-processor.zip"
        timeout: 300
        memory_size: 1024

    # Scheduled report generation (daily at 06:00 UTC)
    lambda/daily-reports:
      metadata:
        component: lambda
        inherits:
          - lambda/defaults
      vars:
        function_name: "daily-reports" # deployed as <environment>-daily-reports
        handler: "reports.daily.handler"
        s3_key: "daily-reports.zip"
        timeout: 600
        memory_size: 2048
        schedule_expression: "cron(0 6 * * ? *)"
        schedule_enabled: true

    # Application tables
    dynamodb/main:
      metadata:
        component: dynamodb
        enabled: false # no components/terraform/dynamodb root module yet
      vars:
        tables:
          users:
            name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-users"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "user_id"
            attributes:
              user_id: "S"
              email: "S"
            global_secondary_indexes:
              email-index:
                hash_key: "email"
                projection_type: "ALL"
            point_in_time_recovery_enabled: true
          orders:
            name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-orders"
            billing_mode: "PAY_PER_REQUEST"
            hash_key: "order_id"
            range_key: "created_at"
            attributes:
              order_id: "S"
              user_id: "S"
              created_at: "S"
            global_secondary_indexes:
              user-orders-index:
                hash_key: "user_id"
                range_key: "created_at"
                projection_type: "ALL"
            stream_view_type: "NEW_AND_OLD_IMAGES"
            point_in_time_recovery_enabled: true

    # Notifications topic and dead-letter queue
    sns/notifications:
      metadata:
        component: sns
        enabled: false # no components/terraform/sns root module yet
      vars:
        name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-notifications"
        subscriptions:
          ops:
            protocol: "email"
            endpoint: "{{ .settings.environment.ops_email }}"

    sqs/dlq:
      metadata:
        component: sqs
        enabled: false # no components/terraform/sqs root module yet
      vars:
        name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-dlq"
        message_retention_seconds: 1209600

    # Event bus and routing rules
    eventbridge/main:
      metadata:
        component: eventbridge
        enabled: false # no components/terraform/eventbridge root module yet
      vars:
        event_bus_name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-bus"
        rules:
          order-created:
            description: "Route order creation events"
            event_pattern:
              source: ["myapp.orders"]
              detail-type: ["Order Created"]
            targets:
              order-processor:
                arn: !terraform.state lambda/order-processor .function_arn
                dead_letter_arn: !terraform.state sqs/dlq .queue_arn
          user-registered:
            description: "Route user registration events"
            event_pattern:
              source: ["myapp.users"]
              detail-type: ["User Registered"]
            targets:
              notifications:
                arn: !terraform.state sns/notifications .topic_arn
      dependencies:
        components:
          - component: lambda/order-processor
          - component: sns/notifications
          - component: sqs/dlq

    # Order fulfilment workflow; the state machine definition is a map the
    # component should jsonencode, so function ARNs come straight from state.
    stepfunctions/order-fulfilment:
      metadata:
        component: stepfunctions
        enabled: false # no components/terraform/stepfunctions root module yet
      vars:
        name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-order-fulfilment"
        definition:
          Comment: "Order fulfilment workflow"
          StartAt: "ProcessOrder"
          States:
            ProcessOrder:
              Type: "Task"
              Resource: !terraform.state lambda/order-processor .function_arn
              Next: "NotifyCustomer"
            NotifyCustomer:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state sns/notifications .topic_arn
                Message.$: "$.confirmation"
              End: true
      dependencies:
        components:
          - component: lambda/order-processor
          - component: sns/notifications

    # Serverless dashboards and alarms
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        lambda_functions:
          - "{{ .settings.context.environment }}-users-api"
          - "{{ .settings.context.environment }}-order-processor"
          - "{{ .settings.context.environment }}-daily-reports"
        lambda_duration_monitoring: true
        lambda_duration_threshold: 10000
        lambda_throttle_monitoring: true
        api_gateway_name: "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-api"
        api_gateway_latency_threshold: 2000
        enable_dynamodb_monitoring: true
        dynamodb_tables:
          - "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-users"
          - "{{ .settings.context.tenant }}-{{ .settings.environment.account }}-{{ .settings.context.environment }}-orders"
        alarm_email_subscriptions:
          - "{{ .settings.environment.ops_email }}"
      dependencies:
        components:
          - component: apigateway/main
          - component: lambda/users-api
          - component: lambda/order-processor
          - component: lambda/daily-reports

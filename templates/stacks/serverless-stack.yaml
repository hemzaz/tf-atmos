---
# Serverless Stack Template
# Event-driven serverless application: Lambda functions behind an HTTP API
# Gateway, with DynamoDB, EventBridge, Step Functions, SNS and SQS.
#
# Usage: copy in as a lane beside a stage's own stack (settings.context.name;
# the stack name is <tenant>-<region code>-<stage>-<name>). Its names carry the
# lane (settings.prefix, <region code>-<name>), so it deploys in the same
# account and region:
#   cp templates/stacks/serverless-stack.yaml stacks/orgs/fnx/dev/us-east-1/serverless.yaml
#   atmos validate stacks
#   atmos workflow plan -f plan-environment -s fnx-ue1-dev-serverless
# To target another account or region, change the `orgs/fnx/<stage>/_defaults`
# (org and account defaults) and `mixins/region/<region>` imports.
#
# dynamodb, eventbridge, stepfunctions, sns and sqs all have root modules now
# (one table/rule/machine/topic/queue per instance, the Cloud Posse model for
# each), so every component below is enabled.
# Resource names follow the full id (the stack name) for the older, full-name
# components (apigateway, lambda) and <Environment>-<name> (settings.prefix)
# for the newer short-name ones (dynamodb, sns, sqs, eventbridge, stepfunctions).

import:
  - orgs/fnx/dev/_defaults
  - mixins/region/us-east-1
  - catalog/_base/defaults
  - catalog/iam/defaults
  - catalog/apigateway/defaults
  - catalog/monitoring/defaults
  - catalog/kms/defaults
  - catalog/dynamodb/defaults
  - catalog/sns/defaults
  - catalog/sqs/defaults
  - catalog/eventbridge/defaults
  - catalog/stepfunctions/defaults
  # s3/lambda-artifacts: the bucket holding the Lambda packages (<function>.zip)
  - catalog/s3/lambda-artifacts
  # Optional environment profile from templates/configs (import it last):
  # - mixins/profiles/development

vars:
  tags:
    Template: "serverless-stack"

settings:
  context:
    name: serverless
  environment:
    description: "Serverless platform (Lambda, API Gateway, DynamoDB)"
    lambda_runtime: "python3.13"
    log_retention_days: 14
    ops_email: "ops@example.com"
    # Cognito user pool that issues the API's JWTs
    jwt_issuer: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EXAMPLE"

components:
  terraform:
    # The lane's own CI roles (<full id>-ci-plan/-apply): CI plans and deploys
    # this lane with them (terraform-ci.yml resolves them per stack). The
    # GitHub OIDC provider is an account singleton that fnx-ue1-dev's iam/ci
    # creates, so this instance trusts it by ARN instead of creating a second
    # one.
    # Deploying the lane needs one manual step: these roles' ARNs on
    # backend/main's access roles for its stage (stacks/orgs/fnx/root/us-east-1.yaml).
    # A state pattern pair of its own is optional: the stage stack's
    # "*/<stage stack>-*" pattern already covers the lane's state keys.
    iam/ci:
      metadata:
        component: iam
        inherits:
          - iam
      vars:
        create_cross_account_role: false
        github_oidc_enabled: true
        github_oidc_repository: "hemzaz/tf-atmos"
        github_oidc_default_branch: "master"
        github_oidc_create_provider: false
        github_oidc_provider_arn: "arn:aws:iam::{{ .settings.environment.account_id }}:oidc-provider/token.actions.githubusercontent.com"
        ci_role_name_prefix: "{{ .atmos_stack }}-ci"
        ci_apply_role_enabled: true
        ci_apply_role_trusted_github_repos:
          - "hemzaz/tf-atmos:master"
        ci_apply_policy_arns:
          - "arn:aws:iam::aws:policy/AdministratorAccess"
        ci_backend_read_role_arns:
          - "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-read-role"
        ci_backend_write_role_arn: "arn:aws:iam::{{ .settings.environment.management_account_id }}:role/{{ .settings.context.tenant }}-terraform-backend-role"
        ci_apply_kms_key_aliases:
          - "alias/{{ .settings.prefix }}-main"
        lambda_uploader_trusted_github_repos: []
        lambda_uploader_kms_key_alias: "alias/{{ .settings.prefix }}-main"
      dependencies:
        components:
          - component: backend/main
            stack: fnx-ue1-root
          - component: iam/ci
            stack: fnx-ue1-dev

    # Customer managed key for the serverless components below (dynamodb, sns,
    # sqs, eventbridge, stepfunctions) and their log groups. This is a
    # top-level stack of its own (not nested under an existing environment's
    # components/), so unlike a component that only inherits catalog/kms/defaults,
    # it needs its own concrete kms/main instance, as every stage stack in this
    # repo (fnx-ue1-dev, fnx-ue1-staging, fnx-ue1-prod) does.
    kms/main:
      metadata:
        component: kms
        inherits:
          - kms/defaults
      vars:
        description: "{{ .settings.prefix }} serverless components key (DynamoDB, SNS, SQS, EventBridge, Step Functions)"
        alias_name: "{{ .settings.prefix }}-main" # without the alias/ prefix
        # No EKS or Auto Scaling here, and no iam instance provisioning the
        # Auto Scaling service-linked role this grant names (as the sandbox lane).
        allow_autoscaling_ebs: false
        deletion_window_in_days: 7

    # Shared Lambda settings; each function below inherits them
    lambda/defaults:
      metadata:
        component: lambda
        type: abstract
      vars:
        runtime: "{{ .settings.environment.lambda_runtime }}"
        architectures: ["arm64"]
        # The functions' packages; nothing here uploads them, so each s3_key
        # must exist in this bucket before the first apply.
        s3_bucket: !terraform.state s3/lambda-artifacts .bucket_id
        timeout: 30
        memory_size: 512
        tracing_mode: "Active"
        log_retention_days: "{{ .settings.environment.log_retention_days }}"
        environment_variables:
          STAGE: "{{ .settings.context.stage }}"
          # dynamodb names its tables <Environment>-<name> (settings.prefix);
          # this must match dynamodb/users and dynamodb/orders below.
          USERS_TABLE: "{{ .settings.prefix }}-users"
          ORDERS_TABLE: "{{ .settings.prefix }}-orders"
        # Read/write access to the application tables
        custom_policy: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:GetItem",
                  "dynamodb:PutItem",
                  "dynamodb:UpdateItem",
                  "dynamodb:DeleteItem",
                  "dynamodb:Query"
                ],
                "Resource": [
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.prefix }}-users",
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.prefix }}-users/index/*",
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.prefix }}-orders",
                  "arn:aws:dynamodb:{{ .vars.region }}:{{ .settings.environment.account_id }}:table/{{ .settings.prefix }}-orders/index/*"
                ]
              }
            ]
          }
      dependencies:
        components:
          - component: s3/lambda-artifacts

    # HTTP API in front of the functions (catalog: apigateway_http)
    apigateway/main:
      metadata:
        component: apigateway
        inherits:
          - apigateway_http
      vars:
        api_name: "{{ .atmos_stack }}-api"
        description: "Serverless API for {{ .settings.prefix }}"
        jwt_issuer: "{{ .settings.environment.jwt_issuer }}"
        jwt_audience:
          - "example-app-client-id" # Cognito app client ID
        throttling_burst_limit: 2000
        throttling_rate_limit: 1000
        cors_configuration:
          allow_origins: ["https://app.example.com"]
          allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          allow_headers: ["content-type", "x-amz-date", "authorization", "x-api-key"]
          expose_headers: []
          max_age: 86400
          allow_credentials: false
        # The API reads its handler, not the reverse: lambda (compute layer)
        # deploys before apigateway (services), and this component grants the
        # invoke permission itself (aws_lambda_permission.http_route_invoke).
        http_routes:
          "ANY /users/{proxy+}":
            integration_type: "AWS_PROXY"
            integration_uri: !terraform.state lambda/users-api .function_invoke_arn
            lambda_function_name: !terraform.state lambda/users-api .function_name
            authorization_type: "JWT"
      dependencies:
        components:
          - component: lambda/users-api

    # API handler, invoked by the HTTP API
    lambda/users-api:
      metadata:
        component: lambda
        inherits:
          - lambda/defaults
      vars:
        function_name: "users-api" # deployed as <environment>-users-api
        handler: "handlers.users.handler"
        s3_key: "users-api.zip"

    # Background processor, triggered by EventBridge "Order Created" events
    lambda/order-processor:
      metadata:
        component: lambda
        inherits:
          - lambda/defaults
      vars:
        function_name: "order-processor" # deployed as <environment>-order-processor
        handler: "processors.orders.handler"
        s3_key: "order-processor.zip"
        timeout: 300
        memory_size: 1024

    # Scheduled report generation (daily at 06:00 UTC)
    lambda/daily-reports:
      metadata:
        component: lambda
        inherits:
          - lambda/defaults
      vars:
        function_name: "daily-reports" # deployed as <environment>-daily-reports
        handler: "reports.daily.handler"
        s3_key: "daily-reports.zip"
        timeout: 600
        memory_size: 2048
        schedule_expression: "cron(0 6 * * ? *)"
        schedule_enabled: true

    # Application tables (dynamodb is one table per instance: the Cloud Posse
    # aws-dynamodb model). Named <Environment>-users / <Environment>-orders,
    # matching lambda/defaults' USERS_TABLE/ORDERS_TABLE and custom_policy above.
    dynamodb/users:
      metadata:
        component: dynamodb
        inherits:
          - dynamodb/defaults
      vars:
        name: "users"
        hash_key: "user_id"
        dynamodb_attributes:
          - name: "email"
            type: "S"
        global_secondary_index_map:
          - name: "email-index"
            hash_key: "email"
            projection_type: "ALL"

    dynamodb/orders:
      metadata:
        component: dynamodb
        inherits:
          - dynamodb/defaults
      vars:
        name: "orders"
        hash_key: "order_id"
        range_key: "created_at"
        dynamodb_attributes:
          - name: "user_id"
            type: "S"
        global_secondary_index_map:
          - name: "user-orders-index"
            hash_key: "user_id"
            range_key: "created_at"
            projection_type: "ALL"
        streams_enabled: true
        stream_view_type: "NEW_AND_OLD_IMAGES"

    # Notifications topic. allowed_aws_services_for_sns_published lets the
    # eventbridge/user-registered rule below publish to it.
    sns/notifications:
      metadata:
        component: sns
        inherits:
          - sns/defaults
      vars:
        name: "notifications"
        subscribers:
          ops:
            protocol: "email"
            endpoint: "{{ .settings.environment.ops_email }}"
        allowed_aws_services_for_sns_published: ["events.amazonaws.com"]

    # Dead-letter queue for the order-created rule's order-processor target.
    # Its policy lets that rule (and only that rule) send here.
    sqs/dlq:
      metadata:
        component: sqs
        inherits:
          - sqs/defaults
      vars:
        name: "dlq"
        message_retention_seconds: 1209600
        iam_policy:
          - statements:
              - sid: AllowOrderCreatedRule
                actions:
                  - "sqs:SendMessage"
                principals:
                  - type: Service
                    identifiers:
                      - "events.amazonaws.com"
                conditions:
                  - test: ArnLike
                    variable: "aws:SourceArn"
                    values:
                      # Tightened to this account (orgs/fnx/<stage>/_defaults'
                      # settings.environment.account_id) rather than wildcarding it.
                      - "arn:aws:events:{{ .vars.region }}:{{ .settings.environment.account_id }}:rule/{{ .settings.prefix }}-order-created"

    # Event bus and routing rules (eventbridge is one rule per instance: the
    # Cloud Posse aws-eventbridge model). Both rules sit on the default bus
    # (no create_event_bus): this stack does not need a custom bus or archive.
    eventbridge/order-created:
      metadata:
        component: eventbridge
        inherits:
          - eventbridge/defaults
      vars:
        name: "order-created"
        cloudwatch_event_rule_description: "Route order creation events"
        cloudwatch_event_rule_pattern:
          source: ["myapp.orders"]
          detail-type: ["Order Created"]
        targets:
          order-processor:
            arn: !terraform.state lambda/order-processor .function_arn
            dead_letter_config:
              arn: !terraform.state sqs/dlq .queue_arn
      dependencies:
        components:
          - component: kms/main
          - component: lambda/order-processor
          - component: sqs/dlq

    eventbridge/user-registered:
      metadata:
        component: eventbridge
        inherits:
          - eventbridge/defaults
      vars:
        name: "user-registered"
        cloudwatch_event_rule_description: "Route user registration events"
        cloudwatch_event_rule_pattern:
          source: ["myapp.users"]
          detail-type: ["User Registered"]
        targets:
          # The topic's policy lets this rule publish (allowed_aws_services_for_sns_published above).
          notifications:
            arn: !terraform.state sns/notifications .sns_topic_arn
      dependencies:
        components:
          - component: kms/main
          - component: sns/notifications

    # Order fulfilment workflow; the state machine definition is a map the
    # component jsonencodes, so function/topic ARNs come straight from state.
    # iam_policies grants the execution role exactly what its Tasks call.
    stepfunctions/order-fulfilment:
      metadata:
        component: stepfunctions
        inherits:
          - stepfunctions/defaults
      vars:
        name: "order-fulfilment"
        definition:
          Comment: "Order fulfilment workflow"
          StartAt: "ProcessOrder"
          States:
            ProcessOrder:
              Type: "Task"
              Resource: !terraform.state lambda/order-processor .function_arn
              Next: "NotifyCustomer"
            NotifyCustomer:
              Type: "Task"
              Resource: "arn:aws:states:::sns:publish"
              Parameters:
                TopicArn: !terraform.state sns/notifications .sns_topic_arn
                Message.$: "$.confirmation"
              End: true
        iam_policies:
          - sid: InvokeOrderProcessor
            actions: ["lambda:InvokeFunction"]
            resources:
              - !terraform.state lambda/order-processor .function_arn
          - sid: PublishNotifications
            actions: ["sns:Publish"]
            resources:
              - !terraform.state sns/notifications .sns_topic_arn
          # NotifyCustomer publishes to sns/notifications, which is encrypted
          # with this same kms/main key (catalog/sns/defaults) — a key that
          # also encrypts DynamoDB, SQS, the log groups and the state machine
          # itself. The component's own kms_policy statement only covers the
          # state machine's own KMS usage (scoped by the stateMachineArn
          # encryption context); SNS Publish to an SSE-KMS topic carries a
          # different context (aws:sns:topicArn), so the execution role needs
          # this separate grant — scoped down to this one topic's encryption
          # context, not the whole key, for least privilege.
          - sid: PublishNotificationsKMS
            actions: ["kms:GenerateDataKey*", "kms:Decrypt"]
            resources:
              - !terraform.state kms/main .key_arn
            conditions:
              - test: StringEquals
                variable: "kms:EncryptionContext:aws:sns:topicArn"
                values:
                  - !terraform.state sns/notifications .sns_topic_arn
      dependencies:
        components:
          - component: kms/main
          - component: lambda/order-processor
          - component: sns/notifications

    # Serverless dashboards and alarms
    monitoring/main:
      metadata:
        component: monitoring
        inherits:
          - monitoring/defaults
      vars:
        create_dashboard: true
        lambda_functions:
          - "{{ .settings.prefix }}-users-api"
          - "{{ .settings.prefix }}-order-processor"
          - "{{ .settings.prefix }}-daily-reports"
        lambda_duration_monitoring: true
        lambda_duration_threshold: 10000
        lambda_throttle_monitoring: true
        api_gateway_name: "{{ .atmos_stack }}-api"
        api_gateway_latency_threshold: 2000
        enable_dynamodb_monitoring: true
        # Matches dynamodb/users and dynamodb/orders above (<Environment>-<name>).
        dynamodb_tables:
          - "{{ .settings.prefix }}-users"
          - "{{ .settings.prefix }}-orders"
        alarm_email_subscriptions:
          - "{{ .settings.environment.ops_email }}"
      dependencies:
        components:
          - component: apigateway/main
          - component: lambda/users-api
          - component: lambda/order-processor
          - component: lambda/daily-reports

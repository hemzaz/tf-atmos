---
# Development Environment Profile Template
#
# Cost-optimized, developer-friendly defaults for development and test
# stacks. This is a mixin, not a top-level stack: copy it outside
# stacks/orgs (which only holds deployable stacks) and import it.
#
# Usage:
#   cp templates/configs/development.yaml stacks/mixins/profiles/development.yaml
#   # in the stack (e.g. stacks/orgs/fnx/dev/eu-west-2/<environment>.yaml):
#   import:
#     - orgs/fnx/dev/_defaults
#     - mixins/region/eu-west-2
#     - catalog/...                   # catalog imports
#     - mixins/profiles/development   # last, so it overrides the catalog defaults
#
# Environment-wide knobs live in settings.environment (components read them as
# {{ .settings.environment.<key> }}); component defaults are set on the
# catalog abstract components, so every instance that inherits them picks
# them up. Only `region` and `tags` are global vars.

import:
  - mixins/development
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/secretsmanager/defaults
  - catalog/monitoring/defaults

vars:
  tags:
    CostCenter: "development"
    BusinessUnit: "engineering"
    DataClassification: "internal"
    BackupRequired: "false"
    Schedule: "business-hours"
    AutoShutdown: "true"

settings:
  environment:
    environment_type: "development"
    high_availability: false
    multi_az: false
    # Logging and backups (short retention for cost)
    log_retention_days: 7
    backup_retention_days: 1
    # EKS: public endpoint for developer access
    eks_kubernetes_version: "1.36"
    eks_public_access: true
    # RDS instance size
    rds_instance_class: "db.t4g.micro"
    enable_container_insights: false
    enable_vpc_flow_logs: false

components:
  terraform:
    # Single NAT gateway and no flow logs to keep costs down
    vpc/defaults:
      vars:
        nat_gateway_strategy: "single"
        enable_flow_logs: false

    eks/defaults:
      vars:
        cluster_log_retention_period: 7
        enable_cluster_protection: false

    # Short recovery window so secrets can be recreated quickly
    secretsmanager/defaults:
      vars:
        default_recovery_window_in_days: 7

    # Basic monitoring with relaxed thresholds
    monitoring/defaults:
      vars:
        enable_anomaly_detection: false
        enable_percentile_alarms: false
        rds_cpu_threshold: 90
        ecs_cpu_threshold: 90
        ecs_memory_threshold: 95

---
# Production Environment Profile Template
#
# Security-hardened, high-availability defaults for production stacks.
# This is a mixin, not a top-level stack: copy it outside stacks/orgs (which
# only holds deployable stacks) and import it.
#
# Usage:
#   cp templates/configs/production.yaml stacks/mixins/profiles/production.yaml
#   # in the stack (e.g. stacks/orgs/fnx/prod/eu-west-2/<environment>.yaml):
#   import:
#     - orgs/fnx/prod/_defaults
#     - mixins/region/eu-west-2
#     - catalog/...                   # catalog imports
#     - mixins/profiles/production   # last, so it overrides the catalog defaults
#
# Environment-wide knobs live in settings.environment (components read them as
# {{ .settings.environment.<key> }}); component defaults are set on the
# catalog abstract components, so every instance that inherits them picks
# them up. Only `region` and `tags` are global vars.

import:
  - mixins/production
  - catalog/vpc/defaults
  - catalog/eks/defaults
  - catalog/secretsmanager/defaults
  - catalog/monitoring/defaults

vars:
  tags:
    CostCenter: "production"
    BusinessUnit: "platform"
    DataClassification: "confidential"
    BackupRequired: "true"
    MonitoringRequired: "true"
    Schedule: "24x7"
    SLA: "99.9"
    RecoveryTime: "4h"
    RecoveryPoint: "1h"

settings:
  environment:
    environment_type: "production"
    high_availability: true
    multi_az: true
    # Logging and backups
    log_retention_days: 90
    backup_retention_days: 30
    # EKS: private endpoint only
    eks_kubernetes_version: "1.36"
    eks_public_access: false
    # RDS instance size
    rds_instance_class: "db.r6g.xlarge"
    enable_container_insights: true
    enable_vpc_flow_logs: true

components:
  terraform:
    # One NAT gateway per AZ and VPC flow logs
    vpc/defaults:
      vars:
        nat_gateway_strategy: "one_per_az"
        vpc_flow_logs_enabled: true
        flow_logs_retention_days: 90
        enable_flow_logs_alarms: true

    eks/defaults:
      vars:
        cluster_log_retention_period: 90
        enable_cluster_protection: true

    # Maximum recovery window for deleted secrets
    secretsmanager/defaults:
      vars:
        default_recovery_window_in_days: 30

    # Enhanced monitoring with stricter thresholds
    monitoring/defaults:
      vars:
        enable_anomaly_detection: true
        enable_percentile_alarms: true
        rds_cpu_threshold: 70
        ecs_cpu_threshold: 70
        ecs_memory_threshold: 80

# Disaster Recovery Workflow Template
#
# Backup, restore and region-failover runbooks built from native Atmos steps.
# State backups complement (not replace) S3 versioning on the state bucket;
# secrets are protected by Secrets Manager replication/AWS Backup and are never
# written to local disk.
#
# Usage: copy to workflows/ and run with a stack:
#   cp templates/workflows/disaster-recovery.yaml workflows/disaster-recovery.yaml
#   STACK=<stack> atmos workflow backup-state -f disaster-recovery
#   atmos workflow backup-config -f disaster-recovery
#   STACK=<stack> atmos workflow restore-state -f disaster-recovery
#   atmos workflow failover-region -f disaster-recovery
#   STACK=<dr-stack> atmos workflow dr-health -f disaster-recovery
workflows:
  backup-state:
    description: Save a component's current Terraform state to backups/terraform-state/
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: component
        type: input
        prompt: Component (e.g. vpc/main)
      - name: backup
        type: shell
        command: >-
          mkdir -p backups/terraform-state &&
          atmos terraform state pull "$COMPONENT" -s "$STACK"
          > "backups/terraform-state/$(echo "$STACK-$COMPONENT" | tr '/' '_')-$(date -u +%Y%m%dT%H%M%SZ).tfstate"
        env:
          STACK: "{{ .steps.stack.value }}"
          COMPONENT: "{{ .steps.component.value }}"
      - type: toast
        level: success
        content: State of {{ .steps.component.value }} in {{ .steps.stack.value }} saved under backups/terraform-state/

  backup-config:
    description: Archive stacks, components, workflows and atmos.yaml to backups/configurations/
    steps:
      - name: archive
        type: shell
        command: >-
          mkdir -p backups/configurations &&
          tar -czf "backups/configurations/atmos-config-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          --exclude='.terraform' --exclude='*.tfstate*'
          atmos.yaml stacks components workflows
      - type: toast
        level: success
        content: Configuration archived under backups/configurations/

  restore-state:
    description: Push a saved state file back to a component's backend (overwrites remote state)
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: component
        type: input
        prompt: Component (e.g. vpc/main)
      - name: file
        type: input
        prompt: State file to restore (from backups/terraform-state/)
      - name: preconditions
        type: require
        files:
          - "{{ .steps.file.value }}"
      - name: current
        type: atmos
        command: terraform state list {{ .steps.component.value }} -s {{ .steps.stack.value }}
      - name: warning
        type: toast
        level: warning
        content: This overwrites the remote state of {{ .steps.component.value }} in {{ .steps.stack.value }}
      - name: confirm
        type: confirm
        prompt: Push {{ .steps.file.value }} as the new state?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Restore cancelled."; exit 1; }
      - name: push
        type: atmos
        command: terraform state push {{ .steps.component.value }} -s {{ .steps.stack.value }} -- {{ .steps.file.value }}
      - name: verify
        type: atmos
        command: terraform plan {{ .steps.component.value }} -s {{ .steps.stack.value }} --skip-planfile
      - type: toast
        level: success
        content: State restored; review the plan above for drift

  failover-region:
    description: Deploy the DR stack and fail over to it (plan, confirm, deploy, guided cut-over)
    steps:
      - name: primary
        type: input
        prompt: Primary stack
        default: '{{ env "STACK" }}'
      - name: dr_stack
        type: input
        prompt: DR stack (same components, DR region)
      - name: warning
        type: toast
        level: warning
        content: Failover from {{ .steps.primary.value }} to {{ .steps.dr_stack.value }} - only in a real disaster scenario
      - name: plan
        type: atmos
        command: terraform plan -s {{ .steps.dr_stack.value }} --failure-mode fail-fast --log-order grouped
      - name: confirm
        type: confirm
        prompt: Deploy {{ .steps.dr_stack.value }} and start the failover?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failover cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy -s {{ .steps.dr_stack.value }} --from-plan --failure-mode fail-fast --log-order grouped
      - name: runbook
        type: markdown
        content: |
          **Cut-over ({{ .steps.primary.value }} -> {{ .steps.dr_stack.value }})**
          1. Promote the RDS read replica in the DR region
             (`aws rds promote-read-replica --db-instance-identifier <replica> --region <dr-region>`).
          2. Switch the Route53 failover records to the DR endpoints.
          3. Run `atmos workflow dr-health -f disaster-recovery -s {{ .steps.dr_stack.value }}`.
          4. Record the incident and notify stakeholders.

  dr-health:
    description: Check that the DR stack matches its configuration (no drift, no failed components)
    steps:
      - name: drift
        type: atmos
        command: terraform plan --skip-planfile --failure-mode keep-going --hide no-changes --log-order grouped
      - type: toast
        level: success
        content: DR stack plan completed; any component listed above has drifted

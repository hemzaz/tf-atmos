# Deployment Pipeline Workflow Template
#
# Validation, static checks, plan, approval and deployment for every component
# of a stack. Atmos orders the components by their dependencies.components and
# the Atmos toolchain installs the tools declared under dependencies.tools.
#
# Usage: copy to workflows/ and run against a stack:
#   cp templates/workflows/deployment-pipeline.yaml workflows/deployment-pipeline.yaml
#   atmos workflow deployment-pipeline -f deployment-pipeline -s <stack>
#   atmos workflow checks -f deployment-pipeline                 # static checks only
#   atmos workflow verify -f deployment-pipeline -s <stack>      # drift check after a deploy
# CI: run `checks`, then `atmos terraform plan -s <stack>` and
#     `atmos terraform deploy --from-plan -s <stack>` behind an environment approval.
workflows:
  checks:
    description: Validate Atmos config and stacks, lint Terraform and YAML, and scan Terraform for HIGH/CRITICAL issues
    dependencies:
      tools:
        terraform: "1.16.3"
        wasilibs/go-yamllint: "1.38.0"
        trivy: "0.74.0"
    steps:
      - name: validate-config
        type: atmos
        command: validate config
      - name: validate-stacks
        type: atmos
        command: validate stacks
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: security-scan
            type: shell
            command: trivy config --exit-code 1 --severity HIGH,CRITICAL components/terraform
      - type: toast
        level: success
        content: Static checks passed

  deployment-pipeline:
    description: Checks, plan, confirmation and deployment of all components in a stack
    steps:
      # Static checks (the `checks` workflow installs its own tools)
      - name: checks
        type: atmos
        command: workflow checks -f deployment-pipeline
      # terraform plan also runs validation for every component
      - name: plan
        type: atmos
        command: terraform plan --failure-mode fail-fast --log-order grouped
      - name: review
        type: markdown
        content: |
          **Before approving**
          - Every plan above only changes what this release intends to change.
          - No unexpected destroys or replacements.
          - The security scan reported no HIGH/CRITICAL findings.
      - name: confirm
        type: confirm
        prompt: Deploy the plans above?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --failure-mode fail-fast --log-order grouped
      - name: verify
        type: atmos
        command: terraform plan --skip-planfile --hide no-changes --log-order grouped
      - type: toast
        level: success
        content: Stack deployed and verified

  verify:
    description: Post-deployment drift check (plans every component, shows only components with changes)
    steps:
      - name: drift
        type: atmos
        command: terraform plan --skip-planfile --failure-mode keep-going --hide no-changes --log-order grouped

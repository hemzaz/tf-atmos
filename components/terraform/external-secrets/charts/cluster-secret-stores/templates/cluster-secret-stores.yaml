{{- /*
Each store gets its own service account, annotated with its own IRSA role, in
the operator's namespace. The operator's own service account has no role: a
namespaced SecretStore without auth would otherwise read with the operator's
credentials and bypass the namespace conditions below. A namespaced
SecretStore cannot reference these service accounts either: ESO resolves its
serviceAccountRef in the SecretStore's own namespace.
*/ -}}
{{- range .Values.stores }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "stores[].name is required" .name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "stores[].roleArn is required" .roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name | quote }}
spec:
  # Only these namespaces may bind an ExternalSecret to this store.
  conditions:
    - namespaces:
        {{- if not .namespaces }}
        {{- fail (printf "stores[%s].namespaces must not be empty" .name) }}
        {{- end }}
        {{- range .namespaces }}
        - {{ . | quote }}
        {{- end }}
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" $.Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .name | quote }}
            namespace: {{ $.Release.Namespace | quote }}
{{- end }}

# Cloud Posse components vendored into components/terraform (QE1). Each source
# pins an exact release tag; vendor.lock.yaml is the receipt of its files.
# scripts/check-vendor.py (lint step check-vendor) fails a vendored dir edited
# in place or out of step with its pin; house changes go in a *_override.tf.
# Add or bump: atmos vendor pull -c <component> --refresh-lock, then
# atmos workflow providers-lock -f providers for its .terraform.lock.hcl.
apiVersion: atmos/v1
kind: AtmosVendorConfig
metadata:
  name: fnx-vendored-components
  description: Cloud Posse components vendored from cloudposse-terraform-components
spec:
  sources:
    # IAM Access Analyzer: org delegation (root) and organization analyzers
    # (delegated administrator). stacks/catalog/access-analyzer.
    - component: access-analyzer
      source: "github.com/cloudposse-terraform-components/aws-access-analyzer.git//src?ref={{ .Version }}"
      version: "v2.0.1"
      targets:
        - "components/terraform/access-analyzer"
      included_paths: ["**/*.tf", "**/*.md"]
    # The AWS Organization and its OUs (single-resource pattern), applied from
    # the management account's global stack fnx-gbl-root.
    # stacks/catalog/aws-organization, stacks/catalog/aws-organizational-unit.
    - component: aws-organization
      source: "github.com/cloudposse-terraform-components/aws-organization.git//src?ref={{ .Version }}"
      version: "v0.2.0"
      targets:
        - "components/terraform/aws-organization"
      included_paths: ["**/*.tf", "**/*.md"]
    - component: aws-organizational-unit
      source: "github.com/cloudposse-terraform-components/aws-organizational-unit.git//src?ref={{ .Version }}"
      version: "v0.1.0"
      targets:
        - "components/terraform/aws-organizational-unit"
      included_paths: ["**/*.tf", "**/*.md"]
    # One member account per instance (single-resource pattern), applied from
    # fnx-gbl-root. stacks/catalog/aws-account.
    - component: aws-account
      source: "github.com/cloudposse-terraform-components/aws-account.git//src?ref={{ .Version }}"
      version: "v2.1.0"
      targets:
        - "components/terraform/aws-account"
      included_paths: ["**/*.tf", "**/*.md"]
    # Each account's account-level settings (E3d): the IAM account alias and
    # S3 account public access block once per account, EBS default
    # encryption, EBS snapshot / AMI / EMR block public access, the IMDSv2
    # default and SSM public document sharing per region.
    # stacks/catalog/aws-account-settings.
    - component: aws-account-settings
      source: "github.com/cloudposse-terraform-components/aws-account-settings.git//src?ref={{ .Version }}"
      version: "v2.1.1"
      targets:
        - "components/terraform/aws-account-settings"
      included_paths: ["**/*.tf", "**/*.md"]
    # One Service Control Policy per instance (single-resource pattern), applied
    # from fnx-gbl-root, and Cloud Posse's SCP statement catalog, which lives
    # outside src/ and is read with !include, never copied into a stack.
    # stacks/catalog/aws-scp.
    - component: aws-scp
      source: "github.com/cloudposse-terraform-components/aws-scp.git//src?ref={{ .Version }}"
      version: "v0.3.0"
      targets:
        - "components/terraform/aws-scp"
      included_paths: ["**/*.tf", "**/*.md"]
    - component: aws-scp-catalog
      source: "github.com/cloudposse-terraform-components/aws-scp.git//catalog?ref={{ .Version }}"
      version: "v0.3.0"
      targets:
        - "stacks/catalog/aws-scp/catalog"
      included_paths: ["**/*.yaml"]
    # Cloud Posse's account-map iam-roles module only, never the account-map
    # root module (E4 is Cloud Posse's Evolution 4: no account-map, owner
    # 2026-10-31): the account-map-bypass providers mixin below sources
    # ../account-map/modules/iam-roles and bypasses it (account_map_enabled
    # false), so it reads no account-map state.
    - component: account-map
      source: "github.com/cloudposse-terraform-components/aws-account-map.git//src?ref={{ .Version }}"
      version: "v1.537.3"
      targets:
        - "components/terraform/account-map"
      included_paths: ["modules/iam-roles/*.tf", "modules/iam-roles/*.md"]
    # The service domain's primary zone (network account) and each stage's
    # delegated subdomain, which writes its NS record into the primary through
    # aws.primary. E6b: instances land disabled; the house dns signs and
    # query-logs their zones (external_zones mode). Their upstream providers.tf
    # (account-map iam-roles) is excluded: each gets Cloud Posse's mixins
    # below instead.
    - component: aws-dns-primary
      source: "github.com/cloudposse-terraform-components/aws-dns-primary.git//src?ref={{ .Version }}"
      version: "v1.537.0"
      targets:
        - "components/terraform/aws-dns-primary"
      included_paths: ["**/*.tf", "**/*.md"]
      excluded_paths: ["**/providers.tf"]
    - component: aws-dns-delegated
      source: "github.com/cloudposse-terraform-components/aws-dns-delegated.git//src?ref={{ .Version }}"
      version: "v1.538.1"
      targets:
        - "components/terraform/aws-dns-delegated"
      included_paths: ["**/*.tf", "**/*.md"]
      excluded_paths: ["**/providers.tf"]
    # One IAM role per instance: the network account's DNS delegation role,
    # which each stage's aws-dns-delegated assumes as aws.primary
    # (stacks/catalog/aws-iam-role). Upstream providers.tf excluded, as above.
    - component: aws-iam-role
      source: "github.com/cloudposse-terraform-components/aws-iam-role.git//src?ref={{ .Version }}"
      version: "v1.539.0"
      targets:
        - "components/terraform/aws-iam-role"
      included_paths: ["**/*.tf", "**/*.md"]
      excluded_paths: ["**/providers.tf"]
    # Cloud Posse's providers mixins for the account-map-less model (Evolution
    # 4, the migrate-from-account-map tutorial), vendored into each component
    # above in place of its providers.tf: providers-account-map-bypass.depth-1
    # (account_map_enabled false: ambient credentials, iam-roles bypassed) and
    # account-verification (fails a run whose credentials are not in the
    # account var.account_map maps to <tenant>-<stage>).
    - component: aws-dns-primary-mixins
      source: "github.com/cloudposse-terraform-components/mixins.git//src/mixins?ref={{ .Version }}"
      version: "v0.5.0"
      targets:
        - "components/terraform/aws-dns-primary"
      included_paths: ["providers-account-map-bypass.depth-1.tf", "account-verification.mixin.tf"]
    - component: aws-dns-delegated-mixins
      source: "github.com/cloudposse-terraform-components/mixins.git//src/mixins?ref={{ .Version }}"
      version: "v0.5.0"
      targets:
        - "components/terraform/aws-dns-delegated"
      included_paths: ["providers-account-map-bypass.depth-1.tf", "account-verification.mixin.tf"]
    - component: aws-iam-role-mixins
      source: "github.com/cloudposse-terraform-components/mixins.git//src/mixins?ref={{ .Version }}"
      version: "v0.5.0"
      targets:
        - "components/terraform/aws-iam-role"
      included_paths: ["providers-account-map-bypass.depth-1.tf", "account-verification.mixin.tf"]

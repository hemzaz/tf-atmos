# Rotates a TLS certificate stored in AWS Secrets Manager and syncs it to the
# Kubernetes secret consumed by the cluster (see scripts/certificates/rotate-cert.sh).
#
# Usage: atmos workflow rotate -f rotate-certificate
workflows:
  rotate:
    description: Rotate a certificate in AWS Secrets Manager / ACM and Kubernetes
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
        kubernetes-sigs/kubectl: "1.37.0"
    steps:
      - name: secret
        type: input
        prompt: Secrets Manager secret name
      - name: namespace
        type: input
        prompt: Kubernetes namespace
      - name: acm_arn
        type: input
        prompt: New ACM certificate ARN (optional)
        default: ""
      - name: rotate
        type: shell
        working_directory: !repo-root .
        command: >-
          ./scripts/certificates/rotate-cert.sh -s "$SECRET" -n "$NAMESPACE"
          ${ACM_ARN:+-a "$ACM_ARN"}
        env:
          SECRET: "{{ .steps.secret.value }}"
          NAMESPACE: "{{ .steps.namespace.value }}"
          ACM_ARN: "{{ .steps.acm_arn.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

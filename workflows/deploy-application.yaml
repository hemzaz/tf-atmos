# Application-layer deployments on top of an existing foundation. What these
# workflows select reads state they do not deploy, so these must already be
# applied (deploy-full-stack, layers backend through certificates): kms/main,
# s3/lambda-artifacts (lambda's package bucket), vpc/*, eks/* (where present),
# acm/* and the dns zones (network/main, network/services).
# monitoring also reads rds/*, elasticache/main (deploy-full-stack data layer) and
# lambda/* for dashboard/alarm dimensions; lambda and ecs are applied by this
# workflow, but rds and elasticache come only from deploy-full-stack's data
# layer, not from deploy-app.
#
# hot-deploy is the one exception to "review a saved plan, then apply exactly
# that plan": it is a fast path for redeploying Cognito, Lambda and API Gateway,
# and runs `terraform deploy` (plan + auto-approve per instance, in dependency
# order) with no confirmation. Use deploy-app to review before applying.
#
# Usage:
#   atmos workflow deploy-app -f deploy-application -s <stack>
#   atmos workflow hot-deploy -f deploy-application -s <stack>
#   atmos workflow component -f deploy-application -s <stack>
workflows:
  deploy-app:
    description: Deploy application layer components (secrets, Cognito, Lambda, ECS, then API Gateway and monitoring)
    steps:
      # Template fixture stacks (stage "fixtures", stacks/orgs/fnx/fixtures) are
      # never deployed: refuse them (see deploy-full-stack.yaml). Without -s every
      # stack is selected, fixtures included, so that is refused too.
      - &fixtures-stages
        name: stages
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[].settings.context.stage] | unique | join(",")'
        output: none
      - &refuse-fixtures
        name: refuse-fixtures
        type: shell
        command: case '{{ .steps.stages.value }}' in *fixtures*) echo "Refusing a template fixture stack (stage fixtures), which is never deployed."; exit 1 ;; esac
      - name: check-foundation
        type: atmos
        command: terraform output vpc/main vpc_id
      # Four plan/confirm/apply phases. A phase plans every instance before it
      # applies any. A Lambda may read the user pool, so Cognito is applied in
      # the first phase and Lambda and ECS in the second; apigateway reads
      # cognito/main .user_pool_arn and lambda/data-processor through
      # !terraform.state, so API Gateway is planned only after that.
      # monitoring/main and monitoring/data in turn read apigateway/main and
      # apigateway/data (.api_name, .rest_api_stage_name), so monitoring is its
      # own phase, planned only after API Gateway is applied - the same
      # layering as deploy-full-stack.yaml's services (apigateway) then
      # monitoring layers.
      # A user pool's trigger function comes before the pool, whose
      # lambda_config reads its ARN (fnx-ue2-prod cognito/main reads
      # lambda/cognito-user-migration): its own phase, as in deploy-full-stack
      # (connectivity before security). A stack without one plans nothing here.
      - name: plan-triggers
        type: atmos
        command: terraform plan --log-order grouped --query '.atmos_component == "lambda/cognito-user-migration"'
      - name: confirm_triggers
        type: confirm
        prompt: Apply the Cognito trigger plan above (none in most stacks)?
        default: false
      - name: guard-triggers
        type: shell
        command: test "{{ .steps.confirm_triggers.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy-triggers
        type: atmos
        command: terraform deploy --from-plan --query '.atmos_component == "lambda/cognito-user-migration"'
      - name: plan-prerequisites
        type: atmos
        command: >-
          terraform plan --log-order grouped --query '.metadata.component == "secretsmanager"
          or .metadata.component == "external-secrets" or .metadata.component == "cognito"'
      - name: confirm_prerequisites
        type: confirm
        prompt: Apply the secrets and Cognito plans above?
        default: false
      - name: guard-prerequisites
        type: shell
        command: test "{{ .steps.confirm_prerequisites.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy-secrets
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "secretsmanager" or .metadata.component == "external-secrets"'
      - name: deploy-identity
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "cognito"'
      # Lambdas read the user pool (serverless-api/lambda-api-handler's
      # USER_POOL_ID), so they are planned only after Cognito is applied, as in
      # deploy-full-stack (security before compute).
      - name: plan-compute
        type: atmos
        command: terraform plan --log-order grouped --query '(.metadata.component == "lambda" and .atmos_component != "lambda/cognito-user-migration") or .metadata.component == "ecs"'
      - name: confirm_compute
        type: confirm
        prompt: Apply the Lambda and ECS plans above?
        default: false
      - name: guard-compute
        type: shell
        command: test "{{ .steps.confirm_compute.value }}" = "true" || { echo "Deployment cancelled after the second phase."; exit 1; }
      - name: deploy-compute
        type: atmos
        command: terraform deploy --from-plan --query '(.metadata.component == "lambda" and .atmos_component != "lambda/cognito-user-migration") or .metadata.component == "ecs"'
      - name: plan-api
        type: atmos
        command: terraform plan --log-order grouped --query '.metadata.component == "apigateway"'
      - name: confirm_api
        type: confirm
        prompt: Apply the API Gateway plan above?
        default: false
      - name: guard-api
        type: shell
        command: test "{{ .steps.confirm_api.value }}" = "true" || { echo "Deployment cancelled after the third phase."; exit 1; }
      - name: deploy-api
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "apigateway"'
      - name: plan-monitoring
        type: atmos
        command: terraform plan --log-order grouped --query '.metadata.component == "monitoring"'
      - name: confirm_monitoring
        type: confirm
        prompt: Apply the monitoring plan above?
        default: false
      - name: guard-monitoring
        type: shell
        command: test "{{ .steps.confirm_monitoring.value }}" = "true" || { echo "Deployment cancelled after the fourth phase."; exit 1; }
      - name: deploy-monitoring
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "monitoring"'
      - type: toast
        level: success
        content: Application layer deployed

  hot-deploy:
    description: Quick application deployment (Cognito, Lambda and API Gateway only)
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      # Unreviewed by design (see the header): no saved plans and no confirm. Each
      # instance is planned just before it is applied, in dependency order, so
      # apigateway sees cognito's and lambda's state.
      # A pool's trigger function first (the pool reads its ARN), then Cognito:
      # apigateway/main reads cognito/main .user_pool_arn.
      - name: deploy-triggers
        type: atmos
        command: terraform deploy --query '.atmos_component == "lambda/cognito-user-migration"'
      - name: deploy-identity
        type: atmos
        command: terraform deploy --query '.metadata.component == "cognito"'
      - name: deploy
        type: atmos
        command: >-
          terraform deploy --query '(.metadata.component == "lambda" and .atmos_component != "lambda/cognito-user-migration")
          or .metadata.component == "apigateway"'

  component:
    description: Plan, confirm and deploy a single component
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: component
        type: input
        prompt: Component (e.g. apigateway/main)
      - name: plan
        type: atmos
        command: terraform plan {{ .steps.component.value }}
      - name: confirm
        type: confirm
        prompt: Apply {{ .steps.component.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy {{ .steps.component.value }} --from-plan

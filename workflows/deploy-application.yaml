# Application-layer deployments on top of an existing foundation
# (vpc/main and, where present, eks/main must already be deployed).
#
# Usage:
#   atmos workflow deploy-app -f deploy-application -s <stack>
#   atmos workflow hot-deploy -f deploy-application -s <stack>
#   atmos workflow component -f deploy-application -s <stack>
workflows:
  deploy-app:
    description: Deploy application layer components (secrets, Cognito, Lambda, API Gateway, ECS, monitoring)
    steps:
      - name: check-foundation
        type: atmos
        command: terraform output vpc/main vpc_id
      - name: plan
        type: atmos
        command: >-
          terraform plan --log-order grouped --query '.metadata.component == "secretsmanager"
          or .metadata.component == "external-secrets" or .metadata.component == "cognito"
          or .metadata.component == "lambda" or .metadata.component == "apigateway" or .metadata.component == "ecs"
          or .metadata.component == "monitoring"'
      - name: confirm
        type: confirm
        prompt: Deploy the application layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy-secrets
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "secretsmanager" or .metadata.component == "external-secrets"'
      # apigateway/main reads cognito/main .user_pool_arn, so cognito is applied before the API.
      - name: deploy-identity
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "cognito"'
      - name: deploy-compute
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "lambda" or .metadata.component == "ecs"'
      - name: deploy-api
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "apigateway"'
      - name: deploy-monitoring
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "monitoring"'
      - type: toast
        level: success
        content: Application layer deployed

  hot-deploy:
    description: Quick application deployment (Cognito, Lambda and API Gateway only)
    steps:
      # Cognito first: apigateway/main reads cognito/main .user_pool_arn.
      - name: deploy-identity
        type: atmos
        command: terraform deploy --query '.metadata.component == "cognito"'
      - name: deploy
        type: atmos
        command: terraform deploy --query '.metadata.component == "lambda" or .metadata.component == "apigateway"'

  component:
    description: Plan, confirm and deploy a single component
    steps:
      - name: component
        type: input
        prompt: Component (e.g. apigateway/main)
      - name: plan
        type: atmos
        command: terraform plan {{ .steps.component.value }}
      - name: confirm
        type: confirm
        prompt: Apply {{ .steps.component.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy {{ .steps.component.value }} --from-plan

# Static checks for Terraform code and YAML config. Tools are installed by the
# Atmos toolchain from `dependencies.tools`.
#
# Usage:
#   atmos workflow lint -f lint
#   atmos workflow security-scan -f lint   # SARIF reports for GitHub code scanning
workflows:
  lint:
    description: Lint Terraform code, YAML files and run a Terraform security scan
    dependencies:
      tools:
        terraform: "1.16.3"
        tflint: "0.64.0"
        wasilibs/go-yamllint: "1.38.0"
        trivy: "0.74.0"
    steps:
      - name: validate-config
        type: atmos
        command: validate config
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: security-scan
            type: shell
            command: trivy config --exit-code 0 --severity HIGH,CRITICAL components/terraform
      - name: tflint
        type: atmos
        command: terraform lint
      - type: toast
        level: success
        content: Lint checks passed

  security-scan:
    description: Scan Terraform code with Trivy and Checkov, writing SARIF reports to reports/
    dependencies:
      tools:
        trivy: "0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              trivy config --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 0 components/terraform
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform
              --output sarif --output-file-path reports --soft-fail --quiet

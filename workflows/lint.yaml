# Static checks for Terraform code and YAML config. Tools are installed by the
# Atmos toolchain from `dependencies.tools`.
#
# Usage:
#   atmos workflow lint -f lint
#   atmos workflow tflint-init -f lint            # install tflint + its .tflint.hcl plugins (network)
#   atmos workflow security-scan -f lint          # PR gate: SARIF reports, fails on NEW HIGH/CRITICAL
#   atmos workflow security-scan-report -f lint   # nightly: full backlog (no baselines), never fails
#   atmos workflow security-baseline -f lint      # regenerate .trivyignore.yaml and .checkov.baseline
#
# The PR gates (lint, security-scan) only fail on findings that are not in the
# committed baselines (.trivyignore.yaml, .checkov.baseline). Regenerate the
# baselines deliberately, to burn findings down, never to make a PR pass.
workflows:
  lint:
    description: Lint Terraform code, YAML files and run a Terraform security scan
    dependencies:
      tools:
        terraform: "1.16.3"
        tflint: "0.64.0"
        wasilibs/go-yamllint: "1.38.0"
        trivy: "0.74.0"
    steps:
      - name: validate-config
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate config
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: security-scan
            type: shell
            command: trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml components/terraform
      # No-op when the plugins are already installed (CI runs tflint-init first,
      # with a token for GitHub rate limits, so this step needs no network).
      - name: tflint-plugins
        type: shell
        command: tflint --init --config .tflint.hcl
      - name: tflint
        type: atmos
        command: terraform lint
      # `atmos terraform lint` above lints stack INSTANCES, so a component with no
      # stack instance is never looked at. Ten of the twenty-three components were
      # in that state, and the gate reported "passed" while never opening them.
      # This step lints every component DIRECTORY, so an unwired component cannot
      # go unlinted again. Both steps are needed: the instance pass resolves stack
      # variables (catching what only shows up with real inputs), the directory
      # pass guarantees coverage.
      - name: tflint-components
        type: script
        interpreter: bash
        script: |
          set -uo pipefail
          config="$PWD/.tflint.hcl"
          failed=""
          for dir in components/terraform/*/; do
            component=$(basename "$dir")
            # _library holds shared sub-modules, not root modules; skip it and any
            # directory that has no Terraform files of its own.
            [ "$component" = "_library" ] && continue
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            # --no-color so the Warning:/Error: prefixes below match.
            if ! output=$(tflint --no-color --config "$config" --chdir "$dir" 2>&1); then
              failed="$failed $component"
              count=$(printf '%s\n' "$output" | grep -cE '^(Warning|Error):')
              if [ "$count" -gt 0 ]; then
                rules=$(printf '%s\n' "$output" | grep -oE '\([a-z0-9_]+\)$' \
                  | tr -d '()' | sort -u | paste -sd, -)
                echo "  $component: $count finding(s) [$rules]"
              else
                # tflint exited non-zero without emitting findings (parse error,
                # bad config, missing plugin). A count summary would say nothing
                # useful, so show what it actually reported.
                echo "  $component: tflint failed without findings:"
                printf '%s\n' "$output" | sed 's/^/    /'
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "tflint found issues in:$failed"
            echo "Re-run one component with: tflint --config .tflint.hcl --chdir components/terraform/<component>/"
            exit 1
          fi
          echo "tflint: all component directories clean"
      - type: toast
        level: success
        content: Lint checks passed

  tflint-init:
    description: Install tflint and the provider plugins declared in .tflint.hcl
    dependencies:
      tools:
        tflint: "0.64.0"
    steps:
      - name: tflint-plugins
        type: shell
        command: tflint --init --config .tflint.hcl

  security-scan:
    description: Scan Terraform code with Trivy and Checkov (SARIF in reports/); fails on HIGH/CRITICAL findings
    dependencies:
      tools:
        trivy: "0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              trivy config --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml components/terraform
          # Checkov only knows check severities with a Prisma Cloud API key; without
          # one, a failed check matches neither list and therefore fails the gate.
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform
              --output sarif --output-file-path reports --quiet
              --soft-fail-on LOW,MEDIUM --hard-fail-on HIGH,CRITICAL --baseline .checkov.baseline

  security-scan-report:
    description: Report-only scan for the nightly workflow (SARIF in reports/); never fails on findings
    dependencies:
      tools:
        trivy: "0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              trivy config --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 0 components/terraform
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform
              --output sarif --output-file-path reports --soft-fail --quiet

  security-baseline:
    description: Regenerate the PR-gate baselines (.trivyignore.yaml, .checkov.baseline) from the current code
    dependencies:
      tools:
        trivy: "0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      - name: trivy-findings
        type: shell
        output: none
        command: >-
          trivy config --format json --output reports/trivy-baseline.json
          --severity HIGH,CRITICAL --exit-code 0 components/terraform
      - name: trivy-baseline
        type: script
        interpreter: python3
        script: |
          import datetime, json

          findings = set()
          for result in json.load(open("reports/trivy-baseline.json")).get("Results") or []:
              for m in result.get("Misconfigurations") or []:
                  if m.get("Status") == "FAIL":
                      findings.add((m["ID"], result["Target"]))
          lines = [
              f"# Trivy baseline {datetime.date.today()} - burn down, don't add.",
              "# HIGH/CRITICAL misconfigurations present when the baseline was taken; the PR",
              "# gate ignores exactly these (rule, file) pairs. Regenerate with",
              "# `atmos workflow security-baseline -f lint`.",
              "misconfigurations:",
          ]
          for rule, target in sorted(findings):
              lines += [f"  - id: {rule}", "    paths:", f'      - "{target}"']
          open(".trivyignore.yaml", "w").write("\n".join(lines) + "\n")
          print(f"{len(findings)} trivy findings baselined")
      - name: checkov-baseline
        type: shell
        output: none
        command: >-
          checkov --directory components/terraform --framework terraform
          --create-baseline --soft-fail --quiet --compact
      - name: move-checkov-baseline
        type: shell
        command: mv components/terraform/.checkov.baseline .checkov.baseline

# Static checks for Terraform code and YAML config. Tools are installed by the
# Atmos toolchain from `dependencies.tools`.
#
# Usage:
#   atmos workflow lint -f lint
#   atmos workflow tflint-init -f lint            # install tflint + its .tflint.hcl plugins (network)
#   atmos workflow actionlint -f lint             # lint .github/workflows (actionlint)
#   atmos workflow security-scan -f lint          # PR gate: Trivy + Checkov, fails on HIGH/CRITICAL
#   atmos workflow security-scan-report -f lint   # nightly: every finding, never fails
#
# There are no scanner baselines: the security-scan gate fails on every
# finding that is not fixed or suppressed inline in the resource
# (#checkov:skip=<ID>:<reason>, #trivy:ignore:<ID> <reason>).
#
# One trivy gate, in security-scan, not also in lint: both CI jobs run on the
# same changed paths (terraform-ci.yml `changes`), and security-scan already
# holds the checkov gate and writes the reports. lint used to run the identical
# trivy command a second time.
#
# Scanner pins: checkov 3.3.21 (3.3.22 has no GitHub release, so the toolchain
# cannot install it) and trivy v0.75.0. Keep .pre-commit-config.yaml,
# Dockerfile.devops, .atmos.env and templates/workflows/ on the same versions.
#
# tflint and trivy publish GitHub release tags with a `v` prefix (v0.64.0,
# v0.75.0) and sign each release with a GitHub Attestation tied to that exact
# tag ref. The toolchain's cosign verification compares the pin here against
# `refs/tags/<pin>`, so an unprefixed pin ("0.64.0") never matches the
# certificate's workflow ref and install fails with "expected GitHub Workflow
# Ref not found in certificate" (tflint) / "expected GithubWorkflowRef to be
# ...got refs/tags/v<version>" (trivy). Keep the `v`. terraform, go-yamllint,
# jq, aws-cli and checkov are verified differently (or their upstream tags
# have no `v`) and are confirmed to install correctly unprefixed.
#
# Every trivy run passes --skip-check-update and an empty, throwaway
# --cache-dir. Without the flag trivy downloads the floating check bundle
# mirror.gcr.io/aquasec/trivy-checks:2 at run time (580 checks vs the 563
# embedded in the binary), so the gate's findings changed with no change
# in this repo. The flag alone still loads a bundle already in the trivy cache
# (~/.cache/trivy on a developer machine), so the empty cache makes a local run
# use exactly the embedded checks CI uses. New checks arrive by bumping the pin.
workflows:
  lint:
    description: Lint Terraform code and YAML files (the Trivy/Checkov gate is security-scan)
    dependencies:
      tools:
        terraform: "1.16.3"
        tflint: "v0.64.0"
        wasilibs/go-yamllint: "1.38.0"
        # scripts/check-stack-samples.sh (stack-samples) edits a scratch
        # manifest with it; the atmos image ships no yq.
        mikefarah/yq: "v4.53.6"
    steps:
      - name: validate-config
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate config
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          # checkov's HCL parser rejects a unary !x/-x that ends a line before a
          # leading && / || (terraform accepts it) and then skips the whole file;
          # security-scan's coverage guard only catches that later. Fails fast here.
          - name: hcl-unary-newline
            type: shell
            command: |
              set -eu
              python3 -m unittest workflows/scripts/common/test_check_hcl_unary_newline.py
              python3 scripts/check-hcl-unary-newline.py components/terraform
          # Stack names and paths from before the region-code rename
          # (<tenant>-<stage>-<instance>, <stage>/<region>/<instance>.yaml) point at stacks
          # that no longer exist.
          - name: old-stack-names
            type: shell
            command: |
              set -eu
              python3 -m unittest workflows/scripts/common/test_check_old_stack_names.py
              python3 scripts/check-old-stack-names.py
          # atmos.yaml validates stacks against the pinned
          # schemas/atmos/atmos-manifest.json, not a URL (cached in $TMPDIR and
          # corrupted there by concurrent runs). The pin must be the embedded
          # schema of the CI image's Atmos (.github/atmos-image/Dockerfile);
          # another local Atmos skips the check and CI enforces it.
          - name: manifest-schema
            type: shell
            command: |
              set -eu
              pin=schemas/atmos/atmos-manifest.json
              want=$(sed -n 's|^FROM ghcr\.io/cloudposse/atmos:\([^@]*\)@.*|\1|p' .github/atmos-image/Dockerfile)
              have=$(atmos version --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
              if [ "$have" != "$want" ]; then
                echo "manifest-schema: skipped, Atmos $have is not the CI image's $want"
                exit 0
              fi
              fresh="$(mktemp)"
              trap 'rm -f "$fresh"' EXIT
              atmos stack schema "$fresh"
              if ! cmp -s "$fresh" "$pin"; then
                echo "::error title=Manifest schema pin is stale::$pin is not Atmos $want's schema. Run: atmos stack schema $pin"
                exit 1
              fi
              echo "manifest-schema: $pin is Atmos $want's schema"
      # No-op when the plugins are already installed (CI runs tflint-init first,
      # with a token for GitHub rate limits, so this step needs no network).
      - name: tflint-plugins
        type: shell
        command: tflint --init --config .tflint.hcl
      # Every stack but the template fixtures in one run, as before the fixtures
      # existed (atmos.yaml's excluded_paths plus the fixtures directory; keep
      # the first two in step with it). Then each fixture stack on its own, so
      # one in KNOWN_BROKEN_FIXTURES (workflows/scripts/common/fixtures.py,
      # check "tflint") is reported without failing the run: `atmos terraform
      # lint` has no flag to exclude a stack.
      - name: tflint
        type: shell
        command: |
          set -eu
          broken=$(python3 -B -c 'import sys; sys.path.insert(0, "workflows/scripts/common"); import fixtures; print(" ".join(fixtures.stacks("tflint")))')
          stacks=$(atmos list stacks | grep '^fnx-ue1-fixtures-' || true)
          [ -n "$stacks" ] || { echo "no fnx-ue1-fixtures-* stacks listed; refusing to skip them"; exit 1; }
          ATMOS_STACKS_EXCLUDED_PATHS='**/_defaults.yaml,**/components/**,orgs/fnx/fixtures/**' atmos terraform lint
          failed=""
          for stack in $stacks; do
            if atmos terraform lint -s "$stack"; then continue; fi
            case " $broken " in
              *" $stack "*) echo "KNOWN-BROKEN $stack: tflint failures do not fail the run" ;;
              *) failed="$failed $stack" ;;
            esac
          done
          if [ -n "$failed" ]; then echo "tflint failed in:$failed"; exit 1; fi
      # `atmos terraform lint` above lints stack INSTANCES, so a component with no
      # stack instance is never looked at. Ten of the twenty-three components were
      # in that state, and the gate reported "passed" while never opening them.
      # This step lints every component DIRECTORY, so an unwired component cannot
      # go unlinted again.
      #
      # KEEP BOTH. They fail on disjoint classes, and each is blind to the other's:
      #
      #   - Directory-only catches: an unused declaration in a component no stack
      #     instantiates. Reintroducing one in eks-addons had the instance pass
      #     report "23 components linted, no findings" while this step caught it.
      #
      #   - Instance-only catches: a rule that aborts on an unresolved variable.
      #     Replacing apigateway's `try(var.tags["Environment"], "default")` with a
      #     bare index made tflint abort aws_cloudwatch_log_group_invalid_name with
      #     "Failed to check ruleset" on both apigateway instances. This step never
      #     saw it: without stack vars the directory pass does not reach that
      #     evaluation at all. See the comment in apigateway/main.tf.
      #
      # So the instance pass resolves stack variables and catches what only shows
      # up with real inputs; the directory pass guarantees coverage. Dropping
      # either reopens a class of failure that has already happened once.
      - name: tflint-components
        type: script
        interpreter: bash
        script: |
          set -uo pipefail
          config="$PWD/.tflint.hcl"
          failed=""
          for dir in components/terraform/*/; do
            component=$(basename "$dir")
            # _library holds shared sub-modules, not root modules; skip it and any
            # directory that has no Terraform files of its own.
            [ "$component" = "_library" ] && continue
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            # --no-color so the Warning:/Error: prefixes below match.
            if ! output=$(tflint --no-color --config "$config" --chdir "$dir" 2>&1); then
              failed="$failed $component"
              count=$(printf '%s\n' "$output" | grep -cE '^(Warning|Error):')
              rules=$(printf '%s\n' "$output" | grep -oE '\([a-z0-9_]+\)$' \
                | tr -d '()' | sort -u | paste -sd, -)
              if [ -n "$rules" ]; then
                echo "  $component: $count finding(s) [$rules]"
              else
                # Non-zero exit with no rule name means tflint failed rather than
                # found something (parse error, bad config, missing plugin). A
                # rule summary would say nothing, so show what it reported.
                echo "  $component: tflint failed to run:"
                printf '%s\n' "$output" | sed 's/^/    /'
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "tflint found issues in:$failed"
            echo "Re-run one component with: tflint --config .tflint.hcl --chdir components/terraform/<component>/"
            exit 1
          fi
          echo "tflint: all component directories clean"
      # The state backend's roles are split by stage with S3 key patterns, a
      # "*/<stack>/*" and "*/<stack>-*" pair per stack
      # (stacks/orgs/fnx/root/us-east-1.yaml); this evaluates them against
      # every s3-backend state key and fails one not matched by exactly its
      # stage's roles. Also run by validate-all (validate-enhanced.yaml).
      - name: check-state-keys
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_state_keys.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-state-keys.py < "$stacks_json"
      # Stacks of one account and region (a stage stack and its lanes,
      # settings.context.name) and the instances in them may not create the
      # same name, tags.Environment, account singleton or secret.
      - name: check-lane-names
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_lane_names.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-lane-names.py < "$stacks_json"
      # The templates/stacks samples, copied in as the lanes their headers name,
      # resolve and pass the stack checks beside the real stacks (plan-sweep
      # covers them in validate-enhanced's plan-sweep workflow).
      - name: stack-samples
        type: shell
        command: bash scripts/check-stack-samples.sh
      # iam/ci's lambda uploader role names its stage's s3/lambda-artifacts
      # bucket and kms/main alias instead of reading their state (it applies
      # first); this fails when either stops matching, and when an enabled
      # lambda's s3_key is not a released <function_name>/<version>.zip.
      - name: check-lambda-packages
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_lambda_packages.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-lambda-packages.py < "$stacks_json"
      # secretsmanager types `secrets` as map(object), whose conversion drops
      # an undeclared attribute silently (pasword_length plans clean and the
      # default applies); this fails any entry key variables.tf does not declare.
      # Also run by validate-all.
      - name: check-secret-attributes
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_secret_attributes.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-secret-attributes.py components/terraform < "$stacks_json"
      # A component that configures a kubernetes/helm/kubectl provider needs
      # the EKS API, which GitHub-hosted runners cannot reach where the
      # endpoint is private: each such instance must set
      # settings.github.actions_enabled: false (docs/OPERATIONS.md,
      # "In-cluster components"), and each eks cluster admin role there
      # (map_additional_iam_roles) must be trusted by its stage's state write
      # role; a cluster with none only warns. Also run by validate-all.
      - name: check-cluster-api-ci
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_cluster_api_ci.py workflows/scripts/common/test_ci_components.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-cluster-api-ci.py components/terraform < "$stacks_json"
      # backend/main trusts each stack's CI roles as literal ARNs; this fails
      # an iam/ci plan or apply role (<ci_role_name_prefix>-plan/-apply) its
      # stage's backend read or write role does not trust. Also run by validate-all.
      - name: check-ci-state-roles
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_ci_state_roles.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-ci-state-roles.py < "$stacks_json"
      # The stack templates leave the prod values of their rds and elasticache
      # instances to the importing stack; this fails a stage prod instance
      # without them (deletion protection, Multi-AZ/failover, final snapshot,
      # 7+ days of backups or snapshots). Also run by validate-all.
      - name: check-prod-protection
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_prod_protection.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-prod-protection.py components/terraform < "$stacks_json"
      # First-deploy preflight, WARN-ONLY here: the repo holds placeholders
      # (account and organization IDs, example domains and alert addresses,
      # empty EKS admin roles...) until the first deploy, so lint prints each
      # one and never fails on them (--warn exits 0). bootstrap.yaml runs the
      # same check fatally before anything touches AWS.
      # docs/OPERATIONS.md#first-deploy-inputs.
      - name: first-deploy-inputs
        type: shell
        command: |
          set -eu
          python3 -m unittest workflows/scripts/common/test_check_first_deploy_inputs.py
          stacks_json="$(mktemp)"
          trap 'rm -f "$stacks_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-first-deploy-inputs.py --warn < "$stacks_json"
      - type: toast
        level: success
        content: Lint checks passed

  tflint-init:
    description: Install tflint and the provider plugins declared in .tflint.hcl
    dependencies:
      tools:
        tflint: "v0.64.0"
    steps:
      - name: tflint-plugins
        type: shell
        command: tflint --init --config .tflint.hcl

  # Workflow files are not Terraform or Atmos config, so nothing above reads them:
  # a PR that only touches cd/drift/dr/emulator workflows would otherwise get no
  # static check. Tags carry a `v` prefix. shellcheck is not pinned here: the toolchain
  # does not unpack its .tar.xz release (the binary stays an XZ archive and
  # actionlint dies with "exec format error"). CI installs the distro
  # package (apt-get/apk, in the actionlint job) and actionlint finds it on
  # PATH; locally, install shellcheck (e.g. `brew install shellcheck`). Without
  # shellcheck on PATH actionlint skips the run-block checks silently.
  actionlint:
    description: Lint GitHub Actions workflows (actionlint)
    dependencies:
      tools:
        rhysd/actionlint: "v1.7.12"
    steps:
      - name: actionlint
        type: shell
        command: actionlint -color

  security-scan:
    description: Scan Terraform code with Trivy and Checkov (SARIF in reports/); fails on HIGH/CRITICAL findings
    dependencies:
      tools:
        trivy: "v0.75.0"
        checkov: "3.3.21"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      # This always-soft-fail pass measures real coverage (resources scanned,
      # parsing errors) and fails the job if it collapses, independent of
      # whether the gate below happens to pass.
      # --quiet is deliberately NOT passed here (unlike the `checkov` gate
      # step below): checkov's JSON output only includes the per-file
      # `results.parsing_errors` list (needed by the guard below) when --quiet
      # is absent -- with --quiet, get_dict() takes the "is_quiet" branch and
      # drops everything except summary + failed_checks. This step's own
      # console output is still suppressed by `output: none`.
      - name: checkov-coverage
        type: shell
        output: none
        command: >-
          checkov --directory components/terraform --framework terraform --skip-path '/tests/'
          --output json --output-file-path reports --soft-fail --compact
      - name: checkov-coverage-guard
        type: script
        interpreter: python3
        script: |
          import json
          import os
          import subprocess
          import sys

          with open("reports/results_json.json") as f:
              data = json.load(f)

          # On a total scan collapse (zero resources matched) checkov skips the
          # per-report "results"/"summary" wrapper and returns Report("").get_summary()
          # flat at the top level; with more than one matched framework it returns a
          # list of per-framework report dicts instead of one dict. Normalize all
          # three shapes so this guard prints a clear message instead of a KeyError.
          reports = data if isinstance(data, list) else [data]
          summaries = [r.get("summary", r) for r in reports]

          passed = sum(s.get("passed", 0) for s in summaries)
          failed = sum(s.get("failed", 0) for s in summaries)
          skipped = sum(s.get("skipped", 0) for s in summaries)
          parsing_errors = sum(s.get("parsing_errors", 0) for s in summaries)
          resources = sum(s.get("resource_count", 0) for s in summaries)

          print(
              f"checkov coverage: {resources} resources scanned in "
              f"components/terraform ({passed} passed, {failed} failed, "
              f"{skipped} skipped, {parsing_errors} parsing errors)"
          )

          # A file checkov can't parse is scanned as if it doesn't exist: any check
          # that resolves a var.* default from it (e.g. the SNS/SQS encryption
          # checks CKV_AWS_26/CKV_AWS_27) then evaluates an unresolved string and
          # can silently false-pass. Fail loudly instead of letting a parsing
          # failure hide in the count the way it used to.
          if parsing_errors > 0:
              parse_error_files = [
                  path
                  for r in reports
                  for path in r.get("results", {}).get("parsing_errors", [])
              ]
              print(f"FAIL: checkov could not parse {parsing_errors} file(s):")
              for path in parse_error_files:
                  print(f"  - {path}")
                  # checkov logs the parser exception only at DEBUG; re-run just this
                  # file (failure path only) and print the lark error, which names the
                  # line and the unexpected token. The usual cause is a unary !x/-x
                  # ending a line before a leading && / || (see
                  # scripts/check-hcl-unary-newline.py, run by `atmos workflow lint`).
                  try:
                      debug = subprocess.run(
                          ["checkov", "-f", path, "--framework", "terraform", "--quiet", "--compact"],
                          env={**os.environ, "LOG_LEVEL": "DEBUG"},
                          capture_output=True,
                          text=True,
                      )
                  except OSError as exc:
                      print(f"    could not re-run checkov for the parser error: {exc}")
                      continue
                  errors = [
                      line.strip()
                      for line in (debug.stdout + debug.stderr).splitlines()
                      if line.startswith("lark.exceptions.")
                  ]
                  print(f"    {errors[-1] if errors else 'no parser exception in the DEBUG log'}")
              sys.exit(1)

          # components/terraform currently yields ~570 resources across every
          # root module. A collapse to a handful means checkov stopped actually
          # scanning almost everything.
          # Lower this only alongside a deliberate removal of components.
          min_resources = 400
          if resources < min_resources:
              print(
                  f"FAIL: only {resources} resources scanned, expected at "
                  f"least {min_resources} -- checkov coverage collapsed"
              )
              sys.exit(1)

          # A single global count can still hide a real regression -- e.g. ten
          # small components dropped by a bad --skip-path while a couple of large
          # ones gain resources elsewhere. Assert every components/terraform/*
          # directory that has its own .tf files is actually represented in the
          # scan's check results.
          scanned_dirs = set()
          for r in reports:
              for key in ("passed_checks", "failed_checks", "skipped_checks"):
                  for check in r.get("results", {}).get(key, []):
                      top = check.get("file_path", "").lstrip("/").split("/", 1)[0]
                      if top:
                          scanned_dirs.add(top)

          terraform_root = "components/terraform"
          expected_dirs = {
              name
              for name in os.listdir(terraform_root)
              if os.path.isdir(os.path.join(terraform_root, name))
              and any(
                  f.endswith(".tf")
                  for _, _, files in os.walk(os.path.join(terraform_root, name))
                  for f in files
              )
          }

          missing = sorted(expected_dirs - scanned_dirs)
          if missing:
              print(
                  f"FAIL: {len(missing)} components/terraform/* module(s) with "
                  f".tf files are missing from the checkov scan: {', '.join(missing)}"
              )
              sys.exit(1)
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              cache=$(mktemp -d); trap 'rm -rf "$cache"' EXIT;
              trivy config --cache-dir "$cache" --skip-check-update --skip-dirs '**/tests'
              --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 1 components/terraform
          # Checkov only knows check severities with a Prisma Cloud API key; without
          # one, a failed check matches neither list and therefore fails the gate.
          # --skip-path '/tests/' and trivy's --skip-dirs '**/tests' (every run here):
          # terraform test helper modules (e.g.
          # eks/tests/unknown_subnet_ids, which links the component's own files)
          # are not deployed code.
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform --skip-path '/tests/'
              --output sarif --output-file-path reports --quiet
              --soft-fail-on LOW,MEDIUM --hard-fail-on HIGH,CRITICAL

  security-scan-report:
    description: Report-only scan for the nightly workflow (SARIF in reports/); never fails on findings
    dependencies:
      tools:
        trivy: "v0.75.0"
        checkov: "3.3.21"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      # Report-only job (SARIF findings never fail it), but a silent coverage
      # collapse here would still look like a healthy run in the nightly log
      # and the SARIF published to code scanning. Print-only, same shape as
      # `security-scan`'s checkov-coverage-guard, but never exits non-zero.
      - name: checkov-coverage
        type: shell
        output: none
        command: >-
          checkov --directory components/terraform --framework terraform --skip-path '/tests/'
          --output json --output-file-path reports --soft-fail --compact
      - name: checkov-coverage-print
        type: script
        interpreter: python3
        script: |
          import json

          with open("reports/results_json.json") as f:
              data = json.load(f)

          reports = data if isinstance(data, list) else [data]
          summaries = [r.get("summary", r) for r in reports]

          passed = sum(s.get("passed", 0) for s in summaries)
          failed = sum(s.get("failed", 0) for s in summaries)
          skipped = sum(s.get("skipped", 0) for s in summaries)
          parsing_errors = sum(s.get("parsing_errors", 0) for s in summaries)
          resources = sum(s.get("resource_count", 0) for s in summaries)

          print(
              f"checkov coverage: {resources} resources scanned in "
              f"components/terraform ({passed} passed, {failed} failed, "
              f"{skipped} skipped, {parsing_errors} parsing errors)"
          )
          if parsing_errors > 0:
              parse_error_files = [
                  path
                  for r in reports
                  for path in r.get("results", {}).get("parsing_errors", [])
              ]
              print(f"WARNING: checkov could not parse {parsing_errors} file(s):")
              for path in parse_error_files:
                  print(f"  - {path}")
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              cache=$(mktemp -d); trap 'rm -rf "$cache"' EXIT;
              trivy config --cache-dir "$cache" --skip-check-update --skip-dirs '**/tests'
              --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 0 components/terraform
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform --skip-path '/tests/'
              --output sarif --output-file-path reports --soft-fail --quiet
      # checkov writes each inline `#checkov:skip=<ID>:<reason>` as a SARIF result
      # with `suppressions`, and GitHub code scanning lists those as open alerts
      # (76 of them). The skip and its reason live beside the code; drop them
      # from the published SARIF so the alerts are only real findings. SARIF
      # 2.1.0 (3.35): a result is suppressed when it has a suppression whose
      # status is "accepted" or absent; "underReview"/"rejected" ones are not,
      # so a result whose suppressions are all of those is kept.
      - name: drop-suppressed-sarif-results
        type: script
        interpreter: python3
        script: |
          import glob
          import json


          def suppressed(result):
              return any(
                  s.get("status", "accepted") == "accepted"
                  for s in result.get("suppressions") or []
              )


          for path in sorted(glob.glob("reports/*.sarif")):
              with open(path) as f:
                  sarif = json.load(f)
              dropped = 0
              for run in sarif.get("runs", []):
                  results = run.get("results") or []
                  kept = [r for r in results if not suppressed(r)]
                  dropped += len(results) - len(kept)
                  run["results"] = kept
              with open(path, "w") as f:
                  json.dump(sarif, f)
              print(f"{path}: dropped {dropped} suppressed result(s)")

# Static checks for Terraform code and YAML config. Tools are installed by the
# Atmos toolchain from `dependencies.tools`.
#
# Usage:
#   atmos workflow lint -f lint
#   atmos workflow tflint-init -f lint            # install tflint + its .tflint.hcl plugins (network)
#   atmos workflow security-scan -f lint          # PR gate: SARIF reports, fails on NEW HIGH/CRITICAL
#   atmos workflow security-scan-report -f lint   # nightly: full backlog (no baselines), never fails
#   atmos workflow security-baseline -f lint      # regenerate .trivyignore.yaml and .checkov.baseline
#
# The PR gates (lint, security-scan) only fail on findings that are not in the
# committed baselines (.trivyignore.yaml, .checkov.baseline). Regenerate the
# baselines deliberately, to burn findings down, never to make a PR pass.
#
# tflint and trivy publish GitHub release tags with a `v` prefix (v0.64.0,
# v0.74.0) and sign each release with a GitHub Attestation tied to that exact
# tag ref. The toolchain's cosign verification compares the pin here against
# `refs/tags/<pin>`, so an unprefixed pin ("0.64.0") never matches the
# certificate's workflow ref and install fails with "expected GitHub Workflow
# Ref not found in certificate" (tflint) / "expected GithubWorkflowRef to be
# ...got refs/tags/v0.74.0" (trivy). Keep the `v`. terraform, go-yamllint,
# jq, aws-cli and checkov are verified differently (or their upstream tags
# have no `v`) and are confirmed to install correctly unprefixed.
workflows:
  lint:
    description: Lint Terraform code, YAML files and run a Terraform security scan
    dependencies:
      tools:
        terraform: "1.16.3"
        tflint: "v0.64.0"
        wasilibs/go-yamllint: "1.38.0"
        trivy: "v0.74.0"
    steps:
      - name: validate-config
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate config
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: security-scan
            type: shell
            command: trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml components/terraform
      # No-op when the plugins are already installed (CI runs tflint-init first,
      # with a token for GitHub rate limits, so this step needs no network).
      - name: tflint-plugins
        type: shell
        command: tflint --init --config .tflint.hcl
      - name: tflint
        type: atmos
        command: terraform lint
      # `atmos terraform lint` above lints stack INSTANCES, so a component with no
      # stack instance is never looked at. Ten of the twenty-three components were
      # in that state, and the gate reported "passed" while never opening them.
      # This step lints every component DIRECTORY, so an unwired component cannot
      # go unlinted again.
      #
      # KEEP BOTH. They fail on disjoint classes, and each is blind to the other's:
      #
      #   - Directory-only catches: an unused declaration in a component no stack
      #     instantiates. Reintroducing one in eks-addons had the instance pass
      #     report "23 components linted, no findings" while this step caught it.
      #
      #   - Instance-only catches: a rule that aborts on an unresolved variable.
      #     Replacing apigateway's `try(var.tags["Environment"], "default")` with a
      #     bare index made tflint abort aws_cloudwatch_log_group_invalid_name with
      #     "Failed to check ruleset" on both apigateway instances. This step never
      #     saw it: without stack vars the directory pass does not reach that
      #     evaluation at all. See the comment in apigateway/main.tf.
      #
      # So the instance pass resolves stack variables and catches what only shows
      # up with real inputs; the directory pass guarantees coverage. Dropping
      # either reopens a class of failure that has already happened once.
      - name: tflint-components
        type: script
        interpreter: bash
        script: |
          set -uo pipefail
          config="$PWD/.tflint.hcl"
          failed=""
          for dir in components/terraform/*/; do
            component=$(basename "$dir")
            # _library holds shared sub-modules, not root modules; skip it and any
            # directory that has no Terraform files of its own.
            [ "$component" = "_library" ] && continue
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            # --no-color so the Warning:/Error: prefixes below match.
            if ! output=$(tflint --no-color --config "$config" --chdir "$dir" 2>&1); then
              failed="$failed $component"
              count=$(printf '%s\n' "$output" | grep -cE '^(Warning|Error):')
              rules=$(printf '%s\n' "$output" | grep -oE '\([a-z0-9_]+\)$' \
                | tr -d '()' | sort -u | paste -sd, -)
              if [ -n "$rules" ]; then
                echo "  $component: $count finding(s) [$rules]"
              else
                # Non-zero exit with no rule name means tflint failed rather than
                # found something (parse error, bad config, missing plugin). A
                # rule summary would say nothing, so show what it reported.
                echo "  $component: tflint failed to run:"
                printf '%s\n' "$output" | sed 's/^/    /'
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "tflint found issues in:$failed"
            echo "Re-run one component with: tflint --config .tflint.hcl --chdir components/terraform/<component>/"
            exit 1
          fi
          echo "tflint: all component directories clean"
      - type: toast
        level: success
        content: Lint checks passed

  tflint-init:
    description: Install tflint and the provider plugins declared in .tflint.hcl
    dependencies:
      tools:
        tflint: "v0.64.0"
    steps:
      - name: tflint-plugins
        type: shell
        command: tflint --init --config .tflint.hcl

  security-scan:
    description: Scan Terraform code with Trivy and Checkov (SARIF in reports/); fails on HIGH/CRITICAL findings
    dependencies:
      tools:
        trivy: "v0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      # checkov's --baseline flag (used by the `checkov` step below) reduces the
      # printed passed/failed/skipped counts to only the delta versus baseline:
      # checkov/common/output/baseline.py Baseline.compare_and_reduce_reports()
      # keeps a passed/skipped check only if it matches a baseline entry, and
      # drops a failed check that matches one -- everything else (the vast
      # majority of a healthy scan) is filtered out of the report entirely.
      # That is correct for a burn-down gate (fail only on genuinely NEW
      # findings), but it means the baselined run's own summary line stays
      # near-zero even when every component was fully scanned, which is what
      # made this gate look like it had stopped scanning. This unbaselined,
      # always-soft-fail pass measures real coverage and fails the job if it
      # collapses, independent of whether the baselined gate below happens to
      # pass.
      - name: checkov-coverage
        type: shell
        output: none
        command: >-
          checkov --directory components/terraform --framework terraform
          --output json --output-file-path reports --soft-fail --quiet --compact
      - name: checkov-coverage-guard
        type: script
        interpreter: python3
        script: |
          import json
          import sys

          with open("reports/results_json.json") as f:
              summary = json.load(f)["summary"]

          passed = summary.get("passed", 0)
          failed = summary.get("failed", 0)
          skipped = summary.get("skipped", 0)
          parsing_errors = summary.get("parsing_errors", 0)
          resources = summary.get("resource_count", 0)

          print(
              f"checkov coverage: {resources} resources scanned in "
              f"components/terraform ({passed} passed, {failed} failed, "
              f"{skipped} skipped, {parsing_errors} parsing errors)"
          )

          # components/terraform currently yields ~570 resources across every
          # root module. A collapse to a handful (as happened when this number
          # was only ever read off the --baseline run below, see the comment
          # above) means checkov stopped actually scanning almost everything.
          # Lower this only alongside a deliberate removal of components.
          min_resources = 400
          if resources < min_resources:
              print(
                  f"FAIL: only {resources} resources scanned, expected at "
                  f"least {min_resources} -- checkov coverage collapsed"
              )
              sys.exit(1)
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              trivy config --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml components/terraform
          # Checkov only knows check severities with a Prisma Cloud API key; without
          # one, a failed check matches neither list and therefore fails the gate.
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform
              --output sarif --output-file-path reports --quiet
              --soft-fail-on LOW,MEDIUM --hard-fail-on HIGH,CRITICAL --baseline .checkov.baseline

  security-scan-report:
    description: Report-only scan for the nightly workflow (SARIF in reports/); never fails on findings
    dependencies:
      tools:
        trivy: "v0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: trivy
            type: shell
            command: >-
              trivy config --format sarif --output reports/trivy.sarif
              --severity HIGH,CRITICAL --exit-code 0 components/terraform
          - name: checkov
            type: shell
            command: >-
              checkov --directory components/terraform --framework terraform
              --output sarif --output-file-path reports --soft-fail --quiet

  security-baseline:
    description: Regenerate the PR-gate baselines (.trivyignore.yaml, .checkov.baseline) from the current code
    dependencies:
      tools:
        trivy: "v0.74.0"
        checkov: "3.3.19"
    steps:
      - name: reports-dir
        type: shell
        command: mkdir -p reports
      - name: trivy-findings
        type: shell
        output: none
        command: >-
          trivy config --format json --output reports/trivy-baseline.json
          --severity HIGH,CRITICAL --exit-code 0 components/terraform
      - name: trivy-baseline
        type: script
        interpreter: python3
        script: |
          import datetime, json

          findings = set()
          for result in json.load(open("reports/trivy-baseline.json")).get("Results") or []:
              for m in result.get("Misconfigurations") or []:
                  if m.get("Status") == "FAIL":
                      findings.add((m["ID"], result["Target"]))
          lines = [
              f"# Trivy baseline {datetime.date.today()} - burn down, don't add.",
              "# HIGH/CRITICAL misconfigurations present when the baseline was taken; the PR",
              "# gate ignores exactly these (rule, file) pairs. Regenerate with",
              "# `atmos workflow security-baseline -f lint`.",
              "misconfigurations:",
          ]
          for rule, target in sorted(findings):
              lines += [f"  - id: {rule}", "    paths:", f'      - "{target}"']
          open(".trivyignore.yaml", "w").write("\n".join(lines) + "\n")
          print(f"{len(findings)} trivy findings baselined")
      - name: checkov-baseline
        type: shell
        output: none
        command: >-
          checkov --directory components/terraform --framework terraform
          --create-baseline --soft-fail --quiet --compact
      - name: move-checkov-baseline
        type: shell
        command: mv components/terraform/.checkov.baseline .checkov.baseline

# Provision components for real against the local Floci AWS emulator.
#
# This is the only gate in the repo that actually executes Terraform. Everything
# else - fmt, validate, tflint, checkov, trivy - is static analysis, and static
# analysis has already been shown to miss real defects here (a NAT gateway that
# was created despite enable_nat_gateway = false, and an IAM coalesce() that
# would have failed every plan).
#
# Requires a container runtime (Docker or Podman). No AWS account, no
# credentials, no cost.
#
# Usage:
#   atmos workflow sandbox -f sandbox          # up, apply everything, destroy, down
#   atmos workflow sandbox-up -f sandbox       # just start the emulator
#   atmos workflow sandbox-down -f sandbox     # stop and remove it
#
# Components not listed here cannot be exercised against Floci; the gaps are
# documented in stacks/orgs/fnx/local/eu-west-2/sandbox.yaml. rds is the notable
# one - CreateDBSubnetGroup is unimplemented - so it is exercised against
# LocalEmu instead, in the fnx-local-localemu lane, via `atmos workflow localemu
# -f localemu` (workflows/localemu.yaml) and .github/workflows/emulator.yml in CI.
#
# Worth the reminder: adding lambda here immediately found that every lambda
# instance in dev, staging and prod was uncreatable, because none named a
# deployment package and aws_lambda_function requires one at apply time. Six
# green static gates had said otherwise. Coverage here is not a formality.
workflows:
  sandbox-up:
    description: Start (or reuse) the local AWS emulator
    steps:
      - type: shell
        name: up
        command: atmos emulator up aws -s fnx-local-sandbox

  sandbox-down:
    description: Stop and remove the local AWS emulator
    steps:
      - type: shell
        name: down
        command: atmos emulator down aws -s fnx-local-sandbox

  sandbox:
    description: Apply every sandbox component against the emulator, then destroy it
    dependencies:
      tools:
        terraform: "1.16.3"
    steps:
      - type: shell
        name: validate
        command: atmos validate stacks

      - type: shell
        name: up
        command: atmos emulator up aws -s fnx-local-sandbox

      # Applied in dependency order: kms and vpc first, then what reads them.
      - type: shell
        name: apply-kms
        command: atmos terraform apply kms/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: apply-vpc
        command: atmos terraform apply vpc/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: apply-dns
        command: atmos terraform apply network/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: apply-secretsmanager
        command: atmos terraform apply secretsmanager/app -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: apply-ecs
        command: atmos terraform apply ecs/main -s fnx-local-sandbox --identity local-aws -auto-approve

      # lambda needs a deployment package to EXIST before apply: the provider
      # rejects a function with none, which is how every real instance in this
      # repo was found to be uncreatable. The package is built here rather than
      # committed - it is application output, and this is an infrastructure
      # repo. The path matches `filename` on lambda/main in the sandbox stack.
      - type: shell
        name: build-lambda-package
        command: |
          set -eu
          dir=/tmp/tf-atmos-sandbox
          rm -rf "$dir" && mkdir -p "$dir"
          printf 'def handler(event, context):\n    return {"statusCode": 200, "body": "ok"}\n' > "$dir/main.py"
          (cd "$dir" && zip -q lambda.zip main.py)
          echo "built $dir/lambda.zip"
      - type: shell
        name: apply-lambda
        command: atmos terraform apply lambda/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: apply-cognito
        command: atmos terraform apply cognito/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: apply-securitygroup
        command: atmos terraform apply securitygroup/app -s fnx-local-sandbox --identity local-aws -auto-approve

      # Destroy proves teardown works, and leaves the emulator clean for the
      # next run. Reverse order.
      - type: shell
        name: destroy-securitygroup
        command: atmos terraform destroy securitygroup/app -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-cognito
        command: atmos terraform destroy cognito/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-lambda
        command: atmos terraform destroy lambda/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-ecs
        command: atmos terraform destroy ecs/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-secretsmanager
        command: atmos terraform destroy secretsmanager/app -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-dns
        command: atmos terraform destroy network/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-vpc
        command: atmos terraform destroy vpc/main -s fnx-local-sandbox --identity local-aws -auto-approve
      - type: shell
        name: destroy-kms
        command: atmos terraform destroy kms/main -s fnx-local-sandbox --identity local-aws -auto-approve

      - type: shell
        name: down
        command: atmos emulator down aws -s fnx-local-sandbox

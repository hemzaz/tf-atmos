# Deploy a stack template from stacks/catalog/templates. A template's
# components are named `<prefix>/<name>` (e.g. serverless-api/cognito); the
# stack must import the template (e.g. `- catalog/templates/serverless-api`).
# Atmos orders the selected components by their dependencies.components.
#
# Usage:
#   atmos workflow deploy -f deploy-template -s <stack>            # choose a template
#   atmos workflow deploy-<template> -f deploy-template -s <stack> # quick deploy
#   atmos workflow deploy-parallel -f deploy-template -s <stack>   # concurrent deploy
workflows:
  deploy:
    description: Complete template deployment with validation, plan review and verification
    steps:
      - name: template
        type: choose
        prompt: Template to deploy
        options: [web-application, microservices, serverless-api, data-pipeline, batch-processing]
      - name: validate
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate stacks
      - name: plan
        type: atmos
        command: terraform plan --log-order grouped --query '.atmos_component | test("^{{ .steps.template.value }}/")'
      - name: confirm
        type: confirm
        prompt: Apply the {{ .steps.template.value }} plans above?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.atmos_component | test("^{{ .steps.template.value }}/")'
      - name: verify
        type: atmos
        command: terraform plan --skip-planfile --hide no-changes --query '.atmos_component | test("^{{ .steps.template.value }}/")'
      - type: toast
        level: success
        content: Template {{ .steps.template.value }} deployed

  deploy-web-app:
    description: Quick deploy of the web-application template (catalog/templates/web-application)
    steps:
      - name: deploy
        type: atmos
        command: terraform deploy --query '.atmos_component | test("^web-application/")'

  deploy-microservices:
    description: Quick deploy of the microservices-platform template (catalog/templates/microservices-platform)
    steps:
      - name: deploy
        type: atmos
        command: terraform deploy --query '.atmos_component | test("^microservices/")'

  deploy-serverless:
    description: Quick deploy of the serverless-api template (catalog/templates/serverless-api)
    steps:
      - name: deploy
        type: atmos
        command: terraform deploy --query '.atmos_component | test("^serverless-api/")'

  deploy-data-pipeline:
    description: Quick deploy of the data-pipeline template (catalog/templates/data-pipeline)
    steps:
      - name: deploy
        type: atmos
        command: terraform deploy --query '.atmos_component | test("^data-pipeline/")'

  deploy-batch:
    description: Quick deploy of the batch-processing template (catalog/templates/batch-processing)
    steps:
      - name: deploy
        type: atmos
        command: terraform deploy --query '.atmos_component | test("^batch-processing/")'

  deploy-parallel:
    description: Deploy a template running independent components concurrently
    steps:
      - name: template
        type: choose
        prompt: Template to deploy
        options: [web-application, microservices, serverless-api, data-pipeline, batch-processing]
      - name: deploy
        type: atmos
        command: terraform deploy --max-concurrency 4 --query '.atmos_component | test("^{{ .steps.template.value }}/")'

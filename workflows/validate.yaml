# Validate stack configuration for one stack and every Terraform root module.
#
# Usage: atmos workflow validate -f validate -s <stack>
workflows:
  validate:
    description: Validate atmos.yaml, stack manifests and Terraform components in a stack
    dependencies:
      tools:
        terraform: "1.16.3"
    steps:
      - name: validate-config
        type: atmos
        command: validate config
      - name: validate-stacks
        type: atmos
        command: validate stacks
      - name: terraform-fmt
        type: shell
        command: terraform fmt -check -recursive components/terraform
      - name: describe-stack
        type: atmos
        command: describe stacks --process-functions=false --format json
        output: none
      - name: validate-root-modules
        type: atmos
        command: workflow validate-all -f validate-enhanced --from-step validate-root-modules

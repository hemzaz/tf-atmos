# Disaster recovery runbooks. Scripts resolve tenant/region/state bucket from
# the stack via `atmos describe component` (workflows/scripts/common/stack-context.sh).
#
# Usage:
#   STACK=<stack> atmos workflow dr-status -f disaster-recovery
#   STACK=<stack> atmos workflow dr-failover -f disaster-recovery
#   STACK=<stack> atmos workflow dr-failback -f disaster-recovery
#   STACK=<stack> COMPONENT_PREFIX=<component>/ atmos workflow recover-state -f disaster-recovery
#   STACK=<stack> atmos workflow recover-database -f disaster-recovery
#
# Interactive prompts default to their environment variable (STACK, ...). With a
# terminal they prompt, pre-filled; without one (CI, .github/workflows/
# disaster-recovery.yml) Atmos uses the default without prompting, so CI must
# set STACK. dr-failover and dr-failback confirm with default false and so
# always stop in CI; they are operator-only.
workflows:
  dr-status:
    description: Check disaster recovery readiness and status
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: status
        type: shell
        command: ./workflows/scripts/dr/dr-status.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  dr-failover:
    description: Execute failover to the disaster recovery region (guided runbook)
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: target_region
        type: input
        prompt: DR target region
        default: us-east-2
      - name: warning
        type: toast
        level: warning
        content: Failover of {{ .steps.stack.value }} to {{ .steps.target_region.value }} - only in a real disaster scenario
      - name: confirm
        type: confirm
        prompt: Initiate failover to {{ .steps.target_region.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failover cancelled."; exit 1; }
      - name: runbook
        type: markdown
        content: |
          **Failover runbook ({{ .steps.stack.value }} -> {{ .steps.target_region.value }})**
          Prod only: fnx-ue1-prod fails over to fnx-ue2-prod. Details and commands:
          docs/OPERATIONS.md, "Disaster recovery".
          1. Freeze other merges to master (CD applies every merge).
          2. DNS: api.<domain> moves to {{ .steps.target_region.value }} when the primary's Route 53
             health check fails; force it with
             `aws route53 update-health-check --health-check-id <ue1 id> --inverted`.
          3. Database: PR `replicate_source_db: null` on fnx-ue2-prod rds/main (promotes the replica).
          4. Cache: `aws elasticache failover-global-replication-group --primary-region {{ .steps.target_region.value }}
             --primary-replication-group-id ue2-prod-cache --global-replication-group-id <id>`.
          5. PR on fnx-ue2-prod: eks/main node groups to fnx-ue1-prod's sizes,
             eks-backend-services/main enabled; deploy it in-VPC.
          6. Verify: `curl -sf https://api.<domain>/`, then dr-status for fnx-ue2-prod.

  dr-failback:
    description: Execute failback to the primary region (guided runbook)
    steps:
      - name: checklist
        type: markdown
        content: |
          **Failback checklist**
          1. Verify the primary region is healthy.
          2. Ensure data synchronization from DR to primary is complete.
          3. Plan a maintenance window.
          4. Notify stakeholders.
      - name: confirm
        type: confirm
        prompt: Checklist complete - proceed with failback?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failback cancelled."; exit 1; }
      - name: runbook
        type: markdown
        content: |
          **Failback steps** (docs/OPERATIONS.md, "Disaster recovery")
          1. Recreate fnx-ue1-prod rds/main as a replica of fnx-ue2-prod's (replicate_source_db),
             promote it at zero lag, then make fnx-ue2-prod's a replica again.
          2. Move the cache primary back: failover-global-replication-group --primary-region us-east-1.
          3. Un-invert the primary's health check if it was forced; DNS returns to us-east-1.
          4. Revert fnx-ue2-prod to its warm sizes, eks-backend-services/main disabled.

  recover-state:
    description: List Terraform state object versions available for recovery
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: versions
        type: shell
        command: ./workflows/scripts/dr/recover-state.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  recover-database:
    description: List RDS snapshots and point-in-time recovery windows
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: snapshots
        type: shell
        command: ./workflows/scripts/dr/recover-database.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

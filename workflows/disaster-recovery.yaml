# Disaster recovery runbooks. Scripts resolve tenant/region/state bucket from
# the stack via `atmos describe component` (workflows/scripts/common/stack-context.sh).
#
# Usage:
#   STACK=<stack> atmos workflow dr-status -f disaster-recovery
#   STACK=<stack> atmos workflow dr-failover -f disaster-recovery
#   STACK=<stack> atmos workflow dr-failback -f disaster-recovery
#   STACK=<stack> COMPONENT_PREFIX=<component>/ atmos workflow recover-state -f disaster-recovery
#   STACK=<stack> atmos workflow recover-database -f disaster-recovery
#
# Interactive prompts default to their environment variable (STACK, ...). With a
# terminal they prompt, pre-filled; without one (CI, .github/workflows/
# disaster-recovery.yml) Atmos uses the default without prompting, so CI must
# set STACK. dr-failover and dr-failback confirm with default false and so
# always stop in CI; they are operator-only.
workflows:
  dr-status:
    description: Check disaster recovery readiness and status
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: status
        type: shell
        command: ./workflows/scripts/dr/dr-status.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  dr-failover:
    description: Execute failover to the disaster recovery region (guided runbook)
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: target_region
        type: input
        prompt: DR target region
        default: us-east-2
      - name: warning
        type: toast
        level: warning
        content: Failover of {{ .steps.stack.value }} to {{ .steps.target_region.value }} - only in a real disaster scenario
      - name: confirm
        type: confirm
        prompt: Initiate failover to {{ .steps.target_region.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failover cancelled."; exit 1; }
      - name: runbook
        type: markdown
        content: |
          **Failover runbook ({{ .steps.stack.value }} -> {{ .steps.target_region.value }}), CLI-first**
          Prod only: fnx-ue1-prod fails over to fnx-ue2-prod. The state bucket may be down with
          us-east-1, so no step needs Terraform. Commands: docs/OPERATIONS.md, "Disaster recovery".
          1. Freeze CD: `gh workflow disable terraform-cd.yml`; merge nothing until reconciled.
          2. DNS moves by itself when the primary's Route 53 health check fails (alarm on ue1-main-alarms);
             force it with `aws route53 update-health-check --health-check-id <ue1 id> --inverted`.
          3. Database: `aws rds promote-read-replica --db-instance-identifier ue2-prod-main-db --region {{ .steps.target_region.value }}`,
             then `aws rds modify-db-instance ... --manage-master-user-password --master-user-secret-kms-key-id alias/ue2-main`.
          4. Cache: `aws elasticache failover-global-replication-group --region {{ .steps.target_region.value }}
             --primary-region {{ .steps.target_region.value }} --primary-replication-group-id ue2-prod-cache --global-replication-group-id <id>`.
          5. Node groups: `aws eks update-nodegroup-config --cluster-name ue2-main --nodegroup-name <ng>
             --scaling-config minSize=..,desiredSize=..,maxSize=..` to fnx-ue1-prod's sizes.
          6. Deploy eks-backend-services/main in-VPC (local state if the bucket is down; migrate later).
          7. Verify: `curl -sf https://api.<domain>/`, then dr-status for fnx-ue2-prod.
          After recovery, reconcile Terraform: fnx-ue2-prod rds/main without replicate_source_db (plan must be
          update-in-place, never a replacement), eks/main sizes, eks-backend-services/main enabled; apply no
          elasticache/main until failback.

  dr-failback:
    description: Execute failback to the primary region (guided runbook)
    steps:
      - name: checklist
        type: markdown
        content: |
          **Failback checklist**
          1. Verify the primary region is healthy.
          2. Ensure data synchronization from DR to primary is complete.
          3. Plan a maintenance window.
          4. Notify stakeholders.
      - name: confirm
        type: confirm
        prompt: Checklist complete - proceed with failback?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failback cancelled."; exit 1; }
      - name: runbook
        type: markdown
        content: |
          **Failback steps** (docs/OPERATIONS.md, "Disaster recovery"; replicate_source_db does not force a
          replacement, so each re-seed is an operator `-replace`, not a merge)
          1. Re-seed fnx-ue1-prod rds/main from us-east-2: `aws rds modify-db-instance --db-instance-identifier
             ue1-prod-main-db --no-deletion-protection --apply-immediately --region us-east-1`; set aside an existing
             ue1-prod-main-db-final-snapshot (copy to a dated name, delete); on a branch set replicate_source_db to
             ue2-prod-main-db's ARN (literal), then
             `atmos terraform apply rds/main -s fnx-ue1-prod -- -replace=aws_db_instance.main`; merge after.
          2. At ReplicaLag 0, with writes stopped: promote it by a PR removing replicate_source_db (plan check:
             update in place only).
          3. Cache primary back: failover-global-replication-group --primary-region us-east-1
             --primary-replication-group-id ue1-prod-cache.
          4. Un-invert the primary's health check if it was forced; DNS returns to us-east-1.
          5. Re-seed fnx-ue2-prod rds/main from us-east-1 the same way (deletion protection, final snapshot,
             replicate_source_db restored, `-replace=aws_db_instance.main` on fnx-ue2-prod).
          6. fnx-ue2-prod back to warm sizes (PR + desired sizes by CLI), eks-backend-services/main disabled.
          7. `gh workflow enable terraform-cd.yml`.

  recover-state:
    description: List Terraform state object versions available for recovery
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: versions
        type: shell
        command: ./workflows/scripts/dr/recover-state.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  recover-database:
    description: List RDS snapshots and point-in-time recovery windows
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: snapshots
        type: shell
        command: ./workflows/scripts/dr/recover-database.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

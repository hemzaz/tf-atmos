# Disaster recovery runbooks. Scripts resolve tenant/region/state bucket from
# the stack via `atmos describe component` (workflows/scripts/common/stack-context.sh).
#
# Usage:
#   STACK=<stack> atmos workflow dr-status -f disaster-recovery
#   STACK=<stack> atmos workflow dr-failover -f disaster-recovery
#   STACK=<stack> atmos workflow dr-failback -f disaster-recovery
#   STACK=<stack> COMPONENT_PREFIX=<component>/ atmos workflow recover-state -f disaster-recovery
#   STACK=<stack> atmos workflow recover-database -f disaster-recovery
workflows:
  dr-status:
    description: Check disaster recovery readiness and status
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: status
        type: shell
        command: ./workflows/scripts/dr/dr-status.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  dr-failover:
    description: Execute failover to the disaster recovery region (guided runbook)
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: target_region
        type: input
        prompt: DR target region
        default: us-east-1
      - name: warning
        type: toast
        level: warning
        content: Failover of {{ .steps.stack.value }} to {{ .steps.target_region.value }} - only in a real disaster scenario
      - name: confirm
        type: confirm
        prompt: Initiate failover to {{ .steps.target_region.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failover cancelled."; exit 1; }
      - name: runbook
        type: markdown
        content: |
          **Failover runbook ({{ .steps.stack.value }} -> {{ .steps.target_region.value }})**
          1. Promote the RDS read replica in {{ .steps.target_region.value }}
             (`aws rds promote-read-replica --db-instance-identifier <replica> --region {{ .steps.target_region.value }}`).
          2. Switch Route53 failover records to the DR endpoints.
          3. Verify application health in {{ .steps.target_region.value }}.
          4. Record the incident and notify stakeholders.

  dr-failback:
    description: Execute failback to the primary region (guided runbook)
    steps:
      - name: checklist
        type: markdown
        content: |
          **Failback checklist**
          1. Verify the primary region is healthy.
          2. Ensure data synchronization from DR to primary is complete.
          3. Plan a maintenance window.
          4. Notify stakeholders.
      - name: confirm
        type: confirm
        prompt: Checklist complete - proceed with failback?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Failback cancelled."; exit 1; }
      - name: runbook
        type: markdown
        content: |
          **Failback steps**
          1. Resync data from DR to primary.
          2. Shift DNS weights back to the primary region gradually.
          3. Demote the DR database back to a read replica.

  recover-state:
    description: List Terraform state object versions available for recovery
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: versions
        type: shell
        command: ./workflows/scripts/dr/recover-state.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  recover-database:
    description: List RDS snapshots and point-in-time recovery windows
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: snapshots
        type: shell
        command: ./workflows/scripts/dr/recover-database.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

# Compliance posture from AWS Security Hub standards, mapped to Atmos
# components by `atmos aws compliance report` (Security Hub must be enabled,
# see `atmos workflow harden -f security-hardening`).
#
# Usage:
#   atmos workflow check -f compliance-check -s <stack>
#   atmos workflow report -f compliance-check -s <stack>
workflows:
  check:
    description: Run compliance checks (CIS, FSBP, PCI DSS, ...) for one stack
    steps:
      - name: validate
        type: atmos
        command: validate stacks
      - name: report
        type: atmos
        command: aws compliance report

  report:
    description: Write a Markdown compliance report for one stack to compliance-report.md
    steps:
      - name: report
        type: atmos
        command: aws compliance report --file compliance-report.md
      - type: toast
        level: success
        content: Report written to compliance-report.md

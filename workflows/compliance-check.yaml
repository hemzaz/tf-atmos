# Compliance posture from AWS Security Hub standards, mapped to Atmos
# components by `atmos aws compliance report`. Security Hub must be enabled:
# the organization's (Cloud Posse aws-security-hub): the region's security
# stack's delegated administrator enables a member hub in every account
# (`atmos workflow deploy-security-org -f deploy-full-stack -s
# <tenant>-<env>-security`, after the security stack's own hub and the root
# stack's delegation; docs/OPERATIONS.md, Bootstrap order).
#
# Usage:
#   atmos workflow check -f compliance-check -s <stack>
#   atmos workflow report -f compliance-check -s <stack>
workflows:
  check:
    description: Run compliance checks (CIS, FSBP, ...) for one stack
    steps:
      - name: validate
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate stacks
      - name: report
        type: atmos
        command: aws compliance report

  report:
    description: Write a Markdown compliance report for one stack to compliance-report.md
    steps:
      - name: report
        type: atmos
        command: aws compliance report --file compliance-report.md
      - type: toast
        level: success
        content: Report written to compliance-report.md

# Security audit and account-level hardening.
#   security-audit - Security Hub findings mapped to components (read-only)
#   harden         - plan the cloudtrail/main, awsconfig/main, guardduty/main
#                    and securityhub/main components and print the plans
#                    BEFORE the confirm prompt, then apply
#                    exactly those planfiles (atmos terraform deploy
#                    --from-plan, never aws CLI create calls, so Terraform
#                    keeps sole ownership), report their status,
#                    enable default EBS encryption and the S3 account
#                    public-access block; report open SGs / VPCs without
#                    flow logs (workflows/scripts/security/harden.sh)
#   harden-iam     - account password policy (workflows/scripts/security/harden-iam.sh)
# Changes are applied only after confirmation; declining runs report-only.
#
# Usage:
#   atmos workflow security-audit -f security-hardening -s <stack>
#   STACK=<stack> atmos workflow harden -f security-hardening
#   STACK=<stack> atmos workflow harden-iam -f security-hardening
workflows:
  security-audit:
    description: Security audit of the stack from AWS Security Hub findings
    steps:
      - name: audit
        type: atmos
        command: aws compliance report --framework cis-aws

  harden:
    description: Plan cloudtrail/main, awsconfig/main, guardduty/main and securityhub/main, confirm, apply those plans, then apply account/region hardening (EBS, S3)
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      # Read-only: plan and print, so the prompt below confirms a plan the
      # operator has seen.
      - name: plan
        type: shell
        command: ./workflows/scripts/security/harden.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          HARDEN_PHASE: plan
          AWS_SDK_LOAD_CONFIG: "1"
      - name: confirm
        type: confirm
        prompt: Apply the cloudtrail/awsconfig/guardduty/securityhub plans above and the account hardening? (No = report only)
        default: false
      - name: harden
        type: shell
        command: ./workflows/scripts/security/harden.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AUTO_APPROVE: "{{ .steps.confirm.value }}"
          HARDEN_PHASE: apply
          AWS_SDK_LOAD_CONFIG: "1"

  harden-iam:
    description: Apply the IAM account password policy
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
        jqlang/jq: "1.8.2"
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: confirm
        type: confirm
        prompt: Update the account password policy? (No = report only)
        default: false
      - name: harden-iam
        type: shell
        command: ./workflows/scripts/security/harden-iam.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AUTO_APPROVE: "{{ .steps.confirm.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

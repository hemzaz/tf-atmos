# Local/ad-hoc drift check: a refresh-only style plan of every component in a
# stack; components without changes are hidden. Scheduled drift detection runs
# in .github/workflows/drift-detection.yml. Atmos Pro drift detection
# (settings.pro.drift_detection + `atmos terraform plan --upload-status`) is
# the upgrade path.
#
# Usage: atmos workflow drift-detection -f drift-detection -s <stack>
workflows:
  drift-detection:
    description: Detect drift between Terraform state and real infrastructure for a stack
    steps:
      - name: validate
        type: atmos
        command: validate stacks
      - name: plan
        type: atmos
        command: terraform plan --skip-planfile --failure-mode keep-going --log-order grouped --hide no-changes
      - type: markdown
        content: |
          **Remediation**
          - Expected change made outside Terraform: codify it in the stack config, then `atmos terraform deploy <component> -s <stack>`.
          - Unexpected change: re-apply the desired state with `atmos terraform deploy <component> -s <stack>`.
          - Resource created outside Terraform: `atmos workflow import -f import -s <stack>`.

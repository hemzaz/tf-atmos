# Plan every component of a stack (dependency order) without applying.
#
# Usage: atmos workflow plan -f plan-environment -s <stack>
workflows:
  plan:
    description: Generate Terraform execution plans for all components in a stack
    steps:
      - name: validate
        type: atmos
        command: validate stacks
      - name: plan
        type: atmos
        command: terraform plan --failure-mode keep-going --log-order grouped --hide no-changes

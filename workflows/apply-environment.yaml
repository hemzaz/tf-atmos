# Plan, review and apply every component of a stack. Atmos resolves the
# dependency order (dependencies.components) for multi-component runs.
#
# The whole stack is planned before anything is applied, so an instance that
# reads another's state (!terraform.state) plans against no state on a stack's
# first deploy: use `atmos workflow deploy -f deploy-full-stack` for that.
#
# Usage: atmos workflow apply -f apply-environment -s <stack>
# CI:    atmos terraform deploy -s <stack>   (no interactive confirmation)
workflows:
  apply:
    description: Apply Terraform changes to all components in a stack
    steps:
      # Template fixture stacks (stage "fixtures", stacks/orgs/fnx/fixtures) are
      # never deployed: refuse them (see deploy-full-stack.yaml). Without -s every
      # stack is selected, fixtures included, so that is refused too.
      - &fixtures-stages
        name: stages
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[].settings.context.stage] | unique | join(",")'
        output: none
      - &refuse-fixtures
        name: refuse-fixtures
        type: shell
        command: case '{{ .steps.stages.value }}' in *fixtures*) echo "Refusing a template fixture stack (stage fixtures), which is never deployed."; exit 1 ;; esac
      - name: validate
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate stacks
      - name: plan
        type: atmos
        command: terraform plan --failure-mode fail-fast --log-order grouped
      - name: confirm
        type: confirm
        prompt: Apply the plans above?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Apply cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --failure-mode fail-fast --log-order grouped
      - type: toast
        level: success
        content: All components applied

# Import an existing cloud resource into a component's Terraform state and
# show the follow-up plan so the config can be reconciled.
#
# Usage: atmos workflow import -f import -s <stack>
workflows:
  import:
    description: Import an existing resource into Terraform state
    steps:
      # Template fixture stacks (stage "fixtures", stacks/orgs/fnx/fixtures) are
      # never deployed: refuse them (see deploy-full-stack.yaml). Without -s every
      # stack is selected, fixtures included, so that is refused too.
      - &fixtures-stages
        name: stages
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[].settings.context.stage] | unique | join(",")'
        output: none
      - &refuse-fixtures
        name: refuse-fixtures
        type: shell
        command: case '{{ .steps.stages.value }}' in *fixtures*) echo "Refusing a template fixture stack (stage fixtures), which is never deployed."; exit 1 ;; esac
      - name: component
        type: input
        prompt: Component (e.g. vpc/main)
      - name: address
        type: input
        prompt: Terraform resource address (e.g. aws_vpc.default[0])
      - name: resource_id
        type: input
        prompt: Cloud resource ID (e.g. vpc-0123456789abcdef0)
      - name: validate
        type: atmos
        command: terraform validate {{ .steps.component.value }}
      - name: confirm
        type: confirm
        prompt: Import {{ .steps.resource_id.value }} as {{ .steps.address.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Import cancelled."; exit 1; }
      - name: import
        type: atmos
        command: terraform import {{ .steps.component.value }} {{ .steps.address.value }} {{ .steps.resource_id.value }}
      - name: verify
        type: atmos
        command: terraform plan {{ .steps.component.value }} --skip-planfile

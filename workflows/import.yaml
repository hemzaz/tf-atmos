# Import an existing cloud resource into a component's Terraform state and
# show the follow-up plan so the config can be reconciled.
#
# Usage: atmos workflow import -f import -s <stack>
workflows:
  import:
    description: Import an existing resource into Terraform state
    steps:
      - name: component
        type: input
        prompt: Component (e.g. vpc/main)
      - name: address
        type: input
        prompt: Terraform resource address (e.g. aws_vpc.default[0])
      - name: resource_id
        type: input
        prompt: Cloud resource ID (e.g. vpc-0123456789abcdef0)
      - name: validate
        type: atmos
        command: terraform validate {{ .steps.component.value }}
      - name: confirm
        type: confirm
        prompt: Import {{ .steps.resource_id.value }} as {{ .steps.address.value }}?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Import cancelled."; exit 1; }
      - name: import
        type: atmos
        command: terraform import {{ .steps.component.value }} {{ .steps.address.value }} {{ .steps.resource_id.value }}
      - name: verify
        type: atmos
        command: terraform plan {{ .steps.component.value }} --skip-planfile

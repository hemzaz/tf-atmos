# State lock operations. The S3 backend uses native lockfiles (use_lockfile),
# so locks are `<state key>.tflock` objects rather than DynamoDB items.
#
# Usage:
#   STACK=<stack> atmos workflow list-locks -f state-operations
#   atmos workflow force-unlock -f state-operations -s <stack>
workflows:
  list-locks:
    description: List Terraform state lockfiles (with age) in the stack's state bucket
    steps:
      - name: stack
        type: input
        prompt: Stack
        default: '{{ env "STACK" }}'
      - name: list
        type: shell
        command: ./workflows/scripts/state/list-locks.sh
        env:
          STACK: "{{ .steps.stack.value }}"
          AWS_SDK_LOAD_CONFIG: "1"

  force-unlock:
    description: Release an abandoned state lock for one component (replaces clean-abandoned-locks)
    steps:
      - name: component
        type: input
        prompt: Component (e.g. vpc/main)
      - name: lock_id
        type: input
        prompt: Lock ID (from the Terraform error message)
      - name: confirm
        type: confirm
        prompt: Force-unlock only if no Terraform run is active. Continue?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Cancelled."; exit 1; }
      - name: unlock
        type: atmos
        command: terraform force-unlock {{ .steps.component.value }} -force {{ .steps.lock_id.value }}

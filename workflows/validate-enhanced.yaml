# Repository-wide validation (no cloud credentials required).
#
# Usage:
#   atmos workflow validate-all -f validate-enhanced
#   atmos workflow validate-stack -f validate-enhanced -s <stack>
#   atmos workflow terraform-test -f validate-enhanced
#
# The plan sweep is the `atmos sweep` custom command (atmos.yaml `commands:`).
workflows:
  validate-all:
    description: Validate atmos.yaml, all stack manifests, YAML, formatting and every Terraform root module
    dependencies:
      tools:
        terraform: "1.16.3"
        wasilibs/go-yamllint: "1.38.0"
        # test_check_catalog_read_overrides.py (unittest discover below) parses
        # the stack YAML with it; the atmos image ships no yq.
        mikefarah/yq: "v4.53.6"
    steps:
      - name: validate-config
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate schema
      - name: validate-stacks
        type: shell
        command: atmos validate stacks
      # Two things nothing else checks:
      #  - every !terraform.state/!terraform.output target is an existing, enabled
      #    instance listed in the reader's dependencies.components (deploy ordering),
      #    and the output it reads is declared by the target's root module;
      #  - every var an instance sets is declared by its root module (Atmos and
      #    Terraform drop an undeclared one with only a warning);
      #  - every deployable instance maps to a component directory that exists.
      #    `atmos validate stacks` and validate-all both pass when it does not,
      #    because neither maps instances back to directories.
      # Plus the stack checks below, the only run of each (lint runs the
      # others): one `atmos describe stacks` document for all of them, every
      # check run even after another fails, the failed ones listed. The unit
      # tests of every check (lint's included) run first;
      # LANE_NAMES_STACKS_JSON turns on test_check_lane_names.py's
      # real-stacks test.
      - name: check-dependencies
        type: shell
        command: |
          set -eu
          stacks_json="$(mktemp)"
          workflows_json="$(mktemp)"
          trap 'rm -f "$stacks_json" "$workflows_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          atmos describe workflows --output all --format json > "$workflows_json"
          LANE_NAMES_STACKS_JSON="$stacks_json" python3 -m unittest discover -s workflows/scripts/common -p 'test_*.py'
          failed=""
          # check <name> <check command...>: the check reads the JSON on stdin.
          check() {
            name=$1
            shift
            echo "== $name"
            if "$@" < "$stacks_json"; then
              return 0
            fi
            echo "$name FAILED"
            failed="$failed $name"
          }
          check check-dependencies python3 workflows/scripts/common/check-dependencies.py components/terraform
          # Every s3-backend instance's state key is matched by exactly its
          # stage's backend access roles ("*/<stack>/*" and "*/<stack>-*" per
          # stack, stacks/orgs/fnx/root/us-east-1.yaml).
          check check-state-keys python3 workflows/scripts/common/check-state-keys.py
          # Stacks of one account and region (a stage stack and its lanes,
          # settings.context.name) and the instances in them may not create the
          # same name, tags.Environment, account singleton or secret.
          check check-lane-names python3 workflows/scripts/common/check-lane-names.py
          # Every dns record, acm domain/SAN and apigateway custom domain sits
          # inside the zone it is written to (zone_id followed to its dns zone).
          check check-domains python3 workflows/scripts/common/check-domains.py
          # secretsmanager types `secrets` as map(object), whose conversion
          # drops an undeclared attribute silently: every entry key is declared
          # by variables.tf.
          check check-secret-attributes python3 workflows/scripts/common/check-secret-attributes.py components/terraform
          # Every instance with a kubernetes/helm/kubectl provider runs on the
          # in-VPC runners (or has GitHub Actions off), every runner pool is
          # well-formed and in iam/ci, and every eks admin role is trusted by
          # its state write role (docs/OPERATIONS.md, "In-cluster components").
          check check-cluster-api-ci python3 workflows/scripts/common/check-cluster-api-ci.py components/terraform
          # Every iam/ci plan/apply role is trusted by its stage's backend
          # roles and may assume no other role.
          check check-ci-state-roles python3 workflows/scripts/common/check-ci-state-roles.py
          # Every prod rds/elasticache instance keeps its data-loss protections
          # (deletion protection, Multi-AZ/failover, final snapshot, 7+ days of
          # backups), and every prod cognito pool its deletion protection.
          check check-prod-protection python3 workflows/scripts/common/check-prod-protection.py components/terraform
          # deploy-full-stack, deploy-application (deploy-app) and bootstrap
          # (full) plan a whole phase before applying it: every deployable
          # instance must be in exactly one deploy-full-stack layer, and an
          # instance must be planned only after every instance whose state it
          # reads is applied (a new component type, or a new read inside a
          # layer, fails here).
          check check-deploy-layers python3 workflows/scripts/common/check-deploy-layers.py "$stacks_json" "$workflows_json"
          if [ -n "$failed" ]; then
            echo "stack checks failed:$failed"
            exit 1
          fi
      - name: list-stacks
        type: shell
        command: atmos list stacks
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
      # -lockfile=readonly: the committed .terraform.lock.hcl must already
      # lock every provider the module uses (atmos workflow providers-lock -f
      # providers), so an unlocked provider fails here, not at deploy time.
      # In parallel, $TF_VALIDATE_JOBS at a time (default: CPU count, at most
      # 4); the script warms $TF_PLUGIN_CACHE_DIR serially first.
      - name: validate-root-modules
        type: shell
        command: sh workflows/scripts/common/validate-root-modules.sh

  validate-stack:
    description: Validate stack manifests and resolve every component of one stack
    steps:
      - name: validate-stacks
        type: shell
        command: atmos validate stacks
      - name: describe-stack
        type: atmos
        command: describe stacks --process-functions=false --format json
        output: none

  # Runs `terraform test` (tests/*.tftest.hcl) for every component that has a
  # tests/ directory. The CI job (.github/workflows/terraform-ci.yml,
  # "Terraform tests") calls the same script directly once terraform is on
  # PATH; this workflow entry exists so a local run gets terraform 1.16.3 from
  # the toolchain too, without requiring a system-wide install.
  #
  # Usage:
  #   atmos workflow terraform-test -f validate-enhanced           # every tested component
  #   COMPONENTS=securitygroup atmos workflow terraform-test -f validate-enhanced
  #
  # Or skip atmos and call the script directly with terraform already on PATH:
  #   workflows/scripts/common/terraform-test.sh securitygroup
  terraform-test:
    description: Run `terraform test` for every component with a tests/ directory (or $COMPONENTS)
    dependencies:
      tools:
        terraform: "1.16.3"
    steps:
      - name: terraform-test
        type: shell
        # $COMPONENTS is optional and deliberately unquoted -- it is a
        # space-separated list of component directory names, and unset it
        # expands to nothing, so the script falls back to testing every
        # component that has a tests/ directory.
        command: |
          # shellcheck disable=SC2086
          sh workflows/scripts/common/terraform-test.sh ${COMPONENTS:-}

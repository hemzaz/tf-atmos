# Repository-wide validation (no cloud credentials required).
#
# Usage:
#   atmos workflow validate-all -f validate-enhanced
#   atmos workflow validate-stack -f validate-enhanced -s <stack>
workflows:
  validate-all:
    description: Validate atmos.yaml, all stack manifests, YAML, formatting and every Terraform root module
    dependencies:
      tools:
        terraform: "1.16.3"
        wasilibs/go-yamllint: "1.38.0"
    steps:
      - name: validate-config
        type: atmos
        command: validate schema
      - name: validate-stacks
        type: atmos
        command: validate stacks
      - name: list-stacks
        type: atmos
        command: list stacks
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
      - name: validate-root-modules
        type: shell
        command: |
          set -eu
          for dir in components/terraform/*/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "validating ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
          done

  validate-stack:
    description: Validate stack manifests and resolve every component of one stack
    steps:
      - name: validate-stacks
        type: atmos
        command: validate stacks
      - name: describe-stack
        type: atmos
        command: describe stacks --process-functions=false --format json
        output: none

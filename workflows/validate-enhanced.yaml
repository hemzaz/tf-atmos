# Repository-wide validation (no cloud credentials required).
#
# Usage:
#   atmos workflow validate-all -f validate-enhanced
#   atmos workflow validate-stack -f validate-enhanced -s <stack>
workflows:
  validate-all:
    description: Validate atmos.yaml, all stack manifests, YAML, formatting and every Terraform root module
    dependencies:
      tools:
        terraform: "1.16.3"
        wasilibs/go-yamllint: "1.38.0"
    steps:
      - name: validate-config
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate schema
      - name: validate-stacks
        type: shell
        command: atmos validate stacks
      # Two things nothing else checks:
      #  - every !terraform.state/!terraform.output target is an existing, enabled
      #    instance listed in the reader's dependencies.components (deploy ordering);
      #  - every deployable instance maps to a component directory that exists.
      #    `atmos validate stacks` and validate-all both pass when it does not,
      #    because neither maps instances back to directories.
      - name: check-dependencies
        type: shell
        command: |
          set -eu
          python3 -m unittest discover -s workflows/scripts/common -p 'test_*.py'
          stacks_json="$(mktemp)"
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          python3 workflows/scripts/common/check-dependencies.py components/terraform < "$stacks_json"
      # deploy-full-stack, deploy-application (deploy-app) and bootstrap (full)
      # plan a whole phase before applying it: every deployable instance must be
      # in exactly one deploy-full-stack layer, and an instance must be planned
      # only after every instance whose state it reads is applied (a new
      # component type, or a new read inside a layer, fails here).
      - name: check-deploy-layers
        type: shell
        command: |
          set -eu
          stacks_json="$(mktemp)"
          workflows_json="$(mktemp)"
          trap 'rm -f "$stacks_json" "$workflows_json"' EXIT
          atmos describe stacks --process-functions=false --format json > "$stacks_json"
          atmos describe workflows --output all --format json > "$workflows_json"
          python3 workflows/scripts/common/check-deploy-layers.py "$stacks_json" "$workflows_json"
      - name: list-stacks
        type: shell
        command: atmos list stacks
      - type: parallel
        fail:
          mode: wait_all
        steps:
          - name: yamllint
            type: shell
            command: yamllint -d relaxed stacks workflows atmos.yaml
          - name: terraform-fmt
            type: shell
            command: terraform fmt -check -recursive components/terraform
      - name: validate-root-modules
        type: shell
        command: |
          set -eu
          for dir in components/terraform/*/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "validating ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
          done

  validate-stack:
    description: Validate stack manifests and resolve every component of one stack
    steps:
      - name: validate-stacks
        type: shell
        command: atmos validate stacks
      - name: describe-stack
        type: atmos
        command: describe stacks --process-functions=false --format json
        output: none

  # The rung between `terraform validate` and the emulator lanes: bind each
  # stack's RESOLVED variables to its component and plan. `terraform validate`
  # never binds values, so it exits 0 on a component whose every variable
  # validation fails; tflint does not read them either. See the header of
  # scripts/plan-sweep.sh for what a PASS here does and does not mean.
  #
  # No AWS credentials. Terraform evaluates variable validations before the
  # provider authenticates, so the expected outcome is a plan that reaches
  # InvalidClientTokenId with nothing having objected on the way.
  plan-sweep:
    description: Plan every stack/component pair against its resolved variables
    dependencies:
      tools:
        terraform: "1.16.3"
        # The sweep evaluates each !terraform.state expression with yq, as
        # Atmos does internally; the atmos image ships no yq at all. It must be
        # mikefarah v4 -- the script refuses anything else rather than guess.
        mikefarah/yq: "v4.53.6"
    steps:
      - name: plan-sweep
        # shell, not type: atmos -- the script drives atmos itself, once
        # per pair.
        type: shell
        command: bash scripts/plan-sweep.sh

# Layered deployment of a whole stack. Each layer selects components by their
# Terraform root module (metadata.component); within a layer Atmos honors
# dependencies.components ordering.
#
# Usage:
#   atmos workflow deploy -f deploy-full-stack -s <stack>             # all layers
#   atmos workflow deploy-<layer> -f deploy-full-stack -s <stack>     # one layer
#   layers: foundation, networking, security, compute, platform, data, services, monitoring
workflows:
  deploy:
    description: Deploy the complete stack layer by layer (foundation -> monitoring)
    steps:
      - name: validate
        type: atmos
        command: validate stacks
      - name: confirm
        type: confirm
        prompt: Deploy all layers? Each layer is planned and applied in order (later layers read earlier layers' state)
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy-foundation
        type: atmos
        command: terraform deploy --query '.metadata.component == "backend" or .metadata.component == "iam"'
      - name: deploy-networking
        type: atmos
        command: terraform deploy --query '.metadata.component == "vpc" or .metadata.component == "dns" or .metadata.component == "securitygroup"'
      - name: deploy-security
        type: atmos
        command: terraform deploy --query '.metadata.component == "acm" or .metadata.component == "secretsmanager" or .metadata.component == "security-monitoring"'
      - name: deploy-compute
        type: atmos
        command: terraform deploy --query '.metadata.component == "eks" or .metadata.component == "ec2" or .metadata.component == "ecs"'
      - name: deploy-platform
        type: atmos
        command: terraform deploy --query '.metadata.component == "eks-addons" or .metadata.component == "external-secrets"'
      - name: deploy-data
        type: atmos
        command: terraform deploy --query '.metadata.component == "rds" or .metadata.component == "backup"'
      - name: deploy-services
        type: atmos
        command: terraform deploy --query '.metadata.component == "apigateway" or .metadata.component == "lambda" or .metadata.component == "eks-backend-services"'
      - name: deploy-monitoring
        type: atmos
        command: terraform deploy --query '.metadata.component == "monitoring" or .metadata.component == "cost-optimization"'
      - type: toast
        level: success
        content: All layers deployed

  deploy-foundation:
    description: "Deploy the foundation layer: State backend and IAM"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "backend" or .metadata.component == "iam"'
      - name: confirm
        type: confirm
        prompt: Deploy the foundation layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "backend" or .metadata.component == "iam"'

  deploy-networking:
    description: "Deploy the networking layer: VPCs, DNS and security groups"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "vpc" or .metadata.component == "dns" or .metadata.component == "securitygroup"'
      - name: confirm
        type: confirm
        prompt: Deploy the networking layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "vpc" or .metadata.component == "dns" or .metadata.component == "securitygroup"'

  deploy-security:
    description: "Deploy the security layer: Certificates, secrets and security monitoring"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "acm" or .metadata.component == "secretsmanager" or .metadata.component == "security-monitoring"'
      - name: confirm
        type: confirm
        prompt: Deploy the security layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "acm" or .metadata.component == "secretsmanager" or .metadata.component == "security-monitoring"'

  deploy-compute:
    description: "Deploy the compute layer: EKS clusters, EC2 and ECS"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "eks" or .metadata.component == "ec2" or .metadata.component == "ecs"'
      - name: confirm
        type: confirm
        prompt: Deploy the compute layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "eks" or .metadata.component == "ec2" or .metadata.component == "ecs"'

  deploy-platform:
    description: "Deploy the platform layer: EKS add-ons and External Secrets"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "eks-addons" or .metadata.component == "external-secrets"'
      - name: confirm
        type: confirm
        prompt: Deploy the platform layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "eks-addons" or .metadata.component == "external-secrets"'

  deploy-data:
    description: "Deploy the data layer: Databases and backups"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "rds" or .metadata.component == "backup"'
      - name: confirm
        type: confirm
        prompt: Deploy the data layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "rds" or .metadata.component == "backup"'

  deploy-services:
    description: "Deploy the services layer: API Gateway, Lambda and backend services"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "apigateway" or .metadata.component == "lambda" or .metadata.component == "eks-backend-services"'
      - name: confirm
        type: confirm
        prompt: Deploy the services layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "apigateway" or .metadata.component == "lambda" or .metadata.component == "eks-backend-services"'

  deploy-monitoring:
    description: "Deploy the monitoring layer: Monitoring and cost optimization"
    steps:
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "monitoring" or .metadata.component == "cost-optimization"'
      - name: confirm
        type: confirm
        prompt: Deploy the monitoring layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "monitoring" or .metadata.component == "cost-optimization"'

# Layered deployment of a whole stack. Each layer selects instances by Terraform
# root module (.metadata.component) and, where one instance of a type reads
# another, by instance name (.atmos_component). Every layer is planned (planfiles
# saved), shown, confirmed, and then applied from exactly those planfiles
# (`deploy --from-plan`); a layer is planned only after the previous layer is
# applied, so it sees the earlier layers' state. Declining any confirm stops the run.
#
# Usage:
#   atmos workflow deploy -f deploy-full-stack -s <stack>             # all layers
#   atmos workflow deploy-<layer> -f deploy-full-stack -s <stack>     # one layer
#   layers: backend, iam, kms, storage, networking, connectivity, security, security-monitoring, compute, platform, data, dns-zones, dns, certificates, addons, services, regional-waf, monitoring
#
# A layer plans all its instances before it applies any of them, so an instance
# that reads another's state (!terraform.state / !terraform.output) must be in a
# later layer than that instance: on the first deploy the state does not exist
# yet. A dependency only declared in dependencies.components may share a layer
# (Atmos applies a layer in dependency order). The backend layer has an instance
# only in fnx-core-root (the single state backend), which is deployed before any
# workload stack; iam/ci reads it cross-stack. Connectivity follows networking, security-monitoring
# follows security (it reads guardduty, securityhub, inspector2 and cloudtrail state; awsconfig
# shares the security layer with securityhub, which only lists it in
# dependencies.components), lambda (compute) precedes apigateway (services), as
# does apigateway-account (security: the account's CloudWatch role REST stage
# logging needs; apigateway lists it in dependencies.components only), and
# ec2/bastion (connectivity) precedes the EC2 instances that read it (compute).
# network/main writes the NS record delegating network/services' zone from
# its own zone_name_servers, so network/services has a dns-zones layer before
# dns. acm validates its certificates in the dns instances' zones (zone_ids), so it
# has its own certificates layer after dns and before services and monitoring,
# which read its certificate ARNs, as does cloudfront (services), which also
# writes alias records into the dns instances' zones. eks-addons reads its dns
# instance's zone_ids, so it has its own addons layer after dns (and after
# compute, for the cluster it installs into); alb, reading acm's certificate,
# shares that layer, before the ecs-service instances (services) that add
# listener rules to it. The storage layer (s3, reading kms/main) precedes compute,
# whose lambda instances read s3/lambda-artifacts .bucket_id; sqs and sns share it
# (they read only kms/main; an s3 instance notifying a queue names it rather than
# reading its state); so do kinesis and dynamodb, which also read only kms/main.
# github-runners (reading the vpc and kms/main) is in connectivity, before the eks instances (compute) that admit its security group.
# glue (compute) reads the buckets; athena (platform) reads glue, and firehose
# (data) reads glue, kinesis and the buckets. stepfunctions (platform) follows
# compute, whose batch, lambda and glue state its definitions read (an athena
# workgroup it shares the layer with is named, not read), and eventbridge
# (services) follows it, targeting state machines, Batch queues, lambdas and queues.
# waf instances split by scope (vars.scope, which every waf instance sets): a
# CLOUDFRONT web ACL (reading only kms/main) is in security, before the
# cloudfront instances (services) that use its arn; a REGIONAL one associates
# with an alb (addons) or an apigateway stage (services), so it has its own
# regional-waf layer after services.
# eventbridge instances split by create_event_bus: a bus (reading only kms/main and
# its dead-letter queue, storage) is in platform, before the rules (services) that
# read its event_bus_name and target lambdas and queues. ses writes its DKIM and
# verification records into the dns instances' zones, so it shares certificates
# with acm. alb-controller-ingress-group (an Ingress for the controller eks-addons
# installs, reading eks, acm and the VPC link's security group) is in addons, before
# the apigateway routes (services) that read its listener. A Secrets Manager rotation
# lambda (vars.rotation_secret_arn set) reads its rotation target (e.g. elasticache,
# data), so it leaves compute for addons, after data.
# Every layer except backend and regional-waf (no workload stack has a waf
# instance yet; an empty layer plans "No components matched") has at least one
# enabled instance in every workload stack (eks-backend-services/main, the last
# to gain instances, joined the compute layer in all 3 stacks); fnx-core-root
# has only the backend layer.
#
# Every enabled, non-abstract instance of every stack must be selected by exactly
# one layer, in that order. validate-all enforces it with
# scripts/common/check-deploy-layers.py, so a new component type, or a new read
# of an instance in the same or a later layer, fails there until a layer below
# is changed.
workflows:
  deploy:
    description: Deploy the complete stack layer by layer (backend -> monitoring), each layer planned, confirmed, then applied from its saved plan
    steps:
      # Template fixture stacks (stage "fixtures", stacks/orgs/fnx/fixtures)
      # exist for CI's checks and are never deployed. Every workflow below
      # starts with these two steps (YAML aliases); without -s every stack is
      # selected, fixtures included, so that is refused too.
      - &fixtures-stages
        name: stages
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[].settings.context.stage] | unique | join(",")'
        output: none
      - &refuse-fixtures
        name: refuse-fixtures
        type: shell
        command: case '{{ .steps.stages.value }}' in *fixtures*) echo "Refusing a template fixture stack (stage fixtures), which is never deployed."; exit 1 ;; esac
      - name: validate
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate stacks
      - name: plan-backend
        type: atmos
        command: terraform plan --query '.metadata.component == "backend"'
      - name: confirm_backend
        type: confirm
        prompt: Apply the backend layer plan above?
        default: false
      - name: guard-backend
        type: shell
        command: test "{{ .steps.confirm_backend.value }}" = "true" || { echo "Deployment cancelled before the backend layer."; exit 1; }
      - name: deploy-backend
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "backend"'
      - name: plan-iam
        type: atmos
        command: terraform plan --query '.metadata.component == "iam"'
      - name: confirm_iam
        type: confirm
        prompt: Apply the iam layer plan above?
        default: false
      - name: guard-iam
        type: shell
        command: test "{{ .steps.confirm_iam.value }}" = "true" || { echo "Deployment cancelled before the iam layer."; exit 1; }
      - name: deploy-iam
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "iam"'
      - name: kms_instances
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[] | select(.metadata.component == "kms" and .metadata.enabled != false and .metadata.type != "abstract")] | length'
        output: none
      - name: plan-kms
        type: atmos
        command: terraform plan --query '.metadata.component == "kms"'
      - name: confirm_kms
        type: confirm
        prompt: '{{ if eq (trim .steps.kms_instances.value) "0" }}No kms component in this stack; continue?{{ else }}Apply the kms layer plan above?{{ end }}'
        default: false
      - name: guard-kms
        type: shell
        command: test "{{ .steps.confirm_kms.value }}" = "true" || { echo "Deployment cancelled before the kms layer."; exit 1; }
      - name: deploy-kms
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "kms"'
      - name: plan-storage
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "s3" or .metadata.component == "sqs" or .metadata.component == "sns"
          or .metadata.component == "kinesis" or .metadata.component == "dynamodb"'
      - name: confirm_storage
        type: confirm
        prompt: Apply the storage layer plan above?
        default: false
      - name: guard-storage
        type: shell
        command: test "{{ .steps.confirm_storage.value }}" = "true" || { echo "Deployment cancelled before the storage layer."; exit 1; }
      - name: deploy-storage
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "s3" or .metadata.component == "sqs" or .metadata.component == "sns"
          or .metadata.component == "kinesis" or .metadata.component == "dynamodb"'
      - name: plan-networking
        type: atmos
        command: terraform plan --query '.metadata.component == "vpc"'
      - name: confirm_networking
        type: confirm
        prompt: Apply the networking layer plan above?
        default: false
      - name: guard-networking
        type: shell
        command: test "{{ .steps.confirm_networking.value }}" = "true" || { echo "Deployment cancelled before the networking layer."; exit 1; }
      - name: deploy-networking
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "vpc"'
      - name: plan-connectivity
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "securitygroup" or .metadata.component == "network"
          or .atmos_component == "ec2/bastion" or .metadata.component == "github-runners"'
      - name: confirm_connectivity
        type: confirm
        prompt: Apply the connectivity layer plan above?
        default: false
      - name: guard-connectivity
        type: shell
        command: test "{{ .steps.confirm_connectivity.value }}" = "true" || { echo "Deployment cancelled before the connectivity layer."; exit 1; }
      - name: deploy-connectivity
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "securitygroup"
          or .metadata.component == "network" or .atmos_component == "ec2/bastion" or .metadata.component == "github-runners"'
      - name: plan-security
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "secretsmanager" or .metadata.component == "guardduty"
          or .metadata.component == "securityhub" or .metadata.component == "cloudtrail"
          or .metadata.component == "awsconfig" or .metadata.component == "cognito"
          or .metadata.component == "apigateway-account" or .metadata.component == "inspector2"
          or .metadata.component == "waf" and .vars.scope == "CLOUDFRONT"'
      - name: confirm_security
        type: confirm
        prompt: Apply the security layer plan above?
        default: false
      - name: guard-security
        type: shell
        command: test "{{ .steps.confirm_security.value }}" = "true" || { echo "Deployment cancelled before the security layer."; exit 1; }
      - name: deploy-security
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "secretsmanager"
          or .metadata.component == "guardduty" or .metadata.component == "securityhub"
          or .metadata.component == "cloudtrail" or .metadata.component == "awsconfig"
          or .metadata.component == "cognito" or .metadata.component == "apigateway-account"
          or .metadata.component == "inspector2" or .metadata.component == "waf"
          and .vars.scope == "CLOUDFRONT"'
      - name: plan-security-monitoring
        type: atmos
        command: terraform plan --query '.metadata.component == "security-monitoring"'
      - name: confirm_security_monitoring
        type: confirm
        prompt: Apply the security-monitoring layer plan above?
        default: false
      - name: guard-security-monitoring
        type: shell
        command: test "{{ .steps.confirm_security_monitoring.value }}" = "true" || { echo "Deployment cancelled before the security-monitoring layer."; exit 1; }
      - name: deploy-security-monitoring
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "security-monitoring"'
      # The rotation split keys on rotation_secret_arn, a read of a secretsmanager
      # instance, which relies on secrets (security) being applied before compute.
      - name: plan-compute
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "eks" or .metadata.component == "ecs" or .metadata.component == "batch"
          or (.metadata.component == "lambda" and .vars.rotation_secret_arn == null) or .metadata.component == "glue"
          or .metadata.component == "ec2" and .atmos_component != "ec2/bastion"'
      - name: confirm_compute
        type: confirm
        prompt: Apply the compute layer plan above?
        default: false
      - name: guard-compute
        type: shell
        command: test "{{ .steps.confirm_compute.value }}" = "true" || { echo "Deployment cancelled before the compute layer."; exit 1; }
      - name: deploy-compute
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "eks" or .metadata.component == "ecs" or .metadata.component == "batch"
          or (.metadata.component == "lambda" and .vars.rotation_secret_arn == null) or .metadata.component == "glue"
          or .metadata.component == "ec2" and .atmos_component != "ec2/bastion"'
      - name: plan-platform
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "external-secrets" or .metadata.component == "athena" or .metadata.component == "stepfunctions"
          or .metadata.component == "eventbridge" and .vars.create_event_bus == true'
      - name: confirm_platform
        type: confirm
        prompt: Apply the platform layer plan above?
        default: false
      - name: guard-platform
        type: shell
        command: test "{{ .steps.confirm_platform.value }}" = "true" || { echo "Deployment cancelled before the platform layer."; exit 1; }
      - name: deploy-platform
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "external-secrets" or .metadata.component == "athena" or .metadata.component == "stepfunctions"
          or .metadata.component == "eventbridge" and .vars.create_event_bus == true'
      - name: plan-data
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "rds" or .metadata.component == "elasticache"
          or .metadata.component == "backup" or .metadata.component == "firehose"'
      - name: confirm_data
        type: confirm
        prompt: Apply the data layer plan above?
        default: false
      - name: guard-data
        type: shell
        command: test "{{ .steps.confirm_data.value }}" = "true" || { echo "Deployment cancelled before the data layer."; exit 1; }
      - name: deploy-data
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "rds" or .metadata.component == "elasticache"
          or .metadata.component == "backup" or .metadata.component == "firehose"'
      # network/services' zones are delegated from network/main's zone by an
      # NS record that network/main writes from network/services'
      # zone_name_servers, so network/services has its own dns-zones layer
      # before dns. (network/services delegates its data zone itself:
      # zones.data.parent_zone.)
      - name: plan-dns-zones
        type: atmos
        command: terraform plan --query '.atmos_component == "network/services"'
      - name: confirm_dns_zones
        type: confirm
        prompt: Apply the dns-zones layer plan above?
        default: false
      - name: guard-dns-zones
        type: shell
        command: test "{{ .steps.confirm_dns_zones.value }}" = "true" || { echo "Deployment cancelled before the dns-zones layer."; exit 1; }
      - name: deploy-dns-zones
        type: atmos
        command: terraform deploy --from-plan --query '.atmos_component == "network/services"'
      # DNS records point at data-layer endpoints (prod network/main reads
      # rds/main .instance_address), so dns plans only after the data layer is
      # applied; apigateway (services) reads the zones, so dns precedes it.
      - name: plan-dns
        type: atmos
        command: terraform plan --query '.metadata.component == "dns" and .atmos_component != "network/services"'
      - name: confirm_dns
        type: confirm
        prompt: Apply the dns layer plan above?
        default: false
      - name: guard-dns
        type: shell
        command: test "{{ .steps.confirm_dns.value }}" = "true" || { echo "Deployment cancelled before the dns layer."; exit 1; }
      - name: deploy-dns
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "dns" and .atmos_component != "network/services"'
      # acm writes its DNS validation records into the dns instances' zones
      # (zone_id is !terraform.state network/<x> .zone_ids.<key>), so it
      # follows dns; apigateway (services) and monitoring read its certificate
      # ARNs, so it precedes them.
      - name: plan-certificates
        type: atmos
        command: terraform plan --query '.metadata.component == "acm" or .metadata.component == "ses"'
      - name: confirm_certificates
        type: confirm
        prompt: Apply the certificates layer plan above? (The stack's domain must already be delegated, or ACM validation times out.)
        default: false
      - name: guard-certificates
        type: shell
        command: test "{{ .steps.confirm_certificates.value }}" = "true" || { echo "Deployment cancelled before the certificates layer."; exit 1; }
      - name: deploy-certificates
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "acm" or .metadata.component == "ses"'
      # eks-addons reads the dns instances' zone_ids (external-dns and
      # cert-manager are scoped to those zones), so it follows dns.
      - name: plan-addons
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "eks-addons" or .metadata.component == "alb"
          or .metadata.component == "alb-controller-ingress-group"
          or .metadata.component == "lambda" and .vars.rotation_secret_arn != null'
      - name: confirm_addons
        type: confirm
        prompt: Apply the addons layer plan above?
        default: false
      - name: guard-addons
        type: shell
        command: test "{{ .steps.confirm_addons.value }}" = "true" || { echo "Deployment cancelled before the addons layer."; exit 1; }
      - name: deploy-addons
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "eks-addons" or .metadata.component == "alb"
          or .metadata.component == "alb-controller-ingress-group"
          or .metadata.component == "lambda" and .vars.rotation_secret_arn != null'
      - name: plan-services
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "apigateway" or .metadata.component == "eks-backend-services"
          or .metadata.component == "cloudfront" or .metadata.component == "ecs-service" or .metadata.component == "eventbridge" and .vars.create_event_bus != true'
      - name: confirm_services
        type: confirm
        prompt: Apply the services layer plan above?
        default: false
      - name: guard-services
        type: shell
        command: test "{{ .steps.confirm_services.value }}" = "true" || { echo "Deployment cancelled before the services layer."; exit 1; }
      - name: deploy-services
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "apigateway"
          or .metadata.component == "eks-backend-services" or .metadata.component == "cloudfront"
          or .metadata.component == "ecs-service" or .metadata.component == "eventbridge" and .vars.create_event_bus != true'
      - name: plan-regional-waf
        type: atmos
        command: terraform plan --query '.metadata.component == "waf" and .vars.scope == "REGIONAL"'
      - name: confirm_regional_waf
        type: confirm
        prompt: Apply the regional-waf layer plan above?
        default: false
      - name: guard-regional-waf
        type: shell
        command: test "{{ .steps.confirm_regional_waf.value }}" = "true" || { echo "Deployment cancelled before the regional-waf layer."; exit 1; }
      - name: deploy-regional-waf
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "waf" and .vars.scope == "REGIONAL"'
      - name: plan-monitoring
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "monitoring" or .metadata.component == "cost-optimization"'
      - name: confirm_monitoring
        type: confirm
        prompt: Apply the monitoring layer plan above?
        default: false
      - name: guard-monitoring
        type: shell
        command: test "{{ .steps.confirm_monitoring.value }}" = "true" || { echo "Deployment cancelled before the monitoring layer."; exit 1; }
      - name: deploy-monitoring
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "monitoring"
          or .metadata.component == "cost-optimization"'
      - type: toast
        level: success
        content: All layers deployed

  deploy-backend:
    description: "Deploy the backend layer: the Terraform state backend (only fnx-core-root has one)"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "backend"'
      - name: confirm
        type: confirm
        prompt: Deploy the backend layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "backend"'

  deploy-iam:
    description: "Deploy the iam layer: IAM roles and the CI OIDC roles (iam/ci reads backend/main in fnx-core-root)"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "iam"'
      - name: confirm
        type: confirm
        prompt: Deploy the iam layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "iam"'

  deploy-kms:
    description: "Deploy the kms layer: customer-managed KMS keys (only stacks that define kms)"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: kms_instances
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[] | select(.metadata.component == "kms" and .metadata.enabled != false and .metadata.type != "abstract")] | length'
        output: none
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "kms"'
      - name: confirm
        type: confirm
        prompt: '{{ if eq (trim .steps.kms_instances.value) "0" }}No kms component in this stack; continue?{{ else }}Apply the kms layer plan above?{{ end }}'
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "kms"'

  deploy-storage:
    description: "Deploy the storage layer: S3 buckets, SQS queues, SNS topics, Kinesis streams and DynamoDB tables (they read kms/main), such as the lambda package bucket compute reads"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: plan
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "s3" or .metadata.component == "sqs" or .metadata.component == "sns"
          or .metadata.component == "kinesis" or .metadata.component == "dynamodb"'
      - name: confirm
        type: confirm
        prompt: Deploy the storage layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "s3" or .metadata.component == "sqs" or .metadata.component == "sns"
          or .metadata.component == "kinesis" or .metadata.component == "dynamodb"'

  deploy-networking:
    description: "Deploy the networking layer: VPCs"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: plan
        type: atmos
        command: terraform plan --query '.metadata.component == "vpc"'
      - name: confirm
        type: confirm
        prompt: Deploy the networking layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "vpc"'

  deploy-connectivity:
    description: "Deploy the connectivity layer: security groups, VPC peering and bastion hosts (they read the VPCs)"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: plan
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "securitygroup" or .metadata.component == "network"
          or .atmos_component == "ec2/bastion" or .metadata.component == "github-runners"'
      - name: confirm
        type: confirm
        prompt: Deploy the connectivity layer?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Deployment cancelled."; exit 1; }
      - name: deploy
        type: atmos
        command: >-
          terraform deploy --from-plan --query '.metadata.component == "securitygroup"
          or .metadata.component == "network" or .atmos_component == "ec2/bastion" or .metadata.component == "github-runners"'

  deploy-security:
    description: "Deploy the security layer: secrets, GuardDuty, Security Hub, Inspector, CloudTrail, AWS Config, Cognito and the API Gateway account settings"
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - name: plan
        type: atmos
        command: >-
          terraform plan --query '.metadata.component == "secretsmanager" or .metadata.component == "guardduty"

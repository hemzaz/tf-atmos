# Bootstrap a new stack: create the S3 state bucket (Atmos backend provisioning:
# versioning, encryption, public-access block; native S3 lockfiles, no
# DynamoDB), bring it under Terraform via the `backend` component, then deploy
# IAM and the VPCs.
#
# Usage:
#   atmos workflow full -f bootstrap -s <stack>
#   atmos workflow backend-only -f bootstrap -s <stack>
#   atmos workflow verify -f bootstrap -s <stack>
workflows:
  full:
    description: Complete bootstrap sequence - state backend, IAM, networking
    steps:
      - name: validate
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate stacks
      - name: create-backend
        type: atmos
        command: terraform backend create backend/main
      # backend/main is applied before IAM is planned: iam/ci reads its bucket
      # and key through !terraform.state, which has no state until it is applied.
      - name: plan-backend
        type: atmos
        command: terraform plan --log-order grouped --query '.metadata.component == "backend"'
      - name: confirm_backend
        type: confirm
        prompt: Apply the backend plan above?
        default: false
      - name: guard-backend
        type: shell
        command: test "{{ .steps.confirm_backend.value }}" = "true" || { echo "Bootstrap cancelled after backend creation."; exit 1; }
      - name: deploy-backend
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "backend"'
      - name: plan-foundation
        type: atmos
        command: terraform plan --log-order grouped --query '.metadata.component == "iam" or .metadata.component == "vpc"'
      - name: confirm_foundation
        type: confirm
        prompt: Apply the IAM and VPC plans above?
        default: false
      - name: guard-foundation
        type: shell
        command: test "{{ .steps.confirm_foundation.value }}" = "true" || { echo "Bootstrap cancelled after the backend."; exit 1; }
      - name: deploy-iam
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "iam"'
      - name: deploy-vpc
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "vpc"'
      - type: markdown
        content: |
          **Bootstrap complete.** Next steps:
          - `atmos workflow deploy -f deploy-full-stack -s <stack>`
          - `atmos workflow verify -f bootstrap -s <stack>`

  backend-only:
    description: Create the Terraform state bucket and manage it with the backend component
    steps:
      - name: create-backend
        type: atmos
        command: terraform backend create backend/main
      - name: plan
        type: atmos
        command: terraform plan backend/main
      - name: confirm
        type: confirm
        prompt: Apply the backend plan above?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Backend deploy cancelled after backend creation."; exit 1; }
      - name: deploy-backend
        type: atmos
        command: terraform deploy backend/main --from-plan

  verify:
    description: Verify the state backend exists and is configured as expected
    steps:
      - name: describe-backend
        type: atmos
        command: terraform backend describe backend/main
      - name: backend-outputs
        type: atmos
        command: terraform output backend/main

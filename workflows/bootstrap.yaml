# Bootstrap. A Terraform state backend (bucket, KMS key and stage-split
# read-only / read-write access roles) is the `backend` component's instance
# backend/main in a management-account root stack: fnx-ue1-root (bucket
# fnx-terraform-state, the US stacks) or fnx-ew1-root (fnx-ew1-terraform-state,
# the EU stacks). Every stack's S3 backend assumes one of its settings.tfstate
# backend's access roles (stacks/orgs/fnx/_defaults.yaml), so a backend is
# bootstrapped once, first, with management-account administrator credentials;
# then each workload stack that uses it.
#
# Usage (the backend workflows default to fnx-ue1-root; -s picks another root stack):
#   atmos workflow backend-cold-start -f bootstrap [-s fnx-ew1-root]  # once: create the backend, move its state into it
#   atmos workflow backend-only -f bootstrap [-s fnx-ew1-root]        # later changes to the backend
#   atmos workflow verify -f bootstrap [-s fnx-ew1-root]              # backend describe + outputs
#   atmos workflow full -f bootstrap -s <stack>                       # a workload stack: IAM (CI roles) and VPCs
workflows:
  backend-cold-start:
    description: Create a state backend with local state (Cloud Posse cold start), then migrate its state into the new bucket
    # The backend-* workflows default to the US root stack; -s on the command
    # line wins over this (fnx-ew1-root). refuse-non-backend stops any stack
    # without a backend/main.
    stack: fnx-ue1-root
    dependencies:
      tools:
        aws/aws-cli: "2.36.49"
    steps:
      # Template fixture stacks (stage "fixtures", stacks/orgs/fnx/fixtures) are
      # never deployed: refuse them (see deploy-full-stack.yaml). Without -s every
      # stack is selected, fixtures included, so that is refused too.
      - &fixtures-stages
        name: stages
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform[].settings.context.stage] | unique | join(",")'
        output: none
      - &refuse-fixtures
        name: refuse-fixtures
        type: shell
        command: case '{{ .steps.stages.value }}' in *fixtures*) echo "Refusing a template fixture stack (stage fixtures), which is never deployed."; exit 1 ;; esac
      # The backend this run creates: the selected stack's backend/main, its
      # bucket and the role its own state assumes, read from the stack (its
      # settings.tfstate), never written here. "null" for a stack without one.
      - &backend-bucket
        name: backend_bucket
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform["backend/main"] | select(. != null) | .vars.bucket_name] | join(",")'
        output: none
      - &refuse-non-backend
        name: refuse-non-backend
        type: shell
        command: >-
          bucket={{ .steps.backend_bucket.value }};
          case "$bucket" in ""|null|*,*) echo "Pass one root stack with a backend/main (fnx-ue1-root, fnx-ew1-root), not '$bucket'."; exit 1 ;; esac
      # First-deploy preflight, before anything touches AWS: fails while the
      # stack about to be deployed (or the management account and the backend's
      # access_roles, for a root stack) still holds a placeholder account ID,
      # organization ID, example domain or alert address, an empty EKS admin
      # role or a placeholder backend service image, or breaks the account model
      # (workload account = management account; two stages in one account).
      # docs/OPERATIONS.md#first-deploy-inputs. lint runs it warn-only.
      - &preflight-targets
        name: preflight_targets
        type: atmos
        command: describe stacks --process-functions=false --format json --query 'keys | join(",")'
        output: none
      - &preflight
        name: preflight
        type: shell
        command: >-
          atmos describe stacks --process-functions=false --format json
          | python3 workflows/scripts/common/check-first-deploy-inputs.py
          --stacks '{{ .steps.preflight_targets.value }}'
      # A second cold start would fail at bucket creation after creating some
      # of the other resources in a fresh local state. Refuse up front.
      - name: refuse-if-bucket-exists
        type: shell
        command: >-
          bucket={{ .steps.backend_bucket.value }};
          if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
          echo "$bucket already exists: use 'atmos workflow backend-only -f bootstrap' (with the same -s),
          or import the bucket first (components/terraform/backend/README.md#bootstrap)."; exit 1; fi
      - name: warning
        type: alert
        level: warning
        content: >-
          Cold start: applies backend/main with LOCAL state, then copies that state into the new
          bucket. Run it once, with management-account administrator credentials, before any
          other stack. On a backend that already exists use `backend-only`: a second cold start
          would try to create the bucket again. If the bucket already exists (e.g. created by
          `atmos terraform backend create`), import it first - see
          components/terraform/backend/README.md#bootstrap.
      - name: confirm_cold_start
        type: confirm
        prompt: Create the state backend now (cold start)?
        default: false
      - name: guard-cold-start
        type: shell
        command: test "{{ .steps.confirm_cold_start.value }}" = "true" || { echo "Cold start cancelled."; exit 1; }
      # A backend.tf.json left by an earlier run would win over
      # --auto-generate-backend-file=false and point init at the bucket that
      # does not exist yet.
      - name: clean-backend-file
        type: shell
        command: rm -f components/terraform/backend/backend.tf.json
      # Local state: nothing to assume yet. The caller (this administrator) is
      # added to every access role's trust, as in Cloud Posse's tfstate-backend,
      # and is the ONLY principal of the root role (<role_prefix>-root-role,
      # e.g. fnx-terraform-backend-root-role), the one the root stack's own backend assumes.
      - name: apply-local-state
        type: atmos
        command: terraform deploy backend/main --auto-generate-backend-file=false
      # The role the migration will assume: the one this stack's backend
      # configuration names.
      - name: backend_role
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json
          --query '[.[].components.terraform["backend/main"] | select(. != null) | .backend.assume_role.role_arn] | join(",")'
        output: none
      # IAM is eventually consistent: a role (and a trust policy) created a
      # moment ago can refuse sts:AssumeRole for a few seconds, which would
      # fail migrate-state below. Probe that role with backoff, up to ~60s.
      - name: wait-for-root-role
        type: shell
        command: |
          role={{ .steps.backend_role.value }}
          case "$role" in arn:aws:iam::*:role/*) ;; *) echo "Cannot resolve backend/main's backend role_arn ('$role')"; exit 1 ;; esac
          delay=2
          waited=0
          until aws sts assume-role --role-arn "$role" --role-session-name backend-cold-start-probe --duration-seconds 900 >/dev/null 2>&1; do
            if [ "$waited" -ge 60 ]; then
              echo "Still cannot assume $role after ${waited}s: check that it exists and trusts this caller ($(aws sts get-caller-identity --query Arn --output text))."
              exit 1
            fi
            echo "Waiting for $role to become assumable (${waited}s)..."
            sleep "$delay"
            waited=$((waited + delay))
            delay=$((delay * 2))
            [ "$delay" -gt 16 ] && delay=16
          done
          echo "$role is assumable."
      # Generates the S3 backend (the root role, which now trusts the caller) and
      # copies the local state into the bucket. -reconfigure would discard the
      # local state instead of migrating it, hence --init-reconfigure=never.
      - name: migrate-state
        type: atmos
        command: terraform init backend/main --init-reconfigure=never -- -migrate-state -force-copy
      - type: markdown
        content: |
          **State backend created.** Its state now lives in the bucket; delete the
          local copy, `components/terraform/backend/terraform.tfstate.d/`.
          Next: `atmos workflow full -f bootstrap -s <stack>` for each workload stack.

  backend-only:
    description: Plan and apply a state backend (backend/main in fnx-ue1-root, or -s fnx-ew1-root) after its cold start
    stack: fnx-ue1-root
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - *backend-bucket
      - *refuse-non-backend
      # access_roles changes (a new stack's CI role ARNs) ship here after the
      # cold start: a placeholder ARN must not reach the live bucket policy.
      - *preflight-targets
      - *preflight
      - name: plan
        type: atmos
        command: terraform plan backend/main
      - name: confirm
        type: confirm
        prompt: Apply the backend plan above?
        default: false
      - name: guard
        type: shell
        command: test "{{ .steps.confirm.value }}" = "true" || { echo "Backend deploy cancelled."; exit 1; }
      - name: deploy-backend
        type: atmos
        command: terraform deploy backend/main --from-plan

  full:
    description: Bootstrap a workload stack - IAM (including the CI roles) and networking. Needs the state backend (backend-cold-start) first.
    steps:
      - *fixtures-stages
      - *refuse-fixtures
      - *preflight-targets
      - *preflight
      - name: validate
        # shell, not type: atmos: a workflow run with -s appends -s to every atmos
        # step, and `atmos validate`/`list stacks` reject that flag.
        type: shell
        command: atmos validate stacks
      # Every workload stack's state lives in the backend, reached through its
      # stage's access role, so backend-cold-start must have run. iam/ci names
      # those roles by convention (it does not read its backend root stack's state).
      - name: plan-foundation
        type: atmos
        command: terraform plan --log-order grouped --query '.metadata.component == "iam" or .metadata.component == "vpc"'
      - name: confirm_foundation
        type: confirm
        prompt: Apply the IAM and VPC plans above?
        default: false
      - name: guard-foundation
        type: shell
        command: test "{{ .steps.confirm_foundation.value }}" = "true" || { echo "Bootstrap cancelled before IAM and networking."; exit 1; }
      - name: deploy-iam
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "iam"'
      - name: deploy-vpc
        type: atmos
        command: terraform deploy --from-plan --query '.metadata.component == "vpc"'
      - type: markdown
        content: |
          **Bootstrap complete.** Next steps:
          - `atmos workflow deploy -f deploy-full-stack -s <stack>`
          - `atmos workflow verify -f bootstrap`

  verify:
    description: Verify a state backend (fnx-ue1-root, or -s fnx-ew1-root) exists and is configured as expected
    stack: fnx-ue1-root
    steps:
      - name: describe-backend
        type: atmos
        command: terraform backend describe backend/main
      - name: backend-outputs
        type: atmos
        command: terraform output backend/main

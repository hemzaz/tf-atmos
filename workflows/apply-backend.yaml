# Terraform state backend (S3 bucket + backend IAM role), managed by the
# `backend` component. Native S3 lockfiles replace the DynamoDB lock table.
#
# Usage: atmos workflow apply -f apply-backend -s <stack>
workflows:
  apply:
    description: Deploy the Terraform state backend component for a stack
    steps:
      - name: plan
        type: atmos
        command: terraform plan backend/main
      - name: deploy
        type: atmos
        command: terraform deploy backend/main --from-plan

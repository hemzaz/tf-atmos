# Destroys every component of one stack in reverse dependency order.
# The stack is typed interactively and doubles as the confirmation, so a
# mistyped or missing stack can never widen the blast radius.
#
# Usage: atmos workflow destroy -f destroy-environment   (do not pass --stack)
workflows:
  destroy:
    description: Destroy all components in one stack (typed stack name required)
    steps:
      - name: stack
        type: input
        prompt: Stack to destroy (e.g. fnx-dev-testenv-01)
      # Template fixture stacks (stage "fixtures") are never deployed.
      - name: stages
        type: atmos
        command: >-
          describe stacks --process-functions=false --format json -s {{ .steps.stack.value }}
          --query '[.[].components.terraform[].settings.context.stage] | unique | join(",")'
        output: none
      - name: refuse-fixtures
        type: shell
        command: case '{{ .steps.stages.value }}' in *fixtures*) echo "Refusing a template fixture stack (stage fixtures), which is never deployed."; exit 1 ;; esac
      - name: preview
        type: atmos
        command: terraform destroy -s {{ .steps.stack.value }} --dry-run
      - name: confirmation
        type: input
        prompt: "Type the stack name again to destroy it"
      - name: guard
        type: shell
        command: test -n "{{ .steps.stack.value }}" && test "{{ .steps.confirmation.value }}" = "{{ .steps.stack.value }}" || { echo "Destruction cancelled."; exit 1; }
      - name: destroy
        type: atmos
        command: terraform destroy -s {{ .steps.stack.value }} -auto-approve
      - type: toast
        level: success
        content: Stack {{ .steps.stack.value }} destroyed

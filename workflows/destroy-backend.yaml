# Destroys the Terraform state backend (bucket, lockfiles and every state file
# stored in it). Irreversible - requires typing the confirmation phrase.
#
# Usage: atmos workflow destroy -f destroy-backend -s <stack>
workflows:
  destroy:
    description: Destroy the Terraform state backend component (irreversible)
    steps:
      - name: warning
        type: alert
        level: error
        content: >-
          This destroys the Terraform backend for the stack, including ALL state
          files. Make sure every other component in the stack is destroyed first.
      - name: confirmation
        type: input
        prompt: "Type 'yes-destroy-backend' to confirm"
      - name: guard
        type: shell
        command: test "{{ .steps.confirmation.value }}" = "yes-destroy-backend" || { echo "Destruction cancelled."; exit 1; }
      - name: destroy
        type: atmos
        command: terraform destroy backend/main -auto-approve

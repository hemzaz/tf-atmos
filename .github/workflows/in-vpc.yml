# In-VPC runs of the in-cluster components (settings.github.runner: in-vpc):
# a reusable workflow that terraform-cd.yml, drift-detection.yml and
# terraform-ci.yml call once per (stack, runner label).
#
#   start  (GitHub-hosted) starts one runner in the label's pool: it executes
#          the pool's +1 start policy (atmos workflow start-runner -f
#          ci-runners; the CI roles may execute this stack's pools' policies
#          only, iam/ci ci-runner-pools.tf);
#   run    (self-hosted, runs-on the label) an ephemeral runner of that pool
#          takes this job and plans, drift-checks or deploys the stack's
#          in-vpc instances for that label (ci-components.py --runner in-vpc
#          --label), in dependency order.
#
# Master only, apply role only (owner decision): both jobs run for a push,
# workflow_dispatch or schedule on the default branch, never for a pull
# request or the merge queue, and assume the stack's CI APPLY role, which
# trusts only the default branch's OIDC subject and is the cluster admin.
# The plan role trusts pull requests, so it never reads the cluster's Helm
# release Secrets that these plans refresh; a pull request gets a ::notice::
# from terraform-ci.yml instead of an in-VPC plan.
#
# Public repository: self-hosted runners must never run fork code. This file
# is pull-request controlled, so the `if:` is a convenience; the guard is on
# the runner: every pool's job-started hook (github-runners
# files/job-started.sh) fails, before the first step, any job that is not
# this repository's push, dispatch, schedule, merge queue or same-repository
# pull request, and production's pool (allowed_refs) any job not on
# refs/heads/master. The owner keeps "Require approval for all outside
# collaborators" on (docs/OPERATIONS.md, First-deploy inputs).
#
# A same-repository writer can still queue jobs for a label and take runners
# that a master job started (the hook then fails those jobs): a delay, not
# access; re-run the master job.
name: In-VPC run

on:
  workflow_call:
    inputs:
      stack:
        description: Atmos stack
        required: true
        type: string
      label:
        description: Runner label (the stack's full id, or settings.github.runner_label)
        required: true
        type: string
      asg:
        description: The label's runner pool Auto Scaling group (ci-components.py --pools)
        required: true
        type: string
      mode:
        description: "plan, deploy, or drift (plan with a detailed exit code that fails on changes)"
        required: true
        type: string
      base:
        description: Only the instances affected since this commit (terraform-cd.yml); deploy then also requires the stack's hosted deploy marker
        required: false
        type: string
        default: ""
      components:
        description: Space-separated in-vpc instances of this label to run (default every one, or every affected one with base)
        required: false
        type: string
        default: ""

permissions: {}

env:
  TF_CLI_ARGS_init: -lockfile=readonly

jobs:
  start:
    name: Start a runner (${{ inputs.label }})
    if: >-
      contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
      id-token: write
    env:
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: role
        name: Resolve the stack's CI apply role
        run: python3 workflows/scripts/common/ci-apply-role-arn.py --kind apply
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Start one runner (the pool's +1 start policy)
        env:
          ASG: ${{ inputs.asg }}
        run: atmos workflow start-runner -f ci-runners

  run:
    name: ${{ inputs.mode }} ${{ inputs.stack }} (${{ inputs.label }})
    needs: start
    if: >-
      contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, "${{ inputs.label }}"]
    # A hung plan or apply must not hold the runner, the stack's run and its
    # state lock for GitHub's six hours (the clock starts once a runner has
    # taken the job, not while it is queued).
    timeout-minutes: 120
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    # No `environment:`: it would change the OIDC sub (see terraform-cd.yml).
    permissions:
      contents: read
      id-token: write
      statuses: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      STACK: ${{ inputs.stack }}
      LABEL: ${{ inputs.label }}
      MODE: ${{ inputs.mode }}
      BASE_SHA: ${{ inputs.base }}
      COMPONENTS: ${{ inputs.components }}
      TF_CLI_ARGS_apply: -lock-timeout=10m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Allow git operations in the container's workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # deploy: only after this stack's GitHub-hosted instances deployed
      # (terraform-cd.yml's deploy-affected uploads deployed-<stack> on success).
      - name: Require this stack's hosted deploy
        if: inputs.mode == 'deploy' && inputs.base != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployed-${{ inputs.stack }}
          path: hosted-marker
      - id: role
        name: Resolve the stack's CI apply role
        run: python3 workflows/scripts/common/ci-apply-role-arn.py --kind apply
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Inputs reach the script through env, never interpolated into it.
      - name: Run
        shell: bash
        run: |
          set -uo pipefail
          args=(--stack "$STACK" --runner in-vpc --label "$LABEL")
          [ -n "$BASE_SHA" ] && args+=(--base "$BASE_SHA")
          listed="$(python3 workflows/scripts/common/ci-components.py "${args[@]}")" || exit 1
          components="$listed"
          if [ -n "$COMPONENTS" ]; then
            # Only instances of this label: an exact line of the list each.
            components=""
            for component in $COMPONENTS; do
              grep -qxF -- "$component" <<<"$listed" || { echo "::error::'$component' is not an in-vpc instance of $STACK on $LABEL"; exit 1; }
              components+="$component"$'\n'
            done
          fi
          case "$MODE" in
            deploy)
              while IFS= read -r component; do
                [ -n "$component" ] || continue
                echo "Deploying $component in $STACK"
                atmos terraform deploy "$component" -s "$STACK" </dev/null || exit 1
              done <<<"$components"
              mkdir -p in-vpc-marker && echo "$GITHUB_SHA" > in-vpc-marker/sha
              ;;
            plan|drift)
              # Read-only by intent: no state lock (as the hosted plans), though
              # the apply role's state role could take one.
              drifted=() failed=()
              while IFS= read -r component; do
                [ -n "$component" ] || continue
                rc=0
                atmos terraform plan "$component" -s "$STACK" --skip-planfile --hide no-changes \
                  -- -detailed-exitcode -lock=false </dev/null || rc=$?
                case "$rc" in
                  0) ;;
                  2) drifted+=("$component") ;;
                  *) failed+=("$component"); echo "::error title=Plan failed::$STACK $component (exit $rc)" ;;
                esac
              done <<<"$components"
              if [ "${#failed[@]}" -gt 0 ]; then
                echo "::error::$STACK: plan failed for ${failed[*]}"
                exit 1
              fi
              if [ "$MODE" = drift ] && [ "${#drifted[@]}" -gt 0 ]; then
                for component in "${drifted[@]}"; do echo "::warning title=Drift::$STACK $component has drifted"; done
                echo "::error::$STACK: drift in ${drifted[*]}"
                exit 2
              fi
              [ "${#drifted[@]}" -eq 0 ] || echo "$STACK: changes planned for ${drifted[*]}"
              ;;
            *)
              echo "::error::unknown mode '$MODE'"
              exit 1
              ;;
          esac
      - name: Upload the in-VPC deploy marker
        if: inputs.mode == 'deploy' && inputs.base != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: in-vpc-${{ inputs.stack }}--${{ inputs.label }}
          path: in-vpc-marker/
          retention-days: 1

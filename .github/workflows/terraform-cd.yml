# Deploy with Atmos Native CI.
#   push to the default branch: deploy, per stack, every component affected since
#     that stack's last successful deploy, in dependency order.
#   workflow_dispatch (default branch only): plan or deploy one known stack
#     (optionally one component).
# Approvals and credentials come from GitHub Environments named after the Atmos
# stack (e.g. fnx-prod-production); give production environments required
# reviewers. Each environment defines vars.AWS_ROLE_ARN (OIDC-trusted deploy role).
# Destroy is intentionally not exposed here: use
# `atmos workflow destroy -f destroy-environment` (typed confirmation).
#
# GitHub-side controls this file relies on (they cannot be expressed in YAML):
#   - Every stack environment: deployment branches = the default branch only.
#   - Deploy role trust (each environment's AWS_ROLE_ARN): aud = sts.amazonaws.com,
#     sub = repo:<org>/<repo>:environment:<stack>. Never a wildcard.
#   - Plan role trust (repo-level AWS_PLAN_ROLE_ARN, read-only): sub =
#     repo:<org>/<repo>:pull_request, plus repo:<org>/<repo>:ref:refs/heads/<default
#     branch> for drift detection and disaster-recovery checks.
#   - A tag ruleset allowing only GitHub Actions to create/update/delete
#     refs/tags/deployed/**, so only this workflow moves the deploy markers.
#
# Ordering: the workflow-level concurrency group serializes runs. GitHub keeps
# only one pending run per group, so a burst of pushes can evict a queued run.
# Nothing is lost when that happens: each stack deploys everything affected since
# its `deployed/<stack>` tag, which moves only after that stack deployed
# successfully, so the next run picks up the evicted run's commits.
# Bootstrap once per stack (otherwise a run falls back to the push's `before` commit):
#   git tag deployed/<stack> <last-deployed-sha> && git push origin deployed/<stack>
name: Terraform CD
# AWS-dependent jobs are skipped (not failed) until vars.AWS_PLAN_ROLE_ARN is set:
# there is no AWS account yet, and that variable marks AWS as configured.

on:
  push:
    branches: [main, master]
    paths:
      - atmos.yaml
      - components/**
      - stacks/**
  workflow_dispatch:
    inputs:
      stack:
        description: Atmos stack
        required: true
        type: choice
        options: [fnx-dev-testenv-01, fnx-staging-staging-01, fnx-prod-production]
      component:
        description: Component to target (empty = every component in the stack)
        required: false
        type: string
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, deploy]
        default: plan

permissions: {}

concurrency:
  group: terraform-cd-main
  cancel-in-progress: false

jobs:
  affected-stacks:
    name: Affected stacks
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.stacks.outputs.matrix }}
      any: ${{ steps.stacks.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: stacks
        name: Describe affected since each stack's last deploy
        shell: python3 {0}
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          import json, os, subprocess

          # Promotion order; stacks not listed here deploy last.
          ORDER = ["fnx-dev-testenv-01", "fnx-staging-staging-01", "fnx-prod-production"]
          head = os.environ["GITHUB_SHA"]
          push_base = os.environ.get("PUSH_BASE", "")

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          stacks = json.loads(subprocess.check_output(
              ["atmos", "describe", "stacks", "--process-functions=false",
               "--format", "json", "--query", "keys"]))
          stacks.sort(key=lambda s: (ORDER.index(s) if s in ORDER else len(ORDER), s))

          include = []
          for stack in stacks:
              tag = git("rev-parse", "-q", "--verify", f"refs/tags/deployed/{stack}^{{commit}}")
              if tag.returncode == 0:
                  base = tag.stdout.strip()
              elif push_base.strip("0"):
                  base = push_base
                  print(f"::warning::No deployed/{stack} tag; comparing against the push base {base}")
              else:
                  raise SystemExit(f"::error::No deployed/{stack} tag and no push base; create the tag first")
              if base == head:
                  continue
              if git("merge-base", "--is-ancestor", base, head).returncode != 0:
                  print(f"::warning::{stack}: {base} is not an ancestor of {head} (newer deploy or rewritten history); skipping")
                  continue
              subprocess.run(
                  ["atmos", "describe", "affected", "--base", base, "-s", stack,
                   "--include-dependents", "--process-functions=false",
                   "--format", "json", "--file", "affected.json"], check=True)
              with open("affected.json") as f:
                  if json.load(f):
                      include.append({"stack": stack, "base": base})

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': include})}\n")
              out.write(f"any={'true' if include else 'false'}\n")

  deploy-affected:
    name: Deploy ${{ matrix.stack }}
    needs: affected-stacks
    if: needs.affected-stacks.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    environment: ${{ matrix.stack }}
    permissions:
      contents: read
      id-token: write
      statuses: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.affected-stacks.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Deploy affected components
        env:
          BASE_SHA: ${{ matrix.base }}
          STACK: ${{ matrix.stack }}
        run: atmos terraform deploy --affected --sha "$BASE_SHA" -s "$STACK"
      - name: Record successful deploy
        run: mkdir -p deployed && echo "$GITHUB_SHA" > deployed/sha
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-${{ matrix.stack }}
          path: deployed/
          retention-days: 1

  # The only job with contents: write. For each stack whose deploy succeeded (it
  # uploaded a marker artifact), move deployed/<stack> forward to this commit.
  mark-deployed:
    name: Move deploy markers
    needs: [affected-stacks, deploy-affected]
    if: always() && needs.affected-stacks.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deployed-*
          path: markers
      - name: Move deployed/<stack> tags
        run: |
          shopt -s nullglob
          for dir in markers/deployed-*; do
            stack="${dir#markers/deployed-}"
            sha="$(cat "$dir/sha")"
            [[ "$stack" =~ ^[A-Za-z0-9._-]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad marker $dir"; exit 1; }
            ref="refs/tags/deployed/$stack"
            if current="$(git rev-parse -q --verify "$ref^{commit}")" && ! git merge-base --is-ancestor "$current" "$sha"; then
              echo "::warning::$ref ($current) is not an ancestor of $sha; leaving it"
              continue
            fi
            git push --force origin "$sha:$ref"
          done

  dispatch:
    name: ${{ inputs.action }} ${{ inputs.stack }} ${{ inputs.component }}
    # Re-check the stack against the known list: API callers are not bound to the
    # choice options, and `environment:` would auto-create an unprotected environment.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJson('["fnx-dev-testenv-01","fnx-staging-staging-01","fnx-prod-production"]'), inputs.stack)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
      statuses: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTION: ${{ inputs.action }}
      COMPONENT: ${{ inputs.component }}
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Validate stacks
        run: atmos validate stacks
      - name: Run
        # Inputs are passed via env (not interpolated into the script) to avoid injection.
        run: atmos terraform "$ACTION" ${COMPONENT:+"$COMPONENT"} -s "$STACK"

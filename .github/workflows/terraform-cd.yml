# Deploy with Atmos Native CI.
#   push to main/master: deploy the components affected by the push, one job per
#     affected stack, in dependency order (`atmos terraform deploy --affected`).
#   workflow_dispatch:   plan or deploy one stack (optionally one component).
# Approvals and credentials come from GitHub Environments named after the Atmos
# stack (e.g. fnx-prod-production); give production environments required
# reviewers. Each environment defines vars.AWS_ROLE_ARN (OIDC-trusted deploy role).
# Destroy is intentionally not exposed here: use
# `atmos workflow destroy -f destroy-environment` (typed confirmation).
name: Terraform CD

on:
  push:
    branches: [main, master]
    paths:
      - atmos.yaml
      - components/**
      - stacks/**
  workflow_dispatch:
    inputs:
      stack:
        description: Atmos stack (e.g. fnx-dev-testenv-01)
        required: true
        type: string
      component:
        description: Component to target (empty = every component in the stack)
        required: false
        type: string
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, deploy]
        default: plan

permissions: {}

jobs:
  affected-stacks:
    name: Affected stacks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
      any: ${{ steps.stacks.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Describe affected
        env:
          BASE_SHA: ${{ github.event.before }}
        run: >-
          atmos describe affected --base "$BASE_SHA" --include-dependents
          --process-functions=false --format json --file affected.json
      - id: stacks
        shell: python3 {0}
        run: |
          import json, os
          stacks = sorted({item["stack"] for item in json.load(open("affected.json"))})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"stacks={json.dumps({'stack': stacks})}\n")
              out.write(f"any={'true' if stacks else 'false'}\n")

  deploy-affected:
    name: Deploy ${{ matrix.stack }}
    needs: affected-stacks
    if: needs.affected-stacks.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    environment: ${{ matrix.stack }}
    permissions:
      contents: read
      id-token: write
      statuses: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.affected-stacks.outputs.stacks) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Deploy affected components
        env:
          BASE_SHA: ${{ github.event.before }}
          STACK: ${{ matrix.stack }}
        run: atmos terraform deploy --affected --sha "$BASE_SHA" -s "$STACK"

  dispatch:
    name: ${{ inputs.action }} ${{ inputs.stack }} ${{ inputs.component }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
      statuses: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTION: ${{ inputs.action }}
      COMPONENT: ${{ inputs.component }}
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Validate stacks
        run: atmos validate stacks
      - name: Run
        # Inputs are passed via env (not interpolated into the script) to avoid injection.
        run: atmos terraform "$ACTION" ${COMPONENT:+"$COMPONENT"} -s "$STACK"

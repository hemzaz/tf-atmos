# Semver releases from conventional commits (owner decision Q9), master only.
# release-please keeps one release PR open (CHANGELOG.md + .release-please-manifest.json);
# merging it tags vX.Y.Z and publishes the GitHub release. Config:
# release-please-config.json. See docs/OPERATIONS.md#releases.
#
# Token: a PR opened with GITHUB_TOKEN triggers no workflow, so the required
# `CI gate` would never report on the release PR. With vars.RELEASE_APP_CLIENT_ID
# and secrets.RELEASE_APP_PRIVATE_KEY set (a GitHub App with contents and
# pull-requests write on this repository), the PR is opened with the App's token
# and CI runs. Without them the job falls back to GITHUB_TOKEN and warns.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # workflow_dispatch can name any branch: releases are cut from master only.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `release-as` in release-please-config.json is sticky: once its tag exists,
      # release-please would propose the same version again. Fail loudly instead.
      - name: Refuse a release-as that is already released
        run: |
          set -eu
          ver=$(jq -r '.packages["."]["release-as"] // empty' release-please-config.json)
          if [ -n "$ver" ] && git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "::error title=release-as is stale::v$ver is released. Remove \"release-as\" from release-please-config.json."
            exit 1
          fi
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Warn about the GITHUB_TOKEN fallback
        if: steps.app-token.outcome != 'success'
        run: echo "::warning title=No release App token::vars.RELEASE_APP_CLIENT_ID is unset, so the release PR is opened with GITHUB_TOKEN and CI gate will not run on it. See docs/OPERATIONS.md#releases."
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

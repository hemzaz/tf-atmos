# Read-only disaster recovery checks from the Atmos DR workflows
# (workflows/disaster-recovery.yaml). Failover and failback are guided,
# interactive runbooks and are intentionally run by an operator, not CI.
#
# Runs only on the default branch, only for a known stack, with that stack's
# read-only iam/ci plan role (workflows/scripts/common/ci-apply-role-arn.py
# --kind plan; the only principal its stage's read-only state role trusts).
# It uses no GitHub Environment, so its OIDC sub is
# repo:<org>/<repo>:ref:refs/heads/<default branch>, which every plan role
# trusts. vars.AWS_PLAN_ROLE_ARN only marks AWS as configured. The scripts read the state bucket (management account) only through
# the stack's read-only backend role (workflows/scripts/common/state-read-role.sh).
# Optional: vars.AWS_REGION.
name: Disaster recovery
# AWS-dependent jobs are skipped (not failed) until vars.AWS_PLAN_ROLE_ARN is set:
# there is no AWS account yet, and that variable marks AWS as configured.

on:
  workflow_dispatch:
    inputs:
      action:
        description: DR check to run
        required: true
        type: choice
        options: [dr-status, recover-state, recover-database]
      # A string, not a choice list: any stack `ci-stacks.py --check` accepts,
      # so a new stack needs no edit here.
      stack:
        description: Atmos stack (one that python3 workflows/scripts/common/ci-stacks.py lists)
        required: true
        type: string
      component_prefix:
        description: recover-state only - state key prefix to list (e.g. vpc/)
        required: false
        type: string

permissions: {}

# Every `terraform init` (Atmos runs one before plan/apply/output) refuses to
# change the committed .terraform.lock.hcl: a provider that is not locked fails
# instead of floating. Regenerate locks: atmos workflow providers-lock -f providers.
env:
  TF_CLI_ARGS_init: -lockfile=readonly

jobs:
  disaster-recovery:
    name: ${{ inputs.action }} ${{ inputs.stack }}
    # The stack is checked by the first step, before any credential.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      STACK: ${{ inputs.stack }}
      COMPONENT_PREFIX: ${{ inputs.component_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unknown and actions_enabled: false stacks are refused here, before
      # any credential.
      - name: Check the stack
        run: python3 workflows/scripts/common/ci-stacks.py --check "$STACK"
      - id: role
        name: Resolve the stack's CI plan role
        run: python3 workflows/scripts/common/ci-apply-role-arn.py --kind plan
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Run DR workflow
        run: atmos workflow "$ACTION" -f disaster-recovery

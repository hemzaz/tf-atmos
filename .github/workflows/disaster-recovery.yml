# Read-only disaster recovery checks from the Atmos DR workflows
# (workflows/disaster-recovery.yaml). Failover and failback are guided,
# interactive runbooks and are intentionally run by an operator, not CI.
#
# Runs only on the default branch, only for a known stack, with the read-only
# plan role: repo-level vars.AWS_PLAN_ROLE_ARN, or for fnx-prod-production
# production's own vars.AWS_PROD_PLAN_ROLE_ARN (the only principal the prod
# read-only state role trusts). It uses no GitHub Environment, so its OIDC sub
# is repo:<org>/<repo>:ref:refs/heads/<default branch>, which both plan roles
# trust. The scripts read the state bucket (management account) only through
# the stack's read-only backend role (workflows/scripts/common/state-read-role.sh).
# Optional: vars.AWS_REGION.
name: Disaster recovery
# AWS-dependent jobs are skipped (not failed) until vars.AWS_PLAN_ROLE_ARN is set:
# there is no AWS account yet, and that variable marks AWS as configured.

on:
  workflow_dispatch:
    inputs:
      action:
        description: DR check to run
        required: true
        type: choice
        options: [dr-status, recover-state, recover-database]
      stack:
        description: Atmos stack
        required: true
        type: choice
        options: [fnx-dev-testenv-01, fnx-staging-staging-01, fnx-prod-production]
      component_prefix:
        description: recover-state only - state key prefix to list (e.g. vpc/)
        required: false
        type: string

permissions: {}

# Every `terraform init` (Atmos runs one before plan/apply/output) refuses to
# change the committed .terraform.lock.hcl: a provider that is not locked fails
# instead of floating. Regenerate locks: atmos workflow providers-lock -f providers.
env:
  TF_CLI_ARGS_init: -lockfile=readonly

jobs:
  disaster-recovery:
    name: ${{ inputs.action }} ${{ inputs.stack }}
    # API callers are not bound to the choice options, so re-check the stack.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJson('["fnx-dev-testenv-01","fnx-staging-staging-01","fnx-prod-production"]'), inputs.stack)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      STACK: ${{ inputs.stack }}
      COMPONENT_PREFIX: ${{ inputs.component_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the production plan role
        if: inputs.stack == 'fnx-prod-production' && vars.AWS_PROD_PLAN_ROLE_ARN == ''
        run: |
          echo "::error::vars.AWS_PROD_PLAN_ROLE_ARN (fnx-prod-production's iam/ci ci_plan_role_arn) is not set"
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.stack == 'fnx-prod-production' && vars.AWS_PROD_PLAN_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Run DR workflow
        run: atmos workflow "$ACTION" -f disaster-recovery

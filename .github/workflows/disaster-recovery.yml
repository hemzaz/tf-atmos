# Read-only disaster recovery checks from the Atmos DR workflows
# (workflows/disaster-recovery.yaml). Failover and failback are guided,
# interactive runbooks and are intentionally run by an operator, not CI.
#
# Required configuration: a GitHub Environment named after the stack with
# vars.AWS_ROLE_ARN; optional vars.ATMOS_VERSION / vars.AWS_REGION.
name: Disaster recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: DR check to run
        required: true
        type: choice
        options: [dr-status, recover-state, recover-database]
      stack:
        description: Atmos stack (e.g. fnx-prod-production)
        required: true
        type: string
      component_prefix:
        description: recover-state only - state key prefix to list (e.g. vpc/)
        required: false
        type: string

permissions: {}

jobs:
  disaster-recovery:
    name: ${{ inputs.action }} ${{ inputs.stack }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      STACK: ${{ inputs.stack }}
      COMPONENT_PREFIX: ${{ inputs.component_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Run DR workflow
        run: atmos workflow "$ACTION" -f disaster-recovery

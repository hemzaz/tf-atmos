# Scheduled drift detection: a plan of every deployable component in every
# stack, except instances with settings.github.actions_enabled: false (skipped
# with a ::notice::). The in-cluster components (settings.github.runner:
# in-vpc), which a hosted runner cannot reach, are planned on the stack's
# self-hosted runners in the VPC (in-vpc.yml, docs/OPERATIONS.md). Stacks with
# drift fail the job and show the changes in the job summary (Atmos Native CI).
#
# Upgrade path: Atmos Pro drift detection (settings.pro.drift_detection +
# `atmos terraform plan <component> -s <stack> --upload-status`) adds drift
# history, remediation workflows and dependency-ordered applies.
#
# Required configuration: vars.AWS_PLAN_ROLE_ARN (any non-empty value marks AWS
# as configured), optional vars.AWS_REGION. Each stack is planned with its own
# iam/ci plan role (workflows/scripts/common/ci-apply-role-arn.py --kind plan).
name: Drift detection
# AWS-dependent jobs are skipped (not failed) until vars.AWS_PLAN_ROLE_ARN is set:
# there is no AWS account yet, and that variable marks AWS as configured.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      stack:
        description: Only check this stack (empty = all stacks)
        required: false
        type: string

permissions: {}

# Every `terraform init` (Atmos runs one before plan/apply/output) refuses to
# change the committed .terraform.lock.hcl: a provider that is not locked fails
# instead of floating. Regenerate locks: atmos workflow providers-lock -f providers.
env:
  TF_CLI_ARGS_init: -lockfile=readonly

jobs:
  stacks:
    name: Stacks
    # workflow_dispatch is not branch-restricted by GitHub, so without this a
    # dispatch from any branch would run that branch's code with the plan role.
    # disaster-recovery.yml and terraform-cd.yml already carry the same guard.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.stacks.outputs.matrix }}
      in_vpc: ${{ steps.stacks.outputs.in_vpc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stacks
        shell: python3 {0}
        env:
          ONLY_STACK: ${{ inputs.stack }}
        run: |
          import json, os, subprocess

          out_file = os.environ["GITHUB_OUTPUT"]
          only_stack = os.environ.get("ONLY_STACK", "")
          helper = ["python3", "workflows/scripts/common/ci-stacks.py"]

          # The CI stacks, from ci-stacks.py (the one source terraform-cd.yml
          # and disaster-recovery.yml use too): every stack except those whose
          # terraform instances ALL set settings.github.actions_enabled: false
          # (fnx-ue1-root, the emulator-only fnx-ue1-local-*, the fnx-ue1-fixtures-*
          # templates; emulator.yml covers the local ones). The same key Cloud
          # Posse's atmos-terraform-plan/-apply actions read. A stack with only
          # some opted-out instances stays; the plan step skips just those.
          # An explicit ONLY_STACK dispatch must still name a real, CI-enabled
          # stack (--check), so a local stack never enters this
          # AWS-credentialed matrix and a typo fails here, not in detect-drift.
          # ONLY_STACK reaches the helper as one argv entry, never a shell.
          if only_stack:
              checked = subprocess.run([*helper, "--check", only_stack], capture_output=True, text=True)
              if checked.returncode != 0:
                  raise SystemExit(checked.stderr.strip())
              selected = [only_stack]
          else:
              # Sorted by name, as this matrix always was (its jobs run in parallel).
              selected = sorted(subprocess.check_output(helper, text=True).split())

          matrix = {"include": [{"stack": s} for s in selected]}

          # The in-VPC part: one entry per (stack, runner pool) its in-cluster
          # instances need (ci-components.py --pools).
          in_vpc = []
          for stack in selected:
              pools = subprocess.check_output(
                  ["python3", "workflows/scripts/common/ci-components.py", "--stack", stack, "--pools"], text=True)
              for line in pools.splitlines():
                  pool = json.loads(line)
                  in_vpc.append({"stack": stack, "label": pool["label"], "asg": pool["asg"]})

          with open(out_file, "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"in_vpc={json.dumps({'include': in_vpc})}\n")

  detect-drift:
    name: Drift ${{ matrix.stack }}
    needs: stacks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.stacks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The stack's own iam/ci plan role, in its own account: the only
      # principal its stage's read-only state role trusts.
      - id: role
        name: Resolve the stack's CI plan role
        env:
          STACK: ${{ matrix.stack }}
        run: python3 workflows/scripts/common/ci-apply-role-arn.py --kind plan
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # A READ-only state role (stacks/orgs/fnx/_defaults.yaml: the prod one
      # for prod stacks), hence -lock=false: it cannot write a .tflock object.
      # One plan per instance (ci-components.py) instead of a stack-wide
      # `plan -s`, which cannot skip the actions_enabled: false instances.
      # Every instance is planned (keep going); the step fails with exit 1 if
      # any plan errored, else with 2 if any drifted (terraform's
      # -detailed-exitcode meanings), and annotates each.
      - name: Plan (detailed exit code)
        shell: bash
        env:
          STACK: ${{ matrix.stack }}
          TFSTATE_ACCESS: read
        run: |
          set -uo pipefail
          components="$(python3 workflows/scripts/common/ci-components.py --stack "$STACK")" || exit 1
          drifted=() failed=()
          while IFS= read -r component; do
            [ -n "$component" ] || continue
            rc=0
            atmos terraform plan "$component" -s "$STACK" --skip-planfile --hide no-changes \
              -- -detailed-exitcode -lock=false </dev/null || rc=$?
            case "$rc" in
              0) ;;
              2) drifted+=("$component"); echo "::warning title=Drift::$STACK $component has drifted" ;;
              *) failed+=("$component"); echo "::error title=Plan failed::$STACK $component (exit $rc)" ;;
            esac
          done <<<"$components"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::$STACK: plan failed for ${failed[*]}"
            exit 1
          fi
          if [ "${#drifted[@]}" -gt 0 ]; then
            echo "::error::$STACK: drift in ${drifted[*]}"
            exit 2
          fi
          echo "$STACK: no drift"

  drift-in-vpc:
    name: Drift in-VPC ${{ matrix.stack }} (${{ matrix.label }})
    needs: stacks
    if: needs.stacks.outputs.in_vpc != '' && fromJson(needs.stacks.outputs.in_vpc).include[0] != null
    permissions:
      contents: read
      id-token: write
      statuses: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.stacks.outputs.in_vpc) }}
    # No `secrets: inherit`: in-vpc.yml uses only github.token.
    uses: ./.github/workflows/in-vpc.yml
    with:
      stack: ${{ matrix.stack }}
      label: ${{ matrix.label }}
      asg: ${{ matrix.asg }}
      mode: drift
      role: plan

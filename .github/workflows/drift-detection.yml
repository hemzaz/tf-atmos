# Scheduled drift detection: a plan of every deployable component in every
# stack, except instances with settings.github.actions_enabled: false (the
# in-cluster components, which a hosted runner cannot reach; skipped with a
# ::notice::, see docs/OPERATIONS.md). Stacks with drift fail the job and show
# the changes in the job summary (Atmos Native CI).
#
# Upgrade path: Atmos Pro drift detection (settings.pro.drift_detection +
# `atmos terraform plan <component> -s <stack> --upload-status`) adds drift
# history, remediation workflows and dependency-ordered applies.
#
# Required configuration: vars.AWS_PLAN_ROLE_ARN (read-only OIDC role),
# vars.AWS_PROD_PLAN_ROLE_ARN (production's own plan role, for prod stacks),
# optional vars.AWS_REGION.
name: Drift detection
# AWS-dependent jobs are skipped (not failed) until vars.AWS_PLAN_ROLE_ARN is set:
# there is no AWS account yet, and that variable marks AWS as configured.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      stack:
        description: Only check this stack (empty = all stacks)
        required: false
        type: string

permissions: {}

# Every `terraform init` (Atmos runs one before plan/apply/output) refuses to
# change the committed .terraform.lock.hcl: a provider that is not locked fails
# instead of floating. Regenerate locks: atmos workflow providers-lock -f providers.
env:
  TF_CLI_ARGS_init: -lockfile=readonly

jobs:
  stacks:
    name: Stacks
    # workflow_dispatch is not branch-restricted by GitHub, so without this a
    # dispatch from any branch would run that branch's code with the plan role.
    # disaster-recovery.yml and terraform-cd.yml already carry the same guard.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.stacks.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stacks
        shell: python3 {0}
        env:
          ONLY_STACK: ${{ inputs.stack }}
        run: |
          import json, os, subprocess

          out_file = os.environ["GITHUB_OUTPUT"]
          only_stack = os.environ.get("ONLY_STACK", "")

          # fnx-local-* target the Floci/LocalEmu emulators (account_id
          # 000000000000, see stacks/orgs/fnx/local/_defaults.yaml) and have
          # no AWS_PLAN_ROLE_ARN trust; emulator.yml covers them instead.
          # Excluded via settings.github.actions_enabled (the same key Cloud
          # Posse's own atmos-terraform-plan/-apply actions read; data-driven,
          # survives a stack rename) rather than matching the `fnx-local-`
          # name prefix. This matrix is per-stack, so a stack is excluded
          # only when EVERY one of its terraform components opts out.
          stacks = json.loads(subprocess.check_output(
              ["atmos", "describe", "stacks", "--process-functions=false",
               "--format", "json", "--sections", "settings"]))
          disabled = set()
          for stack, config in stacks.items():
              components = (config.get("components") or {}).get("terraform") or {}
              if components and all(
                  (((spec or {}).get("settings") or {}).get("github") or {}).get("actions_enabled") is False
                  for spec in components.values()
              ):
                  disabled.add(stack)

          if only_stack:
              # An explicit ONLY_STACK dispatch still must name a real,
              # CI-enabled stack: the local stacks must never enter this
              # AWS-credentialed matrix, dispatch included, and a typo must
              # fail up front instead of producing a matrix entry that fails
              # later in `detect-drift`.
              if only_stack not in stacks:
                  raise SystemExit(f"::error::Unknown stack '{only_stack}'")
              if only_stack in disabled:
                  raise SystemExit(
                      f"::error::'{only_stack}' has settings.github.actions_enabled: false "
                      "(local/emulator stack); drift detection only runs against real AWS "
                      "stacks. Use the Emulator workflow for local stacks."
                  )
              selected = [only_stack]
          else:
              selected = sorted(s for s in stacks if s not in disabled)

          # A master-only stack (settings.github.pull_request_plans_enabled:
          # false - production, D3) is planned with its own plan role,
          # vars.AWS_PROD_PLAN_ROLE_ARN: the only principal its read-only
          # state role trusts.
          def master_only(stack):
              components = (stacks[stack].get("components") or {}).get("terraform") or {}
              return any(
                  (((spec or {}).get("settings") or {}).get("github") or {}).get("pull_request_plans_enabled") is False
                  for spec in components.values()
              )

          matrix = {"include": [{"stack": s, "master_only": master_only(s)} for s in selected]}

          with open(out_file, "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")

  detect-drift:
    name: Drift ${{ matrix.stack }}
    needs: stacks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.stacks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the production plan role
        if: matrix.master_only && vars.AWS_PROD_PLAN_ROLE_ARN == ''
        run: |
          echo "::error::vars.AWS_PROD_PLAN_ROLE_ARN (fnx-prod-production's iam/ci ci_plan_role_arn) is not set"
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.master_only && vars.AWS_PROD_PLAN_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      # A READ-only state role (stacks/orgs/fnx/_defaults.yaml: the prod one
      # for prod stacks), hence -lock=false: it cannot write a .tflock object.
      # One plan per instance (ci-components.py) instead of a stack-wide
      # `plan -s`, which cannot skip the actions_enabled: false instances.
      # Every instance is planned (keep going); the step fails with exit 1 if
      # any plan errored, else with 2 if any drifted (terraform's
      # -detailed-exitcode meanings), and annotates each.
      - name: Plan (detailed exit code)
        shell: bash
        env:
          STACK: ${{ matrix.stack }}
          TFSTATE_ACCESS: read
        run: |
          set -uo pipefail
          components="$(python3 workflows/scripts/common/ci-components.py --stack "$STACK")" || exit 1
          drifted=() failed=()
          while IFS= read -r component; do
            [ -n "$component" ] || continue
            rc=0
            atmos terraform plan "$component" -s "$STACK" --skip-planfile --hide no-changes \
              -- -detailed-exitcode -lock=false </dev/null || rc=$?
            case "$rc" in
              0) ;;
              2) drifted+=("$component"); echo "::warning title=Drift::$STACK $component has drifted" ;;
              *) failed+=("$component"); echo "::error title=Plan failed::$STACK $component (exit $rc)" ;;
            esac
          done <<<"$components"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::$STACK: plan failed for ${failed[*]}"
            exit 1
          fi
          if [ "${#drifted[@]}" -gt 0 ]; then
            echo "::error::$STACK: drift in ${drifted[*]}"
            exit 2
          fi
          echo "$STACK: no drift"

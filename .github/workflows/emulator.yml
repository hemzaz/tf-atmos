# Execute Terraform against local AWS emulators.
#
# This is the only CI gate that actually PROVISIONS. Everything else in
# terraform-ci.yml is static analysis, and static analysis has repeatedly passed
# on components that could not be created at all:
#
#   #140  every lambda instance was uncreatable - no deployment package, and
#         aws_lambda_function requires one at APPLY time.
#   #142  rds backup and maintenance windows overlapped in staging and prod;
#         RDS rejects that at CreateDBInstance.
#   #144  monitoring interpolated a null api_gateway_name, so every instance in
#         dev, staging and prod failed at PLAN time.
#   #145  iam's external_id regex exceeded Go RE2's 1000-repetition cap, so the
#         variable could never be set.
#
# Six green static gates said otherwise every time.
#
# Deliberately NOT gated on vars.AWS_PLAN_ROLE_ARN. The plan job in
# terraform-ci.yml is skipped until an AWS account exists; these lanes need no
# account, no credentials and no cost, so they run on every PR regardless. That
# is the whole point: executing coverage without waiting for an account.
#
# The LocalEmu lane is not idempotent across emulator restarts locally, which is
# why it is run by hand there. In CI that does not apply - every run is a fresh
# machine with a fresh emulator.
name: Emulator

on:
  # PRs (any base, stacked ones included), the merge queue and pushes to master
  # run this lane through terraform-ci.yml's `emulator` job, which applies the
  # path filter and puts the result under the required `CI gate` check. A
  # trigger of its own here would run the lane twice.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

# Every `terraform init` (Atmos runs one before plan/apply/output) refuses to
# change the committed .terraform.lock.hcl: a provider that is not locked fails
# instead of floating. Regenerate locks: atmos workflow providers-lock -f providers.
env:
  TF_CLI_ARGS_init: -lockfile=readonly

jobs:
  # The Floci sandbox is NOT wired in yet, on purpose. Two problems surfaced on
  # the first CI runs, and only the first is solved:
  #   1. It cannot run inside ghcr.io/cloudposse/atmos - `atmos emulator up aws`
  #      starts a Floci CONTAINER and that image has no docker-in-docker
  #      ("container runtime not available: neither docker nor podman is
  #      available"). Solved by using the ubuntu runner, which has Docker.
  #   2. Unsolved: on the runner, vpc/main then fails with
  #      "waiting for Route Table Association (rtbassoc-...) create: timeout
  #      while waiting for state to become 'associated' (timeout: 5m0s)" -
  #      Floci's DescribeRouteTables never reports the association. That is an
  #      emulator fidelity gap, not a component defect, and it burns five
  #      minutes before failing.
  # Adding the job before that is understood would mean a permanently red gate,
  # and marking it continue-on-error would be a gate that cannot fail - worse
  # than no gate. The Floci lane still runs locally: atmos workflow sandbox -f sandbox
  localemu:
    name: LocalEmu lane (rds, monitoring, iam)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.13 exactly. 3.12 lacks warnings.deprecated (PEP 702) and six LocalEmu
      # services die at runtime; on 3.14 localemu 1.2.0 cannot be installed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: cloudposse/github-action-setup-atmos@9e8d1e2db56fe851a85871d5993d63e182b66536 # v3.6.0
        with:
          # Same Atmos as the digest-pinned ghcr.io/cloudposse/atmos image in
          # terraform-ci.yml; bump both together (Dependabot only bumps the image).
          atmos-version: "1.229.0"

      - name: Apply and destroy against LocalEmu
        run: atmos workflow localemu -f localemu

      # The lane's own teardown runs as the workflow's last step, but a failed
      # apply skips it. Cheap, and it keeps the failure log honest.
      - name: Stop LocalEmu
        if: always()
        run: atmos workflow localemu-down -f localemu || true

      - name: Upload LocalEmu log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localemu-log
          path: /tmp/tf-atmos-localemu/localemu.log
          if-no-files-found: ignore

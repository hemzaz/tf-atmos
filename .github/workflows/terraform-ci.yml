# Pull request / merge queue checks with Atmos Native CI.
# Required configuration:
#   vars.ATMOS_VERSION       Atmos container tag (defaults to 1.229.0)
#   vars.AWS_REGION          region for OIDC credentials (defaults to eu-west-2)
#   vars.AWS_PLAN_ROLE_ARN   read-only IAM role trusted for this repo's GitHub OIDC tokens
#   (plan jobs are skipped while it is unset)
# Terraform and scanners are installed by the Atmos toolchain (dependencies.tools).
#
# GitHub-side controls this file relies on (they cannot be expressed in YAML):
#   - Plan role trust (AWS_PLAN_ROLE_ARN, read-only): aud = sts.amazonaws.com, sub =
#     repo:<org>/<repo>:pull_request (plus :ref:refs/heads/<default branch> for the
#     drift and DR workflows). It must never be the deploy role, since plans run PR code.
#   - Deploy roles trust only repo:<org>/<repo>:environment:<stack>; see terraform-cd.yml.
#   - Fork PRs get no OIDC token or secrets under `pull_request`; do not switch
#     this workflow to `pull_request_target`.
#
# The plan runs PR-controlled code (providers, external data sources), and
# Terraform inherits the plan step's environment, so a token there
# (GITHUB_TOKEN or ATMOS_CI_GITHUB_TOKEN) would be readable by that code. The
# job's GITHUB_TOKEN is therefore never in the plan step; only the comment step
# gets it. Without a token Atmos Native CI still writes the job summary and step
# outputs, and skips its own check runs and PR comment (logged at debug level,
# not an error); the comment step posts the plan summary instead.
#
# Residual risk (same-repo PRs): `pull_request` runs the workflow file from the
# PR head, so anyone who can push a branch here can edit this file to hand the
# pull-requests: write token or the OIDC plan-role credentials to their own
# code. Keep the plan role read-only, protect .github/** with CODEOWNERS review,
# and require approval to run workflows for outside collaborators.
name: Terraform CI

on:
  # No `branches:` filter: stacked PRs (PR -> feature branch, not master) must
  # get the same static-analysis gates as PRs into master. Without this, a
  # stacked PR only gets GitGuardian and the integration PR becomes the first
  # real gate (see #171-#179).
  pull_request:
    paths:
      - atmos.yaml
      - components/**
      - stacks/**
      - workflows/**
      - scripts/**
      - .trivyignore.yaml
      - .checkov.baseline
      - .github/workflows/terraform-ci.yml
  # master only ever moves by a squash-merged, already-PR-gated commit, so a
  # push here re-running the full static-analysis/plan-sweep/security-scan
  # sweep is pure redundant cost -- those jobs opt back out with
  # `if: github.event_name != 'push'` below. terraform-test does NOT opt out:
  # it is the one gate that must also run post-merge (see its own `needs`-free
  # `if`), since a component's tests/ must stay green on master, not just on
  # the PR that touched it.
  push:
    branches: [master]
  merge_group:

permissions: {}

jobs:
  lint:
    name: Lint & validate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installing tflint needs a GitHub token: the aqua registry verifies its
      # release with `gh attestation verify` (GH_TOKEN), and `tflint --init`
      # downloads the .tflint.hcl plugins from GitHub releases (GITHUB_TOKEN,
      # for rate limits). Do it in its own step so the read-only token never
      # reaches the lint step, which runs PR code; that step reuses the install.
      - name: Install tflint and its plugins
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: atmos workflow tflint-init -f lint
      - name: Lint (fmt, yamllint, tflint, trivy)
        run: atmos workflow lint -f lint
      - name: Validate config, stacks and root modules
        run: atmos workflow validate-all -f validate-enhanced

  plan-sweep:
    # The rung between `terraform validate` and the emulator lanes: bind each
    # stack's resolved variables to its component and plan. No AWS credentials
    # and none wanted -- variable validations and (for components that need no
    # provider data) lifecycle preconditions are evaluated before the provider
    # authenticates, so every plan is expected to end at InvalidClientTokenId
    # with nothing having objected on the way. A pair that objects earlier is
    # a real finding; scripts/plan-sweep.sh exits 1 on it.
    #
    # Deliberately not in the lint job: this plans ~90 pairs and is the slowest
    # gate in the file, and a lint failure should not hide a sweep failure or
    # the other way round.
    name: Plan sweep
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # ~9 minutes on a clean run. A hung plan otherwise holds a runner for the
    # 6-hour default before anyone hears about it.
    timeout-minutes: 30
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One shared provider cache across ~90 `terraform init`s. Without it each
      # pair redownloads the AWS provider and the job takes hours.
      #
      # The sweep builds its mirror with `git ls-files`. The workspace is
      # created by the runner's user and the container runs as root, so git
      # refuses the repository as "dubious ownership" -- checkout's own
      # safe.directory entry goes into a temporary global config that later
      # steps never see -- and the sweep stops before planning anything.
      - name: Plan every stack/component pair
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          atmos workflow plan-sweep -f validate-enhanced

  security-scan:
    name: Security scan
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same "dubious ownership" cause as the plan-sweep job above: the
      # workspace is owned by the runner's user, the container runs as root,
      # and checkout's own safe.directory entry doesn't reach later steps.
      # trivy/checkov don't touch git, but upload-sarif does (it shells out to
      # `git rev-parse` for the commit oid and ref), so it needs this too.
      - name: Trivy + Checkov (SARIF)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          atmos workflow security-scan -f lint
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: reports

  terraform-test:
    # Runs `terraform test` (tests/*.tftest.hcl) for every component that has
    # a tests/ directory. Unlike lint/plan-sweep/security-scan/affected above,
    # this job does NOT opt out of `push`: a component's unit tests must stay
    # green on master too, not only on the PR that last touched it.
    name: Terraform tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
      # Some tests (components/terraform/kms) exercise the real aws provider
      # with dummy credentials -- see the comment in that test file -- never
      # real ones. Setting them here means every step in this job, including
      # ones that don't go through the atmos-installed terraform, agrees.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 -- the component-selection step below diffs against
          # the PR's base SHA, which needs history beyond the merge commit.
          fetch-depth: 0
          persist-credentials: false
      # Same "dubious ownership" cause as the other jobs above: the workspace
      # is owned by the runner's user and the container runs as root.
      - name: Allow git operations in the container's workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # `dependencies.tools` (the repo's usual toolchain pattern) only injects
      # terraform into the PATH of the `atmos workflow`/`atmos terraform`
      # subprocess that declares it. The steps below run terraform directly
      # (providers lock, then the test script) so they can sit around
      # actions/cache, which is a GitHub Action, not something an atmos
      # workflow step can invoke -- so terraform needs to be on $GITHUB_PATH
      # for the rest of this job instead.
      - name: Install Terraform from the toolchain
        run: |
          atmos toolchain install terraform@1.16.3
          atmos toolchain env --format=github
      # Component-directory-level selection, deliberately separate from the
      # `affected` job's stack/component matrix above: that job diffs stack
      # instances for planning, but a component with no stack instance (or a
      # `_library` submodule with none of its own) would never show up there.
      # This selects by component *directory*, and independently walks each
      # candidate's own .tf files for `source = "../..."` references so a
      # change to a shared module (e.g. kms sourcing ../_library/kms-key)
      # re-runs the tests of every component that sources it.
      - id: components
        name: Determine which components to test
        shell: python3 {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os, re, subprocess

          TERRAFORM_DIR = "components/terraform"
          event_name = os.environ["EVENT_NAME"]
          base_sha = os.environ.get("BASE_SHA") or ""

          def has_tests(component):
              return os.path.isdir(os.path.join(TERRAFORM_DIR, component, "tests"))

          all_components = sorted(
              c for c in os.listdir(TERRAFORM_DIR)
              if c != "_library"
              and os.path.isdir(os.path.join(TERRAFORM_DIR, c))
              and has_tests(c)
          )

          SOURCE_RE = re.compile(r'source\s*=\s*"(\.\./[^"]+)"')

          def sourced_dirs(component):
              comp_dir = os.path.join(TERRAFORM_DIR, component)
              dirs = set()
              for name in os.listdir(comp_dir):
                  if not name.endswith(".tf"):
                      continue
                  with open(os.path.join(comp_dir, name), encoding="utf-8") as fh:
                      text = fh.read()
                  for m in SOURCE_RE.finditer(text):
                      target = os.path.normpath(os.path.join(comp_dir, m.group(1)))
                      if target.startswith(TERRAFORM_DIR + os.sep):
                          dirs.add(target)
              return dirs

          if event_name == "pull_request" and base_sha:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", f"{base_sha}...HEAD"],
                  check=True, capture_output=True, text=True,
              ).stdout.splitlines()
              changed = [p for p in diff if p]
              selected = []
              for component in all_components:
                  watch = {os.path.join(TERRAFORM_DIR, component)} | sourced_dirs(component)
                  prefixes = tuple(w.rstrip("/") + "/" for w in watch)
                  if any(f.startswith(prefixes) for f in changed):
                      selected.append(component)
          else:
              # push (to master) and merge_group: no base to diff against that
              # means anything -- test every component that has tests.
              selected = list(all_components)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"all={' '.join(all_components)}\n")
              out.write(f"list={' '.join(selected)}\n")

          print(f"testable components: {all_components}")
          print(f"selected for this run ({event_name}): {selected}")
      # Lock files are gitignored in this repo (never committed), so they
      # don't exist at checkout -- generate them for every testable component
      # (not just the ones selected above) so the cache key below is stable
      # and shared across runs regardless of which subset a given PR touches.
      # `providers lock` only fetches registry metadata/checksums, not the
      # provider binaries, so this is cheap even though it runs unconditionally.
      #
      # `terraform get` first: a component that sources a local module (e.g.
      # kms sourcing ../_library/...) makes `providers lock` fail outright
      # with "Module not installed" otherwise -- it needs the module tree on
      # disk to see every required_providers block, not just the root's.
      #
      # mkdir the plugin cache dir here too: `providers lock` only warns (and
      # keeps going) when TF_PLUGIN_CACHE_DIR doesn't exist, but the actual
      # `terraform init` in the test script below would hard-fail on it.
      - name: Generate lock files for the plugin cache key
        env:
          ALL_COMPONENTS: ${{ steps.components.outputs.all }}
        run: |
          set -eu
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for component in $ALL_COMPONENTS; do
            dir="components/terraform/$component"
            terraform -chdir="$dir" get >/dev/null
            terraform -chdir="$dir" providers lock -platform=linux_amd64
          done
      - name: Restore/save the Terraform provider plugin cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tfplugins-${{ runner.os }}-${{ hashFiles('components/terraform/*/.terraform.lock.hcl') }}
          restore-keys: |
            tfplugins-${{ runner.os }}-
      - name: Run terraform test
        if: steps.components.outputs.list != ''
        env:
          COMPONENTS: ${{ steps.components.outputs.list }}
        # $COMPONENTS is deliberately unquoted: it is a space-separated list of
        # component directory names (never contains spaces or glob metachars)
        # and terraform-test.sh takes each one as its own positional argument.
        run: |
          # shellcheck disable=SC2086
          workflows/scripts/common/terraform-test.sh $COMPONENTS
      - name: No affected component tests
        if: steps.components.outputs.list == ''
        run: echo "No component under components/terraform/ with a tests/ directory was affected by this change."

  affected:
    name: Affected components
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same "dubious ownership" cause as the plan-sweep and security-scan jobs
      # above: the workspace is owned by the runner's user, the container runs
      # as root, and checkout's own safe.directory entry doesn't reach later
      # steps. `atmos describe affected` shells out to `git worktree add` to
      # check out the base ref for diffing, and that failed here with
      # "failed to create git worktree: exit status 128" without this.
      - name: Allow git operations in the container's workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # describe affected also parses the base branch. When the base cannot be
      # parsed (e.g. pre-migration stacks invalid for this Atmos version), plan
      # every enabled, non-abstract instance instead of failing the PR.
      #
      # Without --base, `atmos describe affected` diffs against the repo's
      # default branch. That is wrong for a stacked PR (base = a feature
      # branch, not master): pass the PR's actual base commit so the affected
      # set is computed against what the PR will actually merge into. This
      # context is only present on pull_request events; merge_group keeps the
      # previous (default-branch) behaviour, which is already correct there.
      # (--sha is a deprecated alias for --base as of Atmos 1.229.0.)
      - id: affected
        shell: python3 {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          import json, os, subprocess

          out_file = os.environ["GITHUB_OUTPUT"]
          cmd = ["atmos", "describe", "affected", "--format=matrix", "--include-dependents",
                 "--process-functions=false", "--output-file", "affected.out"]
          base_sha = os.environ.get("BASE_SHA")
          if base_sha:
              cmd += ["--base", base_sha]
          affected = subprocess.run(cmd)
          if affected.returncode == 0:
              with open("affected.out") as src, open(out_file, "a") as out:
                  out.write(src.read())
              raise SystemExit(0)

          print("::warning title=describe affected failed::Falling back to planning every "
                "enabled, non-abstract component instance (see the error above).")
          stacks = json.loads(subprocess.check_output(
              ["atmos", "describe", "stacks", "--process-functions=false",
               "--format", "json", "--sections", "metadata"]))
          include = []
          for stack, config in sorted(stacks.items()):
              components = (config.get("components") or {}).get("terraform") or {}
              for component, spec in sorted(components.items()):
                  metadata = (spec or {}).get("metadata") or {}
                  if metadata.get("type") == "abstract" or metadata.get("enabled") is False:
                      continue
                  include.append({"stack": stack, "component": component})
          with open(out_file, "a") as out:
              out.write(f"matrix={json.dumps({'include': include})}\n")
          print(f"{len(include)} instances")

  plan:
    name: Plan ${{ matrix.component }} (${{ matrix.stack }})
    needs: affected
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' && needs.affected.outputs.matrix != '' && fromJson(needs.affected.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.affected.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Plan
        id: plan
        env:
          COMPONENT: ${{ matrix.component }}
          STACK: ${{ matrix.stack }}
        run: atmos terraform plan "$COMPONENT" -s "$STACK"
      - name: Comment plan summary on the PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.summary != ''
        shell: python3 {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          COMPONENT: ${{ matrix.component }}
          STACK: ${{ matrix.stack }}
        run: |
          import json, os, urllib.request

          api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
          marker = f"<!-- atmos-plan:{os.environ['COMPONENT']}:{os.environ['STACK']} -->"
          body = f"{marker}\n{os.environ['SUMMARY']}"

          def call(method, url, data=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(data).encode() if data else None,
                                           headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                                                    "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          comments_url = f"{api}/issues/{os.environ['PR_NUMBER']}/comments"
          existing, page = None, 1
          while existing is None:
              batch = call("GET", f"{comments_url}?per_page=100&page={page}")
              existing = next((c for c in batch if c["body"].startswith(marker)), None)
              if len(batch) < 100:
                  break
              page += 1
          if existing:
              call("PATCH", f"{api}/issues/comments/{existing['id']}", {"body": body})
          else:
              call("POST", comments_url, {"body": body})

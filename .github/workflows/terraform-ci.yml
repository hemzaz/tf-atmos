# Pull request / merge queue checks with Atmos Native CI.
# Required configuration:
#   vars.ATMOS_VERSION       Atmos container tag (defaults to 1.229.0)
#   vars.AWS_REGION          region for OIDC credentials (defaults to eu-west-2)
#   vars.AWS_PLAN_ROLE_ARN   read-only IAM role trusted for this repo's GitHub OIDC tokens
# Terraform and scanners are installed by the Atmos toolchain (dependencies.tools).
name: Terraform CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - atmos.yaml
      - components/**
      - stacks/**
      - workflows/**
      - .github/workflows/terraform-ci.yml
  merge_group:

permissions: {}

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint (fmt, yamllint, tflint, trivy)
        run: atmos workflow lint -f lint
      - name: Validate config, stacks and root modules
        run: atmos workflow validate-all -f validate-enhanced

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy + Checkov (SARIF)
        run: atmos workflow security-scan -f lint
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: reports

  affected:
    name: Affected components
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: affected
        run: >-
          atmos describe affected --format=matrix --include-dependents
          --process-functions=false --output-file "$GITHUB_OUTPUT"

  plan:
    name: Plan ${{ matrix.component }} (${{ matrix.stack }})
    needs: affected
    if: ${{ needs.affected.outputs.matrix != '' && fromJson(needs.affected.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
      id-token: write
      statuses: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.affected.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Plan
        env:
          COMPONENT: ${{ matrix.component }}
          STACK: ${{ matrix.stack }}
        run: atmos terraform plan "$COMPONENT" -s "$STACK"

# Nightly security scan of the Terraform code (Trivy + Checkov via the report-only
# `security-scan-report` Atmos workflow, tools pinned in workflows/lint.yaml).
# Findings never fail this job; the PR gate (`security-scan`) fails on HIGH/CRITICAL.
# Results are published to GitHub code scanning.
name: Security scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Trivy & Checkov
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION || '1.229.0' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workspace is owned by the runner's user and the container runs as
      # root, so upload-sarif's internal `git rev-parse` (for the commit oid
      # and ref) hits "dubious ownership" without this -- same cause as the
      # plan-sweep job in terraform-ci.yml.
      - name: Scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          atmos workflow security-scan-report -f lint
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 30

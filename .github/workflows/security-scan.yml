# Nightly security scan of the Terraform code (Trivy + Checkov via the report-only
# `security-scan-report` Atmos workflow, tools pinned in workflows/lint.yaml).
# Findings never fail this job; the PR gate (`security-scan`) fails on HIGH/CRITICAL.
# Results are published to GitHub code scanning.
name: Security scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Trivy & Checkov
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.229.0@sha256:9777fffcaf0ac3f0ef96ef584b9d7a4f8b9ac3640950149d525d30c9874a556d
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workspace is owned by the runner's user and the container runs as
      # root, so upload-sarif's internal `git rev-parse` (for the commit oid
      # and ref) hits "dubious ownership" without this -- same cause as the
      # plan-sweep job in terraform-ci.yml.
      - name: Scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          atmos workflow security-scan-report -f lint
      # security-scan-report has already dropped the inline-skipped
      # (`suppressions`) results. Upload only when a scan wrote SARIF: when
      # the scan step dies first, upload-sarif would only add a second,
      # misleading failure ("No SARIF files found").
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('reports/*.sarif') != ''
        with:
          sarif_file: reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 30
